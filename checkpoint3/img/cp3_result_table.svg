<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 138" width="100%" role="img" aria-label="A table of three tests on one liquid and the result of each" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="320" height="138" fill="#ffffff"/><rect x="58" y="10" width="204" height="28" fill="#f1f1f1" stroke="#222"/><text x="122.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">test</text><text x="224.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">result</text><rect x="58" y="38" width="204" height="28" fill="#ffffff" stroke="#222"/><text x="122.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper</text><text x="224.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><rect x="58" y="66" width="204" height="28" fill="#ffffff" stroke="#222"/><text x="122.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">red litmus paper</text><text x="224.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><rect x="58" y="94" width="204" height="28" fill="#ffffff" stroke="#222"/><text x="122.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH meter</text><text x="224.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">reads 4</text><line x1="186" y1="10" x2="186" y2="122" stroke="#222"/><!--blind: A table. Header: test | result. Row: blue litmus paper | turns red. Row: red litmus paper | stays red. Row: pH meter | reads 4.--></svg>