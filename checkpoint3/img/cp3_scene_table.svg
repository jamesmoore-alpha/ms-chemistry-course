<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 503 138" width="100%" role="img" aria-label="A table of three scenes and what happens between the particles in each" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="503" height="138" fill="#ffffff"/><rect x="10" y="10" width="483" height="28" fill="#f1f1f1" stroke="#222"/><text x="133.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">scene</text><text x="374.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what happens between the particles</text><rect x="10" y="38" width="483" height="28" fill="#ffffff" stroke="#222"/><text x="133.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a bead of water on wax paper</text><text x="374.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><rect x="10" y="66" width="483" height="28" fill="#ffffff" stroke="#222"/><text x="133.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water creeping up a dry plaster wall</text><text x="374.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on plaster</text><rect x="10" y="94" width="483" height="28" fill="#ffffff" stroke="#222"/><text x="133.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">orange flakes growing on a steel bolt</text><text x="374.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">iron atoms joining oxygen atoms</text><line x1="256" y1="10" x2="256" y2="122" stroke="#222"/><!--blind: A table. Header: scene | what happens between the particles. Row: a bead of water on wax paper | water on water. Row: water creeping up a dry plaster wall | water on plaster. Row: orange flakes growing on a steel bolt | iron atoms joining oxygen atoms.--></svg>