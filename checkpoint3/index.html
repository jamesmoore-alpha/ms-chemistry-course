<script id="data" type="application/json">{"topic": {"code": "CP3", "title": "Checkpoint 3 — Physical and chemical change, reactions and conservation of mass, water's pulls, acids and bases (Topics 11–14)", "blurb": ["Everything from Topics 11 to 14, in one test: physical and chemical change; chemical reactions and the law of conservation of mass; cohesion,", "adhesion and surface tension; acids, bases, pH and neutralization.", "Every question is a new case, and most of them use two topics at once: the ideas are the ones you have already used."], "lexicon": [], "terms": {}, "coined_at": {}, "intro_script": [], "summary_script": [], "intro_question": [], "summary_question": []}, "lessons": [], "practice": [], "pp100": [{"d": "easy", "atom": "MAT-064b+MAT-067", "topic": "T11", "stem": "Two clear liquids are poured together: barium chloride + sodium sulfate → barium sulfate + sodium chloride. The barium sulfate is a white solid. Which sign of a chemical change does this scene show?", "options": ["a gas forming", "a temperature change", "a solid forming", "light given out"], "key": 2, "why": "The word equation names the products, and the stem says one product is a white solid.<br>Two clear liquids met, and a solid appeared where they mixed.<br>A solid forming when two liquids meet is one of the five signs.<br>Nothing bubbled, warmed on its own or glowed.", "type": "mcq"}, {"d": "easy", "atom": "MAT-062+MAT-066", "topic": "T11", "stem": "A chemist writes a word equation only for a change in which the substances on the right are different from the substances on the left. Which of these changes can she write as a word equation?", "options": ["a puddle in a parking lot freezing over into solid ice on a cold night", "candle wax dripping down the side of the candle and hardening on the table top", "a spoon of sugar stirred into a mug of hot tea until every grain of it vanishes", "a clay pot fired in a kiln into hard pottery that water does not soften"], "key": 3, "why": "A word equation writes a chemical reaction: reactants on the left, new substances on the right.<br>The fired pot is hard and does not soften in water: properties the soft clay did not have, so a new substance formed.<br>Frozen water, hardened wax and dissolved sugar are the same substances still: no new substance, so no word equation.", "type": "mcq"}, {"d": "easy", "atom": "MAT-064+MAT-077", "topic": "T11", "stem": "A liquid is tested in four ways. Which observation is one of the five signs that a chemical change may have happened?", "options": ["A pH meter dipped into the liquid reads 9.", "The liquid turns cloudy, and grains settle out of it.", "Red litmus paper dipped into the liquid stays red.", "The liquid feels slippery between the fingers."], "key": 1, "why": "The five signs are a color change, a gas forming, a solid forming, a temperature change and light given out.<br>Grains settling out of a cloudy liquid are a solid forming.<br>A pH reading, a slippery feel and what litmus paper does are properties of the liquid, not signs of a change in it.", "type": "mcq"}, {"d": "easy", "atom": "MAT-067+MAT-081", "topic": "T12", "stem": "A base neutralizes an acid: calcium hydroxide + hydrochloric acid → calcium chloride + water. Which two substances are the reactants?", "options": ["calcium chloride and water", "hydrochloric acid and water", "calcium hydroxide and hydrochloric acid", "calcium hydroxide, water and calcium chloride"], "key": 2, "why": "A word equation writes the reactants on the left of the arrow and the products on the right.<br>Calcium hydroxide and hydrochloric acid stand on the left.<br>So they are the reactants; calcium chloride and water are the products.", "type": "mcq"}, {"d": "easy", "atom": "MAT-071+MAT-077", "topic": "T12", "fig": "cp3_crop_h2so4", "stem": "Part of the periodic table is supplied. The acid in a car battery has the formula H₂SO₄. Which elements does it contain?", "options": ["hydrogen, sulfur and oxygen", "hydrogen, silicon and oxygen", "helium, sulfur and oxygen", "hydrogen, sulfur, oxygen and four more"], "key": 0, "why": "Read each symbol and look it up: H is hydrogen, S is sulfur, O is oxygen.<br>Si would be silicon and He helium; the formula has neither.<br>The small numbers count atoms, not elements: 2 hydrogen atoms and 4 oxygen atoms, three elements in all.", "type": "mcq"}, {"d": "easy", "atom": "MAT-070+MAT-060", "topic": "T12", "stem": "Zinc reacts with hydrochloric acid: Zn + 2HCl → ZnCl₂ + H₂. How many hydrogen atoms are on each side of the arrow?", "options": ["1 atom on each side", "2 atoms on each side", "2 atoms on the left and 1 atom on the right", "4 atoms on each side"], "key": 1, "why": "On the left, 2HCl is two particles of one hydrogen atom each: 2 hydrogen atoms.<br>On the right, H₂ is one particle of two hydrogen atoms: 2 hydrogen atoms.<br>The counts match, 2 and 2.", "type": "mcq"}, {"d": "easy", "atom": "MAT-067+MAT-077", "topic": "T12", "stem": "A student wants to write a neutralization as a word equation. Which line is written correctly?", "options": ["barium chloride + water → hydrochloric acid + barium hydroxide", "hydrochloric acid + barium hydroxide = barium chloride + water", "hydrochloric acid + barium hydroxide → barium chloride + water", "hydrochloric acid → barium chloride + water + barium hydroxide"], "key": 2, "why": "A word equation writes the reactants on the left, an arrow that reads “react to make”, and the products on the right.<br>The acid and the base are the reactants; the salt and water are the products.<br>An equals sign is not an arrow, and a neutralization needs both an acid and a base on the left.", "type": "mcq"}, {"d": "easy", "atom": "MAT-076+MAT-066", "topic": "T13", "stem": "A dry cotton wick stands in a cup of water, and the water climbs a short way up the wick. Is this a chemical reaction?", "options": ["No: the water is still water, pulled onto the cotton.", "Yes: the water and the cotton joined into a new substance, wet cotton.", "No: the water evaporated into the wick and left the cup.", "Yes: a gas formed inside the wick as the water climbed."], "key": 0, "why": "In a chemical reaction atoms let go of their old partners and join new ones, so new substances form.<br>Here the water particles pull on the cotton, and that pull, adhesion, drags the water's edge up the wick.<br>Every particle is still a water particle: no new substance, so no reaction.", "type": "mcq"}, {"d": "easy", "atom": "MAT-073+MAT-063", "topic": "T13", "stem": "Which of these scenes shows cohesion?", "options": ["An iron gate left out in the rain grows orange, crumbly patches.", "Rainwater climbs up into the bottom of a paper bag lying on the ground.", "A puddle on a garden path shrinks and disappears in the afternoon sun.", "Drops of water stand as round beads on a greased baking tray."], "key": 3, "why": "Cohesion is the pull between particles of the same substance: water pulling on water.<br>The beads are water pulling itself into a rounded shape.<br>Water climbing into paper is adhesion; a gate rusting is a chemical change; a puddle disappearing is evaporation.", "type": "mcq"}, {"d": "easy", "atom": "MAT-078+MAT-067", "topic": "T14", "stem": "A neutralization is written as a word equation: potassium hydroxide + hydrochloric acid → potassium chloride + water. Which substance in it is the base?", "options": ["potassium hydroxide", "hydrochloric acid", "potassium chloride", "water"], "key": 0, "why": "A neutralization is an acid and a base reacting and using each other up.<br>Hydrochloric acid is the acid, so the other reactant is the base: potassium hydroxide.<br>Potassium chloride and water are the products the two make.", "type": "mcq"}, {"d": "easy", "atom": "MAT-081+MAT-064", "topic": "T14", "stem": "A base is stirred into an acid in a beaker on the bench. A thermometer standing in the liquid climbs from 20 °C to 24 °C, and nothing is heating the beaker. Which sign of a chemical change is this?", "options": ["a gas forming", "a solid forming", "a temperature change", "light given out"], "key": 2, "why": "The five signs are a color change, a gas forming, a solid forming, a temperature change and light given out.<br>The thermometer climbed with no heater near the beaker, so the liquid warmed on its own.<br>Warming on its own is a temperature change.<br>Nothing bubbled, no solid formed and nothing glowed.", "type": "mcq"}, {"d": "easy", "atom": "MAT-080+MAT-045", "topic": "T14", "stem": "Potassium nitrate is a salt. In chemistry, which kind of substance is a salt?", "options": ["an element", "a compound", "a mixture", "an indicator"], "key": 1, "why": "A salt is a base's metal part joined to an acid's other part: two kinds of atom joined together in a fixed pattern.<br>A substance made of two or more kinds of atom joined together in a fixed pattern is a compound.<br>An element has one kind of atom; a mixture's substances are mingled, not joined.", "type": "mcq"}, {"d": "easy", "atom": "MAT-082+MAT-067", "topic": "T14", "stem": "This word equation shows a neutralization: hydrochloric acid + sodium hydroxide → sodium chloride + water. Blue litmus paper is dipped into each of the four substances in turn. In which one does the paper turn red?", "options": ["hydrochloric acid", "sodium hydroxide", "sodium chloride solution", "water"], "key": 0, "why": "Acids turn blue litmus paper red.<br>Hydrochloric acid is the acid in this word equation.<br>Sodium hydroxide is a base, and it turns red litmus paper blue; a table-salt solution and pure water are neutral and change neither paper.", "type": "mcq"}, {"d": "medium", "atom": "MAT-062+MAT-073", "topic": "T11", "stem": "A drop of water lands on a waxed tabletop and gathers into a rounded bead. Which kind of change is this, and why?", "options": ["a chemical change, because the water took on a brand-new shape it did not have before", "a chemical change, because the wax and the water joined into a new substance", "a physical change, because the bead is still water, pulled into a rounded shape", "a physical change, because water can never change into any other substance"], "key": 2, "why": "Ask one question: did a new substance form?<br>The bead is still water: its particles pull on each other, and that pull gathers them into a rounded shape.<br>No new substance formed, so this is a physical change; a new shape alone never makes a chemical change.", "type": "mcq"}, {"d": "medium", "atom": "MAT-065+MAT-068", "topic": "T11", "fig": "cp3_pair_regroup", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Which kind of change is this, and why?", "options": ["a physical change, because the same kinds of atom are in both boxes, in the same numbers", "a physical change, because the particles only moved to new places in the box", "a chemical change, because some of the atoms were used up in the change", "a chemical change, because the atoms have new partners, so new particles formed"], "key": 3, "why": "Before, each gray circle is joined to two small dark circles, and the large open circles sit in pairs.<br>After, each gray circle is joined to two large open circles, and the small dark circles sit in pairs.<br>The same atoms have new partners: new particles, so a new substance formed. That is a chemical change.", "type": "mcq"}, {"d": "medium", "atom": "MAT-065+MAT-067", "topic": "T11", "stem": "A student writes the line ice → liquid water for an ice cube melting. Why is this line not the word equation of a chemical reaction?", "options": ["The substance on the right is the same substance as on the left, so no new substance formed.", "A word equation needs a plus sign on the left of the arrow, and this line has no plus sign anywhere.", "Water cannot be written in a word equation, because it is a liquid and not a gas.", "Melting has no arrow, because a change that happens slowly is not written this way."], "key": 0, "why": "A word equation writes a chemical reaction: the products on the right are new substances.<br>Liquid water is the same substance as ice; only the state changed.<br>No new substance formed, so melting is a physical change, and the line is not a word equation of a reaction.", "type": "mcq"}, {"d": "medium", "atom": "MAT-065b+MAT-067", "topic": "T11", "stem": "Gray zinc powder is mixed with dark, shiny iodine crystals, and a few drops of water are added: zinc + iodine → zinc iodide. The mixture gets hot, and a white powder is left, neither gray nor shiny. Which sentence justifies calling this a chemical change?", "options": ["The word zinc appears on both sides of the arrow, so the zinc is still there and nothing new can have formed.", "The white powder has properties neither the gray metal nor the dark crystals had, so a new substance formed.", "The powder cannot be turned back into gray zinc and dark crystals by cooling the dish down again.", "The mixture got hot on its own, and a mixture getting hot always means a chemical change."], "key": 1, "why": "A full answer cites what was observed and says what it shows.<br>A white powder that is neither gray nor shiny has properties the metal and the crystals did not have.<br>Different properties mean a different substance: a new substance formed, so this is a chemical change.", "type": "mcq"}, {"d": "medium", "atom": "MAT-065b+MAT-080", "topic": "T11", "stem": "Hydrochloric acid and calcium hydroxide solution, both clear liquids, are mixed in just the right amounts. The water is boiled away, and white crystals of calcium chloride are left. Which observation is the evidence that a chemical change happened?", "options": ["The water boiled away when the mixture was heated on the burner.", "The crystals cannot be turned back into the two clear liquids by adding water.", "The mixture got a little warmer as the two clear liquids were stirred together.", "The white crystals have properties that neither of the two clear liquids had."], "key": 3, "why": "Evidence is what you observed about the substance itself.<br>White crystals are a solid with properties neither clear liquid had, so a new substance formed.<br>Boiling water away is a physical change, warmth is a clue, not proof, and whether a change can be undone is not the test.", "type": "mcq"}, {"d": "medium", "atom": "MAT-064b+MAT-067", "topic": "T11", "stem": "Zinc pieces are dropped into hydrochloric acid: zinc + hydrochloric acid → zinc chloride + hydrogen. Bubbles stream off the zinc, and the beaker gets warm on its own. Which two signs appear?", "options": ["a gas forming and a temperature change", "a color change and a solid forming", "a gas forming and light given out", "a solid forming and a temperature change"], "key": 0, "why": "The telling words are bubbles and gets warm on its own.<br>Bubbles mean a gas formed: the hydrogen the word equation names.<br>Warm on its own means a temperature change.<br>Nothing changed color, no solid formed and nothing glowed.", "type": "mcq"}, {"d": "medium", "atom": "MAT-065b+MAT-067", "topic": "T11", "type": "frq", "task": "A small piece of sodium, a soft gray metal, is dropped into a dish of water: sodium + water → sodium hydroxide + hydrogen. It fizzes and skims across the surface. Afterwards, red litmus paper dipped into the water turns blue; dipped into the water before, the paper stayed red. Determine whether a physical or a chemical change happened, and support your answer.", "starter": "The water afterwards…", "model": "The water afterwards turns red litmus paper blue, which the water before did not do.<br>A liquid that turns red litmus paper blue is a base, so the dish now holds a substance it did not hold before.<br>The word equation names that new substance: sodium hydroxide.<br>The fizz is a second new substance, hydrogen, leaving as a gas.<br>New substances formed, so this is a chemical change.", "points": ["the new property: the water afterwards turns red litmus paper blue, which the water before did not", "what it shows: a new substance formed — a base, named by the word equation as sodium hydroxide (accept the hydrogen of the fizz as the new substance)", "the call: a chemical change"]}, {"d": "medium", "atom": "MAT-062+MAT-073", "topic": "T11", "type": "frq", "task": "Rain lands on a freshly oiled wooden fence and stands as round beads. Explain why the beads forming is a physical change, even though the water's shape changed.", "starter": "The beads are still…", "model": "The beads are still water.<br>Water particles pull on each other, and that pull, cohesion, draws each bead's outer particles in toward the rest.<br>So the water gathers into a rounded shape.<br>The particles are the same water particles, only pulled into a new arrangement.<br>No new substance formed, so this is a physical change.", "points": ["the beads are still water (no new substance)", "cohesion: the water particles pull each other in, so the water rounds", "a change of shape with the same particles is a physical change"]}, {"d": "medium", "atom": "MAT-069b+MAT-080", "topic": "T12", "stem": "In a lidded flask, 7.3 g of hydrochloric acid reacts with exactly 5.8 g of magnesium hydroxide: hydrochloric acid + magnesium hydroxide → magnesium chloride + water. The reaction makes 3.6 g of water. What mass of magnesium chloride, the salt, does it make?", "options": ["3.7 g", "9.5 g", "13.1 g", "16.7 g"], "key": 1, "why": "Total mass of the products = total mass of the reactants.<br>In this reaction: mass of magnesium chloride + mass of water = mass of hydrochloric acid + mass of magnesium hydroxide.<br>Make the salt the subject: 7.3 g + 5.8 g − 3.6 g.<br>7.3 + 5.8 = 13.1, and 13.1 − 3.6 = 9.5, so 9.5 g.", "type": "mcq"}, {"d": "medium", "atom": "MAT-069+MAT-081", "topic": "T12", "stem": "A beaker of an acid stands, open, on a balance zeroed with the empty beaker. A base is poured in from a small cup, and the two react to make a salt and water; nothing fizzes. Which statement about the reading is correct?", "options": ["It rises by less than the base's mass, because some of the acid is used up as the two react.", "It rises by more than the base's mass, because a salt is a solid and a solid always weighs more than the liquid it formed in.", "It falls below the acid's mass, because the acid is destroyed as it reacts with the base.", "It rises by exactly the mass of the base poured in, because the salt and the water stay in the beaker."], "key": 3, "why": "No gas forms, so nothing leaves the open beaker.<br>Every atom of the acid and of the base is still in the beaker, in the salt and the water.<br>So the reading rises by exactly the base's mass; used-up acid is not destroyed, its atoms are in the products.", "type": "mcq"}, {"d": "medium", "atom": "MAT-070+MAT-080", "topic": "T12", "stem": "A student writes a neutralization in formulas: KOH + HNO₃ → KNO₃ + H₂. Which element's count does not match on the two sides?", "options": ["hydrogen", "nitrogen", "oxygen", "potassium"], "key": 2, "why": "Count each element on each side.<br>Potassium: 1 and 1. Nitrogen: 1 and 1. Hydrogen: 1 + 1 = 2 on the left, 2 on the right.<br>Oxygen: 1 + 3 = 4 on the left, but only 3 on the right.<br>So the oxygen count does not match: the equation is written wrong.", "type": "mcq"}, {"d": "medium", "atom": "MAT-072+MAT-064", "topic": "T12", "stem": "A sprig of water weed stands in a sunlit jar of water. Bubbles rise from its leaves, and a test shows the gas is oxygen. Which statement is correct?", "options": ["The bubbles are oxygen that the plant made from carbon dioxide and water: a new substance formed, so a reaction happened.", "The bubbles are air that was dissolved in the water and is now escaping as the jar warms up in the sun, so no chemical reaction happened at all.", "The bubbles show that the water in the jar is boiling in the sun, and boiling is a physical change.", "The oxygen in the bubbles came out of the soil at the plant's roots, where it had been stored."], "key": 0, "why": "In photosynthesis a plant builds glucose from carbon dioxide and water, and oxygen is the other product.<br>The bubbles are that oxygen: a gas that was not there before.<br>A gas forming is a clue, and the test naming the gas as a product confirms a reaction happened.", "type": "mcq"}, {"d": "medium", "atom": "MAT-069b+MAT-067", "topic": "T12", "stem": "An open beaker of hydrochloric acid stands on a balance zeroed with the empty beaker. 6.5 g of zinc is dropped in: zinc + hydrochloric acid → zinc chloride + hydrogen. When the fizzing stops, the reading is 0.2 g lower than the acid plus the zinc. Which product left the beaker?", "options": ["the zinc chloride, which floated away as the fizzing went on", "0.2 g of the zinc, destroyed by the acid as it fizzed", "the hydrogen, a gas, with a mass of 0.2 g", "some of the hydrochloric acid, which boiled off in the heat"], "key": 2, "why": "The word equation names two products: zinc chloride and hydrogen.<br>Hydrogen is a gas, and the beaker is open, so it floats away.<br>The reading fell by the mass of gas that left: 0.2 g of hydrogen; no mass was destroyed.", "type": "mcq"}, {"d": "medium", "atom": "MAT-066+MAT-081", "topic": "T12", "stem": "A base is added to an acid, and a salt and water form. Why is this neutralization a chemical reaction?", "options": ["because the atoms in the acid and the base let go of their old partners and join new ones, so new substances form", "because the acid seems to disappear as the base is added to it, and a substance disappearing is what a reaction always looks like", "because the pH meter's reading changes as the base goes in, and any change in a reading means a reaction", "because two liquids are mixed together, and mixing two liquids is always a chemical reaction"], "key": 0, "why": "In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form.<br>In a neutralization the acid's parts and the base's parts swap partners: a salt and water form.<br>Mixing alone, or a changing reading, does not make a change a reaction.", "type": "mcq"}, {"d": "medium", "atom": "MAT-069+MAT-081", "topic": "T12", "stem": "A lidded flask holds an acid. A base is squirted in through a seal, the two react, and the flask is not opened. Before the base was added, the flask and everything in it read 96.0 g. What does the balance read after the reaction, with the base inside?", "options": ["less than 96.0 g, because the acid was used up in the reaction", "96.0 g, because the flask was never opened", "more than 96.0 g, because a solid salt formed inside the flask", "96.0 g plus the mass of the base that was squirted in"], "key": 3, "why": "The total mass of the products equals the total mass of the reactants.<br>The flask stayed closed, so every atom of the acid and of the base is still inside, in the salt and the water.<br>The base was added after the 96.0 g reading, so the balance reads 96.0 g plus the base's mass.", "type": "mcq"}, {"d": "medium", "atom": "MAT-068+MAT-080", "topic": "T12", "stem": "In this neutralization, hydrochloric acid + potassium hydroxide → potassium chloride + water. One water particle is two hydrogen atoms joined to one oxygen atom. Where did its two hydrogen atoms come from?", "options": ["both from the hydrochloric acid", "one from each reactant", "both from the potassium hydroxide", "neither from a reactant: they were made in the reaction"], "key": 1, "why": "The atoms in a new substance come from the substances that were there before.<br>Hydrochloric acid's hydrogen part is one hydrogen atom.<br>Potassium hydroxide's hydroxide part is one oxygen atom joined to one hydrogen atom.<br>The acid's hydrogen atom joins the base's hydroxide part, so the water holds one hydrogen atom from each reactant; no atom is made.", "type": "mcq"}, {"d": "medium", "atom": "MAT-069b+MAT-080", "topic": "T12", "type": "frq", "task": "In a lidded flask, 3.6 g of hydrochloric acid reacts with exactly 4.0 g of sodium hydroxide: hydrochloric acid + sodium hydroxide → sodium chloride + water. The reaction makes 5.8 g of sodium chloride. Calculate the mass of water made, showing the law, the law in this reaction's substances, the rearranged line, the substitution and the answer.", "starter": "Total mass of the products…", "model": "Total mass of the products = total mass of the reactants.<br>In this reaction: mass of sodium chloride + mass of water = mass of hydrochloric acid + mass of sodium hydroxide.<br>Make the water the subject: mass of water = mass of hydrochloric acid + mass of sodium hydroxide − mass of sodium chloride.<br>Substitute: mass of water = 3.6 g + 4.0 g − 5.8 g.<br>3.6 + 4.0 = 7.6, and 7.6 − 5.8 = 1.8, so the mass of water is 1.8 g.", "points": ["the law written, then written in this reaction's substances", "the water made the subject and the masses substituted", "the answer 1.8 g with its unit"]}, {"d": "medium", "atom": "MAT-070+MAT-061", "topic": "T12", "type": "frq", "task": "Methanol, a fuel used in some camping stoves, burns: 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O. Determine whether this equation obeys the law of conservation of mass, and support your answer with the count of each element on each side.", "starter": "The equation…", "model": "The equation obeys the law of conservation of mass.<br>Carbon: 2 on the left (2CH₃OH) and 2 on the right (2CO₂).<br>Hydrogen: 2 × 4 = 8 on the left and 4 × 2 = 8 on the right.<br>Oxygen: 2 + 6 = 8 on the left and 4 + 4 = 8 on the right.<br>Each kind of atom counts the same on both sides, so the equation obeys the law.", "points": ["the decision: it obeys the law", "carbon 2 and 2; hydrogen 8 and 8", "oxygen 8 and 8, so every count matches"]}, {"d": "medium", "atom": "MAT-067+MAT-080", "topic": "T12", "type": "frq", "task": "Sodium hydroxide solution, a base, is added to sulfuric acid. Two new substances form: sodium sulfate, a salt, and water. Write the word equation for this neutralization, and explain where each of the water's two parts came from.", "starter": "The word equation is…", "model": "The word equation is sodium hydroxide + sulfuric acid → sodium sulfate + water.<br>Water is made from the two leftover parts.<br>Its hydrogen part came from the sulfuric acid.<br>Its hydroxide part came from the sodium hydroxide.<br>So the water came from both reactants.", "points": ["the two reactants on the left, an arrow, the two products on the right", "the hydrogen part came from the acid", "the hydroxide part came from the base"]}, {"d": "medium", "atom": "MAT-074+MAT-076", "topic": "T13", "fig": "cp3_rod_drop", "stem": "The hatched band is a glass rod, and the light gray shape is water. Before: the tip of a dry glass rod touches the surface of the water in a dish. After: the rod is lifted, and a rounded drop hangs from its tip. Which pull holds the drop onto the glass?", "options": ["cohesion, the water pulling on water", "adhesion, the water pulling on the glass", "surface tension, the skin lifting the water", "no pull at all: the rod scooped the drop up"], "key": 1, "why": "Ask what is pulling on what.<br>The drop's water particles pull on the particles of the glass: two different substances.<br>That pull, adhesion, holds the drop onto the rod's tip; cohesion rounds the drop but does not hold it to the glass.", "type": "mcq"}, {"d": "medium", "atom": "MAT-076+MAT-066", "topic": "T13", "fig": "cp3_scene_table", "stem": "The table gives three scenes and what happens between the particles in each. Which scene is adhesion?", "options": ["the bead on the wax paper", "the water creeping up the plaster wall", "the orange flakes growing on the steel bolt", "none of the three scenes"], "key": 1, "why": "Read each row for what pulls on what.<br>Water on plaster is two different substances pulling on each other, and the water climbs: adhesion.<br>Water on water is cohesion.<br>Iron atoms joining oxygen atoms is not a pull between particles at all: it is a chemical change, rust.", "type": "mcq"}, {"d": "medium", "atom": "MAT-073+MAT-044", "topic": "T13", "stem": "One water particle is one molecule: two hydrogen atoms joined to one oxygen atom. Which statement tells cohesion apart from the joins inside one water particle?", "options": ["The joins hold the three atoms together as one particle; cohesion pulls one whole particle toward the next.", "Cohesion is the name for the join between the two hydrogen atoms and the oxygen atom inside one water particle.", "The joins inside a particle and cohesion between particles are two names for one and the same pull.", "Cohesion pulls the three atoms of one particle apart so that each can join a different particle."], "key": 0, "why": "One water particle is three atoms joined: two hydrogen atoms and one oxygen atom.<br>The joins inside it hold those atoms together as one particle.<br>Cohesion is the pull between particles of the same substance: one whole water particle pulling on the next.<br>It does not pull a particle's atoms apart.", "type": "mcq"}, {"d": "medium", "atom": "MAT-074+MAT-073", "topic": "T13", "type": "frq", "task": "A faucet is turned off, but a drop of water hangs from its metal spout for a moment before it falls. Explain what holds the drop onto the spout, and what holds the drop together as one rounded drop. Name each pull.", "starter": "The drop is held onto the spout by…", "model": "The drop is held onto the spout by the water particles pulling on the particles of the metal.<br>That pull between two different substances is adhesion.<br>The drop is held together by its water particles pulling on each other.<br>That pull between particles of the same substance is cohesion.<br>Cohesion pulls the outer particles in, so the drop is rounded.", "points": ["water pulling on the metal holds the drop to the spout: adhesion", "water pulling on water holds the drop together: cohesion", "cohesion pulls the outer particles in, so the drop is rounded"]}, {"d": "medium", "atom": "MAT-079+MAT-036", "topic": "T14", "fig": "cp3_scale_3", "stem": "The scale marks a liquid's pH. Vinegar reads pH 3 on a meter. A student stirs a lot of water into the vinegar. Which reading could the meter give now?", "options": ["pH 2", "pH 3, exactly as before", "pH 4", "pH 8"], "key": 2, "why": "Adding water spreads the same acid through more liquid, so the liquid is less acidic.<br>A less acidic liquid has a higher pH.<br>Water cannot make the liquid basic, so the pH climbs toward 7 but stays below it: pH 4 is possible, pH 8 is not.", "type": "mcq"}, {"d": "medium", "atom": "MAT-081+MAT-082", "topic": "T14", "stem": "An acid reads pH 2. A little base is stirred in, not enough to use up all the acid. Blue litmus paper is then dipped into the liquid. What does the paper do?", "options": ["It stays blue, because the base that went in has made the liquid neutral.", "It turns blue, then red, as the two react on the paper.", "It turns white, because the base bleaches the dye out of it.", "It turns red, because acid is left and the liquid is still acidic."], "key": 3, "why": "A little base uses up a little of the acid, but acid is left.<br>The liquid is still acidic: its pH has climbed but is still below 7.<br>Acids turn blue litmus paper red, so the paper turns red.", "type": "mcq"}, {"d": "medium", "atom": "MAT-079+MAT-035", "topic": "T14", "stem": "Two glasses of lemonade are made with the same water. Glass P has one squeezed lemon in it; glass Q has three squeezed lemons in the same amount of water. A pH meter is dipped into each. Which statement is correct?", "options": ["Glass P's reading is the lower one, because less lemon juice in the same water makes the liquid more acidic.", "Glass Q's reading is the lower one, because more lemon juice in the same water makes the liquid more acidic.", "The two readings are the same, because both glasses hold lemon juice and water.", "Glass Q reads exactly 7, because three lemons are enough to make the liquid neutral."], "key": 1, "why": "Lemon juice is an acid.<br>Glass Q holds three times the lemon juice in the same amount of water, so its liquid is more acidic.<br>The lower the pH, the more acidic the liquid is, so glass Q's reading is the lower one.", "type": "mcq"}, {"d": "medium", "atom": "MAT-080+MAT-047", "topic": "T14", "stem": "A base is added to an acid until the meter reads exactly 7. The beaker now holds the salt that formed, dissolved in the water. Which category is the liquid in the beaker?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 2, "why": "The beaker holds two substances, the salt and water, mingled, not joined: a mixture.<br>The salt is dissolved, so its particles are spread evenly through the water and every sip is alike.<br>A mixture that is the same all the way through is a homogeneous mixture.", "type": "mcq"}, {"d": "medium", "atom": "MAT-081+MAT-039", "topic": "T14", "stem": "Two identical tablets of a solid base are dropped into two identical beakers of the same acid, both at pH 2. One tablet is whole; the other has been crushed to a powder. Which beaker reaches pH 7 first, and why?", "options": ["the beaker with the powder, because more of the base touches the acid at once", "the beaker with the whole tablet, because a whole tablet holds more of the base", "both beakers at the same time, because the two tablets hold the same mass of base", "neither beaker ever does, because a tablet cannot change a liquid's pH"], "key": 0, "why": "The base reacts with the acid where the two touch.<br>The powder has far more surface touching the acid than the whole tablet, so it uses up the acid faster.<br>Both tablets hold the same mass of base, so both beakers reach 7 in the end; the powder gets there first.", "type": "mcq"}, {"d": "medium", "atom": "MAT-080+MAT-069b", "topic": "T14", "type": "frq", "task": "In a lidded flask, 6.3 g of nitric acid reacts with exactly 5.6 g of potassium hydroxide: nitric acid + potassium hydroxide → potassium nitrate + water. The reaction makes 1.8 g of water. Calculate the mass of potassium nitrate, the salt, that forms, showing each step.", "starter": "Total mass of the products…", "model": "Total mass of the products = total mass of the reactants.<br>In this reaction: mass of potassium nitrate + mass of water = mass of nitric acid + mass of potassium hydroxide.<br>Make the salt the subject: mass of potassium nitrate = mass of nitric acid + mass of potassium hydroxide − mass of water.<br>Substitute: mass of potassium nitrate = 6.3 g + 5.6 g − 1.8 g.<br>6.3 + 5.6 = 11.9, and 11.9 − 1.8 = 10.1, so the salt's mass is 10.1 g.", "points": ["the law written, then written in this reaction's substances", "the salt made the subject and the masses substituted", "the answer 10.1 g with its unit"]}, {"d": "medium", "atom": "MAT-082+MAT-065b", "topic": "T14", "type": "frq", "fig": "cp3_result_table", "task": "An unlabeled liquid is tested three ways, and the table gives the results. Determine whether the liquid is an acid, a base or neutral, and justify your answer.", "starter": "Blue litmus paper…", "model": "Blue litmus paper turned red in the liquid, red litmus paper stayed red, and the meter read 4.<br>Blue litmus turning red is an acid's mark, and a pH below 7 means acid, so both clues show the liquid is acidic.<br>So the liquid is an acid.", "points": ["the observations: blue litmus turned red, red litmus stayed red, pH 4", "what they show: both clues point to an acid (blue litmus red; pH below 7)", "the decision: an acid"]}, {"d": "hard", "atom": "MAT-065+MAT-069", "topic": "T11", "stem": "A zinc strip stands in a blue liquid in a lidded jar. Overnight the strip is coated red-brown and the liquid turns colorless; a balance reads 184.0 g before and after. Zofia says: \"Same reading, so no new substance formed.\" Which statement is correct?", "options": ["Zofia is correct: a chemical change always changes the reading, so a steady reading means a physical change.", "The reading stays the same in every change in a lidded jar; the red-brown coat, which neither the zinc nor the liquid was, shows a new substance formed.", "Zofia is correct: the red-brown coat was in the blue liquid all along and settled onto the strip, because nothing was added to the jar.", "The reading should have risen when the coat grew on the strip, so the balance must be broken, and the jar should be weighed again on a different balance."], "key": 1, "why": "In a lidded jar every atom stays, so the total mass is kept in a physical change and in a chemical change alike.<br>The reading cannot tell them apart.<br>The test is whether a new substance formed: a red-brown coat appeared that neither the zinc nor the blue liquid was.<br>So a new substance formed, and Zofia is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-065b+MAT-070", "topic": "T11", "stem": "Natural gas burns on a stove: CH₄ + 2O₂ → CO₂ + 2H₂O. Leif writes: \"It is a chemical change, because carbon dioxide and water have properties methane does not have.\" Astrid writes: \"It is a chemical change, because each kind of atom counts the same on both sides.\" Which statement is correct?", "options": ["Astrid's answer is the better one: matching atom counts are the proof that a new substance formed, and properties are only clues.", "Both answers are full answers that earn full credit, because each of them cites something the equation shows.", "Leif cites the new substances' properties, the evidence the test asks for; Astrid's matching counts show only that mass is kept.", "Neither is correct, because burning natural gas is a physical change: the gas only turns into other gases."], "key": 2, "why": "The test for a chemical change is whether a new substance formed, and the evidence is that substance's properties.<br>Leif cites those.<br>Matching atom counts hold in every reaction and show that mass is kept, not that a change is chemical.<br>So Leif's line is the justification.", "type": "mcq"}, {"d": "hard", "atom": "MAT-063+MAT-064", "topic": "T11", "stem": "A few drops of a clear liquid base are stirred into lemon juice in a glass. The mixture stays clear, does not fizz and does not warm up, but a pH meter climbs from 2 to 6. Idun says: \"Nothing happened: none of the five signs appeared.\" Which statement is correct?", "options": ["Idun is correct: without one of the five signs, no chemical change can have happened in the glass.", "Idun is correct: a pH reading is not one of the five signs, so a change in it tells you nothing about what happened in the liquid.", "Idun is not correct, because a pH change is the sixth sign of a chemical change, and it appeared here.", "The base used up some of the acid, making new substances; the signs are clues you may or may not see, not the test."], "key": 3, "why": "The five signs are clues, not proof, and a chemical change can happen with none of them showing.<br>The base reacted with the acid and used some of it up, so the liquid is less acidic and the pH climbed.<br>New substances formed, a salt and water, so a chemical change happened and Idun is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-065+MAT-069", "topic": "T11", "type": "frq", "task": "A lidded jar on a balance holds a slice of raw potato and a small open cup of brown iodine solution, and it reads 262.0 g. The jar is tilted so a few drops run onto the potato. A blue-black patch spreads where the drops land, and the reading stays at 262.0 g. Ronja says: \"The steady reading does not tell us whether the change is physical or chemical; only the blue-black patch, a new substance, does.\" Evaluate Ronja's claim.", "starter": "Ronja is…", "model": "Ronja is correct.<br>In a lidded jar every atom stays inside, so the total mass is kept in a chemical change and in a physical change alike.<br>The reading cannot separate the two kinds of change.<br>The test is whether a new substance formed, and the blue-black patch is a color that neither the brown drops nor the pale potato had.<br>So the patch, not the reading, shows a chemical change.", "points": ["the verdict: Ronja is correct", "mass is kept in every change in a lidded jar, so the reading cannot decide", "the evidence is the new substance: the blue-black patch has a color neither the drops nor the potato had, so the change is chemical"]}, {"d": "hard", "atom": "MAT-066+MAT-073", "topic": "T12", "stem": "Two drops of water on a window slide until they touch and run together into one drop. Tarek says: \"The drops joined into one, so their particles joined: a chemical reaction.\" Which statement is correct?", "options": ["Tarek is correct: whenever two separate things become one single thing, a chemical reaction has happened between them, whatever they are made of.", "The water particles pull on each other and gather into one drop, but no atom changed partners, so this is not a reaction.", "Tarek is correct: the water particles joined into bigger particles, which is what a reaction does.", "It is a reaction, because the glass of the window joined with the water as the drops ran together."], "key": 1, "why": "In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form.<br>When the drops touch, the particles of one drop pull on the particles of the other, and the water gathers into one drop.<br>Every particle is still a water particle, so no new substance formed and Tarek is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-068+MAT-081", "topic": "T12", "stem": "An acid and a base react in an open beaker until the meter reads 7, and the reading on the balance is the acid's mass plus the base's mass. Hilde says: \"The acid and the base cancelled each other out and were destroyed, and only water is left.\" Which statement is correct?", "options": ["Hilde is correct: neutral means the acid and the base are gone, so only water remains in the beaker.", "Hilde is correct about the acid but not the base: the base is still there, unchanged, dissolved in the water.", "The acid and the base were both destroyed, but the water they made has exactly the same mass as they did, so the reading did not change.", "No atom was destroyed: every atom of the acid and the base is in the salt and the water, so the reading is the two masses added."], "key": 3, "why": "The atoms in a new substance come from the substances that were there before.<br>The acid's parts and the base's parts swapped partners to make a salt and water.<br>Every atom is still in the beaker, so the reading is the two masses added, and Hilde is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-069b+MAT-080", "topic": "T12", "stem": "12 g of an acid reacts with exactly 8 g of a base in a lidded flask. Kwesi says: \"The flask holds 20 g of salt and water now, but that total cannot tell me how much is salt.\" Which statement is correct?", "options": ["Kwesi is correct: the law fixes the products' total mass, not how the 20 g is shared between the salt and the water.", "Kwesi is not correct: the salt's atoms all came from the acid, so the salt's mass is 12 g and the water's is 8 g.", "Kwesi is not correct: two products formed, so each has half of the total, 10 g of salt and 10 g of water.", "Kwesi is not correct: the total is less than 20 g, because water is lighter than an acid and some mass is lost making it."], "key": 0, "why": "Total mass of the products = total mass of the reactants, so the salt and the water have a mass of 12 g + 8 g = 20 g.<br>The law fixes that total and nothing else.<br>Both reactants give atoms to the salt and to the water, so the salt's mass is not the acid's mass.<br>So Kwesi is correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-068+MAT-065b", "topic": "T12", "stem": "An iron horseshoe is left on an open shelf in a damp shed. After a month it is orange and crumbly at the edges, and it has gained 0.4 g. Sunniva says: \"Gaining mass proves that a chemical change happened.\" Which statement is correct?", "options": ["Sunniva is correct: only a chemical change can add mass to an object that nobody has touched for a month.", "Sunniva is correct: the iron atoms themselves grew heavier as they rusted, and heavier atoms mean a new substance.", "A dry sponge gains mass by soaking up water with no new substance, so the gain alone is not proof; the orange, crumbly edges are the evidence.", "Sunniva is not correct: rusting takes mass away from an object, so the balance must be wrong and the horseshoe should be weighed again on another balance."], "key": 2, "why": "A gain in mass means atoms from outside joined the object; here oxygen atoms from the air joined the iron.<br>But a sponge soaking up water gains mass with no new substance formed.<br>So the gain is a clue, not proof.<br>The orange, crumbly edges have properties iron does not have: that is the evidence, and Sunniva is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-068+MAT-081", "topic": "T12", "type": "frq", "task": "Barium hydroxide solution, a base, is added to hydrochloric acid in a lidded jar on a balance: barium hydroxide + hydrochloric acid → barium chloride + water. Before the reaction every barium atom in the jar is in the base, and the jar reads 320.0 g. After the reaction it still reads 320.0 g. Determine where the barium atoms are after the reaction and whether their number changed, and support your answer.", "starter": "After the reaction the barium atoms…", "model": "After the reaction the barium atoms are all in the barium chloride, and there are as many as before.<br>In a reaction atoms are rearranged, never made or lost, so the number of barium atoms cannot change.<br>Barium chloride is the only product whose name holds barium, so every barium atom is in it.<br>Each atom keeps its own mass and the lid keeps every atom in the jar, so the reading stays at 320.0 g.", "points": ["the number of barium atoms is unchanged: none made, none lost", "all of them are in the barium chloride, the one product whose name holds barium", "each atom keeps its mass and none leaves the lidded jar, so the reading is unchanged"]}, {"d": "hard", "atom": "MAT-073+MAT-077", "topic": "T13", "stem": "A drop of vinegar lands on a waxed lid and gathers into a round bead, just as a drop of water does. Hanna says: \"Vinegar's particles pull on each other too, so cohesion rounds this drop; cohesion is not only water's.\" Which statement is correct?", "options": ["Hanna is not correct: only water has cohesion, so the vinegar bead must be held round by the wax under it.", "Hanna is not correct: an acid's particles push each other apart, so a vinegar drop should spread out flat.", "Hanna is correct: cohesion is the pull between particles of the same substance, whatever the substance is.", "Hanna is not correct: the drop rounds because vinegar is denser than the air around it, not because of any pull."], "key": 2, "why": "The pull between particles of the same substance is called cohesion.<br>The rule names no one substance: vinegar's particles pull on each other as water's do.<br>That pull draws the drop's outer particles in, so the drop rounds, and Hanna is correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-075+MAT-074", "topic": "T13", "stem": "A dry steel pin lowered gently onto still water rests on top. The same pin is dipped in water so it is wet all over, then lowered just as gently: it sinks. The film of water on the pin weighs almost nothing. Why does the wet pin sink?", "options": ["The wet pin is heavier than the dry pin was, so it breaks the skin, and steel that is under the skin sinks.", "The wet pin is denser than the dry pin, and a denser object always goes under.", "The film of water on the pin melts the skin where the pin touches the surface.", "Water pulls on the wet steel, so it climbs onto the pin and closes over it instead of holding it up."], "key": 3, "why": "The dry pin dips the surface skin without breaking it, so the skin holds it up.<br>Water pulls on the wet steel: adhesion.<br>So the water climbs up onto the wet pin and closes over it, and the skin no longer holds it.<br>Steel is denser than water, so the pin sinks.", "type": "mcq"}, {"d": "hard", "atom": "MAT-076+MAT-065", "topic": "T13", "stem": "A drop of lemon juice dries on a polished marble step and leaves a dull, rough patch. A student says: \"The juice pulled on the marble, adhesion, and that pull roughened the surface.\" Which statement is correct?", "options": ["The dull, rough patch has properties the polished marble did not have, so a new substance formed: a chemical change, not a pull.", "The student is correct: adhesion between a liquid and a stone is strong enough to roughen the polished stone as the liquid dries away.", "It is cohesion: the juice pulled itself together as it dried and tore the marble's surface away with it.", "It is surface tension: the drop's skin scraped across the marble as the drop shrank and dried."], "key": 0, "why": "Adhesion is a liquid's particles pulling on a different substance, and a pull leaves that substance itself unchanged.<br>The patch is dull and rough where the marble was smooth and shiny: properties the marble did not have.<br>New properties mean a new substance formed, so this is a chemical change: the juice reacted with the marble.", "type": "mcq"}, {"d": "hard", "atom": "MAT-074+MAT-065", "topic": "T13", "type": "frq", "task": "A strip of blue cotton cloth hangs with its end in a bowl of water. Two things happen: the water climbs a short way up the cloth, and a hot iron left too long on the dry part leaves a brown, brittle patch. Determine which of the two changes is a chemical change, and support your answer.", "starter": "The change that is chemical is…", "model": "The change that is chemical is the brown patch forming.<br>The patch is brown and brittle where the cloth was blue and soft: properties the cloth did not have, so a new substance formed.<br>The climb is not a chemical change: the water pulls on the cotton, and that pull, adhesion, drags the water's edge up the cloth.<br>The water is still water and the cotton is still cotton, so no new substance formed there.", "points": ["the decision: the scorched patch is the chemical change", "its evidence: new properties (brown, brittle where the cloth was blue and soft), so a new substance formed", "the climb is adhesion, water pulling on cotton, with no new substance"]}, {"d": "hard", "atom": "MAT-081+MAT-069", "topic": "T14", "stem": "An acid at pH 2 stands, open, on a balance zeroed with the empty beaker. 5.0 g of a base is poured in; nothing fizzes. Afterwards the meter reads 5 and the balance reads 5.0 g more. Which statement is correct?", "options": ["The reading rose by 5.0 g because none of the acid was used up at all, and that is also why the pH stayed so low, at only 5 on the meter.", "The pH climbed because the base's own high pH was added onto the acid's pH, and the reading rose because the base is heavy.", "The reading should have risen by less than 5.0 g, because acid that has been used up in a reaction loses its mass.", "The pH climbed because the base used up some of the acid; the reading rose by 5.0 g because every atom added is still in the beaker."], "key": 3, "why": "The base reacts with the acid and uses some of it up, so the liquid is less acidic and the pH climbs toward 7.<br>No gas forms, so nothing leaves the open beaker.<br>Every atom of the 5.0 g of base is still there, in the salt and the water, so the reading rises by exactly 5.0 g.", "type": "mcq"}, {"d": "hard", "atom": "MAT-080+MAT-063", "topic": "T14", "stem": "Phosphoric acid and potassium hydroxide react, and boiling the water away leaves white potassium phosphate. Adaeze says: \"The salt is a new substance, so this is a chemical change, even though every atom in it was in the acid or the base before.\" Which statement is correct?", "options": ["Adaeze is not correct: a new substance needs new atoms, and no new atom was made in the beaker.", "Adaeze is correct: the atoms joined new partners, so the salt's particles are new particles with their own properties.", "Adaeze is not correct: the salt was dissolved in the acid all along, and boiling the water away only made it show up again.", "Adaeze is not correct: boiling is a physical change, so nothing chemical happened in the beaker at all."], "key": 1, "why": "A chemical change is a change in which a new substance forms.<br>The acid's and the base's parts swapped partners, so the salt's particles are new particles, with properties neither reactant had.<br>No atom is new, but the substance is, so Adaeze is correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-081+MAT-064", "topic": "T14", "stem": "A base is added to an acid, and the meter reads 7. The liquid stayed clear and colorless the whole time. Matias says: \"No reaction happened: a reaction always changes the color of the liquid.\" Which statement is correct?", "options": ["Matias is correct: without a color change there is no chemical change, whatever a meter says.", "Matias is correct: a neutralization is only two liquids mixing, not a chemical reaction.", "Matias is not correct, because the liquid did in fact change color as the base went in: it changed from colorless to perfectly clear.", "Matias is not correct: new substances, a salt and water, formed, and a color change is only one clue that a reaction may show."], "key": 3, "why": "The five signs are clues, not proof, and a reaction can happen with none of them showing.<br>The acid's and the base's parts swapped partners, and a salt and water formed.<br>New substances formed, so a reaction happened, and Matias is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-081+MAT-082", "topic": "T14", "type": "frq", "task": "A base is added to an acid until exactly enough has gone in to use up all the acid. Ottavia says: \"If I dip blue litmus paper and red litmus paper into the liquid now, neither paper will change color.\" Evaluate Ottavia's claim.", "starter": "Ottavia is…", "model": "Ottavia is correct.<br>Exactly enough base uses up every bit of the acid, and no base is left over.<br>So the liquid is neutral, at pH 7.<br>Blue litmus turns red only in an acid, and red litmus turns blue only in a base.<br>A neutral liquid changes neither paper, so neither paper changes color.", "points": ["the verdict: Ottavia is correct", "exactly enough base leaves no acid and no base, so the liquid is neutral at pH 7", "a neutral liquid changes neither litmus paper"]}], "figs": {"cp3_pair_regroup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 194\" style=\"width:100%;max-width:600px;height:auto\" role=\"img\" aria-label=\"Two boxes of particles drawn as circles, before and after a change, an arrow between them\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"480\" height=\"194\" fill=\"#ffffff\"/><text x=\"115.0\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">before<\/text><text x=\"365.0\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">after<\/text><rect x=\"20\" y=\"30\" width=\"190\" height=\"140\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><circle cx=\"75.4\" cy=\"70.4\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"64.1\" cy=\"70.4\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"75.4\" cy=\"59.1\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"159.4\" cy=\"129.4\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"148.1\" cy=\"129.4\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"159.4\" cy=\"118.1\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"58.8\" cy=\"129.5\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"77.2\" cy=\"134.5\" r=\"10.0\" fill=\"#ffffff\ <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
