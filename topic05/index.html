r salt grains and darker sand grains side by side.", "Is the heap one kind of matter, or two?"], "forest": ["What do you call a sample with more than one kind of matter in it?", "The heap holds salt grains and sand grains, mingled but each still itself.", "A sample that contains two or more substances mingled together is called a mixture.", "The salt is still salt, and the sand is still sand.", "Stirring does not turn two substances into one."], "article": [{"t": "idea", "text": "A student pours salt into a bowl of sand and stirs."}, {"t": "idea", "text": "The bowl now holds one gray-white heap."}, {"t": "idea", "text": "The heap looks like one material."}, {"t": "idea", "text": "Under a magnifying glass, she can still see clear salt grains and darker sand grains side by side."}, {"t": "idea", "text": "Is the heap one kind of matter, or two?"}, {"t": "h", "text": "Pure substance, again"}, {"t": "idea", "text": "All matter is made of particles that are far too small to see."}, {"t": "idea", "text": "A sample that contains only one kind of matter is called a pure substance."}, {"t": "idea", "text": "Salt on its own is a pure substance: every particle is a salt particle."}, {"t": "h", "text": "Zoom in on the heap"}, {"t": "idea", "text": "Zoom in on the heap."}, {"t": "idea", "text": "Each salt grain is made of many salt particles."}, {"t": "idea", "text": "Each sand grain is made of many sand particles."}, {"t": "idea", "text": "Salt particles and sand particles sit side by side."}, {"t": "idea", "text": "The salt particles are still salt particles."}, {"t": "idea", "text": "The sand particles are still sand particles."}, {"t": "idea", "text": "The heap holds two kinds of matter."}, {"t": "fig", "key": "box_salt_sand", "cap": "Zoomed in on the heap: sand particles (filled) in sand grains, and salt particles (open) in salt grains, side by side. Two kinds of particle, each still itself."}, {"t": "h", "text": "A name for more than one kind"}, {"t": "idea", "text": "Salt is one kind of matter, and sand is another kind of matter."}, {"t": "idea", "text": "Each kind of matter is called a substance."}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a <b>mixture<\/b>."}, {"t": "idea", "text": "The heap is a mixture of salt and sand."}, {"t": "idea", "text": "Stirring does not turn two substances into one."}, {"t": "idea", "text": "Each substance keeps its own particles."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider trail mix: nuts, raisins and seeds in one bowl."}, {"t": "idea", "text": "You can see the different kinds with your eyes."}, {"t": "idea", "text": "Trail mix is a mixture."}, {"t": "idea", "text": "Now consider a glass of distilled water."}, {"t": "idea", "text": "Every particle in the glass is a water particle: one kind only."}, {"t": "idea", "text": "Distilled water is not a mixture; it is a pure substance."}, {"t": "h", "text": "A mixture you cannot see"}, {"t": "idea", "text": "Now consider the air in a room."}, {"t": "idea", "text": "Air holds several gases mingled together."}, {"t": "idea", "text": "Air is a mixture, even though you cannot see the kinds."}, {"t": "fig", "key": "mixture_cases_l02", "cap": "Three cases. The tick or cross answers one question: a mixture? Trail mix: a mixture you can see. Distilled water: one kind of particle, so not a mixture. Air: two kinds of particle drawn mingled (air holds more), so a mixture. The box shows the kinds only; in real air the particles are far apart."}, {"t": "h", "text": "Another pure substance"}, {"t": "idea", "text": "Now consider table sugar."}, {"t": "idea", "text": "Every particle in the sugar is a sugar particle."}, {"t": "idea", "text": "Table sugar is not a mixture; it is a pure substance."}, {"t": "fig", "key": "box_sugar_pure", "cap": "Table sugar zoomed in, with the verdict drawn: one kind of particle only, so not a mixture."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A sample that contains two or more substances mingled together is called a mixture. Each substance keeps its own particles. A sample with only one kind of matter is a pure substance, not a mixture."}, {"t": "idea", "text": "Back to the heap: salt particles and sand particles sit side by side."}, {"t": "idea", "text": "The heap holds two kinds of matter, so the heap is a mixture."}], "script": [{"say": "A student pours salt into a bowl of sand and stirs.", "screen": "[a bowl of sand; salt pours in; a spoon stirs]"}, {"say": "The bowl now holds one gray-white heap that looks like one material.", "screen": "[the heap; label ONE HEAP?]"}, {"say": "Under a magnifying glass, she still sees salt grains and sand grains side by side.", "screen": "[magnifying glass: clear grains and dark grains]"}, {"say": "Is the heap one kind of matter, or two?", "screen": "[question mark]"}, {"say": "Salt on its own is a pure substance: every particle is a salt particle.", "screen": "[box of filled circles labeled SALT]"}, {"say": "Zoom in on the heap: salt particles and sand particles sit side by side, each still itself.", "screen": "[sample box in clumps: filled sand particles and open salt particles, salt grains here and sand grains there]"}, {"say": "A sample that contains two or more substances mingled together is called a mixture.", "screen": "[chip: MIXTURE]"}, {"say": "Stirring does not turn two substances into one; each keeps its own particles.", "screen": "[the spoon stirs; the two kinds stay two kinds]"}, {"say": "Trail mix is nuts, raisins and seeds in one bowl: a mixture you can see.", "screen": "[bowl of trail mix; tick]"}, {"say": "Distilled water is one kind of particle only, so it is a pure substance, not a mixture.", "screen": "[box of filled circles; cross]"}, {"say": "Air holds several gases mingled together, so air is a mixture you cannot see.", "screen": "[box with filled and open circles labeled AIR; tick]"}, {"say": "Table sugar is one kind of particle only, so it is a pure substance.", "screen": "[box of filled circles labeled SUGAR; cross]"}, {"say": "So here is the rule: two or more substances mingled together make a mixture.", "screen": "[rule slide reuses the heap box and the trail mix; rule text]"}, {"say": "Back to the heap: two kinds of matter, side by side, so the heap is a mixture.", "screen": "[the heap box; verdict A MIXTURE]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A diamond: every particle in it is the same kind. Is the diamond a pure substance?", "options": ["yes", "no"], "key": 0, "fb": ["One kind of particle only, so the diamond is a pure substance.", "Every particle is the same kind, so the diamond holds one kind of matter."], "why": "A sample that contains only one kind of matter is called a pure substance.<br>Every particle in the diamond is the same kind.<br>So the diamond is a pure substance."}, {"type": "text", "tag": "term", "stem": "A sample that contains two or more substances mingled together is called a…", "accept": ["mixture", "a mixture"], "why": "A sample that contains two or more substances mingled together is called a mixture."}, {"type": "mcq", "tag": "term", "stem": "What is a mixture?", "options": ["two or more substances mingled together", "one kind of matter only", "a new substance made by stirring two substances together"], "key": 0, "fb": ["Each substance in a mixture keeps its own particles.", "One kind of matter only is a pure substance, not a mixture.", "Stirring does not make a new substance. Each substance keeps its own particles."], "why": "A sample that contains two or more substances mingled together is called a mixture.<br>Each substance keeps its own particles.<br>Stirring does not turn two substances into one."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_even_b", "stem": "Filled and open circles are two different kinds of particle. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 1, "fb": ["Filled circles and open circles are two kinds of particle.", "Two kinds of particle mingled together make a mixture."], "why": "Look at the kinds of particle in the box.<br>Filled circles and open circles are two kinds of particle, mingled.<br>Two or more substances mingled together make a mixture."}, {"type": "mcq", "tag": "fluency", "stem": "Granola: oats, nuts and dried fruit stirred together. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 1, "fb": ["Oats, nuts and dried fruit are three substances.", "Three substances mingled together make a mixture."], "why": "Granola holds oats, nuts and dried fruit.<br>Those are three substances, mingled together.<br>So granola is a mixture."}, {"type": "mcq", "tag": "fluency", "stem": "A silver spoon: every particle in it is a silver particle. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 0, "fb": ["Every particle is the same kind, so the spoon is a pure substance.", "A mixture needs two or more substances. The spoon holds one kind of particle only."], "why": "Every particle in the spoon is a silver particle.<br>The spoon holds one kind of matter only.<br>So the spoon is a pure substance, not a mixture."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_one_b", "stem": "Filled and open circles are two different kinds of particle. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 0, "fb": ["Every circle is filled, so every particle is the same kind.", "A mixture needs two kinds of particle. Every circle here is filled: one kind."], "why": "Look at the kinds of particle in the box.<br>Every circle is filled, so every particle is the same kind.<br>One kind of matter only makes a pure substance."}, {"type": "mcq", "tag": "fluency", "stem": "Vegetable soup: broth, carrots, peas and beans. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 1, "fb": ["Broth, carrots, peas and beans are four substances.", "Four substances mingled together make a mixture."], "why": "The soup holds broth, carrots, peas and beans.<br>Those are four substances, mingled together.<br>So the soup is a mixture."}, {"type": "mcq", "tag": "fluency", "stem": "Sweet tea: water particles, tea particles and sugar particles mingled. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 1, "fb": ["Water, tea and sugar particles are three kinds of particle.", "Three kinds of particle mingled together make a mixture."], "why": "Sweet tea holds water particles, tea particles and sugar particles.<br>Those are three substances, mingled together.<br>So sweet tea is a mixture."}, {"type": "mcq", "tag": "fluency", "stem": "An iron nail: every particle is an iron particle. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 0, "fb": ["Every particle is the same kind, so the nail is a pure substance.", "A mixture needs two or more substances. The nail holds one kind of particle only."], "why": "Every particle in the nail is an iron particle.<br>The nail holds one kind of matter only.<br>So the nail is a pure substance, not a mixture."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_regions_b", "stem": "Filled and open circles are two different kinds of particle. Pure substance or mixture?", "options": ["a pure substance", "a mixture"], "key": 1, "fb": ["The open circles along the top are a second kind of particle.", "Two kinds of particle in one sample make a mixture, wherever each kind sits."], "why": "Look at the kinds of particle in the box.<br>Open circles sit along the top, and filled circles fill the rest: two kinds.<br>Two substances in one sample make a mixture."}, {"type": "mcq", "tag": "misconception", "stem": "Idris stirs sesame seeds into a bowl of rice. He says: \"Now the seeds and the rice have become one new substance.\" Is Idris correct?", "options": ["yes", "no"], "key": 1, "fb": ["Stirring does not turn two substances into one. The seeds are still seeds and the rice is still rice, so the bowl holds a mixture.", "The seeds are still seeds and the rice is still rice, so the bowl holds a mixture."], "why": "Stirring does not turn two substances into one.<br>Each substance keeps its own particles: the seeds are still seeds, and the rice is still rice.<br>Two substances mingled together make a mixture, so Idris is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video zoomed in on the heap of salt and sand. What did the zoom show?", "options": ["one new kind of particle, made by stirring", "two kinds of particle, side by side"], "key": 1, "fb": ["Stirring does not turn two substances into one.", "Salt particles and sand particles sat side by side, each still itself: a mixture."], "why": "Stirring does not turn two substances into one.<br>The zoom showed salt particles and sand particles side by side.<br>Two substances mingled together make a mixture."}]}, {"id": "L03", "atom": "MAT-029", "title": "A mixture can be taken apart", "video": "definitely a video", "lesson_type": "Concept lesson (a fact with its reason): in a mixture each substance keeps its own properties, so the parts can be separated; no term coined", "check_design": "Type (c) concept understanding → one recall MCQ (L02: cereal and milk is a mixture), then the what (steel paper clips and plastic beads under a magnet: which lifts), the why (free response), the reason as an MCQ, a student-claim misconception (Amira: salt and soup became one new substance; key no), transfer ×3 (pasta and pepper through a sieve; cork and glass beads in water; which property lets a magnet pull steel pins from plastic buttons), a second claim (Chloe: the salt is still salt, so evaporating gets it back — key yes, the topic's one true named claim), and a boundary case (a magnet over aluminum tabs and rubber bands lifts neither).", "headache": ["A student spills iron filings into a tray of sand.", "Picking the filings out one by one would take all day.", "She holds a magnet just above the tray.", "The filings jump up onto the magnet, and the sand stays in the tray.", "Why could the magnet pull one part out and leave the other?"], "forest": ["Why can the parts of a mixture be separated?", "In a mixture each substance keeps its own properties.", "Iron is still magnetic in the mixture; sand is still not.", "The magnet uses that difference and lifts only the iron.", "Because each part keeps its own properties, the parts of a mixture can be separated."], "article": [{"t": "idea", "text": "A student spills iron filings into a tray of sand."}, {"t": "idea", "text": "Picking the filings out one by one would take all day."}, {"t": "idea", "text": "She holds a magnet just above the tray."}, {"t": "idea", "text": "The filings jump up onto the magnet."}, {"t": "idea", "text": "The sand stays in the tray."}, {"t": "idea", "text": "Why could the magnet pull one part out and leave the other?"}, {"t": "fig", "key": "tray_magnet_before", "cap": "The tray of sand with iron filings spilled through it, and the magnet held just above."}, {"t": "h", "text": "Mixture, again"}, {"t": "idea", "text": "All matter is made of particles that are far too small to see."}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a mixture."}, {"t": "idea", "text": "The tray holds iron filings and sand mingled together, so the tray holds a mixture."}, {"t": "idea", "text": "Some mixtures can be taken apart with a sieve, with a magnet, or by letting the water dry away."}, {"t": "h", "text": "Zoom in on the tray"}, {"t": "idea", "text": "Zoom in on the tray."}, {"t": "idea", "text": "Iron particles and sand particles sit side by side."}, {"t": "idea", "text": "The iron particles are still iron particles."}, {"t": "idea", "text": "The sand particles are still sand particles."}, {"t": "h", "text": "Each part keeps its own properties"}, {"t": "idea", "text": "Iron on its own is magnetic: a magnet pulls on it."}, {"t": "idea", "text": "Sand on its own is not magnetic: a magnet does not pull on it."}, {"t": "idea", "text": "In the mixture, the iron is still magnetic."}, {"t": "idea", "text": "In the mixture, the sand is still not magnetic."}, {"t": "idea", "text": "Being magnetic is something you can observe about iron: one of iron's properties."}, {"t": "idea", "text": "So in a mixture, each substance keeps its own properties."}, {"t": "idea", "text": "The magnet pulls on the iron and not on the sand."}, {"t": "idea", "text": "So the magnet lifts only the iron, and the sand stays behind."}, {"t": "fig", "key": "tray_magnet", "cap": "The magnet has lifted the iron filings out of the sand. The iron kept its magnetism in the mixture; the sand kept its non-magnetism."}, {"t": "h", "text": "A difference you can use"}, {"t": "idea", "text": "The magnet used the one property that differs: iron is magnetic, and sand is not."}, {"t": "idea", "text": "A property that one part has and the other part lacks lets you pull the parts apart."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider sawdust and gravel stirred into a bucket of water."}, {"t": "idea", "text": "The sawdust floats on the water."}, {"t": "idea", "text": "The gravel sinks to the bottom."}, {"t": "idea", "text": "Each part kept its own property: sawdust still floats, and gravel still sinks."}, {"t": "idea", "text": "So the two parts come apart in the water."}, {"t": "fig", "key": "sawdust_gravel", "cap": "Sawdust and gravel in a bucket of water. The sawdust floats; the gravel sinks. Each part kept its own property."}, {"t": "idea", "text": "Now consider sugar dissolved in a dish of water."}, {"t": "idea", "text": "The sugar broke into particles too small to see and spread through the water."}, {"t": "idea", "text": "The student leaves the dish in a warm room."}, {"t": "idea", "text": "The water evaporates: it turns into a gas and leaves the dish."}, {"t": "idea", "text": "The sugar does not evaporate, so the sugar stays in the dish."}, {"t": "idea", "text": "The sugar kept its own properties: it is still sugar, and it still does not evaporate."}, {"t": "fig", "key": "separation_table", "cap": "Three mixtures in one table: the property that differs between the two parts, and how the parts come apart."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a mixture each substance keeps its own properties, so the parts of a mixture can be separated. A property that one part has and the other part lacks lets you pull the parts apart."}, {"t": "idea", "text": "Back to the tray: in the mixture, the iron was still magnetic, and the sand was still not."}, {"t": "idea", "text": "So the magnet could lift the iron and leave the sand."}], "script": [{"say": "A student spills iron filings into a tray of sand.", "screen": "[a tray of sand; dark filings scatter into it]"}, {"say": "Picking the filings out one by one would take all day.", "screen": "[a hand with tweezers; a clock]"}, {"say": "She holds a magnet just above the tray.", "screen": "[a bar magnet lowers over the tray]"}, {"say": "The filings jump up onto the magnet, and the sand stays in the tray.", "screen": "[filings fly up and cling to the magnet; the sand stays]"}, {"say": "Why could the magnet pull one part out and leave the other?", "screen": "[question mark]"}, {"say": "The tray holds iron filings and sand mingled together: a mixture.", "screen": "[chip: A MIXTURE]"}, {"say": "Zoom in: iron particles and sand particles sit side by side, each still itself.", "screen": "[sample box in clumps: filled sand particles, open iron particles gathered in small clumps, each kind still itself]"}, {"say": "Iron on its own is magnetic; sand on its own is not.", "screen": "[a magnet over iron: pulls; over sand: nothing]"}, {"say": "In the mixture, the iron is still magnetic, and the sand is still not.", "screen": "[the same two tests inside the tray]"}, {"say": "So in a mixture, each substance keeps its own properties.", "screen": "[chip: EACH PART KEEPS ITS OWN PROPERTIES]"}, {"say": "The magnet pulls on the iron and not on the sand, so it lifts only the iron.", "screen": "[the filings rise to the magnet; the sand stays]"}, {"say": "Sawdust and gravel in water: the sawdust floats and the gravel sinks.", "screen": "[bucket: sawdust on top, gravel on the bottom]"}, {"say": "Sugar dissolved in water: the water evaporates from the dish, but the sugar stays.", "screen": "[dish; the water leaves as a gas; sugar grains remain]"}, {"say": "So here is the rule: each substance keeps its own properties, so the parts of a mixture can be separated.", "screen": "[rule slide reuses the tray and the magnet; rule text]"}, {"say": "Back to the tray: the iron stayed magnetic, so the magnet lifted only the iron.", "screen": "[the magnet with its filings above the tray of sand]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Breakfast cereal with milk poured over it. Mixture or pure substance?", "options": ["a mixture", "a pure substance"], "key": 0, "fb": ["Cereal and milk are two substances mingled together.", "A pure substance is one kind of matter only. Cereal and milk are two."], "why": "Cereal and milk are two substances mingled together.<br>Two or more substances mingled together make a mixture.<br>So the cereal with milk is a mixture."}, {"type": "mcq", "tag": "what", "stem": "Steel paper clips and plastic beads are shaken together in a jar. Steel is magnetic; plastic is not. What does a magnet held over the jar lift out?", "options": ["the paper clips only", "the beads only", "both the clips and the beads", "neither"], "key": 0, "fb": ["The clips are still steel, so still magnetic. The beads are still plastic, so still not.", "The beads are plastic, and plastic is not magnetic.", "Only the steel clips are magnetic. The plastic beads are not.", "The steel clips are still magnetic in the mixture, so the magnet lifts them."], "why": "In a mixture each substance keeps its own properties.<br>The paper clips are still steel, so they are still magnetic.<br>The beads are still plastic, so they are still not magnetic.<br>The magnet pulls on the clips only, so the clips lift out."}, {"type": "frq", "tag": "why", "task": "A magnet lifts steel paper clips out of a jar of plastic beads and leaves the beads behind. Steel is magnetic; plastic is not. Explain why the magnet can separate the clips from the beads.", "starter": "The magnet can separate the clips from the beads because…", "model": "The magnet can separate the clips from the beads because each substance keeps its own properties in the mixture.<br>The paper clips are still steel, so they are still magnetic.<br>The beads are still plastic, so they are still not magnetic.<br>The magnet pulls on the paper clips and not on the beads.<br>So the paper clips lift out and the beads stay behind.", "points": ["each substance keeps its own properties in the mixture", "the steel clips are still magnetic, and the plastic beads are still not", "the magnet pulls on the clips only, so the clips lift out and the beads stay"]}, {"type": "mcq", "tag": "why", "stem": "Why can the parts of a mixture be separated?", "options": ["The parts of a mixture are always different sizes.", "The parts of a mixture always have different colors from each other.", "Each substance keeps its own properties in the mixture."], "key": 2, "fb": ["Size is one property, and many mixtures have parts of one size. Each part keeps all its own properties.", "Color is only one property, and many mixtures are one color. Each part keeps all its own properties.", "A property that one part has and the other lacks lets you pull them apart."], "why": "In a mixture each substance keeps its own properties.<br>A property that one part has and the other part lacks lets you pull the parts apart.<br>So the parts of a mixture can be separated."}, {"type": "mcq", "tag": "misconception", "stem": "Amira stirs salt into a pot of soup until the salt disappears. She says: \"The salt and the soup are one new substance now, so the salt can never be taken back out.\" Is Amira correct?", "options": ["yes", "no"], "key": 1, "fb": ["Disappearing is not becoming one substance. The salt is still salt, so the soup tastes salty, and the salt can be taken back out.", "The salt is still salt: the soup tastes salty. Each substance keeps its own properties in a mixture, so the salt can be taken back out."], "why": "Stirring does not turn two substances into one.<br>The salt is still salt: the soup tastes salty.<br>Each substance keeps its own properties in a mixture, so the parts can be separated, and Amira is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "Dried pasta and ground pepper are shaken together in a sieve with small holes. Which falls through the holes?", "options": ["the pasta", "the pepper", "both the pasta and the pepper"], "key": 1, "fb": ["Pasta pieces are far bigger than the holes.", "Pepper grains are tiny, so they fall through. Pasta pieces are big, so they stay.", "Only the tiny pepper grains fit through the holes."], "why": "Each part keeps its own size in the mixture.<br>The pepper grains are tiny, so they fall through the holes.<br>The pasta pieces are big, so they stay in the sieve."}, {"type": "mcq", "tag": "transfer", "stem": "Cork pieces and glass beads are stirred into a bucket of water. Cork floats in water; glass sinks. Which floats up to the top?", "options": ["the glass beads", "both the cork and the beads", "the cork pieces"], "key": 2, "fb": ["The glass beads are still glass, so they still sink.", "Only the cork floats. The glass beads sink.", "The cork is still cork in the mixture, so it still floats."], "why": "Each part keeps its own properties in the mixture.<br>The cork pieces still float, so they rise to the top.<br>The glass beads still sink, so they drop to the bottom."}, {"type": "mcq", "tag": "transfer", "stem": "Which property lets a magnet pull steel pins out of a box of plastic buttons?", "options": ["Steel is magnetic, and plastic is not.", "Steel is shinier than plastic.", "Steel pins have more mass than buttons."], "key": 0, "fb": ["The magnet pulls on the steel and not on the plastic.", "A magnet does not pull on shine. It pulls on magnetic materials.", "A magnet does not pull on mass. It pulls on magnetic materials."], "why": "A magnet pulls on magnetic materials only.<br>Steel is magnetic, and plastic is not.<br>That difference lets the magnet lift the pins and leave the buttons."}, {"type": "mcq", "tag": "misconception", "stem": "Chloe dissolves salt in a cup of water. She says: \"The salt is still salt, so I can get it back by letting the water evaporate.\" Is Chloe correct?", "options": ["yes", "no"], "key": 0, "fb": ["Each substance keeps its own properties in a mixture. The water evaporates and the salt does not, so the salt is left in the cup.", "Dissolving did not destroy the salt. The salt is still salt, and salt does not evaporate, so it is left in the cup when the water goes."], "why": "In a mixture each substance keeps its own properties.<br>The salt is still salt, and salt does not evaporate.<br>The water evaporates and leaves the cup, so the salt is left behind, and Chloe is correct."}, {"type": "mcq", "tag": "transfer", "stem": "A magnet is held over a can of aluminum pull-tabs and rubber bands. Neither aluminum nor rubber is magnetic. Does the magnet separate the tabs from the bands?", "options": ["yes", "no"], "key": 1, "fb": ["The magnet pulls on neither part, so it lifts nothing.", "A property that both parts lack cannot pull them apart. The magnet lifts nothing."], "why": "A magnet pulls on magnetic materials only.<br>Neither aluminum nor rubber is magnetic, so the magnet pulls on neither part.<br>A property that both parts lack cannot separate them, so the magnet lifts nothing."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The magnet lifted the iron filings and left the sand. Why?", "options": ["The iron stayed magnetic; the sand did not.", "The magnet pulls on anything small enough.", "The sand was stuck to the bottom of the tray."], "key": 0, "fb": ["Each part kept its own properties: the iron was still magnetic, the sand still not.", "A magnet pulls on magnetic materials only, whatever their size.", "The sand stayed because the magnet does not pull on sand, not because it was stuck."], "why": "In a mixture each substance keeps its own properties.<br>The iron was still magnetic, and the sand was still not.<br>So the magnet pulled on the iron only."}]}, {"id": "L04", "atom": "MAT-030", "title": "Evenly mixed or not: homogeneous and heterogeneous", "video": "could do without a video", "lesson_type": "Classification lesson by example sequence (evenly mixed or not), each case a particle box or a drawn case; coins homogeneous and heterogeneous after the plain words", "check_design": "Type (a) one-step categorisation → one recall MCQ (L02: lemon squeezed into water is a mixture), the two coined terms (typed ×2, then a meaning MCQ for each), then a fluency quiz: homogeneous (evenly mixed) or heterogeneous (not evenly mixed) ×8 (three drawn boxes and five named cases: cold coffee, fruit salad, oil on vinegar, a sports drink, a chocolate chip cookie), keys ho ho he he he ho ho he, then one student-claim item (Ezra: not evenly mixed so not a real mixture; key no). 14 items.", "headache": ["A student stirs a spoon of salt into a glass of water until the salt disappears.", "She stirs a spoon of sand into a second glass of water.", "Both glasses now hold mixtures.", "The salt water looks the same everywhere in the glass.", "The sandy water has sand at the bottom and clear water on top.", "Are these two mixtures the same kind of mixture?"], "forest": ["Are all mixtures mixed the same way?", "In the salt water the salt particles are spread evenly through the water; every sip is the same.", "A mixture that is the same all the way through is called homogeneous (evenly mixed).", "In the sandy water the sand sits in one place and the water in another.", "A mixture that is different in different places is called heterogeneous (not evenly mixed)."], "article": [{"t": "idea", "text": "A student stirs a spoon of salt into a glass of water until the salt disappears."}, {"t": "idea", "text": "She stirs a spoon of sand into a second glass of water."}, {"t": "idea", "text": "Both glasses now hold mixtures."}, {"t": "idea", "text": "The salt water looks the same everywhere in the glass."}, {"t": "idea", "text": "The sandy water has sand at the bottom and clear water on top."}, {"t": "idea", "text": "Are these two mixtures the same kind of mixture?"}, {"t": "h", "text": "Mixture, again"}, {"t": "idea", "text": "All matter is made of particles that are far too small to see."}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a mixture."}, {"t": "idea", "text": "The salt water is a mixture of salt and water."}, {"t": "idea", "text": "The sandy water is a mixture of sand and water."}, {"t": "idea", "text": "Are all mixtures mixed the same way?"}, {"t": "h", "text": "Zoom in on the salt water"}, {"t": "idea", "text": "Zoom in on the salt water."}, {"t": "idea", "text": "The salt particles are spread evenly among the water particles."}, {"t": "idea", "text": "Every sip of the salt water is the same as every other sip."}, {"t": "idea", "text": "The salt water is the same all the way through."}, {"t": "h", "text": "Zoom in on the sandy water"}, {"t": "idea", "text": "Zoom in on the sandy water."}, {"t": "idea", "text": "The sand particles sit together at the bottom."}, {"t": "idea", "text": "The water particles sit above them."}, {"t": "idea", "text": "The top of the glass and the bottom of the glass hold different things."}, {"t": "idea", "text": "The sandy water is not the same all the way through."}, {"t": "fig", "key": "box_even_uneven", "cap": "The two glasses zoomed in. Left: salt particles spread evenly among the water particles, evenly mixed. Right: sand particles along the bottom and water particles above, not evenly mixed."}, {"t": "h", "text": "Two names for two kinds of mixing"}, {"t": "idea", "text": "A mixture that is the same all the way through is called <b>homogeneous<\/b>."}, {"t": "idea", "text": "Homo means the same."}, {"t": "idea", "text": "So the salt water is a homogeneous mixture: evenly mixed."}, {"t": "idea", "text": "A mixture that is different in different places is called <b>heterogeneous<\/b>."}, {"t": "idea", "text": "Hetero means different."}, {"t": "idea", "text": "So the sandy water is a heterogeneous mixture: not evenly mixed."}, {"t": "idea", "text": "Both glasses hold mixtures."}, {"t": "idea", "text": "The two words only say how evenly each mixture is mixed."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider the air in a room: several gases mingled together."}, {"t": "idea", "text": "Every breath of the air is the same as every other breath."}, {"t": "idea", "text": "Air is a homogeneous mixture: evenly mixed."}, {"t": "idea", "text": "Now consider trail mix: nuts, raisins and seeds."}, {"t": "idea", "text": "One handful has more raisins; the next handful has more nuts."}, {"t": "idea", "text": "Trail mix is a heterogeneous mixture: not evenly mixed."}, {"t": "h", "text": "A metal that is a mixture"}, {"t": "idea", "text": "Now consider brass, a metal made of copper and zinc mingled together."}, {"t": "idea", "text": "The copper particles and the zinc particles are spread evenly, so brass looks the same all the way through."}, {"t": "idea", "text": "Brass is a homogeneous mixture: evenly mixed."}, {"t": "fig", "key": "even_cases_l04", "cap": "Three more mixtures. The tick or cross answers one question: evenly mixed? Air: two kinds of particle spread evenly, homogeneous. Trail mix: each handful differs, heterogeneous. Brass: copper and zinc particles spread evenly, homogeneous. The air box shows the kinds only; in real air the particles are far apart."}, {"t": "fig", "key": "l04_table", "cap": "The five mixtures in one table, with the plain words and the term."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A mixture that is the same all the way through is called homogeneous (evenly mixed). A mixture that is different in different places is called heterogeneous (not evenly mixed). Both are mixtures."}, {"t": "idea", "text": "Back to the two glasses: the salt water is the same all the way through, so it is homogeneous."}, {"t": "idea", "text": "The sandy water has sand below and water above, so it is heterogeneous."}], "script": [{"say": "A student stirs a spoon of salt into a glass of water until the salt disappears.", "screen": "[a glass; salt stirs in and vanishes]"}, {"say": "She stirs a spoon of sand into a second glass of water.", "screen": "[a second glass; sand sinks to the bottom]"}, {"say": "Both hold mixtures, but they look different.", "screen": "[the two glasses side by side]"}, {"say": "Are these two mixtures the same kind of mixture?", "screen": "[question mark]"}, {"say": "Zoom in on the salt water: the salt particles are spread evenly among the water particles.", "screen": "[sample box: open salt particles spread evenly among filled water particles]"}, {"say": "Every sip is the same, so the salt water is the same all through.", "screen": "[three sips marked on the glass; all the same]"}, {"say": "Zoom in on the sandy water: sand particles below, water particles above.", "screen": "[sample box: open sand particles along the bottom, filled water particles above]"}, {"say": "So the sandy water is not the same all through.", "screen": "[top and bottom of the glass marked; different]"}, {"say": "A mixture that is the same all the way through is called homogeneous: homo means the same.", "screen": "[chip: HOMOGENEOUS — evenly mixed]"}, {"say": "A mixture that is different in different places is called heterogeneous: hetero means different.", "screen": "[chip: HETEROGENEOUS — not evenly mixed]"}, {"say": "Both are mixtures; the words only say how evenly each is mixed.", "screen": "[both glasses labeled MIXTURE, then the two terms beneath]"}, {"say": "Air is homogeneous: every breath is the same.", "screen": "[air box with a tick under EVENLY MIXED?]"}, {"say": "Trail mix is heterogeneous: every handful differs.", "screen": "[bowl of trail mix with a cross under EVENLY MIXED?]"}, {"say": "Brass is copper and zinc spread evenly, so brass is homogeneous.", "screen": "[brass box: two kinds spread evenly; tick]"}, {"say": "So here is the rule: the same all through, homogeneous; different in different places, heterogeneous.", "screen": "[rule slide reuses the two glass boxes; rule text]"}, {"say": "Back to the glasses: the salt water is homogeneous; the sandy water is heterogeneous.", "screen": "[the two glasses with their terms and plain words]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A lemon is squeezed into a glass of water. Is the lemon water a mixture or a pure substance?", "options": ["a mixture", "a pure substance"], "key": 0, "fb": ["Lemon juice and water are two substances mingled together.", "A pure substance is one kind of matter only. Lemon juice and water are two."], "why": "The lemon water holds lemon juice and water mingled together.<br>Two or more substances mingled together make a mixture.<br>So the lemon water is a mixture."}, {"type": "text", "tag": "term", "stem": "A mixture that is the same all the way through, evenly mixed, is called…", "accept": ["homogeneous", "homogenous"], "why": "A mixture that is the same all the way through is called homogeneous.<br>Homo means the same."}, {"type": "text", "tag": "term", "stem": "A mixture that is different in different places, not evenly mixed, is called…", "accept": ["heterogeneous", "heterogenous"], "why": "A mixture that is different in different places is called heterogeneous.<br>Hetero means different."}, {"type": "mcq", "tag": "term", "stem": "A student calls a mixture homogeneous. What does she mean?", "options": ["It is the same all the way through.", "It has settled into two separate layers.", "It is really a pure substance."], "key": 0, "fb": ["Homo means the same: the mixture is evenly mixed.", "Two layers means different in different places: heterogeneous.", "A homogeneous mixture is still a mixture, with two or more substances in it."], "why": "A mixture that is the same all the way through is called homogeneous.<br>Homo means the same.<br>So she means the mixture is evenly mixed."}, {"type": "mcq", "tag": "term", "stem": "A student calls a mixture heterogeneous. What does she mean?", "options": ["It is the same all the way through.", "It is different in different places.", "It is not a mixture at all, just one substance."], "key": 1, "fb": ["The same all the way through is homogeneous. Hetero means different.", "Hetero means different: the mixture is not evenly mixed.", "A heterogeneous mixture is still a mixture, with two or more substances in it."], "why": "A mixture that is different in different places is called heterogeneous.<br>Hetero means different.<br>So she means the mixture is not evenly mixed."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_even_c", "stem": "Filled and open circles are two different kinds of particle. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 0, "fb": ["The open circles are spread evenly among the filled ones: the same all the way through.", "The two kinds are spread evenly through the whole box, not gathered in one place."], "why": "Look at where each kind of particle sits.<br>The open circles are spread evenly among the filled circles.<br>The sample is the same all the way through, so it is homogeneous (evenly mixed)."}, {"type": "mcq", "tag": "fluency", "stem": "Sweetened cold coffee, stirred: every sip tastes the same. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 0, "fb": ["Every sip the same means the same all the way through.", "Every sip is the same, so the coffee is not different in different places."], "why": "Every sip of the coffee tastes the same.<br>So the coffee is the same all the way through.<br>A mixture that is the same all the way through is homogeneous (evenly mixed)."}, {"type": "mcq", "tag": "fluency", "stem": "A fruit salad: pieces of apple, melon and grape. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 1, "fb": ["One spoonful is mostly apple, the next mostly melon: different in different places.", "Different spoonfuls hold different fruit, so the salad is different in different places."], "why": "One spoonful of the salad is mostly apple, and the next is mostly melon.<br>So the salad is different in different places.<br>A mixture that is different in different places is heterogeneous (not evenly mixed)."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_regions_c", "stem": "Filled and open circles are two different kinds of particle. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 1, "fb": ["The open circles gather on the left side, so the left differs from the right.", "The open circles gather on the left side: different in different places."], "why": "Look at where each kind of particle sits.<br>The open circles gather on the left side, and the filled circles fill the rest.<br>The sample is different in different places, so it is heterogeneous (not evenly mixed)."}, {"type": "mcq", "tag": "fluency", "stem": "Oil poured onto vinegar: the oil floats in a layer on top. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 1, "fb": ["Oil on top and vinegar below is different in different places.", "The oil sits in one place and the vinegar in another: different in different places."], "why": "The oil sits in a layer on top, and the vinegar sits below.<br>So the sample is different in different places.<br>A mixture that is different in different places is heterogeneous (not evenly mixed)."}, {"type": "mcq", "tag": "fluency", "stem": "A sports drink: every mouthful is the same. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 0, "fb": ["Every mouthful the same means the same all the way through.", "Every mouthful is the same, so the drink is not different in different places."], "why": "Every mouthful of the drink is the same.<br>So the drink is the same all the way through.<br>A mixture that is the same all the way through is homogeneous (evenly mixed)."}, {"type": "mcq", "tag": "fluency", "fig": "sbox_even_d", "stem": "Filled and open circles are two different kinds of particle. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 0, "fb": ["The two kinds are spread evenly through the whole box: the same all the way through.", "The open circles are spread through the whole box, not gathered in one place."], "why": "Look at where each kind of particle sits.<br>The open circles are spread evenly among the filled circles.<br>The sample is the same all the way through, so it is homogeneous (evenly mixed)."}, {"type": "mcq", "tag": "fluency", "stem": "A chocolate chip cookie: chips here and there in the dough. Evenly mixed, or not?", "options": ["homogeneous (evenly mixed)", "heterogeneous (not evenly mixed)"], "key": 1, "fb": ["One bite has two chips and the next has none: different in different places.", "Chips here and there means the cookie is different in different places."], "why": "One bite of the cookie has two chips, and the next bite has none.<br>So the cookie is different in different places.<br>A mixture that is different in different places is heterogeneous (not evenly mixed)."}, {"type": "mcq", "tag": "misconception", "stem": "Ezra shakes gravel into a jar of water, and the gravel sinks to the bottom. He says: \"The gravel and the water are not evenly mixed, so this is not a real mixture.\" Is Ezra correct?", "options": ["yes", "no"], "key": 1, "fb": ["Evenly mixed is not the test for a mixture. Gravel and water are two substances in one jar, so it is a mixture: a heterogeneous one.", "Gravel and water mingled in one jar are a mixture. Not evenly mixed only means the mixture is heterogeneous."], "why": "Two or more substances in one sample make a mixture, however they are spread.<br>The gravel and the water are two substances in one jar, so the jar holds a mixture.<br>Gravel below and water above is not evenly mixed, so the mixture is heterogeneous, and Ezra is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The salt water was the same all the way through. Which word describes that mixture?", "options": ["homogeneous", "heterogeneous"], "key": 0, "fb": ["Homo means the same: the same all the way through is homogeneous.", "Hetero means different. The salt water was the same all the way through."], "why": "A mixture that is the same all the way through is called homogeneous.<br>Every sip of the salt water was the same.<br>So the salt water is homogeneous, evenly mixed."}]}, {"id": "L05", "atom": "MAT-032", "title": "Sort any sample: the decision tree", "video": "could do without a video", "lesson_type": "Procedural lesson (a two-question routine) walked on four cases; no term coined", "check_design": "Type (b) multi-step routine → one recall MCQ each for L01 (a silver ring), L02 (corn and beans) and L04 (chocolate milk), then the worked walk on the page (salt water, sandy water, the two pure cups) → three step items on a fresh case (muddy pond water: question 1; question 2; the category — a scaffolded chain, each step its own item, no step restating an earlier key word for word) → a fluency quiz of six bare sorts into three categories (two drawn boxes and four described samples) → one routine item (which question comes first). 13 items.", "headache": ["A student is handed four cups: distilled water, salt water, sandy water, and table sugar.", "She must sort each cup into one of three categories.", "She has two questions to ask about each cup.", "Which questions, and in which order?"], "forest": ["How do you sort any sample into one of three categories?", "First question: is there more than one kind of matter?", "No: it is a pure substance. Yes: it is a mixture, so ask the second question.", "Second question: is the mixture the same all the way through?", "Yes: the mixture is homogeneous. No: the mixture is heterogeneous."], "article": [{"t": "idea", "text": "A student is handed four cups: distilled water, salt water, sandy water, and table sugar."}, {"t": "idea", "text": "She must sort each cup into one of three categories."}, {"t": "idea", "text": "She has two questions to ask about each cup."}, {"t": "idea", "text": "Which questions, and in which order?"}, {"t": "h", "text": "The three categories"}, {"t": "idea", "text": "A pure substance holds one kind of matter only."}, {"t": "idea", "text": "A homogeneous mixture holds more than one kind of matter, mixed evenly."}, {"t": "idea", "text": "A heterogeneous mixture holds more than one kind of matter, not mixed evenly."}, {"t": "h", "text": "Question 1"}, {"t": "idea", "text": "Question 1: is there more than one kind of matter?"}, {"t": "idea", "text": "If the answer is no, the sample is a pure substance."}, {"t": "idea", "text": "If the answer is yes, the sample is a mixture, so ask question 2."}, {"t": "h", "text": "Question 2"}, {"t": "idea", "text": "Question 2: is the mixture the same all the way through?"}, {"t": "idea", "text": "If the answer is yes, the mixture is homogeneous (evenly mixed)."}, {"t": "idea", "text": "If the answer is no, the mixture is heterogeneous (not evenly mixed)."}, {"t": "fig", "key": "decision_tree", "cap": "The decision tree. Question 1 sorts pure substances from mixtures. Question 2 sorts the mixtures into homogeneous and heterogeneous. Each category shows its particle box."}, {"t": "h", "text": "Walk the tree: the salt water"}, {"t": "idea", "text": "Here is the cup of salt water."}, {"t": "idea", "text": "Question 1: is there more than one kind of matter?"}, {"t": "idea", "text": "Yes: the cup holds salt particles and water particles."}, {"t": "idea", "text": "So the salt water is a mixture, and question 2 comes next."}, {"t": "idea", "text": "Question 2: is the mixture the same all the way through?"}, {"t": "idea", "text": "Yes: every sip is the same."}, {"t": "idea", "text": "So the salt water is a homogeneous mixture."}, {"t": "h", "text": "Walk the tree: the sandy water"}, {"t": "idea", "text": "Here is the cup of sandy water."}, {"t": "idea", "text": "Question 1: yes, sand particles and water particles, so it is a mixture."}, {"t": "idea", "text": "Question 2: no, the sand sits below and the water above."}, {"t": "idea", "text": "So the sandy water is a heterogeneous mixture."}, {"t": "h", "text": "Walk the tree: the other two cups"}, {"t": "idea", "text": "Here is the cup of distilled water: question 1, no, every particle is a water particle."}, {"t": "idea", "text": "So the distilled water is a pure substance, and question 2 is not needed."}, {"t": "idea", "text": "Here is the cup of table sugar: question 1, no, every particle is a sugar particle."}, {"t": "idea", "text": "So the table sugar is a pure substance."}, {"t": "fig", "key": "cups_table", "cap": "The four cups sorted by the two questions. Question 1: is there more than one kind of matter? Question 2: is it the same all the way through? A no to question 1 ends the sort at pure substance; a yes sends the sample on to question 2."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To sort a sample, ask two questions in order. Question 1: is there more than one kind of matter? If no, the sample is a pure substance. If yes, it is a mixture, so ask question 2: is it the same all the way through? If yes, the mixture is homogeneous. If no, the mixture is heterogeneous."}, {"t": "idea", "text": "Back to the four cups: two questions, asked in order, sorted every cup."}, {"t": "idea", "text": "Distilled water and table sugar are pure substances; salt water is homogeneous; sandy water is heterogeneous."}], "script": [{"say": "A student is handed four cups: distilled water, salt water, sandy water, and table sugar.", "screen": "[four cups, each named]"}, {"say": "She must sort each cup into one of three categories.", "screen": "[three empty category boxes: PURE SUBSTANCE, HOMOGENEOUS MIXTURE, HETEROGENEOUS MIXTURE]"}, {"say": "She has two questions to ask: which questions, and in which order?", "screen": "[question mark]"}, {"say": "Question 1: is there more than one kind of matter?", "screen": "[the tree: question 1 box]"}, {"say": "No means a pure substance; yes means a mixture, so ask question 2.", "screen": "[arrows: NO → pure substance; YES → question 2]"}, {"say": "Question 2: is the mixture the same all the way through?", "screen": "[question 2 box]"}, {"say": "Yes means homogeneous, evenly mixed; no means heterogeneous, not evenly mixed.", "screen": "[arrows: YES → homogeneous; NO → heterogeneous; particle boxes under each]"}, {"say": "The salt water: question 1, yes, salt and water, so a mixture.", "screen": "[salt water cup moves to question 2]"}, {"say": "Question 2: yes, every sip is the same, so a homogeneous mixture.", "screen": "[cup lands in HOMOGENEOUS MIXTURE]"}, {"say": "The sandy water: question 1, yes; question 2, no, sand below and water above, so a heterogeneous mixture.", "screen": "[cup lands in HETEROGENEOUS MIXTURE]"}, {"say": "The distilled w e magnet lifts them out."], "why": "A magnet separates a mixture only when one part is magnetic and the other is not.<br>Copper is not magnetic, and wood is not magnetic.<br>The magnet pulls on neither part, so it cannot separate the wire from the beads."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-027", "stem": "Bronze is copper particles and tin particles mingled evenly. Farah says: \"Bronze looks the same all the way through, so bronze is a pure substance.\" Is Farah correct?", "options": ["yes", "no"], "key": 1, "fb": ["Looking the same all through is not the test. Bronze holds two kinds of particle, so it is a mixture: a homogeneous one.", "Bronze holds copper particles and tin particles, two kinds, so it is a mixture, evenly mixed."], "why": "A pure substance holds one kind of matter only.<br>Bronze holds copper particles and tin particles: two kinds.<br>So bronze is a mixture, evenly mixed, and Farah is not correct."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-028", "stem": "A student stirs sugar into flour until the heap looks like one white powder. Which statement is correct?", "options": ["Each substance is still itself.", "The two substances have become one new substance.", "The heap is a pure substance."], "key": 0, "fb": ["Stirring does not turn two substances into one. Each keeps its own particles.", "Stirring does not turn two substances into one. The heap is a mixture.", "Looking like one powder is not the test. Zoom in: sugar particles and flour particles are two kinds."], "why": "Stirring does not turn two substances into one.<br>Each substance keeps its own particles: sugar particles sit beside flour particles.<br>So the heap is a mixture of sugar and flour."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-027", "stem": "Which of these is a pure substance?", "options": ["salty broth", "a spoon of table salt", "a glass of lemonade", "a handful of mixed nuts"], "key": 1, "fb": ["Broth with salt in it holds several kinds of matter.", "Every part d of matter only.<br>Zoom in, and every particle is the same kind.<br>A pure substance can be a solid, a liquid or a gas, and it can be any substance, not only water."}, {"d": "easy", "atom": "MAT-027", "stem": "Which states can a pure substance be in?", "options": ["only a solid", "only a liquid", "a solid or a liquid, never a gas", "a solid, a liquid or a gas"], "key": 3, "why": "Pure means one kind of matter only; the state is not the test.<br>An ice cube, liquid distilled water and steam each hold water particles only.<br>So a pure substance can be a solid, a liquid or a gas."}, {"d": "easy", "atom": "MAT-028", "stem": "Which of these is true of every mixture?", "options": ["You can see its different parts with your eyes.", "It holds more than one kind of matter.", "It is evenly mixed.", "It is one new substance."], "key": 1, "why": "A mixture is two or more substances mingled together.<br>So every mixture holds more than one kind of matter.<br>Salt water looks like one thing, and trail mix is not evenly mixed, so seeing the parts and being evenly mixed are not true of every mixture.<br>Mingling never makes one new substance."}, {"d": "easy", "atom": "MAT-028", "stem": "Which of these makes a mixture?", "options": ["freezing a tray of water into ice cubes", "crushing one sugar cube into a heap of grains", "pouring distilled water into more distilled water", "pouring lime juice into a glass of water"], "key": 3, "why": "A mixture holds two or more substances mingled together.<br>Lime juice poured into water puts two kinds of matter in one glass, so it makes a mixture.<br>Freezing changes the water's state, but every particle is still water: one kind.<br>Crushing makes smaller pieces of the same sugar: still one kind.<br>Water poured into water is water particles only."}, {"d": "easy", "atom": "MAT-029", "stem": "A student separates a mixture of two substances completely into its parts. What does she have afterward?", "options": ["one single new substance", "the same two substances", "two brand-new substances", "one of the two substances only"], "key": 1, "why": "In a mixture each substance keeps its own particles and its own properties.<br>Separating only sorts the particles that were already there.<br>So she has the same two substances she started with; nothing is new, and nothing is used up."}, {"d": "easy", "atom": "MAT-029", "stem": "A cook stirs a pinch of salt into a pot of mashed potatoes until no grain of salt can be seen. What does the salt in the potatoes taste like?", "options": ["salty", "like potato", "a new taste, neither salt nor potato", "nothing"], "key": 0, "why": "In a mixture each substance keeps its own properties.<br>The salt grains are too small to see among the potato, but the salt is still salt.<br>So the salt still tastes salty."}, {"d": "easy", "atom": "MAT-030", "stem": "Which of these is a mixture that is not evenly mixed (heterogeneous)?", "options": ["a bar of pure silver", "a bowl of chunky salsa", "a glass of clear cranberry juice", "a mug of black coffee"], "key": 1, "why": "Heterogeneous means different in different places.<br>One spoon of chunky salsa is mostly tomato, and the next is mostly onion.<br>Every sip of the cranberry juice and of the black coffee is the same, so each is homogeneous.<br>A bar of pure silver is one kind of matter, so it is not a mixture at all."}, {"d": "easy", "atom": "MAT-030", "stem": "A student calls one mixture homogeneous and another heterogeneous. What do the two words tell you about a mixture?", "options": ["how many kinds of matter it holds", "whether one spoonful of it is the same as the next", "whether it is a solid, a liquid or a gas at room temperature", "how clean it is"], "key": 1, "why": "Both words are used only for mixtures.<br>Homogeneous means the same all the way through; heterogeneous means different in different places.<br>So the two words tell you whether one spoonful is the same as the next, not how many kinds a mixture holds, its state or how clean it is."}, {"d": "easy", "atom": "MAT-032", "stem": "A student sorts a sample and finds that it is a pure substance. Which of the two sorting questions did she need?", "options": ["question 1 only", "question 2 only", "both questions", "neither question"], "key": 0, "why": "Question 1 asks whether there is more than one kind of matter.<br>A no means a pure substance, and the sort ends there.<br>Question 2 is asked only of mixtures, so she needed question 1 only."}, {"d": "easy", "atom": "MAT-032", "fig": "pt_tree_answers", "stem": "The table gives a student's answers to the two sorting questions for four samples. Which sample is not evenly mixed (heterogeneous)?", "options": ["the platinum ring", "the sparkling grape juice", "the salad dressing", "the hot spiced cider"], "key": 2, "why": "A yes to question 1 means a mixture; question 2 asks whether it is the same all the way through.<br>Only the salad dressing has yes to question 1 and no to question 2.<br>A mixture that is not the same all the way through is heterogeneous.<br>The two drinks are homogeneous; the platinum ring is a pure substance."}, {"d": "medium", "atom": "MAT-027", "fig": "sbox_even_h", "stem": "Filled and open circles are two different kinds of particle. The sample is not a pure substance. Why?", "options": ["Its particles do not touch one another.", "Its particles are not all the same size.", "Two kinds of particle are mingled in it.", "Its particles are moving."], "key": 2, "why": "A pure substance holds one kind of particle only.<br>Filled circles and open circles are two kinds of particle.<br>Only the number of kinds matters: two kinds, so the sample is not a pure substance."}, {"d": "medium", "atom": "MAT-027", "fig": "pt_three_liquids", "stem": "Zoom in on three liquids. The table lists the kinds of particle in each one. How many of the three liquids are pure substances?", "options": ["0", "1", "2", "3"], "key": 1, "why": "A pure substance holds one kind of matter only.<br>Vegetable oil holds oil particles only, so it is a pure substance.<br>Corn syrup holds two kinds, and sparkling water holds two kinds, so each is a mixture.<br>So one of the three liquids is a pure substance."}, {"d": "medium", "atom": "MAT-029", "stem": "Salt grains and glitter are spilled together in a craft room. Salt dissolves in water; glitter does not. A student wants the glitter back. Which fact makes that possible?", "options": ["The salt still dissolves in water, and the glitter still does not.", "The glitter is still whole, hidden somewhere under the salt grains.", "Salt and glitter poured together make one pure substance.", "The salt has soaked into the glitter and made a new substance."], "key": 0, "why": "In a mixture each substance keeps its own properties.<br>The salt still dissolves in water, and the glitter still does not.<br>Stir the spill into water: the salt dissolves, the glitter stays whole, and the glitter can be picked out."}, {"d": "medium", "atom": "MAT-029", "stem": "Dried lentils and sugar are mixed in a bowl. Sugar dissolves in water; lentils do not. Sugar grains are tiny; lentils are big. Which property difference does a sieve use to separate the two?", "options": ["taste", "color", "whether each dissolves in water", "the size of the pieces"], "key": 3, "why": "A sieve lets small pieces fall through its holes and keeps big pieces back.<br>Sugar grains are tiny, and lentils are big.<br>Each part kept its own size in the mixture, so the sieve can use that difference."}, {"d": "medium", "atom": "MAT-030", "stem": "Concrete is cement, sand and small stones stirred together. A broken piece shows stones in some places and none in others. Why is concrete heterogeneous?", "options": ["It holds more than one substance mingled together.", "Different places in it hold different things.", "It is hard all the way through.", "It was stirred before it set."], "key": 1, "why": "Heterogeneous means different in different places.<br>One part of the concrete holds stones, and another part holds none.<br>Holding more than one substance makes it a mixture; the uneven spread makes it heterogeneous."}, {"d": "medium", "atom": "MAT-032", "stem": "A student pours the top half of a bottle of clear liquid into one cup and the bottom half into another. Both cups taste exactly the same. Zoom in: two kinds of particle. Which category is the liquid?", "options": ["a pure substance", "a heterogeneous mixture", "a homogeneous mixture", "two pure substances, one kind in each cup"], "key": 2, "why": "Question 1: two kinds of particle, so more than one kind of matter: yes, a mixture.<br>Question 2: the top half and the bottom half taste the same, so the liquid is the same all through: yes.<br>A mixture that is the same all the way through is homogeneous."}, {"d": "medium", "atom": "MAT-028", "stem": "A jar of pure zinc powder and a jar of pure aluminum powder are tipped together in a workshop. The heap looks like one gray powder. Zoom in on the heap. What is there?", "options": ["one kind of particle only", "zinc particles beside aluminum particles", "a new kind of particle, neither zinc nor aluminum", "zinc particles dissolved inside aluminum particles"], "key": 1, "why": "Pouring two pure substances together does not make one kind of matter.<br>Zoom in: zinc particles and aluminum particles sit side by side, each still itself.<br>Two substances mingled together make a mixture."}, {"d": "medium", "atom": "MAT-027", "stem": "A cook wipes a polished granite countertop until not a speck of dirt is left on it. Zoom in: particles of several kinds sit side by side. The countertop is not a pure substance. Why?", "options": ["It is not perfectly clean.", "Natural stone is never a pure substance.", "It holds more than one kind of matter.", "People have touched it."], "key": 2, "why": "Pure means one kind of matter only; pure does not mean clean.<br>The granite holds several kinds of particle: more than one kind of matter.<br>So the countertop is not a pure substance, however clean it is; it is a mixture."}, {"d": "medium", "atom": "MAT-027", "fig": "pt_look_kinds", "stem": "The table lists three samples, how each one looks, and the kinds of particle in it. Which sample is a pure substance?", "options": ["the pickle brine", "the candle wax", "the window cleaner", "none of the three"], "key": 1, "why": "A pure substance holds one kind of matter only, however it looks.<br>The candle wax holds wax particles only, so it is a pure substance.<br>The pickle brine and the window cleaner each hold several kinds of particle, so each is a mixture, however clear it looks."}, {"d": "medium", "atom": "MAT-028", "fig": "sbox_even_g", "stem": "Filled and open circles are two different kinds of particle. The box shows one of these four samples zoomed in. Which sample could it be?", "options": ["a bar of pure, polished tin", "a spoon of plain white sugar", "sugar stirred into lime juice", "an icicle hanging from a roof"], "key": 2, "why": "Filled and open circles are two kinds of particle, so the box shows two kinds of matter: a mixture.<br>Tin, sugar and an icicle each hold one kind of particle, so none of them fits the box.<br>Sugar stirred into lime juice holds sugar particles and the juice's own particles, so it fits."}, {"d": "medium", "atom": "MAT-028", "stem": "A cook stirs soy sauce into mayonnaise until no streaks are left. Which observation shows that the sauce is a mixture, not one new substance?", "options": ["The sauce is one color all the way through.", "The sauce is smooth, with no lumps in it.", "The sauce is much thicker than the soy sauce was on its own.", "The sauce tastes of both soy sauce and mayonnaise."], "key": 3, "why": "In a mixture each substance keeps its own particles and its own properties.<br>The sauce tastes of both, so soy sauce particles and mayonnaise particles are both still there, each still itself.<br>One color, smoothness and thickness do not tell you how many kinds of matter are in the sauce."}, {"d": "medium", "atom": "MAT-029", "stem": "A student pours cloudy water through a paper coffee filter. Fine grit stays in the filter, and clear water runs through. What does this show about the cloudy water?", "options": ["It held one kind of matter.", "It held two kinds of matter.", "The filter turned some of its water into grit.", "Its grit came off the filter paper."], "key": 1, "why": "In a mixture each substance keeps its own properties, so the parts can be separated.<br>The grit stayed in the filter and the water ran through: two parts came out.<br>Two parts can come out only if two kinds of matter were in the cloudy water, so the cloudy water was a mixture."}, {"d": "medium", "atom": "MAT-029", "fig": "pt_two_parts", "stem": "Steel wool and shredded paper are mixed in a bin. The table gives four properties of each. Which property cannot be used to separate the two?", "options": ["whether a magnet pulls on it", "whether it floats or sinks in water", "its color", "whether it dissolves in water"], "key": 3, "why": "A property that one part has and the other part lacks lets you pull the parts apart.<br>The magnet's pull, floating and color all differ between the steel wool and the paper.<br>Neither the steel wool nor the paper dissolves in water, so that property is the same for both and cannot separate them."}, {"d": "medium", "atom": "MAT-030", "stem": "A painter stirs a bucket of blue paint until it is evenly mixed (homogeneous). She dips one brush at the top of the bucket and another at the very bottom. How does the paint on the two brushes compare?", "options": ["The two brushes carry the same paint.", "The top brush carries thinner paint than the bottom brush.", "The bottom brush carries more of the color than the top brush.", "The top brush carries paint, and the bottom brush carries only water."], "key": 0, "why": "Homogeneous means the same all the way through.<br>The paint at the top of the bucket is the same as the paint at the bottom.<br>So the two brushes carry the same paint, in color and in thickness."}, {"d": "medium", "atom": "MAT-030", "stem": "A squirt of vanilla syrup sinks to the bottom of a pitcher of cold water, so the pitcher is not evenly mixed (heterogeneous). What would make the pitcher evenly mixed (homogeneous)?", "options": ["Add a second squirt of syrup to the bottom.", "Let the pitcher stand still until the syrup has sunk further.", "Pour more water in on top of the syrup.", "Stir until the syrup is spread through all the water."], "key": 3, "why": "Homogeneous means the same all the way through.<br>Stirring spreads the syrup particles through all the water, so every sip is the same.<br>More syrup at the bottom, more water on top or waiting leaves the syrup in one place, so the pitcher stays different in different places."}, {"d": "medium", "atom": "MAT-032", "stem": "The sorting rule asks question 1 (is there more than one kind of matter?) before question 2 (is it the same all the way through?). Why must question 1 come first?", "options": ["A pure substance is also the same all the way through.", "Question 2 would sort a heterogeneous mixture as a pure substance.", "Question 2 can only be asked about liquids and gases at room temperature.", "A yes to question 1 finishes the sort on its own."], "key": 0, "why": "Question 2 asks whether a sample is the same all the way through.<br>A pure substance is the same all the way through too, so a yes to question 2 alone could be a pure substance or a homogeneous mixture.<br>Question 1 first sorts out the pure substances, so question 2 is asked only of mixtures."}, {"d": "medium", "atom": "MAT-032", "stem": "A student zooms in on a sample and sees two kinds of particle, but she has not yet checked whether the sample is the same all the way through. Which category can she already rule out?", "options": ["a pure substance", "a homogeneous mixture", "a heterogeneous mixture", "none of the three yet"], "key": 0, "why": "Question 1 asks whether there is more than one kind of matter.<br>Two kinds of particle means yes, so the sample is a mixture, and a pure substance is ruled out.<br>Question 2 decides homogeneous or heterogeneous, so neither of those can be ruled out yet."}, {"d": "hard", "atom": "MAT-027", "stem": "Ruby says: \"Tap water is a pure substance, because it looks clear and comes out of one tap.\" Zoom in on tap water: water particles and a few particles of dissolved minerals are mingled. Ruby is wrong: tap water is not a pure substance. Why?", "options": ["It is not clean enough to be pure.", "It has been through metal pipes.", "It comes from a river, not a spring.", "It holds more than one kind of matter."], "key": 3, "why": "A pure substance holds one kind of matter only.<br>Tap water holds water particles and mineral particles: more than one kind.<br>Looking clear is not the test, and a few particles of a second kind still make more than one kind."}, {"d": "hard", "atom": "MAT-029", "stem": "Willow mixes steel staples into a jar of sugar. Steel on its own is magnetic. She says: \"The staples are no longer magnetic, because they are part of a mixture now.\" Which statement about the staples is correct?", "options": ["They have lost their magnetism.", "They are magnetic only once the sugar has been removed from them.", "They have made the sugar magnetic too.", "They are still magnetic."], "key": 3, "why": "In a mixture each substance keeps its own properties.<br>The staples are still steel, so they are still magnetic.<br>A magnet held over the jar would lift them out of the sugar."}, {"d": "hard", "atom": "MAT-030", "stem": "Santiago pours oil into water and shakes the bottle hard. For a moment the mixture looks the same all through. A minute later the oil sits in a layer on top. Which category is the settled bottle in?", "options": ["a heterogeneous mixture", "a homogeneous mixture", "a pure substance", "two separate pure substances, not a mixture"], "key": 0, "why": "Heterogeneous means different in different places.<br>Once settled, the top of the bottle holds oil and the bottom holds water.<br>Even while shaken, the oil sat in tiny drops among the water, so the bottle was never the same all the way through; it only looked so for a moment."}, {"d": "hard", "atom": "MAT-032", "stem": "A student sorts a clear liquid as a pure substance, because it looks the same all the way through. Zoom in: two kinds of particle are mingled evenly. Which category is the liquid?", "options": ["a pure substance", "a heterogeneous mixture", "a homogeneous mixture", "a homogeneous pure substance"], "key": 2, "why": "Question 1: two kinds of particle are more than one kind of matter, so yes: a mixture.<br>She answered no, so question 1 is where she went wrong.<br>Question 2: mingled evenly, the same all through, so yes: a homogeneous mixture."}, {"d": "hard", "atom": "MAT-027", "stem": "Tobias boils a pot of clear sap from a maple tree until most of the water has left as steam, and a thick sweet syrup is left in the pot. He says: \"The sap was a pure substance, because nothing was ever added to it.\" Tobias is wrong: the sap was a mixture. Why?", "options": ["Nothing that comes out of a living tree can be a pure substance.", "Boiling turned some of the water into syrup.", "The sap held a second kind of matter, sugar, mingled in the water.", "The sap came through a metal tap."], "key": 2, "why": "Pure means one kind of matter only, whatever was or was not added.<br>Water particles leave the pot as steam; they do not turn into a sweet syrup.<br>So the syrup was a second kind of matter mingled in the clear sap: the sap was a mixture, and Tobias is not correct."}, {"d": "hard", "atom": "MAT-027", "stem": "A stick of white chalk cannot be seen through, and every particle in it is a chalk particle. Hiro says: \"The chalk cannot be a pure substance, because pure substances are clear.\" Hiro is wrong: the chalk is a pure substance. Why?", "options": ["The chalk is clean and perfectly dry.", "Every white solid is a pure substance.", "The chalk was made in a factory.", "The chalk holds one kind of matter only."], "key": 3, "why": "Pure means one kind of matter only.<br>Pure does not mean clear to see through, and it does not mean clean.<br>Every particle in the chalk is a chalk particle: one kind of matter.<br>So the chalk is a pure substance, however white and solid it looks, and Hiro is not correct."}, {"d": "hard", "atom": "MAT-028", "stem": "Otis digs up a handful of garden soil: sand grains, bits of clay and dead leaves. He says: \"Soil is not a mixture, because nobody mixed anything into it.\" Otis is wrong: soil is a mixture. Why?", "options": ["Rain and worms did the mixing.", "Everything dug from the ground is a mixture.", "Soil holds several kinds of matter mingled together.", "Soil can be stirred with a spade."], "key": 2, "why": "A mixture is two or more substances mingled together.<br>The soil holds sand, clay and dead leaves: several kinds of matter, side by side.<br>How the kinds came together does not matter; nobody has to stir them.<br>So soil is a mixture, and Otis is not correct."}, {"d": "hard", "atom": "MAT-028", "stem": "Wren stirs a pinch of grated lime zest into a big bowl of sugar, then sifts every speck of zest back out. She says: \"The sugar was a pure substance the whole time, because the zest was only a pinch.\" What did the bowl hold while the zest was stirred in?", "options": ["a pure substance", "one new substance", "a mixture", "a pure substance with a little zest in it"], "key": 2, "why": "A mixture is two or more substances mingled together, whatever the amounts.<br>With the zest stirred in, sugar particles and zest particles sat side by side: two kinds, so a mixture.<br>Sifting sorted the particles that were already there, so the bowl now holds sugar particles only: a pure substance again.<br>So Wren is not correct."}, {"d": "hard", "atom": "MAT-029", "stem": "Soren mixes steel binder clips into a box of wooden clothespins; steel is magnetic, and wood is not. He says: \"Now a magnet will lift the clothespins too, because they are mixed in with steel.\" Which statement about the clothespins is correct?", "options": ["The magnet lifts them.", "The magnet lifts them only while they touch the steel.", "The magnet does not pull them.", "The magnet pulls them once the steel has been removed."], "key": 2, "why": "In a mixture each substance keeps its own properties.<br>The binder clips are still steel, so the magnet pulls them.<br>The clothespins are still wood, and wood is not magnetic, so the magnet does not pull them.<br>Being mixed with steel gives the wood no new property, so Soren is not correct."}, {"d": "hard", "atom": "MAT-029", "stem": "Elin tips aluminum nails and steel nails, the same size and color, into one jar; steel is magnetic, and aluminum is not. She says: \"A magnet cannot sort them, because the two kinds of nail look exactly the same.\" Which statement is correct?", "options": ["The magnet lifts the steel nails only.", "The magnet lifts both kinds of nail.", "The magnet lifts neither kind of nail.", "The magnet lifts the aluminum nails only."], "key": 0, "why": "In a mixture each substance keeps its own properties.<br>The steel nails are still steel, so they are still magnetic; the aluminum nails are still aluminum, so they are not.<br>Looking alike is not the test: the property that differs is what the magnet uses.<br>So Elin is not correct."}, {"d": "hard", "atom": "MAT-030", "stem": "A jar of yellow mustard is thick, and you cannot see through it. Nell says: \"The mustard is evenly mixed (homogeneous), because every scoop from anywhere in the jar is exactly the same.\" Nell is right. Which fact makes her reason a good one?", "options": ["One color all over is the test for homogeneous.", "Being the same all the way through is the test for homogeneous.", "Being thick is the test for homogeneous.", "Coming from one jar is the test for homogeneous."], "key": 1, "why": "Homogeneous means the same all the way through.<br>Every scoop of the mustard is the same, so the mustard is the same all the way through: homogeneous.<br>Seeing through it is not the test, and one color alone is not the test either.<br>Mustard holds several kinds of matter, so it is a mixture, and Nell is correct."}, {"d": "hard", "atom": "MAT-030", "stem": "A jar of homemade hot sauce has settled: thin red liquid on top, pepper bits at the bottom. Ximena tastes three spoonfuls, all from the top, and says: \"All three taste the same, so the sauce is evenly mixed (homogeneous).\" What is wrong with Ximena's test?", "options": ["She needed at least ten spoonfuls.", "She should have looked instead of tasting.", "She should have stirred the jar first.", "She tasted the top only, never the bottom."], "key": 3, "why": "Homogeneous means the same all the way through: every part of the jar.<br>Ximena tasted the top only, so her spoonfuls do not tell her about the bottom.<br>The bottom holds pepper bits and the top holds thin liquid, so the jar is different in different places: heterogeneous, and Ximena is not correct."}, {"d": "hard", "atom": "MAT-032", "stem": "A burning candle has a pool of melted wax on top and hard wax below; every particle in it is a wax particle. Rowan sorts the candle as not evenly mixed (heterogeneous), because it is different in different places. Which category is the candle in?", "options": ["a heterogeneous mixture", "a homogeneous mixture", "two pure substances", "a pure substance"], "key": 3, "why": "Question 1 comes first: is there more than one kind of matter?<br>Melted wax and hard wax are both wax, one kind of matter in two states, so the answer is no.<br>No to question 1 means a pure substance, and question 2 is asked only of mixtures.<br>So Rowan is not correct."}, {"d": "hard", "atom": "MAT-032", "fig": "sbox_pair_bottles", "stem": "Filled and open circles are two different kinds of particle. Quinn zooms in on the liquids
