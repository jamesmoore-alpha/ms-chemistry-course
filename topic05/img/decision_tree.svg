<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 496" width="100%" role="img" aria-label="The decision tree: question 1 asks whether there is more than one kind of matter; no leads to a pure substance (one kind of particle drawn); yes leads to question 2, whether the mixture is the same all the way through; yes leads to a homogeneous mixture (two kinds spread evenly), no to a heterogeneous mixture (two kinds in separate regions)" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="496" fill="#ffffff"/><rect x="150" y="10" width="220" height="68" rx="10" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="260.0" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Question 1:</text><text x="260.0" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">is there more than one</text><text x="260.0" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">kind of matter?</text><line x1="160.0" y1="78.0" x2="90.0" y2="120.0" stroke="#222" stroke-width="1.6"/><polyline points="93.3,115.0 90.0,120.0 96.0,119.5" fill="none" stroke="#222" stroke-width="1.6"/><text x="105" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">no</text><line x1="360.0" y1="78.0" x2="370.0" y2="130.0" stroke="#222" stroke-width="1.6"/><polyline points="366.4,125.2 370.0,130.0 371.5,124.2" fill="none" stroke="#222" stroke-width="1.6"/><text x="380" y="108" text-anchor="start" font-size="13" font-weight="bold" fill="#222">yes: it is a mixture</text><rect x="10" y="120" width="150" height="160" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.5"/><text x="85" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a pure substance</text><g transform="translate(21 160) scale(0.85)"><rect x="0" y="0" width="150" height="110" fill="#ffffff" stroke="#222" stroke-width="1.5"/><circle cx="27.0" cy="18.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="59.0" cy="18.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="91.0" cy="18.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="123.0" cy="18.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="27.0" cy="44.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="59.0" cy="44.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="91.0" cy="44.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="123.0" cy="44.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="27.0" cy="70.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="59.0" cy="70.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="91.0" cy="70.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="123.0" cy="70.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="27.0" cy="96.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="59.0" cy="96.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="91.0" cy="96.0" r="7" fill="#555" stroke="#222" stroke-width="1"/><circle cx="123.0" cy="96.0" r="7" fill="#555" stroke="#222" stroke-width="1"/></g><rect x="260" y="130" width="220" height="68" rx="10" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="370.0" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Question 2:</text><text x="370.0" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">is it the same all</text><text x="370.0" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the way through?</text><line x1="320.0" y1="198.0" x2="265.0" y2="300.0" stroke="#222" stroke-width="1.6"/><polyline points="265.3,294.0 265.0,300.0 269.9,296.5" fill="none" stroke="#222" stroke-width="1.6"/><text x="282" y="252" text-anchor="end" font-size="13" font-weight="bold" fill="#222">yes</text><line x1="420.0" y1="198.0" x2="435.0" y2="300.0" stroke="#222" stroke-width="1.6"/><polyline poi