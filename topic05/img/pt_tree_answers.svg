<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 166" width="100%" role="img" aria-label="A table of a student's answers to question 1 and question 2 for four samples. A table. Header: the sample | question 1 | question 2. Row: a platinum ring | no | not needed. Row: a glass of sparkling grape juice | yes | yes. Row: a shaken bottle of salad dressing | yes | no. Row: a mug of hot spiced cider | yes | yes." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="166" fill="#ffffff"/><rect x="10" y="10" width="480" height="28" fill="#f1f1f1" stroke="#222"/><text x="135.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sample</text><text x="315.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">question 1</text><text x="430.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">question 2</text><rect x="10" y="38" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="135.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a platinum ring</text><text x="315.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="430.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">not needed</text><rect x="10" y="66" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="135.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a glass of sparkling grape juice</text><text x="315.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="430.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="94" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="135.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a shaken bottle of salad dressing</text><text x="315.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="430.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="122" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="135.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a mug of hot spiced cider</text><text x="315.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="430.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><line x1="260" y1="10" x2="260" y2="150" stroke="#222"/><line x1="370" y1="10" x2="370" y2="150" stroke="#222"/><!--blind: A table. Header: the sample | question 1 | question 2. Row: a platinum ring | no | not needed. Row: a glass of sparkling grape juice | yes | yes. Row: a shaken bottle of salad dressing | yes | no. Row: a mug of hot spiced cider | yes | yes.--></svg>