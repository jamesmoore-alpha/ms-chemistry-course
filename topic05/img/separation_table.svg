<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 138" width="100%" role="img" aria-label="A table of three mixtures, the property that differs between the two parts, and how the parts come apart: iron filings and sand by a magnet; sawdust and gravel by floating; sugar water by the water evaporating. A table. Header: the mixture | the property that differs | how the parts come apart. Row: iron filings and sand | iron is magnetic; sand is not | a magnet lifts the iron. Row: sawdust and gravel | sawdust floats; gravel sinks | the sawdust floats off. Row: sugar dissolved in water | water evaporates; sugar does not | the water leaves; the sugar stays." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="610" height="138" fill="#ffffff"/><rect x="10" y="10" width="590" height="28" fill="#f1f1f1" stroke="#222"/><text x="90.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the mixture</text><text x="272.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the property that differs</text><text x="487.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">how the parts come apart</text><rect x="10" y="38" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">iron filings and sand</text><text x="272.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">iron is magnetic; sand is not</text><text x="487.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a magnet lifts the iron</text><rect x="10" y="66" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sawdust and gravel</text><text x="272.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sawdust floats; gravel sinks</text><text x="487.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the sawdust floats off</text><rect x="10" y="94" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar dissolved in water</text><text x="272.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water evaporates; sugar does not</text><text x="487.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the water leaves; the sugar stays</text><line x1="170" y1="10" x2="170" y2="122" stroke="#222"/><line x1="375" y1="10" x2="375" y2="122" stroke="#222"/><!--blind: A table. Header: the mixture | the property that differs | how the parts come apart. Row: iron filings and sand | iron is magnetic; sand is not | a magnet lifts the iron. Row: sawdust and gravel | sawdust floats; gravel sinks | the sawdust floats off. Row: sugar dissolved in water | water evaporates; sugar does not | the water leaves; the sugar stays.--></svg>