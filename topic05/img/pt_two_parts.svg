<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 166" width="100%" role="img" aria-label="A table of four properties of steel wool and of shredded paper. A table. Header: the property | steel wool | shredded paper. Row: a magnet pulls it | yes | no. Row: it floats in water | no | yes. Row: its color | gray | white. Row: it dissolves in water | no | no." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="480" height="166" fill="#ffffff"/><rect x="10" y="10" width="460" height="28" fill="#f1f1f1" stroke="#222"/><text x="110.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the property</text><text x="270.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel wool</text><text x="400.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">shredded paper</text><rect x="10" y="38" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a magnet pulls it</text><text x="270.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="400.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="66" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">it floats in water</text><text x="270.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="400.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="94" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">its color</text><text x="270.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gray</text><text x="400.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">white</text><rect x="10" y="122" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">it dissolves in water</text><text x="270.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="400.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="210" y1="10" x2="210" y2="150" stroke="#222"/><line x1="330" y1="10" x2="330" y2="150" stroke="#222"/><!--blind: A table. Header: the property | steel wool | shredded paper. Row: a magnet pulls it | yes | no. Row: it floats in water | no | yes. Row: its color | gray | white. Row: it dissolves in water | no | no.--></svg>