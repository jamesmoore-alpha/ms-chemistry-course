<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 194" width="100%" role="img" aria-label="A table of five mixtures with the plain words and the term: salt water, air and brass are evenly mixed, homogeneous; sandy water and trail mix are not evenly mixed, heterogeneous. A table. Header: the mixture | in plain words | the term. Row: salt water | evenly mixed | homogeneous. Row: sandy water | not evenly mixed | heterogeneous. Row: air | evenly mixed | homogeneous. Row: trail mix | not evenly mixed | heterogeneous. Row: brass | evenly mixed | homogeneous." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="194" fill="#ffffff"/><rect x="10" y="10" width="470" height="28" fill="#f1f1f1" stroke="#222"/><text x="85.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the mixture</text><text x="245.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in plain words</text><text x="405.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the term</text><rect x="10" y="38" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt water</text><text x="245.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">evenly mixed</text><text x="405.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">homogeneous</text><rect x="10" y="66" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sandy water</text><text x="245.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">not evenly mixed</text><text x="405.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">heterogeneous</text><rect x="10" y="94" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="113" text-anchor="mi