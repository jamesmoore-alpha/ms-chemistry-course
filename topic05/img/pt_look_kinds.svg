<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 138" width="100%" role="img" aria-label="A table of three samples, how each one looks, and the kinds of particle in each one. A table. Header: the sample | how it looks | kinds of particle in it. Row: pickle brine | clear | water, salt and vinegar particles. Row: candle wax | white, cannot see through | wax particles only. Row: window cleaner | clear blue | water, alcohol and soap particles." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="610" height="138" fill="#ffffff"/><rect x="10" y="10" width="590" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sample</text><text x="250.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">how it looks</text><text x="475.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">kinds of particle in it</text><rect x="10" y="38" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pickle brine</text><text x="250.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">clear</text><text x="475.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water, salt and vinegar particles</text><rect x="10" y="66" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">candle wax</text><text x="250.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">white, cannot see through</text><text x="475.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">wax particles only</text><rect x="10" y="94" width="590" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">window cleaner</text><text x="250.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">clear blue</text><text x="475.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water, alcohol and soap particles</text><line x1="150" y1="10" x2="150" y2="122" stroke="#222"/><line x1="350" y1="10" x2="350" y2="122" stroke="#222"/><!--blind: A table. Header: the sample | how it looks | kinds of particle in it. Row: pickle brine | clear | water, salt and vinegar particles. Row: candle wax | white, cannot see through | wax particles only. Row: window cleaner | clear blue | water, alcohol and soap particles.--></svg>