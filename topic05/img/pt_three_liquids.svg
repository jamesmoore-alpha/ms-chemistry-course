<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 138" width="100%" role="img" aria-label="A table listing three liquids and the kinds of particle each one holds. A table. Header: the liquid | kinds of particle in it. Row: vegetable oil | oil particles only. Row: corn syrup | water particles and sugar particles. Row: sparkling water | water particles and gas particles." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="450" height="138" fill="#ffffff"/><rect x="10" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="85.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the liquid</text><text x="300.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">kinds of particle in it</text><rect x="10" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">vegetable oil</text><text x="300.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">oil particles only</text><rect x="10" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">corn syrup</text><text x="300.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water particles and sugar particles</text><rect x="10" y="94" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sparkling water</text><text x="300.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water particles and gas particles</text><line x1="160" y1="10" x2="160" y2="122" stroke="#222"/><!--blind: A table. Header: the liquid | kinds of particle in it. Row: vegetable oil | oil particles only. Row: corn syrup | water particles and sugar particles. Row: sparkling water | water particles and gas particles.--></svg>