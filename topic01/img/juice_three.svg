<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" width="100%" role="img" aria-label="250 mL of orange juice in a tall glass, a wide bowl and a measuring cup marked 100, 200 and 300 mL; the juice reaches 250 mL" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="245" fill="#ffffff"/><path d="M 30 40 L 36 190 L 84 190 L 90 40" fill="none" stroke="#222" stroke-width="1.5"/><rect x="34" y="70" width="52" height="118" fill="#d9d9d9"/><text x="60.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tall glass</text><path d="M 140 40 L 146 100 L 324 100 L 330 40" fill="none" stroke="#222" stroke-width="1.5"/><rect x="144" y="68" width="182" height="30" fill="#d9d9d9"/><text x="235.0" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">wide bowl</text><path d="M 400 40 L 406 180 L 484 180 L 490 40" fill="none" stroke="#222" stroke-width="1.5"/><rect x="404" y="110" width="82" height="68" fill="#d9d9d9"/><text x="445.0" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">measuring cup</text><line x1="484" y1="170" x2="494" y2="170" stroke="#222"/><text x="498" y="174" text-anchor="start" font-size="10" font-weight="normal" fill="#222">100 mL</text><line x1="484" y1="130" x2="494" y2="130" stroke="#222"/><text x="498" y="134" text-anchor="start" font-size="10" font-weight="normal" fill="#222">200 mL</text><line x1="484" y1="90" x2="494" y2="90" stroke="#222"/><text x="498" y="94" text-anchor="start" font-size="10" font-weight="normal" fill="#222">300 mL</text><line x1="404" y1="110" x2="394" y2="56" stroke="#222"/><text x="392" y="50" text-anchor="end" font-size="11" font-weight="normal" fill="#222">the juice reaches 250 mL</text><text x="280" y="228" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The same 250 mL of juice: three shapes, one volume.</text></svg>