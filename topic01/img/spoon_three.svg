<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img" aria-label="The same steel spoon in a cup, a bowl and a pitcher, spoon-shaped in each" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="250" fill="#ffffff"/><path d="M 30 60 L 38 170 L 102 170 L 110 60" fill="none" stroke="#222" stroke-width="1.5"/><line x1="58.0" y1="60" x2="76.0" y2="140" stroke="#222" stroke-width="4" stroke-linecap="round"/><ellipse cx="80.0" cy="148" rx="12" ry="7" fill="#d9d9d9" stroke="#222" transform="rotate(-25 80.0 148)"/><text x="70.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in a cup</text><path d="M 170 60 L 178 130 L 312 130 L 320 60" fill="none" stroke="#222" stroke-width="1.5"/><line x1="233.0" y1="20" x2="251.0" y2="100" stroke="#222" stroke-width="4" stroke-linecap="round"/><ellipse cx="255.0" cy="108" rx="12" ry="7" fill="#d9d9d9" stroke="#222" transform="rotate(-25 255.0 108)"/><text x="245.0" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in a bowl</text><path d="M 380 60 L 388 190 L 482 190 L 490 60" fill="none" stroke="#222" stroke-width="1.5"/><line x1="423.0" y1="80" x2="441.0" y2="160" stroke="#222" stroke-width="4" stroke-linecap="round"/><ellipse cx="445.0" cy="168" rx="12" ry="7" fill="#d9d9d9" stroke="#222" transform="rotate(-25 445.0 168)"/><text x="435.0" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in a pitcher</text><text x="280" y="235" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The spoon keeps its own shape and its own volume in every container.</text></svg>