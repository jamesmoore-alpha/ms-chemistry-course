<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 235" width="100%" role="img" aria-label="The same football on the same balance: flat it reads 412 g; pumped up it reads 417 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="480" height="235" fill="#ffffff"/><rect x="40" y="150" width="140" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="140" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="75" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="110" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">412 g</text><ellipse cx="110" cy="132.0" rx="40" ry="18.0" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 90 132.0 q 20 -10 40 0" fill="none" stroke="#222"/><text x="110" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">flat ball</text><rect x="300" y="150" width="140" height="10" fill="#d9d9d9" stroke="#222"/><rect x="300" y="160" width="140" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="335" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="370" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">417 g</text><ellipse cx="370" cy="106.0" rx="44" ry="44.0" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 350 106.0 q 20 -26 40 0" fill="none" stroke="#222"/><text x="370" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the same ball, pumped up</text><text x="240" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Only air was added. The balance reads about 5 g more.</text></svg>