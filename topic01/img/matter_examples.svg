<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 205" width="100%" role="img" aria-label="Four cases judged by the two-question test: a stone and water are matter (tick); light from a lamp and a shadow are not matter (cross)" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="590" height="205" fill="#ffffff"/><rect x="30" y="20" width="120" height="150" rx="8" fill="#ffffff" stroke="#222"/><path d="M 70 95 q -25 -30 5 -38 q 30 -12 40 12 q 10 26 -20 30 q -22 4 -25 -4 z" fill="#d9d9d9" stroke="#222"/><text x="90" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">a stone</text><text x="90" y="141" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">has mass?  yes</text><text x="90" y="154" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">takes up space?  yes</text><polyline points="82,40 88,47 100,32" fill="none" stroke="#222" stroke-width="3"/><text x="90" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">matter</text><rect x="165" y="20" width="120" height="150" rx="8" fill="#ffffff" stroke="#222"/><path d="M 200 60 L 205 110 L 245 110 L 250 60" fill="none" stroke="#222" stroke-width="1.5"/><rect x="206" y="72" width="38" height="37" fill="#d9d9d9"/><text x="225" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">water</text><text x="225" y="141" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">has mass?  yes</text><text x="225" y="154" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">takes up space?  yes</text><polyline points="217,40 223,47 235,32" fill="none" stroke="#222" stroke-width="3"/><text x="225" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">matter</text><rect x="300" y="20" width="120" height="150" rx="8" fill="#ffffff" stroke="#222"/><path d="M 345 55 L 375 55 L 382 75 L 338 75 z" fill="#d9d9d9" stroke="#222"/><line x1="360" y1="75" x2="360" y2="110" stroke="#222" stroke-width="2"/><line x1="351" y1="80" x2="342" y2="105" stroke="#222" stroke-dasharray="3 3"/><line x1="355" y1="80" x2="351" y2="105" stroke="#222" stroke-dasharray="3 3"/><line x1="360" y1="80" x2="360" y2="105" stroke="#222" stroke-dasharray="3 3"/><line x1="364" y1="80" x2="369" y2="105" stroke="#222" stroke-dasharray="3 3"/><line x1="369" y1="80" x2="378" y2="105" stroke="#222" stroke-dasharray="3 3"/><text x="360" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">light from a lamp</text><text x="360" y="141" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">has mass?  no</text><text x="360" y="154" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">takes up space?  no</text><line x1="352" y1="32" x2="368" y2="48" stroke="#222" stroke-width="3"/><line x1="352" y1="48" x2="368" y2="32" stroke="#222" stroke-width="3"/><text x="360" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">not matter</text><rect x="435" y="20" width="120" height="150" rx="8" fill="#ffffff" stroke="#222"/><rect x="473" y="60" width="16" height="40" fill="#d9d9d9" stroke="#222"/><path d="M 489 100 L 505 100 L 535 112 L 519 112 z" fill="#555" opacity="0.5"/><text x="495" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">a shadow</text><text x="495" y="141" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">has mass?  no</text><text x="495" y="154" text-anchor="middle" font-size="10" font-weight="normal" fill="#222">takes up space?  no</text><line x1="487" y1="32" x2="503" y2="48" stroke="#222" stroke-width="3"/><line x1="487" y1="48" x2="503" y2="32" stroke="#222" stroke-width="3"/><text x="495" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">not matter</text></svg>