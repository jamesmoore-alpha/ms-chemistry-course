use…", "model": "The water tastes of mint because the peppermint is still there.<br>The peppermint broke into particles far too small to see.<br>The peppermint particles spread through the water.", "points": ["the peppermint is still in the water", "the peppermint is in particles too small to see", "the particles spread through the water"]}, {"type": "mcq", "tag": "misconception", "stem": "Salt is stirred into a pan of water and disappears. Maya says: \"The salt has turned into water.\" Is Maya correct?", "options": ["yes", "no"], "key": 1, "fb": ["The salt is still there, as salt particles too small to see.", "The salt is still there, as salt particles too small to see."], "why": "The salt is still salt.<br>The salt broke into particles far too small to see.<br>The salt particles spread through the water."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "After stirring, nobody could see the sugar, but the water tasted sweet. Where was the sugar?", "options": ["Gone.", "In the water, as particles too small to see."], "key": 1, "fb": ["The water tasted sweet, so the sugar was still there.", "The sugar broke into particles far too small to see."], "why": "The water tasted sweet.<br>So the sugar was still there, as particles too small to see."}]}, {"id": "L03", "atom": "MAT-003", "title": "Particles never stop moving", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (explain an observation with the particle picture)", "check_design": "Type (c) concept understanding → what, why (free response, fresh case), student-claim misconception, transfer (a case the lesson did not show). Recall MCQ first for L02 (perfume is made of particles).", "headache": ["A teacher opens a bottle of perfume at the front of a quiet classroom.", "Every window is shut.", "No fan runs.", "Twenty seconds later the students in the back row can smell the perfume.", "Nobody carried the smell to them.", "How did the perfume reach the back row?"], "forest": ["Perfume particles leave the open bottle.", "Particles are always moving, even in still air.", "The perfume particles bump into air particles and keep moving in every direction.", "They spread through the room until they reach the back row."], "article": [{"t": "idea", "text": "A teacher opens a bottle of perfume at the front of a quiet classroom."}, {"t": "idea", "text": "Every window is shut, and no fan runs."}, {"t": "idea", "text": "Twenty seconds later, the students in the back row can smell the perfume."}, {"t": "idea", "text": "Nobody carried the smell to them."}, {"t": "idea", "text": "How did the perfume reach the back row?"}, {"t": "h", "text": "Zoom in on the room"}, {"t": "idea", "text": "Perfume is matter, so perfume is made of particles."}, {"t": "idea", "text": "Some perfume particles leave the open bottle."}, {"t": "idea", "text": "Particles are always moving."}, {"t": "idea", "text": "The air in the room is made of particles too."}, {"t": "idea", "text": "The air particles are moving as well, even though the air feels still."}, {"t": "idea", "text": "The perfume particles bump into air particles."}, {"t": "idea", "text": "The perfume particles bounce off and keep moving, in every direction."}, {"t": "h", "text": "Spreading through the room"}, {"t": "idea", "text": "So the perfume particles spread out through the whole room."}, {"t": "idea", "text": "After 20 seconds, some perfume particles have reached the back row."}, {"t": "fig", "key": "room_smell", "cap": "The classroom from above. At 0 seconds the perfume particles are at the bottle. At 20 seconds they have spread among the air particles to the back row."}, {"t": "idea", "text": "Perfume particles reach the noses of the students at the back."}, {"t": "idea", "text": "That is why those students smell the perfume."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a glass of still water."}, {"t": "idea", "text": "A drop of food coloring falls in, and nobody stirs."}, {"t": "idea", "text": "By the next morning, the whole glass is colored."}, {"t": "idea", "text": "Particles never stop moving."}, {"t": "idea", "text": "So the coloring particles moved through the whole glass."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Particles are always moving. They never stop."}, {"t": "idea", "text": "Back to the classroom: moving perfume particles spread from the bottle to the back row."}, {"t": "idea", "text": "That is how the smell crossed a still room."}], "script": [{"say": "Here is a quiet classroom seen from above, windows shut, no fan.", "screen": "[room plan; desks; back row labelled; chips: WINDOWS SHUT, NO FAN]"}, {"say": "The teacher opens a bottle of perfume at the front.", "screen": "[bottle opens; a few dark particles appear at its neck]"}, {"say": "Twenty seconds later, the back row can smell it, and nobody carried the smell to them.", "screen": "[timer runs 0 to 20 s; back-row desks highlight]"}, {"say": "So how did the perfume cross the room?", "screen": "[question mark]"}, {"say": "Perfume is matter, so perfume is made of particles.", "screen": "[magnifier on the bottle neck: dark circles]"}, {"say": "Some perfume particles leave the open bottle.", "screen": "[dark circles drift out]"}, {"say": "Particles are always moving.", "screen": "[chip: ALWAYS MOVING; circles jiggle and travel]"}, {"say": "The air is made of particles too, and they are moving as well.", "screen": "[light circles fill the room, all moving]"}, {"say": "The perfume particles bump into air particles.", "screen": "[a dark circle hits a light one]"}, {"say": "They bounce off and keep moving, in every direction.", "screen": "[dark circles scatter in all directions]"}, {"say": "So the perfume particles spread out through the whole room.", "screen": "[dark circles spread across the plan]"}, {"say": "After twenty seconds, some have reached the back row.", "screen": "[dark circles at the back-row desks; timer at 20 s]"}, {"say": "That is why the students at the back can smell it.", "screen": "[chip: SMELL REACHES THE BACK ROW]"}, {"say": "Now consider a glass of still water, with one drop of food coloring and no stirring.", "screen": "[glass; drop falls in]"}, {"say": "By the next morning the whole glass is colored.", "screen": "[color spreads slowly through the glass; clock advances]"}, {"say": "Particles never stop moving, so the coloring particles moved through the whole glass.", "screen": "[magnifier: dark circles moving among light ones]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses the room plan and the glass]"}, {"say": "Particles are always moving. They never stop.", "screen": "[rule text]"}, {"say": "Back to the classroom: moving perfume particles spread from the bottle to the back row.", "screen": "[room plan at 20 s]"}, {"say": "That is how the smell crossed a still room.", "screen": "[back row highlighted]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Perfume is matter. Is perfume made of particles?", "options": ["yes", "no"], "key": 0, "fb": ["All matter is made of particles too small to see.", "Perfume is matter, and all matter is made of particles."], "why": "Perfume is matter.<br>All matter is made of particles too small to see."}, {"type": "mcq", "tag": "what", "stem": "A bottle of vinegar is opened in a still kitchen. What happens to the vinegar particles over the next minute?", "options": ["They stay inside the bottle.", "They spread out through the kitchen.", "They sink to the floor."], "key": 1, "fb": ["Some particles leave the open bottle, and particles never stop moving.", "Particles are always moving, so the vinegar particles spread out.", "The particles move in every direction, not only down."], "why": "Some vinegar particles leave the open bottle.<br>Particles are always moving.<br>So the vinegar particles spread out through the kitchen."}, {"type": "frq", "tag": "why", "task": "A pizza box is opened at one end of a quiet classroom. A minute later, a student at the other end smells the pizza. Explain how the smell reached her.", "starter": "The smell reached her because…", "model": "The smell reached her because particles left the pizza.<br>Particles are always moving.<br>The pizza particles bumped into air particles and kept moving in every direction.<br>They spread across the classroom until they reached her nose.", "points": ["particles leave the pizza", "particles are always moving", "the particles spread across the classroom to her"]}, {"type": "mcq", "tag": "misconception", "stem": "The air in a room feels completely still. Leo says: \"The air particles are not moving.\" Is Leo correct?", "options": ["yes", "no"], "key": 1, "fb": ["Particles are always moving, even when the air feels still.", "Particles are always moving, even when the air feels still."], "why": "Particles never stop moving.<br>The air feels still, but its particles are moving all the time."}, {"type": "mcq", "tag": "transfer", "stem": "A match is blown out in a still room. A thin trail of smoke rises from it. What happens to the smoke over the next few minutes?", "options": ["It stays as one thin trail.", "It sinks to the floor.", "It spreads through the room."], "key": 2, "fb": ["The smoke particles never stop moving, so the trail cannot stay as it is.", "The particles move in every direction, not only down.", "The smoke particles are always moving, so they spread through the room."], "why": "Smoke is made of particles.<br>Particles are always moving.<br>So the smoke particles spread through the room."}, {"type": "mcq", "tag": "fluency", "stem": "A bakery door is opened onto a still street. What happens to the smell of bread over the next minute?", "options": ["It stays inside the bakery.", "It spreads out along the street."], "key": 1, "fb": ["Some bread particles leave through the door, and particles never stop moving.", "Particles are always moving, so the bread particles spread out."], "why": "Bread particles leave through the door.<br>Particles are always moving.<br>So they spread along the street."}, {"type": "mcq", "tag": "fluency", "stem": "A sugar cube sits in a glass of still water. Are the water particles around it moving?", "options": ["yes", "no"], "key": 0, "fb": ["Particles are always moving, even in still water.", "Particles are always moving, even in still water."], "why": "Particles never stop moving."}, {"type": "mcq", "tag": "fluency", "stem": "A lemon is cut in the kitchen. Ten minutes later the smell has reached the hallway. What moved?", "options": ["lemon particles", "the lemon itself", "nothing; smells do not move"], "key": 0, "fb": ["Lemon particles left the cut lemon and spread through the air.", "The lemon stayed on the board. Its particles moved.", "A smell reaches you when particles reach your nose."], "why": "Lemon particles leave the cut lemon.<br>Particles are always moving.<br>They spread through the air to the hallway."}, {"type": "mcq", "tag": "fluency", "stem": "True or false: the particles in a still puddle stop moving.", "options": ["true", "false"], "key": 1, "fb": ["Particles never stop moving.", "Particles never stop moving."], "why": "The puddle looks still, but its particles are moving all the time."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The windows were shut and no fan ran, yet the smell reached the back row. What carried it?", "options": ["Moving perfume particles.", "A breeze."], "key": 0, "fb": ["Particles are always moving, so the perfume particles spread through the room.", "There was no breeze. The perfume particles moved on their own."], "why": "Particles are always moving.<br>The perfume particles spread through the still room to the back row."}]}, {"id": "L04", "atom": "MAT-004", "title": "Heating speeds particles up; cooling slows them down", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (a prediction and its particle reason)", "check_design": "Type (c) → what (faster / slower / same), why (free response, fresh case), student-claim misconception (particles get bigger), transfer (cooling). Recall MCQ first for L03 (particles always moving). ENE-020 is stated in one sentence, not assumed.", "headache": ["Two mugs each hold 250 mL of water.", "One mug is at 10 °C.", "The other is at 80 °C.", "A student drops a tea bag into each mug and does not stir.", "After 30 seconds the hot water has turned brown all the way through.", "The cold water shows only a faint brown cloud around its bag.", "The tea and the water are the same in both mugs.", "What did the heat change?"], "forest": ["Heating a substance makes its particles move faster.", "Cooling makes them move more slowly.", "The water particles at 80 °C move faster than the water particles at 10 °C.", "So they carry the tea color through the whole mug sooner."], "article": [{"t": "idea", "text": "Two mugs each hold 250 mL of water."}, {"t": "idea", "text": "One mug is at 10 °C. The other is at 80 °C."}, {"t": "idea", "text": "A student drops a tea bag into each mug and does not stir."}, {"t": "idea", "text": "After 30 seconds, the hot water has turned brown all the way through."}, {"t": "idea", "text": "The cold water shows only a faint brown cloud around its bag."}, {"t": "idea", "text": "The tea and the water are the same in both mugs."}, {"t": "idea", "text": "What did the heat change?"}, {"t": "h", "text": "Zoom in on the water"}, {"t": "idea", "text": "Water is made of particles."}, {"t": "idea", "text": "Particles are always moving."}, {"t": "idea", "text": "A higher temperature means the particles are moving faster."}, {"t": "idea", "text": "Heating a substance makes its particles move faster."}, {"t": "idea", "text": "Cooling a substance makes its particles move more slowly."}, {"t": "fig", "key": "mugs_particles", "cap": "The same water particles at 10 °C and at 80 °C. The arrows show speed: short for slow, long for fast."}, {"t": "idea", "text": "The water particles at 80 °C move faster than the water particles at 10 °C."}, {"t": "idea", "text": "Tea particles leave the bag and bump into the moving water particles."}, {"t": "idea", "text": "Faster water particles knock the tea particles around faster."}, {"t": "idea", "text": "So the brown color spreads through the hot mug sooner."}, {"t": "idea", "text": "The particles themselves do not grow or shrink when the water is heated."}, {"t": "idea", "text": "Only their speed changes."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Heating makes particles move faster. Cooling makes them move more slowly."}, {"t": "idea", "text": "Back to the two mugs: the heat did not change the tea or the water."}, {"t": "idea", "text": "The heat made the water particles move faster."}, {"t": "idea", "text": "So the color spread sooner."}], "script": [{"say": "Here are two mugs, each with 250 milliliters of water.", "screen": "[two mugs; labels 250 mL]"}, {"say": "This one is at 10 degrees Celsius, and this one is at 80.", "screen": "[labels 10 °C and 80 °C appear on the words]"}, {"say": "A student drops a tea bag into each, and does not stir.", "screen": "[two tea bags drop in]"}, {"say": "After thirty seconds, the hot water is brown all the way through.", "screen": "[timer runs; hot mug fully brown]"}, {"say": "The cold water shows only a faint cloud around the bag.", "screen": "[cold mug: faint cloud]"}, {"say": "The tea and the water are the same in both mugs, so what did the heat change?", "screen": "[question mark between the mugs]"}, {"say": "Let's zoom into the water.", "screen": "[two particle boxes appear below the mugs]"}, {"say": "Water is made of particles, and particles are always moving.", "screen": "[particles jiggle in both boxes]"}, {"say": "A higher temperature means the particles are moving faster.", "screen": "[chip: HIGHER TEMPERATURE, FASTER PARTICLES]"}, {"say": "Heating a substance makes its particles move faster.", "screen": "[80 °C box: long arrows]"}, {"say": "Cooling makes them move more slowly.", "screen": "[10 °C box: short arrows]"}, {"say": "Tea particles leave the bag and bump into the moving water particles.", "screen": "[dark tea particles enter each box]"}, {"say": "Faster water particles knock the tea particles around faster.", "screen": "[dark particles scatter quickly in the hot box, slowly in the cold]"}, {"say": "So the brown color spreads through the hot mug sooner.", "screen": "[hot mug brown; chip: COLOR SPREADS SOONER]"}, {"say": "The particles themselves do not grow or shrink; only their speed changes.", "screen": "[both boxes: particles same size; chip: ONLY THE SPEED CHANGES]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses the two boxes]"}, {"say": "Heating makes particles move faster. Cooling makes them move more slowly.", "screen": "[rule text]"}, {"say": "Back to the two mugs: the heat did not change the tea or the water.", "screen": "[two mugs]"}, {"say": "It made the water particles move faster, so the color spread sooner.", "screen": "[hot mug brown]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A glass of water stands still on a table. Are its water particles moving?", "options": ["yes", "no"], "key": 0, "fb": ["Particles are always moving, even in still water.", "Particles are always moving, even in still water."], "why": "Particles never stop moving.<br>The water looks still, but its particles are moving all the time."}, {"type": "mcq", "tag": "what", "stem": "A pan of soup is heated from 20 °C to 60 °C. What happens to the speed of its particles?", "options": ["They move more slowly.", "They move faster.", "Their speed does not change."], "key": 1, "fb": ["Heating makes particles move faster, not more slowly.", "Heating makes particles move faster.", "Heating changes the speed of the particles."], "why": "Heating a substance makes its particles move faster.<br>The soup is heated, so its particles move faster."}, {"type": "frq", "tag": "why", "task": "Two drops of blue dye fall into two glasses of still water, one at 5 °C and one at 70 °C. The dye spreads through the 70 °C water much sooner. Explain why.", "starter": "The dye spreads sooner in the 70 °C water because…", "model": "The dye spreads sooner in the 70 °C water because its water particles move faster than the particles in the 5 °C water.<br>Heating makes particles move faster.<br>The faster water particles knock the dye particles around faster.<br>So the dye spreads through the whole glass sooner.", "points": ["the hotter water's particles move faster", "heating makes particles move faster", "faster water particles spread the dye particles sooner"]}, {"type": "mcq", "tag": "misconception", "stem": "A metal rod is heated. Priya says: \"The heat makes each particle in the rod bigger.\" Is Priya correct?", "options": ["yes", "no"], "key": 1, "fb": ["Heating does not change the size of the particles. It makes them move faster.", "Heating does not change the size of the particles. It makes them move faster."], "why": "The particles stay the same size.<br>Heating makes them move faster.<br>Only their speed changes."}, {"type": "mcq", "tag": "transfer", "stem": "A glass of lemonade is cooled from 25 °C to 5 °C in a fridge. What happens to its particles?", "options": ["They move faster.", "They stop moving.", "They move more slowly."], "key": 2, "fb": ["Cooling slows particles down; heating speeds them up.", "Particles never stop moving. Cooling only slows them down.", "Cooling makes particles move more slowly."], "why": "Cooling a substance makes its particles move more slowly.<br>The lemonade is cooled, so its particles move more slowly."}, {"type": "mcq", "tag": "fluency", "stem": "Two identical cups of water: one at 15 °C, one at 75 °C. In which cup do the particles move faster?", "options": ["the 15 °C cup", "the 75 °C cup"], "key": 1, "fb": ["Cooler water has slower particles.", "A higher temperature means faster particles."], "why": "Heating makes particles move faster.<br>The 75 °C water's particles move faster."}, {"type": "mcq", "tag": "fluency", "stem": "A pot of milk is warmed from 10 °C to 50 °C. What happens to the size of its particles?", "options": ["They stay the same size.", "They get bigger.", "They get smaller."], "key": 0, "fb": ["Heating changes the speed of the particles, not their size.", "Particles do not grow when heated.", "Particles do not shrink when heated."], "why": "Heating makes the particles move faster.<br>Their size does not change."}, {"type": "mcq", "tag": "fluency", "stem": "Two glasses of water look the same. In one, a drop of dye spreads in 20 seconds; in the other, in 3 minutes. Which glass is warmer?", "options": ["the 20-second glass", "the 3-minute glass"], "key": 0, "fb": ["Faster spreading means faster water particles, which means a higher temperature.", "Slower spreading means slower particles, which means cooler water."], "why": "Faster water particles spread the dye sooner.<br>Faster particles mean a higher temperature.<br>So the 20-second glass is warmer."}, {"type": "mcq", "tag": "fluency", "stem": "True or false: cooling a drink makes its particles move more slowly.", "options": ["true", "false"], "key": 0, "fb": ["Cooling slows particles down.", "Cooling slows particles down."], "why": "Cooling a substance makes its particles move more slowly."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In which mug were the water particles moving faster?", "options": ["the 10 °C mug", "the 80 °C mug"], "key": 1, "fb": ["Cooler water has slower particles.", "Heating makes particles move faster."], "why": "Heating makes particles move faster.<br>The 80 °C water's particles move faster."}]}, {"id": "L05", "atom": "MAT-016", "title": "Solid, liquid or gas?", "video": "could do without a video", "lesson_type": "Example-sequence classification lesson (a two-question test applied case by case)", "script_cap_note": "the merged three-way sort carries three verdicts and the honey and sand boundary cases; about 105 s at 2 words/s — James to say whether to accept the length or split the video at the sand return", "check_design": "Type (a) one-step sort → two recall MCQs (a solid keeps its shape; a gas fills its container), then a fluency quiz, three options (solid / liquid / gas), eight fresh cases, then one student-claim misconception item on a fresh boundary case.", "headache": ["A student pours dry sand from a bucket into a jar.", "The sand flows and settles.", "The sand takes the shape of the jar, just as water would.", "So is sand a liquid?"], "forest": ["Ask two questions: does it keep its own shape, and does it keep its own volume?", "A solid keeps both.", "A liquid keeps its volume but takes the shape of its container.", "A gas keeps neither: it spreads to fill whatever space it is given.", "One grain of sand keeps its shape and its volume, so sand is a solid."], "article": [{"t": "idea", "text": "A student pours dry sand from a bucket into a jar."}, {"t": "idea", "text": "The sand flows and settles."}, {"t": "idea", "text": "The sand takes the shape of the jar, just as water would."}, {"t": "photo", "file": "hourglass_flowing_sand.jpg", "cap": "Sand flowing through an hourglass. It pours and piles up, the way a liquid seems to.", "credit": "Photo: Pauloleong2002, Wikimedia Commons, CC BY-SA 4.0."}, {"t": "idea", "text": "So is sand a liquid?"}, {"t": "h", "text": "Two questions"}, {"t": "idea", "text": "To tell a solid from a liquid from a gas, ask two questions."}, {"t": "idea", "text": "Does it keep its own shape?"}, {"t": "idea", "text": "Does it keep its own volume?"}, {"t": "h", "text": "A steel spoon"}, {"t": "idea", "text": "Put the spoon in a cup, a bowl or a pitcher. It stays spoon-shaped every time."}, {"t": "idea", "text": "It takes up the same amount of space every time."}, {"t": "fig", "key": "spoon_three", "cap": "The same spoon in a cup, a bowl and a pitcher. It keeps its shape and its volume in every container."}, {"t": "idea", "text": "The spoon keeps its shape and keeps its volume, so the spoon is a solid."}, {"t": "h", "text": "Orange juice"}, {"t": "idea", "text": "Now consider 250 mL of orange juice."}, {"t": "idea", "text": "In a tall glass the juice stands tall and narrow."}, {"t": "idea", "text": "In a wide bowl the same juice lies flat and round."}, {"t": "idea", "text": "Pour it into a measuring cup, and the measuring cup reads 250 mL."}, {"t": "fig", "key": "juice_three", "cap": "The same 250 mL of juice in a tall glass, a wide bowl and a measuring cup. Three shapes, one volume."}, {"t": "idea", "text": "The juice takes the shape of its container but keeps its volume, so the juice is a liquid."}, {"t": "h", "text": "Air in a syringe"}, {"t": "idea", "text": "Now consider 20 mL of air sealed in a syringe."}, {"t": "idea", "text": "Pull the plunger out, and the air fills 60 mL."}, {"t": "idea", "text": "Push the plunger in, and the same air fits into 10 mL."}, {"t": "idea", "text": "Now fill the syringe with 20 mL of water and push."}, {"t": "idea", "text": "The plunger will not move. The water stays at 20 mL."}, {"t": "fig", "key": "syringe_air_water", "cap": "The same air fills 20 mL, then 60 mL, then 10 mL. The water stays at 20 mL however hard you push."}, {"t": "idea", "text": "The air keeps neither its shape nor its volume, so the air is a gas."}, {"t": "h", "text": "A slow one, and the sand"}, {"t": "idea", "text": "Honey flows slowly."}, {"t": "idea", "text": "But honey takes the shape of its jar and keeps its volume."}, {"t": "idea", "text": "So honey is a liquid."}, {"t": "idea", "text": "Now back to the sand. Look at one grain."}, {"t": "photo", "file": "sand_grains.jpg", "cap": "Grains of sand, close up. Each grain keeps its own shape wherever it lies.", "credit": "Photo: Seano1, Wikimedia Commons, CC BY-SA 2.5."}, {"t": "idea", "text": "One grain of sand keeps its shape and keeps its volume, so a grain of sand is a solid."}, {"t": "idea", "text": "A jar of sand is thousands of tiny solids that slide over one another."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A solid keeps its own shape and its own volume. A liquid keeps its own volume but takes the shape of its container. A gas keeps neither: it spreads to fill whatever space it is given."}, {"t": "idea", "text": "So sand is not a liquid. Sand is a solid, in very small pieces."}], "script": [{"say": "Dry sand pours into a jar and takes its shape, just as water would.", "screen": "[sand pours; piles to the jar's shape; water pours into a second jar]"}, {"say": "So is sand a liquid?", "screen": "[question mark]"}, {"say": "Ask two questions: does it keep its own shape, and does it keep its own volume?", "screen": "[chips: KEEPS ITS SHAPE?  KEEPS ITS VOLUME?]"}, {"say": "A steel spoon keeps its shape and its volume in a cup, a bowl, a pitcher, so the spoon is a solid.", "screen": "[spoon moves container to container, unchanged; two ticks; label SOLID]"}, {"say": "Now 250 milliliters of juice.", "screen": "[juice in a tall glass; label 250 mL]"}, {"say": "In a tall glass it stands tall. In a wide bowl it lies flat.", "screen": "[juice pours glass to bowl]"}, {"say": "A measuring cup still reads 250 milliliters.", "screen": "[measuring cup reads 250 mL]"}, {"say": "It takes its container's shape but keeps its volume, so the juice is a liquid.", "screen": "[cross on shape, tick on volume; label LIQUID]"}, {"say": "Now 20 milliliters of air sealed in a syringe.", "screen": "[syringe at 20 mL]"}, {"say": "Pull the plunger out, and the air fills 60 milliliters.", "screen": "[plunger out to 60 mL]"}, {"say": "Push it in, and the same air fits into 10 milliliters.", "screen": "[plunger in to 10 mL]"}, {"say": "It keeps neither shape nor volume, so the air is a gas.", "screen": "[two crosses; label GAS]"}, {"say": "Fill the syringe with water instead and push: the plunger will not move, and the water stays at 20 milliliters.", "screen": "[water syringe; plunger stuck; label LIQUID]"}, {"say": "Honey flows slowly, but it takes its jar's shape and keeps its volume, so honey is a liquid.", "screen": "[honey pours; cross, tick; label LIQUID]"}, {"say": "Now back to the sand: one grain keeps its shape and its volume, so a grain of sand is a solid.", "screen": "[zoom to a single grain; two ticks; label SOLID]"}, {"say": "A jar of sand is thousands of tiny solids sliding over one another.", "screen": "[zoom out to the jar]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses spoon, juice and syringe]"}, {"say": "A solid keeps its shape and its volume.", "screen": "[rule row 1]"}, {"say": "A liquid keeps its volume but takes its container's shape.", "screen": "[rule row 2]"}, {"say": "A gas keeps neither. It spreads to fill whatever space it is given.", "screen": "[rule row 3]"}, {"say": "So sand is not a liquid. Sand is a solid, in very small pieces.", "screen": "[the jar of sand]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A wooden block is moved from a box into a bag. What happens to its shape?", "options": ["It stays the same.", "It takes the shape of the bag."], "key": 0, "fb": ["A wooden block keeps its own shape wherever you put it.", "A wooden block keeps its own shape wherever you put it."], "why": "The block keeps its own shape in the box and in the bag."}, {"type": "mcq", "tag": "recall", "stem": "Air, which is a gas, is blown into a balloon. Where does the air go?", "options": ["It sits at the bottom of the balloon.", "It spreads to fill the whole balloon."], "key": 1, "fb": ["A gas spreads to fill all the space it is given, not just the bottom.", "A gas spreads to fill all the space it is given."], "why": "Air spreads out to fill all the space inside the balloon."}, {"type": "mcq", "tag": "fluency", "stem": "A brick keeps its shape and its volume on any surface. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["It keeps its shape and its volume.", "A liquid would take the shape of its container.", "A gas would spread out."], "why": "The brick keeps its own shape and its own volume.<br>So the brick is a solid."}, {"type": "mcq", "tag": "fluency", "stem": "Milk poured from a carton into a bowl takes the bowl's shape and stays 500 mL. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 1, "fb": ["A solid would keep its own shape.", "It takes the container's shape but keeps its volume.", "A gas would not keep its volume."], "why": "The milk takes the shape of the bowl but keeps its volume.<br>So the milk is a liquid."}, {"type": "mcq", "tag": "fluency", "stem": "The air in a bicycle pump is squeezed into half the space. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["A solid keeps its volume.", "A liquid keeps its volume.", "It does not keep its volume."], "why": "The air does not keep its volume: it can be squeezed into less space.<br>So the air is a gas."}, {"type": "mcq", "tag": "fluency", "stem": "An ice cube keeps its shape and volume in a glass, a bowl or a hand. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["It keeps its shape and its volume.", "A liquid would take the container's shape.", "A gas would spread out."], "why": "The ice cube keeps its own shape and its own volume.<br>So the ice cube is a solid."}, {"type": "mcq", "tag": "fluency", "stem": "Cooking oil spreads flat across a pan but stays 50 mL. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 1, "fb": ["A solid keeps its own shape.", "It takes the pan's shape but keeps its volume.", "A gas would not keep its volume."], "why": "The oil takes the pan's shape but keeps its volume.<br>So the oil is a liquid."}, {"type": "mcq", "tag": "fluency", "stem": "Helium from a small cylinder spreads out to fill a whole empty tank. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["A solid keeps its shape and volume.", "A liquid keeps its volume.", "It spreads to fill whatever space it is given."], "why": "The helium spreads to fill the whole tank.<br>It keeps neither shape nor volume.<br>So the helium is a gas."}, {"type": "mcq", "tag": "fluency", "stem": "A coin keeps its shape and volume in a pocket or a purse. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["It keeps its shape and its volume.", "A liquid would take the container's shape.", "A gas would spread out."], "why": "The coin keeps its own shape and its own volume.<br>So the coin is a solid."}, {"type": "mcq", "tag": "fluency", "stem": "Oxygen from a small hospital cylinder spreads out to fill a whole empty tank. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["A solid keeps its shape and volume.", "A liquid keeps its volume.", "It spreads to fill whatever space it is given."], "why": "The oxygen spreads out to fill the tank.<br>It keeps neither shape nor volume.<br>So oxygen is a gas."}, {"type": "mcq", "tag": "misconception", "stem": "Priya pours dry rice into a bowl. The rice takes the shape of the bowl. Priya says: \"Rice is a liquid.\" Is Priya correct?", "options": ["yes", "no"], "key": 1, "fb": ["Each grain of rice keeps its own shape and volume. Rice is many tiny solids.", "Each grain of rice keeps its own shape and volume. Rice is many tiny solids."], "why": "One grain of rice keeps its own shape and its own volume wherever it lies.<br>So each grain is a solid.<br>A bowl of rice is many tiny solids sliding over one another."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The sand flowed into the jar. What did the two questions decide about sand?", "options": ["Sand is a liquid, because it flows.", "Sand is a solid, because each grain keeps its shape and volume."], "key": 1, "fb": ["Look at one grain: it keeps its own shape and its own volume.", "Each grain is a tiny solid."], "why": "One grain keeps its shape and its volume.<br>So sand is a solid, in very small pieces."}]}, {"id": "L06", "atom": "MAT-016b", "title": "Why a solid keeps its shape", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (the particle picture of a solid)", "check_design": "Type (c) → what (arrangement), why (free response, fresh case), student-claim misconception (particles do not move), transfer (fresh case). One recall MCQ first for L05 (a fresh solid).", "headache": ["A steel spoon lies in a cup, then in a bowl, then in a pitcher.", "It stays spoon-shaped in every one.", "Water poured into the same three containers takes three different shapes.", "What holds the spoon in one shape?"], "forest": ["In a solid the particles are packed tightly, touching, in fixed positions.", "Each particle vibrates on the spot.", "No particle can move past its neighbors.", "So the whole solid holds one shape and one volume."], "article": [{"t": "idea", "text": "A steel spoon lies in a cup, then in a bowl, then in a pitcher."}, {"t": "idea", "text": "It stays spoon-shaped in every one."}, {"t": "idea", "text": "Water poured into the same three containers takes three different shapes."}, {"t": "idea", "text": "What holds the spoon in one shape?"}, {"t": "h", "text": "Zoom in on the steel"}, {"t": "idea", "text": "The spoon is made of particles, like all matter."}, {"t": "fig", "key": "solid_box", "cap": "The particles in a solid: packed tightly, touching, in fixed positions. The small mark on each particle shows it vibrating on the spot."}, {"t": "idea", "text": "In a solid the particles are packed tightly, touching, in fixed positions."}, {"t": "idea", "text": "Particles are always moving, and these particles move too."}, {"t": "idea", "text": "Each particle vibrates on the spot."}, {"t": "idea", "text": "Each particle shakes back and forth, but it stays in its place."}, {"t": "idea", "text": "No particle can move past its neighbors."}, {"t": "idea", "text": "So the particles stay in the same arrangement wherever the spoon goes."}, {"t": "idea", "text": "The whole spoon holds one shape."}, {"t": "idea", "text": "The particles stay packed just as tightly, so the spoon holds one volume too."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider an ice cube dropped into a glass of juice."}, {"t": "idea", "text": "Ice is a solid, so its particles are packed tightly, touching, in fixed positions."}, {"t": "idea", "text": "Each particle vibrates on the spot and cannot move past its neighbors."}, {"t": "idea", "text": "So the ice cube keeps its shape in the juice."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a solid the particles are packed tightly, touching, in fixed positions. Each particle vibrates on the spot. That is why a solid keeps its shape and its volume."}, {"t": "idea", "text": "Back to the spoon: its particles cannot move past one another."}, {"t": "idea", "text": "So the spoon stays spoon-shaped in the cup, the bowl and the pitcher."}], "script": [{"say": "Here is a steel spoon in a cup.", "screen": "[spoon in cup]"}, {"say": "Now put the spoon in a bowl, then in a pitcher.", "screen": "[spoon moves; shape unchanged]"}, {"say": "It stays spoon-shaped every time.", "screen": "[chip: KEEPS ITS SHAPE]"}, {"say": "Water poured into the same three containers takes three different shapes.", "screen": "[water pours into each]"}, {"say": "So what holds the spoon in one shape?", "screen": "[question mark on the spoon]"}, {"say": "Let's zoom into the steel.", "screen": "[magnifier grows into the particle box]"}, {"say": "In a solid the particles are packed tightly, touching, in fixed positions.", "screen": "[16 touching circles in rows; chips: TOUCHING, FIXED POSITIONS]"}, {"say": "Particles are always moving, and each of these vibrates on the spot.", "screen": "[all circles jiggle in place; chip: VIBRATES ON THE SPOT]"}, {"say": "Each particle shakes back and forth, but it stays in its place.", "screen": "[highlighted circle shakes, never leaves its cell]"}, {"say": "No particle can move past its neighbors.", "screen": "[a circle tries to slide, is blocked, springs back]"}, {"say": "So the particles keep the same arrangement wherever the spoon goes.", "screen": "[box travels cup to bowl to pitcher, arrangement unchanged]"}, {"say": "The whole spoon holds one shape, and one volume.", "screen": "[chips: ONE SHAPE, ONE VOLUME]"}, {"say": "Now consider an ice cube dropped into a glass of juice.", "screen": "[ice cube drops into juice]"}, {"say": "Ice is a solid.", "screen": "[magnifier on the cube: the same particle box]"}, {"say": "Its particles cannot move past their neighbors.", "screen": "[a circle blocked]"}, {"say": "So the cube keeps its shape.", "screen": "[cube floats, unchanged]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses the spoon and the particle box]"}, {"say": "In a solid the particles are packed tightly, touching, in fixed positions, and each one vibrates on the spot.", "screen": "[rule text]"}, {"say": "That is why a solid keeps its shape and its volume.", "screen": "[spoon]"}, {"say": "Back to the spoon: its particles cannot move past one another, so it stays spoon-shaped in the cup, the bowl and the pitcher.", "screen": "[spoon in the three containers]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A glass marble keeps its shape and its volume in any container. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["It keeps its shape and its volume.", "A liquid takes its container's shape.", "A gas spreads out."], "why": "The marble keeps its own shape and volume.<br>So the marble is a solid."}, {"type": "mcq", "tag": "what", "stem": "How are the particles in a solid arranged?", "options": ["touching, with no fixed positions", "touching, in fixed positions", "far apart, with empty space between them"], "key": 1, "fb": ["That is a liquid. In a solid the particles have fixed positions.", "In a solid the particles are packed tightly, touching, in fixed positions.", "That is a gas. In a solid the particles are touching."], "why": "In a solid the particles are packed tightly, touching, in fixed positions."}, {"type": "frq", "tag": "why", "task": "A brick is lifted from a table and put in a bucket. It stays brick-shaped. Explain why the brick keeps its shape.", "starter": "The brick keeps its shape because…", "model": "The brick keeps its shape because a brick is a solid.<br>In a solid the particles are packed tightly, touching, in fixed positions.<br>Each particle vibrates on the spot.<br>No particle can move past its neighbors.<br>So the whole brick holds one shape.", "points": ["the particles are touching, in fixed positions", "each particle vibrates on the spot (it does not move away)", "no particle can move past its neighbors, so the shape holds"]}, {"type": "mcq", "tag": "misconception", "stem": "Ava says: \"The particles in a block of wood do not move at all.\" Is Ava correct?", "options": ["yes", "no"], "key": 1, "fb": ["The particles in a solid vibrate on the spot.", "The particles in a solid vibrate on the spot."], "why": "Particles are always moving.<br>In a solid each particle vibrates on the spot.<br>It shakes back and forth but stays in its place."}, {"type": "mcq", "tag": "transfer", "stem": "A stone lies on a path. Which statement about its particles is correct?", "options": ["They slide past one another.", "They fly around inside the stone.", "They vibrate on the spot."], "key": 2, "fb": ["That is a liquid. A stone is a solid.", "That is a gas. A stone is a solid.", "A stone is a solid, so its particles vibrate on the spot."], "why": "A stone is a solid.<br>In a solid the particles are in fixed positions, and each particle vibrates on the spot."}, {"type": "mcq", "tag": "fluency", "stem": "A coin lies on a table. How are its particles arranged?", "options": ["far apart", "touching, in fixed positions", "touching, sliding past one another"], "key": 1, "fb": ["That is a gas.", "A coin is a solid: touching, in fixed positions.", "That is a liquid."], "why": "A coin is a solid.<br>In a solid the particles are packed tightly, touching, in fixed positions."}, {"type": "mcq", "tag": "fluency", "stem": "True or false: the particles in a rock are completely still.", "options": ["true", "false"], "key": 1, "fb": ["Each particle vibrates on the spot.", "Each particle vibrates on the spot."], "why": "In a solid each particle vibrates on the spot. It never stops moving."}, {"type": "mcq", "tag": "fluency", "stem": "Why does a metal key keep its shape in your pocket?", "options": ["Its particles cannot move past their neighbors.", "Its particles are far apart.", "Its particles slide past one another."], "key": 0, "fb": ["Fixed positions, so the shape holds.", "That is a gas.", "That is a liquid."], "why": "In a solid the particles are in fixed positions.<br>No particle can move past its neighbors.<br>So the key holds one shape."}, {"type": "mcq", "tag": "fluency", "stem": "A wooden ruler is a solid. What does each of its particles do?", "options": ["It flies in every direction.", "It slides past its neighbors.", "It vibrates on the spot."], "key": 2, "fb": ["That is a gas.", "That is a liquid.", "In a solid each particle vibrates on the spot."], "why": "Wood is a solid.<br>Each particle vibrates on the spot."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In a solid, what does each particle do?", "options": ["It vibrates on the spot.", "It slides past its neighbors.", "It flies in every direction."], "key": 0, "fb": ["The particles are in fixed positions and vibrate on the spot.", "That is a liquid.", "That is a gas."], "why": "In a solid the particles are in fixed positions.<br>Each particle vibrates on the spot."}]}, {"id": "L07", "atom": "MAT-017b", "title": "Why a liquid takes the shape of its container", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (the particle picture of a liquid)", "check_design": "Type (c) → what (arrangement), why (free response on shape, fresh case), a second why on volume (MCQ), student-claim misconception (particles far apart), transfer (fresh case). Recall MCQs first for L05 (a fresh liquid) and L06 (how solid particles move).", "headache": ["A student pours 250 mL of juice from a tall glass into a wide bowl.", "The juice flows and flattens.", "A steel spoon in the same bowl keeps its shape. It does not flow.", "Why can the juice change its shape while its volume stays 250 mL?"], "forest": ["In a liquid the particles still touch, but they have no fixed positions.", "The particles slide past one another.", "Sliding particles rearrange to fit the container, so the liquid takes its shape.", "The particles stay touching, so the liquid keeps its volume."], "article": [{"t": "idea", "text": "A student pours 250 mL of juice from a tall glass into a wide bowl."}, {"t": "idea", "text": "The juice flows and flattens."}, {"t": "idea", "text": "A steel spoon in the same bowl keeps its shape. It does not flow."}, {"t": "idea", "text": "Why can the juice change its shape, while its volume stays 250 mL?"}, {"t": "h", "text": "Zoom in on the juice"}, {"t": "idea", "text": "Put the solid box beside the juice."}, {"t": "fig", "key": "liquid_beside_solid", "cap": "The solid box beside the liquid box. In both, the particles touch. In the liquid they have no fixed positions and slide past one another."}, {"t": "idea", "text": "In a liquid the particles still touch."}, {"t": "idea", "text": "But they have no fixed positions."}, {"t": "idea", "text": "The particles slide past one another."}, {"t": "idea", "text": "Pour the juice into the bowl, and the sliding particles rearrange."}, {"t": "idea", "text": "They spread out until the juice matches the bowl's shape."}, {"t": "idea", "text": "So the liquid takes the shape of its container."}, {"t": "h", "text": "Keeping its volume"}, {"t": "idea", "text": "The particles stay touching the whole time."}, {"t": "idea", "text": "The particles do not spread apart."}, {"t": "idea", "text": "So the juice takes up the same space as before."}, {"t": "idea", "text": "The liquid keeps its volume: 250 mL in the glass, 250 mL in the bowl."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider honey poured slowly into a jar."}, {"t": "idea", "text": "Honey flows slowly."}, {"t": "idea", "text": "But honey is a liquid, so its particles touch and slide past one another."}, {"t": "idea", "text": "Its sliding particles still rearrange."}, {"t": "idea", "text": "So the honey takes the jar's shape."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a liquid the particles touch but have no fixed positions. They slide past one another. That is why a liquid takes the shape of its container but keeps its volume."}, {"t": "idea", "text": "Back to the juice."}, {"t": "idea", "text": "Its sliding particles rearranged to fit the bowl."}, {"t": "idea", "text": "They stayed touching."}, {"t": "idea", "text": "So the juice is still 250 mL."}], "script": [{"say": "Here is 250 milliliters of juice, poured from a tall glass into a wide bowl.", "screen": "[pour; juice flattens; label 250 mL]"}, {"say": "The juice flows and flattens, but a steel spoon in the bowl keeps its shape.", "screen": "[juice settles; spoon beside it, unchanged]"}, {"say": "So why can the juice change shape while its volume stays 250 milliliters?", "screen": "[question mark; label 250 mL on the bowl]"}, {"say": "Let's zoom in, with the solid box beside it.", "screen": "[solid box left; liquid box right]"}, {"say": "In a liquid the particles still touch.", "screen": "[chip on the liquid box: TOUCHING]"}, {"say": "But they have no fixed positions.", "screen": "[chip: NO FIXED POSITIONS; particles jumbled]"}, {"say": "The particles slide past one another.", "screen": "[one particle slides along a row; chip: SLIDE PAST]"}, {"say": "Pour the juice into the bowl, and the sliding particles rearrange until the juice matches the bowl's shape.", "screen": "[box tilts and widens; particles slide to fill the new "mcq", "tag": "what", "stem": "How are the particles in a liquid arranged?", "options": ["touching, in fixed positions", "far apart, with empty space between them", "touching, with no fixed positions"], "key": 2, "fb": ["That is a solid. In a liquid the particles have no fixed positions.", "That is a gas. In a liquid the particles touch.", "In a liquid the particles touch but have no fixed positions."], "why": "In a liquid the particles touch but have no fixed positions.<br>They slide past one another."}, {"type": "frq", "tag": "why", "task": "Milk is poured from a carton into a glass. The milk takes the shape of the glass. Explain why.", "starter": "The milk takes the shape of the glass because…", "model": "The milk takes the shape of the glass because milk is a liquid.<br>In a liquid the particles touch but have no fixed positions.<br>The particles slide past one another.<br>The sliding particles rearrange until the milk matches the shape of the glass.", "points": ["the particles have no fixed positions", "the particles slide past one another", "the sliding particles rearrange to fit the glass"]}, {"type": "mcq", "tag": "why", "stem": "Why does a liquid keep the same volume when it is poured into a different container?", "options": ["Its particles spread far apart.", "Its particles are in fixed positions.", "Its particles stay touching."], "key": 2, "fb": ["If the particles spread apart, the volume would grow. In a liquid they stay touching.", "That is a solid. A liquid's particles slide, but they stay touching.", "The particles stay touching, so the liquid takes up the same space."], "why": "In a liquid the particles slide past one another but stay touching.<br>They do not spread apart.<br>So the liquid takes up the same space in any container."}, {"type": "mcq", "tag": "misconception", "stem": "Noah says: \"A liquid can flow because its particles are far apart.\" Is Noah correct?", "options": ["yes", "no"], "key": 1, "fb": ["In a liquid the particles touch. Particles that are far apart make a gas, not a liquid. A liquid flows because its particles slide past one another.", "In a liquid the particles touch. They flow because they slide past one another."], "why": "In a liquid the particles touch.<br>They have no fixed positions, so they slide past one another.<br>That is why a liquid flows."}, {"type": "mcq", "tag": "transfer", "stem": "Melted chocolate is poured slowly into a mold and takes the mold's shape. Which statement about the chocolate's particles is correct?", "options": ["They are in fixed positions.", "They touch and slide past one another.", "They are far apart and fly in every direction."], "key": 1, "fb": ["That is a solid. The chocolate flows, so its particles are not fixed.", "Melted chocolate is a liquid, so its particles touch and slide past one another.", "That is a gas. The chocolate keeps its volume, so its particles touch."], "why": "Melted chocolate is a liquid.<br>Its particles touch but have no fixed positions, and they slide past one another."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In a liquid, the particles…", "options": ["touch and slide past one another.", "are far apart and fly."], "key": 0, "fb": ["That is why a liquid flows but keeps its volume.", "That is a gas. In a liquid the particles touch."], "why": "In a liquid the particles touch but have no fixed positions.<br>They slide past one another."}]}, {"id": "L08", "atom": "MAT-018b", "title": "Why a gas fills any container", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (the particle picture of a gas)", "check_design": "Type (c) → what (arrangement), why (free response, fresh case), student-claim misconception (particles grow), transfer (fresh case: air squeezes, water does not). Recall MCQs first for L05 (a fresh gas) and L07 (the liquid arrangement).", "headache": ["A sealed syringe holds 20 mL of air.", "Pull the plunger out, and the air spreads to fill 60 mL.", "Push the plunger in, and the same air squeezes into 10 mL.", "Where did the air go when the space grew?", "How did the same air fit into less?"], "forest": ["In a gas the particles are far apart, with empty space between them.", "The particles fly fast in every direction.", "Nothing holds them together, so they keep going until they hit the walls.", "The particles themselves stay the same size."], "article": [{"t": "idea", "text": "A sealed syringe holds 20 mL of air."}, {"t": "idea", "text": "Pull the plunger out, and the air spreads to fill 60 mL."}, {"t": "idea", "text": "Push the plunger in, and the same air squeezes into 10 mL."}, {"t": "idea", "text": "Where did the air go when the space grew?"}, {"t": "idea", "text": "How did the same air fit into less?"}, {"t": "h", "text": "Zoom in on the air"}, {"t": "idea", "text": "Put the liquid box beside the air."}, {"t": "fig", "key": "gas_beside_liquid", "cap": "The liquid box beside the gas box. In the gas the particles are far apart, with empty space between them, and they fly fast in every direction."}, {"t": "idea", "text": "In a gas the particles are far apart, with empty space between them."}, {"t": "idea", "text": "The empty space is truly empty."}, {"t": "idea", "text": "There is nothing between the particles, not even air."}, {"t": "idea", "text": "The particles fly fast in every direction."}, {"t": "idea", "text": "Nothing holds them together."}, {"t": "idea", "text": "So the particles keep going until they hit the walls of the syringe."}, {"t": "h", "text": "Pull, then push"}, {"t": "idea", "text": "Pull the plunger out, and the walls are farther apart."}, {"t": "idea", "text": "The same particles fly into the bigger space and spread out through all of it."}, {"t": "idea", "text": "Push the plunger in, and the same particles crowd into the smaller space."}, {"t": "fig", "key": "syringe_particles", "cap": "The same six air particles in 60 mL and in 10 mL. The particles are the same size in both. Only the space between them changed."}, {"t": "idea", "text": "The particles themselves stay the same size."}, {"t": "idea", "text": "Only the empty space between them grows or shrinks."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a gas the particles are far apart with empty space between them. They fly fast in every direction. That is why a gas fills any container it is given."}, {"t": "idea", "text": "Back to the syringe: the same air particles spread into 60 mL and crowded into 10 mL."}, {"t": "idea", "text": "The particles never changed. The space between them did."}], "script": [{"say": "Here is a sealed syringe with 20 milliliters of air.", "screen": "[syringe at 20 mL]"}, {"say": "Pull the plunger out, and the air fills 60 milliliters.", "screen": "[plunger out to 60 mL]"}, {"say": "Push it in, and the same air fits into 10 milliliters.", "screen": "[plunger in to 10 mL]"}, {"say": "Where did the air go, and how did it fit into less? Let's zoom in.", "screen": "[question marks; liquid box left, gas box right]"}, {"say": "In a gas the particles are far apart, with empty space between them.", "screen": "[chip: FAR APART; the gaps highlighted]"}, {"say": "That space is truly empty: nothing is between the particles, not even air.", "screen": "[chip: EMPTY SPACE; gap highlighted, blank]"}, {"say": "The particles fly fast in every direction.", "screen": "[particles shoot across the box; chip: FLY FAST]"}, {"say": "Nothing holds them together, so they keep going until they hit a wall.", "screen": "[particles bounce off the box walls]"}, {"say": "Now watch six air particles in the syringe.", "screen": "[syringe barrel with 6 particles]"}, {"say": "Pull the plunger out, and the same six spread through the bigger space.", "screen": "[plunger out; particles spread to fill 60 mL]"}, {"say": "Push it in, and the same six crowd into the smaller space.", "screen": "[plunger in; particles crowd into 10 mL]"}, {"say": "The particles stay the same size; only the empty space between them grows or
