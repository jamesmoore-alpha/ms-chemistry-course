k": "A little air is let out of a bicycle tire into an empty, sealed bottle. The air spreads out to fill the whole bottle. Explain why.", "starter": "The air fills the whole bottle because…", "model": "The air fills the whole bottle because air is a gas.<br>In a gas the particles are far apart, with empty space between them.<br>The particles fly fast in every direction.<br>Nothing holds them together, so they keep going until they hit the walls of the bottle.", "points": ["the particles are far apart with empty space between them", "the particles fly fast in every direction", "nothing holds them together, so they reach every wall"]}, {"type": "mcq", "tag": "misconception", "stem": "A balloon is blown up. Zoe says: \"The air particles inside grew bigger to fill the balloon.\" Is Zoe correct?", "options": ["yes", "no"], "key": 1, "fb": ["The particles stay the same size. They spread out, with more empty space between them.", "The particles stay the same size. They spread out, with more empty space between them."], "why": "The particles stay the same size.<br>The particles fly apart.<br>So the empty space between them grows.<br>That is how the gas fills the bigger space."}, {"type": "mcq", "tag": "transfer", "stem": "A sealed plastic bottle full of air can be squashed. The same bottle full of water cannot. Why can the air be squeezed?", "options": ["The air particles are smaller than the water particles.", "There is empty space between the air particles for them to move into.", "The air particles are softer than the water particles."], "key": 1, "fb": ["The size of the particles is not the reason. The air particles have empty space between them to move into.", "Squashing the bottle moves the air particles into the empty space between them. Water particles are already touching.", "Particles do not squash. The air particles have empty space between them to move into."], "why": "In a gas the particles are far apart with empty space between them.<br>Squashing the bottle moves the particles into that space.<br>In a liquid the particles are already touching, so there is no space to push them into."}, {"type": "mcq", "tag": "fluency", "stem": "A little perfume gas is released into an empty sealed box. Where do its particles go?", "options": ["They fill the whole box.", "They sink to the bottom.", "They stay in one corner."], "key": 0, "fb": ["Gas particles fly in every direction until they hit the walls.", "Gas particles fly in every direction, not only down.", "Nothing holds gas particles together."], "why": "In a gas the particles fly fast in every direction.<br>Nothing holds them together, so they reach every wall."}, {"type": "mcq", "tag": "fluency", "stem": "True or false: the space between gas particles is filled with air.", "options": ["true", "false"], "key": 1, "fb": ["The space between gas particles is empty.", "The space between gas particles is empty."], "why": "The empty space between gas particles is truly empty. There is nothing between them, not even air."}, {"type": "mcq", "tag": "fluency", "stem": "A foot pump squashes air into a smaller space. What changed about the air particles?", "options": ["They are closer together.", "They are smaller.", "There are fewer of them."], "key": 0, "fb": ["The same particles crowd into the smaller space.", "Particles do not shrink.", "No particle left the pump."], "why": "The same particles now sit closer together.<br>Only the empty space between them shrank."}, {"type": "mcq", "tag": "fluency", "stem": "How are the particles in a gas arranged?", "options": ["touching, in fixed positions", "touching, sliding", "far apart, with empty space between them"], "key": 2, "fb": ["That is a solid.", "That is a liquid.", "In a gas the particles are far apart."], "why": "In a gas the particles are far apart, with empty space between them."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "When the plunger was pushed in, what happened to the air particles?", "options": ["They moved closer together.", "They got smaller."], "key": 0, "fb": ["The same particles crowded into the smaller space.", "Particles do not shrink. They moved closer together."], "why": "The particles stay the same size.<br>Only the empty space between them shrank."}]}, {"id": "L09", "atom": "MAT-019", "title": "Rank the states by kinetic energy", "video": "definitely a video", "lesson_type": "Procedural / comparison lesson (a ranking routine on the three boxes); coins the term kinetic energy", "check_design": "Type (a) one-step comparison → one recall MCQ (which state's particles fly), the coined term straight away (definition MCQ + typed), then a fluency quiz on six fresh pairs (which has particles with more kinetic energy), then most and least as two plain items.", "headache": ["Three particle boxes sit side by side: ice, water and steam.", "Ice, liquid water and steam are all water.", "In one box the particles vibrate on the spot.", "In one they slide.", "In one they fly.", "Which particles carry the most energy of movement?"], "forest": ["Energy of movement is called kinetic energy.", "Gas particles fly fastest, so they have the most kinetic energy.", "Liquid particles slide, so they have less.", "Solid particles only vibrate, so they have the least."], "article": [{"t": "idea", "text": "Three particle boxes sit side by side: ice, water and steam."}, {"t": "idea", "text": "Ice, liquid water and steam are all water."}, {"t": "idea", "text": "Freezing water makes ice. Boiling water makes steam."}, {"t": "idea", "text": "So all three boxes hold the same water particles."}, {"t": "fig", "key": "three_boxes", "cap": "The same particles in three states. In the solid they vibrate on the spot. In the liquid they slide. In the gas they fly."}, {"t": "idea", "text": "In the ice, each particle vibrates on the spot."}, {"t": "idea", "text": "In the water, the particles slide past one another."}, {"t": "idea", "text": "In the steam, the particles fly fast in every direction."}, {"t": "idea", "text": "Which particles carry the most energy of movement?"}, {"t": "h", "text": "Energy of movement"}, {"t": "idea", "text": "A moving particle has energy because it is moving."}, {"t": "idea", "text": "Energy of movement is called <b>kinetic energy<\/b>."}, {"t": "idea", "text": "The faster a particle moves, the more kinetic energy it has."}, {"t": "idea", "text": "Gas particles fly fastest, so gas particles have the most kinetic energy."}, {"t": "idea", "text": "Liquid particles slide, so liquid particles have less kinetic energy than gas particles."}, {"t": "idea", "text": "Solid particles only vibrate on the spot, so solid particles have the least kinetic energy."}, {"t": "h", "text": "The comparison as a table"}, {"t": "fig", "key": "states_table", "cap": "The three states compared: how the particles are arranged, how they move, and how much kinetic energy they have."}, {"t": "idea", "text": "The order from least to most kinetic energy is solid, liquid, gas."}, {"t": "idea", "text": "The same order holds for any substance."}, {"t": "idea", "text": "Now consider wax."}, {"t": "idea", "text": "Wax can be a solid, a liquid or a gas. Wax as a gas is called wax vapor."}, {"t": "idea", "text": "The wax vapor's particles have the most kinetic energy."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Energy of movement is called kinetic energy. Solid, liquid and gas run from least to most kinetic energy."}, {"t": "idea", "text": "Back to the three boxes: the flying steam particles carry the most kinetic energy, and the vibrating ice particles the least."}], "script": [{"say": "Here are three particle boxes: ice, water and steam.", "screen": "[three boxes; labels]"}, {"say": "Ice, liquid water and steam are all water, so all three boxes hold the same water particles.", "screen": "[chip: SAME PARTICLES]"}, {"say": "In the ice, each particle vibrates on the spot.", "screen": "[solid box jiggles]"}, {"say": "In the water, the particles slide past one another.", "screen": "[liquid box slides]"}, {"say": "In the steam, the particles fly fast in every direction.", "screen": "[gas box: particles shoot and bounce]"}, {"say": "Which particles carry the most energy of movement?", "screen": "[question mark]"}, {"say": "A moving particle has energy because it is moving.", "screen": "[one flying particle highlighted]"}, {"say": "Energy of movement is called kinetic energy.", "screen": "[chip: KINETIC ENERGY = ENERGY OF MOVEMENT]"}, {"say": "The faster a particle moves, the more kinetic energy it has.", "screen": "[short arrow, then long arrow; bar grows]"}, {"say": "Gas particles fly fastest, so they have the most kinetic energy.", "screen": "[gas box: bar MOST]"}, {"say": "Liquid particles slide, so they have less.", "screen": "[liquid box: bar shorter]"}, {"say": "Solid particles only vibrate on the spot, so they have the least.", "screen": "[solid box: bar shortest, LEAST]"}, {"say": "From least to most kinetic energy: solid, liquid, gas.", "screen": "[the three bars line up in order]"}, {"say": "The same order holds for any substance, like wax.", "screen": "[labels change to solid wax, liquid wax, wax vapor; bars unchanged]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses the three boxes]"}, {"say": "Energy of movement is called kinetic energy.", "screen": "[rule text line 1]"}, {"say": "Solid, liquid and gas run from least to most kinetic energy.", "screen": "[rule text line 2]"}, {"say": "Back to the three boxes: the flying steam particles carry the most kinetic energy, and the vibrating ice particles the least.", "screen": "[three boxes with bars]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In which state do the particles fly fast in every direction?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["In a solid the particles vibrate on the spot.", "In a liquid the particles slide past one another.", "In a gas the particles fly fast in every direction."], "why": "In a gas the particles are far apart and fly fast in every direction."}, {"type": "text", "tag": "term", "stem": "What is the scientific name for the energy of movement?", "accept": ["kinetic energy", "kinetic"], "why": "Energy of movement is called kinetic energy."}, {"type": "mcq", "tag": "term", "stem": "What is kinetic energy?", "options": ["energy of heat", "energy of movement", "energy stored in a battery"], "key": 1, "fb": ["Kinetic energy is the energy of movement.", "Energy of movement is called kinetic energy.", "Kinetic energy is the energy of movement."], "why": "Energy of movement is called kinetic energy."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: solid chocolate or melted chocolate?", "options": ["solid chocolate", "melted chocolate"], "key": 1, "fb": ["Solid particles only vibrate on the spot.", "Liquid particles slide; solid particles only vibrate."], "why": "Liquid particles have more kinetic energy than solid particles.<br>So the melted chocolate's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: oxygen gas or liquid oxygen?", "options": ["oxygen gas", "liquid oxygen"], "key": 0, "fb": ["Gas particles fly fastest.", "Liquid particles slide; gas particles fly."], "why": "Gas particles have more kinetic energy than liquid particles.<br>So the oxygen gas's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: liquid iron in a furnace or a solid iron bar?", "options": ["the solid iron bar", "the liquid iron"], "key": 1, "fb": ["Solid particles only vibrate on the spot.", "Liquid particles slide; solid particles only vibrate."], "why": "Liquid particles have more kinetic energy than solid particles.<br>So the liquid iron's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: solid rock or melted rock (lava)?", "options": ["melted rock", "solid rock"], "key": 0, "fb": ["Liquid particles slide; solid particles only vibrate.", "Solid particles only vibrate on the spot."], "why": "Liquid particles have more kinetic energy than solid particles.<br>So the melted rock's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: dry ice (solid carbon dioxide) or carbon dioxide gas?", "options": ["dry ice", "carbon dioxide gas"], "key": 1, "fb": ["Solid particles only vibrate on the spot.", "Gas particles fly fastest."], "why": "Gas particles have the most kinetic energy.<br>So the carbon dioxide gas's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which has particles with more kinetic energy: liquid nitrogen or nitrogen gas?", "options": ["liquid nitrogen", "nitrogen gas"], "key": 1, "fb": ["Liquid particles slide; gas particles fly.", "Gas particles fly fastest."], "why": "Gas particles have more kinetic energy than liquid particles.<br>So the nitrogen gas's particles have more."}, {"type": "mcq", "tag": "fluency", "stem": "Which state has particles with the most kinetic energy?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["Solid particles have the least.", "Liquid particles are in the middle.", "Gas particles fly fastest and have the most."], "why": "Gas particles fly fastest, so gas particles have the most kinetic energy."}, {"type": "mcq", "tag": "fluency", "stem": "Which state has particles with the least kinetic energy?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["Solid particles only vibrate, so they have the least.", "Liquid particles are in the middle.", "Gas particles have the most."], "why": "Solid particles only vibrate on the spot, so solid particles have the least kinetic energy."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Which state has particles with the most kinetic energy?", "options": ["solid", "liquid", "gas"], "key": 2, "fb": ["Solid particles only vibrate.", "Liquid particles slide.", "Gas particles fly fastest."], "why": "Gas particles fly fastest, so they have the most kinetic energy."}]}, {"id": "L10", "atom": "MAT-019b", "title": "Why gas particles have the most kinetic energy", "video": "could do without a video", "lesson_type": "Why / mechanism lesson (builds on L04 and L09)", "check_design": "Type (c) → what (fresh case), why (free response), student-claim misconception (more particles), transfer. Recall MCQs first for L04 (heating speeds particles) and L09 (kinetic energy).", "headache": ["A pan holds cold water at 20 °C.", "The burner heats it.", "At 100 °C steam rises off the pan.", "In the cold water the particles slid past one another.", "In the steam they fly.", "Where did the extra energy of movement come from?"], "forest": ["The faster a particle moves, the more kinetic energy it has.", "Heating gives particles energy and speeds them up.", "A gas has taken in more energy than the same substance as a liquid or a solid.", "So its particles move fastest and carry the most kinetic energy."], "article": [{"t": "idea", "text": "A pan holds cold water at 20 °C."}, {"t": "idea", "text": "The burner heats it."}, {"t": "idea", "text": "At 100 °C, steam rises off the pan."}, {"t": "fig", "key": "pan_steam", "cap": "Water boiling in a pan. The liquid particles touch and slide past one another. The steam particles above fly in every direction."}, {"t": "idea", "text": "In the cold water, the particles slid past one another."}, {"t": "idea", "text": "In the steam, the same kind of particles fly."}, {"t": "idea", "text": "Where did the extra energy of movement come from?"}, {"t": "h", "text": "Where the energy came from"}, {"t": "idea", "text": "The faster a particle moves, the more kinetic energy it has."}, {"t": "idea", "text": "Heating gives particles energy and speeds them up."}, {"t": "idea", "text": "The burner gave energy to the water particles, minute after minute."}, {"t": "idea", "text": "The particles moved faster and faster."}, {"t": "idea", "text": "The particles that became steam took in the most energy."}, {"t": "idea", "text": "So they move fastest, and carry the most kinetic energy."}, {"t": "h", "text": "Any substance"}, {"t": "idea", "text": "The same holds for any substance."}, {"t": "idea", "text": "A gas has taken in more energy than the same substance as a liquid."}, {"t": "idea", "text": "A liquid has taken in more energy than the same substance as a solid."}, {"t": "idea", "text": "So gas particles have more kinetic energy than liquid particles, and liquid particles have more than solid particles."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Heating gives particles energy and speeds them up. A gas has taken in the most energy, so its particles move fastest and have the most kinetic energy."}, {"t": "idea", "text": "Back to the pan: the burner's energy went into the water particles."}, {"t": "idea", "text": "The particles that took in the most energy now fly as steam, with the most kinetic energy."}], "script": [{"say": "Here is a pan of cold water at 20 degrees Celsius on a stove.", "screen": "[pan; label 20 °C]"}, {"say": "The burner heats it.", "screen": "[flame; thermometer rises]"}, {"say": "At 100 degrees, steam rises off the pan.", "screen": "[label 100 °C; steam rises]"}, {"say": "In the cold water the particles slid past one another.", "screen": "[magnifier on the water: liquid box]"}, {"say": "In the steam the same kind of particles fly.", "screen": "[magnifier on the steam: gas box]"}, {"say": "Where did the extra energy of movement come from?", "screen": "[question mark]"}, {"say": "The faster a particle moves, the more kinetic energy it has.", "screen": "[short arrow, long arrow; bar grows]"}, {"say": "Heating gives particles energy and speeds them up.", "screen": "[flame; arrows lengthen]"}, {"say": "The burner gave energy to the water particles, minute after minute.", "screen": "[clock; arrows lengthen step by step]"}, {"say": "The particles that became steam took in the most energy.", "screen": "[fast particles leave the surface]"}, {"say": "So they move fastest, and carry the most kinetic energy.", "screen": "[gas box bar: MOST]"}, {"say": "The same holds for any substance: a gas has taken in more energy than the same substance as a liquid, and a liquid more than a solid.", "screen": "[labels swap to wax; three bars]"}, {"say": "So here is the rule.", "screen": "[rule slide reuses the pan]"}, {"say": "Heating gives particles energy and speeds them up.", "screen": "[rule text line 1]"}, {"say": "A gas has taken in the most energy, so its particles move fastest and have the most kinetic energy.", "screen": "[rule text line 2]"}, {"say": "Back to the pan: the burner's energy went into the water particles.", "screen": "[pan; flame]"}, {"say": "The particles that took in the most now fly as steam, with the most kinetic energy.", "screen": "[steam particles flying]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Milk is warmed from 5 °C to 60 °C. What happens to the speed of its particles?", "options": ["They move more slowly.", "Their speed does not change.", "They move faster."], "key": 2, "fb": ["Heating speeds particles up.", "Heating changes the speed of the particles.", "Heating makes particles move faster."], "why": "Heating makes particles move faster."}, {"type": "mcq", "tag": "recall", "stem": "What is kinetic energy?", "options": ["energy of heat", "energy of movement", "energy stored in a battery"], "key": 1, "fb": ["Kinetic energy is the energy of movement.", "Energy of movement is called kinetic energy.", "Kinetic energy is the energy of movement."], "why": "Energy of movement is called kinetic energy."}, {"type": "mcq", "tag": "what", "stem": "A drop of rubbing alcohol on a desk turns into a gas within a minute. Which have more kinetic energy: the gas particles or the liquid particles?", "options": ["the liquid particles", "they have the same", "the gas particles"], "key": 2, "fb": ["The liquid particles slide; the gas particles fly faster.", "The gas particles move faster, so they have more.", "The gas particles move fastest."], "why": "The gas particles fly faster than the sliding liquid particles.<br>Faster particles have more kinetic energy."}, {"type": "frq", "tag": "why", "task": "Ice is heated. It melts into water, and the water then boils into steam. Explain why the steam particles have more kinetic energy than the ice particles.", "starter": "The steam particles have more kinetic energy because…", "model": "The steam particles have more kinetic energy because they move faster.<br>Heating gives particles energy and speeds them up.<br>The steam has taken in more energy than the ice.<br>So the steam particles move faster and carry more kinetic energy.", "points": ["the steam particles move faster", "heating gives particles energy and speeds them up", "the steam has taken in more energy than the ice"]}, {"type": "mcq", "tag": "misconception", "stem": "Eli says: \"Steam has more kinetic energy than liquid water because steam has more particles.\" Is Eli correct?", "options": ["yes", "no"], "key": 1, "fb": ["The steam's particles have more kinetic energy because each one moves faster, not because there are more of them.", "The steam's particles have more kinetic energy because each one moves faster, not because there are more of them."], "why": "The steam particles have more kinetic energy because they move faster.<br>Heating gave them more energy.<br>The number of particles is not the reason."}, {"type": "mcq", "tag": "transfer", "stem": "A candle burns. Some of its solid wax melts into liquid wax. Which has particles with more kinetic energy?", "options": ["the solid wax", "the liquid wax", "they have the same"], "key": 1, "fb": ["The solid wax particles only vibrate on the spot.", "The liquid wax has taken in energy from the flame, so its particles move faster.", "The liquid wax particles move faster, so they have more."], "why": "The flame gave energy to the wax particles and sped them up.<br>The liquid wax has taken in more energy than the solid wax.<br>So its particles have more kinetic energy."}, {"type": "mcq", "tag": "fluency", "stem": "A puddle dries up in the sun and its water becomes a gas. Which has more kinetic energy per particle: the gas or the puddle water?", "options": ["the puddle water", "the gas"], "key": 1, "fb": ["Liquid particles slide; gas particles fly faster.", "The gas particles took in energy from the sun and move faster."], "why": "The sun gave the water particles energy.<br>The particles that became gas move fastest and have the most kinetic energy."}, {"type": "mcq", "tag": "fluency", "stem": "Why do gas particles have more kinetic energy than liquid particles of the same substance?", "options": ["They have taken in more energy and move faster.", "There are more of them.", "They are bigger."], "key": 0, "fb": ["Heating gives particles energy and speeds them up.", "The number of particles is not the reason.", "Particles do not change size."], "why": "Heating gives particles energy and speeds them up.<br>The gas has taken in more energy, so its particles move faster."}, {"type": "mcq", "tag": "fluency", "stem": "True or false: heating a substance gives its particles more kinetic energy.", "options": ["true", "false"], "key": 0, "fb": ["Heating speeds particles up, and faster particles have more kinetic energy.", "Heating speeds particles up, and faster particles have more kinetic energy."], "why": "Heating gives particles energy and speeds them up.<br>Faster particles have more kinetic energy."}, {"type": "mcq", "tag": "fluency", "stem": "Solid chocolate melts in the sun. Which has particles with more kinetic energy: the melted chocolate or the solid chocolate?", "options": ["the solid chocolate", "the melted chocolate"], "key": 1, "fb": ["Solid particles only vibrate on the spot.", "The melted chocolate took in energy from the sun, so its particles move faster."], "why": "The sun gave the chocolate's particles energy and sped them up.<br>The melted chocolate's particles have more kinetic energy."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Where did the steam particles' extra energy come from?", "options": ["the burner", "the metal of the pan", "the air in the kitchen"], "key": 0, "fb": ["The burner gave energy to the water particles.", "The pan only passed the burner's heat on.", "The kitchen air was cooler than the steam."], "why": "The burner gave energy to the water particles and sped them up."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-001", "stem": "Anything that has mass and takes up space is called…", "accept": ["matter"], "why": "Anything that has mass and takes up space is called matter."}, {"type": "text", "tag": "term", "atom": "MAT-002", "stem": "All matter is made of tiny pieces far too small to see. Scientists call these pieces…", "accept": ["particles", "particle"], "why": "All matter is made of particles too small to see."}, {"type": "text", "tag": "term", "atom": "MAT-019", "stem": "The energy something has because it is moving is called…", "accept": ["kinetic energy", "kinetic"], "why": "Energy of movement is called kinetic energy."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-016", "stem": "A bar of soap keeps its shape and its volume in a dish, a bag or a hand. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 0, "fb": ["It keeps its shape and its volume.", "A liquid takes its container's shape.", "A gas spreads out."], "why": "The soap keeps its own shape and volume.<br>So the soap is a solid."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-004", "stem": "A bowl of soup cools from 70 °C to 30 °C. What happens to the speed of its particles?", "options": ["They move faster.", "They stop moving.", "They move more slowly."], "key": 2, "fb": ["Cooling slows particles down.", "Particles never stop moving.", "Cooling makes particles move more slowly."], "why": "Cooling a substance makes its particles move more slowly."}, {"type": "frq", "tag": "mixed", "atom": "MAT-003", "task": "A bag of popcorn is opened in a quiet movie theater. Two minutes later, people ten rows away can smell it. Explain how the smell reached them.", "starter": "The smell reached them because…", "model": "The smell reached them because popcorn particles left the open bag.<br>Particles are always moving.<br>The popcorn particles bumped into air particles and kept moving in every direction.<br>They spread through the movie theater until they reached the people ten rows away.", "points": ["particles leave the bag", "particles are always moving", "the particles spread through the air to the people"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-018b", "stem": "A puff of gas from a stove escapes into a kitchen. Why does the gas spread through the whole kitchen?", "options": ["Its particles slide past one another.", "Its particles fly fast in every direction.", "Its particles are in fixed positions."], "key": 1, "fb": ["That is a liquid. Gas particles fly, they do not slide.", "In a gas the particles fly fast in every direction until they hit the walls.", "That is a solid. Gas particles are far apart and moving."], "why": "In a gas the particles are far apart and fly fast in every direction.<br>Nothing holds them together, so they spread until they reach the walls."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-016", "stem": "Vinegar poured from a bottle into a dish takes the dish's shape and stays 100 mL. Solid, liquid or gas?", "options": ["solid", "liquid", "gas"], "key": 1, "fb": ["A solid keeps its own shape.", "It takes the container's shape but keeps its volume.", "A gas does not keep its volume."], "why": "The vinegar takes the dish's shape but keeps its volume.<br>So the vinegar is a liquid."}, {"type": "frq", "tag": "mixed", "atom": "MAT-017b", "task": "Syrup is poured from a bottle onto a plate. It spreads out and takes the shape of the plate. Explain why.", "starter": "The syrup takes the shape of the plate because…", "model": "The syrup takes the shape of the plate because syrup is a liquid.<br>In a liquid the particles touch but have no fixed positions.<br>The particles slide past one another.<br>The sliding particles rearrange until the syrup matches the shape of the plate.", "points": ["the particles have no fixed positions", "the particles slide past one another", "the sliding particles rearrange to fit the plate"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-019b", "stem": "Solid butter melts in a warm pan. Which has particles with more kinetic energy?", "options": ["the solid butter", "they have the same", "the melted butter"], "key": 2, "fb": ["Solid particles only vibrate on the spot.", "The melted butter's particles move faster.", "The melted butter has taken in energy from the pan, so its particles move faster."], "why": "Heating gives particles energy and speeds them up.<br>The melted butter has taken in more energy, so its particles have more kinetic energy."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-016b", "stem": "Which statement about the particles in a solid gold ring is correct?", "options": ["They slide past one another.", "They vibrate on the spot in fixed positions.", "They are far apart and fly in every direction."], "key": 1, "fb": ["That is a liquid.", "In a solid the particles are in fixed positions and vibrate on the spot.", "That is a gas."], "why": "Gold is a solid.<br>In a solid the particles are packed tightly, touching, in fixed positions, and each particle vibrates on the spot."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-001", "stem": "Which of these is NOT matter?", "options": ["a drop of rain", "the air in a tire", "the sound of a bell"], "key": 2, "fb": ["A drop of rain has mass and takes up space.", "Air has mass and takes up space.", "A sound has no mass and takes up no space."], "why": "A sound has no mass and takes up no space, so a sound is not matter.<br>Rain and air both have mass and take up space."}], "pp100": [{"d": "easy", "atom": "MAT-001", "stem": "Which of the following is matter?", "options": ["a shout", "a rock", "the light from the sun", "a shadow"], "key": 1, "why": "A rock has mass and takes up space, so a rock is matter.<br>A shout, light and a shadow have no mass and take up no space."}, {"d": "easy", "atom": "MAT-002", "stem": "A lump of clay is made of…", "options": ["one single piece with nothing smaller inside it", "tiny pieces you can see with a magnifying glass", "particles far too small to see", "particles you can see if you look closely"], "key": 2, "why": "All matter is made of particles far too small to see.<br>Clay is matter, so clay is made of particles."}, {"d": "easy", "atom": "MAT-016", "stem": "Which state of matter keeps its own volume but takes the shape of its container?", "options": ["a solid", "a liquid", "a gas", "both a liquid and a gas"], "key": 1, "why": "A liquid keeps its own volume but takes the shape of its container.<br>A gas keeps neither its shape nor its volume."}, {"d": "easy", "atom": "MAT-016", "stem": "Paint is poured from a can into a flat tray. The paint spreads out across the tray, and a measuring cup shows its volume has not changed. The paint is…", "options": ["a solid", "a gas", "a solid in the can and a liquid in the tray", "a liquid"], "key": 3, "why": "The paint takes the shape of its container but keeps its volume.<br>That is the test for a liquid."}, {"d": "easy", "atom": "MAT-016b", "stem": "Which statement about the particles in a brick is correct?", "options": ["They are touching and in fixed positions.", "They are touching and slide past one another.", "They are far apart and in fixed positions.", "They are far apart and fly in every direction."], "key": 0, "why": "A brick is a solid.<br>In a solid the particles are packed tightly, touching, in fixed positions."}, {"d": "easy", "atom": "MAT-004", "stem": "Two pans hold water, one at 20 °C and one at 70 °C. Which statement about their particles is correct?", "options": ["The particles in the 20 °C water move faster.", "The particles in both pans move at the same speed.", "The particles in the 70 °C water move faster.", "The particles in the 70 °C water are bigger."], "key": 2, "why": "A higher temperature means the particles are moving faster.<br>The particles stay the same size."}, {"d": "easy", "atom": "MAT-019", "stem": "In one sample of a substance the particles slide past one another. Compared with the same substance as a gas, these particles have…", "options": ["more kinetic energy", "the same kinetic energy", "no kinetic energy", "less kinetic energy"], "key": 3, "why": "Sliding particles are a liquid.<br>Gas particles fly fastest, so liquid particles have less kinetic energy than gas particles."}, {"d": "easy", "atom": "MAT-001", "stem": "Which of the following is matter?", "options": ["the beam from a flashlight", "a snowflake", "an echo", "the warmth of a campfire"], "key": 1, "why": "A snowflake has mass and takes up space.<br>So a snowflake is matter.<br>A beam of light, an echo and warmth have no mass and take up no space.<br>So they are not matter."}, {"d": "easy", "atom": "MAT-002", "stem": "A glass window looks like one smooth, solid sheet. What is the glass made of?", "options": ["particles far too small to see", "one piece with nothing smaller inside it", "particles just big enough to see with a magnifying glass", "pieces that appear only when the glass breaks"], "key": 0, "why": "A glass window is matter.<br>All matter is made of particles far too small to see.<br>The glass looks like one smooth sheet because its particles are too small to see, even through a magnifying glass.<br>The particles are there whether or not the glass breaks."}, {"d": "easy", "atom": "MAT-003", "stem": "A bottle of ketchup sits unopened in a cupboard for a month. Which statement about the ketchup's particles is correct?", "options": ["They stopped moving once the ketchup settled down.", "They move only when someone shakes the bottle hard.", "They move only when the cupboard gets warm.", "They keep moving the whole time."], "key": 3, "why": "Particles never stop moving.<br>The ketchup looks still, but its particles keep moving the whole time.<br>Shaking or warming is not needed to make them move."}, {"d": "easy", "atom": "MAT-004", "stem": "A baked potato comes out of the oven at 90 °C. Twenty minutes later it is 30 °C. How do its particles move at 30 °C compared with at 90 °C?", "options": ["faster", "more slowly", "at the same speed", "not at all"], "key": 1, "why": "Cooling a substance makes its particles move more slowly.<br>The potato cools from 90 °C to 30 °C.<br>So its particles move more slowly at 30 °C than at 90 °C.<br>They never stop moving."}, {"d": "easy", "atom": "MAT-016", "stem": "Shampoo is poured from a bottle into a cupped hand. It spreads to the shape of the hand, and it is still 5 mL. Shampoo is…", "options": ["a solid", "a liquid", "a gas", "partly a solid and partly a liquid"], "key": 1, "why": "The shampoo takes the shape of the hand but keeps its volume.<br>That is the test for a liquid.<br>So shampoo is a liquid."}, {"d": "easy", "atom": "MAT-016b", "stem": "A brass doorknob is fixed to a door. What does each of its particles do?", "options": ["It slides past its neighbors.", "It vibrates on the spot.", "It flies in every direction.", "It stays completely still."], "key": 1, "why": "A brass doorknob is a solid.<br>In a solid the particles are packed tightly, touching, in fixed positions.<br>Each particle vibrates on the spot."}, {"d": "easy", "atom": "MAT-017b", "stem": "A lawn mower's tank holds gasoline. How are the gasoline's particles arranged?", "options": ["far apart, with no fixed positions", "some touching, some far apart", "touching, in fixed positions", "touching, with no fixed positions"], "key": 3, "why": "Gasoline pours and takes the shape of its tank, so gasoline is a liquid.<br>In a liquid the particles touch but have no fixed positions.<br>They slide past one another."}, {"d": "easy", "atom": "MAT-018b", "stem": "A sealed glass tube holds neon gas. What do the neon particles do?", "options": ["They vibrate on the spot.", "They slide past one another.", "They drift slowly to the bottom.", "They fly in every direction."], "key": 3, "why": "Neon is a gas.<br>In a gas the particles are far apart with empty space between them.<br>They fly fast in every direction until they hit the walls of the tube."}, {"d": "easy", "atom": "MAT-019", "stem": "A drop of liquid solder hangs from the end of a solid solder wire. Which has particles with more kinetic energy?", "options": ["the liquid solder", "the solid solder wire", "both have the same", "whichever has more solder in it"], "key": 0, "why": "Liquid particles slide past one another; solid particles only vibrate on the spot.<br>Sliding particles move faster than vibrating ones.<br>So the liquid solder's particles have more kinetic energy.<br>The amount of solder does not matter."}, {"d": "easy", "atom": "MAT-019b", "stem": "The same substance can be a solid, a liquid or a gas. In which state has it taken in the most energy?", "options": ["as a gas", "as a liquid", "as a solid", "the same in all three"], "key": 0, "why": "Heating gives particles energy and speeds them up.<br>A gas has taken in more energy than the same substance as a liquid.<br>A liquid has taken in more than the same substance as a solid.<br>So the gas has taken in the most."}, {"d": "easy", "atom": "MAT-016", "stem": "Natural gas leaks from a stove in a closed kitchen. Within minutes its smell has reached every corner of the kitchen. The natural gas in the kitchen is…", "options": ["a solid", "a liquid", "a gas", "not matter"], "key": 2, "why": "The natural gas spreads to fill the whole kitchen.<br>It keeps neither its own shape nor its own volume.<br>That is the test for a gas.<br>Natural gas has mass and takes up space, so it is matter."}, {"d": "medium", "atom": "MAT-003", "stem": "A bottle of nail-polish remover is opened in a small, still room. A minute later, the smell reaches the other side of the room. Why?", "options": ["Moving air carried the smell.", "The remover's particles moved through the air.", "Heat carried the smell.", "The remover's particles grew bigger until they reached the other side."], "key": 1, "why": "Particles left the open bottle.<br>Particles are always moving, so they spread through the air to the other side of the room."}, {"d": "medium", "atom": "MAT-017b", "stem": "Why does coffee take the shape of any cup it is poured into?", "options": ["Its particles are far apart.", "Each particle changes its shape.", "Its particles slide past one another.", "Its particles are in fixed positions."], "key": 2, "why": "In a liquid the particles have no fixed positions and slide past one another.<br>The sliding particles rearrange to fit the cup."}, {"d": "medium", "atom": "MAT-018b", "stem": "A sealed jar holds a little water at the bottom and air above it. The air fills all the rest of the jar. Why does the air spread through the whole space?", "options": ["The air particles fly fast in every direction.", "The air particles are bigger than the water particles.", "The air particles slide past one another.", "The air particles are in fixed positions."], "key": 0, "why": "In a gas the particles fly fast in every direction with nothing holding them together, so they reach every wall.<br>In a liquid the particles stay touching."}, {"d": "medium", "atom": "MAT-002", "stem": "A spoonful of bath salts is stirred into a bath and disappears. Where are the bath salts?", "options": ["They have turned into water.", "They have gone into the air.", "They have shrunk to nothing.", "They are in the water as particles too small to see."], "key": 3, "why": "The bath salts are still there.<br>They broke into particles far too small to see, and those particles spread through the water."}, {"d": "medium", "atom": "MAT-004", "stem": "A student wants a drop of dye to spread through a glass of still water as fast as possible, without stirring. What should she do to the water first?", "options": ["Cool it.", "Heat it.", "Nothing; the temperature makes no difference.", "Add more water."], "key": 1, "why": "Heating makes the water particles move faster.<br>Faster water particles knock the dye particles around faster, so the dye spreads sooner."}, {"d": "medium", "atom": "MAT-003", "stem": "Which statement about the particles in a glass of still water is correct?", "options": ["They stop moving when the water is still.", "They move only when the water is stirred.", "They move only when the water is heated.", "They are moving all the time."], "key": 3, "why": "Particles are always moving.<br>They never stop, even when the water looks still."}, {"d": "medium", "atom": "MAT-002", "stem": "Which statement about a single particle of flour is correct?", "options": ["It is the same size as a grain of flour.", "It can be seen with a magnifying glass.", "It is far too small to see.", "It can be seen with the eye if you look closely."], "key": 2, "why": "A single particle is far too small to see.<br>A grain of flour you can see is billions of particles packed together."}, {"d": "medium", "atom": "MAT-001", "stem": "A cloud is made of tiny drops of water. Is a cloud matter, and why?", "options": ["Yes, because a cloud has mass and takes up space.", "Yes, because a cloud can be seen from the ground.", "No, because nobody can hold a cloud in the hand.", "No, because a cloud floats high above the ground."], "key": 0, "why": "A cloud is made of drops of water.<br>Each drop has mass and takes up space.<br>Anything that has mass and takes up space is matter.<br>So a cloud is matter, whether or not anyone can hold it."}, {"d": "medium", "atom": "MAT-002", "stem": "A spoonful of sports-drink powder is stirred into 500 mL of water. The powder vanishes, and the water turns orange from top to bottom. Where is the powder?", "options": ["It has turned into extra water.", "It has sunk and stuck to the bottom.", "It is spread through the water as particles.", "It has left the glass and gone out into the air."], "key": 2, "why": "The water turns orange from top to bottom.<br>So the powder is still there, in every part of the water.<br>The powder broke into particles far too small to see.<br>Those particles spread through the water."}, {"d": "medium", "atom": "MAT-003", "stem": "On a windless day, a skunk sprays at the edge of a field. Where are the smell particles a few minutes later?", "options": ["They have spread out through the air.", "They hang in a thin layer just above the grass.", "They have settled onto the ground.", "They have risen straight up in a column."], "key": 0, "why": "Skunk spray gives off smell particles into the air.<br>Particles are always moving.<br>The smell particles bump into air particles and keep moving in every direction.<br>So they spread out through the air."}, {"d": "medium", "atom": "MAT-004", "stem": "In a pot of water at 20 °C, with no stirring, a bouillon cube's flavor takes 10 minutes to spread through all the water. The cook repeats this with water at 80 °C. About how long does the flavor take now?", "options": ["more than 10 minutes", "less than 10 minutes", "about 10 minutes", "it never spreads without stirring"], "key": 1, "why": "Heating makes particles move faster.<br>The water particles at 80 °C move faster than the water particles at 20 °C.<br>Faster water particles knock the flavor particles around faster.<br>So the flavor spreads through the 80 °C water in less than 10 minutes."}, {"d": "medium", "atom": "MAT-016b", "stem": "Why can't a stick of chalk be poured from one jar into another the way water can?", "options": ["Its particles are far apart from one another.", "Its particles do not move at all.", "Its particles are much bigger than water particles.", "Its particles cannot move past their neighbors."], "key": 3, "why": "Chalk is a solid.<br>In a solid the particles are touching, in fixed positions.<br>Each particle vibrates on the spot but cannot move past its neighbors.<br>So the chalk stays one stick and cannot flow like water."}, {"d": "medium", "atom": "MAT-017b", "stem": "A cook pours 300 mL of gravy from a pan into a pitcher. The gravy takes the pitcher's shape, but it is still 300 mL. Why does the gravy keep its volume?", "options": ["Its particles are fixed in place.", "Its particles spread far apart.", "Its particles stay touching one another.", "Its particles pack more tightly in the pitcher."], "key": 2, "why": "Gravy is a liquid.<br>In a liquid the particles slide past one another but stay touching.<br>They do not spread apart, and they do not pack more tightly.<br>So the gravy takes up the same space in the pitcher as in the pan."}, {"d": "medium", "atom": "MAT-018b", "stem": "An empty lunchbox is snapped shut. Air fills it from the lid to the bottom. Why doesn't the air collect at the bottom of the lunchbox?", "options": ["The air particles slide past one another.", "The air particles float up because air is light.", "The air particles are stuck to the lunchbox walls.", "The air particles fly in every direction."], "key": 3, "why": "Air is a gas.<br>In a gas the particles fly fast in every direction.<br>They keep flying until they hit the lid, a wall or the bottom, then bounce off.<br>So the air particles reach every part of the lunchbox and do not collect at the bottom."}, {"d": "medium", "atom": "MAT-019", "stem": "Some silver is a liquid. A second piece of silver has particles with less kinetic energy than the liquid silver's particles. What state is the second piece in?", "options": ["a solid", "a gas", "either a solid or a gas", "a liquid, in a smaller piece"], "key": 0, "why": "Solid particles only vibrate on the spot, so they have the least kinetic energy.<br>Liquid particles slide, so they have more.<br>Gas particles fly fastest, so they have the most.<br>Particles with less kinetic energy than liquid silver's must be vibrating on the spot.<br>So the second piece is a solid."}, {"d": "medium", "atom": "MAT-019b", "stem": "A solid air freshener sits in a car. Some of it has become a gas you can smell through the car. Which has taken in more energy?", "options": ["the solid block", "the gas", "both the same", "whichever has more of the freshener in it"], "key": 1, "why": "Particles that take in energy speed up.<br>The part of the air freshener that became a gas took in more energy than the solid block.<br>So its particles move faster and have more kinetic energy.<br>How much freshener there is does not matter."}, {"d": "hard", "atom": "MAT-001", "stem": "A balloon is weighed empty, then filled with air and weighed again on the same balance. Which statement is correct?", "options": ["The full balloon has less mass.", "The two have the same mass.", "The full balloon takes up more space but has the same mass.", "The full balloon has more mass."], "key": 3, "why": "Air has mass.<br>Filling the balloon adds air, so the full balloon has more mass than the empty one."}, {"d": "hard", "atom": "MAT-019b", "stem": "A puddle of rubbing alcohol on a desk turns into a gas. Why do the gas particles have more kinetic energy than the liquid particles?", "options": ["There are more of them.", "They have taken in more energy and move faster.", "They are bigger.", "They are farther apart from one another."], "key": 1, "why": "Heating gives particles energy and speeds them up.<br>The gas particles have taken in more energy, so they move faster and have more kinetic energy."}, {"d": "hard", "atom": "MAT-016", "stem": "Dried lentils are poured into a jar and take the jar's shape. Why are the lentils still a solid?", "options": ["The lentils are dry.", "The lentils are hard.", "Each lentil keeps its own shape and its own volume.", "The jar keeps its shape."], "key": 2, "why": "Each lentil keeps its own shape and its own volume wherever it lies, so each lentil is a solid.<br>A jar of lentils is many tiny solids sliding over one another."}, {"d": "hard", "atom": "MAT-018b", "stem": "A sealed plastic bottle full of air is squashed until the air fills half the space it did. What has changed?", "options": ["The particles are smaller.", "There are fewer particles.", "The particles have stopped moving.", "The particles are closer together."], "key": 3, "why": "The same particles now sit closer together.<br>Squashing the bottle moved them into the empty space between them.<br>The particles did not change size or number."}, {"d": "hard", "atom": "MAT-016b", "stem": "A student claims that the particles in a marble statue are completely still. Which statement is correct?", "options": ["The particles vibrate on the spot.", "The particles are still until the marble is heated.", "The particles slide past one another.", "The particles fly around inside the statue."], "key": 0, "why": "Particles are always moving.<br>In a solid each particle vibrates on the spot in its fixed position."}, {"d": "hard", "atom": "MAT-019", "stem": "In one sample of a substance the particles vibrate on the spot. In a second sample of the same substance the particles slide past one another. Which sample's particles have more kinetic energy, and what state is that sample in?", "options": ["the vibrating particles; a solid", "the sliding particles; a gas", "the sliding particles; a liquid", "the vibrating particles; a liquid"], "key": 2, "why": "Sliding particles are a liquid, and vibrating particles are a solid.<br>Liquid particles have more kinetic energy than solid particles."}, {"d": "hard", "atom": "MAT-001", "stem": "Rosa opens a bottle of soda and hears gas hiss out of it. She says: \"That gas is not matter, because you cannot see it.\" Which statement is correct?", "options": ["The gas is matter; it has mass but takes up no space.", "The gas is matter; it has mass and takes up space.", "The gas is not matter; it has no mass at all.", "The gas is not matter; it cannot be seen."], "key": 1, "why": "Whether something can be seen does not decide whether it is matter.<br>The gas has mass and takes up space.<br>So the gas is matter, even though nobody can see it."}, {"d": "hard", "atom": "MAT-002", "stem": "Ana looks at a speck of ground pepper through a magnifying glass. She says: \"This speck is one particle, because it is the smallest piece I can see.\" Which statement is correct?", "options": ["The speck is one particle; a particle is the smallest piece you can see.", "The speck is one particle; a magnifying glass shows single particles.", "The speck is a few particles; a stronger magnifying glass would show each one.", "The speck is billions of particles; one particle is far too small to see."], "key": 3, "why": "One particle is far too small to see, even through a magnifying glass.<br>A speck you can see is billions of particles packed together.<br>So the smallest piece Ana can see is not one particle."}, {"d": "hard", "atom": "MAT-003", "stem": "A drop of fish-tank treatment is added at one corner of a still tank with no fish in it yet, and nobody stirs. Tomas says: \"It will stay in that corner, because the water is still.\" Which statement is correct?", "options": ["It spreads through the tank; particles in still water keep moving.", "It stays in the corner; particles move only when the water is stirred.", "It stays in the corner; the water is too still to carry it.", "It sinks and stays at the bottom; the treatment is heavier than water."], "key": 0, "why": "The treatment's particles and the water's particles are always moving, even in still water.<br>The water particles knock the treatment particles around in every direction.<br>So the treatment spreads through the whole tank without stirring."}, {"d": "hard", "atom": "MAT-004", "stem": "A bag of peas comes out of a freezer at −18 °C. Omar says: \"The pea particles have stopped moving, because the peas are so cold.\" Which statement is correct?", "options": ["The particles have stopped, and start again when the peas warm.", "The particles move faster, because cold makes particles shake.", "The particles move more slowly, but they never stop.", "The particles have stopped, because cold takes away all their energy."], "key": 2, "why": "Cooling makes particles move more slowly.<br>The peas are very cold, so their particles move slowly.<br>But particles never stop moving.<br>In the solid peas each particle still vibrates on the spot."}, {"d": "hard", "atom": "MAT-016", "stem": "Lena squeezes a sealed, flexible bag full of a substance she cannot see, and the bag shrinks to half its size. She says: \"It must be a liquid, because it changed shape.\" Which statement is correct?", "options": ["It is a gas; a liquid would keep its volume.", "It is a liquid; a gas would leak out of the bag.", "It is a liquid; it changed shape when squeezed.", "It is a solid; a bag of solid can be squeezed."], "key": 0, "why": "A liquid keeps its own volume, so a bag of liquid cannot be squeezed smaller.<br>The bag shrank to half its size, so the substance did not keep its volume.<br>Only a gas keeps neither its shape nor its volume.<br>So the substance is a gas."}, {"d": "hard", "atom": "MAT-016b", "stem": "A copper pipe warms in the sun from 5 °C to 40 °C. Which statement about its particles is correct?", "options": ["They begin to slide past one another.", "They vibrate faster on the spot.", "They vibrate more slowly on the spot.", "They grow bigger."], "key": 1, "why": "Copper is a solid, so its particles are touching, in fixed positions, vibrating on the spot.<br>Heating makes particles move faster.<br>So the particles vibrate faster, but stay in their fixed positions.<br>Their size does not change."}, {"d": "hard", "atom": "MAT-017b", "stem": "Molasses pours very slowly from a jar. Ivy says: \"Molasses pours slowly because its particles are in fixed positions.\" Which statement is correct?", "options": ["The particles are in fixed positions; molasses is a soft solid.", "The particles slide past one another; molasses is a solid.", "The particles slide past one another; molasses is a liquid.", "The particles are in fixed positions; molasses is a liquid."], "key": 2, "why": "Molasses takes the shape of its jar and keeps its volume, so molasses is a liquid.<br>In a liquid the particles touch but have no fixed positions.<br>They slide past one another, even when the liquid pours slowly."}, {"d": "hard", "atom": "MAT-018b", "stem": "A sealed metal tank of hydrogen gas is moved from a warm shed at 30 °C into a cold storeroom at 5 °C. Which statement about the hydrogen particles is correct?", "options": ["They fly at the same speed but crowd closer together.", "They fly more slowly and settle to the bottom.", "They fly more slowly and shrink.", "They fly more slowly and stay the same size."], "key": 3, "why": "Hydrogen is a gas, so its particles fly fast in every direction.<br>Cooling makes particles move more slowly.<br>So the hydrogen particles fly more slowly.<br>They never stop and never settle, and their size does not change."}, {"d": "hard", "atom": "MAT-019", "stem": "Mateo compares a large slab of solid lead with a small drop of liquid lead. He says: \"Each particle in the slab has more kinetic energy, because the slab is much bigger.\" Which statement is correct?", "options": ["Each slab particle has more; a bigger piece of lead has more energy.", "Each slab particle has more; solid particles are packed together more tightly.", "Each drop particle has more; liquid particles move faster than solid ones.", "Each particle has the same; the slab and the drop are both lead."], "key": 2, "why": "Liquid particles slide past one another; solid particles only vibrate on the spot.<br>Sliding particles move faster, so each drop particle has more kinetic energy than each slab particle.<br>The size of the slab does not change how fast each of its particles moves."}, {"d": "hard", "atom": "MAT-019b", "stem": "Bacon fat is a solid in a refrigerator and a liquid in a hot pan. Noor says: \"The liquid fat's particles have more kinetic energy, because they are farther apart.\" Which statement is correct?", "options": ["The liquid particles have more; the pan's energy sped them up.", "The liquid particles have more; they are farther apart in a liquid.", "The solid particles have more; they are packed more tightly.", "Both have the same; solid and liquid fat are the same substance."], "key": 0, "why": "Heating gives particles energy and speeds them up.<br>The fat in the hot pan has taken in more energy than the fat in the refrigerator.<br>So its particles move faster and have more kinetic energy.<br>In a liquid the particles still touch; they are not farther apart."}], "figs": {"three_boxes": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 550 205\" style=\"width:100%;max-width:687px;height:auto\" role=\"img\" aria-label=\"Three particle boxes: solid, liquid and gas, drawn with the same particles\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"550\" height=\"205\" fill=\"#ffffff\"/><rect x=\"20\" y=\"20\" width=\"150\" height=\"110\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">Solid<\/text><text x=\"95.0\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"normal\" fill=\"#222\">particles touch, fixed<\/text><text x=\"95.0\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"normal\" fill=\"#222\">positions, vibrate on the<\/text><text x=\"95.0\" y=\"192\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"normal\" fill=\"#222\">spot<\/text><circle cx=\"74.0\" cy=\"54.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"54.0\" x2=\"78.0\" y2=\"54.0\" stroke=\"#ffffff\" stroke-width=\"1.2\"/><polyline points=\"72.0,52.0 70.0,54.0 7 22\" stroke-width=\"1\"/><circle cx=\"181.0\" cy=\"172.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"189.0\" cy=\"172.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"199.0\" cy=\"172.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"211.0\" cy=\"172.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"92.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"102.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"112.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"122.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"132.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"142.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"152.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"162.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"172.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"182.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"192.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"202.0\" cy=\"162.0\" r=\"5\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><line x1=\"208.0\" y1=\"162.0\" x2=\"226.0\" y2=\"162.0\" stroke=\"#222\" stroke-width=\"1.6\"/><polyline points=\"220.6,164.6 226.0,162.0 220.6,159.4\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.6\"/><text x=\"340\" y=\"150\" text-anchor=\"start\" font-size=\"12\" font-weight=\"normal\" fill=\"#222\">the same kind of particle in water and steam<\/text><text x=\"340\" y=\"168\" text-anchor=\"start\" font-size=\"12\" font-weight=\"normal\" fill=\"#222\">in the water: touching, sliding<\/text><tex <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
