<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 230" width="100%" role="img" aria-label="The formula written large at the top, the particle drawn as touching circles under it, dashed lines running from each symbol down to its atoms, and a key naming the circles" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="410" height="230" fill="#ffffff"/><text x="175.726" y="46" text-anchor="start" font-size="34" font-weight="bold" fill="#222">HCl</text><circle cx="219.0" cy="120.0" r="20.0" fill="#d9d9d9" stroke="#222" stroke-width="1"/><circle cx="191.0" cy="120.0" r="10.0" fill="#222" stroke="#222" stroke-width="1"/><line x1="188.0" y1="52.0" x2="190.6" y2="110.0" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/><line x1="217.3" y1="52.0" x2="218.5" y2="100.0" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/><text x="205.0" y="178.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large light circle: chlorine</text><text x="205.0" y="193.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">small dark circle: hydrogen</text><text x="205.0" y="212.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">HCl: 1 hydrogen atom and 1 chlorine atom</text></svg>