<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 162" width="100%" role="img" aria-label="A counting table: one row per element with its count of atoms, and a total row; the title names the formula" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="330" height="162" fill="#ffffff"/><rect x="20" y="30" width="290" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="225.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms in one particle</text><rect x="20" y="58" width="290" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="225.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><rect x="20" y="86" width="290" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">chlorine</text><text x="225.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><rect x="20" y="114" width="290" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">total</text><text x="225.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><line x1="140" y1="30" x2="140" y2="142" stroke="#222"/><!--blind: A table. Header: element | atoms in one particle. Row: hydrogen | 1. Row: chlorine | 1. Row: total | 2.--><text x="165.0" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Counting the atoms in HCl, hydrochloric acid</text></svg>