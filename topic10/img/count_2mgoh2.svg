<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" role="img" aria-label="A counting table: one row per element with its count of atoms, and a total row; the title names the formula" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="190" fill="#ffffff"/><rect x="10" y="30" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="55.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="165.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in the parentheses</text><text x="270.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">repeated</text><text x="365.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in one particle</text><text x="475.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in 2 particles</text><rect x="10" y="58" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="55.0" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">magnesium</text><text x="165.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">—</text><text x="270.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">—</text><text x="365.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><text x="475.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><rect x="10" y="86" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="55.0" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="165.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><text x="270.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="365.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="475.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><rect x="10" y="114" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="55.0" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="165.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><text x="270.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="365.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="475.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><rect x="10" y="142" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="55.0" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">total</text><text x="165.0" y="161" text-anchor="middle" font-size="13" font-weight="normal" fill="#222"></text><text x="270.0" y="161" text-anchor="middle" font-size="13" font-weight="normal" fill="#222"></text><text x="365.0" y="161" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">5</text><text x="475.0" y="161" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><line x1="100" y1="30" x2="100" y2="170" stroke="#222"/><line x1="230" y1="30" x2="230" y2="170" stroke="#222"/><line x1="310" y1="30" x2="310" y2="170" stroke="#222"/><line x1="420" y1="30" x2="420" y2="170" stroke="#222"/><!--blind: A table. Header: element | in the parentheses | repeated | in one particle | in 2 particles. Row: magnesium | — | — | 1 | 2. Row: oxygen | 1 | 2 | 2 | 4. Row: hydrogen | 1 | 2 | 2 | 4. Row: total |  |  | 5 | 10.--><text x="270.0" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Counting the atoms in 2Mg(OH)₂</text></svg>