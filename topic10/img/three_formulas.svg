<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 187" width="100%" role="img" aria-label="3 particles drawn as touching circles in a row, each with its formula and its everyday name under it and a key naming its circles" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="187" fill="#ffffff"/><text x="265.0" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Three more formulas, each beside its particle</text><circle cx="95.0" cy="59.3" r="9.8" fill="#d9d9d9" stroke="#222" stroke-width="1"/><circle cx="95.0" cy="74.7" r="7.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="81.7" cy="51.6" r="7.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="108.3" cy="51.6" r="7.0" fill="#222" stroke="#222" stroke-width="1"/><text x="72.68408" y="116.6" text-anchor="start" font-size="22" font-weight="bold" fill="#222">NH</text><text x="107.09208" y="122.75999999999999" text-anchor="start" font-size="13" font-weight="normal" fill="#222">3</text><text x="95.0" y="136.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ammonia (in some cleaners)</text><text x="95.0" y="153.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">light gray circle: nitrogen</text><text x="95.0" y="168.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">small dark circle: hydrogen</text><circle cx="251.7" cy="59.3" r="14.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="278.3" cy="59.3" r="14.0" fill="#ffffff" stroke="#222" stroke-width="1"/><text x="250.01008" y="116.6" text-anchor="start" font-size="22" font-weight="bold" fill="#222">O</text><text x="269.76608" y="122.75999999999999" text-anchor="start" font-size="13" font-weight="normal" fill="#222">2</text><text x="265.0" y="136.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">oxygen gas (in the air)</text><text x="265.0" y="153.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large open circle: oxygen</text><circle cx="421.7" cy="59.3" r="14.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="448.3" cy="59.3" r="14.0" fill="#d9d9d9" stroke="#222" stroke-width="1"/><text x="409.942" y="116.6" text-anchor="start" font-size="22" font-weight="bold" fill="#222">NaCl</text><text x="435.0" y="136.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">table salt</text><text x="435.0" y="153.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large dark circle: sodium</text><text x="435.0" y="168.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large light circle: chlorine</text></svg>