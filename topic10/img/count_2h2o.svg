<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 162" width="100%" role="img" aria-label="A counting table: one row per element with its count of atoms, and a total row; the title names the formula" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="162" fill="#ffffff"/><rect x="20" y="30" width="460" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="225.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms in one particle</text><text x="395.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms in 2 particles</text><rect x="20" y="58" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="225.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="395.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><rect x="20" y="86" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="225.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><text x="395.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><rect x="20" y="114" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">total</text><text x="225.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="395.0" y="133" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">6</text><line x1="140" y1="30" x2="140" y2="142" stroke="#222"/><line x1="310" y1="30" x2="310" y2="142" stroke="#222"/><!--blind: A table. Header: element | atoms in one particle | atoms in 2 particles. Row: hydrogen | 2 | 4. Row: oxygen | 1 | 2. Row: total | 3 | 6.--><text x="250.0" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Counting the atoms in 2H₂O</text></svg>