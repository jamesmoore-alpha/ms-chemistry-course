<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="100%" role="img" aria-label="The line 2H2O written large, the full-size 2 in front ringed and labeled as counting particles, the small low 2 after the H ringed and labeled as counting hydrogen atoms" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="200" fill="#ffffff"/><text x="270" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Two different 2s</text><text x="214.7856" y="100" text-anchor="start" font-size="40" font-weight="normal" fill="#222">2</text><text x="241.82559999999998" y="100" text-anchor="start" font-size="40" font-weight="bold" fill="#222">H</text><text x="275.5056" y="111.2" text-anchor="start" font-size="24" font-weight="normal" fill="#222">2</text><text x="294.0944" y="100" text-anchor="start" font-size="40" font-weight="bold" fill="#222">O</text><rect x="272.3" y="90.6" width="20.2" height="23.8" rx="4" fill="none" stroke="#222" stroke-width="1.8"/><rect x="211.6" y="68.0" width="28.6" height="36.0" rx="4" fill="none" stroke="#222" stroke-width="1.8"/><text x="140" y="50" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">full size, in front: counts particles</text><line x1="140.0" y1="56.0" x2="219.9" y2="70.0" stroke="#222" stroke-width="1.6"/><polyline points="214.1,71.6 219.9,70.0 215.0,66.5" fill="none" stroke="#222" stroke-width="1.6"/><text x="390" y="158" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">small, low, after the H: counts hydrogen atoms</text><line x1="390.0" y1="144.0" x2="288.4" y2="118.5" stroke="#222" stroke-width="1.6"/><polyline points="294.3,117.3 288.4,118.5 293.0,122.4" fill="none" stroke="#222" stroke-width="1.6"/><text x="270" y="186" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2H₂O: two water particles, so 4 hydrogen atoms and 2 oxygen atoms in all</text></svg>