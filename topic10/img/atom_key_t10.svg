<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" width="100%" role="img" aria-label="A key: six kinds of circle, each named as one kind of atom (oxygen, hydrogen, carbon, nitrogen, chlorine, a metal); two water-particle circles touching mean atoms joined; two circles apart mean atoms not joined; two lines say that in earlier drawings touching showed a solid and in these drawings touching means joined" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="350" fill="#ffffff"/><text x="270" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">How this course draws atoms</text><circle cx="40.0" cy="48.0" r="10.0" fill="#ffffff" stroke="#222" stroke-width="1"/><text x="62" y="52" text-anchor="start" font-size="13" font-weight="normal" fill="#222">large open circle: one oxygen atom</text><circle cx="40.0" cy="78.0" r="5.0" fill="#222" stroke="#222" stroke-width="1"/><text x="62" y="82" text-anchor="start" font-size="13" font-weight="normal" fill="#222">small dark circle: one hydrogen atom</text><circle cx="40.0" cy="108.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><text x="62" y="112" text-anchor="start" font-size="13" font-weight="normal" fill="#222">gray circle: one carbon atom</text><circle cx="40.0" cy="138.0" r="7.0" fill="#d9d9d9" stroke="#222" stroke-width="1"/><text x="62" y="142" text-anchor="start" font-size="13" font-weight="normal" fill="#222">light gray circle: one nitrogen atom</text><circle cx="40.0" cy="168.0" r="10.0" fill="#d9d9d9" stroke="#222" stroke-width="1"/><text x="62" y="172" text-anchor="start" font-size="13" font-weight="normal" fill="#222">large light circle: one chlorine atom</text><circle cx="40.0" cy="198.0" r="10.0" fill="#222" stroke="#222" stroke-width="1"/><text x="62" y="202" text-anchor="start" font-size="13" font-weight="normal" fill="#222">large dark circle: one metal atom (the words under each drawing say which metal)</text><circle cx="46.0" cy="241.9" r="10.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="35.1" cy="233.1" r="5.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="56.9" cy="233.1" r="5.0" fill="#222" stroke="#222" stroke-width="1"/><text x="72" y="240" text-anchor="start" font-size="13" font-weight="normal" fill="#222">atoms joined together are drawn touching: one water particle</text><circle cx="28.0" cy="268.0" r="10.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="64.0" cy="268.0" r="10.0" fill="#ffffff" stroke="#222" stroke-width="1"/><text x="84" y="272" text-anchor="start" font-size="13" font-weight="normal" fill="#222">atoms not joined are drawn apart</text><text x="30" y="300" text-anchor="start" font-size="13" font-weight="normal" fill="#222">In the earlier drawings, a solid's particles were packed together, touching:</text><text x="30" y="316" text-anchor="start" font-size="13" font-weight="normal" fill="#222">that showed a solid.</text><text x="30" y="332" text-anchor="start" font-size="13" font-weight="normal" fill="#222">In these drawings, touching means joined, not packed.</text></svg>