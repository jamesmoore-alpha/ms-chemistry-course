<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 339" width="100%" role="img" aria-label="Two particles drawn as touching circles side by side, each with its formula, name and key under it, and a table under them comparing the two substances row by row" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="339" fill="#ffffff"/><text x="270" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Another example: CO and CO₂</text><circle cx="403.8" cy="78.8" r="22.0" fill="none" stroke="#222" stroke-width="2.6" stroke-dasharray="4 3"/><circle cx="159.4" cy="78.8" r="18.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="130.6" cy="78.8" r="12.6" fill="#555" stroke="#222" stroke-width="1"/><text x="128.5" y="155.60000000000002" text-anchor="start" font-size="22" font-weight="bold" fill="#222">CO</text><text x="145.0" y="180.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon monoxide</text><text x="145.0" y="197.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large open circle: oxygen</text><text x="145.0" y="212.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gray circle: carbon</text><circle cx="346.2" cy="78.8" r="18.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="403.8" cy="78.8" r="18.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="375.0" cy="78.8" r="12.6" fill="#555" stroke="#222" stroke-width="1"/><text x="352.06808" y="155.60000000000002" text-anchor="start" font-size="22" font-weight="bold" fill="#222">CO</text><text x="387.70808" y="161.76000000000002" text-anchor="start" font-size="13" font-weight="normal" fill="#222">2</text><text x="375.0" y="180.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon dioxide</text><text x="375.0" y="197.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">large open circle: oxygen</text><text x="375.0" y="212.60000000000002" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gray circle: carbon</text><rect x="16" y="235" width="508" height="28" fill="#f1f1f1" stroke="#222"/><text x="77.0" y="254.60000000000002" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">substance</text><text x="168.0" y="254.60000000000002" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">formula</text><text x="286.0" y="254.60000000000002" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms in one particle</text><text x="449.0" y="254.60000000000002" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one property</text><rect x="16" y="263" width="508" height="28" fill="#ffffff" stroke="#222"/><text x="77.0" y="282.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">carbon monoxide</text><text x="168.0" y="282.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">CO</text><text x="286.0" y="282.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 carbon, 1 oxygen: 2 atoms</text><text x="449.0" y="282.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">poisonous to breathe</text><rect x="16" y="291" width="508" height="28" fill="#ffffff" stroke="#222"/><text x="77.0" y="310.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">carbon dioxide</text><text x="168.0" y="310.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">CO₂</text><text x="286.0" y="310.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 carbon, 2 oxygen: 3 atoms</text><text x="449.0" y="310.6" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the gas you breathe out</text><line x1="138" y1="235" x2="138" y2="319" stroke="#222"/><line x1="198" y1="235" x2="198" y2="319" stroke="#222"/><line x1="374" y1="235" x2="374" y2="319" stroke="#222"/><!--blind: A table. Header: substance | formula | atoms in one particle | one property. Row: carbon monoxide | CO | 1 carbon, 1 oxygen: 2 atoms | poisonous to breathe. Row: carbon dioxide | CO₂ | 1 carbon, 2 oxygen: 3 atoms | the gas you breathe out.--></svg>