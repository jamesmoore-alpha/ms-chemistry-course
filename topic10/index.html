en atoms", "12 oxygen atoms", "14 oxygen atoms", "24 oxygen atoms"], "key": 3, "why": "One particle: 4 oxygen atoms inside the parentheses × 3 = 12 oxygen atoms.<br>The coefficient 2 means two particles: 2 × 12 = 24.<br>So 2Al₂(SO₄)₃ holds 24 oxygen atoms in all."}, {"d": "medium", "atom": "MAT-059", "stem": "Which formula names a particle that holds three different elements?", "options": ["H₂O₂", "NaOH", "CH₄", "N₂O"], "key": 1, "why": "Every capital letter starts a new symbol, and each symbol names one element.<br>NaOH has three capitals: Na, O, H, so three elements.<br>H₂O₂, CH₄ and N₂O each have two capitals, so two elements."}, {"d": "medium", "atom": "MAT-059", "stem": "Sand is mostly a substance whose particle holds 1 silicon atom and 2 oxygen atoms; Si is silicon, O is oxygen. Which formula writes that particle?", "options": ["SiO₂", "Si₂O", "Si₂O₂", "2SiO"], "key": 0, "why": "A subscript counts the atoms of the element just before it, and a symbol with no subscript counts one atom.<br>1 silicon atom: Si. 2 oxygen atoms: O₂.<br>So the formula is SiO₂; 2SiO would be two separate particles."}, {"d": "medium", "atom": "MAT-061", "stem": "Potassium iodide, added to iodized salt, is KI; K is potassium, I is iodine. A chemist wants to write four KI particles. Which line writes them?", "options": ["4KI", "K₄I", "KI₄", "K₄I₄"], "key": 0, "why": "A coefficient, the full-size number in front, counts whole particles.<br>Four particles of KI take a coefficient of 4: 4KI.<br>K₄I, KI₄ and K₄I₄ each write ONE particle with more atoms in it."}, {"d": "medium", "atom": "MAT-059", "fig": "pp_draw_nh2cl", "stem": "Touching circles are joined. In this drawing, light gray circles are nitrogen atoms, small dark circles are hydrogen atoms and large light circles are chlorine atoms. Which formula writes this particle?", "options": ["NHCl", "NH₂Cl", "NHCl₂", "N₂HCl"], "key": 1, "why": "Count the circles of each kind: 1 light gray, 2 small dark, 1 large light.<br>So the particle holds 1 nitrogen atom, 2 hydrogen atoms and 1 chlorine atom.<br>The 2 goes just after the H, the symbol it counts: NH₂Cl. NHCl₂ would need two large light circles."}, {"d": "medium", "atom": "MAT-059", "stem": "Cl is chlorine. Which formula writes ONE particle that holds exactly 2 chlorine atoms?", "options": ["CaCl₂", "2KCl", "ClO₂", "KClO₃"], "key": 0, "why": "A subscript counts the atoms of the element just before it, in one particle.<br>In CaCl₂ the 2 comes just after the Cl: 2 chlorine atoms.<br>In ClO₂ the 2 counts oxygen atoms, in KClO₃ the 3 counts oxygen atoms, and 2KCl writes two particles of 1 chlorine atom each."}, {"d": "medium", "atom": "MAT-060", "stem": "One particle of vitamin C holds 20 atoms: 6 carbon atoms, 6 oxygen atoms and the rest hydrogen atoms; C is carbon, H is hydrogen, O is oxygen. Which formula writes vitamin C?", "options": ["C₆H₆O₆", "C₆H₈O₆", "C₆H₁₄O₆", "C₆H₂₀O₆"], "key": 1, "why": "The counts add up to the total: 6 + hydrogen + 6 = 20.<br>So the hydrogen count is 20 − 12 = 8.<br>Each subscript is its element's count: C₆H₈O₆; C₆H₂₀O₆ would put the whole total on the hydrogen."}, {"d": "medium", "atom": "MAT-060", "stem": "Which formula writes the particle with the most atoms in all?", "options": ["H₂CO₃", "K₂SO₄", "CH₄N₂O", "C₂H₆O₂"], "key": 3, "why": "Add each formula's counts.<br>H₂CO₃: 2 + 1 + 3 = 6. K₂SO₄: 2 + 1 + 4 = 7. CH₄N₂O: 1 + 4 + 2 + 1 = 8. C₂H₆O₂: 2 + 6 + 2 = 10.<br>10 is the largest total, so C₂H₆O₂ holds the most atoms."}, {"d": "medium", "atom": "MAT-060", "stem": "Before some X-rays, a patient drinks a chalky liquid of barium sulfate, BaSO₄; Ba is barium, S is sulfur, O is oxygen. How many atoms in all does one BaSO₄ particle hold?", "options": ["3 atoms", "4 atoms", "5 atoms", "6 atoms"], "key": 3, "why": "Take the symbols one at a time.<br>Ba with no subscript: 1 barium atom. S with no subscript: 1 sulfur atom. O₄: 4 oxygen atoms.<br>Add the counts: 1 + 1 + 4 = 6 atoms; 3 counts the symbols, and 5 misses one of the no-subscript symbols."}, {"d": "medium", "atom": "MAT-060", "stem": "Which pair of formulas writes two particles with the same number of atoms in all?", "options": ["NaF and CS₂", "N₂ and ZnO", "TiO₂ and B₂O₃", "C₈H₁₈ and C₂H₆O₂"], "key": 1, "why": "Add the counts in each formula.<br>N₂ holds 2 atoms, and ZnO holds 1 + 1 = 2 atoms: the same number.<br>NaF is 2 atoms and CS₂ is 3; TiO₂ is 3 and B₂O₃ is 5; C₈H₁₈ is 26 and C₂H₆O₂ is 10."}, {"d": "medium", "atom": "MAT-059b", "stem": "Some dried fruits are preserved with sodium sulfite, Na₂SO₃. Many powdered laundry detergents contain sodium sulfate, Na₂SO₄; Na is sodium, S is sulfur, O is oxygen. Compared with a sodium sulfite particle, a sodium sulfate particle holds…", "options": ["one more oxygen atom.", "one more sulfur atom.", "one more sodium atom.", "the same atoms, packed more tightly."], "key": 0, "why": "Compare the subscripts: Na₂ in both, S in both, O₃ against O₄.<br>So a sodium sulfate particle holds one more oxygen atom, joined into the particle.<br>The two particles do not hold the same atoms, so packing is not the difference."}, {"d": "medium", "atom": "MAT-061", "stem": "Zinc oxide, ZnO, is the white powder in many diaper-rash creams; Zn is zinc, O is oxygen. A chemist writes 2ZnO, then 3ZnO. Compared with 2ZnO, what does 3ZnO write?", "options": ["one more ZnO particle", "one more zinc atom in each particle", "one more oxygen atom in each particle", "a different substance, with its own properties"], "key": 0, "why": "A full-size number in front is a coefficient, and it counts whole particles.<br>2ZnO is two ZnO particles and 3ZnO is three: one more whole particle.<br>Each particle is still 1 zinc atom joined to 1 oxygen atom, so the substance is the same.<br>Only a changed subscript would change the particle."}, {"d": "medium", "atom": "MAT-061", "stem": "An old-fashioned raising agent for cookies, baker's ammonia, is ammonium carbonate, (NH₄)₂CO₃; N is nitrogen, H is hydrogen, C is carbon, O is oxygen. How many oxygen atoms does one (NH₄)₂CO₃ particle hold?", "options": ["1 oxygen atom", "2 oxygen atoms", "3 oxygen atoms", "6 oxygen atoms"], "key": 2, "why": "The 2 after the closing parenthesis repeats only the group inside: NH₄.<br>The O sits outside the parentheses, so the 2 does not reach it.<br>O₃: 3 oxygen atoms; 6 would be the count if the 2 repeated the CO₃ as well."}, {"d": "medium", "atom": "MAT-061", "stem": "Hydrogen gas is H₂; H is hydrogen. A chemist wants to write enough H₂ particles to hold 8 hydrogen atoms in all. Which line does she write?", "options": ["2H₄", "4H₂", "8H₂", "H₈"], "key": 1, "why": "One H₂ particle holds 2 hydrogen atoms.<br>8 atoms in all means 8 ÷ 2 = 4 particles, and a coefficient counts whole particles: 4H₂.<br>8H₂ would be 16 atoms; H₈ and 2H₄ change the particle itself."}, {"d": "medium", "atom": "MAT-061", "fig": "pp_draw_alno33", "stem": "Touching circles are joined. In this drawing, large dark circles are aluminum atoms, light gray circles are nitrogen atoms and large open circles are oxygen atoms. Which formula writes this particle?", "options": ["AlNO₃", "Al(NO₃)₂", "Al₃(NO₃)₃", "Al(NO₃)₃"], "key": 3, "why": "Count the circles: 1 large dark, 3 light gray, 9 large open.<br>Each light gray circle carries three large open circles: an NO₃ group, and there are three groups.<br>A subscript after a closing parenthesis repeats the group: Al(NO₃)₃, 1 aluminum atom with three NO₃ groups."}, {"d": "medium", "atom": "MAT-061", "stem": "O is oxygen. Which formula writes a particle with exactly 6 oxygen atoms?", "options": ["Fe(OH)₂", "Cr(OH)₃", "Cu(NO₃)₂", "Mg₃(PO₄)₂"], "key": 2, "why": "For an element inside parentheses, multiply the count inside by the subscript after them.<br>Cu(NO₃)₂: 3 × 2 = 6 oxygen atoms.<br>Fe(OH)₂: 1 × 2 = 2. Cr(OH)₃: 1 × 3 = 3. Mg₃(PO₄)₂: 4 × 2 = 8."}, {"d": "hard", "atom": "MAT-059b", "stem": "CuO and Cu₂O are two compounds of copper; Cu is copper, O is oxygen. Jelena says they are the same substance, because both hold only copper and oxygen. Tobias says they are different substances, because their particles hold different numbers of atoms. Who is correct?", "options": ["Tobias", "Jelena", "both of them", "neither of them"], "key": 0, "why": "A subscript counts the atoms in one particle: 1 copper atom in CuO, 2 copper atoms in Cu₂O.<br>So the two particles are different particles.<br>A different particle is a different substance, so Tobias is correct."}, {"d": "hard", "atom": "MAT-061", "stem": "Lead nitrate is Pb(NO₃)₂; Pb is lead, N is nitrogen, O is oxygen. Rafael says: \"One particle holds 1 lead atom, 2 nitrogen atoms and 3 oxygen atoms.\" Which statement is correct?", "options": ["Rafael is correct.", "The nitrogen count should be 1, because the 2 only repeats the oxygen.", "The oxygen count should be 6, because the 2 repeats the whole group.", "The lead count should be 2, because the 2 multiplies everything."], "key": 2, "why": "The 2 after the closing parenthesis repeats the whole group, N and O₃.<br>Nitrogen: 1 × 2 = 2 atoms. Oxygen: 3 × 2 = 6 atoms, not 3.<br>Lead sits outside the parentheses: 1 atom. So Rafael's oxygen count is wrong."}, {"d": "hard", "atom": "MAT-059b", "stem": "Household bleach contains NaClO; table salt is NaCl. Saoirse says bleach is just salt with some oxygen mixed in, because the formulas differ by one O. Which statement is correct?", "options": ["Saoirse is correct: an extra O just means some oxygen mixed in.", "NaClO and NaCl are the same substance in two forms.", "NaClO is a different substance: its particle is different.", "NaClO is salt with one oxygen atom added on, so it still has salt's properties."], "key": 2, "why": "In NaClO the oxygen atom is joined into the particle, not mixed into the sample.<br>So the NaClO particle is a different particle from the NaCl particle.<br>A different particle is a different substance, so Saoirse is not correct."}, {"d": "hard", "atom": "MAT-061", "stem": "Ba is barium, Fe is iron, O is oxygen, H is hydrogen. Which holds more oxygen atoms in all, 3Ba(OH)₂ or 2Fe(OH)₃, and by how many?", "options": ["3Ba(OH)₂, by 1 oxygen atom", "2Fe(OH)₃, by 1 oxygen atom", "2Fe(OH)₃, by 3 oxygen atoms", "neither: the same number"], "key": 3, "why": "3Ba(OH)₂: 1 oxygen atom inside × 2 = 2 per particle, × 3 particles = 6 oxygen atoms.<br>2Fe(OH)₃: 1 × 3 = 3 per particle, × 2 particles = 6 oxygen atoms.<br>6 = 6, so they hold the same number."}, {"d": "hard", "atom": "MAT-059b", "stem": "The head of a safety match contains potassium chlorate, KClO₃; K is potassium, Cl is chlorine, O is oxygen. A chemist writes four lines: KClO₃, 2KClO₃, KClO₄ and 3KClO₄. How many different substances do the four lines write?", "options": ["1 substance", "2 substances", "3 substances", "4 substances"], "key": 1, "why": "A coefficient counts whole particles.<br>So 2KClO₃ writes more KClO₃ particles: the same particle, so the same substance.<br>A changed subscript builds a different particle, so KClO₄ is a different substance from KClO₃.<br>KClO₃ and 2KClO₃ are one substance, KClO₄ and 3KClO₄ another: 2 substances."}, {"d": "hard", "atom": "MAT-061", "fig": "pp_draw_3n2", "stem": "Touching circles are joined. In this drawing, light gray circles are nitrogen atoms. Tomasz writes 3N₂ for what is drawn. Which statement is correct?", "options": ["Tomasz is correct: the 3 in front counts the separate particles, and the small 2 counts the atoms in each one.", "The line should be 6N: the number in front counts every atom drawn, and six atoms are drawn.", "The line should be N₆: a subscript counts every atom drawn, and six atoms are drawn.", "The line should be 2N₃: the number in front counts the atoms in each particle, and the subscript counts the particles."], "key": 0, "why": "Count what is drawn: three separate particles, each 2 light gray circles joined.<br>Each particle is N₂, and three whole particles take a coefficient of 3: 3N₂.<br>6N would be six separate atoms, N₆ six atoms joined in one particle, and 2N₃ two particles of three atoms.<br>So Tomasz is correct."}, {"d": "hard", "atom": "MAT-059", "stem": "The white pigment in most white paint is titanium dioxide, TiO₂; Ti is titanium, O is oxygen. Chiara says: \"The small 2 counts the titanium atoms as well as the oxygen atoms, because it is the only number in the formula.\" Which statement is correct?", "options": ["Chiara is correct: a subscript that stands alone counts every element in the whole formula.", "The 2 counts only the oxygen atoms: a subscript counts the element just before it.", "The 2 counts only the titanium atoms, because titanium is the first symbol.", "Chiara is correct: TiO₂ holds two elements, so the 2 counts one atom of each."], "key": 1, "why": "A subscript counts the atoms of the element just before it.<br>The 2 comes just after the O, so it counts 2 oxygen atoms.<br>Ti has no subscript, so it counts 1 titanium atom.<br>The 2 counts oxygen atoms only, never the elements, so Chiara is not correct."}, {"d": "hard", "atom": "MAT-060", "stem": "Phosphoric acid, H₃PO₄, gives many colas their tang; H is hydrogen, P is phosphorus, O is oxygen. Farid says: \"One H₃PO₄ particle holds 7 atoms, because 3 + 4 = 7.\" Which statement is correct?", "options": ["Farid is correct: a symbol with no subscript adds nothing to the count.", "One particle holds 3 atoms: three symbols, so three atoms.", "One particle holds 8 atoms: the P with no subscript counts 1 atom.", "Farid is correct: the P names the whole particle, so only the 3 hydrogen and 4 oxygen atoms are counted."], "key": 2, "why": "Take the symbols one at a time: H₃ is 3 hydrogen atoms, P is 1 phosphorus atom, O₄ is 4 oxygen atoms.<br>Each symbol names one element, so the P is an atom to count.<br>A symbol with no subscript counts one atom.<br>Add the counts: 3 + 1 + 4 = 8 atoms, so Farid is not correct."}, {"d": "hard", "atom": "MAT-060", "stem": "The grit on many sandpapers is aluminum oxide, Al₂O₃; Al is aluminum, O is oxygen. Aiko counts one Al₂O₃ particle and gets 6 atoms, because 2 × 3 = 6. Which statement is correct?", "options": ["Aiko is correct: the subscripts are multiplied together.", "One particle holds 5 atoms: 2 aluminum atoms plus 3 oxygen atoms.", "One particle holds 3 atoms: the larger subscript is the total.", "Aiko is correct: the 2 multiplies the O₃, like a number in front, so 2 × 3 = 6 atoms."], "key": 1, "why": "Each subscript is one element's count: Al₂ is 2 aluminum atoms, O₃ is 3 oxygen atoms.<br>A subscript counts only the element just before it, and multiplies nothing else.<br>To find the atoms in all, add the counts: 2 + 3 = 5.<br>Multiplying would count atoms that are not there, so Aiko is not correct."}, {"d": "hard", "atom": "MAT-059b", "stem": "Acetone, C₃H₆O, is the liquid in many nail-polish removers, and it boils at 56 °C. Isopropyl alcohol, C₃H₈O, is the alcohol in most rubbing alcohol, and it boils at 83 °C; C is carbon, H is hydrogen, O is oxygen. Which statement explains why the two boiling points differ?", "options": ["Isopropyl alcohol is a stronger form of acetone, and a stronger form boils at a higher temperature.", "Isopropyl alcohol is acetone with extra hydrogen gas mixed in, and the mixed-in gas raises the boiling point.", "The two liquids are made of different particles, so each is its own substance with its own boiling point.", "The two liquids are the same substance, and a bigger amount of a liquid boils at a higher temperature."], "key": 2, "why": "A subscript counts the atoms in one particle: 6 hydrogen atoms in C₃H₆O, 8 in C₃H₈O.<br>So the two liquids are made of different particles.<br>A substance's properties come from its particles, so each liquid is its own substance, with its own boiling point."}, {"d": "hard", "atom": "MAT-059b", "stem": "Sodium fluoride, NaF, is added to some towns' tap water to protect teeth; Na is sodium, F is fluorine. Ola says: \"4NaF and NaF write the same substance.\" Which statement is correct?", "options": ["Ola is correct: a number in a formula never changes the substance.", "4NaF is a different substance, because it holds four times as many atoms in all.", "4NaF is a different substance, because a changed number in a formula builds a different particle.", "Ola is correct: a coefficient counts whole particles, and the particles are the same."], "key": 3, "why": "A full-size number in front is a coefficient, and it counts whole particles: 4NaF is four NaF particles.<br>Each particle is still 1 sodium atom joined to 1 fluorine atom, the same particle.<br>Only a changed subscript builds a different particle, so Ola is correct."}, {"d": "hard", "atom": "MAT-061", "stem": "Many baking powders contain monocalcium phosphate, Ca(H₂PO₄)₂; Ca is calcium, H is hydrogen, P is phosphorus, O is oxygen. How many atoms in all does 2Ca(H₂PO₄)₂ hold?", "options": ["15 atoms", "16 atoms", "17 atoms", "30 atoms"], "key": 3, "why": "Count one particle first: Ca is 1 atom; inside the parentheses 2 + 1 + 4 = 7 atoms, repeated 2 times is 14; so 1 + 14 = 15 atoms.<br>Then multiply by the coefficient 2: 2 × 15 = 30 atoms.<br>15 forgets the coefficient, 17 adds it instead, and 16 skips the repeat."}, {"d": "hard", "atom": "MAT-061", "stem": "Copper sulfate, CuSO₄, is used to kill algae in some ponds; Cu is copper, S is sulfur, O is oxygen. Dario says: \"In 3CuSO₄, the 3 multiplies every count, so it holds 3 copper atoms, 3 sulfur atoms and 12 oxygen atoms in all.\" Which statement is correct?", "options": ["Dario is correct: the 3 is a coefficient, and a coefficient multiplies every count in the formula.", "Dario is correct: the 3 is a subscript, and a subscript counts every atom in the formula.", "The 3 multiplies only the copper count, because it sits next to the Cu: 3 copper, 1 sulfur and 4 oxygen atoms.", "The 3 multiplies only the oxygen count, because oxygen is the one element with a subscript: 1 copper, 1 sulfur and 12 oxygen atoms."], "key": 0, "why": "A full-size number in front is a coefficient, and it counts whole particles: 3CuSO₄ is three CuSO₄ particles.<br>Every particle holds 1 copper, 1 sulfur and 4 oxygen atoms, so three particles hold 3, 3 and 12.<br>A coefficient multiplies every count in the formula, so Dario is correct."}, {"d": "hard", "atom": "MAT-061", "stem": "Strontium nitrate, Sr(NO₃)₂, gives some emergency flares their red light; Sr is strontium, N is nitrogen, O is oxygen. Mina says: \"4Sr(NO₃)₂ holds 12 oxygen atoms in all, because 3 × 4 = 12.\" Which number did Mina leave out of her count?", "options": ["the 4 in front", "the small 3 inside the parentheses", "the 2 after the closing parenthesis", "none of them: 12 oxygen atoms is the correct count"], "key": 2, "why": "Count one particle first: 3 oxygen atoms inside the parentheses × the 2 after them = 6 oxygen atoms.<br>Then multiply by the coefficient 4: 4 × 6 = 24 oxygen atoms in all.<br>Mina's 3 × 4 uses the inside 3 and the coefficient 4, so she left out the 2 after the closing parenthesis."}], "figs": {"bottle_labels": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 180\" style=\"width:100%;max-width:625px;height:auto\" role=\"img\" aria-label=\"A water bottle with the label H2O, a fire extinguisher with the label CO2, and one water particle drawn as one large open circle joined to two small dark circles, with a key naming the circles\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"500\" height=\"180\" fill=\"#ffffff\"/><rect x=\"50\" y=\"38\" width=\"70\" height=\"102\" rx=\"12\" fill=\"#f1f1f1\" stroke=\"#222\"/><rect x=\"73\" y=\"20\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"58\" y=\"74\" width=\"54\" height=\"34\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"64.1528\" y=\"99.0\" text-anchor=\"start\" font-size=\"20\" font-weight=\"bold\" fill=\"#222\">H<\/text><text x=\"80.9928\" y=\"104.6\" text-anchor=\"start\" font-size=\"12\" font-weight=\"normal\" fill=\"#222\">2<\/text><te <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
