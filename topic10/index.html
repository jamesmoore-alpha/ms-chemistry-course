m": "Chemists write one particle of a substance as symbols and small low numbers, for example CO₂. This way of writing a substance is called its…", "accept": ["chemical formula", "formula", "a chemical formula", "the chemical formula", "its chemical formula", "a formula", "the formula"], "why": "The symbols name the elements, and the small numbers count the atoms.<br>This way of writing one particle of a substance is called its chemical formula."}, {"type": "text", "tag": "term", "stem": "In CO₂, the small 2 is written low, just after the O. What is a small number written like this called?", "accept": ["subscript", "a subscript", "the subscript"], "why": "The 2 is written small and low, after a symbol.<br>A small number written low after a symbol is called a subscript."}, {"type": "mcq", "tag": "what", "stem": "H₂S is the gas that smells of rotten eggs. In H₂S, what does the H tell you?", "options": ["the element hydrogen is in the particle", "the number of atoms in the particle"], "key": 0, "fb": ["H is hydrogen's chemical symbol, so the H names the element hydrogen.", "A symbol names an element, not a number; the count is in the subscript after it."], "why": "Each symbol in a formula names one element.<br>H is the chemical symbol for hydrogen.<br>So the H tells you the particle holds hydrogen."}, {"type": "mcq", "tag": "what", "stem": "In H₂S, which atoms does the small 2 count?", "options": ["hydrogen atoms", "sulfur atoms"], "key": 0, "fb": ["The 2 comes just after the H, so it counts hydrogen atoms: 2 hydrogen atoms.", "A subscript counts the element just before it. The 2 comes after the H, not the S, so it counts hydrogen atoms."], "why": "A subscript counts the atoms of the element just before it.<br>The 2 comes just after the H.<br>So the 2 counts hydrogen atoms: 2 hydrogen atoms."}, {"type": "mcq", "tag": "what", "stem": "In H₂S, the S has no subscript after it. How many sulfur atoms does one particle hold?", "options": ["no sulfur atoms", "1 sulfur atom", "2 sulfur atoms"], "key": 1, "fb": ["The S is in the formula, so sulfur is in the particle; no subscript means one atom, not none.", "A symbol with no subscript counts one atom: 1 sulfur atom.", "The 2 comes after the H and counts hydrogen atoms; the S has no subscript, so 1 sulfur atom."], "why": "The S has no subscript after it.<br>A symbol with no subscript counts one atom.<br>So one particle holds 1 sulfur atom."}, {"type": "text", "tag": "what", "stem": "N₂O is the laughing gas a dentist may use. How many nitrogen atoms does one N₂O particle hold?", "accept": ["2", "2 nitrogen atoms", "two", "2 atoms"], "why": "The 2 comes just after the N.<br>A subscript counts the atoms of the element just before it.<br>So one N₂O particle holds 2 nitrogen atoms."}, {"type": "mcq", "tag": "what", "fig": "f1_draw", "stem": "Touching circles are joined. In this drawing, gray circles are carbon atoms, small dark circles are hydrogen atoms and large open circles are oxygen atoms. Which formula writes this particle?", "options": ["CHO", "CHO₂", "CH₂O"], "key": 2, "fb": ["CHO would be 1 atom of each kind; the drawing has two small dark circles, so 2 hydrogen atoms.", "CHO₂ would need 2 oxygen atoms; the drawing has one large open circle and two small dark circles, so the 2 belongs after the H.", "One gray circle, two small dark circles and one large open circle: 1 carbon atom, 2 hydrogen atoms and 1 oxygen atom, CH₂O."], "why": "Count the circles of each kind: 1 gray circle, 2 small dark circles and 1 large open circle.<br>So the particle holds 1 carbon atom, 2 hydrogen atoms and 1 oxygen atom.<br>The subscript after the H counts the hydrogen atoms: CH₂O."}, {"type": "mcq", "tag": "what", "fig": "f1_draw2", "stem": "Touching circles are joined. In this drawing, gray circles are carbon atoms and large open circles are oxygen atoms. Which formula writes this particle?", "options": ["CO₂", "CO", "C₂O"], "key": 1, "fb": ["CO₂ would need 2 oxygen atoms; the drawing has one large open circle, 1 oxygen atom.", "One gray circle and one large open circle: 1 carbon atom and 1 oxygen atom, no subscripts, CO.", "C₂O would need 2 carbon atoms; the drawing has one gray circle, 1 carbon atom."], "why": "Count the circles of each kind: 1 gray circle and 1 large open circle.<br>So the particle holds 1 carbon atom and 1 oxygen atom.<br>A symbol with no subscript counts one atom, so the formula is CO."}, {"type": "mcq", "tag": "misconception", "stem": "Idris says: \"In H₂O, the small 2 counts the oxygen atoms.\" Is Idris correct?", "options": ["yes", "no"], "key": 1, "fb": ["A subscript counts the element just before it. The 2 comes after the H, so it counts hydrogen atoms, not oxygen atoms.", "The 2 comes just after the H, so it counts 2 hydrogen atoms; the O, with no subscript, is 1 oxygen atom."], "why": "A subscript counts the atoms of the element just before it.<br>The 2 comes just after the H, so the 2 counts 2 hydrogen atoms.<br>The O has no subscript, so there is 1 oxygen atom, and Idris is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Yuki says: \"In CO₂, the C has no subscript, so one particle holds 1 carbon atom.\" Is Yuki correct?", "options": ["yes", "no"], "key": 0, "fb": ["The C has no subscript, and a symbol with no subscript counts one atom: 1 carbon atom.", "A symbol with no subscript still counts one atom, so the C counts 1 carbon atom."], "why": "The C has no subscript after it.<br>A symbol with no subscript counts one atom.<br>So one CO₂ particle holds 1 carbon atom, and Yuki is correct."}, {"type": "mcq", "tag": "transfer", "stem": "NO₂ is a brown gas in car exhaust. Read NO₂ as counts of atoms in one particle. Which reading is correct?", "options": ["2 nitrogen atoms and 1 oxygen atom", "2 nitrogen atoms and 2 oxygen atoms", "1 nitrogen atom and 2 oxygen atoms"], "key": 2, "fb": ["The 2 comes after the O, not the N, so it counts oxygen atoms; the N has no subscript: 1 nitrogen atom.", "The N has no subscript, so 1 nitrogen atom; only the O carries the 2.", "The N has no subscript: 1 nitrogen atom. The 2 after the O counts 2 oxygen atoms."], "why": "The N has no subscript, so it counts 1 nitrogen atom.<br>The 2 comes just after the O, so it counts 2 oxygen atoms.<br>So one NO₂ particle holds 1 nitrogen atom and 2 oxygen atoms."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video read the label H₂O. What did it say the small 2 counts?", "options": ["hydrogen atoms", "oxygen atoms", "water particles"], "key": 0, "fb": ["The 2 sits just after the H, so it counts hydrogen atoms: 2 hydrogen atoms.", "The 2 comes after the H, not the O; the O with no subscript is 1 oxygen atom.", "A subscript counts atoms in one particle, not particles."], "why": "A subscript counts the atoms of the element just before it.<br>The 2 comes just after the H.<br>So the 2 counts 2 hydrogen atoms."}]}, {"id": "L02", "atom": "MAT-060", "title": "Count the atoms in a formula", "video": "could do without a video", "lesson_type": "Procedural lesson (a three-step routine): take the symbols one at a time, read each subscript as that element's count (no subscript counts one), add the counts for the total; no term coined", "check_design": "Type (b) scaffolded sequence → one recall MCQ (L01: what a subscript counts), the worked count on the page (glucose C₆H₁₂O₆, then CH₄ and HCl as second and third example sets), four scaffold steps on a fresh second case (propane C₃H₈: which elements; carbon atoms; hydrogen atoms; atoms in all), seven bare typed counts on fresh formulas (NH₃ hydrogen; H₂O₂ oxygen; CaCO₃ oxygen; NaCl total; SO₂ total; C₂H₆O hydrogen; H₂SO₄ total), and one student claim (Kofi: H₂O₂ holds 2 atoms; key no). 13 items.", "headache": ["A food-science book lists glucose, the sugar in grapes, honey and your blood, as C₆H₁₂O₆.", "One glucose particle is built from many atoms.", "How many carbon atoms, hydrogen atoms and oxygen atoms does one particle hold, and how many atoms in all?"], "forest": ["How do you count the atoms in a formula?", "Take the symbols one at a time.", "The subscript after each symbol is the count of that element's atoms, and a symbol with no subscript counts one atom.", "Add the counts together for the total.", "Glucose holds 6 carbon atoms, 12 hydrogen atoms and 6 oxygen atoms: 24 atoms in one particle."], "article": [{"t": "idea", "text": "A food-science book lists glucose, the sugar in grapes, honey and your blood, as C₆H₁₂O₆."}, {"t": "fig", "key": "glucose_formula", "cap": "The formula of glucose, C₆H₁₂O₆: three symbols, each followed by a subscript."}, {"t": "idea", "text": "One glucose particle is built from many atoms."}, {"t": "idea", "text": "How many carbon atoms, hydrogen atoms and oxygen atoms does one particle hold, and how many atoms in all?"}, {"t": "h", "text": "Formulas, again"}, {"t": "idea", "text": "A chemical formula writes one particle of a substance."}, {"t": "idea", "text": "Each symbol names one element, and the subscript after it counts that element's atoms."}, {"t": "idea", "text": "A symbol with no subscript counts one atom."}, {"t": "h", "text": "Count one element at a time"}, {"t": "idea", "text": "To count the atoms in a formula, there are three steps to follow."}, {"t": "idea", "text": "<b>1.<\/b> Take the symbols one at a time: C, then H, then O."}, {"t": "idea", "text": "<b>2.<\/b> Read the subscript after each symbol; that subscript is the count of that element's atoms."}, {"t": "idea", "text": "<b>3.<\/b> Add the counts together for the total."}, {"t": "h", "text": "Count glucose"}, {"t": "idea", "text": "C₆: the 6 after the C counts 6 carbon atoms."}, {"t": "idea", "text": "H₁₂: the 12 after the H counts 12 hydrogen atoms."}, {"t": "idea", "text": "O₆: the 6 after the O counts 6 oxygen atoms."}, {"t": "idea", "text": "Add the counts: 6 + 12 + 6 = 24, so one glucose particle holds 24 atoms."}, {"t": "fig", "key": "count_glucose", "cap": "The counting table for C₆H₁₂O₆: 6 carbon atoms, 12 hydrogen atoms, 6 oxygen atoms, 24 atoms in all."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Methane, the main gas in a kitchen stove flame, is CH₄."}, {"t": "idea", "text": "The C has no subscript, so the C counts 1 carbon atom."}, {"t": "idea", "text": "H₄: the 4 after the H counts 4 hydrogen atoms."}, {"t": "idea", "text": "Add the counts: 1 + 4 = 5, so one CH₄ particle holds 5 atoms."}, {"t": "fig", "key": "ch4_read", "cap": "Reading CH₄ against its particle: one gray circle for 1 carbon atom, four small dark circles for 4 hydrogen atoms."}, {"t": "fig", "key": "count_methane", "cap": "The counting table for CH₄: 1 carbon atom, 4 hydrogen atoms, 5 atoms in all."}, {"t": "h", "text": "A formula with no subscripts at all"}, {"t": "idea", "text": "Hydrochloric acid, the acid in your stomach, is HCl."}, {"t": "idea", "text": "Neither symbol has a subscript."}, {"t": "idea", "text": "So the H counts 1 hydrogen atom, and the Cl counts 1 chlorine atom."}, {"t": "idea", "text": "Add the counts: 1 + 1 = 2, so one HCl particle holds 2 atoms."}, {"t": "fig", "key": "hcl_read", "cap": "Reading HCl against its particle: one small dark circle for 1 hydrogen atom joined to one large light circle for 1 chlorine atom."}, {"t": "fig", "key": "count_hcl", "cap": "The counting table for HCl: 1 hydrogen atom, 1 chlorine atom, 2 atoms in all."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To count the atoms in a formula, take the symbols one at a time. The subscript after a symbol is the count of that element's atoms, and a symbol with no subscript counts one atom. Add the counts together for the total: atoms in one particle = the counts added together."}, {"t": "idea", "text": "Back to glucose: C₆H₁₂O₆ is 6 carbon atoms, 12 hydrogen atoms and 6 oxygen atoms."}, {"t": "idea", "text": "Added together, that is 24 atoms in one glucose particle."}], "script": [{"say": "A food-science book lists glucose, the sugar in grapes, as C₆H₁₂O₆.", "screen": "[the book page; C₆H₁₂O₆ large]"}, {"say": "One glucose particle is built from many atoms: how many of each element, and how many in all?", "screen": "[four blanks: C ?, H ?, O ?, all ?]"}, {"say": "A formula writes one particle, and each subscript counts that element's atoms.", "screen": "[H₂O with its particle; the 2 boxed]"}, {"say": "To count the atoms in a formula, there are three steps to follow.", "screen": "[1, 2, 3 as bold numbers]"}, {"say": "One: take the symbols one at a time: C, then H, then O.", "screen": "[C, H, O light up in turn]"}, {"say": "Two: read the subscript after each symbol: that subscript is that element's count.", "screen": "[6, 12, 6 boxed in turn]"}, {"say": "C₆ is 6 carbon atoms, H₁₂ is 12 hydrogen atoms, and O₆ is 6 oxygen atoms.", "screen": "[table rows fill: carbon 6, hydrogen 12, oxygen 6]"}, {"say": "Three: add the counts for the total: 6 plus 12 plus 6 is 24 atoms in one glucose particle.", "screen": "[total row: 24]"}, {"say": "Now consider methane, CH₄: the C with no subscript is 1 carbon atom.", "screen": "[CH₄ beside its particle; table row: carbon 1]"}, {"say": "The 4 after the H is 4 hydrogen atoms: 5 atoms in all.", "screen": "[the 4 boxed; table row: hydrogen 4; total 5]"}, {"say": "So here is the rule: take the symbols one at a time, read each subscript as its count, and add the counts.", "screen": "[rule slide reuses the glucose table; rule text]"}, {"say": "Back to glucose: 6 carbon, 12 hydrogen and 6 oxygen atoms, 24 in one particle.", "screen": "[the four blanks filled]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In a chemical formula, what does a subscript count?", "options": ["the atoms of the element just before it", "the atoms of the element just after it", "the particles of the substance"], "key": 0, "fb": ["A subscript counts the atoms of the element whose symbol comes just before it.", "A subscript belongs to the symbol before it, not after it.", "A subscript counts atoms in one particle, not particles."], "why": "A subscript is written just after a symbol.<br>It counts the atoms of that element in one particle.<br>So a subscript counts the atoms of the element just before it."}, {"type": "mcq", "tag": "scaffold", "stem": "Propane, the gas in a camping stove, is C₃H₈. Which elements does C₃H₈ name?", "options": ["carbon and hydrogen", "carbon only"], "key": 0, "fb": ["Two capital letters, C and H: two elements, carbon and hydrogen.", "The H is a second symbol, so a second element, hydrogen, is in the particle."], "why": "Take the symbols one at a time: C, then H.<br>C is carbon and H is hydrogen.<br>So C₃H₈ names carbon and hydrogen."}, {"type": "text", "tag": "scaffold", "stem": "In C₃H₈, read the subscript after the C. How many carbon atoms does one propane particle hold?", "accept": ["3", "3 carbon atoms", "three", "3 atoms"], "why": "The subscript after the C is 3.<br>A subscript counts the atoms of the element just before it.<br>So one propane particle holds 3 carbon atoms."}, {"type": "text", "tag": "scaffold", "stem": "In C₃H₈, read the subscript after the H. How many hydrogen atoms does one propane particle hold?", "accept": ["8", "8 hydrogen atoms", "eight", "8 atoms"], "why": "The subscript after the H is 8.<br>A subscript counts the atoms of the element just before it.<br>So one propane particle holds 8 hydrogen atoms."}, {"type": "text", "tag": "scaffold", "stem": "Add your two counts for C₃H₈ together. How many atoms in all does one propane particle hold?", "accept": ["11", "11 atoms", "eleven", "11 atoms in all"], "why": "One propane particle holds 3 carbon atoms and 8 hydrogen atoms.<br>Add the counts: 3 + 8 = 11.<br>So one propane particle holds 11 atoms."}, {"type": "text", "tag": "bare", "stem": "Ammonia, a sharp-smelling gas in some cleaners, is NH₃. How many hydrogen atoms does one ammonia particle hold?", "accept": ["3", "3 hydrogen atoms", "three", "3 atoms"], "why": "The subscript after the H is 3.<br>So one ammonia particle holds 3 hydrogen atoms."}, {"type": "text", "tag": "bare", "stem": "Hydrogen peroxide, the liquid that bleaches hair, is H₂O₂. How many oxygen atoms does one hydrogen peroxide particle hold?", "accept": ["2", "2 oxygen atoms", "two", "2 atoms"], "why": "The subscript after the O is 2.<br>So one hydrogen peroxide particle holds 2 oxygen atoms."}, {"type": "text", "tag": "bare", "stem": "Seashells and eggshell are calcium carbonate, CaCO₃. How many oxygen atoms does one CaCO₃ particle hold?", "accept": ["3", "3 oxygen atoms", "three", "3 atoms"], "why": "The subscript after the O is 3.<br>So one CaCO₃ particle holds 3 oxygen atoms."}, {"type": "text", "tag": "bare", "stem": "Table salt is NaCl. How many atoms in all does one NaCl particle hold?", "accept": ["2", "2 atoms", "two"], "why": "Na has no subscript: 1 sodium atom. Cl has no subscript: 1 chlorine atom.<br>Add the counts: 1 + 1 = 2.<br>So one NaCl particle holds 2 atoms."}, {"type": "text", "tag": "bare", "stem": "The sharp gas from a struck match is sulfur dioxide, SO₂. How many atoms in all does one SO₂ particle hold?", "accept": ["3", "3 atoms", "three"], "why": "S has no subscript: 1 sulfur atom. The 2 after the O: 2 oxygen atoms.<br>Add the counts: 1 + 2 = 3.<br>So one SO₂ particle holds 3 atoms."}, {"type": "text", "tag": "bare", "stem": "Ethanol, the alcohol in many hand sanitizers, is C₂H₆O. How many hydrogen atoms does one C₂H₆O particle hold?", "accept": ["6", "6 hydrogen atoms", "six", "6 atoms"], "why": "The subscript after the H is 6.<br>So one C₂H₆O particle holds 6 hydrogen atoms."}, {"type": "text", "tag": "bare", "stem": "The acid in a car battery is H₂SO₄. How many atoms in all does one H₂SO₄ particle hold?", "accept": ["7", "7 atoms", "seven"], "why": "H₂: 2 hydrogen atoms. S with no subscript: 1 sulfur atom. O₄: 4 oxygen atoms.<br>Add the counts: 2 + 1 + 4 = 7.<br>So one H₂SO₄ particle holds 7 atoms."}, {"type": "mcq", "tag": "misconception", "stem": "Kofi says: \"One particle of H₂O₂ holds 2 atoms.\" Is Kofi correct?", "options": ["yes", "no"], "key": 1, "fb": ["The 2 after the H is 2 hydrogen atoms and the 2 after the O is 2 oxygen atoms: 4 atoms in all, not 2.", "Count each element: 2 hydrogen atoms and 2 oxygen atoms, so one H₂O₂ particle holds 4 atoms."], "why": "The 2 after the H counts 2 hydrogen atoms.<br>The 2 after the O counts 2 oxygen atoms.<br>Add the counts: 2 + 2 = 4 atoms, so Kofi is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video counted the atoms in C₆H₁₂O₆. How many atoms did it find in all?", "options": ["6", "12", "24"], "key": 2, "fb": ["6 is the carbon count, or the oxygen count; the total adds all three.", "12 is the hydrogen count alone; the total adds all three.", "6 carbon atoms + 12 hydrogen atoms + 6 oxygen atoms = 24 atoms."], "why": "The video read the three subscripts: 6, 12 and 6.<br>It added the counts: 6 + 12 + 6 = 24.<br>So one glucose particle holds 24 atoms."}]}, {"id": "L03", "atom": "MAT-059b", "title": "Change a subscript, change the substance", "video": "definitely a video", "lesson_type": "Concept lesson (what, then why): a changed subscript builds a different particle, and a different particle is a different substance with its own properties; no term coined", "check_design": "Type (c) concept understanding → two recall MCQs (L02: what a subscript counts; Topic 7: a compound has its own properties), the what (is H₂O₂ water? key no), one what from a drawing (N₂O and NO₂ drawn: the same substance? key no), the why as a free response on a FRESH case (O₂ and O₃), one student-claim misconception (Anouk: H₂O₂ is water with a bit more oxygen mixed in; key no), two transfers (NO and NO₂: same or different; SO₂ and SO₃: which statement), one true claim (Milo: CO and CO₂ are different substances because their particles differ; key yes), and one typed transfer (ethane C₂H₆ and ethene C₂H₄: how many fewer hydrogen atoms). 10 items.", "headache": ["H₂O is water, and you drink it.", "H₂O₂ is hydrogen peroxide: it bleaches hair, and it stings in a cut.", "The two formulas differ by one small 2.", "Why does one small number make a different substance?"], "forest": ["Why does changing a subscript change the substance?", "A subscript counts the atoms in one particle, so change the count and you have built a different particle.", "A substance's properties come from its particles, so a different particle is a different substance.", "H₂O₂ is not water with a little extra oxygen: hydrogen peroxide is a different substance from water."], "article": [{"t": "idea", "text": "H₂O is water, and you drink it."}, {"t": "idea", "text": "H₂O₂ is hydrogen peroxide: it bleaches hair, and it stings in a cut."}, {"t": "idea", "text": "The two formulas differ by one small 2."}, {"t": "fig", "key": "water_peroxide", "cap": "One water particle and one hydrogen peroxide particle side by side, each with its formula. Under them, one property of each substance."}, {"t": "idea", "text": "Why does one small number make a different substance?"}, {"t": "h", "text": "Counting and compounds, again"}, {"t": "idea", "text": "A subscript counts the atoms of the element just before it, in one particle."}, {"t": "idea", "text": "A compound's particles are new particles, so a compound has its own properties."}, {"t": "h", "text": "Two different particles"}, {"t": "idea", "text": "Count H₂O: 2 hydrogen atoms and 1 oxygen atom, 3 atoms."}, {"t": "idea", "text": "Count H₂O₂: 2 hydrogen atoms and 2 oxygen atoms, 4 atoms in one hydrogen peroxide particle."}, {"t": "idea", "text": "The hydrogen peroxide particle holds one more oxygen atom than the water particle."}, {"t": "idea", "text": "So the small 2 after the O builds a different particle."}, {"t": "fig", "key": "water_peroxide_counted", "cap": "Counting the two particles: H₂O holds 3 atoms, H₂O₂ holds 4; the extra oxygen atom in H₂O₂ is ringed."}, {"t": "h", "text": "A different particle is a different substance"}, {"t": "idea", "text": "A substance's properties come from its particles."}, {"t": "idea", "text": "Water's particles are H₂O, so water has water's properties: safe to drink."}, {"t": "idea", "text": "Hydrogen peroxide's particles are H₂O₂, so hydrogen peroxide has its own properties: it bleaches, and it stings."}, {"t": "idea", "text": "H₂O₂ is not water with a little extra oxygen mixed in."}, {"t": "idea", "text": "Hydrogen peroxide is a different substance from water, because its particle is a different particle."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "CO is carbon monoxide, a poisonous gas that a faulty heater can give off."}, {"t": "idea", "text": "CO₂ is carbon dioxide, the gas you breathe out."}, {"t": "idea", "text": "The CO₂ particle holds one more oxygen atom than the CO particle, so it is a different particle."}, {"t": "idea", "text": "A different particle is a different substance."}, {"t": "idea", "text": "So carbon dioxide has its own properties, and carbon monoxide has its own."}, {"t": "fig", "key": "co_co2", "cap": "One carbon monoxide particle and one carbon dioxide particle side by side, the extra oxygen atom in CO₂ ringed; under them, one property of each substance."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A subscript counts the atoms in one particle. Change a subscript, and you have built a different particle. A substance's properties come from its particles, so a different particle is a different substance, with its own properties."}, {"t": "idea", "text": "Back to the two formulas: H₂O₂ holds one more oxygen atom than H₂O: a different particle."}, {"t": "idea", "text": "So hydrogen peroxide is a different substance from water: you drink one, and the other bleaches hair."}], "script": [{"say": "H₂O is water, and you drink it.", "screen": "[a glass of water; H₂O beside its particle]"}, {"say": "H₂O₂ is hydrogen peroxide: it bleaches hair, and it stings in a cut.", "screen": "[a brown bottle; H₂O₂ beside its particle]"}, {"say": "The two formulas differ by one small 2: why does one small number make a different substance?", "screen": "[the two formulas; the extra 2 glows; question mark]"}, {"say": "A subscript counts the atoms in one particle.", "screen": "[H₂O: the 2 boxed; its particle]"}, {"say": "A compound's particles are new particles, so a compound has its own properties.", "screen": "[the water particle; its property line: safe to drink]"}, {"say": "Count H₂O: 2 hydrogen atoms and 1 oxygen atom, 3 atoms.", "screen": "[the water particle; counts appear]"}, {"say": "Now watch one more oxygen atom join the water particle.", "screen": "[a large open circle slides in and joins; the formula's O gains a subscript 2]"}, {"say": "Count H₂O₂: 2 hydrogen atoms and 2 oxygen atoms, 4 atoms: a different particle.", "screen": "[the extra oxygen ringed; counts appear]"}, {"say": "A substance's properties come from its particles, so a different particle is a different substance.", "screen": "[the label under the particle switches from WATER to HYDROGEN PEROXIDE]"}, {"say": "H₂O₂ is not water with extra oxygen mixed in: hydrogen peroxide is its own substance.", "screen": "[the two particles side by side; the property table]"}, {"say": "Now consider CO, a poisonous gas, and CO₂, the gas you breathe out.", "screen": "[CO and CO₂ beside their particles]"}, {"say": "The CO₂ particle holds one more oxygen atom: a different particle, so a different substance.", "screen": "[the extra oxygen ringed; the two property rows]"}, {"say": "So here is the rule: change a subscript, and you have built a different particle: a different substance.", "screen": "[rule slide reuses the water and peroxide particles; rule text]"}, {"say": "Back to the two bottles: one small 2 apart, and you drink one while the other bleaches hair.", "screen": "[the glass and the brown bottle]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In a chemical formula, what does a subscript count?", "options": ["the particles in a sample", "the atoms of the element just before it", "the elements in the particle"], "key": 1, "fb": ["A subscript counts atoms in one particle, not particles in a sample.", "A subscript counts the atoms of the element whose symbol comes just before it.", "The symbols name the elements; the subscript counts one element's atoms."], "why": "A subscript is written just after a symbol.<br>It counts that element's atoms in one particle.<br>So a subscript counts the atoms of the element just before it."}, {"type": "mcq", "tag": "recall", "stem": "Table salt is a compound of sodium and chlorine. Whose properties does table salt have?", "options": ["its own properties", "sodium's properties", "chlorine's properties"], "key": 0, "fb": ["A compound's particles are new particles, so a compound has its own properties.", "Sodium is a soft metal that fizzes in water; table salt is neither, because its particles are new particles.", "Chlorine is a poisonous green gas; table salt is safe to eat, because its particles are new particles."], "why": "A compound's particles are new particles.<br>A substance's properties come from its particles.<br>So table salt has its own properties, not sodium's or chlorine's."}, {"type": "mcq", "tag": "what", "stem": "Is H₂O₂ water?", "options": ["yes", "no"], "key": 1, "fb": ["Water is H₂O. The H₂O₂ particle holds one more oxygen atom, so it is a different particle and a different substance.", "The H₂O₂ particle holds 2 oxygen atoms and the water particle holds 1, so H₂O₂ is a different substance: hydrogen peroxide."], "why": "Water's particles are H₂O.<br>The H₂O₂ particle holds one more oxygen atom, so it is a different particle.<br>A different particle is a different substance, so H₂O₂ is not water."}, {"type": "mcq", "tag": "what", "fig": "l3_draw", "stem": "In this drawing, light gray circles are nitrogen atoms, large open circles are oxygen atoms, and touching circles are joined. Do particle 1 and particle 2 show the same substance?", "options": ["yes", "no"], "key": 1, "fb": ["Particle 1 holds 2 nitrogen atoms and 1 oxygen atom; particle 2 holds 1 nitrogen atom and 2 oxygen atoms. Different particles, different substances.", "The counts differ: particle 1 has 2 nitrogen atoms and 1 oxygen atom, particle 2 has 1 nitrogen atom and 2 oxygen atoms, so they are different substances."], "why": "Count particle 1: 2 light gray circles and 1 large open circle, so 2 nitrogen atoms and 1 oxygen atom.<br>Count particle 2: 1 nitrogen atom and 2 oxygen atoms.<br>The particles differ, so the substances differ."}, {"type": "frq", "tag": "why", "task": "O₂ is the oxygen gas you breathe, and O₃ is ozone, a gas that is poisonous to breathe. Both formulas hold only oxygen atoms. Explain why ozone is a different substance from oxygen gas.", "starter": "A subscript counts…", "model": "A subscript counts the atoms in one particle.<br>An O₂ particle holds 2 oxygen atoms, and an O₃ particle holds 3 oxygen atoms.<br>So the O₃ particle is a different particle.<br>A substance's properties come from its particles.<br>So ozone is a different substance from oxygen gas, with its own properties.", "points": ["a subscript counts the atoms in one particle: 2 oxygen atoms against 3", "so the O₃ particle is a different particle", "a substance's properties come from its particles, so ozone is a different substance"]}, {"type": "mcq", "tag": "misconception", "stem": "Anouk says: \"H₂O₂ is just water with a bit more oxygen mixed in.\" Is Anouk correct?", "options": ["yes", "no"], "key": 1, "fb": ["Nothing is mixed in: the extra oxygen atom is joined into the particle itself, so the particle is a different particle.", "The extra oxygen atom is joined into the H₂O₂ particle, so the particle is different and the substance is different."], "why": "In H₂O₂ the second oxygen atom is joined into the particle, not mixed into the liquid.<br>So the H₂O₂ particle is a different particle from the water particle.<br>A different particle is a different substance, so Anouk is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "NO and NO₂ are two gases. Are NO and NO₂ different substances or the same substance?", "options": ["different substances", "the same substance"], "key": 0, "fb": ["The NO₂ particle holds 2 oxygen atoms and the NO particle holds 1: different particles, so different substances.", "The NO₂ particle holds one more oxygen atom than the NO particle, so it is a different particle and a different substance."], "why": "Count the oxygen atoms: 1 in NO, 2 in NO₂.<br>So the two particles are different particles.<br>A different particle is a different substance."}, {"type": "mcq", "tag": "transfer", "stem": "SO₂ and SO₃ are two compounds of sulfur and oxygen whose formulas differ by one subscript. Which statement is correct?", "options": ["They are different substances, each with its own properties.", "They are the same substance, one a little richer in oxygen."], "key": 0, "fb": ["The SO₃ particle holds 3 oxygen atoms and the SO₂ particle holds 2: different particles, so different substances with their own properties.", "A changed subscript builds a different particle, not a richer version of the same one; the substances differ."], "why": "The subscripts differ: 2 oxygen atoms in SO₂, 3 oxygen atoms in SO₃.<br>So the two particles are different particles.<br>A different particle is a different substance, with its own properties."}, {"type": "mcq", "tag": "misconception", "stem": "Milo says: \"CO and CO₂ are different substances, because their particles are different.\" Is Milo correct?", "options": ["yes", "no"], "key": 0, "fb": ["The CO₂ particle holds one more oxygen atom than the CO particle; a different particle is a different substance, as Milo says.", "The CO particle holds 1 oxygen atom and the CO₂ particle holds 2, so the particles differ, and a different particle is a different substance."], "why": "The CO particle holds 1 oxygen atom, and the CO₂ particle holds 2 oxygen atoms.<br>So the two particles are different particles.<br>A different particle is a different substance, so Milo is correct."}, {"type": "text", "tag": "transfer", "stem": "Ethane, C₂H₆, is a gas in natural gas. Ethene, C₂H₄, is the gas that ripens fruit. How many fewer hydrogen atoms does one ethene particle hold than one ethane particle?", "accept": ["2", "2 hydrogen atoms", "two", "2 atoms", "2 fewer"], "why": "The subscript after the H is 6 in C₂H₆ and 4 in C₂H₄.<br>6 − 4 = 2.<br>So one ethene particle holds 2 fewer hydrogen atoms, and that makes it a different substance."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video joined one more oxygen atom onto the water particle. What did the label under it change to?", "options": ["still water", "hydrogen peroxide", "oxygen gas"], "key": 1, "fb": ["With one more oxygen atom joined, the particle is H₂O₂, a different particle, so the label switched.", "The particle became H₂O₂, and the label switched from water to hydrogen peroxide.", "Oxygen gas is O₂; this particle still held its 2 hydrogen atoms."], "why": "One more oxygen atom joined the water particle, making H₂O₂.<br>A different particle is a different substance.<br>So the label switched to hydrogen peroxide."}]}, {"id": "L04", "atom": "MAT-061", "title": "A number in front: coefficients", "video": "could do without a video", "lesson_type": "Procedural lesson (a two-step routine) with a one-step sort inside it: a full-size number in front counts whole particles and multiplies every count in the formula; the sort is subscript or coefficient; coins coefficient", "check_design": "Type (b) scaffolded sequence, with a type (a) fluency run on the sort inside it → one recall MCQ (L02: the oxygen count in one SO₂ particle), the coined term typed, a fluency run of four subscript-or-coefficient items on formulas whose two numbers look alike (2SO₂ front; 2SO₂ small 2, with a third option 'elements' so the pair does not follow by elimination — second blind read, 25 Sep 2026; 5O₂ small 2; 3CH₄ front; keys p a a p; none on the scaffold's 4NH₃), the worked count on the page (2H₂O, then 3CO₂), three scaffold steps on a fresh case (4NH₃: hydrogen atoms in one particle; how many particles; hydrogen atoms in all), three bare typed counts (5O₂ oxygen; 2C₆H₁₂O₆ carbon; 3CH₄ atoms in all), one drawing → line item (three CO particles), and one student claim (Esme: 3H₂O holds 3 + 2 hydrogen atoms and 3 + 1 oxygen atoms; key no — adding and multiplying differ on both counts). 14 items.", "headache": ["Two water particles sit side by side.", "Chemists want to write the two particles, not one.", "You cannot change the subscripts.", "A changed subscript builds a different particle.", "Write H₂O₂, and you have hydrogen peroxide, not two waters.", "So how do you write two water particles?"], "forest": ["What does a full-size number in front of a formula mean?", "A full-size number in front of a formula is called a coefficient, and it counts whole particles: 2H₂O means two water particles.", "One water particle holds 2 hydrogen atoms and 1 oxygen atom, so two hold 4 hydrogen atoms and 2 oxygen atoms.", "So a coefficient multiplies every count in the formula."], "article": [{"t": "idea", "text": "Two water particles sit side by side."}, {"t": "fig", "key": "two_waters", "cap": "Two water particles drawn side by side, with a key naming the circles."}, {"t": "idea", "text": "Chemists want to write the two particles, not one."}, {"t": "idea", "text": "You cannot change the subscripts."}, {"t": "idea", "text": "A changed subscript builds a different particle."}, {"t": "idea", "text": "Write H₂O₂, and you have hydrogen peroxide, not two waters."}, {"t": "idea", "text": "So how do you write two water particles?"}, {"t": "h", "text": "Counting, again"}, {"t": "idea", "text": "A subscript counts the atoms of the element just before it, in one particle."}, {"t": "idea", "text": "One water particle, H₂O, holds 2 hydrogen atoms and 1 oxygen atom: 3 atoms."}, {"t": "h", "text": "A number in front"}, {"t": "idea", "text": "Chemists write a full-size number in front of the formula: 2H₂O."}, {"t": "fig", "key": "two_waters_line", "cap": "Two water particles drawn side by side, and the line chemists write for them: 2H₂O, the 2 in front boxed."}, {"t": "idea", "text": "The 2 in front sits on the line, at full size, not written low."}, {"t": "idea", "text": "A full-size number written in front of a formula is called a <b>coefficient<\/b>."}, {"t": "idea", "text": "A coefficient counts whole particles: 2H₂O means two water particles."}, {"t": "h", "text": "Count the atoms in 2H₂O"}, {"t": "idea", "text": "One water particle holds 2 hydrogen atoms and 1 oxygen atom."}, {"t": "idea", "text": "Two water particles hold twice as many: 4 hydrogen atoms and 2 oxygen atoms."}, {"t": "idea", "text": "So a coefficient multiplies every count in the formula: 2 × 2 = 4 hydrogen atoms, and 2 × 1 = 2 oxygen atoms."}, {"t": "idea", "text": "In all, 2H₂O holds 2 × 3 = 6 atoms."}, {"t": "fig", "key": "count_2h2o", "cap": "The counting table for 2H₂O: each count in one particle, then the same count multiplied by the coefficient 2; 6 atoms in all."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Three carbon dioxide particles are written 3CO₂."}, {"t": "idea", "text": "One CO₂ particle holds 1 carbon atom and 2 oxygen atoms."}, {"t": "idea", "text": "Three CO₂ particles hold 3 × 1 = 3 carbon atoms and 3 × 2 = 6 oxygen atoms: 9 atoms in all."}, {"t": "fig", "key": "three_co2", "cap": "Three carbon dioxide particles drawn in a row, and the line 3CO₂ under them, the 3 in front boxed."}, {"t": "fig", "key": "count_3co2", "cap": "The counting table for 3CO₂: 3 carbon atoms and 6 oxygen atoms, 9 atoms in all."}, {"t": "h", "text": "Subscript or coefficient?"}, {"t": "idea", "text": "In 2H₂O there are two 2s, and they count different things."}, {"t": "idea", "text": "The full-size 2 in front is the coefficient: it counts particles."}, {"t": "idea", "text": "The small, low 2 after the H is a subscript: it counts hydrogen atoms in one particle."}, {"t": "fig", "key": "sub_vs_coef", "cap": "The two 2s of 2H₂O: the full-size 2 in front counts particles; the small, low 2 after the H counts hydrogen atoms."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A full-size number in front of a formula is called a coefficient, and it counts whole particles. A coefficient multiplies every count in the formula: atoms in all = the coefficient × the atoms in one particle."}, {"t": "idea", "text": "Back to the two water particles: chemists write them 2H₂O, a coefficient in front of water's own formula."}, {"t": "idea", "text": "Two water particles hold 4 hydrogen atoms and 2 oxygen atoms, 6 atoms in all."}], "script": [{"say": "Two water particles sit side by side, and chemists want to write the two particles, not one.", "screen": "[two water particles; H₂O under the first]"}, {"say": "You cannot change the subscripts: a changed subscript builds a different particle, not water.", "screen": "[the subscript 2 glows; H₂O₂ appears under the two particles and is crossed out: hydrogen peroxide, not water]"}, {"say": "So how do you write two water particles?", "screen": "[question mark]"}, {"say": "A subscript counts the atoms in one particle: one water particle holds 2 hydrogen atoms and 1 oxygen atom.", "screen": "[one particle; counts 2 and 1]"}, {"say": "Chemists write a full-size number in front of the formula: 2H₂O.", "screen": "[a large 2 slides in front of H₂O]"}, {"say": "A full-size number written in front of a formula is called a coefficient, and it counts whole particles.", "screen": "[chip: COEFFICIENT; the 2 boxed; the two particles ringed]"}, {"say": "One water particle holds 2 hydrogen atoms and 1 oxygen atom, so two hold 4 hydrogen and 2 oxygen atoms.", "screen": "[table: one particle 2, 1; two particles 4, 2]"}, {"say": "So a coefficient multiplies every count in the formula: 6 atoms in all.", "screen": "[total row: 6]"}, {"say": "Now consider three carbon dioxide particles, written 3CO₂.", "screen": "[three CO₂ particles; 3CO₂ under them, the 3 boxed]"}, {"say": "Three times 1 carbon and three times 2 oxygen: 9 atoms in all.", "screen": "[table fills: 3, 6, total 9]"}, {"say": "Two different 2s: the full-size 2 in front counts particles, and the small, low 2 after the H counts hydrogen atoms.", "screen": "[2H₂O with both 2s boxed and labeled]"}, {"say": "So here is the rule: a coefficient counts whole particles and multiplies every count in the formula.", "screen": "[rule slide reuses 2H₂O and its table; rule text]"}, {"say": "Back to the two water particles: 2H₂O, and 6 atoms in all.", "screen": "[the two particles; 2H₂O]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "How many oxygen atoms does ONE particle of SO₂ hold?", "options": ["1 oxygen atom", "2 oxygen atoms", "3 oxygen atoms"], "key": 1, "fb": ["The S has no subscript, so 1 sulfur atom; the 2 after the O counts oxygen atoms.", "The subscript after the O is 2, so one SO₂ particle holds 2 oxygen atoms.", "3 is the total of all the atoms; the oxygen atoms alone are 2."], "why": "The subscript after the O is 2.<br>A subscript counts the atoms of the element just before it.<br>So one SO₂ particle holds 2 oxygen atoms."}, {"type": "text", "tag": "term", "stem": "In 3CO₂, the 3 is a full-size number written in front of the formula. What is a number written like this called?", "accept": ["coefficient", "a coefficient", "the coefficient"], "why": "The 3 sits in front of the formula, at full size, on the line.<br>A full-size number written in front of a formula is called a coefficient."}, {"type": "mcq", "tag": "fluency", "stem": "In 2SO₂, what does the full-size 2 in front count?", "options": ["particles", "atoms"], "key": 0, "fb": ["A full-size number in front is a coefficient, and a coefficient counts whole particles: two SO₂ particles.", "The number in front counts particles; only a subscript counts atoms."], "why": "The 2 in front is full size and sits in front of the formula.<br>A number in front is a coefficient, and a coefficient counts whole particles.<br>So the 2 in front counts two SO₂ particles."}, {"type": "mcq", "tag": "fluency", "stem": "In 2SO₂, what does the small 2 count?", "options": ["particles", "atoms", "elements"], "key": 1, "fb": ["The small, low 2 is a subscript, and a subscript counts atoms: 2 oxygen atoms in one particle.", "The 2 is written small and low after the O, so it is a subscript: 2 oxygen atoms in one particle.", "The symbols S and O name the elements; the small, low 2 is a subscript, and a subscript counts atoms: 2 oxygen atoms in one particle."], "why": "The small 2 is written low, just after the O.<br>A small number written low after a symbol is a subscript, and a subscript counts atoms.<br>So the small 2 counts 2 oxygen atoms."}, {"type": "mcq", "tag": "fluency", "stem": "In 5O₂, what does the small 2 count?", "options": ["particles", "atoms"], "key": 1, "fb": ["The small, low 2 after the O is a subscript, and a subscript counts atoms: 2 oxygen atoms in one particle.", "The 2 is written small and low after the O, so it is a subscript: 2 oxygen atoms in one particle."], "why": "The 2 is written small and low, just after the O.<br>A subscript counts atoms.<br>So the 2 counts 2 oxygen atoms in one particle."}, {"type": "mcq", "tag": "fluency", "stem": "In 3CH₄, what does the 3 in front count?", "options": ["particles", "atoms"], "key": 0, "fb": ["A full-size number in front is a coefficient, and a coefficient counts whole particles: three CH₄ particles.", "The number in front counts particles; the small 4 is the one that counts atoms."], "why": "The 3 is full size and sits in front of the formula.<br>A coefficient counts whole particles.<br>So the 3 counts three CH₄ particles."}, {"type": "text", "tag": "scaffold", "stem": "Ammonia is NH₃. A chemist writes 4NH₃. How many hydrogen atoms does ONE NH₃ particle hold?", "accept": ["3", "3 hydrogen atoms", "three", "3 atoms"], "why": "The subscript after the H is 3.<br>So one NH₃ particle holds 3 hydrogen atoms."}, {"type": "text", "tag": "scaffold", "stem": "In 4NH₃, read the coefficient. How many NH₃ particles does 4NH₃ mean?", "accept": ["4", "4 particles", "four"], "why": "The 4 in front is the coefficient.<br>A coefficient counts whole particles.<br>So 4NH₃ means four NH₃ particles."}, {"type": "text", "tag": "scaffold", "stem": "Multiply your two answers for 4NH₃ together. How many hydrogen atoms does 4NH₃ hold in all?", "accept": ["12", "12 hydrogen atoms", "twelve", "12 atoms"], "why": "One NH₃ particle holds 3 hydrogen atoms.<br>4NH₃ is four particles, so multiply: 4 × 3 = 12.<br>So 4NH₃ holds 12 hydrogen atoms in all."}, {"type": "text", "tag": "bare", "stem": "How many oxygen atoms does 5O₂ hold in all?", "accept": ["10", "10 oxygen atoms", "ten", "10 atoms"], "why": "One O₂ particle holds 2 oxygen atoms.<br>The coefficient 5 means five particles: 5 × 2 = 10.<br>So 5O₂ holds 10 oxygen atoms in all."}, {"type": "text", "tag": "bare", "stem": "Glucose is C₆H₁₂O₆. How many carbon atoms does 2C₆H₁₂O₆ hold in all?", "accept": ["12", "12 carbon atoms", "twelve", "12 atoms"], "why": "One glucose particle holds 6 carbon atoms.<br>The coefficient 2 means two particles: 2 × 6 = 12.<br>So 2C₆H₁₂O₆ holds 12 carbon atoms in all."}, {"type": "text", "tag": "bare", "stem": "Methane, the main gas in natural gas, is CH₄. How many atoms in all does 3CH₄ hold?", "accept": ["15", "15 atoms", "fifteen", "15 atoms in all"], "why": "One CH₄ particle holds 1 carbon atom and 4 hydrogen atoms: 5 atoms.<br>The coefficient 3 means three particles: 3 × 5 = 15.<br>So 3CH₄ holds 15 atoms in all."}, {"type": "mcq", "tag": "transfer", "fig": "l4_draw", "stem": "Touching circles are joined. In this drawing, gray circles are carbon atoms and large open circles are oxygen atoms. Which line writes what is drawn?", "options": ["3CO", "CO₃", "C₃O₃"], "key": 0, "fb": ["Three identical particles, each 1 carbon atom joined to 1 oxygen atom: a coefficient 3 in front of CO.", "CO₃ would be ONE particle of 1 carbon atom and 3 oxygen atoms; the drawing shows three separate particles.", "C₃O₃ would be ONE particle of 6 atoms joined; the drawing shows three separate two-atom particles."], "why": "The drawing shows three separate particles, each 1 gray circle joined to 1 large open circle.<br>Each particle is CO.<br>Three whole particles take a coefficient of 3: 3CO."}, {"type": "mcq", "tag": "misconception", "stem": "Esme says: \"3H₂O holds 3 + 2 = 5 hydrogen atoms and 3 + 1 = 4 oxygen atoms.\" Is Esme correct?", "options": ["yes", "no"], "key": 1, "fb": ["A coefficient multiplies every count: 3 × 2 = 6 hydrogen atoms and 3 × 1 = 3 oxygen atoms; adding gives the wrong counts.", "Three water particles hold 3 × 2 = 6 hydrogen atoms and 3 × 1 = 3 oxygen atoms; Esme added instead of multiplying."], "why": "A coefficient multiplies every count in the formula.<br>Hydrogen: 3 × 2 = 6 hydrogen atoms, not 5.<br>Oxygen: 3 × 1 = 3 oxygen atoms, not 4, so Esme is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video wrote 2H₂O for two water particles. How many atoms in all did it count?", "options": ["3", "6", "9"], "key": 1, "fb": ["3 is the atoms in ONE water particle; the video multiplied by the coefficient 2.", "One water particle holds 3 atoms, and two particles hold 2 × 3 = 6 atoms.", "9 would be three water particles; the coefficient was 2."], "why": "One water particle holds 2 hydrogen atoms and 1 oxygen atom: 3 atoms.<br>The coefficient 2 means two particles, so multiply: 2 × 3 = 6.<br>So 2H₂O holds 6 atoms in all."}]}, {"id": "L05", "atom": "MAT-061", "title": "Parentheses: a group repeated", "video": "could do without a video", "lesson_type": "Procedural lesson in two parts (part 1: a subscript after a closing parenthesis repeats the whole group inside; part 2: a coefficient in front as well, parentheses first, then multiply); no term coined, parentheses keep their everyday name", "check_design": "Type (b) scaffolded sequence in each part → two recall MCQs (L02: a subscript's count; L04: what a coefficient counts), the worked counts on the page (Mg(OH)₂, then Al(OH)₃; part 2: 2Mg(OH)₂, then 3Ca(OH)₂), three scaffold steps on a fresh case (Ca(NO₃)₂ drawn: what the parentheses hold; oxygen atoms in one particle; atoms in all), three bare typed counts (Cu(OH)₂ hydrogen; Ba(NO₃)₂ oxygen; Ca₃(PO₄)₂ total), one student claim (Callum: the 2 in Mg(OH)₂ counts only the hydrogen atoms; key no), two scaffold steps on 2Al(OH)₃ (oxygen atoms in one particle; in all), and two bare typed counts (3Ba(NO₃)₂ oxygen; 2Zn(OH)₂ total). 13 items.", "headache": ["Milk of magnesia is a medicine for an upset stomach.", "The medicine in milk of magnesia is magnesium hydroxide.", "Magnesium hydroxide's formula is Mg(OH)₂.", "Parentheses wrap the O and the H, and a small 2 follows the closing parenthesis.", "What does that 2 count?"], "forest": ["What does a subscript after a closing parenthesis count?", "The parentheses hold a group of atoms, and the subscript after them repeats the whole group.", "(OH)₂ means two oxygen atoms and two hydrogen atoms, so Mg(OH)₂ holds 1 magnesium atom, 2 oxygen atoms and 2 hydrogen atoms: 5 atoms.", "When a coefficient sits in front as well, count one particle first, parentheses and all, then multiply every count by the coefficient."], "article": [{"t": "idea", "text": "Milk of magnesia is a medicine for an upset stomach."}, {"t": "idea", "text": "The medicine in milk of magnesia is magnesium hydroxide."}, {"t": "idea", "text": "Magnesium hydroxide's formula is Mg(OH)₂."}, {"t": "fig", "key": "mgoh2_bottle", "cap": "A bottle of milk of magnesia with the label Mg(OH)₂; the small 2 after the closing parenthesis is boxed."}, {"t": "idea", "text": "Parentheses wrap the O and the H, and a small 2 follows the closing parenthesis."}, {"t": "idea", "text": "What does that 2 count?"}, {"t": "h", "text": "Counting, again"}, {"t": "idea", "text": "A subscript counts the atoms of the element just before it, in one particle."}, {"t": "idea", "text": "A full-size number in front of a formula is a coefficient, and it counts whole particles."}, {"t": "h", "text": "What sits inside the parentheses"}, {"t": "idea", "text": "The parentheses hold a group of atoms: O and H, one oxygen atom and one hydrogen atom."}, {"t": "idea", "text": "The 2 after the closing parenthesis comes just after the whole group, not just after the H."}, {"t": "idea", "text": "So the 2 repeats the whole group: two OH groups."}, {"t": "idea", "text": "(OH)₂ means two oxygen atoms and two hydrogen atoms."}, {"t": "fig", "key": "mgoh2_read", "cap": "The formula Mg(OH)₂ above one particle of magnesium hydroxide: one large dark circle (magnesium) joined to two large open circles (oxygen), each carrying one small dark circle (hydrogen). The 2 after the closing parenthesis is boxed."}, {"t": "h", "text": "Count Mg(OH)₂"}, {"t": "idea", "text": "Mg has no subscript, so 1 magnesium atom."}, {"t": "idea", "text": "Inside the parentheses sits 1 oxygen atom, and the 2 repeats it: 2 oxygen atoms."}, {"t": "idea", "text": "Inside the parentheses sits 1 hydrogen atom, and the 2 repeats it: 2 hydrogen atoms."}, {"t": "idea", "text": "Add the counts: 1 + 2 + 2 = 5, so one Mg(OH)₂ particle holds 5 atoms."}, {"t": "fig", "key": "count_mgoh2", "cap": "The counting table for Mg(OH)₂: for oxygen and hydrogen, the count inside the parentheses times the 2 after them; 5 atoms in all."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Aluminum hydroxide, in some antacid tablets, is Al(OH)₃."}, {"t": "idea", "text": "The 3 after the closing parenthesis repeats the OH group 3 times."}, {"t": "idea", "text": "So Al(OH)₃ holds 1 aluminum atom, 3 oxygen atoms and 3 hydrogen atoms: 7 atoms in all."}, {"t": "fig", "key": "aloh3_read", "cap": "One particle of aluminum hydroxide beside its formula Al(OH)₃: one large dark circle (aluminum) joined to three large open circles (oxygen), each carrying one small dark circle (hydrogen)."}, {"t": "fig", "key": "count_aloh3", "cap": "The counting table for Al(OH)₃: 1 aluminum atom, 3 oxygen atoms, 3 hydrogen atoms, 7 atoms in all."}, {"t": "h", "text": "A coefficient and parentheses together"}, {"t": "idea", "text": "Two particles of milk of magnesia are written 2Mg(OH)₂."}, {"t": "idea", "text": "Count one particle first, parentheses and all: 1 magnesium atom, 2 oxygen atoms, 2 hydrogen atoms."}, {"t": "idea", "text": "Then multiply every count by the coefficient 2: 2 magnesium atoms, 4 oxygen atoms, 4 hydrogen atoms."}, {"t": "idea", "text": "In all, 2Mg(OH)₂ holds 2 × 5 = 10 atoms."}, {"t": "fig", "key": "two_mgoh2", "cap": "Two particles of milk of magnesia drawn side by side, and the line 2Mg(OH)₂ under them, the 2 in front boxed."}, {"t": "fig", "key": "count_2mgoh2", "cap": "The counting table for 2Mg(OH)₂: the count in one particle, then each count multiplied by the coefficient 2; 10 atoms in all."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Slaked lime, the white powder in lime plaster and mortar, is Ca(OH)₂."}, {"t": "idea", "text": "Three particles of slaked lime are written 3Ca(OH)₂."}, {"t": "fig", "key": "three_caoh2", "cap": "Three particles of slaked lime drawn in a row, and the line 3Ca(OH)₂ under them, the 3 in front boxed."}, {"t": "idea", "text": "One particle holds 1 calcium atom, 2 oxygen atoms and 2 hydrogen atoms."}, {"t": "idea", "text": "Three particles hold 3 calcium atoms, 6 oxygen atoms and 6 hydrogen atoms: 15 atoms in all."}, {"t": "fig", "key": "count_3caoh2", "cap": "The counting table for 3Ca(OH)₂: one particle first, then every count multiplied by the coefficient 3; 15 atoms in all."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A subscript after a closing parenthesis repeats the whole group inside the parentheses: for an element inside the parentheses, atoms of that element = the atoms inside the parentheses × the subscript after them. When a coefficient sits in front as well, count one particle first, then multiply every count by the coefficient."}, {"t": "idea", "text": "Back to milk of magnesia: the 2 after the parentheses repeats the whole OH group."}, {"t": "idea", "text": "So Mg(OH)₂ holds 1 magnesium atom, 2 oxygen atoms and 2 hydrogen atoms, 5 atoms in all."}], "script": [{"say": "The medicine in milk of magnesia is magnesium hydroxide, Mg(OH)₂.", "screen": "[the medicine bottle; Mg(OH)₂ large]"}, {"say": "Parentheses wrap the O and the H, and a small 2 follows the closing parenthesis.", "screen": "[the parentheses glow; the 2 boxed]"}, {"say": "What does that 2 count?", "screen": "[question mark]"}, {"say": "A subscript counts the element just before it, and a coefficient counts whole particles.", "screen": "[H₂O with its 2 boxed; 2H₂O with its 2 boxed]"}, {"say": "The parentheses hold a group of atoms: one oxygen atom and one hydrogen atom.", "screen": "[the OH group ringed on the particle]"}, {"say": "The 2 comes just after the whole group, so the 2 repeats the whole group: two OH groups.", "screen": "[a second OH group appears; both ringed]"}, {"say": "So Mg(OH)₂ holds 1 magnesium, 2 oxygen and 2 hydrogen atoms: 5 atoms in one particle.", "screen": "[the counting table fills; total 5]"}, {"say": "Now consider Al(OH)₃: the 3 repeats the OH group three times.", "screen": "[Al(OH)₃ beside its particle; the three OH groups ringed]"}, {"say": "So 1 aluminum, 3 oxygen and 3 hydrogen atoms: 7 atoms.", "screen": "[table fills: 1, 3, 3, total 7]"}, {"say": "With a coefficient in front as well, as in 2Mg(OH)₂, count one particle first, parentheses and all.", "screen": "[two particles; 2Mg(OH)₂; the one-particle column: 1, 2, 2]"}, {"say": "Then multiply every count by the coefficient: 2 magnesium, 4 oxygen and 4 hydrogen atoms: 10 atoms.", "screen": "[the two-particle column: 2, 4, 4; total 10]"}, {"say": "So here is the rule: a subscript after a closing parenthesis repeats the whole group, and a coefficient multiplies every count.", "screen": "[rule slide reuses the Mg(OH)₂ table; rule text]"}, {"say": "Back to milk of magnesia: the 2 repeats the whole OH group: 5 atoms in one particle.", "screen": "[the bottle; the particle; 5 atoms]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "How many oxygen atoms does ONE particle of SO₃ hold?", "options": ["1 oxygen atom", "3 oxygen atoms", "4 oxygen atoms"], "key": 1, "fb": ["The S has no subscript, so 1 sulfur atom; the 3 after the O counts oxygen atoms.", "The subscript after the O is 3, so one SO₃ particle holds 3 oxygen atoms.", "4 is the total of all the atoms; the oxygen atoms alone are 3."], "why": "The subscript after the O is 3.<br>A subscript counts the atoms of the element just before it.<br>So one SO₃ particle holds 3 oxygen atoms."}, {"type": "mcq", "tag": "recall", "stem": "In 4CO₂, what does the 4 in front count?", "options": ["whole particles", "carbon atoms", "oxygen atoms"], "key": 0, "fb": ["A full-size number in front is a coefficient, and a coefficient counts whole particles: four CO₂ particles.", "The carbon count is the C with no subscript: 1 carbon atom in each particle. The 4 in front counts particles.", "The oxygen count is the subscript 2. The 4 in front counts particles."], "why": "The 4 is full size and sits in front of the formula.<br>A number written like that is a coefficient.<br>A coefficient counts whole particles: four CO₂ particles."}, {"type": "mcq", "tag": "scaffold", "fig": "l5_draw", "stem": "Calcium nitrate, a fertilizer, is Ca(NO₃)₂. In the drawing, the large dark circle is calcium, light gray circles are nitrogen, large open circles are oxygen, and touching circles are joined. What does ONE group inside the parentheses hold?", "options": ["1 nitrogen atom and 1 oxygen atom", "1 nitrogen atom and 3 oxygen atoms", "3 nitrogen atoms and 3 oxygen atoms"], "key": 1, "fb": ["The 3 after the O is inside the parentheses, so one group holds 3 oxygen atoms, not 1.", "Inside the parentheses: N with no subscript, 1 nitrogen atom, and O₃, 3 oxygen atoms. In the drawing, each light gray circle carries three large open circles.", "The 3 comes just after the O, so it counts oxygen atoms only; the N has no subscript: 1 nitrogen atom."], "why": "Read inside the parentheses: N and O₃.<br>N has no subscript: 1 nitrogen atom. The 3 after the O: 3 oxygen atoms.<br>So one group holds 1 nitrogen atom and 3 oxygen atoms."}, {"type": "text", "tag": "scaffold", "stem": "In Ca(NO₃)₂, the 2 after the closing parenthesis repeats the group. How many oxygen atoms does one Ca(NO₃)₂ particle hold?", "accept": ["6", "6 oxygen atoms", "six", "6 atoms"], "why": "One group holds 3 oxygen atoms.<br>The 2 after the parentheses repeats the group: 2 × 3 = 6.<br>So one Ca(NO₃)₂ particle holds 6 oxygen atoms."}, {"type": "text", "tag": "scaffold", "stem": "In Ca(NO₃)₂, how many nitrogen atoms does one particle hold?", "accept": ["2", "2 nitrogen atoms", "two", "2 atoms"], "why": "One group holds 1 nitrogen atom.<br>The 2 after the parentheses repeats the group: 2 × 1 = 2.<br>So one Ca(NO₃)₂ particle holds 2 nitrogen atoms."}, {"type": "text", "tag": "scaffold", "stem": "Ca has no subscript: 1 calcium atom. Now add your calcium, nitrogen and oxygen counts. How many atoms in all does one Ca(NO₃)₂ particle hold?", "accept": ["9", "9 atoms", "nine", "9 atoms in all"], "why": "Ca has no subscript: 1 calcium atom.<br>Nitrogen: 2 atoms. Oxygen: 6 atoms.<br>Add the counts: 1 + 2 + 6 = 9 atoms."}, {"type": "text", "tag": "bare", "stem": "Copper hydroxide, a blue solid, is Cu(OH)₂. How many hydrogen atoms does one Cu(OH)₂ particle hold?", "accept": ["2", "2 hydrogen atoms", "two", "2 atoms"], "why": "Inside the parentheses, 1 hydrogen atom.<br>The 2 after the parentheses repeats the group: 2 × 1 = 2.<br>So one Cu(OH)₂ particle holds 2 hydrogen atoms."}, {"type": "text", "tag": "bare", "stem": "The green color in some fireworks comes from barium nitrate, Ba(NO₃)₂. How many oxygen atoms does one Ba(NO₃)₂ particle hold?", "accept": ["6", "6 oxygen atoms", "six", "6 atoms"], "why": "Inside the parentheses, 3 oxygen atoms.<br>The 2 after the parentheses repeats the group: 2 × 3 = 6.<br>So one Ba(NO₃)₂ particle holds 6 oxygen atoms."}, {"type": "text", "tag": "bare", "stem": "Calcium phosphate, Ca₃(PO₄)₂, is a close relative of the hard mineral in bones and teeth. How many atoms in all does one Ca₃(PO₄)₂ particle hold?", "accept": ["13", "13 atoms", "thirteen", "13 atoms in all"], "why": "Ca₃: 3 calcium atoms.<br>Inside the parentheses, 1 phosphorus atom and 4 oxygen atoms, repeated 2 times: 2 phosphorus atoms and 8 oxygen atoms.<br>Add the counts: 3 + 2 + 8 = 13 atoms."}, {"type": "mcq", "tag": "misconception", "stem": "Callum says: \"In Mg(OH)₂, the 2 counts only the hydrogen atoms, because the H is the letter just before it.\" Is Callum correct?", "options": ["yes", "no"], "key": 1, "fb": ["The 2 comes after the closing parenthesis, so it repeats everything inside the parentheses, not the H alone.", "The 2 sits after the closing parenthesis, so it repeats the whole OH group: 2 oxygen atoms and 2 hydrogen atoms."], "why": "The 2 comes just after the closing parenthesis, not just after the H.<br>A subscript after a closing parenthesis repeats the whole group inside.<br>So the 2 counts 2 oxygen atoms and 2 hydrogen atoms, and Callum is not correct."}, {"type": "text", "tag": "scaffold", "stem": "Calcium hypochlorite, the powder called pool chlorine, is Ca(ClO)₂. A chemist writes 3Ca(ClO)₂. Count one particle first: how many oxygen atoms does ONE Ca(ClO)₂ particle hold?", "accept": ["2", "2 oxygen atoms", "two", "2 atoms"], "why": "Inside the parentheses, 1 oxygen atom.<br>The 2 after the parentheses repeats the group: 2 × 1 = 2.<br>So one Ca(ClO)₂ particle holds 2 oxygen atoms."}, {"type": "text", "tag": "scaffold", "stem": "Now multiply your one-particle count by the coefficient. How many oxygen atoms does 3Ca(ClO)₂ hold in all?", "accept": ["6", "6 oxygen atoms", "six", "6 atoms"], "why": "One Ca(ClO)₂ particle holds 2 oxygen atoms.<br>The coefficient 3 means three particles: 3 × 2 = 6.<br>So 3Ca(ClO)₂ holds 6 oxygen atoms in all."}, {"type": "text", "tag": "bare", "stem": "How many oxygen atoms does 3Ba(NO₃)₂ hold in all?", "accept": ["18", "18 oxygen atoms", "eighteen", "18 atoms"], "why": "One Ba(NO₃)₂ particle: 3 oxygen atoms inside the parentheses × 2 = 6 oxygen atoms.<br>The coefficient 3 means three particles: 3 × 6 = 18.<br>So 3Ba(NO₃)₂ holds 18 oxygen atoms in all."}, {"type": "text", "tag": "bare", "stem": "Zinc hydroxide is Zn(OH)₂. How many atoms in all does 2Zn(OH)₂ hold?", "accept": ["10", "10 atoms", "ten", "10 atoms in all"], "why": "One Zn(OH)₂ particle: 1 zinc atom, 2 oxygen atoms, 2 hydrogen atoms, 5 atoms.<br>The coefficient 2 means two particles: 2 × 5 = 10.<br>So 2Zn(OH)₂ holds 10 atoms in all."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video read Mg(OH)₂. What did it say the 2 after the closing parenthesis repeats?", "options": ["the whole OH group", "only the H", "the Mg"], "key": 0, "fb": ["The 2 comes after the closing parenthesis, so it repeats everything inside: two OH groups.", "The 2 sits after the parenthesis, not just after the H, so it repeats the whole group.", "Mg sits outside the parentheses; the 2 repeats only what is inside them."], "why": "The 2 comes just after the closing parenthesis.<br>A subscript after a closing parenthesis repeats the whole group inside.<br>So the 2 repeats the whole OH group."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-059", "stem": "A chemist writes baking soda as NaHCO₃: symbols, with a small low number after one of them. This way of writing a substance is called its…", "accept": ["chemical formula", "formula", "a chemical formula", "the chemical formula", "its chemical formula", "a formula", "the formula"], "why": "The symbols name the elements, and the small numbers count the atoms.<br>This way of writing one particle of a substance is called its chemical formula."}, {"type": "text", "tag": "term", "atom": "MAT-059", "stem": "In SO₂, the 2 is written small and low, just after the O. A number written like this is called a…", "accept": ["subscript", "a subscript", "the subscript"], "why": "The 2 is small and low, just after a symbol.<br>A small number written low after a symbol is called a subscript."}, {"type": "text", "tag": "term", "atom": "MAT-061", "stem": "In 2NaCl, the 2 is full size and sits in front of the formula. A number written like this is called a…", "accept": ["coefficient", "a coefficient", "the coefficient"], "why": "The 2 is full size, in front of the formula.<br>A full-size number written in front of a formula is called a coefficient."}, {"type": "text", "tag": "count", "atom": "MAT-060", "stem": "Butane, the gas in a pocket lighter, is C₄H₁₀. How many hydrogen atoms does one butane particle hold?", "accept": ["10", "10 hydrogen atoms", "ten", "10 atoms"], "why": "The subscript after the H is 10.<br>So one butane particle holds 10 hydrogen atoms."}, {"type": "text", "tag": "count", "atom": "MAT-061", "stem": "How many atoms in all does 3H₂S hold?", "accept": ["9", "9 atoms", "nine", "9 atoms in all"], "why": "One H₂S particle holds 2 hydrogen atoms and 1 sulfur atom: 3 atoms.<br>The coefficient 3 means three particles: 3 × 3 = 9.<br>So 3H₂S holds 9 atoms in all."}, {"type": "text", "tag": "count", "atom": "MAT-061", "stem": "Some fertilizers are ammonium sulfate, (NH₄)₂SO₄. How many hydrogen atoms does one (NH₄)₂SO₄ particle hold?", "accept": ["8", "8 hydrogen atoms", "eight", "8 atoms"], "why": "Inside the parentheses, 4 hydrogen atoms.<br>The 2 after the parentheses repeats the group: 2 × 4 = 8.<br>So one (NH₄)₂SO₄ particle holds 8 hydrogen atoms."}, {"type": "text", "tag": "count", "atom": "MAT-061", "stem": "Some fertilizers are magnesium nitrate, Mg(NO₃)₂. How many nitrogen atoms does 2Mg(NO₃)₂ hold in all?", "accept": ["4", "4 nitrogen atoms", "four", "4 atoms"], "why": "One Mg(NO₃)₂ particle: 1 nitrogen atom inside the parentheses × 2 = 2 nitrogen atoms.<br>The coefficient 2 means two particles: 2 × 2 = 4.<br>So 2Mg(NO₃)₂ holds 4 nitrogen atoms in all."}, {"type": "frq", "tag": "why", "atom": "MAT-059b", "task": "Rust is Fe₂O₃, a red-brown powder. FeO is a black powder. Both are made only of iron and oxygen. Explain why FeO and Fe₂O₃ are different substances.", "starter": "A subscript counts…", "model": "A subscript counts the atoms in one particle.<br>An FeO particle holds 1 iron atom and 1 oxygen atom, and an Fe₂O₃ particle holds 2 iron atoms and 3 oxygen atoms.<br>So the two particles are different particles.<br>A substance's properties come from its particles.<br>So FeO and Fe₂O₃ are different substances, each with its own properties.", "points": ["a subscript counts the atoms in one particle, and the counts differ", "so the two particles are different particles", "a substance's properties come from its particles, so the substances differ"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-059", "fig": "pa_draw", "stem": "Touching circles are joined. In this drawing, large open circles are oxygen atoms. Which formula writes this particle?", "options": ["O₂", "O₃", "3O"], "key": 1, "fb": ["O₂ would be 2 oxygen atoms joined; the drawing has three circles joined.", "Three large open circles joined: 3 oxygen atoms in one particle, O₃ (ozone).", "3O would be three separate single atoms; the drawing shows one particle of three atoms joined."], "why": "Count the circles: 3 large open circles, touching.<br>Touching circles are joined, so this is one particle of 3 oxygen atoms.<br>A subscript counts the atoms in one particle: O₃."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-061", "stem": "Wren says: \"3O₂ holds 3 + 2 = 5 oxygen atoms.\" Is Wren correct?", "options": ["yes", "no"], "key": 1, "fb": ["The coefficient multiplies, it does not add: three particles of 2 oxygen atoms each is 3 × 2 = 6 oxygen atoms.", "Three O₂ particles hold 3 × 2 = 6 oxygen atoms; adding 3 + 2 gives the wrong count."], "why": "One O₂ particle holds 2 oxygen atoms.<br>The coefficient 3 means three particles, so multiply: 3 × 2 = 6.<br>So 3O₂ holds 6 oxygen atoms, and Wren is not correct."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-061", "stem": "In 2CaCO₃, which number counts whole particles?", "options": ["the full-size 2 in front", "the small 3 after the O"], "key": 0, "fb": ["The full-size number in front is the coefficient, and a coefficient counts whole particles.", "The small, low 3 is a subscript: it counts oxygen atoms in one particle, not particles."], "why": "A full-size number in front of a formula is a coefficient.<br>A coefficient counts whole particles.<br>So the 2 in front counts two CaCO₃ particles."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-060", "stem": "Potassium nitrate, KNO₃, is used in some fireworks. Read KNO₃ as counts of atoms in one particle. Which reading is correct?", "options": ["1 potassium atom, 1 nitrogen atom and 3 oxygen atoms", "3 potassium atoms, 3 nitrogen atoms and 3 oxygen atoms", "1 potassium atom and 3 oxygen atoms"], "key": 0, "fb": ["K and N have no subscripts, so 1 atom each; the 3 after the O counts 3 oxygen atoms.", "The 3 comes just after the O, so it counts oxygen atoms only.", "KNO₃ has three capital letters, so three elements; the N is nitrogen, 1 nitrogen atom."], "why": "Take the symbols one at a time: K, N, O.<br>K and N have no subscripts: 1 potassium atom and 1 nitrogen atom.<br>The 3 after the O counts 3 oxygen atoms."}], "pp100": [{"d": "easy", "atom": "MAT-059", "stem": "Epsom salt, used in some baths, is magnesium sulfate, MgSO₄; Mg is magnesium, S is sulfur, O is oxygen. What does the small 4 count?", "options": ["oxygen atoms", "sulfur atoms", "Epsom salt particles", "elements"], "key": 0, "why": "A subscript counts the atoms of the element just before it.<br>The 4 comes just after the O.<br>So the 4 counts oxygen atoms: 4 oxygen atoms in one particle."}, {"d": "easy", "atom": "MAT-061", "stem": "In 5CO, what is the full-size 5 in front of the formula called?", "options": ["a subscript", "a coefficient", "a chemical symbol", "a total"], "key": 1, "why": "A full-size number written in front of a formula is called a coefficient.<br>A subscript is the small number written low after a symbol.<br>The 5 is in front and full size, so it is a coefficient."}, {"d": "easy", "atom": "MAT-060", "stem": "Citric acid, the sour taste of lemons, is C₆H₈O₇; C is carbon, H is hydrogen, O is oxygen. How many oxygen atoms does one C₆H₈O₇ particle hold?", "options": ["1 oxygen atom", "6 oxygen atoms", "7 oxygen atoms", "21 oxygen atoms"], "key": 2, "why": "The subscript after the O is 7.<br>A subscript counts the atoms of the element just before it.<br>So one C₆H₈O₇ particle holds 7 oxygen atoms; the 6 counts carbon atoms, and 21 is every atom in the particle."}, {"d": "easy", "atom": "MAT-059b", "stem": "Two formulas differ by one subscript. What is true of the two substances they name?", "options": ["They are the same substance.", "They are different substances.", "They are the same substance in two states.", "One is a mixture that contains the other."], "key": 1, "why": "A subscript counts the atoms in one particle.<br>Different subscripts mean different particles.<br>A different particle is a different substance."}, {"d": "easy", "atom": "MAT-061", "stem": "Chlorine gas is Cl₂; Cl is chlorine. A chemist writes 2Cl₂. What does the full-size 2 in front count?", "options": ["chlorine atoms", "atoms in all", "elements", "particles"], "key": 3, "why": "The 2 in front is full size and sits in front of the formula, so it is a coefficient.<br>A coefficient counts whole particles.<br>So the 2 in front counts two Cl₂ particles; the small 2 counts chlorine atoms."}, {"d": "easy", "atom": "MAT-059", "fig": "pp_draw1", "stem": "Touching circles are joined. In this drawing, gray circles are carbon atoms and small dark circles are hydrogen atoms. Which formula writes this particle?", "options": ["CH", "C₂H", "C₂H₄", "C₂H₂"], "key": 3, "why": "Count the circles: 2 gray circles and 2 small dark circles.<br>So the particle holds 2 carbon atoms and 2 hydrogen atoms.<br>Each symbol takes the subscript 2: C₂H₂; CH would be one atom of each kind, and C₂H₄ would need 4 small dark circles."}, {"d": "easy", "atom": "MAT-059", "stem": "What does a chemical formula write?", "options": ["one particle of the substance", "one whole sample of the substance", "the everyday name of the substance", "the state of the substance: solid, liquid or gas"], "key": 0, "why": "A chemical formula writes one particle of a substance.<br>Each symbol names one element in that particle, and each subscript counts that element's atoms.<br>So H₂O writes one water particle: not a bottle of water, not its name, not its state."}, {"d": "easy", "atom": "MAT-059", "stem": "In a chemical formula, what does each symbol name?", "options": ["one element in the particle", "one substance mixed into the sample", "one particle of the substance", "one property of the substance"], "key": 0, "why": "Each letter group in a formula is a chemical symbol.<br>A chemical symbol is an element's short name.<br>So each symbol names one element in the particle; the subscript after it counts that element's atoms."}, {"d": "easy", "atom": "MAT-059", "stem": "Which of these four lines contains a subscript?", "options": ["ZnO", "2ZnO", "MgCl₂", "3LiOH"], "key": 2, "why": "A subscript is a small number written low, just after a symbol.<br>Only MgCl₂ has one: the small 2 after the Cl.<br>The 2 in 2ZnO and the 3 in 3LiOH are full size and in front, so they are coefficients, and ZnO has no number at all."}, {"d": "easy", "atom": "MAT-059", "stem": "Some toothpastes list stannous fluoride, SnF₂. Every chemical symbol is one or two letters, and only the first is a capital. Which are the chemical symbols in SnF₂?", "options": ["Sn and F", "S, n and F", "S and nF", "Sn and F₂"], "key": 0, "why": "A capital letter starts a new symbol, and a small letter belongs to the symbol before it.<br>S is a capital and n is small, so Sn is one symbol.<br>F is the next capital, so F is the second symbol; the 2 is a subscript, not part of a symbol."}, {"d": "easy", "atom": "MAT-060", "stem": "Yogurt's sour taste comes from lactic acid, C₃H₆O₃; C is carbon, H is hydrogen, O is oxygen. Which element has the most atoms in one C₃H₆O₃ particle?", "options": ["carbon", "hydrogen", "oxygen", "all three have the same number"], "key": 1, "why": "Read each subscript as that element's count.<br>Carbon 3, hydrogen 6, oxygen 3.<br>6 is the largest count, so hydrogen has the most atoms in one particle."}, {"d": "easy", "atom": "MAT-060", "stem": "O is oxygen. Which formula writes a particle with exactly one oxygen atom?", "options": ["ClO₂", "Cr₂O₃", "PbO", "P₂O₅"], "key": 2, "why": "A symbol with no subscript counts one atom.<br>In PbO the O has no subscript: 1 oxygen atom.<br>ClO₂ has 2 oxygen atoms, Cr₂O₃ has 3 and P₂O₅ has 5: the subscript after the O is the count."}, {"d": "easy", "atom": "MAT-059b", "stem": "What decides a substance's properties?", "options": ["its everyday name", "the amount of it in the sample", "the elements it is made from", "its particles"], "key": 3, "why": "A substance's properties come from its particles.<br>Water's particles are H₂O, so water has water's properties, however much of it there is.<br>A compound's particles are new particles, so a compound has its own properties, not its elements' properties."}, {"d": "easy", "atom": "MAT-061", "stem": "Which of these four lines writes more than one particle?", "options": ["H₂", "PCl₃", "Li₂O", "4KCl"], "key": 3, "why": "A full-size number in front of a formula is a coefficient, and a coefficient counts whole particles.<br>4KCl has the coefficient 4: four KCl particles.<br>The small 2s and the small 3 in H₂, PCl₃ and Li₂O are subscripts: they count atoms inside ONE particle."}, {"d": "easy", "atom": "MAT-061", "stem": "Alum, KAl(SO₄)₂, keeps homemade pickles crisp; K is potassium, Al is aluminum, S is sulfur, O is oxygen. What does the 2 after the closing parenthesis repeat?", "options": ["only the O₄ just before it", "the whole SO₄ group", "the K and the Al", "the whole formula"], "key": 1, "why": "A subscript after a closing parenthesis repeats the whole group inside the parentheses.<br>Inside the parentheses sits SO₄: 1 sulfur atom and 4 oxygen atoms.<br>So the 2 repeats the whole SO₄ group; K and Al sit outside the parentheses and are not repeated."}, {"d": "medium", "atom": "MAT-060", "stem": "Which formula writes a particle of exactly 3 atoms?", "options": ["CO₂", "H₂O₂", "CH₄", "NH₃"], "key": 0, "why": "Add each formula's counts: CO₂ is 1 + 2 = 3 atoms.<br>H₂O₂ is 4 atoms, CH₄ is 5 atoms, NH₃ is 4 atoms.<br>So CO₂ is the particle of 3 atoms."}, {"d": "medium", "atom": "MAT-060", "stem": "The acid in vinegar is C₂H₄O₂; C is carbon, H is hydrogen, O is oxygen. How many atoms in all does one C₂H₄O₂ particle hold?", "options": ["3 atoms", "6 atoms", "8 atoms", "16 atoms"], "key": 2, "why": "C₂: 2 carbon atoms. H₄: 4 hydrogen atoms. O₂: 2 oxygen atoms.<br>Add the counts: 2 + 4 + 2 = 8.<br>So one particle holds 8 atoms; the counts are added, never multiplied."}, {"d": "medium", "atom": "MAT-060", "stem": "Aspirin is C₉H₈O₄ and caffeine is C₈H₁₀N₄O₂; H is hydrogen. Which holds more hydrogen atoms in one particle, and by how many?", "options": ["aspirin, by 1 hydrogen atom", "caffeine, by 2 hydrogen atoms", "caffeine, by 4 hydrogen atoms", "the same number of hydrogen atoms"], "key": 1, "why": "Read the subscript after the H in each: 8 in C₉H₈O₄, 10 in C₈H₁₀N₄O₂.<br>10 − 8 = 2.<br>So caffeine holds 2 more hydrogen atoms; the 9 and the 8 at the front count carbon atoms, and the 4 counts nitrogen atoms."}, {"d": "medium", "atom": "MAT-059b", "stem": "Bao reads that NaNO₂, the curing salt that keeps bacon pink, is poisonous in large amounts. Bao wonders about NaNO₃, a fertilizer. Which statement is correct?", "options": ["NaNO₃ has the same properties as NaNO₂.", "NaNO₃ is NaNO₂ with extra air in it.", "NaNO₃ is a different substance from NaNO₂.", "NaNO₃ is a mixture of NaNO₂ and oxygen gas."], "key": 2, "why": "The NaNO₃ particle holds one more oxygen atom than the NaNO₂ particle, joined into the particle.<br>So it is a different particle.<br>A different particle is a different substance, with its own properties."}, {"d": "medium", "atom": "MAT-061", "stem": "Sulfur trioxide is SO₃; S is sulfur, O is oxygen. How many atoms in all does 3SO₃ hold?", "options": ["4 atoms", "9 atoms", "10 atoms", "12 atoms"], "key": 3, "why": "One SO₃ particle holds 1 sulfur atom and 3 oxygen atoms: 4 atoms.<br>The coefficient 3 means three particles: 3 × 4 = 12.<br>So 3SO₃ holds 12 atoms in all; 9 is the oxygen atoms alone, and 10 multiplies only the oxygen."}, {"d": "medium", "atom": "MAT-061", "stem": "Nickel hydroxide, in some rechargeable batteries, is Ni(OH)₂; Ni is nickel, O is oxygen, H is hydrogen. How many oxygen atoms does one Ni(OH)₂ particle hold?", "options": ["1 oxygen atom", "2 oxygen atoms", "3 oxygen atoms", "4 oxygen atoms"], "key": 1, "why": "Inside the parentheses, 1 oxygen atom.<br>The 2 after the parentheses repeats the whole group: 2 × 1 = 2.<br>So one Ni(OH)₂ particle holds 2 oxygen atoms."}, {"d": "medium", "atom": "MAT-061", "stem": "Aluminum sulfate, used to clean water, is Al₂(SO₄)₃; Al is aluminum, S is sulfur, O is oxygen. How many oxygen atoms does 2Al₂(SO₄)₃ hold in all?", "options": ["4 oxyg
