<script id="data" type="application/json">{"topic": {"code": "CP1", "title": "Checkpoint 1 — Matter you can see and handle (Topics 1–6)", "blurb": ["Everything from the first six topics, in one test: particles and the three states, changing state, physical properties, density,", "pure substances and mixtures, and solutions and separating mixtures.", "Every question is a new case; the ideas are the ones you have already used."], "lexicon": [], "terms": {}, "coined_at": {}, "intro_script": [], "summary_script": [], "intro_question": [], "summary_question": []}, "lessons": [], "practice": [], "pp100": [{"d": "easy", "atom": "MAT-001", "topic": "T1", "stem": "A fog machine fills a school stage with thick white fog. Which observation shows that the fog is matter?", "options": ["You can see the fog clearly from the back row of the theater.", "The fog feels cold when it touches the bare skin on your arm.", "You can hear the fog hiss as it pours out of the machine.", "A bag of fog reads more on a balance than the empty bag."], "key": 3, "why": "Matter is anything that has mass and takes up space.<br>A balance measures mass.<br>The bag of fog reads more than the empty bag, so the fog has mass.<br>Being seen, feeling cold or being heard does not show mass: light can be seen, heat feels cold or warm and sound can be heard, and none of them is matter.", "type": "mcq"}, {"d": "easy", "atom": "MAT-002", "topic": "T1", "stem": "A student lists four things from a day at the beach. Which one is too small to see?", "options": ["a grain of sand", "a drop of seawater", "a bubble of sea foam", "one particle of salt"], "key": 3, "why": "All matter is made of particles that are far too small to see.<br>A grain of sand, a drop of water and a bubble are each made of a huge number of particles, so each is big enough to see.<br>One particle of salt is a single particle, so it is far too small to see.", "type": "mcq"}, {"d": "easy", "atom": "MAT-018b", "topic": "T1", "fig": "cp_four_boxes", "stem": "Which box shows the particles of a gas?", "options": ["box A", "box B", "box C", "box D"], "key": 3, "why": "In a gas the particles are far apart and fly fast in every direction, so a gas fills its whole container.<br>Box D shows particles far apart, spread through the whole box.<br>Box B's particles are far apart but all sit in the bottom half: a gas never leaves the top of its container empty.", "type": "mcq"}, {"d": "easy", "atom": "MAT-019b", "topic": "T1", "stem": "A student has a jar of water. Which action gives the water's particles more kinetic energy?", "options": ["warming the water", "cooling the water", "pouring the water into a bigger jar", "pouring the water into two smaller jars"], "key": 0, "why": "Heating gives particles energy and speeds them up.<br>Faster particles have more kinetic energy.<br>Cooling takes energy away.<br>Moving the water to other jars changes where the particles are, not how fast they move.", "type": "mcq"}, {"d": "easy", "atom": "MAT-020", "topic": "T2", "fig": "cp_melt_boxes", "stem": "The boxes show the particles of one substance before and after a change of state. Which change do the boxes show?", "options": ["freezing", "evaporation", "condensation", "melting"], "key": 3, "why": "Before, the particles are packed in fixed positions and vibrate on the spot: a solid.<br>After, the particles still touch but have no fixed positions and slide: a liquid.<br>A solid turning into a liquid is melting.", "type": "mcq"}, {"d": "easy", "atom": "MAT-022", "topic": "T2", "stem": "A pot of water is heating on a stove. Which observation would show that the water is boiling and not just evaporating?", "options": ["The water level in the pot slowly goes down.", "Bubbles of water vapor form all through the water.", "Water vapor rises from the pot into the air above it.", "The pot feels hot to touch."], "key": 1, "why": "In evaporation, only the fastest particles at the surface fly off as a gas.<br>In boiling, particles all through the water fly off, as bubbles of water vapor.<br>So bubbles forming all through the water show boiling.<br>The level dropping and vapor rising happen in both; a hot pot shows heating, not which change.", "type": "mcq"}, {"d": "easy", "atom": "MAT-024", "topic": "T2", "stem": "A white solid in a dish shrinks over a week. Which observation would show that the solid sublimed instead of melting?", "options": ["The solid got smaller every day.", "No liquid ever appeared in the dish.", "The dish felt cold to touch.", "The solid changed color as it shrank."], "key": 1, "why": "Melting is a solid turning into a liquid.<br>Sublimation is a solid turning straight into a gas, skipping the liquid.<br>So the one question is: did a liquid ever form?<br>If no liquid ever appeared, the solid sublimed.", "type": "mcq"}, {"d": "easy", "atom": "MAT-005", "topic": "T3", "stem": "A camper has a log of firewood. Which fact about the log can she find out without changing the log into anything else?", "options": ["whether it burns", "what color its ash is", "how hot its flame gets", "its mass"], "key": 3, "why": "A physical property is something you can observe or measure about a material without changing it into anything else.<br>A balance measures the log's mass, and the log is unchanged afterward.<br>To learn whether it burns, what its ash looks like or how hot its flame gets, the camper must burn the log, changing it into ash and smoke.", "type": "mcq"}, {"d": "easy", "atom": "MAT-006", "topic": "T3", "stem": "A cook needs to know the mass of a bag of rice. Which tool gives the mass?", "options": ["a graduated cylinder", "a ruler", "a thermometer", "a balance"], "key": 3, "why": "Mass is the amount of material in something.<br>A balance measures mass, in grams or kilograms.<br>A graduated cylinder measures the volume of a liquid, a ruler measures length and a thermometer measures temperature.", "type": "mcq"}, {"d": "easy", "atom": "MAT-015", "topic": "T4", "stem": "A jeweler wants to know whether a small charm and a large bracelet are made of the same metal. Different metals can look alike. Which measurement tells the jeweler for sure?", "options": ["their mass", "their volume", "their density", "their color and shine"], "key": 2, "why": "Density belongs to the material, not to the size of the piece.<br>A small piece and a large piece of the same metal have the same density.<br>Their masses and volumes differ because the pieces are different sizes, and shape says nothing about the material.", "type": "mcq"}, {"d": "easy", "atom": "MAT-027", "topic": "T5", "fig": "cp_four_sample_boxes", "stem": "Each box shows a sample zoomed in so that its particles can be seen. Filled and open circles are two different kinds of particle. Which box shows a pure substance?", "options": ["box A", "box B", "box C", "box D"], "key": 1, "why": "A pure substance contains only one kind of matter: zoom in, and every particle is the same kind.<br>In box B every circle is filled, so box B holds one kind of particle.<br>Boxes A, C and D each hold two kinds of particle, filled and open, so each is a mixture.", "type": "mcq"}, {"d": "easy", "atom": "MAT-033", "topic": "T6", "stem": "A student stirs a powder into a glass of water. Which observation shows that the powder and the water made a solution?", "options": ["The powder sinks and sits in a heap on the bottom of the glass.", "The liquid turns cloudy, and the powder slowly settles to the bottom.", "The powder vanishes, and the liquid looks the same all through.", "The powder floats in a layer on top of the water."], "key": 2, "why": "A solution is a mixture in which one substance has dissolved evenly into another.<br>Dissolved particles are too small to see and spread evenly through the liquid.<br>So the powder vanishes and the liquid looks the same all through.<br>Powder that sinks, settles or floats has stayed as grains, so it did not dissolve.", "type": "mcq"}, {"d": "easy", "atom": "MAT-035", "topic": "T6", "fig": "cp_two_glasses_shade", "stem": "Two glasses hold the same amount of water, each with grape drink powder dissolved in it. Which glass has more powder dissolved in it?", "options": ["glass A", "glass B", "Both hold the same amount of powder.", "You cannot tell from the color."], "key": 1, "why": "The water is the same in both glasses, so only the amount of dissolved powder differs.<br>More powder in the same water means a more concentrated drink.<br>For a colored solute, a more concentrated solution is darker.<br>Glass B is darker, so glass B holds more powder.", "type": "mcq"}, {"d": "medium", "atom": "MAT-003", "topic": "T1", "stem": "Someone chops an onion in the kitchen. Two minutes later the smell reaches the living room. The onion is then wrapped up and thrown out. What do the onion particles already in the living room do next?", "options": ["They stop moving and stay where they are.", "They sink down and settle on the floor.", "They move back toward the kitchen.", "They keep moving and spread out farther."], "key": 3, "why": "Particles are always moving. They never stop.<br>The onion particles in the living room keep flying in every direction.<br>So they spread out farther through the house, and the smell gets fainter.<br>Throwing the onion out stops new particles arriving; it does not stop the ones already there.", "type": "mcq"}, {"d": "medium", "atom": "MAT-004", "topic": "T1", "fig": "cp_two_liquids_speed", "stem": "The two boxes show the particles in two samples of the same liquid. The arrows show how fast the particles move. Which sample is warmer?", "options": ["sample A", "sample B", "Both are at the same temperature.", "You cannot tell from the arrows."], "key": 0, "why": "Heating makes particles move faster. Cooling makes them move more slowly.<br>The arrow in sample A is longer, so its particles move faster.<br>Faster particles mean a warmer sample.<br>So sample A is warmer.", "type": "mcq"}, {"d": "medium", "atom": "MAT-016", "topic": "T1", "fig": "cp_state_table", "stem": "A student tests three samples. The table shows the results. Which sample is a gas?", "options": ["sample 1", "sample 2", "sample 3", "samples 2 and 3"], "key": 2, "why": "A gas keeps neither its own shape nor its own volume: it spreads to fill whatever space it is given.<br>Sample 3 keeps neither, so sample 3 is a gas.<br>Sample 2 keeps its volume but not its shape, so sample 2 is a liquid.<br>Sample 1 keeps both, so sample 1 is a solid.", "type": "mcq"}, {"d": "medium", "atom": "MAT-016b", "topic": "T1", "fig": "cp_box_solid_item", "stem": "The box shows the particles in a sample. The sample is tipped out of a cup onto a plate. What happens to it?", "options": ["It spreads out to the shape of the plate.", "It keeps its shape.", "It spreads out through the whole room.", "It breaks apart into single particles."], "key": 1, "why": "In the box the particles are packed tightly, touching, in fixed positions, and each one vibrates on the spot.<br>Particles in fixed positions cannot slide past one another.<br>So the sample is a solid, and a solid keeps its own shape wherever it is put.", "type": "mcq"}, {"d": "medium", "atom": "MAT-017b", "topic": "T1", "stem": "A crayon lies on the dashboard of a car on a hot day. One end has melted into a puddle; the other end is still hard. Zoom in on the particles. Which is different about the melted end's particles compared with the hard end's?", "options": ["whether they touch the particles next to them", "whether they move at all", "whether they have fixed positions", "how big each particle is"], "key": 2, "why": "In a solid the particles touch and stay in fixed positions, vibrating on the spot.<br>In a liquid the particles still touch, but they have no fixed positions and slide past one another.<br>So the one difference is the fixed positions.<br>The particles at both ends touch and move, and a wax particle is the same size melted or hard.", "type": "mcq"}, {"d": "medium", "atom": "MAT-004+MAT-019b", "topic": "T1", "stem": "A swimming pool holds water at 26 °C. A cup holds tea at 80 °C. In which one does each water particle have more kinetic energy?", "options": ["in the pool", "in the tea", "The same in both.", "You cannot tell without the amount of water in each."], "key": 1, "why": "Kinetic energy is energy of movement.<br>Heating makes particles move faster, so each water particle at 80 °C moves faster than one at 26 °C.<br>Faster particles have more kinetic energy.<br>How much water there is does not change how fast each particle moves.", "type": "mcq"}, {"d": "medium", "atom": "MAT-003+MAT-033", "topic": "T1", "type": "frq", "task": "Tamsin drops a spoon of salt into a jar of still water. The salt sinks to the bottom and dissolves there. Nobody stirs the jar. A week later the water at the very top of the jar tastes salty. Explain how the salt reached the top of the water without any stirring.", "starter": "The salt dissolved into particles too small to see. These particles…", "model": "The salt dissolved into particles too small to see. These particles are always moving.<br>They moved among the water particles in every direction.<br>So the salt particles spread through the whole jar, up to the top.<br>So the water at the top tastes salty.", "points": 3}, {"d": "medium", "atom": "MAT-016b+MAT-017b", "topic": "T1", "type": "frq", "task": "A block of cheese keeps its shape on a plate. The same cheese, melted, spreads out across a pizza. Explain the difference, using how the particles are arranged and how they move in each case.", "starter": "In the block of cheese, the particles…", "model": "In the block of cheese, the particles are packed tightly, touching, in fixed positions.<br>Each particle vibrates on the spot, so the block keeps its shape.<br>In the melted cheese, the particles still touch but have no fixed positions.<br>They slide past one another, so the melted cheese spreads out.", "points": 4}, {"d": "medium", "atom": "MAT-021+MAT-026", "topic": "T2", "stem": "A sealed bottle of apple juice is left in a freezer until the juice is solid. Which of these is the same before and after the juice froze?", "options": ["the arrangement of the juice's particles", "the movement of the juice's particles", "the state of the juice", "the mass of the juice"], "key": 3, "why": "The bottle is sealed, so every juice particle is still inside.<br>The same particles are all still there, so the mass is the same.<br>Freezing changes how the particles are arranged and how they move: they lock into fixed positions and vibrate instead of sliding.<br>So the state changes too, from liquid to solid.", "type": "mcq"}, {"d": "medium", "atom": "MAT-023", "topic": "T2", "stem": "On a warm, humid day a student sets four things on the kitchen counter. Which one gets covered in drops of water?", "options": ["a mug of hot tea", "a plate at room temperature", "a watermelon just out of the refrigerator", "a table lamp that has been switched on for an hour"], "key": 2, "why": "The air holds water vapor.<br>Gas particles that touch a cold surface lose energy, slow down and crowd together, touching and sliding.<br>So the water vapor condenses into drops on the cold watermelon.<br>The warm mug, the room-temperature plate and the hot lamp do not take energy away from the vapor's particles.", "type": "mcq"}, {"d": "medium", "atom": "MAT-025+MAT-027", "topic": "T2", "stem": "Icicles hang from the edge of a roof. A student knocks a few into a clean bucket, where they melt into a clear liquid. Which category does the liquid in the bucket belong to?", "options": ["a pure substance", "a homogeneous mixture of melted ice and water", "a heterogeneous mixture", "a new substance made by melting"], "key": 0, "why": "Icicles are frozen water: water particles locked into fixed positions.<br>A change of state never makes a new substance, so melting gives back liquid water.<br>Zoom in on the liquid, and every particle is a water particle: one kind of matter.<br>A sample with one kind of matter is a pure substance.", "type": "mcq"}, {"d": "medium", "atom": "MAT-026b+MAT-022", "topic": "T2", "stem": "Two dishes of the same kind each hold 200 g of water. One dish has a tight lid; the other is open. Both stand in the sun for a week. Which dish now holds less water?", "options": ["the covered dish", "the open dish", "Both still hold 200 g of water.", "Both hold less, by the same amount."], "key": 1, "why": "In the open dish, the fastest water particles at the surface fly off as water vapor and leave the dish.<br>The lid on the covered dish keeps every water particle inside, so its water still reads 200 g.<br>So after a week the open dish holds less water.", "type": "mcq"}, {"d": "medium", "atom": "MAT-022", "topic": "T2", "type": "frq", "task": "A pot of water boils on a stove. Beside it, a wet floor slowly dries. In both cases liquid water turns into water vapor. Describe where the particles leave the liquid in each case.", "starter": "On the drying floor, the particles leave…", "model": "On the drying floor, the particles leave from the surface of the water only.<br>Only the fastest particles at the surface fly off as a gas.<br>In the boiling pot, particles leave from all through the water.<br>They fly apart deep inside the water and form bubbles of water vapor that rise and burst.", "points": 3}, {"d": "medium", "atom": "MAT-007", "topic": "T3", "fig": "cp_cyl_tomato", "stem": "A recipe needs 200 mL of tomato juice. The graduated cylinder shows the juice a student has poured so far. How much more juice does she need to add?", "options": ["25 mL", "175 mL", "200 mL", "225 mL"], "key": 1, "why": "The flat top of the juice sits on the small mark halfway between 0 mL and 50 mL, so the cylinder holds 25 mL.<br>more needed = 200 mL − 25 mL = 175 mL", "type": "mcq"}, {"d": "medium", "atom": "MAT-012+MAT-041", "topic": "T3", "stem": "Kavi stirs salt and poppy seeds into a beaker of water, then pours the mixture through filter paper. The seeds stay on the paper. The liquid that runs through is clear and tastes salty. Which of the two solids is soluble?", "options": ["neither of them", "the poppy seeds only", "the salt only", "both of them"], "key": 2, "why": "A material that dissolves in water is soluble; one that does not is insoluble.<br>The seeds stayed whole and were held on the paper, so the seeds did not dissolve: insoluble.<br>The salt cannot be seen, and the liquid tastes salty, so the salt dissolved and passed through as particles too small to see: soluble.", "type": "mcq"}, {"d": "medium", "atom": "MAT-013", "topic": "T3", "fig": "cp_circuit_table", "stem": "A student puts four materials, one at a time, between the clips of a simple circuit. The table shows the results. Which two materials could be used for the core of an electrical wire, the part that carries the electricity?", "options": ["copper and rubber", "rubber and glass", "glass and iron", "copper and iron"], "key": 3, "why": "The core of a wire must let electricity pass through: it must be a conductor.<br>The bulb lit with copper and with iron between the clips, so copper and iron conduct electricity.<br>The bulb stayed dark with rubber and with glass, so those two are insulators.", "type": "mcq"}, {"d": "medium", "atom": "MAT-008", "topic": "T4", "fig": "cp_beads_pair", "stem": "Five identical ceramic beads are lowered into the water in a graduated cylinder. The drawing shows the water before and after. What is the volume of one bead?", "options": ["3 cm³", "10 cm³", "12 cm³", "15 cm³"], "key": 0, "why": "volume of all five beads = end reading − start reading = 75 mL − 60 mL = 15 mL = 15 cm³<br>The five beads are identical, so each bead pushed aside the same amount of water.<br>volume of one bead = 15 cm³ ÷ 5 = 3 cm³", "type": "mcq"}, {"d": "medium", "atom": "MAT-011+MAT-015", "topic": "T4", "stem": "A flat steel plate sinks when it is dropped into a tank of water. A solid steel ball with the same mass as the plate is dropped into the same tank. What happens to the ball?", "options": ["It sinks.", "It floats.", "It floats at first and then sinks.", "It sinks only if it is bigger than the plate."], "key": 0, "why": "Density belongs to the material, not to the size or shape of the piece.<br>The plate sank, so steel is denser than water.<br>The solid ball is also steel, so it has the same density as the plate.<br>An object denser than the liquid sinks, so the ball sinks.", "type": "mcq"}, {"d": "medium", "atom": "MAT-008+MAT-010", "topic": "T4", "type": "frq", "fig": "cp_pendant_pair", "task": "A metal pendant reads 45 g on a balance. The drawing shows the water in a graduated cylinder before and after the pendant is lowered under the water. Calculate the density of the pendant. Show your work.", "starter": "volume of the pendant = end reading − start reading =", "model": "volume of the pendant = end reading − start reading = 55 mL − 50 mL = 5 mL = 5 cm³<br>density = mass ÷ volume<br>density = 45 g ÷ 5 cm³<br>density = 9 g/cm³", "points": 3}, {"d": "medium", "atom": "MAT-028+MAT-029", "topic": "T5", "stem": "Ngozi sweeps a workshop floor and holds a magnet over the sweepings. Gray flakes jump onto the magnet, and sawdust stays behind. What do the two heaps show about the sweepings?", "options": ["The sweepings were a pure substance.", "The magnet turned part of the sweepings into steel.", "The sweepings were a mixture.", "The sweepings became a mixture when the magnet touched them."], "key": 2, "why": "In a mixture each substance keeps its own properties, so the parts can be separated.<br>The magnet pulled out the steel flakes and left the sawdust, so the sweepings held two substances mingled together.<br>A sample with two or more substances mingled together is a mixture.<br>A magnet cannot turn one substance into another.", "type": "mcq"}, {"d": "medium", "atom": "MAT-029+MAT-013", "topic": "T5", "stem": "A jar holds metal coins mixed with plastic buttons. A student takes one coin out of the jar and puts it between the clips of a simple circuit. What happens?", "options": ["The bulb stays dark.", "The bulb lights, but only dimly.", "The bulb lights.", "The bulb lights only if the coin is washed first."], "key": 2, "why": "In a mixture each substance keeps its own properties.<br>The coin is still metal, and metals conduct electricity.<br>So electricity passes through the coin, and the bulb lights.<br>Being mixed with the buttons takes nothing away from the coin.", "type": "mcq"}, {"d": "medium", "atom": "MAT-030", "topic": "T5", "stem": "A jar holds a thick sauce that a student cannot see through. Which test would tell her whether the sauce is homogeneous or heterogeneous?", "options": ["Compare a spoonful from the top with a spoonful from the bottom.", "Put the jar on a balance and read its mass.", "Hold the jar up to a bright window to see whether light gets through.", "Tip the jar to see whether the sauce pours."], "key": 0, "why": "A homogeneous mixture is the same all the way through; a heterogeneous mixture is different in different places.<br>So the test is to take samples from different places and compare them.<br>If the top spoonful and the bottom spoonful are the same, the sauce is homogeneous.<br>Mass, clearness and pouring do not show whether the sauce is the same everywhere.", "type": "mcq"}, {"d": "medium", "atom": "MAT-034", "topic": "T6", "stem": "A first-aid liquid is made by dissolving a small amount of solid iodine in a bottle of alcohol. Which is the solvent?", "options": ["the iodine", "the alcohol", "the first-aid liquid", "Neither of them."], "key": 1, "why": "The substance that dissolves is the solute; the substance it dissolves into is the solvent.<br>The iodine dissolves, so the iodine is the solute.<br>The iodine dissolves into the alcohol, so the alcohol is the solvent.<br>Water is a common solvent, but any liquid a solute dissolves into is a solvent.", "type": "mcq"}, {"d": "medium", "atom": "MAT-035", "topic": "T6", "stem": "Gabe pours half of a glass of grape drink into a second, empty glass. How do the concentrations of the two glasses compare?", "options": ["The glass with more drink in it is more concentrated.", "The glass with less drink in it is more concentrated.", "The two glasses have the same concentration.", "Each glass is half as concentrated as the drink was before."], "key": 2, "why": "The drink was a solution, with the powder spread evenly through the water.<br>Pouring moves some of the powder and the same share of the water together.<br>Nothing was added and nothing was taken out of either part.<br>So every sip in both glasses is as strong as before: the same concentration.", "type": "mcq"}, {"d": "medium", "atom": "MAT-037", "topic": "T6", "stem": "A sealed bottle holds water with a sugar cube resting in it. The bottle reads 420 g on a balance. Zia shakes the bottle until the whole cube has dissolved. What does the balance read now?", "options": ["less than 420 g", "420 g", "more than 420 g", "You cannot tell without the mass of the cube."], "key": 1, "why": "Dissolving breaks the sugar into particles too small to see.<br>The bottle is sealed, so every sugar particle and every water particle is still inside.<br>The same particles are all still there, so the mass is the same.<br>The balance reads 420 g.", "type": "mcq"}, {"d": "medium", "atom": "MAT-038+MAT-004", "topic": "T6", "fig": "cp_two_cups_speed", "stem": "The two boxes show water particles around a sugar cube in two cups. The arrows show how fast the water particles move. Neither cup is stirred. In which cup does the cube dissolve faster?", "options": ["cup A", "cup B", "Both take the same time.", "You cannot tell from the arrows."], "key": 0, "why": "The arrows in cup A are longer, so cup A's water particles move faster: cup A is warmer.<br>Faster water particles hit the cube harder and more often.<br>So they knock sugar particles off the cube sooner.<br>So the cube dissolves faster in cup A.", "type": "mcq"}, {"d": "medium", "atom": "MAT-039", "topic": "T6", "fig": "cp_lump_times_table", "stem": "A student dissolves 6 g of rock salt twice, once as one lump and once as coarse grains, in the same kind of water at the same temperature, with no stirring. The table shows the times. About how long would 6 g of the same salt take as a fine powder?", "options": ["less than 5 minutes", "about 5 minutes", "between 5 minutes and 12 minutes", "more than 12 minutes"], "key": 0, "why": "Water particles knock salt particles off the surface only.<br>Grains have more surface than one lump, so the grains dissolved faster: 5 minutes instead of 12.<br>A fine powder has far more surface than the grains.<br>So the powder dissolves faster still, in less than 5 minutes.", "type": "mcq"}, {"d": "medium", "atom": "MAT-040", "topic": "T6", "stem": "Marisol shakes a bottle of water with drink powder in it for ten seconds, then sets the bottle down while some powder is still undissolved. What happens to the rest of the powder?", "options": ["It dissolves more slowly than while the bottle was shaken.", "It stops dissolving.", "It dissolves at the same speed as while the bottle was shaken.", "It comes back out of the water as powder."], "key": 0, "why": "Shaking moves the crowded water away from the powder, so fresh water keeps arriving.<br>Once the bottle is still, the water next to the powder soon holds many dissolved particles, and fresh water arrives slowly.<br>Fresh water knocks off more powder than crowded water.<br>So the rest still dissolves, but more slowly.", "type": "mcq"}, {"d": "medium", "atom": "MAT-041+MAT-033", "topic": "T6", "stem": "A jar holds water with salt dissolved in it and chalk dust settled on the bottom. A student pours the whole mixture through filter paper into a clean beaker. What is in the beaker?", "options": ["plain water", "salt water with the chalk dust", "no liquid at all", "salt water"], "key": 3, "why": "Filter paper holds back undissolved pieces and lets the liquid run through.<br>The chalk dust is undissolved, so the paper holds the chalk.<br>The dissolved salt is particles too small to see, spread through the water, so the salt passes through with the water.<br>So the beaker holds salt water.", "type": "mcq"}, {"d": "medium", "atom": "MAT-035+MAT-036", "topic": "T6", "type": "frq", "task": "One drop of food coloring is stirred into a cup of water, and the water turns dark blue. One drop of the same food coloring is stirred into a bathtub of water, and the water turns only faintly blue. Explain the difference, using particles.", "starter": "The drop of food coloring dissolved, so its particles…", "model": "The drop of food coloring dissolved, so its particles spread evenly through the water.<br>The bathtub holds far more water than the cup.<br>So the same coloring particles are spread through far more water particles, and each cupful of bathtub water holds far fewer of them.<br>The same solute in more solvent means less concentrated, so the bathtub water is only faintly blue.", "points": 3}, {"d": "medium", "atom": "MAT-035+MAT-037", "topic": "T6", "type": "frq", "task": "Anders makes two drinks. Glass A: 10 g of drink powder dissolved in 200 g of water. Glass B: 10 g of the same powder dissolved in 400 g of water. State which drink is more concentrated and why, and give the mass of each finished drink.", "starter": "The more concentrated drink is…", "model": "The more concentrated drink is glass A, because the same 10 g of powder is dissolved in less water.<br>mass of drink = mass of water + mass of powder<br>Glass A: 200 g + 10 g = 210 g<br>Glass B: 400 g + 10 g = 410 g", "points": 3}, {"d": "hard", "atom": "MAT-016", "topic": "T1", "stem": "Sven pours an unknown sample from jar to jar. It takes each jar's shape, and it always fills 150 mL of a graduated cylinder. Sven says it is a solid because it keeps its own volume. Which statement about Sven's claim is correct?", "options": ["Sven is correct: only a solid keeps its own volume when it is moved from one container to the next.", "Sven is wrong: the sample changes its shape, so it must be a gas.", "Sven is correct: a liquid would spread out to fill the whole room.", "Sven is wrong: a liquid keeps its volume too, and this one takes each jar's shape."], "key": 3, "why": "Two tests sort a sample: does it keep its own shape, and does it keep its own volume?<br>A solid keeps both; a liquid keeps its volume but takes its container's shape.<br>The sample keeps its volume, so it is not a gas; it takes each jar's shape, so it is not a solid.<br>So the sample is a liquid.", "type": "mcq"}, {"d": "hard", "atom": "MAT-019+MAT-019b", "topic": "T1", "type": "frq", "fig": "cp_ke_table", "task": "The table describes three samples of one substance. Order the three samples from least to most kinetic energy of their particles, and explain why the sample you put last has the most.", "starter": "From least to most kinetic energy, the order is…", "model": "From least to most kinetic energy, the order is sample 3, sample 1, sample 2.<br>Sample 3 is a solid, sample 1 is a liquid and sample 2 is a gas.<br>Heating gives particles energy and speeds them up.<br>The gas has taken in the most energy, so its particles move fastest and have the most kinetic energy.", "points": 3}, {"d": "hard", "atom": "MAT-026+MAT-009", "topic": "T2", "stem": "A sealed bottle of water reads 500 g on a balance. The bottle is frozen solid. Ice is less dense than liquid water. Compared with the water, what are the mass and the volume of the ice?", "options": ["the same mass and a bigger volume", "less mass and the same volume", "the same mass and a smaller volume", "more mass and a bigger volume"], "key": 0, "why": "The bottle is sealed, so the same particles are all still there and the mass stays 500 g.<br>Same mass and less volume means denser.<br>The ice is less dense than the water with the same mass, so the ice must have more volume.", "type": "mcq"}, {"d": "hard", "atom": "MAT-026b+MAT-037", "topic": "T2", "stem": "A pan holds 400 g of salt water: 20 g of salt dissolved in 380 g of water. The pan boils with no lid until 100 g of water has escaped as water vapor. What is in the pan now?", "options": ["300 g of salt water holding 15 g of salt", "300 g of plain water", "400 g of salt water holding 20 g of salt", "300 g of salt water holding 20 g of salt"], "key": 3, "why": "mass left = mass before − mass escaped = 400 g − 100 g = 300 g<br>Only water particles flew off as water vapor.<br>Every salt particle is still dissolved in the pan.<br>So the pan holds 300 g of salt water, and all 20 g of salt is still in it.", "type": "mcq"}, {"d": "hard", "atom": "MAT-026b+MAT-006", "topic": "T2", "type": "frq", "task": "Aliyah boils an open pot of water on a camp stove. Before boiling, the pot of water reads 600 g on a balance. After ten minutes it reads 450 g. Aliyah says the fire destroyed 150 g of water. Evaluate Aliyah's claim.", "starter": "Aliyah is…", "model": "Aliyah is wrong: no water was destroyed.<br>mass escaped = mass before − mass left = 600 g − 450 g = 150 g<br>The pot had no lid, so 150 g of water left the pot as water vapor.<br>Those water particles are now spread through the air, so the water still exists.", "points": 3}, {"d": "hard", "atom": "MAT-013", "topic": "T3", "stem": "Pilar pushes a metal skewer and a wooden skewer into a hot roast just out of the oven. After a minute, the end of the metal skewer sticking out is too hot to touch, and the end of the wooden skewer is not. Pilar says the metal end got hot because metal is hotter than wood. Which statement about Pilar's claim is correct?", "options": ["Pilar is correct: metal is hotter than wood even before it goes in.", "Pilar is wrong: heat passes easily through the metal to its end.", "Pilar is correct: wood never gets hot, whatever touches it.", "Pilar is wrong: both ends got equally hot, but the wood feels cooler."], "key": 1, "why": "Both skewers started at the same temperature, and the same hot roast touched both.<br>Metal is a conductor: heat passes through it easily, so heat traveled along the metal skewer to its end.<br>Wood is an insulator: heat passes through it slowly, so the wooden end stayed cool.<br>The metal was not hotter to begin with.", "type": "mcq"}, {"d": "hard", "atom": "MAT-013", "topic": "T3", "type": "frq", "task": "On a cool morning, a park bench has a metal seat and a wooden seat side by side. Both have been outside all night, so both are at the same temperature. Dara sits on the metal seat and says it feels much colder than the wooden seat. Explain why the metal seat feels colder.", "starter": "Metal is a conductor, so…", "model": "Metal is a conductor, so heat passes through it easily.<br>Heat from Dara's body passes quickly into the metal seat.<br>So her skin loses heat fast, and the metal feels cold.<br>Wood is an insulator, so heat passes into it slowly, and the wooden seat feels less cold.", "points": 3}, {"d": "hard", "atom": "MAT-009+MAT-011", "topic": "T4", "fig": "cp_oil_water_balances", "stem": "Two cups of the same kind hold 100 mL of cooking oil and 100 mL of water. Each balance was zeroed with its empty cup. The oil is poured gently into the water. What happens?", "options": ["The oil floats on top of the water.", "The water floats on top of the oil.", "The oil and the water mix into one layer.", "You cannot tell without the two densities."], "key": 0, "why": "The two cups hold the same volume, 100 mL each.<br>The oil reads 92 g and the water reads 100 g: same volume and less mass means less dense.<br>So the oil is less dense than the water.<br>A liquid less dense than the liquid under it floats on top, so the oil floats on the water.", "type": "mcq"}, {"d": "hard", "atom": "MAT-010+MAT-037", "topic": "T4", "stem": "A student makes syrup. On a balance zeroed with the empty beaker, the water reads 180 g. She dissolves 40 g of sugar in it. The finished syrup fills a graduated cylinder to 200 mL. What is the density of the syrup?", "options": ["0.2 g/cm³", "0.9 g/cm³", "1.1 g/cm³", "1.2 g/cm³"], "key": 2, "why": "mass of syrup = mass of water + mass of sugar = 180 g + 40 g = 220 g<br>volume = 200 mL = 200 cm³<br>density = mass ÷ volume<br>density = 220 g ÷ 200 cm³ = 1.1 g/cm³", "type": "mcq"}, {"d": "hard", "atom": "MAT-009+MAT-026", "topic": "T4", "type": "frq", "task": "A sealed bag of water reads 200 g on a balance. The bag is frozen. The bag now reads 200 g, but the ice takes up more space than the water did. Determine which is denser, the ice or the liquid water, and support your answer.", "starter": "The mass of the water and the mass of the ice are…", "model": "The mass of the water and the mass of the ice are the same, 200 g, because the bag is sealed and every particle is still inside.<br>The ice has more volume than the water had.<br>Same mass and less volume means denser.<br>The water has the less volume, so the liquid water is denser than the ice.", "points": 3}, {"d": "hard", "atom": "MAT-032+MAT-041", "topic": "T5", "stem": "A clear liquid that looks the same all the way through is left in a shallow dish in a warm place. A week later the dish is dry except for a thin layer of white grains. Which category was the liquid?", "options": ["a pure substance", "a homogeneous mixture", "a heterogeneous mixture", "a new substance made by the warmth"], "key": 1, "why": "The water left the dish as a gas, and the white grains stayed behind.<br>So the liquid held two kinds of matter, the water and the dissolved solid: it was a mixture, not a pure substance.<br>The liquid looked the same all the way through, so the mixture was homogeneous.", "type": "mcq"}, {"d": "hard", "atom": "MAT-032", "topic": "T5", "stem": "Yuki opens a cup of yogurt that has fruit pieces at the bottom and plain yogurt on top. She sorts it as a pure substance because \"it is all one food.\" Which statement about Yuki's sort is correct?", "options": ["Yuki is wrong: fruit and yogurt are two kinds of matter, unevenly spread.", "Yuki is correct: anything sold as one food is one kind of matter.", "Yuki is wrong: the cup is homogeneous, because everything in it is a kind of yogurt.", "Yuki is correct: only clear liquids can be mixtures."], "key": 0, "why": "Question 1: is there more than one kind of matter? Yes: fruit pieces and yogurt.<br>So the cup holds a mixture, whatever the label calls it.<br>Question 2: is it the same all the way through? No: fruit sits at the bottom and plain yogurt on top.<br>So the cup holds a heterogeneous mixture.", "type": "mcq"}, {"d": "hard", "atom": "MAT-027+MAT-041", "topic": "T5", "type": "frq", "task": "Bao has two glasses of clear liquid that look exactly alike. One holds distilled water, a pure substance. The other holds sugar dissolved in water. He may not taste them. Describe a test Bao could do to tell which glass is which, and explain what he would see.", "starter": "Bao should…", "model": "Bao should leave a spoonful from each glass in a warm place until the water has evaporated.<br>The distilled water holds one kind of matter, so when the water has gone, nothing is left.<br>The sugar water holds two kinds of matter, so when the water has gone, the sugar is left behind as grains.<br>So the dish with grains left came from the sugar water.", "points": 3}, {"d": "hard", "atom": "MAT-036+MAT-022", "topic": "T6", "stem": "A pot of salty broth simmers on a stove for an hour with no lid. Nothing is added. How does the saltiness of the broth change?", "options": ["The broth gets saltier.", "The broth gets less salty.", "The broth stays just as salty.", "The broth ends up with no salt."], "key": 0, "why": "Heating makes the fastest water particles fly off the surface as water vapor, so water leaves the pot.<br>The salt particles do not fly off, so all the salt stays in the pot.<br>The same salt is now dissolved in less water.<br>The same solute in less solvent means more concentrated, so the broth gets saltier.", "type": "mcq"}, {"d": "hard", "atom": "MAT-038+MAT-039+MAT-040", "topic": "T6", "fig": "cp_fair_pairs_table", "stem": "A student sets up four cups to find out whether smaller pieces of sugar dissolve faster. The table shows the four cups. Which two cups should she compare?", "options": ["cups A and B", "cups A and C", "cups B and D", "cups C and D"], "key": 2, "why": "To test one thing, only that one thing may differ between the two cups.<br>Cups B and D have the same temperature, 50 °C, and neither is stirred; only the form of the sugar differs.<br>Cups A and C differ in stirring as well, and cups A and B and cups C and D differ in temperature.", "type": "mcq"}, {"d": "hard", "atom": "MAT-041+MAT-012", "topic": "T6", "type": "frq", "task": "Powdered sugar and fine sand have been mixed together. The grains are the same size and both look white. Describe the steps that would get the sand and the sugar back on their own, and name the property difference each step uses.", "starter": "First,…", "model": "First, stir the mixture into water, because sugar is soluble and sand is insoluble: the sugar dissolves and the sand stays as grains.<br>Next, pour the mixture through filter paper: the paper holds back the undissolved sand and lets the sugar water run through.<br>Last, leave the sugar water in a warm place: the water evaporates and the dissolved sugar is left behind.<br>So the sand is on the paper and the sugar is in the dish.", "points": 4}], "figs": {"cp_two_liquids_speed": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 490 175\" style=\"width:100%;max-width:612px;height:auto\" role=\"img\" aria-label=\"Two boxes of particles drawn as circles, sample A on the left and sample B on the right, each with a motion arrow\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"490\" height=\"175\" fill=\"#ffffff\"/><rect x=\"40\" y=\"20\" width=\"150\" height=\"110\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"115.0\" y=\"1 =\"13\" font-weight=\"bold\" fill=\"#222\">cup A<\/text><text x=\"320.0\" y=\"29\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">cup B<\/text><text x=\"420.0\" y=\"29\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">cup C<\/text><text x=\"520.0\" y=\"29\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">cup D<\/text><rect x=\"20\" y=\"38\" width=\"550\" height=\"28\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"95.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">water temperature<\/text><text x=\"220.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">20 °C<\/text><text x=\"320.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">50 °C<\/text><text x=\"420.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">20 °C<\/text><text x=\"520.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">50 °C<\/text><rect x=\"20\" y=\"66\" width=\"550\" height=\"28\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"95.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">5 g of sugar as<\/text><text x=\"220.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">one cube<\/text><text x=\"320.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">one cube<\/text><text x=\"420.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">loose grains<\/text><text x=\"520.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">loose grains<\/text><rect x=\"20\" y=\"94\" width=\"550\" height=\"28\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"95.0\" y=\"113\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">stirring<\/text><text x=\"220.0\" y=\"113\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">stirred<\/text><text x=\"320.0\" y=\"113\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">none<\/text><text x=\"420.0\" y=\"113\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">none<\/text><text x=\"520.0\" y=\"113\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">none<\/text><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"122\" stroke=\"#222\"/><line x1=\"270\" y1=\"10\" x2=\"270\" y2=\"122\" stroke=\"#222\"/><line x1=\"370\" y1=\"10\" x2=\"370\" y2=\"122\" stroke=\"#222\"/><line x1=\"470\" y1=\"10\" x2=\"470\" y2=\"122\" stroke=\"#222\"/><\/svg>", "cp_lump_times_table": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 430 130\" style=\"width:100%;max-width:537px;height:auto\" role=\"img\" aria-label=\"A table giving how long 6 g of rock salt took to dissolve as one lump and as coarse grains, in the same water at the same temperature with no stirring. A table. Header: the 6 g of rock salt | time to dissolve. Row: one lump | 12 minutes. Row: coarse grains | 5 minutes. Note under the table: Same water, same temperature, no stirring.\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"430\" height=\"130\" fill=\"#ffffff\"/><rect x=\"20\" y=\"10\" width=\"390\" height=\"28\" fill=\"#f1f1f1\" stroke=\"#222\"/><text x=\"130.0\" y=\"29\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">the 6 g of rock salt<\/text><text x=\"325.0\" y=\"29\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">time to dissolve<\/text><rect x=\"20\" y=\"38\" width=\"390\" height=\"28\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"130.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">one lump<\/text><text x=\"325.0\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">12 minutes<\/text><rect x=\"20\" y=\"66\" width=\"390\" height=\"28\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"130.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">coarse grains<\/text><text x=\"325.0\" y=\"85\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">5 minutes<\/text><line x1=\"240\" y1=\"10\" x2=\"240\" y2=\"94\" stroke=\"#222\"/><text x=\"215.0\" y=\"112\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">Same water, same temperature, no stirring.<\/text><\/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
