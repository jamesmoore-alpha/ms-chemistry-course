<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 166" width="100%" role="img" aria-label="A table giving, for copper, rubber, glass and iron, whether the bulb lights when the material is put between the clips of the circuit. A table. Header: material | bulb lights?. Row: copper | yes. Row: rubber | no. Row: glass | no. Row: iron | yes." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="360" height="166" fill="#ffffff"/><rect x="20" y="10" width="320" height="28" fill="#f1f1f1" stroke="#222"/><text x="105.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">material</text><text x="265.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bulb lights?</text><rect x="20" y="38" width="320" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">copper</text><text x="265.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="66" width="320" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">rubber</text><text x="265.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="20" y="94" width="320" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">glass</text><text x="265.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="20" y="122" width="320" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">iron</text><text x="265.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><line x1="190" y1="10" x2="190" y2="150" stroke="#222"/><!--blind: A table. Header: material | bulb lights?. Row: copper | yes. Row: rubber | no. Row: glass | no. Row: iron | yes.--></svg>