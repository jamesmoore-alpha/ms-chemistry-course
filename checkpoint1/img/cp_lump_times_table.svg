<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 130" width="100%" role="img" aria-label="A table giving how long 6 g of rock salt took to dissolve as one lump and as coarse grains, in the same water at the same temperature with no stirring. A table. Header: the 6 g of rock salt | time to dissolve. Row: one lump | 12 minutes. Row: coarse grains | 5 minutes. Note under the table: Same water, same temperature, no stirring." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="430" height="130" fill="#ffffff"/><rect x="20" y="10" width="390" height="28" fill="#f1f1f1" stroke="#222"/><text x="130.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the 6 g of rock salt</text><text x="325.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">time to dissolve</text><rect x="20" y="38" width="390" height="28" fill="#ffffff" stroke="#222"/><text x="130.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one lump</text><text x="325.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">12 minutes</text><rect x="20" y="66" width="390" height="28" fill="#ffffff" stroke="#222"/><text x="130.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">coarse grains</text><text x="325.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">5 minutes</text><line x1="240" y1="10" x2="240" y2="94" stroke="#222"/><text x="215.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Same water, same temperature, no stirring.</text><!--blind: A table. Header: the 6 g of rock salt | time to dissolve. Row: one lump | 12 minutes. Row: coarse grains | 5 minutes. Note under the table: Same water, same temperature, no stirring.--></svg>