e="#222" stroke-width="1"/><circle cx="312.0" cy="286.0" r="7" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="305.0" cy="274.0" r="7" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="319.0" cy="274.0" r="7" fill="#ffffff" stroke="#222" stroke-width="1"/><text x="275" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">box D</text><!--blind: Four boxes of particles drawn as circles, lettered A to D. Box A: two kinds of particle, filled and open; the open circles gather along the top of the box and the filled circles fill the rest. Box B: one kind of particle only; every circle is filled. Box C: two kinds of particle, filled and open, the open circles spread evenly among the filled ones through the whole box, none touching another open circle. Box D: two kinds of particle; filled circles fill most of the box; the open circles sit in two clumps stuck together, one on the floor at the right and one part-way down at the left.--></svg>