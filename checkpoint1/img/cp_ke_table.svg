<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 138" width="100%" role="img" aria-label="A table giving, for sample 1, sample 2 and sample 3 of one substance, what its particles do. A table. Header: (blank) | what its particles do. Row: sample 1 | touch and slide past one another. Row: sample 2 | fly fast in every direction, far apart. Row: sample 3 | vibrate on the spot, touching, in fixed positions." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="480" height="138" fill="#ffffff"/><rect x="20" y="10" width="440" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="295.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what its particles do</text><rect x="20" y="38" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sample 1</text><text x="295.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">touch and slide past one another</text><rect x="20" y="66" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sample 2</text><text x="295.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">fly fast in every direction, far apart</text><rect x="20" y="94" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sample 3</text><text x="295.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">vibrate on the spot, touching, in fixed positions</text><line x1="130" y1="10" x2="130" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | what its particles do. Row: sample 1 | touch and slide past one another. Row: sample 2 | fly fast in every direction, far apart. Row: sample 3 | vibrate on the spot, touching, in fixed positions.--></svg>