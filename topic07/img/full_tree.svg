<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 690" width="100%" role="img" aria-label="The full tree: question 1 asks whether there is more than one kind of matter; no leads to a pure substance and the question whether it has only one kind of atom (yes, an element, a box of one glyph; no, a compound, a box of identical joined groups); yes leads to a mixture and the question whether it is the same all the way through (yes, a homogeneous mixture, two kinds spread evenly; no, a heterogeneous mixture, one kind gathered on one side)" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="690" fill="#ffffff"/><rect x="150" y="10" width="220" height="68" rx="10" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="260.0" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Question 1:</text><text x="260.0" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">is there more than one</text><text x="260.0" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">kind of matter?</text><line x1="190.0" y1="78.0" x2="130.0" y2="120.0" stroke="#222" stroke-width="1.6"/><polyline points="132.9,114.8 130.0,120.0 135.9,119.0" fill="none" stroke="#222" stroke-width="1.6"/><text x="150" y="92" text-anchor="end" font-size="13" font-weight="bold" fill="#222">no: a pure substance</text><line x1="330.0" y1="78.0" x2="390.0" y2="120.0" stroke="#222" stroke-width="1.6"/><polyline points="384.1,119.0 390.0,120.0 387.1,114.8" fill="none" stroke="#222" stroke-width="1.6"/><text x="370" y="92" text-anchor="start" font-size="13" font-weight="bold" fill="#222">yes: a mixture</text><rect x="10" y="120" width="220" height="68" rx="10" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="120.0" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Question 2 (pure):</text><text x="120.0" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">d