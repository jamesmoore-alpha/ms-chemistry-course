<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 138" width="100%" role="img" aria-label="A table of three substances: hydrogen is a gas that burns; oxygen is a gas that feeds a fire; water is a liquid that puts a fire out" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="138" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">substance</text><text x="245.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">at room temperature</text><text x="435.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">with fire</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="245.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas</text><text x="435.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">burns</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="245.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas</text><text x="435.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">feeds a fire</text><rect x="10" y="94" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="245.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a liquid</text><text x="435.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">puts a fire out</text><line x1="140" y1="10" x2="140" y2="122" stroke="#222"/><line x1="350" y1="10" x2="350" y2="122" stroke="#222"/><!--blind: A table. Header: substance | at room temperature | with fire. Row: hydrogen | a gas | burns. Row: oxygen | a gas | feeds a fire. Row: water | a liquid | puts a fire out.--></svg>