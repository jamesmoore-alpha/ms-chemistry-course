<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 166" width="100%" role="img" aria-label="A table listing four gases and what each one's particles are made of" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="166" fill="#ffffff"/><rect x="10" y="10" width="470" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">gas</text><text x="315.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">its particles</text><rect x="10" y="38" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neon</text><text x="315.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">single neon atoms</text><rect x="10" y="66" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nitrogen</text><text x="315.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two nitrogen atoms joined</text><rect x="10" y="94" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">carbon dioxide</text><text x="315.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one carbon atom joined to two oxygen atoms</text><rect x="10" y="122" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">helium</text><text x="315.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">single helium atoms</text><line x1="150" y1="10" x2="150" y2="150" stroke="#222"/><!--blind: A table. Header: gas | its particles. Row: neon | single neon atoms. Row: nitrogen | two nitrogen atoms joined. Row: carbon dioxide | one carbon atom joined to two oxygen atoms. Row: helium | single helium atoms.--></svg>