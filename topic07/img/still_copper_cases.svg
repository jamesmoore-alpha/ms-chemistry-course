<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 204" width="100%" role="img" aria-label="Three cases under the question 'Still copper?', with a tick or cross drawn above each: a lump of copper drawn as a small box of gray circles apart, many, many copper atoms (tick, still copper); one copper atom drawn as one gray circle (tick, still copper); a tiny dashed circle for a piece smaller than one atom (cross, not copper)" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="204" fill="#ffffff"/><text x="270" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Still copper?</text><polyline points="87,44 93,51 105,36" fill="none" stroke="#222" stroke-width="3"/><g transform="translate(47 60) scale(0.5)"><rect x="0" y="0" width="190" height="140" fill="#ffffff" stroke="#222" stroke-width="1.5"/><circle cx="33.0" cy="28.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="95.0" cy="28.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="157.0" cy="28.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="33.0" cy="70.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="95.0" cy="70.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="157.0" cy="70.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="33.0" cy="112.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="95.0" cy="112.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><circle cx="157.0" cy="112.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/></g><text x="95" y="148" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">many, many copper atoms</text><text x="95" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a lump of copper</text><text x="95" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">still copper</text><polyline points="257,44 263,51 275,36" fill="none" stroke="#222" stroke-width="3"/><circle cx="265.0" cy="96.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><text x="265" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one copper atom</text><text x="265" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">still copper</text><line x1="427" y1="36" x2="443" y2="52" stroke="#222" stroke-width="3"/><line x1="427" y1="52" x2="443" y2="36" stroke="#222" stroke-width="3"/><circle cx="435" cy="96" r="4" fill="#ffffff" stroke="#222" stroke-dasharray="2 2"/><text x="435" y="148" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no such piece of copper</text><text x="435" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">smaller than one atom</text><text x="435" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">not copper</text></svg>