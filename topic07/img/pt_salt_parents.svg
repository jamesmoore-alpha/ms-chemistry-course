<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 138" width="100%" role="img" aria-label="A table giving one description each of sodium, of chlorine, and of what table salt is made of" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="138" fill="#ffffff"/><rect x="10" y="10" width="470" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">substance</text><text x="310.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">description</text><rect x="10" y="38" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sodium</text><text x="310.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a soft, silvery metal that fizzes in water</text><rect x="10" y="66" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">chlorine</text><text x="310.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a green gas that is poisonous to breathe</text><rect x="10" y="94" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">table salt</text><text x="310.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sodium and chlorine atoms joined together</text><line x1="140" y1="10" x2="140" y2="122" stroke="#222"/><!--blind: A table. Header: substance | description. Row: sodium | a soft, silvery metal that fizzes in water. Row: chlorine | a green gas that is poisonous to breathe. Row: table salt | sodium and chlorine atoms joined together.--></svg>