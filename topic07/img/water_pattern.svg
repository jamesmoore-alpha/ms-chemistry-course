<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 178" width="100%" role="img" aria-label="Three water molecules, each one large open circle labeled oxygen atom joined to two small dark circles labeled hydrogen atom, turned at different angles but the same pattern" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="178" fill="#ffffff"/><text x="270" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Three water molecules: the same pattern every time</text><circle cx="90.0" cy="96.6" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="65.8" cy="76.8" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="114.2" cy="76.8" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><text x="90" y="134" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">oxygen atom</text><text x="90" y="60" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hydrogen atoms</text><circle cx="265.8" cy="95.1" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="259.9" cy="64.3" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="297.0" cy="95.4" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="452.8" cy="96.0" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="422.5" cy="88.3" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="466.4" cy="67.8" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><text x="270" y="160" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one oxygen atom joined to two hydrogen atoms, in every water molecule anywhere</text></svg>