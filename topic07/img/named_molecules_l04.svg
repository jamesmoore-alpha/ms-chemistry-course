<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" role="img" aria-label="Above: an oxygen molecule, two large open circles touching, each labeled oxygen atom. Below: a water molecule, one large open circle labeled oxygen atom joined to two small dark circles labeled hydrogen atom" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="340" height="380" fill="#ffffff"/><text x="170" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">an oxygen molecule</text><circle cx="149.1" cy="90.0" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="190.9" cy="90.0" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><text x="170" y="130" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">oxygen atoms</text><text x="170" y="168" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two oxygen atoms joined</text><line x1="20" y1="186" x2="320" y2="186" stroke="#222" stroke-dasharray="4 3"/><text x="170" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">a water molecule</text><circle cx="170.0" cy="296.6" r="22.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="145.8" cy="276.8" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="194.2" cy="276.8" r="11.0" fill="#222" stroke="#222" stroke-width="1"/><text x="170" y="334" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">oxygen atom</text><text x="170" y="260" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hydrogen atoms</text><text x="170" y="362" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one oxygen atom joined to two hydrogen atoms</text></svg>