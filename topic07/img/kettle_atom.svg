<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 202" width="100%" role="img" aria-label="A copper kettle; an arrow labeled zoom to a circle holding one gray circle drawn large, labeled one copper atom, still copper; an arrow to a small dashed circle, much smaller than the atom, labeled a piece smaller than one atom, under the question 'Still copper?' with a cross: not copper anymore" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="202" fill="#ffffff"/><path d="M 30 150 q 0 -90 60 -90 q 60 0 60 90 z" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 140 90 q 30 -30 40 -8" fill="none" stroke="#222" stroke-width="3"/><path d="M 60 72 q 30 -40 60 0" fill="none" stroke="#222" stroke-width="3"/><line x1="38" y1="150" x2="142" y2="150" stroke="#222" stroke-width="1.5"/><ellipse cx="90" cy="82" rx="30" ry="4" fill="#f1f1f1" stroke="#222"/><text x="90" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a copper kettle</text><line x1="150.0" y1="100.0" x2="190.0" y2="104.0" stroke="#222" stroke-width="1.6"/><polyline points="184.4,106.1 190.0,104.0 184.9,100.9" fill="none" stroke="#222" stroke-width="1.6"/><text x="170" y="90" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">zoom</text><circle cx="240" cy="105" r="44" fill="#ffffff" stroke="#222" stroke-width="1.5"/><circle cx="240.0" cy="105.0" r="15.4" fill="#555" stroke="#222" stroke-width="1"/><text x="240" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one copper atom</text><text x="240" y="188" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">still copper</text><line x1="292.0" y1="105.0" x2="336.0" y2="105.0" stroke="#222" stroke-width="1.6"/><polyline points="330.6,107.6 336.0,105.0 330.6,102.4" fill="none" stroke="#222" stroke-width="1.6"/><text x="390" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Still copper?</text><line x1="382" y1="54" x2="398" y2="70" stroke="#222" stroke-width="3"/><line x1="382" y1="70" x2="398" y2="54" stroke="#222" stroke-width="3"/><circle cx="390" cy="105" r="7" fill="#ffffff" stroke="#222" stroke-width="1.5" stroke-dasharray="3 2"/><text x="390" y="130" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a piece smaller</text><text x="390" y="145" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">than one atom</text><text x="390" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">smaller than an atom</text><text x="390" y="188" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">not copper anymore</text></svg>