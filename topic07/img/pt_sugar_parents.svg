<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 166" width="100%" role="img" aria-label="A table giving one description each of carbon, of hydrogen, of oxygen, and of what table sugar is made of" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="166" fill="#ffffff"/><rect x="10" y="10" width="490" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">substance</text><text x="320.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">description</text><rect x="10" y="38" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">carbon</text><text x="320.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a black solid</text><rect x="10" y="66" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="320.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas with no color</text><rect x="10" y="94" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="320.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas with no color</text><rect x="10" y="122" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">table sugar</text><text x="320.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon, hydrogen and oxygen atoms joined together</text><line x1="140" y1="10" x2="140" y2="150" stroke="#222"/><!--blind: A table. Header: substance | description. Row: carbon | a black solid. Row: hydrogen | a gas with no color. Row: oxygen | a gas with no color. Row: table sugar | carbon, hydrogen and oxygen atoms joined together.--></svg>