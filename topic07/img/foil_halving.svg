<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 234" width="100%" role="img" aria-label="A strip of foil drawn five times, each strip half the length of the one above; then dots for many more cuts; then a single gray circle labeled one atom of aluminum, the smallest piece that is still aluminum" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="234" fill="#ffffff"/><text x="270" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Cut the strip in half, again and again</text><rect x="30" y="40" width="240" height="12" fill="#d9d9d9" stroke="#222"/><text x="282" y="51" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the strip</text><rect x="30" y="66" width="120" height="12" fill="#d9d9d9" stroke="#222"/><text x="162.0" y="77" text-anchor="start" font-size="13" font-weight="normal" fill="#222">1 cut</text><rect x="30" y="92" width="60" height="12" fill="#d9d9d9" stroke="#222"/><text x="102.0" y="103" text-anchor="start" font-size="13" font-weight="normal" fill="#222">2 cuts</text><rect x="30" y="118" width="30" height="12" fill="#d9d9d9" stroke="#222"/><text x="72.0" y="129" text-anchor="start" font-size="13" font-weight="normal" fill="#222">3 cuts</text><rect x="30" y="144" width="15" height="12" fill="#d9d9d9" stroke="#222"/><text x="57.0" y="155" text-anchor="start" font-size="13" font-weight="normal" fill="#222">4 cuts</text><text x="38" y="178" text-anchor="start" font-size="18" font-weight="normal" fill="#222">…</text><text x="70" y="180" text-anchor="start" font-size="13" font-weight="normal" fill="#222">many more cuts, far too small to see</text><circle cx="38.0" cy="210.0" r="7.0" fill="#555" stroke="#222" stroke-width="1"/><text x="60" y="214" text-anchor="start" font-size="13" font-weight="normal" fill="#222">one atom of aluminum: the smallest piece that is still aluminum</text></svg>