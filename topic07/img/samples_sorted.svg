<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 166" width="100%" role="img" aria-label="A table sorting the four samples: a gold nugget is a pure substance with one kind of atom, an element; a block of dry ice is a pure substance with two kinds of atom, a compound; a steel fork is a mixture that is the same all through, homogeneous; sand with shell bits is a mixture that is not, heterogeneous" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="166" fill="#ffffff"/><rect x="0" y="10" width="540" height="28" fill="#f1f1f1" stroke="#222"/><text x="62.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sample</text><text x="187.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">question 1</text><text x="322.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">question 2</text><text x="467.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">category</text><rect x="0" y="38" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="62.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a gold nugget</text><text x="187.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: pure substance</text><text x="322.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one kind of atom? yes</text><text x="467.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">an element</text><rect x="0" y="66" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="62.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a block of dry ice</text><text x="187.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: pure substance</text><text x="322.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one kind of atom? no</text><text x="467.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a compound</text><rect x="0" y="94" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="62.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a steel fork</text><text x="187.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: mixture</text><text x="322.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">same all through? yes</text><text x="467.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">homogeneous mixture</text><rect x="0" y="122" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="62.5" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sand with shell bits</text><text x="187.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: mixture</text><text x="322.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">same all through? no</text><text x="467.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">heterogeneous mixture</text><line x1="125" y1="10" x2="125" y2="150" stroke="#222"/><line x1="250" y1="10" x2="250" y2="150" stroke="#222"/><line x1="395" y1="10" x2="395" y2="150" stroke="#222"/><!--blind: A table. Header: the sample | question 1 | question 2 | category. Row: a gold nugget | no: pure substance | one kind of atom? yes | an element. Row: a block of dry ice | no: pure substance | one kind of atom? no | a compound. Row: a steel fork | yes: mixture | same all through? yes | homogeneous mixture. Row: sand with shell bits | yes: mixture | same all through? no | heterogeneous mixture.--></svg>