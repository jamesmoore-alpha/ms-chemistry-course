e pattern: a compound.", "One kind of matter only, so not a mixture.", "One kind of matter only, so not a mixture."], "why": "Question 1: one kind of matter, so a pure substance.<br>Next question: oxygen and hydrogen, so not one kind of atom.<br>A pure substance with different kinds of atom joined in a fixed pattern is a compound."}, {"type": "mcq", "tag": "fluency", "stem": "Rocky road ice cream: nuts and marshmallows here and there in the chocolate. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 3, "fb": ["Several kinds of matter, so a mixture, not an element.", "Several kinds of matter mingled, not joined, so a mixture.", "One spoonful has nuts and the next has none: not the same all through.", "Several kinds of matter, different in different places."], "why": "Question 1: chocolate, nuts and marshmallows, so more than one kind of matter: a mixture.<br>Next question: nuts here and none there, so not the same all the way through.<br>A mixture that differs from place to place is heterogeneous."}, {"type": "mcq", "tag": "fluency", "stem": "An iron horseshoe: every atom in it is an iron atom. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "fb": ["One kind of matter, one kind of atom: an element.", "A compound needs two or more kinds of atom; iron has one.", "One kind of matter only, so not a mixture.", "One kind of matter only, so not a mixture."], "why": "Question 1: one kind of matter, so a pure substance.<br>Next question: every atom is an iron atom, so one kind of atom.<br>A pure substance with one kind of atom is an element."}, {"type": "mcq", "tag": "fluency", "stem": "Mouthwash: water, alcohol and flavor mingled evenly, and every mouthful the same. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 2, "fb": ["Several kinds of matter, so a mixture, not an element.", "The substances are mingled, not joined into one new particle, so a mixture.", "Several kinds of matter, and every mouthful the same: evenly mixed.", "Every mouthful is the same, so it is the same all the way through."], "why": "Question 1: water, alcohol and flavor, so more than one kind of matter: a mixture.<br>Next question: every mouthful is the same, so yes, the same all the way through.<br>A mixture that is the same all through is homogeneous."}, {"type": "mcq", "tag": "fluency", "stem": "Flakes of rust: iron atoms and oxygen atoms joined, in the same pattern all through. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 1, "fb": ["Two kinds of atom, so not an element.", "One kind of matter, two kinds of atom joined in one pattern: a compound.", "The atoms are joined into one substance, not mingled as two.", "The atoms are joined into one substance, not mingled as two."], "why": "Question 1: one kind of matter, rust, so a pure substance.<br>Next question: iron and oxygen atoms, so not one kind of atom.<br>Different kinds of atom joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "stem": "A sterling silver spoon: a few copper atoms scattered among the silver atoms, and every part of the spoon is the same. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 2, "fb": ["Two kinds of matter, so a mixture, not an element.", "The atoms are mingled, not joined into one pattern, so a mixture.", "Two kinds mingled evenly, the same all through: homogeneous.", "The same all the way through, so not heterogeneous."], "why": "Question 1: silver and copper, so more than one kind of matter: a mixture.<br>Next question: the same all the way through, so yes.<br>A mixture that is the same all through is homogeneous."}, {"type": "mcq", "tag": "fluency", "stem": "Granite: pink grains, gray grains and black grains side by side in one rock. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 3, "fb": ["Several kinds of grain, so a mixture, not an element.", "The grains sit side by side, not joined into one pattern, so a mixture.", "Pink here and black there: not the same all the way through.", "Several kinds of matter, different in different places."], "why": "Question 1: pink, gray and black grains, so more than one kind of matter: a mixture.<br>Next question: one spot is pink and the next is black, so not the same all the way through.<br>A mixture that differs from place to place is heterogeneous."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The gold nugget: one kind of matter, and one kind of atom. Which category did the video place it in?", "options": ["an element", "a compound", "a homogeneous mixture"], "key": 0, "fb": ["A pure substance with one kind of atom is an element.", "A compound has different kinds of atom joined; gold has one kind.", "The nugget is one kind of matter, so it is not a mixture."], "why": "Question 1: one kind of matter, so a pure substance.<br>Next question: one kind of atom, so yes.<br>A pure substance with one kind of atom is an element."}]}, {"id": "L08", "atom": "MAT-048", "title": "A compound is not like its elements", "video": "definitely a video", "lesson_type": "Concept lesson (a fact with its reason): a compound's particles are new particles, so a compound has its own properties; no term coined", "check_design": "Type (c) concept understanding → one recall MCQ (L05: water is a compound), then the what (table salt from sodium and chlorine, table drawn: like neither), the why (free response), the reason as an MCQ, a student-claim misconception (Priyanka: water must burn because hydrogen burns; key no), transfer ×2 (sugar is not black like carbon, table drawn; carbon dioxide is not a black powder), and the mixture-against-compound pair on iron and sulfur (a magnet still lifts iron from the mixture; the compound behaves in its own way) with its reason. 10 items.", "headache": ["Hydrogen is a gas that burns.", "Oxygen is a gas that feeds a fire.", "When hydrogen atoms and oxygen atoms join in a fixed pattern, they make water.", "Water is a liquid, and it puts fires out.", "How can two gases make a liquid that does the opposite?"], "forest": ["Why does a compound behave nothing like the elements in it?", "In water, the hydrogen atoms and oxygen atoms are joined into water molecules.", "A water molecule is a new kind of particle, not a hydrogen molecule sitting next to an oxygen molecule.", "New particles behave in new ways.", "So a compound's properties belong to its own particles, not to the elements it was made from."], "article": [{"t": "idea", "text": "Hydrogen is a gas that burns."}, {"t": "idea", "text": "Oxygen is a gas that feeds a fire."}, {"t": "idea", "text": "When hydrogen atoms and oxygen atoms join in a fixed pattern, they make water."}, {"t": "idea", "text": "Water is a liquid, and it puts fires out."}, {"t": "idea", "text": "How can two gases make a liquid that does the opposite?"}, {"t": "fig", "key": "props_table", "cap": "The three substances in one table: what each is at room temperature, and what each does with fire."}, {"t": "h", "text": "Compound, again"}, {"t": "idea", "text": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."}, {"t": "idea", "text": "Water is a compound of hydrogen and oxygen."}, {"t": "h", "text": "Zoom in on the three"}, {"t": "idea", "text": "Zoom in on hydrogen: every molecule is two hydrogen atoms joined."}, {"t": "idea", "text": "Zoom in on oxygen: every molecule is two oxygen atoms joined."}, {"t": "idea", "text": "Zoom in on water: every molecule is one oxygen atom joined to two hydrogen atoms."}, {"t": "fig", "key": "gases_to_water", "cap": "Hydrogen molecules and oxygen molecules, and the water molecules made from their atoms. In words: hydrogen + oxygen → water."}, {"t": "h", "text": "A new particle"}, {"t": "idea", "text": "A water molecule is not a hydrogen molecule sitting next to an oxygen molecule."}, {"t": "idea", "text": "A water molecule is a new kind of particle: three atoms joined in a new pattern."}, {"t": "idea", "text": "New particles behave in new ways."}, {"t": "idea", "text": "So water has its own properties: it is a liquid, and it puts fires out."}, {"t": "idea", "text": "The hydrogen atoms are still there, but no longer in hydrogen molecules."}, {"t": "idea", "text": "So water does not burn like hydrogen."}, {"t": "h", "text": "A mixture is different"}, {"t": "idea", "text": "In a mixture each substance keeps its own particles."}, {"t": "idea", "text": "So each substance keeps its own properties."}, {"t": "idea", "text": "When hydrogen gas is mixed with oxygen gas, the atoms stay in their own molecules: two gases, each still itself."}, {"t": "idea", "text": "When the atoms join into water molecules, the gases are gone: one new substance, with new properties."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider carbon: a black solid, the stuff of charcoal."}, {"t": "idea", "text": "Oxygen is a gas with no color."}, {"t": "idea", "text": "When one carbon atom joins two oxygen atoms, they make carbon dioxide."}, {"t": "idea", "text": "Carbon dioxide is a gas with no color: the gas you breathe out."}, {"t": "fig", "key": "carbon_to_co2", "cap": "Carbon and oxygen, and the carbon dioxide made from their atoms. In words: carbon + oxygen → carbon dioxide."}, {"t": "idea", "text": "Carbon dioxide's particles are not carbon particles; they are new particles."}, {"t": "idea", "text": "So carbon dioxide is not black."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A compound's particles are new particles, so a compound has its own properties, not the properties of the elements in it. In a mixture the particles are unchanged, so each substance keeps its properties."}, {"t": "idea", "text": "Back to the two gases: their atoms are joined into water molecules, a new kind of particle."}, {"t": "idea", "text": "So water is a liquid that puts fires out, though hydrogen burns and oxygen feeds a fire."}], "script": [{"say": "Hydrogen is a gas that burns.", "screen": "[a tank labeled HYDROGEN; a flame]"}, {"say": "Oxygen is a gas that feeds a fire.", "screen": "[a tank labeled OXYGEN; a fire flares]"}, {"say": "Join hydrogen atoms and oxygen atoms in a fixed pattern, and you get water.", "screen": "[hydrogen + oxygen → water, in words]"}, {"say": "Water is a liquid that puts fires out. How can two gases make a liquid that does the opposite?", "screen": "[a glass of water; the fire goes out; question mark]"}, {"say": "Water is a compound of hydrogen and oxygen.", "screen": "[chip: COMPOUND]"}, {"say": "Zoom in: a hydrogen molecule is two hydrogen atoms joined.", "screen": "[box of small dark pairs]"}, {"say": "An oxygen molecule is two oxygen atoms joined.", "screen": "[box of large open pairs]"}, {"say": "Every water molecule is one oxygen atom joined to two hydrogen atoms.", "screen": "[box of water molecules]"}, {"say": "A water molecule is not a hydrogen molecule sitting next to an oxygen molecule.", "screen": "[a hydrogen pair beside an oxygen pair; cross]"}, {"say": "It is a new kind of particle: three atoms joined in a new pattern.", "screen": "[one water molecule, large; label NEW PARTICLE]"}, {"say": "New particles behave in new ways, so water has its own properties.", "screen": "[the glass; the fire out]"}, {"say": "In a mixture each substance keeps its own particles, so each keeps its own properties.", "screen": "[a box: hydrogen pairs and oxygen pairs mingled, not touching]"}, {"say": "Mix the two gases and you still have two gases; join their atoms into water and both gases are gone.", "screen": "[mixture box, label TWO GASES; water box, label ONE NEW SUBSTANCE]"}, {"say": "So here is the rule: a compound's particles are new particles, so a compound has its own properties.", "screen": "[rule slide reuses the three boxes; rule text]"}, {"say": "Back to the two gases: joined into water molecules, they make a liquid that puts fires out.", "screen": "[hydrogen + oxygen → water; the fire out]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Every water molecule is one oxygen atom joined to two hydrogen atoms, the same every time. Is water a compound?", "options": ["yes", "no"], "key": 0, "fb": ["Two kinds of atom joined in a fixed pattern make a compound.", "Water has two kinds of atom, joined in the same pattern every time: a compound."], "why": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound.<br>Water has oxygen and hydrogen atoms joined in one fixed pattern.<br>So water is a compound."}, {"type": "mcq", "tag": "what", "fig": "pt_salt_parents", "stem": "The table describes sodium, chlorine, and what table salt is made of. Which of these does table salt behave like?", "options": ["sodium", "chlorine", "both", "neither"], "key": 3, "fb": ["Table salt is not a soft metal and does not fizz in water.", "Table salt is not a green gas and is not poisonous to breathe.", "Table salt is a white solid you eat: like neither element.", "Table salt has its own properties: a white solid that is safe to eat."], "why": "In table salt the sodium and chlorine atoms are joined into new particles.<br>New particles behave in new ways.<br>So table salt behaves like neither sodium nor chlorine: it is a white solid that is safe to eat."}, {"type": "frq", "tag": "why", "task": "Sodium is a soft metal that fizzes in water, and chlorine is a poisonous green gas. Table salt is sodium and chlorine atoms joined: a white solid, safe to eat. Explain why table salt can be safe to eat, when its two elements are not.", "starter": "Table salt is safe to eat because…", "model": "Table salt is safe to eat because its particles are new particles.<br>In table salt, the sodium atoms and chlorine atoms are joined together.<br>A joined particle of sodium and chlorine is not a sodium atom sitting next to a chlorine atom.<br>New particles behave in new ways.<br>So table salt has its own properties, not sodium's and not chlorine's: a white solid that is safe to eat.", "points": ["the sodium and chlorine atoms are joined into new particles", "a new particle is not a sodium atom next to a chlorine atom, so it behaves in a new way", "so table salt has its own properties, not the properties of sodium or chlorine"]}, {"type": "mcq", "tag": "why", "stem": "Why can a compound have properties nothing like the elements in it?", "options": ["The atoms are joined into new particles, which behave in new ways.", "Each atom has turned into a completely different kind of atom.", "The elements in it have been used up completely, so nothing of them is left."], "key": 0, "fb": ["A compound's particles are new particles, so a compound has its own properties.", "The atoms are still the same atoms; they are joined into new particles.", "The atoms are all still there, joined into new particles."], "why": "In a compound the different kinds of atom are joined into new particles.<br>New particles behave in new ways.<br>So a compound has its own properties, not the properties of its elements."}, {"type": "mcq", "tag": "misconception", "stem": "Hydrogen burns. Priyanka says: \"Water is made of hydrogen, so water must burn too.\" Is Priyanka correct?", "options": ["yes", "no"], "key": 1, "fb": ["In water the hydrogen atoms are joined into water molecules, new particles with their own properties, so water does not burn.", "In water the hydrogen atoms are joined into water molecules, new particles with their own properties, so water does not burn."], "why": "In water the hydrogen atoms are joined to oxygen atoms in water molecules.<br>A water molecule is a new particle, not a hydrogen molecule.<br>New particles behave in new ways, so water does not burn, and Priyanka is not correct."}, {"type": "mcq", "tag": "transfer", "fig": "pt_sugar_parents", "stem": "The table describes carbon, hydrogen, oxygen, and what table sugar is made of. Is table sugar black, like carbon?", "options": ["yes", "no"], "key": 1, "fb": ["Sugar's particles are new particles, not carbon particles, so sugar does not look like carbon.", "The carbon atoms are joined into sugar particles, which have their own properties: white and sweet."], "why": "In sugar the carbon atoms are joined to hydrogen and oxygen atoms in new particles.<br>New particles behave in new ways.<br>So sugar is not black like carbon; it is a white, sweet solid."}, {"type": "mcq", "tag": "transfer", "stem": "Carbon is a black solid, and oxygen is a gas with no color. In carbon dioxide, one carbon atom is joined to two oxygen atoms. Which of these is carbon dioxide?", "options": ["a black powder, like carbon", "a substance with properties of its own", "a mixture of a black powder and a gas"], "key": 1, "fb": ["The carbon atoms are joined into new particles, so carbon dioxide is not black.", "Carbon dioxide's particles are new particles, so it has properties of its own: a gas with no color.", "Carbon dioxide is a compound, one new substance, not two substances mingled."], "why": "In carbon dioxide the carbon and oxygen atoms are joined into new particles.<br>New particles behave in new ways.<br>So carbon dioxide has its own properties: a gas with no color, not a black powder."}, {"type": "mcq", "tag": "transfer", "stem": "Iron filings are stirred into yellow sulfur powder, and the atoms stay in their own particles: a mixture. Does a magnet still pull the iron out?", "options": ["yes", "no"], "key": 0, "fb": ["In a mixture each substance keeps its own particles and its own properties, so the iron is still magnetic.", "The iron particles are unchanged in the mixture, so the iron is still magnetic."], "why": "In a mixture each substance keeps its own particles.<br>The iron particles are unchanged, so the iron keeps its properties.<br>Iron is magnetic, so the magnet still pulls the iron out."}, {"type": "mcq", "tag": "transfer", "stem": "Iron filings and sulfur powder are heated until their atoms join into one compound. What does the compound behave like?", "options": ["like iron", "like sulfur", "like neither"], "key": 2, "fb": ["The iron atoms are now part of new particles, so the compound does not behave like iron.", "The sulfur atoms are now part of new particles, so the compound does not behave like sulfur.", "A compound's particles are new particles, so it has its own properties."], "why": "In the compound the iron and sulfur atoms are joined into new particles.<br>New particles behave in new ways.<br>So the compound behaves in its own way, not like iron and not like sulfur."}, {"type": "mcq", "tag": "why", "stem": "Why does the mixture of iron and sulfur keep iron's properties, while the compound of iron and sulfur does not?", "options": ["In the mixture the iron atoms stay in their own particles.", "The mixture holds more iron than the compound does.", "Heating destroys the iron atoms in the compound."], "key": 0, "fb": ["Unchanged particles keep their properties; new particles have new properties.", "The amount of iron is not the point; whether the iron atoms are in their own particles is.", "The iron atoms are not destroyed; they are joined into new particles."], "why": "In the mixture the iron atoms stay in iron particles, so the iron keeps its properties.<br>In the compound the iron atoms are joined to sulfur atoms in new particles.<br>New particles behave in new ways, so the compound does not behave like iron."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Hydrogen burns and oxygen feeds a fire, yet water puts a fire out. Why, according to the video?", "options": ["Water holds too little hydrogen for a flame to burn.", "The oxygen inside water has already been used up.", "A water molecule is a new particle, with new properties."], "key": 2, "fb": ["The amount is not the point; the hydrogen atoms are in new particles.", "The oxygen atoms are still there, joined into water molecules.", "New particles behave in new ways, so water has its own properties."], "why": "In water the hydrogen and oxygen atoms are joined into water molecules.<br>A water molecule is a new kind of particle.<br>New particles behave in new ways, so water puts fires out."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-042", "stem": "Cut a piece of zinc smaller and smaller, in your mind. The smallest piece that is still zinc is one…", "accept": ["atom", "an atom", "zinc atom", "a zinc atom"], "why": "The smallest piece of zinc that is still zinc is one zinc atom.<br>Every material is made of atoms."}, {"type": "text", "tag": "term", "atom": "MAT-043", "stem": "Zoom in on a substance, and every atom is the same kind. A substance made of only one kind of atom is called an…", "accept": ["element", "an element"], "why": "A substance made of only one kind of atom is called an element."}, {"type": "text", "tag": "term", "atom": "MAT-044", "stem": "Three atoms are joined together and move as one particle. Two or more atoms joined together make one particle called a…", "accept": ["molecule", "a molecule"], "why": "Two or more atoms joined together make one particle called a molecule."}, {"type": "text", "tag": "term", "atom": "MAT-045", "stem": "Two kinds of atom are joined together, in the same pattern in every particle. A substance like this is called a…", "accept": ["compound", "a compound"], "why": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."}, {"type": "frq", "tag": "sort", "atom": "MAT-047", "task": "A chocolate bar has whole hazelnuts scattered through it: one bite holds two nuts, and the next holds none. Sort the bar into one of the four categories, and give your answer to each question you asked.", "starter": "The bar is…", "model": "The bar is a heterogeneous mixture.<br>Question 1: is there more than one kind of matter? Yes: chocolate and hazelnuts, so the bar is a mixture.<br>Next question, for a mixture: is it the same all the way through? No: one bite holds two nuts, and the next holds none.<br>A mixture that is different in different places is heterogeneous.", "points": ["the category: a heterogeneous mixture", "question 1: yes, chocolate and hazelnuts are more than one kind of matter, so a mixture", "the mixture question: no, one bite differs from the next, so heterogeneous"]}, {"type": "frq", "tag": "sort", "atom": "MAT-047", "task": "The argon gas inside a light bulb: every atom is an argon atom, and the atoms are single, not joined. Sort the argon into one of the four categories, and give your answer to each question you asked.", "starter": "The argon is…", "model": "The argon is an element.<br>Question 1: is there more than one kind of matter? No: argon only, so the argon is a pure substance.<br>Next question, for a pure substance: does it have only one kind of atom? Yes: every atom is an argon atom.<br>A pure substance with one kind of atom is an element.", "points": ["the category: an element", "question 1: no, one kind of matter only, so a pure substance", "the pure-substance question: yes, one kind of atom, so an element"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-046", "fig": "pr_box_a", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Large open and gray circles are two kinds of atom.", "Two kinds, and each pair is a large open circle joined to a gray circle: joined, one pattern.", "The circles touch in every pair, so the kinds are joined, not just mingled."], "why": "Question 1: large open and gray, two kinds of atom.<br>Question 2: each large open circle touches a gray circle, the same pattern every time, so joined.<br>Kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-042b", "stem": "Which is the smallest piece of silver that is still silver?", "options": ["half of one silver atom", "one silver atom", "the smallest speck of silver you can see"], "key": 1, "fb": ["Silver stops at the atom: half an atom is not silver.", "One silver atom is still silver; anything smaller is not.", "A speck you can see holds a huge number of silver atoms."], "why": "Silver is made of silver atoms.<br>One silver atom is still silver, and anything smaller is not.<br>So one silver atom is the smallest piece that is still silver."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-044", "fig": "pr_box_b", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show any molecules?", "options": ["yes", "no"], "key": 0, "fb": ["The small dark circles touch in pairs: joined atoms, so molecules, even though the gray atoms are single.", "Look at the small dark circles: they touch in pairs, and touching circles are joined atoms."], "why": "Look for touching circles.<br>The small dark circles touch in pairs, so those atoms are joined: molecules.<br>The gray circles are single atoms, but the drawing still shows molecules."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-045", "stem": "Kwame stirs iron filings into yellow sulfur powder until the heap looks gray-yellow all over. He says: \"The iron and sulfur atoms are joined now, so I have made a compound.\" Is Kwame correct?", "options": ["yes", "no"], "key": 1, "fb": ["Stirring mingles the particles; it does not join atoms. The heap is a mixture, and a magnet still lifts the iron out.", "Stirring mingles the particles; it does not join atoms. The heap is a mixture, and a magnet still lifts the iron out."], "why": "A compound needs different kinds of atom joined together in a fixed pattern.<br>Stirring only mingles the iron particles and the sulfur particles; it does not join their atoms.<br>So the heap is a mixture, and Kwame is not correct."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-043", "stem": "Which of these is an element?", "options": ["water", "carbon dioxide", "gold", "salt water"], "key": 2, "fb": ["Water has two kinds of atom, joined: a compound.", "Carbon dioxide has two kinds of atom, joined: a compound.", "Every atom in gold is a gold atom: one kind, an element.", "Salt water is water and salt mingled: a mixture."], "why": "An element is made of only one kind of atom.<br>Every atom in gold is a gold atom.<br>Water and carbon dioxide each have two kinds of atom joined, and salt water is two substances mingled."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-048", "stem": "Iron is a shiny gray metal, and oxygen is a gas with no color. Rust is iron atoms and oxygen atoms joined. Why is rust a crumbly orange-brown solid, unlike either?", "options": ["Rust's particles are new particles, so rust has its own properties.", "Rust holds more oxygen than iron, so the oxygen's properties win.", "The iron atoms in rust have turned into a different kind of atom.", "Rust is a mixture, so the two sets of properties blend together."], "key": 0, "fb": ["A compound's particles are new particles with their own properties.", "The amounts are not the point; the atoms are joined into new particles.", "The atoms are unchanged; they are joined into new particles.", "Rust is a compound, not a mixture: its atoms are joined."], "why": "In rust the iron and oxygen atoms are joined into new particles.<br>New particles behave in new ways.<br>So rust has its own properties: a crumbly orange-brown solid."}], "pp100": [{"d": "easy", "atom": "MAT-042", "stem": "A speck of brick dust is just too small to see without a magnifying glass. How many atoms does the speck hold?", "options": ["no atoms", "exactly one atom", "a few atoms", "a huge number of atoms"], "key": 3, "why": "Atoms are far too small to see, even with a school microscope.<br>A speck you can just see with a magnifying glass is far bigger than an atom.<br>So the speck holds a huge number of atoms."}, {"d": "easy", "atom": "MAT-042b", "stem": "A copper pipe is far bigger than a copper coin. Which statement about the smallest piece of copper in each is correct?", "options": ["The pipe's smallest piece is bigger than the coin's.", "The smallest piece in each is one copper atom.", "The coin's smallest piece is bigger than the pipe's.", "The smallest piece in each is the smallest speck you can see."], "key": 1, "why": "Copper is made of copper atoms, in the pipe and in the coin.<br>One copper atom is the smallest piece that is still copper, and anything smaller is not copper.<br>So the smallest piece is one atom in both; the size of the object makes no difference."}, {"d": "easy", "atom": "MAT-043", "stem": "A bar of pure tin: every atom in it is a tin atom. Which word names tin?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "why": "A substance made of only one kind of atom is called an element.<br>Every atom in the bar is a tin atom: one kind.<br>So tin is an element; a compound has two or more kinds joined, and a molecule is a particle, not a kind of substance."}, {"d": "easy", "atom": "MAT-044", "stem": "In a molecule of ammonia, a nitrogen atom sits in the middle, with a hydrogen atom joined to it on the left, another on the right and another below. How many atoms make up one ammonia molecule?", "options": ["1", "2", "3", "4"], "key": 3, "why": "A molecule is two or more atoms joined together.<br>Count the hydrogen atoms: left, right and below make three.<br>Add the nitrogen atom in the middle: one plus three is four atoms in one molecule."}, {"d": "easy", "atom": "MAT-045", "stem": "Which of these substances is a compound?", "options": ["a gas of single atoms, all one kind", "a gas of joined pairs, all one kind", "a liquid of two kinds of atom, joined in one pattern", "a drink of two kinds of particle mingled together but never joined"], "key": 2, "why": "A compound is two or more kinds of atom joined together in a fixed pattern.<br>Only the liquid has two kinds of atom joined in one pattern.<br>One kind of atom makes an element, single or in pairs; kinds mingled but not joined make a mixture."}, {"d": "easy", "atom": "MAT-046", "fig": "pp_box_c", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which category is this drawing?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "why": "Question 1: every circle is a gray circle, so one kind of atom.<br>One kind of atom makes an element, joined in pairs or not.<br>Each pair is a molecule, but molecule names a particle, not a category of substance."}, {"d": "easy", "atom": "MAT-047", "stem": "A student sorts a sample with the full tree. Question 1, is there more than one kind of matter? Yes. Which two categories are still possible?", "options": ["an element or a homogeneous mixture", "a compound or a heterogeneous mixture", "an element or a compound", "a homogeneous or a heterogeneous mixture"], "key": 3, "why": "A yes to question 1 means the sample is a mixture.<br>A mixture is then sorted by whether it is the same all the way through.<br>So the two categories left are a homogeneous mixture and a heterogeneous mixture; element and compound are the pure-substance leaves."}, {"d": "easy", "atom": "MAT-047", "stem": "A student sorts a sample. Question 1, is there more than one kind of matter? No. Next question, does it have only one kind of atom? No. Which category is the sample?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 1, "why": "Question 1 was no, so the sample is a pure substance, not a mixture.<br>The next question was no, so the sample has more than one kind of atom.<br>A pure substance with different kinds of atom joined is a compound."}, {"d": "easy", "atom": "MAT-045", "stem": "A white powder: every particle is one calcium atom joined to one carbon atom and three oxygen atoms, the same in every particle. Which category is the powder?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 1, "why": "Every particle is the same, so the powder is one kind of matter: a pure substance.<br>Each particle holds three kinds of atom, joined in one fixed pattern.<br>Different kinds of atom joined in a fixed pattern make a compound."}, {"d": "easy", "atom": "MAT-042", "stem": "A drawing zooms in on a piece of aluminum foil and shows it as gray circles. What is one gray circle in that drawing?", "options": ["a group of several aluminum atoms", "a speck of aluminum, made of many atoms", "a piece of aluminum smaller than an atom", "one aluminum atom"], "key": 3, "why": "Every material is made of atoms.<br>In aluminum, each particle is one aluminum atom.<br>So the gray circle this topic has drawn since its first lesson is one atom; a speck holds a huge number of atoms, and nothing smaller than one atom is aluminum."}, {"d": "easy", "atom": "MAT-042", "stem": "Zoom in on any material until you reach its particles. What is one particle?", "options": ["always exactly one atom, never more", "one atom, or a few atoms joined together", "a speck of material just too small to see", "a piece far smaller than any atom"], "key": 1, "why": "Every material is made of atoms.<br>In aluminum each particle is one atom; in water each particle is three atoms joined.<br>So a particle is one atom, or a few atoms joined together: never a visible speck, and never smaller than an atom."}, {"d": "easy", "atom": "MAT-043", "stem": "Which of these words names a kind of substance, not a single particle?", "options": ["atom", "element", "molecule", "particle"], "key": 1, "why": "An atom is one particle: the smallest piece of an element.<br>A molecule is one particle: two or more atoms joined together.<br>An element is a substance made of a huge number of atoms of one kind: a kind of matter, not one particle."}, {"d": "easy", "atom": "MAT-043", "stem": "Silver, oxygen and iodine are all elements. What do the three have in common?", "options": ["Each is made of one kind of atom.", "Each is a metal.", "Each is a solid at room temperature.", "Each has all of its atoms joined in pairs."], "key": 0, "why": "A substance made of only one kind of atom is called an element.<br>Every atom in silver is a silver atom, every atom in oxygen an oxygen atom, every atom in iodine an iodine atom.<br>Oxygen is a gas, not a metal or a solid, and silver's atoms are single, so only one kind of atom fits all three."}, {"d": "easy", "atom": "MAT-044", "stem": "Two atoms are joined together in one molecule. What happens to the two atoms when the molecule moves?", "options": ["One atom moves while the other stays still.", "The two atoms drift apart, each on its own.", "The atoms move together, but each is its own particle.", "Both atoms move together, as one particle."], "key": 3, "why": "Two or more atoms joined together make one particle called a molecule.<br>Joined atoms stay joined while the molecule moves.<br>So both atoms move together, as one particle."}, {"d": "easy", "atom": "MAT-045", "stem": "Which of these categories does every compound belong to?", "options": ["a pure substance", "a mixture", "a homogeneous mixture", "an element"], "key": 0, "why": "A compound is two or more kinds of atom joined together in a fixed pattern.<br>Every particle of a compound is the same new particle, so a compound is one kind of matter.<br>A sample with only one kind of matter is a pure substance, not a mixture."}, {"d": "easy", "atom": "MAT-046", "fig": "pp_box_i", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which of these can you NOT tell from this drawing?", "options": ["how many kinds of atom the sample has", "whether the atoms are joined into groups", "whether the sample is a solid, a liquid or a gas", "how many kinds of particle the sample has"], "key": 2, "why": "Each size and shade of circle is a kind of atom, and touching circles are joined.<br>So the drawing shows the kinds of atom, which atoms are joined, and so how many kinds of particle there are.<br>It does not show how far apart the particles really are.<br>So it cannot tell you the state: solid, liquid or gas."}, {"d": "easy", "atom": "MAT-046", "stem": "To sort a particle drawing, the lesson asks two questions in order. Which question comes first?", "options": ["Are the different kinds of atom joined to each other?", "Is the sample a solid, a liquid or a gas?", "How many circles does the drawing show?", "How many kinds of atom does the drawing show?"], "key": 3, "why": "To sort a particle drawing, ask two questions in order.<br>Question 1: how many kinds of atom are there? One kind means an element.<br>Only when there is more than one kind do you ask question 2: are the different kinds joined together?"}, {"d": "easy", "atom": "MAT-048", "stem": "Which of these is true of a compound's properties?", "options": ["They are the compound's own.", "They are a blend of its elements' properties.", "They match the element it holds more of.", "They include every property of each of its elements."], "key": 0, "why": "A compound's atoms are joined into new particles: neither element's particles.<br>New particles behave in new ways.<br>So a compound has its own properties, not the properties of the elements in it."}, {"d": "medium", "atom": "MAT-048", "stem": "Copper is a shiny orange-brown metal, and oxygen is a gas with no color. A jar holds a dull black powder made from copper and oxygen. The powder looks like neither. What does this tell you about the copper atoms and oxygen atoms in the powder?", "options": ["They are mingled together but not joined.", "The copper atoms have turned into black atoms.", "The oxygen has escaped, and only copper is left.", "They are joined together into new particles."], "key": 3, "why": "In a mixture each substance keeps its own particles, so a mixture of copper and oxygen would still show copper's orange-brown.<br>The powder looks like neither, so its particles are not copper particles or oxygen particles.<br>New particles behave in new ways: the atoms are joined into new particles, a compound."}, {"d": "medium", "atom": "MAT-046", "fig": "pp_box_f", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which category is this drawing?", "options": ["a compound", "a molecule", "a mixture", "an element"], "key": 0, "why": "Question 1: large open and gray, two kinds of atom, so not an element.<br>Question 2: each large open circle touches two gray circles, the same pattern every time, so the kinds are joined.<br>Kinds joined in a fixed pattern make a compound; the groups are separate molecules of one substance, not separate substances."}, {"d": "medium", "atom": "MAT-046", "fig": "pp_box_g", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which category is this drawing?", "options": ["a compound", "an element", "a mixture", "a molecule"], "key": 2, "why": "Question 1: large open, small dark and gray, so more than one kind of atom.<br>Question 2: the open-and-dark pairs never touch the gray pairs, so the two kinds of particle are not joined to each other.<br>Kinds not joined make a mixture, even though every particle is a molecule."}, {"d": "medium", "atom": "MAT-044", "fig": "pp_box_d", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which statement about the particles in this drawing is correct?", "options": ["Every particle in the box is a molecule.", "No particle in the box is a molecule.", "Some are molecules, some are single atoms.", "Every particle in the box is a single atom."], "key": 2, "why": "Look for touching circles.<br>The three-circle groups are joined atoms, so they are molecules.<br>The large open circles on their own are single atoms, so the box holds both."}, {"d": "medium", "atom": "MAT-043", "fig": "pt_four_gases", "stem": "The table lists four gases and what their particles are made of. How many of the four gases are elements?", "options": ["1", "2", "3", "4"], "key": 2, "why": "An element has one kind of atom, single or joined.<br>Neon, nitrogen and helium each have one kind of atom, so each is an element.<br>Carbon dioxide has carbon and oxygen atoms joined, so it is a compound: three of the four."}, {"d": "medium", "atom": "MAT-042", "stem": "In a lead fishing weight, each particle is one lead atom. In a tank of carbon dioxide, each particle is three atoms joined together. Which statement is correct?", "options": ["Both are made of atoms.", "Only the lead is made of atoms.", "Only the carbon dioxide is made of atoms.", "The carbon dioxide is made of particles, not atoms."], "key": 0, "why": "Every material is made of atoms.<br>In the lead each particle is one atom; in the carbon dioxide each particle is three atoms joined.<br>So both are made of atoms: a particle of joined atoms is still made of atoms."}, {"d": "medium", "atom": "MAT-045", "stem": "Two jars hold carbon atoms and oxygen atoms, joined. In jar 1, every particle is one carbon atom joined to two oxygen atoms. In jar 2, the joined groups are not all alike: some hold two atoms, some three, some five. Which jar holds one compound?", "options": ["jar 1 only", "jar 2 only", "both jars", "neither jar"], "key": 0, "why": "A compound is two or more kinds of atom joined together in one fixed pattern.<br>In jar 1 every particle has the same pattern, so jar 1 holds one compound.<br>In jar 2 the groups are not all alike, so there is no one fixed pattern: jar 2 does not hold one compound."}, {"d": "medium", "atom": "MAT-042", "stem": "A whole nutmeg is grated into a fine powder. Which statement about its atoms is correct?", "options": ["Grating cuts every single atom into several smaller atoms.", "Grating turns the atoms themselves into powder.", "The atoms are unchanged, spread among smaller pieces.", "The powder is far too fine to be made of atoms."], "key": 2, "why": "Every material is made of atoms, and atoms are far too small to see.<br>Grating breaks the nutmeg into smaller pieces, and each piece is still made of the same atoms.<br>Even the finest speck holds a huge number of atoms, so grating never reaches the atoms themselves."}, {"d": "medium", "atom": "MAT-042b", "stem": "A tiny piece of platinum is exactly two platinum atoms. The piece is split into its two halves. What is each half?", "options": ["a piece smaller than an atom, no longer platinum", "a piece smaller than an atom, still platinum", "one platinum atom, no longer platinum", "one platinum atom, still platinum"], "key": 3, "why": "The piece is two atoms, so each half is one whole platinum atom.<br>One atom of platinum is the smallest piece that is still platinum.<br>Only a piece smaller than one atom would no longer be platinum, and the split cut no atom."}, {"d": "medium", "atom": "MAT-044", "stem": "Every particle of table sugar is 45 atoms joined together: carbon, hydrogen and oxygen atoms. Which of these is the smallest piece of sugar that is still sugar?", "options": ["one carbon atom", "one whole sugar particle", "a few atoms of one sugar particle", "one grain of sugar"], "key": 1, "why": "Sugar is a compound: its particles are carbon, hydrogen and oxygen atoms joined.<br>One carbon atom on its own is carbon, not sugar, and a few atoms broken off a sugar particle are not sugar either.<br>So the smallest piece that is still sugar is one whole sugar particle; a grain holds a huge number of them."}, {"d": "medium", "atom": "MAT-043", "stem": "Bismuth is a metal that melts in a pan on a stove. Every atom in a solid lump of bismuth is a bismuth atom. Which category is the melted, liquid bismuth?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "why": "Melting changes how the atoms move and sit, not what they are.<br>Every atom in the liquid is still a bismuth atom: one kind of atom.<br>A substance made of only one kind of atom is an element, solid or liquid."}, {"d": "medium", "atom": "MAT-044", "fig": "pp_box_j", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. How many molecules does this drawing show?", "options": ["3", "6", "9", "12"], "key": 0, "why": "A molecule is two or more atoms joined together, drawn as touching circles.<br>Three pairs of circles touch, so the drawing shows 3 molecules.<br>The six large open circles are single atoms, not molecules; 9 counts every particle, and 12 counts every atom."}, {"d": "medium", "atom": "MAT-045", "stem": "Every particle of water is one oxygen atom joined to two hydrogen atoms. Every particle of hydrogen peroxide, another liquid, is two oxygen atoms joined to two hydrogen atoms. Which statement about the two liquids is correct?", "options": ["They are the same compound.", "Hydrogen peroxide is an element.", "They are two different compounds.", "Hydrogen peroxide is a mixture of water and oxygen."], "key": 2, "why": "A compound is two or more kinds of atom joined together in a fixed pattern.<br>Water's pattern is one oxygen atom to two hydrogen atoms; hydrogen peroxide's is two to two.<br>Two different fixed patterns make two different compounds, even from the same two kinds of atom; in both liquids the atoms are joined, so neither is a mixture."}, {"d": "medium", "atom": "MAT-046", "fig": "pp_box_k", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. How many different substances does this drawing show?", "options": ["1", "2", "3", "9"], "key": 1, "why": "One substance is one kind of particle.<br>Here there are two kinds of particle: one large open circle joined to two small dark circles, and two gray circles joined.<br>So the drawing shows 2 substances mingled, a mixture; 3 counts the kinds of atom, and 9 counts the particles."}, {"d": "medium", "atom": "MAT-047", "stem": "One student sorts a sample as an element. Another student sorts the same sample as a compound. Which question do the two disagree about?", "options": ["Is there more than one kind of matter?", "Does it have only one kind of atom?", "Is it the same all the way through?", "Is it made of atoms?"], "key": 1, "why": "An element and a compound are both pure substances, so both students answered no to question 1.<br>A pure substance then asks: does it have only one kind of atom? Yes means an element, and no means a compound.<br>So that is the question they disagree about."}, {"d": "medium", "atom": "MAT-047", "fig": "pp_box_m", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which category is this drawing?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 2, "why": "Question 1: three kinds of atom, none joined to another kind, so more than one kind of matter: a mixture.<br>The mixture question: the three kinds are spread evenly through the box, so it is the same all the way through.<br>A mixture that is the same all the way through is homogeneous."}, {"d": "medium", "atom": "MAT-047", "fig": "pp_box_e", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which category is this drawing?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 3, "why": "Question 1: two kinds of atom, never joined to each other, so more than one kind of matter: a mixture.<br>The mixture question: one kind of atom is gathered on one side of the box, so it is not the same all the way through.<br>A mixture that is not the same all the way through is heterogeneous."}, {"d": "medium", "atom": "MAT-048", "stem": "Chalk, a soft white rock, is a compound: every particle is one calcium atom joined to one carbon atom and three oxygen atoms, and carbon on its own is a black solid. A student grinds a lump of chalk to the finest powder she can and searches it under a school microscope for black specks of carbon. What does she see?", "options": ["black specks, once the powder is fine enough", "a gray powder, the carbon spread through the white", "a black powder, once grinding frees the carbon", "no black specks"], "key": 3, "why": "In chalk the carbon atoms are joined to calcium and oxygen atoms inside every chalk particle.<br>Grinding makes smaller pieces of chalk; every piece is still chalk particles, with the carbon atoms inside them.<br>The compound has its own color, white, so no black carbon shows, however fine the powder."}, {"d": "hard", "atom": "MAT-042b", "stem": "Dev looks at iron filings under a school microscope and sees tiny specks. He says: \"The smallest speck I can see is the smallest piece of iron; anything smaller is not iron.\" What is the smallest piece of iron?", "options": ["the smallest speck you can see", "a speck just too small for the microscope to show", "one iron atom", "half of one iron atom"], "key": 2, "why": "Iron is made of iron atoms, and atoms are far too small to see even with a school microscope.<br>The smallest speck Dev can see holds a huge number of iron atoms, so a smaller piece is still iron.<br>Iron stops at one atom: that is the smallest piece, so Dev is not correct."}, {"d": "hard", "atom": "MAT-048", "stem": "Salt is stirred into water until it vanishes: salt particles mingled among water particles, not joined to them. Leah says: \"Salt water is a new substance with new properties, so it should not taste salty.\" Which statement about the salt in the salt water is correct?", "options": ["It has become new particles with new properties.", "It keeps its own particles.", "Its atoms have joined to the water's atoms.", "It has not yet mixed in with the water."], "key": 1, "why": "Stirring mingles the salt particles among the water particles; it does not join their atoms, so salt water is a mixture.<br>In a mixture each substance keeps its own particles, so each keeps its own properties.<br>The salt particles are unchanged, so the salty taste stays, and Leah is not correct."}, {"d": "hard", "atom": "MAT-047", "stem": "A clear liquid is the same all the way through. Samira says: \"It has two kinds of atom, so it is a compound.\" Zoom in: two kinds of particle are mingled, not joined. Samira skipped a question. Which one?", "options": ["Does it have only one kind of atom?", "Is there more than one kind of matter?", "Is it the same all the way through?", "Does it have two kinds of atom?"], "key": 1, "why": "Question 1: two kinds of particle mingled means more than one kind of matter: a mixture, so Samira skipped question 1.<br>The mixture question: the same all the way through, so yes.<br>A mixture that is the same all through is homogeneous."}, {"d": "hard", "atom": "MAT-043", "stem": "Iodine: every particle is two iodine atoms joined. Finn says: \"The atoms are joined, so iodine is a compound.\" Which category is iodine?", "options": ["a compound", "a mixture", "a molecule", "an element"], "key": 3, "why": "Question 1 counts the kinds of atom: every atom in iodine is an iodine atom, so one kind.<br>One kind of atom makes an element, joined in pairs or not.<br>A compound needs two or more kinds joined, so Finn is not correct."}, {"d": "hard", "atom": "MAT-042", "fig": "pp_box_h", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Hollis says the pea-sized piece of tungsten this drawing zooms in on holds far more than nine atoms, and the drawing shows only a tiny part of it. How many atoms does the pea-sized piece hold?", "options": ["exactly nine", "far more than nine", "nine very large atoms", "about nine, give or take a few"], "key": 1, "why": "Atoms are far too small to see, even with a school microscope.<br>A pea-sized piece you can see holds a huge number of atoms.<br>The drawing zooms in on a tiny part of the piece and shows nine of them, so Hollis is correct."}, {"d": "hard", "atom": "MAT-042b", "stem": "Aditi says: \"One chromium atom on its own is not chromium yet; it takes a clump of at least a few chromium atoms before the metal counts as chromium.\" Which statement about one chromium atom on its own is correct?", "options": ["It is not chromium at all.", "It is half of the smallest piece of chromium.", "It is already chromium.", "It becomes chromium only inside a clump of atoms."], "key": 2, "why": "One atom of an element is the smallest piece that is still that element.<br>One chromium atom is already chromium, and a clump of atoms is many pieces of chromium together.<br>Nothing smaller than one atom is chromium, so Aditi is not correct."}, {"d": "hard", "atom": "MAT-043", "stem": "A sealed tank holds helium and neon mingled together: every atom of helium is a helium atom, and every atom of neon is a neon atom. Emeka says: \"Each gas is an element, so the gas in the tank is an element too.\" What does the tank hold?", "options": ["one element", "a compound", "a new element made from the two", "a mixture of two elements"], "key": 3, "why": "An element is made of only one kind of atom.<br>The tank holds helium atoms and neon atoms: two kinds, so its contents are not an element.<br>The atoms are mingled, not joined to each other, so the tank holds a mixture of two elements, and Emeka is not correct."}, {"d": "hard", "atom": "MAT-044", "stem": "In an earlier topic, a solid was drawn as particles packed together and touching. Casper says: \"Touching circles are joined, so that drawing showed one giant molecule.\" Casper is wrong. What did the touching in that earlier drawing show?", "options": ["particles packed closely", "atoms joined into one giant molecule", "atoms joined into a compound", "particles melting into one another"], "key": 0, "why": "In the earlier drawings, a solid's particles were packed together, touching: that showed a solid.<br>In this topic's drawings, touching means joined, not packed.<br>The earlier drawing said nothing about joining, so it did not show a molecule, and Casper is not correct."}, {"d": "hard", "atom": "MAT-045", "stem": "Every particle of methane, the gas burned in a kitchen stove, is one carbon atom joined to four hydrogen atoms. Lucia says: \"Methane cannot be a compound: a compound needs the same number of each kind of atom.\" Which category is methane?", "options": ["an element", "a mixture", "a compound", "a molecule"], "key": 2, "why": "A compound is two or more kinds of atom joined together in a fixed pattern.<br>Methane's pattern is one carbon atom joined to four hydrogen atoms, the same in every particle.<br>The counts need not be equal; the pattern must be fixed. So methane is a compound, and Lucia is not correct."}, {"d": "hard", "atom": "MAT-045", "stem": "Every particle of hydrogen sulfide, the gas that smells of rotten eggs, is two hydrogen atoms joined to one sulfur atom. Teo says: \"It cannot be a compound: it is a gas, and gas particles are far apart, so its atoms cannot be joined.\" Teo is wrong: hydrogen sulfide is a compound. Why?", "options": ["Inside each particle, two kinds of atom are joined in one pattern.", "Its particles are far apart, like every gas's.", "It smells of rotten eggs, and every smell is a compound.", "Its particles touch when it turns into a liquid."], "key": 0, "why": "In a gas the particles are far apart from each other.<br>Each particle of hydrogen sulfide is two hydrogen atoms joined to one sulfur atom: the atoms are joined inside the particle.<br>Two kinds of atom joined in one fixed pattern make a compound, whatever the state, so Teo is not correct."}, {"d": "hard", "atom": "MAT-046", "fig": "pp_box_l", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Selin says: \"A large open circle is in every particle here, so the whole drawing is one substance: a compound.\" Which category is this drawing?", "options": ["an element", "a compound", "a molecule", "a mixture"], "key": 3, "why": "Look at the particles, not only the atoms.<br>Some particles are one large open circle joined to two small dark circles; others are two large open circles joined.<br>Two kinds of particle that never touch each other are two substances mingled: a mixture, so Selin is not correct."}, {"d": "hard", "atom": "MAT-047", "stem": "A clear quartz crystal: its particles are silicon atoms and oxygen atoms joined in the same pattern all through, and every part of the crystal looks the same. Elif says: \"It is the same all the way through, so it is a homogeneous mixture.\" Which category is the crystal?", "options": ["a homogeneous mixture", "a compound", "a heterogeneous mixture", "an element"], "key": 1, "why": "Question 1 first: every particle is the same, so the crystal holds one kind of matter, a pure substance.<br>The same-all-through question is asked only of a mixture, so it never applies here.<br>A pure substance with two kinds of atom joined in a fixed pattern is a compound, so Elif is not correct."}, {"d": "hard", "atom": "MAT-048", "stem": "Zinc, a gray metal, and sulfur, a yellow powder, join into one compound: a white powder. Amir says: \"The compound should have come out pale yellow-gray, a blend of the two.\" Amir is wrong: the compound's color is its own. Why?", "options": ["The zinc coats the sulfur and hides its color.", "Heating bleached both colors away.", "The compound's particles are new particles.", "White is the color of every powder."], "key": 2, "why": "In the compound the zinc atoms and sulfur atoms are joined into new particles.<br>New particles behave in new ways, so the compound's color is its own.<br>A compound does not blend its elements' properties, so Amir is not correct."}, {"d": "hard", "atom": "MAT-048", "stem": "Every particle of water is one oxygen atom joined to two hydrogen atoms. A student wants the hydrogen out of a glass of water. Which statement is correct?", "options": ["Nothing that separates a mixture can take the hydrogen out.", "A fine enough filter catches the hydrogen and lets the oxygen through.", "The hydrogen slowly floats off the top on its own.", "A magnet pulls the oxygen out and leaves the hydrogen behind."], "key": 0, "why": "Filters, magnets and floating separate mixtures, in which each substance keeps its own particles.<br>In water the hydrogen atoms are joined to oxygen atoms inside every water particle, so there are no hydrogen particles to catch.<br>So no method for separating a mixture takes the hydrogen out."}], "figs": {"foil_halving": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 234\" style=\"width:100%;max-width:675px;height:auto\" role=\"img\" aria-label=\"A strip of foil drawn five times, each strip half the length of the one above; then dots for many more cuts; then a single gray circle labeled one atom of aluminum, the smallest piece that is still aluminum\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"540\" height=\"234\" fill=\"#ffffff\"/><text x=\"270\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">Cut the strip in half, again and again<\/text><rect x=\"30\" y=\"40\" width=\"240\" height=\"12\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"282\" y=\"51\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">the strip<\/text><rect x=\"30\" y=\"66\" width=\"120\" height=\"12\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"162.0\" y=\"77\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">1 cut<\/text><rect x=\"30\" y=\"92\" width=\"60\" height=\"12\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"102.0\" y=\"103\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">2 cuts<\/text><rect x=\"30\" y=\"118\" width=\"30\" height=\"12\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"72.0\" y=\"129\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">3 cuts<\/text><rect x=\"30\" y=\"144\" width=\"15\" height=\"12\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"57.0\" y=\"155\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">4 cuts<\/text><text x=\"38\" y=\"178\" text-anchor=\"start\" font-size=\"18\" font-weight=\"normal\" fill=\"#222\">…<\/text><text x=\"70\" y=\"180\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">many more cuts, far too small to see<\/text><circle cx=\"38.0\" cy=\"210.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"60\" y=\"214\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">one atom of aluminum: the smallest piece that is still aluminum<\/text><\/svg>", "atom_key": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 240\" style=\"width:100%;max-width:675px;height:auto\" role=\"img\" aria-label=\"A key: in this drawing a gray circle is one atom of aluminum; a large open circle and a small dark circle are other kinds of atom; two large open circles touching are atoms joined together; two large open circles apart are atoms not joined; a line says the words under each drawing say which kind of atom its circles are\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"540\" height=\"240\" fill=\"#ffffff\"/><text x=\"270\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">How this course draws atoms<\/text><circle cx=\"40.0\" cy=\"60.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"60\" y=\"64\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">one atom of aluminum, in this drawing: a gray circle<\/text><circle cx=\"40.0\" cy=\"100.0\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"68.0\" cy=\"100.0\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"90\" y=\"104\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">other kinds of atom: a different size and shade each<\/text><circle cx=\"40.5\" cy=\"140.0\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"59.5\" cy=\"140.0\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"90\" y=\"144\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">atoms joined together are drawn touching<\/text><circle cx=\"28.0\" cy=\"180.0\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"72.0\" cy=\"180.0\" r=\"10.0\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"90\" y=\"184\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">atoms not joined are drawn apart<\/text><text x=\"30\" y=\"222\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">The words under each drawing say which kind of atom its circles are.<\/text><\/svg>", "kettle_atom": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 202\" style=\"width:100%;max-width:587px;height:auto\" role=\"img\" aria-label=\"A copper kettle; an arrow labeled zoom to a circle holding one gray circle drawn large, labeled one copper atom, still copper; an arrow to a small dashed circle, much smaller than the atom, labeled a piece smaller than one atom, under the question 'Still copper?' with a cross: not copper anymore\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"470\" height=\"202\" fill=\"#ffffff\"/><path d=\"M 30 150 q 0 -90 60 -90 q 60 0 60 90 z\" fill=\"#d9d9d9\" stroke=\"#222\" stroke-width=\"1.5\"/><path d=\"M 140 90 q 30 -30 40 -8\" fill=\"none\" stroke=\"#222\" stroke-width=\"3\"/><path d=\"M 60 72 q 30 -40 60 0\" fill=\"none\" stroke=\"#222\" stroke-width=\"3\"/><line x1=\"38\" y1=\"150\" x2=\"142\" y2=\"150\" stroke=\"#222\" stroke-width=\"1.5\"/><ellipse cx=\"90\" cy=\"82\" rx=\"30\" ry=\"4\" fill=\"#f1f1f1\" stroke=\"#222\"/><text x=\"90\" y=\"175\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">a copper kettle<\/text><line x1=\"150.0\" y1=\"100.0\" x2=\"190.0\" y2=\"104.0\" stroke=\"#222\" stroke-width=\"1.6\"/><polyline points=\"184.4,106.1 190.0,104.0 184.9,100.9\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.6\"/><text x=\"170\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">zoom<\/text><circle cx=\"240\" cy=\"105\" r=\"44\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><circle cx=\"240.0\" cy=\"105.0\" r=\"15.4\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"240\" y=\"172\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">one copper atom<\/text><text x=\"240\" y=\"188\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">still copper<\/text><line x1=\"292.0\" y1=\"105.0\" x2=\"336.0\" y2=\"105.0\" stroke=\"#222\" stroke-width=\"1.6\"/><polyline points=\"330.6,107.6 336.0,105.0 330.6,102.4\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.6\"/><text x=\"390\" y=\"38\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">Still copper?<\/text><line x1=\"382\" y1=\"54\" x2=\"398\" y2=\"70\" stroke=\"#222\" stroke-width=\"3\"/><line x1=\"382\" y1=\"70\" x2=\"398\" y2=\"54\" stroke=\"#222\" stroke-width=\"3\"/><circle cx=\"390\" cy=\"105\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/><text x=\"390\" y=\"130\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">a piece smaller<\/text><text x=\"390\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fi \" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"110.0\" cy=\"79.0\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"56.0\" cy=\"86.0\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"51.0\" cy=\"38.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"171.0\" cy=\"40.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"182.0\" cy=\"79.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><\/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
