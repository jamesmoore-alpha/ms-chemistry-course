ill copper?"], "forest": ["What is the smallest piece of copper that still counts as copper?", "One atom of copper is still copper.", "Anything smaller than one atom is not copper anymore.", "So the smallest piece of copper is a single atom."], "article": [{"t": "idea", "text": "A copper kettle is made of copper atoms."}, {"t": "idea", "text": "Imagine one copper atom taken out of the kettle."}, {"t": "idea", "text": "Is that one atom still copper?"}, {"t": "idea", "text": "Now imagine a piece even smaller than one atom."}, {"t": "idea", "text": "Is that piece still copper?"}, {"t": "h", "text": "Atom, again"}, {"t": "idea", "text": "Every material is made of atoms."}, {"t": "idea", "text": "The smallest piece of aluminum that is still aluminum is one atom."}, {"t": "idea", "text": "The same is true of copper: the kettle is made of copper atoms."}, {"t": "h", "text": "Zoom in on the kettle"}, {"t": "idea", "text": "Zoom in on the kettle: copper atoms, and nothing else."}, {"t": "idea", "text": "Now imagine one copper atom on its own."}, {"t": "idea", "text": "That one atom is still copper."}, {"t": "idea", "text": "One atom is the smallest piece of copper there can be."}, {"t": "fig", "key": "kettle_atom", "cap": "The copper kettle, zoomed in to one copper atom: still copper. A piece smaller than one atom is crossed out: it is not copper anymore."}, {"t": "h", "text": "Smaller than an atom"}, {"t": "idea", "text": "Now imagine a piece smaller than one copper atom."}, {"t": "idea", "text": "That piece is not copper anymore."}, {"t": "idea", "text": "Copper stops at the atom: there is no smaller piece of copper."}, {"t": "fig", "key": "still_copper_cases", "cap": "Three cases. The tick or cross answers one question: still copper? A lump of copper, many atoms: still copper. One copper atom: still copper. A piece smaller than one atom: not copper."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a gold earring."}, {"t": "idea", "text": "One gold atom is still gold."}, {"t": "idea", "text": "A hundred gold atoms together are still gold."}, {"t": "idea", "text": "A piece smaller than one gold atom is not gold."}, {"t": "idea", "text": "Now consider a silver bracelet."}, {"t": "idea", "text": "One silver atom is still silver."}, {"t": "idea", "text": "The whole bracelet, a huge number of silver atoms, is still silver."}, {"t": "idea", "text": "A piece smaller than one silver atom is not silver."}, {"t": "fig", "key": "still_gold_silver_cases", "cap": "The gold earring's cases under one question, still gold?, and the silver bracelet's under another, still silver? One atom: still gold, still silver. Many atoms: still gold, still silver. A piece smaller than one atom: not gold, not silver."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "One atom of copper is the smallest piece that is still copper; anything smaller is not copper. The same is true of gold, silver and iron: the smallest piece that is still that substance is one atom."}, {"t": "idea", "text": "Back to the kettle: one copper atom taken out is still copper."}, {"t": "idea", "text": "A piece smaller than that one atom is not copper."}], "script": [{"say": "A copper kettle is made of copper atoms.", "screen": "[a copper kettle; a zoom circle full of gray circles]"}, {"say": "Take one copper atom out of the kettle, in your mind. Is that one atom still copper?", "screen": "[one gray circle lifted out; question mark]"}, {"say": "Now imagine a piece even smaller than one atom. Is that piece still copper?", "screen": "[a dashed circle inside the atom; question mark]"}, {"say": "Every material is made of atoms, and the kettle is made of copper atoms.", "screen": "[chip: COPPER ATOMS]"}, {"say": "One copper atom on its own is still copper.", "screen": "[the one gray circle; tick; label STILL COPPER]"}, {"say": "One atom is the smallest piece of copper there can be.", "screen": "[label: THE SMALLEST PIECE]"}, {"say": "A piece smaller than one copper atom is not copper anymore.", "screen": "[the dashed circle; cross; label NOT COPPER]"}, {"say": "Copper stops at the atom.", "screen": "[chip: COPPER STOPS AT THE ATOM]"}, {"say": "Now consider a gold earring: one gold atom is still gold.", "screen": "[earring; one circle, tick under STILL GOLD?]"}, {"say": "And a hundred gold atoms are still gold.", "screen": "[a scatter of circles, tick]"}, {"say": "A piece smaller than one gold atom is not gold.", "screen": "[dashed circle; cross]"}, {"say": "Now consider a silver bracelet: one silver atom is still silver.", "screen": "[bracelet; one circle, tick under STILL SILVER?]"}, {"say": "And anything smaller than one atom is not silver.", "screen": "[dashed circle, cross]"}, {"say": "So here is the rule: one atom is the smallest piece that is still that substance, and anything smaller is not.", "screen": "[rule slide reuses the three cases under STILL COPPER?; rule text]"}, {"say": "Back to the kettle: one copper atom taken out is still copper, and a piece smaller than that atom is not.", "screen": "[the kettle, the one atom with its tick, the dashed circle with its cross]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which of these is true of every material, from wood to gold to air?", "options": ["It is made of atoms.", "It is made of water.", "It is a solid."], "key": 0, "fb": ["Every material is made of atoms.", "Water is one material, and water is itself made of atoms.", "Air is a gas, and air is made of atoms too."], "why": "Every material is made of atoms.<br>Wood, gold and air are all materials.<br>So each of them is made of atoms."}, {"type": "mcq", "tag": "what", "stem": "What is the smallest piece of iron that is still iron?", "options": ["one iron atom", "the smallest speck of iron you can see", "there is no smallest piece"], "key": 0, "fb": ["One iron atom is still iron; anything smaller is not iron.", "A speck you can see holds a huge number of iron atoms.", "Iron stops at the atom: one atom is the smallest piece."], "why": "Iron is made of iron atoms.<br>One iron atom is still iron.<br>Anything smaller than one atom is not iron, so one atom is the smallest piece."}, {"type": "mcq", "tag": "fluency", "stem": "Is one atom of gold still gold?", "options": ["yes, still gold", "no, not gold anymore"], "key": 0, "fb": ["One gold atom is the smallest piece that is still gold.", "One atom is still gold; only a piece smaller than an atom is not."], "why": "Gold is made of gold atoms.<br>One gold atom is the smallest piece that is still gold.<br>So one atom of gold is still gold."}, {"type": "mcq", "tag": "fluency", "stem": "Are a hundred gold atoms together still gold?", "options": ["yes, still gold", "no, not gold anymore"], "key": 0, "fb": ["A hundred gold atoms are a tiny piece of gold, still gold.", "Each of the hundred atoms is gold, so together they are still gold."], "why": "Each gold atom is gold.<br>A hundred gold atoms together are a tiny piece of gold.<br>So the piece is still gold."}, {"type": "mcq", "tag": "fluency", "stem": "Is a piece smaller than one gold atom still gold?", "options": ["yes, still gold", "no, not gold anymore"], "key": 1, "fb": ["Gold stops at the atom: a piece smaller than one atom is not gold.", "The smallest piece of gold is one atom; anything smaller is not gold."], "why": "The smallest piece of gold that is still gold is one gold atom.<br>The piece is smaller than one atom.<br>So the piece is not gold anymore."}, {"type": "mcq", "tag": "fluency", "stem": "Is a piece smaller than one silver atom still silver?", "options": ["yes, still silver", "no, not silver anymore"], "key": 1, "fb": ["Silver stops at the atom: a piece smaller than one atom is not silver.", "The smallest piece of silver is one atom; anything smaller is not silver."], "why": "The smallest piece of silver that is still silver is one silver atom.<br>The piece is smaller than one atom.<br>So the piece is not silver anymore."}, {"type": "mcq", "tag": "fluency", "stem": "Is one atom of silver still silver?", "options": ["yes, still silver", "no, not silver anymore"], "key": 0, "fb": ["One silver atom is the smallest piece that is still silver.", "One atom is still silver; only a piece smaller than an atom is not."], "why": "Silver is made of silver atoms.<br>One silver atom is the smallest piece that is still silver.<br>So one atom of silver is still silver."}, {"type": "mcq", "tag": "fluency", "stem": "Is a whole silver bracelet, made of a huge number of silver atoms, still silver?", "options": ["yes, still silver", "no, not silver anymore"], "key": 0, "fb": ["Every atom in the bracelet is a silver atom, so the bracelet is silver.", "A huge number of silver atoms together are still silver."], "why": "Every atom in the bracelet is a silver atom.<br>Silver atoms together are silver.<br>So the whole bracelet is still silver."}, {"type": "mcq", "tag": "fluency", "stem": "Is one atom of iron still iron?", "options": ["yes, still iron", "no, not iron anymore"], "key": 0, "fb": ["One iron atom is the smallest piece that is still iron.", "One atom is still iron; only a piece smaller than an atom is not."], "why": "Iron is made of iron atoms.<br>One iron atom is the smallest piece that is still iron.<br>So one atom of iron is still iron."}, {"type": "mcq", "tag": "fluency", "stem": "Is half of one iron atom still iron?", "options": ["yes, still iron", "no, not iron anymore"], "key": 1, "fb": ["Iron stops at the atom: half an atom is smaller than one atom, so it is not iron.", "Half of one atom is smaller than the smallest piece of iron, so it is not iron."], "why": "The smallest piece of iron that is still iron is one iron atom.<br>Half of one atom is smaller than one atom.<br>So half an iron atom is not iron anymore."}, {"type": "mcq", "tag": "misconception", "stem": "Nia says: \"Half of a gold atom is a smaller piece of gold, so it is still gold.\" Is Nia correct?", "options": ["yes", "no"], "key": 1, "fb": ["Gold stops at the atom. One gold atom is the smallest piece that is still gold, so half an atom is not gold.", "Gold stops at the atom. One gold atom is the smallest piece that is still gold, so half an atom is not gold."], "why": "The smallest piece of gold that is still gold is one gold atom.<br>Half of one atom is smaller than one atom.<br>So half a gold atom is not gold, and Nia is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video took one copper atom out of the kettle. Was that one atom still copper?", "options": ["yes, still copper", "no, not copper anymore"], "key": 0, "fb": ["One copper atom is the smallest piece that is still copper.", "Only a piece smaller than one atom is not copper."], "why": "One atom of copper is the smallest piece that is still copper.<br>The atom taken out was one whole atom.<br>So it was still copper."}]}, {"id": "L03", "atom": "MAT-043", "title": "One kind of atom: an element", "video": "could do without a video", "lesson_type": "Classification lesson by example sequence (one kind of atom, or not), each case a particle drawing on the fixed glyph palette; coins the term element", "check_design": "Type (a) one-step categorisation → one recall MCQ (L02: a piece smaller than one silver atom), the coined term (typed, then a meaning MCQ), then a fluency quiz: element or not ×8, every case a drawn box (single gray; dark pairs; open and dark singles; open-and-two-dark groups; open pairs; gray and open singles; gray-between-two-open groups; dark singles), keys e e n n e n n e (no run of four alternating), then one student-claim item (Rohan: joined pairs of one kind are still an element; key YES — the topic's one true named claim). 12 items.", "headache": ["Here are three drawings of three materials, zoomed in on their atoms.", "In drawing 1 every atom is the same size and shade.", "In drawing 2 the atoms sit in pairs, but every atom is still the same kind.", "In drawing 3 there are two kinds of atom.", "Which drawings show a material made of only one kind of atom?"], "forest": ["What do you call a substance made of only one kind of atom?", "Look at the atoms: are they all the same kind?", "A substance made of only one kind of atom is called an element.", "Drawings 1 and 2 show elements.", "Drawing 3 does not."], "article": [{"t": "idea", "text": "Here are three drawings of three materials, zoomed in on their atoms."}, {"t": "fig", "key": "three_drawings_l03", "cap": "Three drawings, zoomed in on the atoms. Each size and shade of circle is a different kind of atom, and touching circles are joined."}, {"t": "idea", "text": "In drawing 1 every atom is the same size and shade."}, {"t": "idea", "text": "In drawing 2 the atoms sit in pairs, but every atom is still the same kind."}, {"t": "idea", "text": "In drawing 3 there are two kinds of atom."}, {"t": "idea", "text": "Which drawings show a material made of only one kind of atom?"}, {"t": "h", "text": "Atoms, again"}, {"t": "idea", "text": "Every material is made of atoms."}, {"t": "idea", "text": "Each size and shade of circle is a different kind of atom."}, {"t": "idea", "text": "Touching circles are atoms joined together."}, {"t": "h", "text": "Count the kinds of atom"}, {"t": "idea", "text": "Look at drawing 1: every atom is a gray circle."}, {"t": "idea", "text": "Drawing 1 shows one kind of atom."}, {"t": "idea", "text": "Look at drawing 2: every atom is a large open circle, and the atoms sit in joined pairs."}, {"t": "idea", "text": "Joined or not, drawing 2 shows one kind of atom."}, {"t": "idea", "text": "Look at drawing 3: large open circles and small dark circles."}, {"t": "idea", "text": "Drawing 3 shows two kinds of atom."}, {"t": "h", "text": "A name for one kind of atom"}, {"t": "idea", "text": "A substance made of only one kind of atom is called an <b>element<\/b>."}, {"t": "idea", "text": "Drawing 1 shows an element, and so does drawing 2."}, {"t": "idea", "text": "Drawing 3 does not show an element: it has two kinds of atom."}, {"t": "idea", "text": "Whether the atoms are single or joined in pairs makes no difference: one kind of atom makes an element."}, {"t": "idea", "text": "The smallest piece of an element is one atom."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider two more drawings."}, {"t": "idea", "text": "Drawing 4 shows small dark circles only: one kind of atom, so an element."}, {"t": "idea", "text": "Drawing 5 shows gray circles and large open circles, not joined: two kinds, so not an element."}, {"t": "fig", "key": "element_seq", "cap": "Five drawings. The tick or cross answers one question: one kind of atom? One kind, single or in joined pairs: an element. Two kinds, joined or not: not an element."}, {"t": "h", "text": "Real elements"}, {"t": "idea", "text": "Now consider the oxygen in the air: every atom is an oxygen atom."}, {"t": "idea", "text": "The oxygen atoms come in joined pairs."}, {"t": "idea", "text": "Oxygen is an element."}, {"t": "idea", "text": "Now consider the carbon in charcoal: every atom is a carbon atom."}, {"t": "idea", "text": "Carbon is an element."}, {"t": "idea", "text": "Now consider carbon dioxide, the gas you breathe out: carbon atoms and oxygen atoms, joined."}, {"t": "idea", "text": "Two kinds of atom, so carbon dioxide is not an element."}, {"t": "idea", "text": "Gold, silver, copper, iron and aluminum are elements too: one kind of atom each."}, {"t": "fig", "key": "named_elements_l03", "cap": "Three named substances under the question: one kind of atom? Oxygen (large open circles, in pairs) and carbon (gray circles) are elements. Carbon dioxide (a gray circle joined between two large open circles) is not: two kinds of atom."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A substance made of only one kind of atom is called an element. Count the kinds of atom: one kind, single or joined, makes an element; two or more kinds do not."}, {"t": "idea", "text": "Back to the three drawings: drawings 1 and 2 each show one kind of atom, so each shows an element."}, {"t": "idea", "text": "Drawing 3 shows two kinds of atom, so it does not show an element."}], "script": [{"say": "Here are three drawings of three materials.", "screen": "[three boxes: gray singles; large open pairs; large-open-and-two-dark groups; the key beside them]"}, {"say": "In drawing 1 every atom is the same size and shade.", "screen": "[drawing 1 highlighted]"}, {"say": "In drawing 2 the atoms sit in pairs, but every atom is still the same kind.", "screen": "[drawing 2 highlighted]"}, {"say": "In drawing 3 there are two kinds of atom. Which drawings show only one kind of atom?", "screen": "[drawing 3 highlighted; question mark]"}, {"say": "Count the kinds of atom in each drawing.", "screen": "[labels appear one by one: ONE KIND, ONE KIND, TWO KINDS]"}, {"say": "A substance made of only one kind of atom is called an element.", "screen": "[chip: ELEMENT]"}, {"say": "Drawings 1 and 2 show elements; drawing 3 does not.", "screen": "[ticks on 1 and 2 under ONE KIND OF ATOM?; cross on 3]"}, {"say": "Drawing 4, small dark circles only, is an element.", "screen": "[drawing 4, tick]"}, {"say": "Drawing 5, two kinds not joined, is not.", "screen": "[drawing 5, cross]"}, {"say": "The oxygen in the air is an element: every atom is an oxygen atom, in joined pairs.", "screen": "[box: OXYGEN, open pairs; tick]"}, {"say": "The carbon in charcoal is an element: every atom is a carbon atom.", "screen": "[box: CARBON, gray singles; tick]"}, {"say": "Carbon dioxide has carbon atoms and oxygen atoms joined: two kinds, so not an element.", "screen": "[box: CARBON DIOXIDE, gray between two open; cross]"}, {"say": "So here is the rule: one kind of atom, single or joined, makes an element; two or more kinds do not.", "screen": "[rule slide reuses drawings 2 and 3; rule text]"}, {"say": "Back to the three drawings: drawings 1 and 2 show elements, and drawing 3 does not.", "screen": "[the three drawings with their verdicts]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A piece smaller than one silver atom. Is it still silver?", "options": ["yes", "no"], "key": 1, "fb": ["Silver stops at the atom: one silver atom is the smallest piece that is still silver.", "The smallest piece of silver is one atom, so a smaller piece is not silver."], "why": "The smallest piece of silver that is still silver is one silver atom.<br>The piece is smaller than one atom.<br>So the piece is not silver."}, {"type": "text", "tag": "term", "stem": "A substance made of only one kind of atom is called an…", "accept": ["element", "an element"], "why": "A substance made of only one kind of atom is called an element."}, {"type": "mcq", "tag": "term", "stem": "A scientist calls a substance an element. What does she mean?", "options": ["Its atoms are not joined to each other.", "Every atom in it is the same kind.", "It is a metal."], "key": 1, "fb": ["Joined or single makes no difference; the oxygen in the air is an element with its atoms in pairs.", "Count the kinds of atom: one kind makes an element.", "Oxygen and carbon are elements, and neither is a metal."], "why": "A substance made of only one kind of atom is called an element.<br>Whether the atoms are single or joined makes no difference.<br>Some elements are metals, and some, such as oxygen, are not."}, {"type": "mcq", "tag": "fluency", "fig": "e_f1", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show an element?", "options": ["yes, an element", "no, not an element"], "key": 0, "fb": ["Every circle is the same gray circle: one kind of atom.", "Every atom is the same kind, so the drawing shows an element."], "why": "Count the kinds of atom.<br>Every circle is a gray circle of the same size: one kind.<br>One kind of atom makes an elemen y atom is the same kind."], "why": "Count the kinds of atom.<br>Every circle is a large open circle: one kind, joined in pairs.<br>One kind of atom makes an element."}, {"type": "mcq", "tag": "fluency", "fig": "e_f6", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show an element?", "options": ["yes, an element", "no, not an element"], "key": 1, "fb": ["Gray circles and large open circles are two kinds of atom.", "Two kinds of atom, so the drawing does not show an element."], "why": "Count the kinds of atom.<br>Gray circles and large open circles are two kinds, not joined.<br>Two kinds of atom do not make an element."}, {"type": "mcq", "tag": "fluency", "fig": "e_f8", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show an element?", "options": ["yes, an element", "no, not an element"], "key": 1, "fb": ["Each group holds a gray circle and large open circles: two kinds of atom.", "Two kinds of atom, joined, do not make an element."], "why": "Count the kinds of atom.<br>Each group holds a gray circle joined between two large open circles: two kinds.<br>Two kinds of atom do not make an element."}, {"type": "mcq", "tag": "fluency", "fig": "e_f7", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show an element?", "options": ["yes, an element", "no, not an element"], "key": 0, "fb": ["Every circle is a small dark circle: one kind of atom.", "Every atom is the same kind, so the drawing shows an element."], "why": "Count the kinds of atom.<br>Every circle is a small dark circle: one kind.<br>One kind of atom makes an element."}, {"type": "mcq", "tag": "misconception", "fig": "e_claim", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Rohan says: \"Every atom here is the same kind, so this is an element, even though the atoms are joined in pairs.\" Is Rohan correct?", "options": ["yes", "no"], "key": 0, "fb": ["One kind of atom makes an element, whether the atoms are single or joined in pairs.", "One kind of atom makes an element, whether the atoms are single or joined in pairs."], "why": "Count the kinds of atom: every circle is a gray circle, one kind.<br>Joined or single makes no difference to the count.<br>One kind of atom makes an element, so Rohan is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In drawing 2 every atom was the same kind, joined in pairs. Did drawing 2 show an element?", "options": ["yes", "no"], "key": 0, "fb": ["One kind of atom makes an element, joined in pairs or not.", "Joined or single makes no difference: one kind of atom makes an element."], "why": "A substance made of only one kind of atom is called an element.<br>Drawing 2 showed one kind of atom, in joined pairs.<br>So drawing 2 showed an element."}]}, {"id": "L04", "atom": "MAT-044", "title": "Atoms joined together: a molecule", "video": "definitely a video", "lesson_type": "Classification lesson by example sequence (joined atoms, or not), each case a particle drawing; coins the term molecule", "check_design": "Type (a) one-step categorisation → one recall MCQ (L03: neon gas, one kind of atom, is an element), the coined term (typed, then a meaning MCQ), then a fluency quiz: does this drawing show molecules? yes / no ×8, every case a drawn box, keys y y n n y y n y (no run of four alternating; S25 reorder 25 Sep 2026), then one student-claim item (Imani: two atoms of the same kind cannot be a molecule; key no). 12 items.", "headache": ["Two drawings show the same kind of atom.", "In drawing 1 the atoms float singly, each on its own.", "In drawing 2 the atoms sit in pairs, touching, and each pair moves together.", "Why does each pair in drawing 2 move as one?"], "forest": ["What is a group of atoms that move together?", "In drawing 2 each pair of atoms is joined.", "Two or more atoms joined together make one particle called a molecule.", "The joined atoms move as one particle.", "Single atoms, not joined, are not molecules."], "article": [{"t": "idea", "text": "Two drawings show the same kind of atom."}, {"t": "fig", "key": "singles_pairs", "cap": "Two drawings of the same kind of atom. Drawing 1: single atoms, none touching. Drawing 2: atoms in pairs, touching."}, {"t": "idea", "text": "In drawing 1 the atoms float singly, each on its own."}, {"t": "idea", "text": "In drawing 2 the atoms sit in pairs, touching, and each pair moves together."}, {"t": "idea", "text": "Why does each pair in drawing 2 move as one?"}, {"t": "h", "text": "Atoms, again"}, {"t": "idea", "text": "Every material is made of atoms."}, {"t": "idea", "text": "Atoms that are joined together are drawn touching."}, {"t": "h", "text": "Look at drawing 2"}, {"t": "idea", "text": "In drawing 2, each pair of atoms is joined."}, {"t": "idea", "text": "The two joined atoms move together as one particle."}, {"t": "idea", "text": "In drawing 1, each atom moves on its own."}, {"t": "h", "text": "A name for joined atoms"}, {"t": "idea", "text": "Two or more atoms joined together make one particle called a <b>molecule<\/b>."}, {"t": "idea", "text": "Each pair in drawing 2 is a molecule."}, {"t": "idea", "text": "The single atoms in drawing 1 are not molecules."}, {"t": "idea", "text": "A molecule can hold atoms of one kind, or atoms of different kinds."}, {"t": "h", "text": "Two real molecules"}, {"t": "idea", "text": "Now consider the oxygen in the air: it comes as molecules of two oxygen atoms joined."}, {"t": "idea", "text": "Now consider water: a water molecule is one oxygen atom joined to two hydrogen atoms."}, {"t": "idea", "text": "Both are molecules, because in both the atoms are joined."}, {"t": "fig", "key": "named_molecules_l04", "cap": "An oxygen molecule: two oxygen atoms joined. A water molecule: one oxygen atom joined to two hydrogen atoms."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider five drawings."}, {"t": "idea", "text": "Pairs of one kind, touching, are molecules."}, {"t": "idea", "text": "Groups of three atoms of two kinds, touching, are molecules."}, {"t": "idea", "text": "Single atoms, none touching, are not molecules."}, {"t": "idea", "text": "Pairs of two kinds, touching, are molecules."}, {"t": "idea", "text": "Two kinds of single atom, none touching, are not molecules."}, {"t": "fig", "key": "molecule_seq", "cap": "Five drawings. The tick or cross answers one question: joined atoms? Touching circles are joined atoms, so the drawing shows molecules. Circles apart are single atoms, not molecules."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Two or more atoms joined together make one particle called a molecule. Joined atoms are drawn touching. Single atoms, not joined, are not molecules."}, {"t": "idea", "text": "Back to the two drawings: in drawing 2 each pair of atoms is joined, so each pair is a molecule."}, {"t": "idea", "text": "In drawing 1 the atoms are single, so they are not molecules."}], "script": [{"say": "Two drawings show the same kind of atom.", "screen": "[two boxes of large open circles]"}, {"say": "In drawing 1 each atom floats on its own.", "screen": "[drawing 1: single circles drift apart]"}, {"say": "In drawing 2 the atoms sit in pairs, touching, and each pair moves together.", "screen": "[drawing 2: pairs drift as units]"}, {"say": "Why does each pair in drawing 2 move as one?", "screen": "[question mark over drawing 2]"}, {"say": "Atoms that are joined together are drawn touching.", "screen": "[a pair touching; label JOINED]"}, {"say": "In drawing 2 each pair is joined, so the two atoms move as one particle.", "screen": "[one pair highlighted, moving as one]"}, {"say": "Two or more atoms joined together make one particle called a molecule.", "screen": "[chip: MOLECULE]"}, {"say": "Each pair in drawing 2 is a molecule; the single atoms in drawing 1 are not.", "screen": "[tick on drawing 2 under JOINED ATOMS?; cross on drawing 1]"}, {"say": "A molecule can hold atoms of one kind, or atoms of different kinds.", "screen": "[a pair of one kind; a group of two kinds]"}, {"say": "The oxygen in the air comes as molecules of two oxygen atoms joined.", "screen": "[zoomed oxygen molecule, atoms labeled]"}, {"say": "A water molecule is one oxygen atom joined to two hydrogen atoms.", "screen": "[zoomed water molecule, atoms labeled]"}, {"say": "Pairs of one kind, touching, are molecules.", "screen": "[a box of pairs, tick under JOINED ATOMS?]"}, {"say": "Single atoms apart are not molecules.", "screen": "[a box of singles, cross]"}, {"say": "Pairs of two kinds, touching, are molecules.", "screen": "[a box of two-kind pairs, tick]"}, {"say": "Two kinds of single atom apart are not molecules.", "screen": "[a box of two kinds apart, cross]"}, {"say": "So here is the rule: atoms joined together make a molecule; single atoms are not.", "screen": "[rule slide reuses drawings 1 and 2; rule text]"}, {"say": "Back to the two drawings: the pairs in drawing 2 are molecules, and the single atoms in drawing 1 are not.", "screen": "[drawing 2 tick; drawing 1 cross]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Neon gas: every atom in it is a neon atom. Is neon an element?", "options": ["yes", "no"], "key": 0, "fb": ["One kind of atom makes an element.", "Every atom is a neon atom: one kind, so neon is an element."], "why": "A substance made of only one kind of atom is called an element.<br>Every atom in neon is a neon atom.<br>So neon is an element."}, {"type": "text", "tag": "term", "stem": "Two or more atoms joined together make one particle called a…", "accept": ["molecule", "a molecule"], "why": "Two or more atoms joined together make one particle called a molecule."}, {"type": "mcq", "tag": "term", "stem": "What is a molecule?", "options": ["two or more atoms joined together, moving as one particle", "a single atom moving on its own", "two atoms of different kinds that are near each other but not joined"], "key": 0, "fb": ["Joined atoms move together as one particle: a molecule.", "A single atom is not a molecule; a molecule needs two or more atoms joined.", "Near is not joined. Atoms that are not joined are not a molecule."], "why": "Two or more atoms joined together make one particle called a molecule.<br>A single atom is not a molecule.<br>Atoms that are near but not joined are not a molecule either."}, {"type": "mcq", "tag": "fluency", "fig": "m_f1", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 0, "fb": ["The large open circles touch in pairs: joined atoms, so molecules.", "Touching circles are joined atoms, and joined atoms make a molecule."], "why": "Look for touching circles.<br>The large open circles touch in pairs, so the atoms are joined.<br>Joined atoms make molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f2", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 0, "fb": ["Each large open circle touches two small dark circles: three joined atoms, a molecule.", "Touching circles are joined atoms, and joined atoms make a molecule."], "why": "Look for touching circles.<br>Each large open circle touches two small dark circles, so the three atoms are joined.<br>Joined atoms make molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f3", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 1, "fb": ["No circle touches another: single atoms, not joined.", "Every gray circle is apart from the others, so no atoms are joined."], "why": "Look for touching circles.<br>No circle touches another, so the atoms are not joined.<br>Single atoms are not molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f5", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 1, "fb": ["Two kinds of atom are mingled, but no circle touches another.", "Two kinds of single atom, none joined, are not molecules."], "why": "Look for touching circles.<br>Small dark circles and large open circles are mingled, but none touch.<br>Atoms that are not joined are not molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f4", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 0, "fb": ["Each small dark circle touches a gray circle: two joined atoms, a molecule.", "Touching circles are joined atoms, and joined atoms make a molecule."], "why": "Look for touching circles.<br>Each small dark circle touches a gray circle, so the two atoms are joined.<br>Joined atoms make molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f7", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 0, "fb": ["Each gray circle touches two large open circles: three joined atoms, a molecule.", "Touching circles are joined atoms, and joined atoms make a molecule."], "why": "Look for touching circles.<br>Each gray circle touches two large open circles, so the three atoms are joined.<br>Joined atoms make molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f6", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 1, "fb": ["No circle touches another: single atoms, not joined.", "Every small dark circle is apart from the others, so no atoms are joined."], "why": "Look for touching circles.<br>No circle touches another, so the atoms are not joined.<br>Single atoms are not molecules."}, {"type": "mcq", "tag": "fluency", "fig": "m_f8", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show molecules?", "options": ["yes, molecules", "no, not molecules"], "key": 0, "fb": ["The gray circles touch in pairs: joined atoms, so molecules.", "Touching circles are joined atoms, and joined atoms make a molecule."], "why": "Look for touching circles.<br>The gray circles touch in pairs, so the atoms are joined.<br>Joined atoms make molecules."}, {"type": "mcq", "tag": "misconception", "fig": "m_claim", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Imani points at one pair and says: \"These two touching atoms are the same kind, so they cannot be a molecule.\" Is Imani correct?", "options": ["yes", "no"], "key": 1, "fb": ["Any two or more atoms joined together make a molecule, the same kind or different kinds.", "Any two or more atoms joined together make a molecule, the same kind or different kinds."], "why": "Two or more atoms joined together make one particle called a molecule.<br>The two small dark circles touch, so the atoms are joined.<br>A molecule can hold atoms of one kind, so the pair is a molecule, and Imani is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In drawing 2 the atoms sat in touching pairs and each pair moved as one. What did the video call each pair?", "options": ["a single atom", "a molecule", "an element"], "key": 1, "fb": ["A pair is two atoms joined, not a single atom.", "Two or more atoms joined together make one particle called a molecule.", "Element names a substance with one kind of atom; a joined pair is a molecule."], "why": "Two or more atoms joined together make one particle called a molecule.<br>Each pair in drawing 2 was two atoms joined.<br>So each pair is a molecule."}]}, {"id": "L05", "atom": "MAT-045", "title": "Different atoms joined in a fixed pattern: a compound", "video": "could do without a video", "lesson_type": "Classification lesson by example sequence (a compound, or not), each case a particle drawing; coins the term compound", "check_design": "Type (a) one-step categorisation → two recall MCQs (L03: copper foil is an element; L04: single atoms apart are not molecules), the coined term (typed, then a meaning MCQ), then a fluency quiz: does this drawing show a compound? yes / no ×8, every case a drawn box, keys y y n y y n n n (no run of four alternating), then one student-claim item (Ethan: any drawing with two kinds of atom shows a compound; key no). 13 items.", "headache": ["Water is made of two kinds of atom.", "Every water molecule has the same pattern: one oxygen atom joined to two hydrogen atoms.", "Any water molecule anywhere in the world has the same pattern.", "Is water an element? If not, what is it?"], "forest": ["What do you call a substance whose particles are two or more kinds of atom joined in a fixed pattern?", "Water is not an element, because it has two kinds of atom.", "Its atoms are joined, in the same pattern every time.", "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound.", "Water is a compound."], "article": [{"t": "idea", "text": "Water is made of two kinds of atom."}, {"t": "idea", "text": "Every water molecule has the same pattern: one oxygen atom joined to two hydrogen atoms."}, {"t": "fig", "key": "water_pattern", "cap": "Three water molecules, turned different ways. Each one is one oxygen atom joined to two hydrogen atoms: the same pattern every time."}, {"t": "idea", "text": "Any water molecule anywhere in the world has the same pattern."}, {"t": "idea", "text": "Is water an element? If not, what is it?"}, {"t": "h", "text": "Element and molecule, again"}, {"t": "idea", "text": "A substance made of only one kind of atom is called an element."}, {"t": "idea", "text": "Two or more atoms joined together make one particle called a molecule."}, {"t": "idea", "text": "Water has two kinds of atom, so water is not an element."}, {"t": "h", "text": "Joined, in a fixed pattern"}, {"t": "idea", "text": "In water, the two kinds of atom are joined into molecules."}, {"t": "idea", "text": "Every water molecule has the same pattern: one oxygen atom, two hydrogen atoms."}, {"t": "idea", "text": "The pattern never changes."}, {"t": "h", "text": "A name for kinds joined in a fixed pattern"}, {"t": "idea", "text": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a <b>compound<\/b>."}, {"t": "idea", "text": "Water is a compound."}, {"t": "idea", "text": "Now consider carbon dioxide: one carbon atom joined to two oxygen atoms, the same in every molecule."}, {"t": "idea", "text": "Carbon dioxide is a compound."}, {"t": "fig", "key": "co2_box", "cap": "Carbon dioxide, zoomed in, with its verdict drawn: a compound? Every molecule is a gray circle (carbon) joined between two large open circles (oxygen): two kinds, joined, the same pattern every time."}, {"t": "h", "text": "Not a compound"}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a mixture."}, {"t": "idea", "text": "Two kinds of atom that are not joined make a mixture, not a compound."}, {"t": "idea", "text": "One kind of atom, single or joined, makes an element, not a compound."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider four drawings."}, {"t": "idea", "text": "Two kinds of atom, joined in the same pattern every time, make a compound."}, {"t": "idea", "text": "Three kinds of atom, joined in the same pattern every time, make a compound."}, {"t": "idea", "text": "One kind of atom, joined in pairs, makes an element, not a compound."}, {"t": "idea", "text": "Two kinds of atom, not joined, make a mixture, not a compound."}, {"t": "fig", "key": "compound_seq", "cap": "Four drawings. The tick or cross answers one question: a compound? Different kinds of atom joined in one fixed pattern: a compound. One kind joined: an element. Kinds not joined: a mixture."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound. Kinds that are not joined make a mixture; one kind of atom makes an element."}, {"t": "idea", "text": "Back to water: two kinds of atom, joined, in the same pattern every time."}, {"t": "idea", "text": "So water is not an element; water is a compound."}], "script": [{"say": "Water is made of two kinds of atom.", "screen": "[a glass of water; a zoom circle]"}, {"say": "Every water molecule has the same pattern: one oxygen atom joined to two hydrogen atoms.", "screen": "[three water molecules, atoms labeled]"}, {"say": "Pick any water molecule anywhere in the world, and the pattern is the same.", "screen": "[a globe; the molecule repeated]"}, {"say": "Is water an element? If not, what is it?", "screen": "[question mark]"}, {"say": "A substance made of only one kind of atom is an element, and water has two kinds.", "screen": "[chip: TWO KINDS OF ATOM; cross under ELEMENT?]"}, {"say": "So water is not an element.", "screen": "[NOT AN ELEMENT]"}, {"say": "In water, the two kinds of atom are joined into molecules, and the pattern never changes.", "screen": "[the molecule; label ONE PATTERN]"}, {"say": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound.", "screen": "[chip: COMPOUND]"}, {"say": "Water is a compound.", "screen": "[tick under A COMPOUND?]"}, {"say": "Carbon dioxide is a compound too: one carbon atom joined to two oxygen atoms, the same in every molecule.", "screen": "[box: gray between two open, nine alike; tick]"}, {"say": "Two kinds of atom that are not joined make a mixture, not a compound.", "screen": "[box: two kinds of single atom apart; cross]"}, {"say": "One kind of atom, single or joined, makes an element, not a compound.", "screen": "[box: pairs of one kind; cross]"}, {"say": "So here is the rule: different kinds of atom, joined, in a fixed pattern, make a compound.", "screen": "[rule slide reuses the water box and the mixture box; rule text]"}, {"say": "Back to water: two kinds of atom, joined, in the same pattern every time, so water is a compound.", "screen": "[the glass; the molecule; A COMPOUND]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Copper foil: every atom in it is a copper atom. Is copper an element?", "options": ["yes", "no"], "key": 0, "fb": ["One kind of atom makes an element.", "Every atom is a copper atom: one kind, so copper is an element."], "why": "A substance made of only one kind of atom is called an element.<br>Every atom in the foil is a copper atom.<br>So copper is an element."}, {"type": "mcq", "tag": "recall", "stem": "A drawing shows single atoms, none touching. Does it show molecules?", "options": ["yes", "no"], "key": 1, "fb": ["A molecule needs two or more atoms joined; these atoms are not joined.", "No atoms are joined, so there are no molecules."], "why": "Two or more atoms joined together make a molecule.<br>The atoms in the drawing are single and not joined.<br>So the drawing shows no molecules."}, {"type": "text", "tag": "term", "stem": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a…", "accept": ["compound", "a compound"], "why": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."}, {"type": "mcq", "tag": "term", "stem": "A scientist calls a substance a compound. What does she mean?", "options": ["Two kinds of atom are mingled through it but not joined to each other.", "Its particles are two or more kinds of atom joined in one fixed pattern.", "Its atoms are all one kind, joined in pairs."], "key": 1, "fb": ["Kinds mingled but not joined make a mixture, not a compound.", "Different kinds of atom, joined, in a fixed pattern: a compound.", "One kind of atom, joined or not, makes an element."], "why": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound.<br>Kinds not joined make a mixture.<br>One kind of atom makes an element."}, {"type": "mcq", "tag": "fluency", "fig": "c_f1", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 0, "fb": ["Two kinds of atom, joined, and every group has the same pattern: a compound.", "Every group is a large open circle joined to two small dark circles: two kinds, joined, one pattern."], "why": "Count the kinds: large open and small dark, two kinds.<br>The circles touch, so the kinds are joined, and every group has the same pattern.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f2", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 0, "fb": ["Two kinds of atom, joined, and every group has the same pattern: a compound.", "Every group is a gray circle joined between two large open circles: two kinds, joined, one pattern."], "why": "Count the kinds: gray and large open, two kinds.<br>The circles touch, so the kinds are joined, and every group has the same pattern.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f3", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 1, "fb": ["Every atom is a large open circle: one kind, so an element, not a compound.", "One kind of atom, even joined in pairs, makes an element."], "why": "Count the kinds: every circle is a large open circle, one kind.<br>One kind of atom makes an element.<br>A compound needs two or more kinds, so this is not a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f4", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 0, "fb": ["Three kinds of atom, joined, and every group has the same pattern: a compound.", "Every group is a gray, a large open and a small dark circle joined: three kinds, one pattern."], "why": "Count the kinds: gray, large open and small dark, three kinds.<br>The circles touch, so the kinds are joined, and every group has the same pattern.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f7", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 0, "fb": ["Two kinds of atom, joined, and every pair has the same pattern: a compound.", "Every pair is a small dark circle joined to a gray circle: two kinds, joined, one pattern."], "why": "Count the kinds: small dark and gray, two kinds.<br>The circles touch, so the kinds are joined, and every pair has the same pattern.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f5", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 1, "fb": ["Two kinds of atom, but none touch: not joined, so a mixture, not a compound.", "Large open and gray circles are mingled, not joined: a mixture."], "why": "Count the kinds: large open and gray, two kinds.<br>No circle touches another, so the kinds are not joined.<br>Kinds that are not joined make a mixture, not a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f6", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 1, "fb": ["Each pair is one kind of atom only.<br>The two kinds of pair never touch, so they are not joined: a mixture.", "The large open pairs and the small dark pairs never touch each other: two substances mingled, a mixture."], "why": "Count the kinds: large open and small dark, two kinds.<br>Each pair holds one kind only, and the two kinds of pair do not touch each other.<br>Kinds that are not joined to each other make a mixture, not a compound."}, {"type": "mcq", "tag": "fluency", "fig": "c_f8", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Does this drawing show a compound?", "options": ["yes, a compound", "no, not a compound"], "key": 1, "fb": ["Every atom is a small dark circle: one kind, so an element, not a compound.", "One kind of atom, even joined in pairs, makes an element."], "why": "Count the kinds: every circle is a small dark circle, one kind.<br>One kind of atom makes an element.<br>A compound needs two or more kinds, so this is not a compound."}, {"type": "mcq", "tag": "misconception", "fig": "c_claim", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Ethan says: \"This drawing has two kinds of atom, so it must show a compound.\" Is Ethan correct?", "options": ["yes", "no"], "key": 1, "fb": ["Two kinds of atom make a compound only when they are joined in a fixed pattern. Here no circles touch, so the drawing shows a mixture.", "Two kinds of atom make a compound only when they are joined in a fixed pattern. Here no circles touch, so the drawing shows a mixture."], "why": "A compound needs two or more kinds of atom joined together in a fixed pattern.<br>The gray circles and small dark circles here do not touch, so the kinds are not joined.<br>Kinds not joined make a mixture, so Ethan is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Water has two kinds of atom, joined in the same pattern in every molecule. What did the video call water?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["An element has one kind of atom; water has two.", "Different kinds of atom joined in a fixed pattern make a compound.", "In a mixture the kinds are not joined; in water they are."], "why": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound.<br>Water has oxygen and hydrogen atoms joined in one pattern.<br>So water is a compound."}]}, {"id": "L06", "atom": "MAT-046", "title": "Element, compound or mixture from a drawing", "video": "could do without a video", "lesson_type": "Procedural lesson (a two-question routine) walked on four unlabeled drawings; no term coined", "check_design": "Type (b) multi-step routine → two recall MCQs (L05: a compound from a description; Topic 5: a mixture from a description), the worked walk on the page (four drawings) → three step items on a fresh drawing (gray joined to two small dark: question 1; question 2; the category — a scaffolded chain, each step its own item) → a fluency quiz of eight bare three-way sorts, every case a drawn box, keys e c m m e c m c. 13 items.", "headache": ["Four particle drawings, no labels.", "Some show one kind of atom, and some show two.", "In some the atoms are joined; in some they float apart.", "Sort the four drawings with one question at a time."], "forest": ["How do you sort a particle drawing?", "First ask how many kinds of atom the drawing shows.", "One kind of atom makes an element.", "More than one kind: ask whether the different kinds are joined together.", "Joined kinds make a compound; unjoined kinds, just mingled, make a mixture."], "article": [{"t": "idea", "text": "Here are four particle drawings with no labels."}, {"t": "fig", "key": "four_drawings_l06", "cap": "The four drawings to sort. Each size and shade of circle is a different kind of atom, and touching circles are joined."}, {"t": "idea", "text": "Some show one kind of atom, and some show two."}, {"t": "idea", "text": "In some the atoms are joined; in some they float apart."}, {"t": "idea", "text": "Sort the four drawings with one question at a time."}, {"t": "h", "text": "The three categories"}, {"t": "idea", "text": "A substance made of only one kind of atom is called an element."}, {"t": "idea", "text": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a mixture."}, {"t": "idea", "text": "In a mixture the different kinds of particle are not joined to each other."}, {"t": "h", "text": "Question 1"}, {"t": "idea", "text": "Question 1: how many kinds of atom does the drawing show?"}, {"t": "idea", "text": "One kind: the drawing shows an element, and the sort is done."}, {"t": "idea", "text": "More than one kind: ask question 2."}, {"t": "h", "text": "Question 2"}, {"t": "idea", "text": "Question 2: are the different kinds of atom joined together?"}, {"t": "idea", "text": "Yes, joined in the same pattern every time: the drawing shows a compound."}, {"t": "idea", "text": "No, not joined, just mingled: the drawing shows a mixture."}, {"t": "idea", "text": "Sometimes some kinds are joined and another kind is not."}, {"t": "idea", "text": "Then the drawing holds more than one kind of particle, so it shows a mixture."}, {"t": "fig", "key": "sort_tree_two", "cap": "The two-question tree. Question 1 counts the kinds of atom: one kind is an element. Question 2 asks whether the different kinds are joined: joined is a compound, not joined is a mixture."}, {"t": "h", "text": "Walk the tree: drawing 1"}, {"t": "idea", "text": "Here is drawing 1: pairs of small dark circles."}, {"t": "idea", "text": "Question 1: every atom is a small dark circle, so one kind."}, {"t": "idea", "text": "So drawing 1 shows an element, and question 2 is not needed."}, {"t": "h", "text": "Walk the tree: drawing 2"}, {"t": "idea", "text": "Here is drawing 2: groups of one gray circle and two small dark circles."}, {"t": "idea", "text": "Question 1: drawing 2 shows gray and small dark circles, so two kinds."}, {"t": "idea", "text": "Question 2: the circles in each group touch, so the kinds are joined, in the same pattern every time."}, {"t": "idea", "text": "So drawing 2 shows a compound."}, {"t": "h", "text": "Walk the tree: drawings 3 and 4"}, {"t": "idea", "text": "Here is drawing 3: pairs of large open circles among single gray circles."}, {"t": "idea", "text": "Question 1: drawing 3 shows two kinds."}, {"t": "idea", "text": "Question 2: the open pairs never touch the gray circles, so the kinds are not joined."}, {"t": "idea", "text": "So drawing 3 shows a mixture."}, {"t": "idea", "text": "Here is drawing 4: pairs of one large open circle and one gray circle, touching."}, {"t": "idea", "text": "Question 1: drawing 4 shows two kinds."}, {"t": "idea", "text": "Question 2: the two circles in every pair touch, so the kinds are joined in one pattern."}, {"t": "idea", "text": "So drawing 4 shows a compound."}, {"t": "fig", "key": "walk_four_l06", "cap": "The four drawings sorted by the two questions. Drawing 1: one kind, an element. Drawings 2 and 4: two kinds, joined, compounds. Drawing 3: two kinds, not joined, a mixture."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To sort a particle drawing, ask two questions in order: how many kinds of atom are there? Are the different kinds joined together? One kind makes an element; kinds joined make a compound; kinds not joined make a mixture."}, {"t": "idea", "text": "Back to the four drawings: two questions, asked in order, sorted every one."}, {"t": "idea", "text": "Drawing 1 is an element, drawings 2 and 4 are compounds, and drawing 3 is a mixture."}], "script": [{"say": "Here are four particle drawings with no labels.", "screen": "[the four boxes, numbered]"}, {"say": "Some show one kind of atom, and some show two; in some the atoms are joined, and in some they float apart.", "screen": "[the boxes side by side]"}, {"say": "Sort the four drawings with one question at a time.", "screen": "[three empty category boxes: ELEMENT, COMPOUND, MIXTURE; question mark]"}, {"say": "Question 1: how many kinds of atom does the drawing show?", "screen": "[the tree: question 1 box]"}, {"say": "One kind means an element, and the sort is done; more than one kind means ask question 2.", "screen": "[arrows: ONE KIND → element; MORE THAN ONE → question 2]"}, {"say": "Question 2: are the different kinds of atom joined together?", "screen": "[question 2 box]"}, {"say": "Joined, in the same pattern every time, means a compound; not joined, just mingled, means a mixture.", "screen": "[arrows: YES → compound; NO → mixture; boxes under each]"}, {"say": "Drawing 1: pairs of small dark circles, one kind, so an element.", "screen": "[drawing 1 lands in ELEMENT]"}, {"say": "Drawing 2: gray and small dark, two kinds; the circles touch, so joined, so a compound.", "screen": "[drawing 2 moves through question 2 into COMPOUND]"}, {"say": "Drawing 3: open pairs among single gray circles, two kinds; they never touch, so not joined, so a mixture.", "screen": "[drawing 3 lands in MIXTURE]"}, {"say": "Drawing 4: one open and one gray circle touching, two kinds, joined, so a compound.", "screen": "[drawing 4 lands in COMPOUND]"}, {"say": "So here is the rule: ask two questions, in order.", "screen": "[rule slide reuses the tree; rule text]"}, {"say": "How many kinds of atom are there? Are the different kinds joined together?", "screen": "[question 1, then question 2 highlighted]"}, {"say": "Back to the four drawings: two questions, asked in order, sorted every one.", "screen": "[the four drawings in their categories]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Every molecule of a clear liquid holds one carbon atom joined to four hydrogen atoms and one oxygen atom, the same pattern every time. Which category is the liquid?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Three kinds of atom, so not one kind.", "Different kinds of atom, joined in one fixed pattern, make a compound.", "The kinds are joined into one molecule, not mingled."], "why": "The liquid holds three kinds of atom.<br>The kinds are joined together, in the same pattern every time.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "recall", "stem": "Cocoa powder is stirred into flour until the heap is one even brown. Is the heap a mixture?", "options": ["yes", "no"], "key": 0, "fb": ["Two substances mingled together, each still itself, make a mixture.", "Cocoa and flour are two substances mingled together, so the heap is a mixture."], "why": "A sample that contains two or more substances mingled together is called a mixture.<br>Cocoa and flour are two substances, and each keeps its own particles.<br>So the heap is a mixture."}, {"type": "mcq", "tag": "scaffold", "fig": "s_step", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Question 1: how many kinds of atom does this drawing show?", "options": ["one kind", "two kinds", "three kinds"], "key": 1, "fb": ["Look again: gray circles and small dark circles are two sizes and shades.", "Gray circles and small dark circles: two kinds of atom.", "Only two sizes and shades appear: gray, and small dark."], "why": "Question 1 counts the sizes and shades of circle.<br>The drawing has gray circles and small dark circles.<br>So the drawing shows two kinds of atom, and question 2 is needed."}, {"type": "mcq", "tag": "scaffold", "fig": "s_step", "stem": "The same drawing. Question 2: are the different kinds of atom joined together?", "options": ["yes", "no"], "key": 0, "fb": ["Each gray circle touches two small dark circles, so the kinds are joined.", "The circles touch in every group, and touching circles are joined."], "why": "Question 2 looks for touching circles of different kinds.<br>Each gray circle touches two small dark circles, in the same pattern every time.<br>So the different kinds are joined together."}, {"type": "mcq", "tag": "scaffold", "fig": "s_step", "stem": "The same drawing. So which category is it?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Two kinds of atom, so question 1 rules out an element.", "Two kinds, joined in one fixed pattern: a compound.", "The kinds are joined, so question 2 rules out a mixture."], "why": "Question 1: two kinds of atom, so not an element.<br>Question 2: the kinds are joined, in the same pattern every time.<br>Different kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "s_f1", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 0, "fb": ["Every circle is a gray circle: one kind of atom.", "One kind of atom, so question 1 ends the sort at element.", "One kind of atom, so question 1 ends the sort at element."], "why": "Question 1: every circle is a gray circle, so one kind of atom.<br>One kind of atom makes an element.<br>Question 2 is not needed."}, {"type": "mcq", "tag": "fluency", "fig": "s_f2", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Large open and small dark circles are two kinds of atom.", "Two kinds, and each large open circle touches two small dark ones: joined, one pattern.", "The circles touch in every group, so the kinds are joined, not just mingled."], "why": "Question 1: large open and small dark, two kinds of atom.<br>Question 2: each large open circle touches two small dark circles, the same pattern every time, so joined.<br>Kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "s_f3", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 2, "fb": ["Large open and small dark circles are two kinds of atom.", "No circle touches another, so the kinds are not joined.", "Two kinds of single atom, none touching: mingled, not joined."], "why": "Question 1: large open and small dark, two kinds of atom.<br>Question 2: no circle touches another, so the kinds are not joined.<br>Kinds not joined make a mixture."}, {"type": "mcq", "tag": "fluency", "fig": "s_f4", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 2, "fb": ["Large open and gray circles are two kinds of atom.", "The open pairs never touch the gray circles, so the two kinds are not joined to each other.", "Pairs of one kind among single atoms of another kind, never touching each other: a mixture."], "why": "Question 1: large open and gray, two kinds of atom.<br>Question 2: the open pairs never touch the gray circles, so the kinds are not joined to each other.<br>Kinds not joined make a mixture."}, {"type": "mcq", "tag": "fluency", "fig": "s_f5", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 0, "fb": ["Every circle is a large open circle, in joined pairs: one kind of atom.", "One kind of atom, even joined in pairs, makes an element.", "Only one kind of atom is here, so the drawing is not a mixture."], "why": "Question 1: every circle is a large open circle, so one kind of atom.<br>One kind of atom makes an element, joined in pairs or not.<br>Question 2 is not needed."}, {"type": "mcq", "tag": "fluency", "fig": "s_f6", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Gray and large open circles are two kinds of atom.", "Two kinds, and each gray circle touches two large open ones: joined, one pattern.", "The circles touch in every group, so the kinds are joined, not just mingled."], "why": "Question 1: gray and large open, two kinds of atom.<br>Question 2: each gray circle touches two large open circles, the same pattern every time, so joined.<br>Kinds joined in a fixed pattern make a compound."}, {"type": "mcq", "tag": "fluency", "fig": "s_f7", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 2, "fb": ["Three sizes and shades appear, so more than one kind of atom.", "The joined groups never touch the single gray circles, so not everything is joined into one pattern.", "Joined groups of two kinds among single atoms of a third kind, never touching each other: a mixture."], "why": "Question 1: large open, small dark and gray, three kinds of atom.<br>Question 2: the joined groups never touch the single gray circles, so the substances are not joined to each other.<br>Kinds not joined make a mixture."}, {"type": "mcq", "tag": "fluency", "fig": "s_f8", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Element, compound or mixture?", "options": ["an element", "a compound", "a mixture"], "key": 1, "fb": ["Small dark and gray circles are two kinds of atom.", "Two kinds, and each small dark circle touches a gray one: joined, one pattern.", "The circles touch in every pair, so the kinds are joined, not just mingled."], "why": "Question 1: small dark and gray, two kinds of atom.<br>Question 2: each small dark circle touches a gray circle, the same pattern every time, so joined.<br>Kinds joined in a fixed pattern make a compound."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Drawing 3 had two kinds of atom that never touched each other. Which category did it land in?", "options": ["an element", "a compound", "a mixture"], "key": 2, "fb": ["Two kinds of atom, so not an element.", "The kinds never touched, so they were not joined: not a compound.", "Two kinds of atom, not joined, make a mixture."], "why": "Question 1: two kinds of atom, so not an element.<br>Question 2: the kinds never touched, so not joined.<br>Kinds not joined make a mixture."}]}, {"id": "L07", "atom": "MAT-047", "title": "Sort any sample: the full tree", "video": "could do without a video", "lesson_type": "Procedural lesson (a two-step routine: the kind-of-matter question, then one of two second questions) walked on four bench samples; no term coined", "check_design": "Type (b) multi-step routine → two recall MCQs (Topic 5: a bowl of chili is not the same all through; L06: one kind of atom in pairs is an element), the worked walk on the page (four samples) → four step items on a fresh case (a lump of pure sulfur: question 1; which question next; one kind of atom?; the category) → a fluency quiz of eight bare four-way sorts on described samples (a helium balloon; a snowflake of pure water; rocky road ice cream; an iron horseshoe; mouthwash; rust; sterling silver; granite), keys e c he e ho c ho he. 14 items.", "headache": ["Four samples sit on a bench.", "They are a gold nugget, a block of dry ice, a steel fork, and beach sand with bits of shell.", "One sort splits any sample into pure substance or mixture.", "Another sort splits a pure substance into element or compound.", "How do the two sorts join into one tree, and where does each of the four samples go?"], "forest": ["How do you place any sample in one of four categories?", "First ask whether the sample holds more than one kind of matter.", "A mixture then asks: is it the same all the way through? Yes is homogeneous; no is heterogeneous.", "A pure substance then asks: does it have one kind of atom? Yes is an element; no is a compound.", "The gold nugget is an element, the dry ice a compound, the steel fork a homogeneous mixture, and the sand with shell a heterogeneous mixture."], "article": [{"t": "idea", "text": "Four samples sit on a bench."}, {"t": "idea", "text": "They are a gold nugget, a block of dry ice, a steel fork, and beach sand with bits of shell."}, {"t": "idea", "text": "One sort splits any sample into pure substance or mixture."}, {"t": "idea", "text": "Another sort splits a pure substance into element or compound."}, {"t": "idea", "text": "How do the two sorts join into one tree, and where does each of the four samples go?"}, {"t": "h", "text": "The four categories"}, {"t": "idea", "text": "A sample that contains only one kind of matter is called a pure substance."}, {"t": "idea", "text": "A sample that contains two or more substances mingled together is called a mixture."}, {"t": "idea", "text": "A mixture that is the same all the way through is homogeneous."}, {"t": "idea", "text": "A mixture that differs from place to place is heterogeneous."}, {"t": "idea", "text": "A pure substance with one kind of atom is an element."}, {"t": "idea", "text": "A pure substance with different kinds of atom joined in a fixed pattern is a compound."}, {"t": "h", "text": "Question 1"}, {"t": "idea", "text": "Question 1: is there more than one kind of matter?"}, {"t": "idea", "text": "No: the sample is a pure substance, so ask whether it has only one kind of atom."}, {"t": "idea", "text": "Yes: the sample is a mixture, so ask whether it is the same all the way through."}, {"t": "h", "text": "The second question depends on the first"}, {"t": "idea", "text": "For a pure substance: does it have only one kind of atom?"}, {"t": "idea", "text": "Yes means an element; no means a compound."}, {"t": "idea", "text": "For a mixture: is it the same all the way through?"}, {"t": "idea", "text": "Yes means a homogeneous mixture; no means a heterogeneous mixture."}, {"t": "fig", "key": "full_tree", "cap": "The full tree. Question 1 splits pure substances from mixtures. A pure substance then asks about kinds of atom; a mixture then asks whether it is the same all the way through. Each of the four categories shows its particle box."}, {"t": "h", "text": "Walk the tree: the gold nugget"}, {"t": "idea", "text": "Here is the gold nugget: every atom in it is a gold atom."}, {"t": "idea", "text": "Question 1: the nugget holds one kind of matter only, so the answer is no: a pure substance."}, {"t": "idea", "text": "Next question: does it have only one kind of atom? Yes: it has gold atoms only."}, {"t": "idea", "text": "So the gold nugget is an element."}, {"t": "fig", "key": "gold_box", "cap": "The gold nugget zoomed in: every circle is a gold atom, one kind of atom, so an element."}, {"t": "h", "text": "Walk the tree: the dry ice"}, {"t": "idea", "text": "Here is the block of dry ice: dry ice is frozen carbon dioxide."}, {"t": "idea", "text": "Every molecule of it is one carbon atom joined to two oxygen atoms."}, {"t": "idea", "text": "Question 1: the dry ice holds one kind of matter only, so the answer is no: a pure substance."}, {"t": "idea", "text": "Next question: does it have only one kind of atom? No: it has carbon and oxygen."}, {"t": "idea", "text": "So the dry ice is a compound."}, {"t": "fig", "key": "dryice_box", "cap": "The dry ice zoomed in: carbon atoms and oxygen atoms joined in one fixed pattern, so a compound."}, {"t": "h", "text": "Walk the tree: the fork and the sand"}, {"t": "idea", "text": "Here is the steel fork: steel is iron with a little carbon mingled evenly through it, not joined."}, {"t": "idea", "text": "Question 1: the fork holds two kinds of matter, so the answer is yes: a mixture."}, {"t": "idea", "text": "Next question: is it the same all the way through? Yes, every part of the fork is the same steel."}, {"t": "idea", "text": "So the steel fork is a homogeneous mixture."}, {"t": "idea", "text": "Here is the beach sand with bits of shell."}, {"t": "idea", "text": "Question 1: the sand holds two kinds of matter, sand and shell, so the answer is yes: a mixture."}, {"t": "idea", "text": "Next question: is it the same all the way through? No, shell bits sit here and there."}, {"t": "idea", "text": "So the sand with shell is a heterogeneous mixture."}, {"t": "fig", "key": "samples_sorted", "cap": "The four samples sorted. Question 1 decides pure substance or mixture; the second question depends on that answer: kinds of atom for a pure substance, evenness for a mixture."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To sort any sample, first ask whether it holds more than one kind of matter. A mixture then asks: is it the same all the way through? A pure substance then asks: does it have one kind of atom? The four answers are element, compound, homogeneous mixture and heterogeneous mixture."}, {"t": "idea", "text": "Back to the bench: the gold nugget is an element, and the dry ice is a compound."}, {"t": "idea", "text": "The steel fork is a homogeneous mixture, and the sand with shell is a heterogeneous mixture."}], "script": [{"say": "Four samples sit on a bench: a gold nugget, dry ice, a steel fork, and beach sand with bits of shell.", "screen": "[four samples, each named]"}, {"say": "One sort gives pure substance or mixture; another splits a pure substance into element or compound.", "screen": "[two small trees side by side]"}, {"say": "Put the two sorts together into one tree.", "screen": "[the two trees slide together; question mark]"}, {"say": "Question 1: is there more than one kind of matter?", "screen": "[the full tree: question 1 box]"}, {"say": "No means a pure substance: ask whether it has only one kind of atom.", "screen": "[left branch: ONE KIND OF ATOM?]"}, {"say": "Yes means a mixture: ask whether it is the same all the way through.", "screen": "[right branch: SAME ALL THROUGH?]"}, {"say": "One kind of atom makes an element; different kinds joined make a compound.", "screen": "[element box; compound box]"}, {"say": "The same all through is homogeneous; not the same is heterogeneous.", "screen": "[homogeneous box; heterogeneous box]"}, {"say": "The gold nugget: one kind of matter, one kind of atom, so an element.", "screen": "[the nugget lands in ELEMENT]"}, {"say": "The dry ice: one kind of matter, but carbon and oxygen atoms joined, so a compound.", "screen": "[the dry ice lands in COMPOUND]"}, {"say": "The steel fork: iron with a little carbon mingled evenly, so a homogeneous mixture.", "screen": "[the fork lands in HOMOGENEOUS MIXTURE]"}, {"say": "The sand with shell: shell bits here and there, so a heterogeneous mixture.", "screen": "[the sand lands in HETEROGENEOUS MIXTURE]"}, {"say": "So here is the rule: first ask about kinds of matter, then ask the second question for that branch.", "screen": "[rule slide reuses the tree; rule text]"}, {"say": "Back to the bench: element, compound, homogeneous mixture, heterogeneous mixture.", "screen": "[the four samples in their categories]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A bowl of chili: one spoonful is full of beans, and the next has none. Is the chili the same all the way through?", "options": ["yes", "no"], "key": 1, "fb": ["One spoonful differs from the next, so the chili is different in different places.", "Beans here and none there means different in different places: heterogeneous."], "why": "One spoonful is full of beans, and the next has none.<br>So the chili is different in different places.<br>The chili is not the same all the way through: a heterogeneous mixture."}, {"type": "mcq", "tag": "recall", "stem": "A drawing shows one kind of atom only, joined in pairs. Element or compound?", "options": ["an element", "a compound"], "key": 0, "fb": ["One kind of atom makes an element, joined in pairs or not.", "A compound needs two or more kinds of atom; this drawing has one."], "why": "A substance made of only one kind of atom is called an element.<br>The drawing shows one kind of atom, joined in pairs.<br>Joined or not, one kind makes an element."}, {"type": "mcq", "tag": "scaffold", "stem": "A yellow lump of pure sulfur: every atom in it is a sulfur atom. Question 1: is there more than one kind of matter?", "options": ["yes", "no"], "key": 1, "fb": ["Every atom is a sulfur atom, so the lump holds one kind of matter only.", "Sulfur atoms only: one kind of matter, so the lump is a pure substance."], "why": "Every atom in the lump is a sulfur atom.<br>So the lump holds one kind of matter only.<br>The answer to question 1 is no: the sulfur is a pure substance."}, {"type": "mcq", "tag": "scaffold", "stem": "For the lump of sulfur, which question comes next?", "options": ["Does it have only one kind of atom?", "Is it the same all the way through?"], "key": 0, "fb": ["A pure substance is sorted by its kinds of atom: element or compound.", "That question sorts mixtures into homogeneous and heterogeneous; the sulfur is not a mixture."], "why": "The sulfur is a pure substance, not a mixture.<br>A pure substance is split into element or compound by its kinds of atom.<br>So the next question is whether it has only one kind of atom."}, {"type": "mcq", "tag": "scaffold", "stem": "The lump of sulfur again: every atom is a sulfur atom. Does it have only one kind of atom?", "options": ["yes", "no"], "key": 0, "fb": ["Sulfur atoms only: one kind of atom.", "Every atom is a sulfur atom, so there is one kind only."], "why": "Every atom in the lump is a sulfur atom.<br>So the lump has only one kind of atom.<br>The answer is yes."}, {"type": "mcq", "tag": "scaffold", "stem": "So which category is the lump of sulfur?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "fb": ["A pure substance with one kind of atom is an element.", "A compound needs two or more kinds of atom; sulfur has one.", "The sulfur is a pure substance, not a mixture.", "The sulfur is a pure substance, not a mixture."], "why": "Question 1: one kind of matter, so a pure substance.<br>Next question: one kind of atom, so yes.<br>A pure substance with one kind of atom is an element."}, {"type": "mcq", "tag": "fluency", "stem": "The gas in a helium balloon: every atom is a helium atom. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 0, "fb": ["One kind of matter, one kind of atom: an element.", "A compound needs two or more kinds of atom; helium has one.", "One kind of matter only, so not a mixture.", "One kind of matter only, so not a mixture."], "why": "Question 1: one kind of matter, so a pure substance.<br>Next question: every atom is a helium atom, so one kind of atom.<br>A pure substance with one kind of atom is an element."}, {"type": "mcq", "tag": "fluency", "stem": "A snowflake of pure water: every molecule is one oxygen atom joined to two hydrogen atoms. Which category?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 1, "fb": ["Two kinds of atom, so not an element.", "One kind of matter, two kinds of atom joined in on
