 feathers both read 250 g, so they have the same mass.", "Size is a different property."], "article": [{"t": "idea", "text": "A student puts an apple on a balance."}, {"t": "idea", "text": "The balance reads 250 g."}, {"t": "idea", "text": "She takes the apple off and puts a big bag of feathers on the same balance."}, {"t": "idea", "text": "The balance reads 250 g again."}, {"t": "idea", "text": "The bag of feathers is far bigger than the apple."}, {"t": "idea", "text": "So does the bag of feathers have more mass than the apple?"}, {"t": "h", "text": "What a balance measures"}, {"t": "idea", "text": "The balance measures how much material is in the thing on it."}, {"t": "idea", "text": "The amount of material in something is called its <b>mass<\/b>."}, {"t": "idea", "text": "A balance measures mass in grams (g) or kilograms (kg)."}, {"t": "idea", "text": "The apple reads 250 g, so its mass is 250 g."}, {"t": "idea", "text": "The bag of feathers reads 250 g too, so its mass is also 250 g."}, {"t": "fig", "key": "two_balances", "cap": "Two balances. The apple reads 250 g. The much bigger bag of feathers also reads 250 g. Same reading, same mass."}, {"t": "h", "text": "Size is a different property"}, {"t": "idea", "text": "The bag of feathers takes up far more room than the apple."}, {"t": "idea", "text": "Taking up room is a different property from mass."}, {"t": "idea", "text": "A bigger thing does not always have more mass."}, {"t": "idea", "text": "Only the balance reading tells you which has more mass."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a jar of peanut butter and a jar of cotton balls, the same size."}, {"t": "idea", "text": "The peanut butter reads 500 g, and the cotton balls read 60 g."}, {"t": "idea", "text": "The two jars are the same size, but the peanut butter has far more mass."}, {"t": "fig", "key": "jars_balance", "cap": "Two jars the same size. The peanut butter reads 500 g. The cotton balls read 60 g."}, {"t": "idea", "text": "Now consider a small stone and a big sponge."}, {"t": "idea", "text": "The stone reads 300 g, and the sponge reads 50 g."}, {"t": "idea", "text": "The stone is smaller, but the stone has more mass."}, {"t": "fig", "key": "stone_sponge_balance", "cap": "A small stone reads 300 g. A much bigger sponge reads 50 g. The smaller thing has more mass."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Mass is the amount of material in something. A balance measures mass, in grams (g) or kilograms (kg)."}, {"t": "idea", "text": "Only the balance reading shows which has more mass."}, {"t": "idea", "text": "Size is a different property."}, {"t": "idea", "text": "Back to the apple and the feathers: both read 250 g, so both have the same mass."}, {"t": "idea", "text": "The bag is bigger, but bigger does not mean more mass."}], "script": [{"say": "An apple on a balance reads 250 grams.", "screen": "[apple on a balance; readout 250 g]"}, {"say": "A big bag of feathers on the same balance also reads 250 grams.", "screen": "[apple off; bag of feathers on; readout 250 g]"}, {"say": "The bag is far bigger, so does it have more mass?", "screen": "[the two side by side; question mark]"}, {"say": "The balance measures how much material is in the thing on it.", "screen": "[arrow from the pan to the readout]"}, {"say": "The amount of material in something is called its mass, measured in grams or kilograms.", "screen": "[chip: MASS; chips: g, kg]"}, {"say": "Both read 250 grams, so both have a mass of 250 grams.", "screen": "[chips under both: MASS 250 g]"}, {"say": "The bag takes up more room, but room is a different property.", "screen": "[dashed outline around the bag; chip: SIZE IS A DIFFERENT PROPERTY]"}, {"say": "Only the balance reading tells you which has more mass.", "screen": "[readouts highlighted]"}, {"say": "Now consider two jars the same size: peanut butter and cotton balls.", "screen": "[two identical jars]"}, {"say": "The peanut butter reads 500 grams, and the cotton balls read 60 grams.", "screen": "[readouts 500 g and 60 g]"}, {"say": "Same size, but the peanut butter has far more mass.", "screen": "[chip: SAME SIZE, MORE MASS under the peanut butter]"}, {"say": "A small stone at 300 grams has more mass than a big sponge at 50 grams.", "screen": "[stone 300 g; sponge 50 g]"}, {"say": "So here is the rule: mass is the amount of material in something.", "screen": "[rule slide reuses the two balances; rule text]"}, {"say": "Only the balance reading shows which has more mass; size is a different property.", "screen": "[rule text line 2]"}, {"say": "Back to the apple and the feathers: both read 250 grams, so both have the same mass.", "screen": "[the two balances]"}, {"say": "The bag is bigger, but bigger does not mean more mass.", "screen": "[chip: BIGGER IS NOT MORE MASS]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A balance reads 900 g for a textbook. What does that reading tell you?", "options": ["how big the textbook is", "how much material is in the textbook", "how hot the textbook is"], "key": 1, "fb": ["A balance does not measure size.", "A balance measures how much material is in the thing on it.", "A thermometer measures temperature, not a balance."], "why": "A balance measures how much material is in the thing on it.<br>The reading of 900 g is the amount of material in the textbook."}, {"type": "text", "tag": "term", "stem": "A balance measures the amount of material in something. What is that amount called?", "accept": ["mass", "its mass", "the mass"], "why": "The amount of material in something is called its mass."}, {"type": "mcq", "tag": "term", "stem": "Which unit does a balance use for mass?", "options": ["centimeters (cm)", "degrees Celsius (°C)", "grams (g)"], "key": 2, "fb": ["Centimeters measure length.", "Degrees Celsius measure temperature.", "A balance measures mass in grams or kilograms."], "why": "A balance measures mass in grams (g) or kilograms (kg)."}, {"type": "mcq", "tag": "fluency", "fig": "bal_pumpkin_melon", "stem": "Which has more mass, the pumpkin or the melon?", "options": ["The pumpkin has more mass.", "The melon has more mass.", "The pumpkin and the melon have the same mass."], "key": 0, "fb": ["A bigger balance reading means more mass.", "The melon reads less, so the melon has less mass.", "The two readings differ, so the masses differ."], "why": "A bigger balance reading means more mass.<br>The pumpkin reads 4 kg and the melon reads 2 kg.<br>So the pumpkin has more mass."}, {"type": "mcq", "tag": "fluency", "fig": "bal_pillow_hammer", "stem": "Which has more mass, the pillow or the hammer?", "options": ["The pillow has more mass.", "The hammer has more mass.", "The pillow and the hammer have the same mass."], "key": 2, "fb": ["The pillow is bigger, but the two readings are the same.", "The hammer is smaller, but the two readings are the same.", "The two readings are the same, so the two masses are the same."], "why": "The pillow and the hammer both read 800 g.<br>The two readings are the same, so the two masses are the same.<br>The pillow is bigger, but size is a different property."}, {"type": "mcq", "tag": "fluency", "fig": "bal_bowling_exercise", "stem": "Which has more mass, the bowling ball or the exercise ball?", "options": ["The bowling ball has more mass.", "The exercise ball has more mass.", "The two balls have the same mass."], "key": 0, "fb": ["A bigger balance reading means more mass.", "The exercise ball is bigger, but it reads less, so it has less mass.", "The two readings differ, so the masses differ."], "why": "A bigger balance reading means more mass.<br>The bowling ball reads 6 kg and the exercise ball reads 1 kg.<br>So the bowling ball has more mass, though the exercise ball is bigger."}, {"type": "mcq", "tag": "fluency", "fig": "bal_marshmallows_jam", "stem": "Which has more mass, the bag of marshmallows or the jar of jam?", "options": ["The bag of marshmallows has more mass.", "The jar of jam has more mass.", "The bag and the jar have the same mass."], "key": 1, "fb": ["The bag is bigger, but it reads less.", "A bigger balance reading means more mass, whatever the size.", "The two readings differ, so the masses differ."], "why": "A bigger balance reading means more mass.<br>The jar of jam reads 500 g and the bag reads 300 g.<br>So the jar of jam has more mass, though the bag is bigger."}, {"type": "mcq", "tag": "fluency", "fig": "bal_dogfood_toolbox", "stem": "Which has more mass, the bag of dog food or the toolbox?", "options": ["The bag of dog food has more mass.", "The toolbox has more mass.", "The bag and the toolbox have the same mass."], "key": 1, "fb": ["The bag reads less, so the bag has less mass.", "A bigger balance reading means more mass.", "The two readings differ, so the masses differ."], "why": "A bigger balance reading means more mass.<br>The toolbox reads 7 kg and the bag reads 5 kg.<br>So the toolbox has more mass."}, {"type": "mcq", "tag": "fluency", "fig": "bal_laptop_oranges", "stem": "Which has more mass, the laptop or the bag of oranges?", "options": ["The laptop has more mass.", "The bag of oranges has more mass.", "The laptop and the bag have the same mass."], "key": 2, "fb": ["The two readings are the same.", "The two readings are the same.", "The two readings are the same, so the two masses are the same."], "why": "The laptop and the bag of oranges both read 2 kg.<br>The two readings are the same, so the two masses are the same."}, {"type": "mcq", "tag": "transfer", "fig": "bal_iron_wood_blocks", "stem": "Two blocks are the same size and shape. Which has more mass, the iron block or the wooden block?", "options": ["The iron block has more mass.", "The wooden block has more mass.", "The two blocks have the same mass."], "key": 0, "fb": ["The blocks are the same size, but the balance reads more for the iron.", "The wooden block reads far less.", "Same size does not mean same mass. The readings differ."], "why": "The two blocks are the same size.<br>The iron block reads 700 g and the wooden block reads 60 g.<br>A bigger balance reading means more mass, so the iron block has more mass."}, {"type": "mcq", "tag": "misconception", "stem": "A big bag of chips reads 150 g. A small can of beans reads 400 g. Kai says: \"The bag of chips must have more mass, because it is bigger.\" Is Kai correct?", "options": ["yes", "no"], "key": 1, "fb": ["Size is a different property from mass. The can reads more, so the can has more mass.", "Size is a different property from mass. The can reads more, so the can has more mass."], "why": "Only the balance reading shows which has more mass.<br>The can of beans reads 400 g and the bag reads 150 g.<br>So the can has more mass, though the bag is bigger."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The apple and the big bag of feathers both read 250 g. Which has more mass?", "options": ["The apple has more mass.", "The bag of feathers has more mass.", "The apple and the bag have the same mass."], "key": 2, "fb": ["The two readings are the same.", "The bag is bigger, but the two readings are the same.", "The two readings are the same, so the two masses are the same."], "why": "Both read 250 g on the balance.<br>The two readings are the same, so the two masses are the same.<br>The bag is bigger, but size is a different property."}]}, {"id": "L03", "atom": "MAT-007", "title": "Volume: how much space, in milliliters", "video": "definitely a video", "lesson_type": "Procedural lesson (read a graduated cylinder) inside a concept introduction; coins the term volume", "check_design": "Type (b) multi-step routine → one recall MCQ (T1 L05: the amount of a poured liquid does not change), the coined term (typed, then a definition MCQ), the routine's one decision step (what to read against the scale), two typed readings in mL from drawn cylinders (one on a numbered mark, one on the halfway mark), then a fluency quiz: which held more from two DRAWN cylinders ×4 (the student reads and compares), then a student-claim misconception (the taller pitcher must hold more).", "headache": ["A student pours water into a tall thin glass and a short wide glass.", "The tall glass looks fuller.", "She pours each into a graduated cylinder.", "The tall glass held 150 mL; the wide glass held 250 mL.", "Why did her eyes get it wrong?"], "forest": ["How do you compare how much space two things take up?", "Volume is the amount of space something takes up.", "A liquid's volume is measured in a graduated cylinder, in milliliters (mL).", "Read the flat top of the liquid against the scale.", "The wide glass held more, 250 mL against 150 mL, whatever the shapes looked like."], "article": [{"t": "idea", "text": "A student pours water into a tall thin glass and into a short wide glass."}, {"t": "idea", "text": "The water in the tall glass looks like more."}, {"t": "idea", "text": "She has a tall glass tube with a scale marked up its side."}, {"t": "idea", "text": "A tube like this, marked with a scale, is called a <b>graduated cylinder<\/b>."}, {"t": "idea", "text": "She pours the water from the tall glass into the graduated cylinder."}, {"t": "idea", "text": "The water settles at 150 on the scale."}, {"t": "idea", "text": "She empties the cylinder and pours in the water from the wide glass."}, {"t": "idea", "text": "This time the water settles at 250 on the scale."}, {"t": "h", "text": "Her eyes were wrong"}, {"t": "idea", "text": "The wide glass held more water than the tall glass."}, {"t": "idea", "text": "Why did her eyes get it wrong?"}, {"t": "h", "text": "How much space the water takes up"}, {"t": "idea", "text": "The water in each glass takes up space."}, {"t": "idea", "text": "The amount of space something takes up is called its <b>volume<\/b>."}, {"t": "idea", "text": "The tall glass is thin, so its water rises high."}, {"t": "idea", "text": "A high level in a thin glass can still be a small volume."}, {"t": "idea", "text": "The wide glass spreads its water low but wide."}, {"t": "idea", "text": "A low level in a wide glass can still be a large volume."}, {"t": "idea", "text": "Eyes judge the height of the water, not its volume."}, {"t": "h", "text": "Reading a graduated cylinder"}, {"t": "idea", "text": "The scale on a graduated cylinder is marked in milliliters (mL)."}, {"t": "idea", "text": "On this cylinder, each numbered mark is 50 mL more than the mark below it."}, {"t": "idea", "text": "The small mark halfway between two numbered marks is 25 mL more than the lower one."}, {"t": "idea", "text": "To read a graduated cylinder, there are four steps."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Let the liquid settle."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Find the flat top of the liquid, with your eyes level with it."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Read the flat top against the nearest mark on the scale."}, {"t": "idea", "do": true, "text": "<b>4.<\/b> Write the number with its unit, mL."}, {"t": "h", "text": "The two readings"}, {"t": "idea", "text": "The water from the tall glass settles on the 150 mark, so its volume is 150 mL."}, {"t": "idea", "text": "The water from the wide glass settles on the 250 mark, so its volume is 250 mL."}, {"t": "fig", "key": "two_cylinders", "cap": "Two graduated cylinders with the same scale. The water from the tall glass reads 150 mL; the water from the wide glass reads 250 mL. The zoom shows the flat top of a liquid read against the 200 mark."}, {"t": "idea", "text": "The wide glass held 250 mL, more than 150 mL, so the wide glass held the larger volume."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a tall thin bottle of shampoo and a short wide bottle of shampoo."}, {"t": "idea", "text": "The shampoo from the tall bottle settles on the small mark halfway between 200 and 250."}, {"t": "idea", "text": "Halfway between 200 mL and 250 mL is 225 mL, so the tall bottle held 225 mL."}, {"t": "idea", "text": "The shampoo from the wide bottle settles on the 200 mark, so the wide bottle held 200 mL."}, {"t": "fig", "key": "two_cylinders_shampoo", "cap": "Two graduated cylinders. The shampoo from the tall bottle reads 225 mL, on the small mark halfway between 200 and 250. The shampoo from the wide bottle reads 200 mL."}, {"t": "idea", "text": "This time the tall bottle held the larger volume."}, {"t": "idea", "text": "The reading on the graduated cylinder shows which held more, not the shape of the bottle."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Volume is the amount of space something takes up. A graduated cylinder measures the volume of a liquid in milliliters (mL)."}, {"t": "idea", "text": "Back to the two glasses: the tall glass held 150 mL and the wide glass held 250 mL."}, {"t": "idea", "text": "Her eyes judged the height of the water, but the graduated cylinder measured its volume."}], "script": [{"say": "Here is a tall thin glass of water beside a short wide one.", "screen": "[the two glasses side by side]"}, {"say": "The tall glass looks like more.", "screen": "[chip: LOOKS LIKE MORE over the tall glass]"}, {"say": "She pours the tall glass's water into a tall tube with a scale up its side, called a graduated cylinder.", "screen": "[a graduated cylinder; the first pour; chip: GRADUATED CYLINDER]"}, {"say": "The water settles at 150.", "screen": "[the level rises and settles on the 150 mark]"}, {"say": "She empties the cylinder and pours in the wide glass's water: this time, 250.", "screen": "[cylinder empties; second pour; level settles on the 250 mark]"}, {"say": "The wide glass held more, so why were her eyes wrong?", "screen": "[question mark over the two glasses]"}, {"say": "The amount of space something takes up is called its volume.", "screen": "[chip: VOLUME]"}, {"say": "A high level in a thin glass can still be a small volume.", "screen": "[tall glass: thin column outlined]"}, {"say": "A low level in a wide glass can still be a large volume.", "screen": "[wide glass: wide pool outlined]"}, {"say": "Each numbered mark here is 50 milliliters more than the one below.", "screen": "[zoom on the scale; marks 0 to 300 highlighted in turn; chip: mL]"}, {"say": "Let the liquid settle, find its flat top, and read it against the nearest mark.", "screen": "[dashed line across the flat top to the 150 mark]"}, {"say": "Write the number with its unit: 150 and 250 milliliters.", "screen": "[labels: 150 mL, 250 mL]"}, {"say": "Now consider two shampoo bottles, tall and wide: 225 milliliters against 200.", "screen": "[two shampoo bottles; two cylinders: 225 mL on the halfway mark, 200 mL]"}, {"say": "This time the tall bottle held more, so the reading shows which held more, not the shape.", "screen": "[chip: THE READING SHOWS WHICH HELD MORE]"}, {"say": "So here is the rule: volume is the amount of space something takes up.", "screen": "[rule slide reuses the two cylinders; rule text, with the reading line as text beneath]"}, {"say": "Back to the glasses: eyes judged height; the cylinder measured volume.", "screen": "[the two glasses beside their two cylinders: 150 mL, 250 mL]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A student pours grape juice from a tall glass into a wide bowl. Does the amount of juice change?", "options": ["yes", "no"], "key": 1, "fb": ["A liquid takes the shape of its container, but the amount of liquid stays the same.", "The juice takes the bowl's shape, but the amount of juice stays the same."], "why": "A liquid takes the shape of its container.<br>The amount of liquid does not change when it is poured.<br>So the amount of juice stays the same."}, {"type": "text", "tag": "term", "stem": "What is the amount of space something takes up called?", "accept": ["volume", "its volume", "the volume"], "why": "The amount of space something takes up is called its volume."}, {"type": "mcq", "tag": "term", "stem": "What is volume?", "options": ["the amount of material in something", "how tall something is", "the amount of space something takes up"], "key": 2, "fb": ["The amount of material in something is its mass. Volume is the amount of space it takes up.", "Height is one length. Volume is the amount of space something takes up.", "Volume is the amount of space something takes up."], "why": "Volume is the amount of space something takes up."}, {"type": "mcq", "tag": "scaffold", "stem": "Apple juice is poured into a graduated cylinder. What do you read against the scale?", "options": ["the flat top of the juice", "the highest splash on the glass", "the top edge of the cylinder"], "key": 0, "fb": ["Let the liquid settle, then read its flat top against the nearest mark.", "Splashes are not the level. Read the flat top of the settled liquid.", "The top edge is part of the cylinder, not the liquid. Read the flat top of the liquid."], "why": "Let the liquid settle.<br>Find the flat top of the liquid.<br>Read the flat top against the nearest mark on the scale."}, {"type": "text", "tag": "scaffold", "fig": "cyl_200_cranberry", "stem": "Cranberry juice has settled in the graduated cylinder in the drawing. What is the volume of the juice, in mL?", "accept": ["200", "200 mL", "200 ml", "200 milliliters"], "why": "Find the flat top of the juice.<br>The flat top sits exactly on the 200 mark.<br>So the volume is 200 mL."}, {"type": "text", "tag": "scaffold", "fig": "cyl_75_rainwater", "stem": "Rainwater has settled in the graduated cylinder in the drawing. What is the volume of the rainwater, in mL?", "accept": ["75", "75 mL", "75 ml", "75 milliliters"], "why": "Find the flat top of the rainwater.<br>The flat top sits on the small mark halfway between 50 and 100.<br>Halfway between 50 mL and 100 mL is 75 mL."}, {"type": "mcq", "tag": "fluency", "fig": "cyl2_pineapple", "stem": "Which held more pineapple juice, the can or the carton?", "options": ["The can held more.", "The carton held more.", "The can and the carton held the same."], "key": 0, "fb": ["A higher reading means a larger volume.", "The carton's juice reads 250 mL, less than 275 mL, so the carton held less.", "The two readings differ, so the volumes differ."], "why": "The can's juice reads 275 mL, on the small mark halfway between 250 and 300.<br>The carton's juice reads 250 mL.<br>275 mL is more than 250 mL, so the can held more."}, {"type": "mcq", "tag": "fluency", "fig": "cyl2_mouthwash", "stem": "Which bottle held more mouthwash, the tall bottle or the wide bottle?", "options": ["The tall bottle held more.", "The wide bottle held more.", "The two bottles held the same."], "key": 1, "fb": ["The tall bottle's mouthwash reads 125 mL, less than 150 mL, so the tall bottle held less.", "A higher reading means a larger volume, whatever the bottle's shape.", "The two readings differ, so the volumes differ."], "why": "The reading on the graduated cylinder shows which held more, not the shape of the bottle.<br>The wide bottle's mouthwash reads 150 mL, and the tall bottle's reads 125 mL.<br>150 mL is more than 125 mL, so the wide bottle held more."}, {"type": "mcq", "tag": "fluency", "fig": "cyl2_dishsoap", "stem": "Which bottle held more dish soap, the blue bottle or the green bottle?", "options": ["The blue bottle held more.", "The green bottle held more.", "The two bottles held the same."], "key": 2, "fb": ["The two readings are the same.", "The two readings are the same.", "The two readings are the same, so the two volumes are the same."], "why": "Both readings sit on the small mark halfway between 250 and 300, so both are 275 mL.<br>The two readings are the same, so the two volumes are the same."}, {"type": "mcq", "tag": "fluency", "fig": "cyl2_coughsyrup", "stem": "Which bottle held more cough syrup, the large clear bottle or the small brown bottle?", "options": ["The large clear bottle held more.", "The small brown bottle held more.", "The two bottles held the same."], "key": 1, "fb": ["The large bottle's syrup reads 50 mL, less than 75 mL, so the large bottle held less.", "A higher reading means a larger volume, even from the smaller-looking bottle.", "The two readings differ, so the volumes differ."], "why": "The reading on the graduated cylinder shows which held more, not the size of the bottle.<br>The small brown bottle's syrup reads 75 mL, and the large clear bottle's reads 50 mL.<br>75 mL is more than 50 mL, so the small brown bottle held more."}, {"type": "mcq", "tag": "misconception", "stem": "Lucas pours the water from a tall thin pitcher into a graduated cylinder, and the water reads 350 mL. The water from a low bowl reads 600 mL. Lucas says: \"The pitcher holds more, because the water is higher in it.\" Is Lucas correct?", "options": ["yes", "no"], "key": 1, "fb": ["The height of the water is not its volume. The bowl's water reads 600 mL, more than 350 mL.", "The height of the water is not its volume. The bowl's water reads 600 mL, more than 350 mL."], "why": "Eyes judge the height of the water, not its volume.<br>The bowl's water reads 600 mL and the pitcher's reads 350 mL.<br>So the bowl holds the larger volume."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The water from the wide glass reached 250 mL, and the water from the tall glass reached 150 mL. Which glass held more water?", "options": ["The tall glass held more water.", "The wide glass held more water."], "key": 1, "fb": ["The tall glass looked fuller, but its water read only 150 mL.", "250 mL is more than 150 mL, so the wide glass held the larger volume."], "why": "The graduated cylinder read 250 mL for the wide glass and 150 mL for the tall glass.<br>250 mL is more, so the wide glass held more water."}]}, {"id": "L04", "atom": "MAT-012", "title": "Does it dissolve? Soluble and insoluble", "video": "definitely a video", "lesson_type": "Example-sequence classification lesson; coins the terms soluble and insoluble", "check_design": "Type (a) one-step categorisation → one recall MCQ (T1 L02: a spoonful of cinnamon is made of particles too small to see), the coined terms straight away (typed soluble, typed insoluble, then a definition MCQ for each), then a fluency quiz: soluble or insoluble ×6 on fresh cases described by what happens, then a student-claim misconception (the dissolved tablet has gone).", "headache": ["A student stirs a spoonful of sugar into a glass of water.", "The sugar disappears.", "She stirs a spoonful of sand into a second glass of water.", "The sand sits on the bottom however long she stirs.", "Why do the two behave so differently?"], "forest": ["What decides whether a material disappears into water?", "Sugar dissolves in water: it breaks into particles too small to see and spreads through the water.", "A material that dissolves in water is called soluble.", "Sand does not dissolve, however long you stir.", "A material that does not dissolve is called insoluble.", "Soluble or insoluble is a physical property of the material."], "article": [{"t": "idea", "text": "A student stirs a spoonful of sugar into a glass of water."}, {"t": "idea", "text": "The sugar grains shrink and disappear."}, {"t": "idea", "text": "The water looks clear."}, {"t": "idea", "text": "She stirs a spoonful of sand into a second glass of water."}, {"t": "idea", "text": "The sand swirls around, then sinks."}, {"t": "idea", "text": "The sand sits on the bottom, however long she stirs."}, {"t": "idea", "text": "Why do sugar and sand behave so differently?"}, {"t": "h", "text": "Zoom in on the sugar"}, {"t": "idea", "text": "Sugar is made of particles far too small to see."}, {"t": "idea", "text": "In the water, the sugar breaks apart into its particles."}, {"t": "idea", "text": "The sugar particles spread out among the water particles."}, {"t": "idea", "text": "Each sugar particle is far too small to see, so the water looks clear."}, {"t": "idea", "text": "The water tastes sweet, so the sugar is still there."}, {"t": "idea", "text": "Breaking into particles too small to see and spreading through the water is called <b>dissolving<\/b>."}, {"t": "idea", "text": "A material that dissolves in water is called <b>soluble<\/b>."}, {"t": "idea", "text": "Sugar is soluble in water."}, {"t": "h", "text": "Zoom in on the sand"}, {"t": "idea", "text": "The sand grains stay whole in the water."}, {"t": "idea", "text": "Each grain is still big enough to see."}, {"t": "idea", "text": "The grains sink and sit on the bottom."}, {"t": "idea", "text": "The sand does not dissolve, however long she stirs."}, {"t": "idea", "text": "A material that does not dissolve in water is called <b>insoluble<\/b>."}, {"t": "idea", "text": "Sand is insoluble in water."}, {"t": "fig", "key": "two_glasses_dissolve", "cap": "Two glasses after stirring. Left: the sugar dissolved, and the water is clear. Right: the sand sits on the bottom."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a spoonful of salt stirred into water."}, {"t": "idea", "text": "The salt grains disappear, and the water tastes salty."}, {"t": "idea", "text": "Salt is soluble."}, {"t": "idea", "text": "Now consider a spoonful of orange drink powder stirred into water."}, {"t": "idea", "text": "The powder disappears, and the water turns orange all through."}, {"t": "idea", "text": "Drink powder is soluble."}, {"t": "h", "text": "An insoluble example"}, {"t": "idea", "text": "Now consider a spoonful of chalk dust stirred into water."}, {"t": "idea", "text": "The water turns cloudy, then the chalk settles on the bottom."}, {"t": "idea", "text": "Chalk is insoluble."}, {"t": "fig", "key": "soluble_table", "cap": "Five materials sorted. Sugar, salt and drink powder dissolve, so they are soluble. Sand and chalk do not, so they are insoluble."}, {"t": "h", "text": "A physical property"}, {"t": "idea", "text": "The dissolved sugar is still sugar, so nothing changed into anything else."}, {"t": "idea", "text": "So soluble or insoluble is a physical property of the material."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A material that dissolves in water is called soluble. A material that does not dissolve in water is called insoluble. Soluble or insoluble is a physical property of the material."}, {"t": "idea", "text": "Back to the two glasses: the sugar dissolved, so sugar is soluble."}, {"t": "idea", "text": "The sand sat on the bottom however long she stirred, so sand is insoluble."}], "script": [{"say": "A student stirs a spoonful of sugar into a glass of water.", "screen": "[glass of water; spoon stirs; sugar grains fall in]"}, {"say": "The grains disappear, and the water looks clear.", "screen": "[grains shrink to nothing; clear glass]"}, {"say": "She stirs a spoonful of sand into a second glass.", "screen": "[second glass; sand falls in; spoon stirs]"}, {"say": "The sand sinks and sits on the bottom, however long she stirs.", "screen": "[sand swirls, settles; timer runs on]"}, {"say": "Why do sugar and sand behave so differently?", "screen": "[question mark between the glasses]"}, {"say": "Sugar is made of particles far too small to see.", "screen": "[magnifier over the sugar water: a grain made of dark circles]"}, {"say": "In the water, the sugar breaks apart into those particles.", "screen": "[the grain breaks into dark circles among light circles]"}, {"say": "Each particle is too small to see, so the water looks clear.", "screen": "[chip: LOOKS CLEAR]"}, {"say": "But the water tastes sweet, so the sugar is still there.", "screen": "[chips: TASTES SWEET, STILL THERE]"}, {"say": "Breaking into particles too small to see and spreading through the water is called dissolving.", "screen": "[chip: DISSOLVES; dark circles spread through the glass]"}, {"say": "A material that dissolves in water is called soluble.", "screen": "[chip: SOLUBLE; tick on the sugar glass]"}, {"say": "The sand grains stay whole and sink to the bottom.", "screen": "[magnifier over the sand glass: whole grains on the bottom]"}, {"say": "A material that does not dissolve in water is called insoluble.", "screen": "[chip: INSOLUBLE; cross on the sand glass]"}, {"say": "Salt disappears too, so salt is soluble.", "screen": "[salt glass clears; tick: SOLUBLE]"}, {"say": "Chalk dust clouds the water, then settles, so chalk is insoluble.", "screen": "[cloudy glass clears from the top; chalk on the bottom; cross: INSOLUBLE]"}, {"say": "The dissolved sugar is still sugar: nothing changed into anything else.", "screen": "[table: soluble | insoluble]"}, {"say": "So soluble or insoluble is a physical property.", "screen": "[chip: PHYSICAL PROPERTY]"}, {"say": "The rule: a soluble material dissolves in water; an insoluble material does not.", "screen": "[rule slide reuses the two glasses; rule text]"}, {"say": "Back to the glasses: sugar is soluble; sand is insoluble.", "screen": "[the two glasses with their labels]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A spoonful of cinnamon is made of…", "options": ["particles far too small to see", "one single piece with nothing smaller inside it"], "key": 0, "fb": ["All matter is made of particles far too small to see.", "Cinnamon is matter, and all matter is made of particles far too small to see."], "why": "Cinnamon is matter.<br>All matter is made of particles far too small to see."}, {"type": "text", "tag": "term", "stem": "A material that dissolves in water is called…", "accept": ["soluble"], "why": "A material that dissolves in water is called soluble."}, {"type": "text", "tag": "term", "stem": "A material that does not dissolve in water is called…", "accept": ["insoluble"], "why": "A material that does not dissolve in water is called insoluble."}, {"type": "mcq", "tag": "term", "stem": "A material is soluble in water. What does that mean?", "options": ["The material sinks to the bottom of the water.", "The material floats on top of the water.", "The material dissolves in the water."], "key": 2, "fb": ["A material that sinks and stays whole has not dissolved.", "A material that floats and stays whole has not dissolved.", "Soluble means the material dissolves in water."], "why": "A material that dissolves in water is called soluble.<br>So a soluble material dissolves in the water."}, {"type": "mcq", "tag": "term", "stem": "A material is insoluble in water. What does that mean?", "options": ["The material dissolves in the water.", "The material does not dissolve in the water.", "The material floats on top of the water."], "key": 1, "fb": ["A material that dissolves in water is soluble.", "Insoluble means the material does not dissolve in water.", "Floating or sinking does not decide it. Insoluble means the material does not dissolve."], "why": "A material that does not dissolve in water is called insoluble.<br>So an insoluble material does not dissolve in the water."}, {"type": "mcq", "tag": "fluency", "stem": "Instant coffee is stirred into hot water. The grains vanish, and the water turns brown all through. Is instant coffee soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 0, "fb": ["The grains vanished and spread through the water, so the coffee dissolved.", "The grains vanished and spread through the water, so the coffee dissolved."], "why": "The coffee grains broke into particles too small to see.<br>The particles spread through the water.<br>So instant coffee is soluble."}, {"type": "mcq", "tag": "fluency", "stem": "Sawdust is stirred into water. Every piece can still be seen. Is sawdust soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 1, "fb": ["The sawdust did not dissolve. Every piece can still be seen.", "Every piece can still be seen, so the sawdust did not dissolve."], "why": "The sawdust did not break into particles too small to see.<br>Every piece stays big enough to see.<br>So sawdust is insoluble."}, {"type": "mcq", "tag": "fluency", "stem": "Gravel is stirred into water. The stones sit on the bottom. Is gravel soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 1, "fb": ["The stones stayed whole on the bottom, so they did not dissolve.", "The stones stayed whole on the bottom, so they did not dissolve."], "why": "The gravel stones stay whole and big enough to see.<br>They sit on the bottom.<br>So gravel is insoluble."}, {"type": "mcq", "tag": "fluency", "stem": "Baking soda is stirred into water. The powder vanishes, and the water looks clear. Is baking soda soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 0, "fb": ["The powder disappeared into the water, so it dissolved.", "The powder disappeared into the water, so it dissolved."], "why": "The baking soda broke into particles too small to see.<br>The particles spread through the water.<br>So baking soda is soluble."}, {"type": "mcq", "tag": "fluency", "stem": "Gelatin dessert powder is stirred into hot water. The powder vanishes, and the water turns red all through. Is the powder soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 0, "fb": ["The powder vanished and spread through the water, so it dissolved.", "The powder vanished and spread through the water, so it dissolved."], "why": "The gelatin powder broke into particles too small to see.<br>The particles spread through the water.<br>So the powder is soluble."}, {"type": "mcq", "tag": "fluency", "stem": "Glitter is stirred into water. Every piece can still be seen. Is glitter soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 1, "fb": ["Every piece can still be seen, so the glitter did not dissolve.", "Every piece can still be seen, so the glitter did not dissolve."], "why": "The glitter pieces stay whole and big enough to see.<br>So glitter is insoluble."}, {"type": "mcq", "tag": "misconception", "stem": "Nina stirs a sweetener tablet into her hot cider, and the tablet disappears. Nina says: \"The sweetener has gone; nothing from the tablet is in the cider now.\" Is Nina correct?", "options": ["yes", "no"], "key": 1, "fb": ["The sweetener is still in the cider, as particles too small to see. The cider tastes sweeter.", "The sweetener is still in the cider, as particles too small to see. The cider tastes sweeter."], "why": "The sweetener dissolved.<br>The tablet broke into particles too small to see.<br>The particles spread through the cider.<br>The cider tastes sweeter, so the sweetener is still there."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "After stirring, the sand sat on the bottom of the glass. Is sand soluble or insoluble?", "options": ["soluble", "insoluble"], "key": 1, "fb": ["The sand did not dissolve. It sat on the bottom.", "The sand did not dissolve, so sand is insoluble."], "why": "The sand did not dissolve, however long she stirred.<br>A material that does not dissolve in water is called insoluble."}]}, {"id": "L05", "atom": "MAT-013", "title": "Conductors and insulators", "video": "definitely a video", "lesson_type": "Example-sequence classification lesson with two tests on the same materials; coins the terms conductor and insulator", "check_design": "Type (a) one-step categorisation → one recall MCQ (L01: a mug's color is a physical property), the coined terms straight away (typed conductor, then a definition MCQ for insulator), then a fluency quiz: conductor or insulator ×8 on fresh materials, each stem naming heat or electricity and giving the observation, then a student-claim misconception (a material that conducts heat cannot conduct electricity).", "headache": ["A steel spoon and a wooden spoon stand in the same pan of hot soup.", "After a minute the steel handle is too hot to hold.", "The wooden handle is still cool.", "The same heat reached both.", "Why did only the steel handle get hot?"], "forest": ["Which materials let heat and electricity pass through them?", "Heat travels easily through the steel spoon and hardly at all through the wood.", "A material that lets heat pass through easily is called a conductor.", "A material that does not is called an insulator.", "The same words are used for electricity: put a material into a simple circuit, and if the bulb lights, the material conducts electricity.", "Metals conduct both heat and electricity; wood and plastic conduct neither."], "article": [{"t": "idea", "text": "A steel spoon and a wooden spoon stand in the same pan of hot soup."}, {"t": "idea", "text": "After a minute, the cook touches each handle."}, {"t": "idea", "text": "The steel handle is too hot to hold."}, {"t": "idea", "text": "The wooden handle is still cool."}, {"t": "idea", "text": "The same hot soup touched both spoons."}, {"t": "idea", "text": "Why did only the steel handle get hot?"}, {"t": "h", "text": "Heat travels through the steel"}, {"t": "idea", "text": "Heat travels easily up the steel spoon, from the soup to the handle."}, {"t": "idea", "text": "So the steel handle gets hot."}, {"t": "idea", "text": "Heat hardly travels through the wood at all."}, {"t": "idea", "text": "So the wooden handle stays cool."}, {"t": "fig", "key": "spoons_in_pan", "cap": "A steel spoon and a wooden spoon in a pan of hot soup. Heat travels up the steel handle, shown by the arrows. The wooden handle stays cool."}, {"t": "h", "text": "A name for each kind of material"}, {"t": "idea", "text": "A material that lets heat travel through it easily is called a <b>conductor<\/b>."}, {"t": "idea", "text": "Steel is a conductor of heat."}, {"t": "idea", "text": "A material that hardly lets heat through is called an <b>insulator<\/b>."}, {"t": "idea", "text": "Wood is an insulator."}, {"t": "h", "text": "More examples: heat"}, {"t": "idea", "text": "Now consider a copper spoon and a plastic spoon in the same hot soup."}, {"t": "idea", "text": "The copper handle gets too hot to hold, so copper is a conductor of heat."}, {"t": "idea", "text": "The plastic handle stays cool, so plastic is an insulator."}, {"t": "fig", "key": "spoons_in_pan_copper", "cap": "A copper spoon and a plastic spoon in the same hot soup. Heat travels up the copper handle. The plastic handle stays cool."}, {"t": "h", "text": "The same words for electricity"}, {"t": "idea", "text": "Conductor and insulator are used for electricity too."}, {"t": "idea", "text": "Here is the electricity test: a strip sits between two clips; if the bulb lights, the strip lets electricity through."}, {"t": "fig", "key": "circuit_test", "cap": "The electricity test. With a copper strip between the clips, the bulb lights. With a plastic strip, the bulb stays dark."}, {"t": "idea", "text": "With a copper strip between the clips, the bulb lights, so copper lets electricity through."}, {"t": "idea", "text": "With a plastic strip between the clips, the bulb stays dark, so plastic does not let electricity through."}, {"t": "idea", "text": "A steel strip lights the bulb too, and a wooden strip leaves it dark."}, {"t": "fig", "key": "conductor_table", "cap": "Four materials against the two tests. Steel and copper let heat and electricity through. Wood and plastic let neither through."}, {"t": "h", "text": "Metals"}, {"t": "idea", "text": "Steel and copper are metals."}, {"t": "idea", "text": "A material that lets heat or electricity pass through easily is said to <b>conduct<\/b> it."}, {"t": "idea", "text": "Metals conduct both heat and electricity."}, {"t": "idea", "text": "Wood and plastic conduct neither."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A material that lets heat or electricity pass through easily is called a conductor. A material that does not is called an insulator."}, {"t": "idea", "text": "Metals conduct both heat and electricity."}, {"t": "idea", "text": "Wood and plastic conduct neither."}, {"t": "idea", "text": "Back to the pan: heat traveled up the steel spoon to its handle, so the steel handle got hot."}, {"t": "idea", "text": "Wood is an insulator, so the wooden handle stayed cool."}], "script": [{"say": "A steel spoon and a wooden spoon stand in a pan of hot soup.", "screen": "[pan of soup; two spoons, handles up; labels STEEL, WOOD]"}, {"say": "After a minute the steel handle is too hot to hold, but the wooden handle is cool.", "screen": "[timer runs one minute; chips: TOO HOT TO HOLD over the steel; STILL COOL over the wood]"}, {"say": "Why did only the steel handle get hot?", "screen": "[question mark]"}, {"say": "Heat travels easily up the steel spoon, so the steel handle gets hot.", "screen": "[arrows climb the steel handle; the handle glows]"}, {"say": "Heat hardly travels through wood, so the wooden handle stays cool.", "screen": "[no arrows on the wooden handle]"}, {"say": "A material that lets heat through easily is called a conductor: steel is a conductor.", "screen": "[chip: CONDUCTOR under the steel spoon]"}, {"say": "A material that hardly lets heat through is called an insulator: wood is an insulator.", "screen": "[chip: INSULATOR under the wooden spoon]"}, {"say": "Copper gets hot too, so copper is a conductor.", "screen": "[two more spoons: COPPER with arrows, chip CONDUCTOR]"}, {"say": "Plastic stays cool, so plastic is an insulator.", "screen": "[PLASTIC, chip INSULATOR]"}, {"say": "For electricity, put the material in a simple circuit: if the bulb lights, the material lets electricity through.", "screen": "[chip: ELECTRICITY; battery, bulb, two clips; a gap between the clips]"}, {"say": "Copper lights the bulb, so copper conducts electricity; plastic leaves it dark.", "screen": "[copper strip: bulb lights, tick; plastic strip: bulb dark, cross]"}, {"say": "Steel lights it too; wood does not.", "screen": "[table fills: steel yes yes; copper yes yes; wood no no; plastic no no]"}, {"say": "Steel and copper are metals, and metals conduct both.", "screen": "[table rows highlighted: METALS]"}, {"say": "Wood and plastic conduct neither.", "screen": "[table rows highlighted: WOOD and PLASTIC]"}, {"say": "So here is the rule: a conductor lets heat or electricity through easily; an insulator does not.", "screen": "[rule slide reuses the spoons and the circuit; rule text]"}, {"say": "Back to the pan: heat traveled up the steel spoon, so its handle got hot; the wooden one stayed cool.", "screen": "[the pan; arrows up the steel handle only]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A ceramic bowl is white. Is the bowl's color a physical property?", "options": ["yes", "no"], "key": 0, "fb": ["Anyone can see the color without changing the bowl into anything else.", "Anyone can see the color without changing the bowl into anything else, so the color is a physical property."], "why": "Anyone can see that the bowl is white.<br>Looking does not change the bowl into anything else.<br>So the color is a physical property."}, {"type": "text", "tag": "term", "stem": "A material that lets heat or electricity pass through easily is called a…", "accept": ["conductor", "a conductor"], "why": "A material that lets heat or electricity pass through easily is called a conductor."}, {"type": "mcq", "tag": "term", "stem": "What is an insulator?", "options": ["a material that lets heat or electricity pass through easily", "a material that does not let heat or electricity pass through easily", "a material that dissolves in water"], "key": 1, "fb": ["A material that lets heat or electricity through easily is a conductor.", "An insulator does not let heat or electricity pass through easily.", "A material that dissolves in water is soluble. An insulator does not let heat or electricity through."], "why": "A material that does not let heat or electricity pass through easily is called an insulator."}, {"type": "mcq", "tag": "fluency", "stem": "Aluminum foil around a hot baked potato gets hot in seconds. Is aluminum a conductor or an insulator of heat?", "options": ["conductor", "insulator"], "key": 0, "fb": ["Heat traveled quickly through the foil.", "Heat traveled quickly through the foil, so aluminum lets heat through easily."], "why": "Heat traveled quickly from the potato through the foil.<br>Aluminum lets heat through easily.<br>So aluminum is a conductor."}, {"type": "mcq", "tag": "fluency", "stem": "A rubber glove between the clips leaves the bulb dark. Is rubber a conductor or an insulator of electricity?", "options": ["conductor", "insulator"], "key": 1, "fb": ["The bulb stayed dark, so the rubber did not let electricity through.", "The bulb stayed dark, so the rubber did not let electricity through."], "why": "The bulb stays dark.<br>So the rubber does not let electricity through.<br>Rubber is an insulator."}, {"type": "mcq", "tag": "fluency", "stem": "A clay flowerpot pressed against a hot pipe stays cool on its far side. Is clay a conductor or an insulator of heat?", "options": ["conductor", "insulator"], "key": 1, "fb": ["Heat hardly traveled through the clay.", "Heat hardly traveled through the clay, so clay does not let heat through easily."], "why": "Heat hardly traveled through the clay pot.<br>Clay does not let heat through easily.<br>So clay is an insulator."}, {"type": "mcq", "tag": "fluency", "stem": "An iron nail between the clips lights the bulb. Is iron a conductor or an insulator of electricity?", "options": ["conductor", "insulator"], "key": 0, "fb": ["The bulb lit, so the iron let electricity through.", "The bulb lit, so the iron let electricity through."], "why": "The bulb lights.<br>So the iron lets electricity through.<br>Iron is a conductor."}, {"type": "mcq", "tag": "fluency", "stem": "A silver bracelet between the clips lights the bulb. Is silver a conductor or an insulator of electricity?", "options": ["conductor", "insulator"], "key": 0, "fb": ["The bulb lit, so the silver let electricity through.", "The bulb lit, so the silver let electricity through."], "why": "The bulb lights.<br>So the silver lets electricity through.<br>Silver is a conductor."}, {"type": "mcq", "tag": "fluency", "stem": "A cork held against a hot toaster stays cool on its far side. Is cork a conductor or an insulator of heat?", "options": ["conductor", "insulator"], "key": 1, "fb": ["Heat hardly traveled through the cork.", "Heat hardly traveled through the cork, so cork does not let heat through easily."], "why": "Heat hardly traveled through the cork.<br>Cork does not let heat through easily.<br>So cork is an insulator."}, {"type": "mcq", "tag": "fluency", "stem": "A wool sock pulled over a bottle of hot water stays cool on the outside. Is wool a conductor or an insulator of heat?", "options": ["conductor", "insulator"], "key": 1, "fb": ["Heat hardly traveled through the wool.", "Heat hardly traveled through the wool, so wool does not let heat through easily."], "why": "Heat hardly traveled through the wool sock to its outside.<br>Wool does not let heat through easily.<br>So wool is an insulator."}, {"type": "mcq", "tag": "fluency", "stem": "A gold necklace between the clips lights the bulb. Is gold a conductor or an insulator of electricity?", "options": ["conductor", "insulator"], "key": 0, "fb": ["The bulb lit, so the gold let electricity through.", "The bulb lit, so the gold let electricity through."], "why": "The bulb lights.<br>So the gold lets electricity through.<br>Gold is a conductor."}, {"type": "mcq", "tag": "misconception", "stem": "Ella stirs a pot of hot pudding with a brass spoon, and the handle quickly gets too hot to hold. Brass is a metal. Ella says: \"Brass lets heat through, so brass cannot let electricity through.\" Is Ella correct?", "options": ["yes", "no"], "key": 1, "fb": ["Brass is a metal, and metals conduct both heat and electricity.", "Brass is a metal, and metals conduct both heat and electricity."], "why": "Heat traveled up the brass spoon, so brass lets heat through.<br>Brass is a metal.<br>Metals conduct both heat and electricity.<br>So brass lets electricity through as well as heat."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Which spoon handle got too hot to hold in the pan of soup?", "options": ["The steel handle got too hot to hold.", "The wooden handle got too hot to hold."], "key": 0, "fb": ["Heat traveled easily up the steel spoon. Steel is a conductor.", "Heat hardly travels through wood. The wooden handle stayed cool."], "why": "Heat travels easily up the steel spoon to its handle.<br>So the steel handle got too hot to hold.<br>Wood is an insulator, so the wooden handle stayed cool."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-005", "stem": "Something you can observe or measure about a material without changing it into anything else is called a…", "accept": ["physical property", "a physical property"], "why": "Something you can observe or measure about a material without changing it into anything else is called a physical property."}, {"type": "text", "tag": "term", "atom": "MAT-007", "stem": "The amount of space something takes up is called its…", "accept": ["volume"], "why": "The amount of space something takes up is called its volume."}, {"type": "text", "tag": "term", "atom": "MAT-012", "stem": "Powdered plant food vanishes when it is stirred into a watering can of water. A material that dissolves like this is called…", "accept": ["soluble"], "why": "A material that dissolves in water is called soluble."}, {"type": "text", "tag": "term", "atom": "MAT-012", "stem": "Crushed eggshell sinks and sits on the bottom of a glass of water however long it is stirred. A material that does not dissolve like this is called…", "accept": ["insoluble"], "why": "A material that does not dissolve in water is called insoluble."}, {"type": "text", "tag": "term", "atom": "MAT-013", "stem": "A steel paper clip lights the bulb when it is put into a simple circuit. A material that lets electricity pass through is called a…", "accept": ["conductor", "a conductor"], "why": "A material that lets heat or electricity pass through easily is called a conductor."}, {"type": "text", "tag": "term", "atom": "MAT-013", "stem": "The outside of a foam cup of hot coffee stays cool. A material that hardly lets heat through is called an…", "accept": ["insulator", "an insulator"], "why": "A material that does not let heat or electricity pass through easily is called an insulator."}, {"type": "text", "tag": "numeric", "atom": "MAT-007", "fig": "cyl_250_pickle", "stem": "Pickle juice has settled in the graduated cylinder in the drawing. What is the volume of the pickle juice, in mL?", "accept": ["250", "250 mL", "250 ml", "250 milliliters"], "why": "Find the flat top of the pickle juice.<br>The flat top sits exactly on the 250 mark.<br>So the volume is 250 mL."}, {"type": "text", "tag": "numeric", "atom": "MAT-007", "fig": "cyl_125_sanitizer", "stem": "Hand sanitizer has settled in the graduated cylinder in the drawing. What is the volume of the sanitizer, in mL?", "accept": ["125", "125 mL", "125 ml", "125 milliliters"], "why": "Find the flat top of the sanitizer.<br>The flat top sits on the small mark halfway between 100 and 150.<br>Halfway between 100 mL and 150 mL is 125 mL."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-006", "stem": "A large foam cooler reads 900 g on a balance. A small metal doorstop reads 1500 g on the same balance. Which has more mass?", "options": ["The cooler has more mass.", "The doorstop has more mass.", "The cooler and the doorstop have the same mass."], "key": 1, "fb": ["The cooler is bigger, but it reads less.", "A bigger balance reading means more mass, whatever the size.", "The two readings differ, so the masses differ."], "why": "Only the balance reading shows which has more mass.<br>The doorstop reads 1500 g and the cooler reads 900 g.<br>So the doorstop has more mass, though the cooler is bigger."}, {"type": "frq", "tag": "mixed", "atom": "MAT-012", "task": "A student drops a vitamin C tablet into a glass of water and stirs until the tablet has vanished. She sips the water, and it tastes sour. Explain why the vitamin is still in the water even though she cannot see it.", "starter": "The vitamin is still in the water because…", "model": "The vitamin is still in the water because the tablet dissolved.<br>The tablet broke into particles far too small to see.<br>The vitamin particles spread through the water.<br>The water tastes sour, so the vitamin is there.", "points": ["the tablet dissolved", "the tablet broke into particles too small to see", "the particles spread through the water, which is why it tastes sour"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-013", "stem": "A tin can is put between the clips of a simple circuit, and the bulb lights. Which statement about tin is correct?", "options": ["Tin lets electricity through.", "Tin does not let electricity through.", "Tin lets heat through, but not electricity."], "key": 0, "fb": ["The bulb lit, so electricity passed through the tin.", "The bulb lit, so electricity did pass through the tin.", "The circuit test checks electricity, not heat. The bulb lit, so electricity passed through the tin."], "why": "Put the material between the clips of a simple circuit; if the bulb lights, the material lets electricity through.<br>The bulb lit with the tin can between the clips.<br>So tin lets electricity through."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-005", "stem": "Which of these is a physical property of a leather boot?", "options": ["The boot was a birthday gift.", "The boot has a mass of 600 g.", "The boot cost 80 dollars."], "key": 1, "fb": ["A gift is about the giver, not the boot.", "Anyone can put the boot on a balance and read 600 g without changing the boot.", "A price is about the buyer and the store, not the boot."], "why": "Anyone can measure the boot's mass on a balance.<br>Measuring does not change the boot into anything else.<br>So the mass is a physical property; the gift and the price are about people."}], "pp100": [{"d": "easy", "atom": "MAT-005", "stem": "Which of the following is a physical property of a seashell?", "options": ["the store that sold the shell", "the shell's color", "the shell's owner", "the shell's price"], "key": 1, "why": "Anyone can see the shell's color without changing the shell into anything else.<br>The store, the owner and the price are about people, not about the shell."}, {"d": "easy", "atom": "MAT-006", "stem": "A balance shows 640 for a shoe. Which unit belongs after the number?", "options": ["milliliters (mL)", "centimeters (cm)", "degrees Celsius (°C)", "grams (g)"], "key": 3, "why": "A balance measures mass in grams (g) or kilograms (kg).<br>So the shoe's reading is 640 g.<br>Milliliters measure volume, centimeters measure length, and degrees Celsius measure temperature."}, {"d": "easy", "atom": "MAT-007", "stem": "What does a graduated cylinder measure?", "options": ["the volume of a liquid", "the mass of a liquid", "the height of a liquid", "the temperature of a liquid"], "key": 0, "why": "A graduated cylinder measures the volume of a liquid in milliliters.<br>A balance measures mass, and a thermometer measures temperature.<br>The height of the liquid in the cylinder is not its volume; the scale turns the height into a volume."}, {"d": "easy", "atom": "MAT-012", "stem": "Cornmeal is stirred into cold water. The grains sink and sit on the bottom. Which word describes cornmeal in water?", "options": ["soluble", "dissolved", "insoluble", "melted"], "key": 2, "why": "The cornmeal grains stayed whole and sat on the bottom, so the cornmeal did not dissolve.<br>A material that does not dissolve in water is called insoluble.<br>Nothing melted: no heat turned a solid into a liquid."}, {"d": "easy", "atom": "MAT-013", "stem": "A material that lets electricity pass through easily is called…", "options": ["a magnet", "an insulator", "a metal", "a conductor"], "key": 3, "why": "A material that lets heat or electricity pass through easily is called a conductor.<br>Metals are conductors, but the name for the property is conductor.<br>A material that does not let electricity through is called an insulator."}, {"d": "easy", "atom": "MAT-006", "stem": "A skateboard reads 3000 g on a balance. A helmet has less mass than the skateboard. Which could be the helmet's reading on the same balance?", "options": ["400 g", "3000 g", "3200 g", "5000 g"], "key": 0, "why": "A smaller balance reading means less mass.<br>The helmet has less mass than the skateboard, so its reading is below 3000 g.<br>Only 400 g is below 3000 g."}, {"d": "easy", "atom": "MAT-005", "stem": "A student lists facts about a leather belt: it is brown, it is 90 cm long, it was a gift, it has a mass of 150 g. Which fact is NOT a physical property?", "options": ["The belt is brown.", "The belt was a gift.", "The belt is 90 cm long.", "The belt has a mass of 150 g."], "key": 1, "why": "A gift is about the giver, not the belt; nobody can find it by looking or measuring.<br>The color, the length and the mass can each be checked without changing the belt."}, {"d": "easy", "atom": "MAT-005", "stem": "A student wants to find a physical property of a pinecone. Which of these should she do?", "options": ["Ask her friend how much the pinecone is worth.", "Look up who owns the hill where she found it.", "Write down the day she found the pinecone.", "Put the pinecone on a balance."], "key": 3, "why": "A physical property is something you can observe or measure about a material without changing it into anything else.<br>A balance measures the pinecone's mass, and the pinecone is unchanged afterward.<br>The price, the owner and the day are facts about people, not about the pinecone."}, {"d": "easy", "atom": "MAT-005", "stem": "A physical property is something you can observe or measure about a material without…", "options": ["using a balance, a ruler or a thermometer.", "touching it with your hands.", "changing it into anything else.", "changing its shape or size."], "key": 2, "why": "Measuring with a tool and touching are both ways to check a physical property.<br>Changing a material's shape or size leaves it the same material.<br>The one thing a check must not do is change the material into anything else."}, {"d": "easy", "atom": "MAT-006", "stem": "Which of these changes the mass of the onions in a sack?", "options": ["taking two onions out", "pouring the onions into a bigger sack", "pressing the onions flatter", "turning the sack upside down"], "key": 0, "why": "Mass is the amount of material in something.<br>Taking two onions out removes material, so the mass of the onions goes down.<br>A bigger sack, flatter onions and an upside-down sack still hold the same onions, so their mass is unchanged."}, {"d": "easy", "atom": "MAT-006", "stem": "A bag of birdseed reads 2 kg on a balance. A box of dominoes has the same mass as the bag. What does the box read on the same balance?", "options": ["less than 2 kg", "2 kg", "more than 2 kg", "It depends on the size of the box."], "key": 1, "why": "A balance reading is the mass of the thing on it.<br>The box has the same mass as the bag.<br>So the box reads the same as the bag: 2 kg.<br>Size is a different property, so the size of the box does not change the reading."}, {"d": "easy", "atom": "MAT-007", "stem": "A student reads the volume of juice in a graduated cylinder. Where should her eyes be?", "options": ["level with the flat top of the juice", "above the cylinder, looking down into it", "level with the 0 mark at the bottom", "anywhere, as long as she can see the numbers"], "key": 0, "why": "To read a graduated cylinder, find the flat top of the liquid with your eyes level with it.<br>Then read the flat top against the nearest mark.<br>Looking down from above, or up from the bottom, puts the flat top against the wrong mark."}, {"d": "easy", "atom": "MAT-007", "stem": "A pour of lotion and a pour of vinegar each fill a graduated cylinder to the same mark. What does this show is the same about the two pours?", "options": ["the amount of material in them", "how warm they are", "their color", "the space they take up"], "key": 3, "why": "A graduated cylinder measures volume: the space a liquid takes up.<br>Both pours reach the same mark, so both take up the same space.<br>Lotion and vinegar are different materials, so the same mark does not mean the same amount of material.<br>The reading says nothing about warmth or color."}, {"d": "easy", "atom": "MAT-012", "stem": "Which observation shows that a material is insoluble in water?", "options": ["The material vanishes into the water.", "The pieces sit whole on the bottom.", "The water tastes of the material.", "The water turns one color all through."], "key": 1, "why": "An insoluble material does not dissolve: it does not break into particles too small to see.<br>Its pieces stay big enough to see and sit on the bottom.<br>Vanishing, a new taste and a color all through the water are signs that a material dissolved."}, {"d": "easy", "atom": "MAT-012", "stem": "Which of these is insoluble in water?", "options": ["drink powder", "salt", "sand", "sugar"], "key": 2, "why": "Drink powder, salt and sugar dissolve in water: each breaks into particles too small to see and spreads through the water.<br>Sand does not dissolve, however long you stir.<br>A material that does not dissolve is insoluble.<br>So sand is insoluble in water."}, {"d": "easy", "atom": "MAT-013", "stem": "Metals conduct…", "options": ["heat only.", "electricity only.", "both heat and electricity.", "neither heat nor electricity."], "key": 2, "why": "A metal spoon in hot soup gets hot along its handle, so metals let heat through.<br>A metal strip between the clips of a circuit lights the bulb, so metals let electricity through.<br>Metals conduct both heat and electricity."}, {"d": "easy", "atom": "MAT-013", "stem": "A material is put between the two clips of a simple circuit. What shows that the material lets electricity through?", "options": ["The material gets hot.", "The bulb lights.", "The bulb stays dark.", "The clips get warm."], "key": 1, "why": "The material sits between the two clips of a simple circuit.<br>If the material lets electricity through, electricity reaches the bulb.<br>So the bulb lights.<br>If the material does not let electricity through, the bulb stays dark."}, {"d": "easy", "atom": "MAT-012", "stem": "A spoonful of red fabric dye powder stirred into water vanishes, and the water turns red all through. A spoonful of tiny red plastic beads stirred into water sinks to the bottom, and the water stays clear. Which is soluble in water?", "options": ["the dye powder", "the plastic beads", "both", "neither"], "key": 0, "why": "The dye powder vanished and colored all the water, so it broke into particles too small to see and spread through the water.<br>The dye powder dissolved, so it is soluble.<br>The beads stayed whole on the bottom, so the beads did not dissolve.<br>The beads are insoluble."}, {"d": "medium", "atom": "MAT-006", "stem": "A large cardboard box reads 600 g on a balance. A small dumbbell reads 2000 g on the same balance. How can you tell that the dumbbell has more mass than the box?", "options": ["The dumbbell's balance reading is bigger.", "The dumbbell is smaller, and smaller things always have more mass.", "The dumbbell is made of metal, and metal always has more mass.", "The dumbbell takes up less room."], "key": 0, "why": "Only the balance reading shows which has more mass.<br>The dumbbell reads 2000 g and the box reads 600 g, so the dumbbell has more mass.<br>Size is a different property: a smaller thing can have more or less mass."}, {"d": "medium", "atom": "MAT-007", "fig": "cyl_175_syrup", "stem": "Maple syrup has settled in the graduated cylinder in the drawing. What is the volume of the syrup?", "options": ["150 mL", "170 mL", "175 mL", "200 mL"], "key": 2, "why": "Find the flat top of the syrup.<br>The flat top sits on the small mark halfway between 150 and 200.<br>Halfway between 150 mL and 200 mL is 175 mL."}, {"d": "medium", "atom": "MAT-007", "stem": "Fruit punch from a wide bowl fills a graduated cylinder to 900 mL. The punch is poured back into a tall pitcher, where it stands much higher than it did in the bowl. What is the volume of the punch in the pitcher?", "options": ["more than 900 mL", "exactly 900 mL", "less than 900 mL", "The volume cannot be known without measuring again."], "key": 1, "why": "The amount of liquid does not change when it is poured.<br>The punch measured 900 mL, so its volume is still 900 mL in the pitcher.<br>The punch stands higher because the pitcher is narrower; eyes judge height, not volume."}, {"d": "medium", "atom": "MAT-012", "stem": "A spoonful of laundry detergent is stirred into a bucket of water. The powder disappears, and the whole bucket of water feels slippery. What happened to the detergent?", "options": ["The detergent turned into water.", "The detergent melted into a liquid and mixed with the water.", "The detergent sank to the bottom, where nobody can see it.", "The detergent broke into particles too small to see."], "key": 3, "why": "The detergent broke into particles too small to see.<br>The particles spread through all the water, so the whole bucket feels slippery.<br>Breaking into particles too small to see and spreading through the water is dissolving, so the detergent is soluble."}, {"d": "medium", "atom": "MAT-013", "stem": "A student wants to know whether a nickel coin lets electricity through. Which test should she use?", "options": ["Hold the coin in hot water and feel whether it gets hot.", "Stir the coin into a glass of water and watch whether it disappears.", "Put the coin on a balance and read the number.", "Put the coin between the clips of a simple circuit."], "key": 3, "why": "Put the material between the clips of a simple circuit; if the bulb lights, the material lets electricity through.<br>Heat, dissolving and mass are different properties, so their tests do not show whether electricity passes."}, {"d": "medium", "atom": "MAT-013", "stem": "A cook wants a frying-pan handle that stays cool while the pan is on the stove. Which material should the handle be made of?", "options": ["plastic", "copper", "iron", "aluminum"], "key": 0, "why": "A handle that stays cool must hardly let heat through, so it must be an insulator.<br>Copper, iron and aluminum are metals, and metals conduct heat; plastic is an insulator."}, {"d": "medium", "atom": "MAT-005", "stem": "Jade describes a marble tile: smooth, 30 cm long, gray. Diego describes the same tile: cost 5 dollars, belongs to the school, bought in May. Whose facts are all physical properties?", "options": ["Diego's facts only", "both students' facts", "Jade's facts only", "neither student's facts"], "key": 2, "why": "Anyone can feel that the tile is smooth, measure 30 cm and see that it is gray, without changing the tile.<br>The price, the owner and the month are about people, not about the tile.<br>So only Jade's facts are physical properties."}, {"d": "medium", "atom": "MAT-005", "stem": "Maria lists facts about her scooter: it is blue, its mass is 4 kg, it was a birthday present, it is 80 cm long. How many of these facts are physical properties?", "options": ["one", "two", "three", "four"], "key": 2, "why": "The color, the mass and the length can each be seen or measured without changing the scooter.<br>The present is about the giver, not the scooter.<br>So three of the four facts are physical properties."}, {"d": "medium", "atom": "MAT-005", "stem": "Emma says her canteen holds 300 mL. Why is that a physical property of the canteen?", "options": ["Anyone can measure it without changing the canteen.", "Every fact with a number in it is a physical property.", "Emma owns the canteen, so its facts belong to her.", "A canteen is made for holding drinks."], "key": 0, "why": "Anyone can pour the canteen's water into a graduated cylinder and read 300 mL.<br>Measuring does not change the canteen into anything else.<br>So the 300 mL belongs to the canteen, and it is a physical property.<br>A number alone does not make a fact a physical property: a price has a number too."}, {"d": "medium", "atom": "MAT-005", "stem": "Three students, each with a different ruler, measure the same paintbrush. Each gets 20 cm. Why do they all get the same length?", "options": ["Rulers always agree with one another.", "The length belongs to the paintbrush.", "Every paintbrush is 20 cm long.", "A length is whatever the first person to measure it says."], "key": 1, "why": "A physical property belongs to the material itself.<br>The paintbrush's length is a physical property.<br>Anyone who measures the paintbrush finds the same length, whoever they are and whichever ruler they use.<br>So all three students get 20 cm."}, {"d": "medium", "atom": "MAT-006", "stem": "A lump of putty reads 90 g on a balance. A student flattens the lump into a thin pancake. What does the balance read for the pancake?", "options": ["less than 90 g", "90 g", "more than 90 g", "It depends on how thin the pancake is."], "key": 1, "why": "Mass is the amount of material in something.<br>Flattening the putty changes its shape, but no putty was added or taken away.<br>The same putty is on the balance, so the balance still reads 90 g."}, {"d": "medium", "atom": "MAT-006", "stem": "A block of tofu reads 500 g on a balance. A cook cuts the block into two equal pieces. What is the mass of each piece?", "options": ["125 g", "250 g", "500 g", "1000 g"], "key": 1, "why": "Mass is the amount of material in something.<br>The cook splits the tofu into two equal pieces, so each piece holds half the material.<br>Half of 500 g is 250 g.<br>So each piece has a mass of 250 g."}, {"d": "medium", "atom": "MAT-007", "fig": "cyl2_thermos_skillet", "stem": "The drawing shows the water from a thermos and the water from a skillet, each poured into a graduated cylinder. Before it was poured, the water stood much higher in the thermos than in the skillet. Why did the water stand higher in the thermos?", "options": ["The thermos is narrower than the skillet.", "The thermos held more water than the skillet.", "The thermos is taller than the skillet.", "The water in the thermos was warmer."], "key": 0, "why": "Both readings sit on the 250 mark, so the thermos and the skillet held the same volume, 250 mL.<br>A narrow container makes the same water stand high.<br>A wide container spreads the same water low.<br>Height alone does not lift the water: a tall, wide pot would still spread it low."}, {"d": "medium", "atom": "MAT-007", "stem": "A recipe needs 125 mL of coconut water. On a graduated cylinder numbered every 50 mL, with a small mark halfway between the numbers, where should the flat top of the coconut water sit?", "options": ["on the 100 mark", "on the small mark between the 100 and 150 marks", "on the 150 mark", "on the small mark between the 150 and 200 marks"], "key": 1, "why": "The small mark halfway between two numbered marks is 25 mL more than the lower one.<br>Halfway between 100 mL and 150 mL is 125 mL.<br>So the flat top of the coconut water should sit on the small mark between the 100 and 150 marks."}, {"d": "medium", "atom": "MAT-012", "stem": "A pat of margarine is dropped into a pot of hot water. It turns into a runny yellow liquid that floats on the water. What happened to the margarine?", "options": ["It melted.", "It dissolved.", "It melted, then dissolved.", "It turned into water."], "key": 0, "why": "Dissolving is breaking into particles too small to see and spreading through the water.<br>The margarine did not spread through the water: the yellow liquid floats on top, plain to see.<br>Heat turned the solid margarine into a liquid.<br>A solid turning into a liquid is melting."}, {"d": "medium", "atom": "MAT-013", "stem": "A screwdriver has a steel shaft and a plastic handle. Which part lights the bulb when it is put between the clips of a simple circuit?", "options": ["both parts", "neither part", "the plastic handle", "the steel shaft"], "key": 3, "why": "Steel is a metal, and metals conduct electricity.<br>So the steel shaft between the clips lets electricity through, and the bulb lights.<br>Plastic is an insulator.<br>So the plastic handle between the clips leaves the bulb dark."}, {"d": "medium", "atom": "MAT-013", "stem": "A cook lifts a hot baking sheet with a thick cloth pot holder, and her hand stays comfortable. Why does the pot holder keep her hand from burning?", "options": ["Cloth soaks up the heat and stores it.", "Cloth pushes the heat back into the sheet.", "Cloth hardly lets heat through.", "Cloth is colder than the sheet."], "key": 2, "why": "Cloth is an insulator.<br>An insulator hardly lets heat through.<br>So the heat from the baking sheet hardly travels through the pot holder to the cook's hand.<br>Her hand stays comfortable."}, {"d": "hard", "atom": "MAT-006", "stem": "Two backpacks are the same size. Sam says: \"The two backpacks must have the same mass, because they are the same size.\" Sam is wrong. What shows which backpack has more mass?", "options": ["the size of each backpack", "how full each backpack looks", "a balance reading for each backpack", "the shape of each backpack"], "key": 2, "why": "Size and mass are different properties.<br>Two things the same size can have different masses.<br>Looks do not show mass either.<br>So only a balance reading shows which backpack has more mass."}, {"d": "hard", "atom": "MAT-007", "stem": "Water stands higher in Theo's tall narrow can than in his wide low tray. Theo says: \"The can holds more water.\" Which statement is correct?", "options": ["The can holds more water.", "The tray holds more water.", "The can and the tray hold the same water.", "Either container could hold more water."], "key": 3, "why": "Eyes judge the height of the water, not its volume.<br>A high level in a narrow can may be a small volume, and a low level in a wide tray may be a large volume.<br>Only a graduated cylinder reading shows which held more, so Theo cannot be sure."}, {"d": "hard", "atom": "MAT-012", "stem": "Cara stirs powdered fertilizer into a watering can until the powder vanishes. She pours the first half of the water onto one plant and the second half onto another. Which statement is correct?", "options": ["Both plants get fertilizer.", "Only the first plant gets fertilizer.", "Only the second plant gets fertilizer.", "Neither plant gets fertilizer."], "key": 0, "why": "The fertilizer dissolved: it broke into particles too small to see.<br>Those particles spread through all the water in the can.<br>So every pour carries fertilizer, and both plants get some."}, {"d": "hard", "atom": "MAT-013", "stem": "One end of a rod is held in hot water, and the other end quickly gets hot. A student puts the rod between the clips of a simple circuit, and the bulb lights. Which of these could the rod be made of?", "options": ["glass", "metal", "wood", "rubber"], "key": 1, "why": "Heat traveled through the rod, so the rod lets heat through.<br>The bulb lit, so the rod lets electricity through.<br>Metals conduct both heat and electricity; glass, wood and rubber conduct neither."}, {"d": "hard", "atom": "MAT-005", "stem": "A student says: \"Whether a material conducts electricity is not a physical property, because you need a circuit to find out.\" The student is wrong: conducting electricity is a physical property. Why?", "options": ["Electricity is a kind of matter.", "Every property that needs a test is physical.", "The circuit test does not change the material into anything else.", "Conducting electricity is a property of every material."], "key": 2, "why": "A physical property is something you can observe or measure about a material without changing it into anything else.<br>The circuit test observes the material, and the material is unchanged afterward.<br>So conducting electricity is a physical property."}, {"d": "hard", "atom": "MAT-005", "stem": "Felix says: \"The color of my kayak is not a physical property, because I could paint it a different color.\" Felix is wrong: the color is a physical property. Why?", "options": ["A physical property is anything you can say about an object.", "The kayak has had the same color since it was made.", "A color can never be changed.", "Anyone can see the color wi
