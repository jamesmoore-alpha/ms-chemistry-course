<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="100%" role="img" aria-label="The spoon's facts sorted into two columns: physical properties on the left, facts about the owner on the right" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="200" fill="#ffffff"/><rect x="20" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><line x1="280" y1="10" x2="280" y2="178" stroke="#222"/><text x="150" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">physical properties</text><text x="410" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">not physical properties</text><rect x="20" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">shiny</text><text x="410" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">my favorite spoon</text><rect x="20" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hard</text><text x="410" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a present</text><rect x="20" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cold to touch</text><text x="410" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cost two dollars</text><rect x="20" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">15 cm long</text><text x="410" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">bought last year</text><rect x="20" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">mass 40 g</text></svg>