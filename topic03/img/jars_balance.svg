<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 240" width="100%" role="img" aria-label="Two balances: a jar of peanut butter reads 500 g; a jar of cotton balls the same size reads 60 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="240" fill="#ffffff"/><rect x="40" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="80" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">500 g</text><rect x="85" y="90" width="60" height="60" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="93" y="82" width="44" height="10" fill="#d9d9d9" stroke="#222"/><rect x="88" y="96" width="54" height="52" fill="#555"/><text x="115" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">peanut butter</text><rect x="320" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="320" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="360" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="395" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">60 g</text><rect x="365" y="90" width="60" height="60" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="373" y="82" width="44" height="10" fill="#d9d9d9" stroke="#222"/><circle cx="377" cy="104" r="7" fill="#ffffff" stroke="#222"/><circle cx="395" cy="104" r="7" fill="#ffffff" stroke="#222"/><circle cx="413" cy="104" r="7" fill="#ffffff" stroke="#222"/><circle cx="377" cy="122" r="7" fill="#ffffff" stroke="#222"/><circle cx="395" cy="122" r="7" fill="#ffffff" stroke="#222"/><circle cx="413" cy="122" r="7" fill="#ffffff" stroke="#222"/><circle cx="377" cy="140" r="7" fill="#ffffff" stroke="#222"/><circle cx="395" cy="140" r="7" fill="#ffffff" stroke="#222"/><circle cx="413" cy="140" r="7" fill="#ffffff" stroke="#222"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cotton balls</text><text x="255" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Two jars the same size.</text><text x="255" y="48" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The peanut butter has far more mass.</text></svg>