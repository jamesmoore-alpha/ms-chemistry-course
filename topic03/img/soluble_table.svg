<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 144" width="100%" role="img" aria-label="Five materials sorted: sugar, salt and drink powder dissolve; sand and chalk do not" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="144" fill="#ffffff"/><rect x="20" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><line x1="280" y1="10" x2="280" y2="122" stroke="#222"/><text x="150" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soluble in water</text><text x="410" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">insoluble in water</text><rect x="20" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sugar</text><text x="410" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sand</text><rect x="20" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">salt</text><text x="410" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">chalk</text><rect x="20" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="150" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">drink powder</text></svg>