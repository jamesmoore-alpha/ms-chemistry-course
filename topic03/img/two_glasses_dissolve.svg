<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" width="100%" role="img" aria-label="Two glasses after stirring: clear sugar water on the left, water with sand on the bottom on the right" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="250" fill="#ffffff"/><path d="M 60 40 L 70 190 L 150 190 L 160 40" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="63,70 157,70 150,189 70,189" fill="#d9d9d9" opacity="0.9"/><text x="110" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar stirred into</text><text x="110" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water: the sugar</text><text x="110" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">dissolved</text><path d="M 300 40 L 310 190 L 390 190 L 400 40" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="303,70 397,70 390,189 310,189" fill="#d9d9d9" opacity="0.9"/><path d="M 310 190 L 390 190 q -20 -25 -40 -14 q -20 -8 -38 14 z" fill="#555" stroke="#222"/><text x="350" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sand stirred into water:</text><text x="350" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sand sits on the</text><text x="350" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bottom</text><text x="110" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soluble</text><text x="350" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">insoluble</text></svg>