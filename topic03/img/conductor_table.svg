<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 196" width="100%" role="img" aria-label="A table of four materials against two tests: steel and copper let heat and electricity through; wood and plastic let neither through" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="196" fill="#ffffff"/><rect x="20" y="10" width="480" height="28" fill="#f1f1f1" stroke="#222"/><text x="100" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">material</text><text x="260" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lets heat through?</text><text x="420" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lets electricity through?</text><rect x="20" y="38" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="100" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">steel</text><text x="260" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="420" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="66" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="100" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">copper</text><text x="260" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="420" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="94" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="100" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">wood</text><text x="260" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="420" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="20" y="122" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="100" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">plastic</text><text x="260" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="420" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="260" y="178" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Metals conduct both. Wood and plastic conduct neither.</text></svg>