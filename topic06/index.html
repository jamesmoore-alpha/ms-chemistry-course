 so this is not a solution."}, {"type": "mcq", "tag": "fluency", "stem": "Bath salts dropped into a warm bath vanish into the water. Is the bath water a solution?", "options": ["yes", "no"], "key": 0, "fb": ["The bath salts dissolved evenly into the water.", "The salts vanished and spread through the water: they dissolved evenly."], "why": "The bath salts vanished and spread through the water.<br>So the salts dissolved evenly into the water.<br>One substance dissolved evenly into another makes a solution."}, {"type": "mcq", "tag": "misconception", "stem": "Aarav stirs sugar into lemonade until it vanishes. He says: \"The sugar is gone now, so the lemonade has no sugar in it.\" Is Aarav correct?", "options": ["yes", "no"], "key": 1, "fb": ["The sugar broke into particles too small to see and spread through the lemonade. Every sip is sweet, so the sugar is still there.", "The sugar broke into particles too small to see and spread through the lemonade. Every sip is sweet, so the sugar is still there."], "why": "Dissolving breaks the sugar into particles too small to see.<br>Those particles are spread evenly through the lemonade.<br>Every sip is sweet, so the sugar is still there, and Aarav is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The drink mix vanished into the water and spread evenly through it. Which glass held a solution?", "options": ["the drink mix glass", "the flour glass", "both glasses"], "key": 0, "fb": ["The drink mix dissolved evenly into the water: a solution.", "The flour stayed as grains and settled, so it did not dissolve.", "Only the drink mix dissolved. The flour glass holds a mixture that is not a solution."], "why": "A mixture in which one substance has dissolved evenly into another is called a solution.<br>The drink mix dissolved evenly; the flour stayed as grains.<br>So only the drink mix glass held a solution."}]}, {"id": "L02", "atom": "MAT-034", "title": "The two parts of a solution: solute and solvent", "video": "could do without a video", "lesson_type": "Naming routine (label the two parts of any solution) taught on one recipe, then a fluency run; coins solute and solvent after the plain jobs (dissolves; does the dissolving)", "check_design": "Type (a) one-step routine → one recall MCQ (L01: powdered lemonade that spreads evenly is a solution), the two coined terms (typed ×2, then a meaning MCQ for the solvent and one for the solute), then a fluency quiz: name the solute or the solvent ×8 in fresh solutions (instant coffee in hot water; carbon dioxide in sparkling water; salt in sea water; drink mix in hot milk; ink in water; laundry soap in water; oxygen in fish-tank water; vinegar in water), keys 0 0 1 1 0 1 1 0 across the two named substances, then one student-claim item (Hassan: the water is the solute because it is a liquid; key no). Quiz 14.", "headache": ["A recipe card for hummingbird nectar reads: dissolve 50 g of sugar in 200 mL of water.", "Two substances make this solution.", "One of them dissolves; the other does the dissolving.", "Which is which?"], "forest": ["What are the two parts of a solution called?", "The substance that dissolves is called the solute: here, the sugar.", "The substance it dissolves into is called the solvent: here, the water.", "The solvent is usually a liquid, and there is usually more of it.", "Solute plus solvent makes a solution."], "article": [{"t": "idea", "text": "A recipe card for hummingbird nectar reads: dissolve 50 g of sugar in 200 mL of water."}, {"t": "idea", "text": "Two substances make this solution."}, {"t": "idea", "text": "One of them dissolves; the other does the dissolving."}, {"t": "idea", "text": "Which is which?"}, {"t": "h", "text": "Solution, again"}, {"t": "idea", "text": "A mixture in which one substance has dissolved evenly into another is called a solution."}, {"t": "idea", "text": "The nectar is a solution: the sugar has dissolved evenly into the water."}, {"t": "h", "text": "The two jobs"}, {"t": "idea", "text": "The sugar breaks into particles too small to see."}, {"t": "idea", "text": "The sugar particles spread out among the water particles."}, {"t": "idea", "text": "So the sugar is the substance that dissolves."}, {"t": "idea", "text": "The water takes the sugar particles in and spreads them out."}, {"t": "idea", "text": "So the water is the substance that does the dissolving."}, {"t": "fig", "key": "nectar_card", "cap": "The recipe card with the two jobs labeled: the sugar dissolves, so it is the solute; the water does the dissolving, so it is the solvent. Solute plus solvent makes the solution."}, {"t": "h", "text": "Two names for the two jobs"}, {"t": "idea", "text": "The substance that dissolves is called the <b>solute<\/b>."}, {"t": "idea", "text": "In the nectar, the sugar is the solute."}, {"t": "idea", "text": "The substance the solute dissolves into is called the <b>solvent<\/b>."}, {"t": "idea", "text": "In the nectar, the water is the solvent."}, {"t": "idea", "text": "Solute plus solvent makes a solution."}, {"t": "h", "text": "Telling them apart"}, {"t": "idea", "text": "The solvent is usually a liquid."}, {"t": "idea", "text": "There is usually much more of the solvent."}, {"t": "idea", "text": "The solute can be a solid, a liquid or a gas."}, {"t": "idea", "text": "There is usually less of the solute."}, {"t": "idea", "text": "Ask which substance vanished into the other: that one is the solute."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider soda water: carbon dioxide gas dissolved in water."}, {"t": "idea", "text": "The gas dissolved into the water, so the gas is the solute and the water is the solvent."}, {"t": "idea", "text": "Now consider sweet tea made with a spoon of honey."}, {"t": "idea", "text": "The honey dissolved into the tea, so the honey is the solute and the tea is the solvent."}, {"t": "idea", "text": "Now consider a drop of food coloring stirred into a jar of water."}, {"t": "idea", "text": "The coloring vanished into the water, so the coloring is the solute and the water is the solvent."}, {"t": "fig", "key": "solute_solvent_table", "cap": "Five solutions in one table, each with its solute and its solvent. The solute is the one that dissolves; the solvent is the one that does the dissolving."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The substance that dissolves is called the solute. The substance it dissolves into is called the solvent. The solvent is usually a liquid, and there is usually more of it. Solute plus solvent makes a solution."}, {"t": "idea", "text": "Back to the recipe: the sugar dissolves, so the sugar is the solute."}, {"t": "idea", "text": "The water does the dissolving, so the water is the solvent."}], "script": [{"say": "A recipe card for hummingbird nectar reads: dissolve fifty grams of sugar in two hundred milliliters of water.", "screen": "[the recipe card]"}, {"say": "Two substances make this solution: one dissolves, and the other does the dissolving.", "screen": "[SUGAR and WATER highlighted on the card]"}, {"say": "Which is which?", "screen": "[question mark]"}, {"say": "The sugar breaks into particles too small to see and spreads out among the water particles.", "screen": "[sample box: open sugar particles spreading among filled water particles]"}, {"say": "So the sugar is the substance that dissolves.", "screen": "[arrow from SUGAR: dissolves]"}, {"say": "The water takes the sugar particles in and spreads them out, so the water does the dissolving.", "screen": "[arrow from WATER: does the dissolving]"}, {"say": "The substance that dissolves is called the solute.", "screen": "[chip: SOLUTE, under the sugar]"}, {"say": "The substance the solute dissolves into is called the solvent.", "screen": "[chip: SOLVENT, under the water]"}, {"say": "Solute plus solvent makes a solution.", "screen": "[solute + solvent → solution]"}, {"say": "The solvent is usually a liquid, and there is usually much more of it.", "screen": "[20  "fb": ["The solvent does the dissolving, and the solute dissolves into it.", "The substance that vanishes into the other is the solute.", "There is usually less of the solute, not the solvent."], "why": "The substance that dissolves is called the solute.<br>The substance it dissolves into is called the solvent.<br>There is usually more of the solvent."}, {"type": "mcq", "tag": "term", "stem": "In a solution, which substance is the solute?", "options": ["the substance the other one dissolves into", "the substance that dissolves into the other", "the substance there is usually more of"], "key": 1, "fb": ["The substance the other one dissolves into is the solvent.", "The solute dissolves: it breaks into particles too small to see and spreads through the solvent.", "There is usually more of the solvent, not the solute."], "why": "The substance that dissolves is called the solute.<br>It breaks into particles too small to see and spreads through the other substance.<br>There is usually less of the solute."}, {"type": "mcq", "tag": "fluency", "stem": "Instant coffee dissolves in a mug of hot water. Which is the solute?", "options": ["the instant coffee", "the hot water"], "key": 0, "fb": ["The coffee dissolves, so the coffee is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance that dissolves is the solute.<br>The coffee dissolves into the water.<br>So the coffee is the solute."}, {"type": "mcq", "tag": "fluency", "stem": "Carbon dioxide gas is dissolved in a bottle of sparkling water. Which is the solute?", "options": ["the carbon dioxide gas", "the water"], "key": 0, "fb": ["The gas dissolved into the water, so the gas is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance that dissolves is the solute.<br>The gas dissolved into the water.<br>So the gas is the solute, even though it is a gas."}, {"type": "mcq", "tag": "fluency", "stem": "Salt is dissolved in sea water. Which is the solvent?", "options": ["the salt", "the water"], "key": 1, "fb": ["The salt dissolves, so the salt is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance the solute dissolves into is the solvent.<br>The salt dissolved into the water.<br>So the water is the solvent."}, {"type": "mcq", "tag": "fluency", "stem": "Drink mix dissolves in a cup of hot milk. Which is the solvent?", "options": ["the drink mix", "the milk"], "key": 1, "fb": ["The drink mix dissolves, so the drink mix is the solute.", "The milk does the dissolving, so the milk is the solvent."], "why": "The substance the solute dissolves into is the solvent.<br>The drink mix dissolved into the milk.<br>So the milk is the solvent, even though it is not water."}, {"type": "mcq", "tag": "fluency", "stem": "A drop of blue ink spreads through a jar of water. Which is the solute?", "options": ["the ink", "the water"], "key": 0, "fb": ["The ink vanished into the water, so the ink is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "Ask which substance vanished into the other.<br>The ink vanished into the water.<br>So the ink is the solute."}, {"type": "mcq", "tag": "fluency", "stem": "Laundry soap dissolves in a tub of water. Which is the solvent?", "options": ["the soap", "the water"], "key": 1, "fb": ["The soap dissolves, so the soap is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance the solute dissolves into is the solvent.<br>The soap dissolved into the water.<br>So the water is the solvent."}, {"type": "mcq", "tag": "fluency", "stem": "Oxygen gas is dissolved in a fish tank's water. Which is the solvent?", "options": ["the oxygen", "the water"], "key": 1, "fb": ["The oxygen dissolved into the water, so the oxygen is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance the solute dissolves into is the solvent.<br>The oxygen gas dissolved into the water.<br>So the water is the solvent."}, {"type": "mcq", "tag": "fluency", "stem": "A splash of vinegar vanishes into a big pitcher of water. Which is the solute?", "options": ["the vinegar", "the water"], "key": 0, "fb": ["The vinegar vanished into the water, and there is far less of it: the solute.", "There is far more water, and it does the dissolving: the solvent."], "why": "Ask which substance vanished into the other.<br>The vinegar vanished into the water, and there is far less of it.<br>So the vinegar is the solute, even though both are liquids."}, {"type": "mcq", "tag": "misconception", "stem": "Hassan looks at a glass of salt water. He says: \"The water is the solute, because water is a liquid.\" Is Hassan correct?", "options": ["yes", "no"], "key": 1, "fb": ["Liquid is not the test. The salt dissolved into the water, so the salt is the solute and the water is the solvent.", "Liquid is not the test. The salt dissolved into the water, so the salt is the solute and the water is the solvent."], "why": "The substance that dissolves is the solute.<br>The salt dissolved into the water, so the salt is the solute.<br>The water did the dissolving, so the water is the solvent, and Hassan is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the hummingbird nectar, the sugar dissolved into the water. Which one is the solute?", "options": ["the sugar", "the water"], "key": 0, "fb": ["The substance that dissolves is the solute.", "The water did the dissolving, so the water is the solvent."], "why": "The substance that dissolves is called the solute.<br>The sugar dissolved into the water.<br>So the sugar is the solute, and the water is the solvent."}]}, {"id": "L03", "atom": "MAT-035", "title": "How concentrated? More solute in the same solvent", "video": "could do without a video", "lesson_type": "Comparison routine (which solution is more concentrated, and the order of three) taught on three mugs and two pitchers, every comparison a drawn table; coins concentration after the plain words", "check_design": "Type (a) one-step comparison → one recall MCQ (L02: plant food dissolved in water, which is the solvent), the coined term (typed, then a meaning MCQ), then a fluency quiz: which is more concentrated ×6, each pair a drawn table (three with the same water and different solute; three with the same solute and different water), keys B A A B A B, then most / least on two drawn three-row tables, then one student-claim item (Keiko: the bigger pitcher is more concentrated because it is bigger; key no; her two containers drawn as a table, ct_keiko).", "headache": ["A student has three mugs, each holding 200 mL of hot water.", "She stirs 5 g of instant coffee into the first mug, 10 g into the second, and 20 g into the third.", "All the coffee dissolves in every mug.", "The third mug is by far the darkest, and it tastes by far the strongest.", "What is different about the third mug?"], "forest": ["What makes one solution stronger than another?", "The third mug has more solute in the same amount of solvent.", "How much solute is dissolved in a given amount of solvent is called the concentration.", "More solute in the same solvent means more concentrated.", "The same solute in more solvent means less concentrated."], "article": [{"t": "idea", "text": "A student has three mugs, each holding 200 mL of hot water."}, {"t": "idea", "text": "She stirs 5 g of instant coffee into the first mug, 10 g into the second, and 20 g into the third."}, {"t": "idea", "text": "All the coffee dissolves in every mug."}, {"t": "idea", "text": "The third mug is by far the darkest, and it tastes by far the strongest."}, {"t": "idea", "text": "What is different about the third mug?"}, {"t": "h", "text": "Solute and solvent, again"}, {"t": "idea", "text": "The substance that dissolves is called the solute."}, {"t": "idea", "text": "The substance it dissolves into is called the solvent."}, {"t": "idea", "text": "In every mug the coffee is the solute and the water is the solvent."}, {"t": "h", "text": "Same water, different coffee"}, {"t": "idea", "text": "Every mug holds the same 200 mL of water."}, {"t": "idea", "text": "The first mug holds 5 g of coffee in that water."}, {"t": "idea", "text": "The third mug holds 20 g of coffee in the same amount of water."}, {"t": "idea", "text": "So the third mug holds four times as much coffee in the same water."}, {"t": "idea", "text": "Each sip from the third mug carries more coffee, so it tastes stronger and looks darker."}, {"t": "fig", "key": "three_mugs", "cap": "The three mugs, each with 200 mL of water: 5 g, 10 g and 20 g of coffee. More coffee in the same water makes the drink darker and stronger."}, {"t": "h", "text": "A name for how much solute is in the solvent"}, {"t": "idea", "text": "How much solute is dissolved in a given amount of solvent is called the <b>concentration<\/b>."}, {"t": "idea", "text": "More solute in the same amount of solvent means a higher concentration: the solution is more concentrated."}, {"t": "idea", "text": "Less solute in the same amount of solvent means a lower concentration: the solution is less concentrated."}, {"t": "idea", "text": "The third mug is the most concentrated, and the first mug is the least concentrated."}, {"t": "fig", "key": "coffee_table", "cap": "The three mugs in one table, ordered from most to least concentrated. The water is the same in every row, so the coffee decides."}, {"t": "h", "text": "Same solute, different water"}, {"t": "idea", "text": "Now consider two pitchers, each with 30 g of sugar dissolved in it."}, {"t": "idea", "text": "Pitcher A holds 1,000 mL of water; pitcher B holds 500 mL of water."}, {"t": "idea", "text": "The same 30 g of sugar is spread through less water in pitcher B."}, {"t": "idea", "text": "Each sip from pitcher B carries more sugar, so pitcher B is more concentrated."}, {"t": "idea", "text": "The same solute in more solvent means less concentrated."}, {"t": "fig", "key": "pitchers_table", "cap": "The two pitchers in one table: the same 30 g of sugar, but pitcher B has half the water, so pitcher B is more concentrated."}, {"t": "h", "text": "How to compare two solutions"}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Find the amount that is the same in both: the solvent or the solute."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> If the solvent is the same, the solution with more solute is more concentrated."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> If the solute is the same, the solution with less solvent is more concentrated."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "How much solute is dissolved in a given amount of solvent is called the concentration. More solute in the same solvent means more concentrated. The same solute in more solvent means less concentrated."}, {"t": "idea", "text": "Back to the mugs: the water is the same in each, and the third mug holds the most coffee."}, {"t": "idea", "text": "So the third mug is the most concentrated, and the first mug is the least concentrated."}], "script": [{"say": "Three mugs each hold two hundred milliliters of hot water.", "screen": "[three mugs; label 200 mL on each]"}, {"say": "A student stirs five grams of instant coffee into the first, ten into the second, twenty into the third.", "screen": "[5 g, 10 g, 20 g spoon in; each stirred]"}, {"say": "All the coffee dissolves, but the third mug is by far the darkest and strongest.", "screen": "[the mugs shade pale, darker, darkest]"}, {"say": "What is different about the third mug?", "screen": "[question mark over the third mug]"}, {"say": "In every mug the coffee is the solute and the water is the solvent.", "screen": "[labels SOLUTE: coffee, SOLVENT: water]"}, {"say": "The water is the same in every mug, but the third holds four times the coffee.", "screen": "[table: 5 g, 10 g, 20 g against 200 mL, 200 mL, 200 mL]"}, {"say": "Each sip from the third mug carries more coffee, so it is stronger and darker.", "screen": "[a sip from each mug; more open particles in the third]"}, {"say": "How much solute is dissolved in a given amount of solvent is called the concentration.", "screen": "[chip: CONCENTRATION]"}, {"say": "More solute in the same solvent means more concentrated.", "screen": "[the table gains a column: most … least concentrated]"}, {"say": "Two pitchers each hold thirty grams of sugar: one in a thousand milliliters of water, one in five hundred.", "screen": "[two pitchers; 30 g in each; 1,000 mL and 500 mL]"}, {"say": "The same sugar in less water: the smaller pitcher is more concentrated.", "screen": "[pitcher B highlighted: MORE CONCENTRATED]"}, {"say": "The same solute in more solvent means less concentrated.", "screen": "[pitcher A: LESS CONCENTRATED]"}, {"say": "So here is the rule: more solute in the same solvent, more concentrated; the same solute in more solvent, less.", "screen": "[rule slide reuses the mugs table; rule text]"}, {"say": "Back to the mugs: same water, most coffee, so the third mug is the most concentrated.", "screen": "[the three mugs ordered]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Powdered plant food is dissolved in a can of water for a houseplant. Which is the solute?", "options": ["the plant food", "the water"], "key": 0, "fb": ["The plant food dissolves, so the plant food is the solute.", "The water does the dissolving, so the water is the solvent."], "why": "The substance that dissolves is the solute.<br>The plant food dissolved into the water.<br>So the plant food is the solute."}, {"type": "text", "tag": "term", "stem": "How much solute is dissolved in a given amount of solvent is called the…", "accept": ["concentration", "the concentration"], "why": "How much solute is dissolved in a given amount of solvent is called the concentration."}, {"type": "mcq", "tag": "term", "stem": "Two glasses hold the same amount of water, and one is called more concentrated. What does that mean?", "options": ["It has more solute in the same water.", "It holds more water than the other glass.", "Its solute has settled to the bottom."], "key": 0, "fb": ["More solute in the same amount of solvent is a higher concentration.", "The two glasses hold the same water. Concentration is about the solute in that water.", "A settled solute has not dissolved. Concentration is about dissolved solute."], "why": "Concentration is how much solute is dissolved in a given amount of solvent.<br>The water is the same in both glasses.<br>So the more concentrated glass has more solute dissolved in it."}, {"type": "mcq", "tag": "fluency", "fig": "ct_drink", "stem": "Which bottle is more concentrated?", "options": ["bottle A", "bottle B"], "key": 1, "fb": ["Both bottles hold 250 mL of water. Bottle A has less drink mix in it.", "Both bottles hold 250 mL of water, and bottle B has more drink mix in it."], "why": "The water is the same: 250 mL in each bottle.<br>Bottle B holds 25 g of drink mix; bottle A holds 10 g.<br>More solute in the same solvent means more concentrated, so bottle B."}, {"type": "mcq", "tag": "fluency", "fig": "ct_salt", "stem": "Which pot is more concentrated?", "options": ["pot A", "pot B"], "key": 0, "fb": ["Both pots hold 8 g of salt, and pot A has less water.", "Both pots hold 8 g of salt. Pot B spreads it through twice the water."], "why": "The salt is the same: 8 g in each pot.<br>Pot A holds 400 mL of water; pot B holds 800 mL.<br>The same solute in less solvent means more concentrated, so pot A."}, {"type": "mcq", "tag": "fluency", "fig": "ct_honey", "stem": "Which cup is more concentrated?", "options": ["cup A", "cup B"], "key": 0, "fb": ["Both cups hold 300 mL, and cup A has more honey in it.", "Both cups hold 300 mL. Cup B has less honey in it."], "why": "The water is the same: 300 mL in each cup.<br>Cup A holds 15 g of honey; cup B holds 5 g.<br>More solute in the same solvent means more concentrated, so cup A."}, {"type": "mcq", "tag": "fluency", "fig": "ct_choc", "stem": "Which thermos is more concentrated?", "options": ["thermos A", "thermos B"], "key": 1, "fb": ["Both thermoses hold 20 g of mix. Thermos A spreads it through far more water.", "Both thermoses hold 20 g of mix, and thermos B has less water."], "why": "The mix is the same: 20 g in each thermos.<br>Thermos A holds 1,000 mL of water; thermos B holds 400 mL.<br>The same solute in less solvent means more concentrated, so thermos B."}, {"type": "mcq", "tag": "fluency", "fig": "ct_sweetener", "stem": "Which glass is more concentrated?", "options": ["glass A", "glass B"], "key": 0, "fb": ["Both glasses hold 150 mL, and glass A has more sweetener in it.", "Both glasses hold 150 mL. Glass B has less sweetener in it."], "why": "The water is the same: 150 mL in each glass.<br>Glass A holds 3 g of sweetener; glass B holds 1 g.<br>More solute in the same solvent means more concentrated, so glass A."}, {"type": "mcq", "tag": "fluency", "fig": "ct_tanksalt", "stem": "Which tank is more concentrated?", "options": ["tank A", "tank B"], "key": 1, "fb": ["Both tanks hold 12 g of salt. Tank A spreads it through twice the water.", "Both tanks hold 12 g of salt, and tank B has less water."], "why": "The salt is the same: 12 g in each tank.<br>Tank A holds 6,000 mL of water; tank B holds 3,000 mL.<br>The same solute in less solvent means more concentrated, so tank B."}, {"type": "mcq", "tag": "fluency", "fig": "ct3_food_coloring", "stem": "Which jar is the most concentrated?", "options": ["jar A", "jar B", "jar C"], "key": 1, "fb": ["Every jar holds 300 mL. Jar A has the least coloring, 6 g.", "Every jar holds 300 mL, and jar B has the most coloring, 15 g.", "Every jar holds 300 mL. Jar C has 9 g, less than jar B."], "why": "The water is the same: 300 mL in every jar.<br>Jar B holds 15 g of coloring, more than jar C's 9 g or jar A's 6 g.<br>The most solute in the same solvent means the most concentrated, so jar B."}, {"type": "mcq", "tag": "fluency", "fig": "ct3_bath_salt", "stem": "Which tub is the least concentrated?", "options": ["tub A", "tub B", "tub C"], "key": 2, "fb": ["Every tub holds 10 g of bath salt. Tub A has 500 mL, less water than tub C.", "Every tub holds 10 g. Tub B has the least water, so it is the most concentrated.", "Every tub holds 10 g of bath salt, and tub C has the most water, 800 mL."], "why": "The bath salt is the same: 10 g in every tub.<br>Tub C holds 800 mL of water, more than tub A's 500 mL or tub B's 200 mL.<br>The same solute in the most solvent means the least concentrated, so tub C."}, {"type": "mcq", "tag": "misconception", "fig": "ct_keiko", "stem": "Keiko compares the small glass and the big pitcher. She says: \"The pitcher is more concentrated, because it is bigger.\" Is Keiko correct?", "options": ["yes", "no"], "key": 1, "fb": ["Size is not the test. The same 5 g is spread through ten times the water in the pitcher, so the pitcher is less concentrated.", "Size is not the test. The same 5 g is spread through ten times the water in the pitcher, so the pitcher is less concentrated."], "why": "Concentration is how much solute is dissolved in a given amount of solvent.<br>The same 5 g of powder is spread through 1,000 mL in the pitcher and 100 mL in the glass.<br>The same solute in more solvent means less concentrated, so Keiko is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The three mugs held the same water, and the third mug held the most coffee. Which mug was the most concentrated?", "options": ["the first mug", "the second mug", "the third mug"], "key": 2, "fb": ["The first mug held the least coffee in the same water: the least concentrated.", "The second mug held less coffee than the third.", "More solute in the same solvent means more concentrated."], "why": "The water was the same in every mug.<br>The third mug held the most coffee.<br>More solute in the same solvent means more concentrated, so the third mug."}]}, {"id": "L04", "atom": "MAT-036", "title": "Adding water: diluting a solution", "video": "definitely a video", "lesson_type": "Transformation lesson (what adding solvent does to a solution, with the particle reason); coins dilute after the plain event", "check_design": "Type (c) concept understanding → one recall MCQ (L03: same water, more sugar is more concentrated), the coined term (typed, then a meaning MCQ), then the what (apple juice filled up with water: concentration down), the why (free response), a student-claim misconception (Freya: the water washed some syrup away; key no), transfer ×2 (salty broth with a cup of water; tea to taste weaker), a boundary case (a second spoon of powder: concentration up, not diluting) and an amount item (the honey is all still there: 25 g).", "headache": ["A glass holds a dark, strong drink: 40 g of raspberry syrup dissolved in 200 mL of water.", "A student tops the glass up to 400 mL with more water.", "The color turns paler, and the drink tastes weaker.", "No syrup was taken out.", "Why is the drink weaker?"], "forest": ["What happens to a solution when you add more solvent?", "The same 40 g of syrup is now spread through 400 mL of water instead of 200 mL.", "Each sip carries less syrup.", "The concentration has gone down.", "Adding more solvent to a solution is called diluting it."], "article": [{"t": "idea", "text": "A glass holds a dark, strong drink: 40 g of raspberry syrup dissolved in 200 mL of water."}, {"t": "idea", "text": "A student tops the glass up to 400 mL with more water."}, {"t": "idea", "text": "The color turns paler, and the drink tastes weaker."}, {"t": "idea", "text": "No syrup was taken out."}, {"t": "idea", "text": "Why is the drink weaker?"}, {"t": "h", "text": "Concentration, again"}, {"t": "idea", "text": "How much solute is dissolved in a given amount of solvent is called the concentration."}, {"t": "idea", "text": "In the glass, the syrup is the solute and the water is the solvent."}, {"t": "h", "text": "Zoom in before and after"}, {"t": "idea", "text": "Before, the 40 g of syrup is spread through 200 mL of water."}, {"t": "idea", "text": "Zoom in: the syrup particles sit close together among the water particles."}, {"t": "idea", "text": "Then the student adds 200 mL more water."}, {"t": "idea", "text": "Every syrup particle is still in the glass."}, {"t": "idea", "text": "The same syrup particles are now spread through twice as much water."}, {"t": "idea", "text": "Zoom in again: the same syrup particles sit farther apart, with more water between them."}, {"t": "fig", "key": "dilution_boxes", "cap": "The drink zoomed in before and after. The same six syrup particles (open) sit among ten water particles, then among twenty: twice the water. No syrup particle left; the syrup is spread thinner."}, {"t": "h", "text": "What each sip carries"}, {"t": "idea", "text": "Each sip is the same size as before."}, {"t": "idea", "text": "The syrup is spread thinner."}, {"t": "idea", "text": "So each sip now carries fewer syrup particles."}, {"t": "idea", "text": "So each sip tastes weaker and looks paler."}, {"t": "idea", "text": "The same solute in more solvent means less concentrated."}, {"t": "idea", "text": "The concentration of the drink has gone down."}, {"t": "fig", "key": "glass_topped_up", "cap": "The glass before and after: the same 40 g of syrup, first in 200 mL of water, then in 400 mL. The drink goes from dark and strong to paler and weaker."}, {"t": "h", "text": "A name for adding solvent"}, {"t": "idea", "text": "Adding more solvent to a solution is called <b>diluting<\/b> it."}, {"t": "idea", "text": "The student diluted the drink: she added water, and the concentration went down."}, {"t": "idea", "text": "Diluting takes no solute away: all 40 g of syrup are still in the glass."}, {"t": "fig", "key": "dilution_table", "cap": "Before and after in one table: the same 40 g of syrup, twice the water, a lower concentration."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a pot of salty soup filled up with a cup of water."}, {"t": "idea", "text": "The same salt is spread through more soup, so each spoonful is less salty."}, {"t": "idea", "text": "The soup has been diluted: its concentration went down."}, {"t": "idea", "text": "Now consider dark tea with more hot water poured in from the kettle."}, {"t": "idea", "text": "The same tea is spread through more water, so the tea is paler and weaker."}, {"t": "idea", "text": "The tea has been diluted."}, {"t": "h", "text": "The opposite change"}, {"t": "idea", "text": "Now consider adding more syrup to the drink instead of more water."}, {"t": "idea", "text": "More solute in the same solvent means more concentrated, so the drink gets stronger."}, {"t": "idea", "text": "Adding solute is not diluting."}, {"t": "fig", "key": "dilution_examples", "cap": "The three cases in one table: soup and tea gain solvent, so each is diluted and less concentrated; the drink gains solute, so it is more concentrated, and that is not diluting."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Adding more solvent to a solution is called diluting it. The same solute spreads through more solvent, so the concentration goes down. No solute is lost."}, {"t": "idea", "text": "Back to the glass: the same 40 g of syrup is spread through 400 mL of water instead of 200 mL."}, {"t": "idea", "text": "Each sip carries less syrup, so the drink is weaker: it has been diluted."}], "script": [{"say": "A glass holds a dark, strong drink: forty grams of syrup in two hundred milliliters of water.", "screen": "[a dark glass; label 40 g of syrup, 200 mL of water]"}, {"say": "A student tops the glass up to four hundred milliliters with more water.", "screen": "[water pours in; the level rises to a 400 mL line]"}, {"say": "The color pales and the drink tastes weaker, yet no syrup was taken out.", "screen": "[the glass pales]"}, {"say": "Why is the drink weaker?", "screen": "[question mark]"}, {"say": "The syrup is the solute and the water is the solvent.", "screen": "[labels SOLUTE: syrup, SOLVENT: water]"}, {"say": "Zoom in before: the syrup particles sit close together among the water particles.", "screen": "[sample box: six open syrup particles among ten filled water particles]"}, {"say": "Add the water: every syrup particle is still there, spread through twice the water.", "screen": "[the box stretches to twice its width; the same six open particles spread out]"}, {"say": "Each sip is the same size, but it carries fewer syrup particles.", "screen": "[a sip-sized circle over each box; fewer open particles inside the second]"}, {"say": "So it tastes weaker: the concentration has gone down.", "screen": "[chip: LESS CONCENTRATED]"}, {"say": "Adding more solvent to a solution is called diluting it.", "screen": "[chip: DILUTING]"}, {"say": "Diluting takes no solute away: all forty grams are still in the glass.", "screen": "[40 g stays on the label]"}, {"say": "Salty soup filled up with water is diluted.", "screen": "[a pot; water pours in; label DILUTED]"}, {"say": "Tea with more hot water poured in is diluted too.", "screen": "[a cup of tea pales; label DILUTED]"}, {"say": "Add more syrup instead, and the drink gets stronger: that is not diluting.", "screen": "[syrup pours in; the glass darkens; cross over DILUTING]"}, {"say": "So here is the rule: adding solvent dilutes a solution, and its concentration goes down.", "screen": "[rule slide reuses the before-and-after boxes; rule text]"}, {"say": "Back to the glass: the same syrup in twice the water, so each sip is weaker.", "screen": "[the pale glass; 40 g in 400 mL]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Two pitchers hold the same amount of water. Pitcher A has more sugar dissolved in it than pitcher B. Which pitcher is more concentrated?", "options": ["pitcher A", "pitcher B"], "key": 0, "fb": ["More solute in the same solvent means more concentrated.", "Pitcher B has less sugar in the same water, so it is less concentrated."], "why": "Concentration is how much solute is dissolved in a given amount of solvent.<br>The water is the same, and pitcher A has more sugar.<br>So pitcher A is more concentrated."}, {"type": "text", "tag": "term", "stem": "Adding more solvent to a solution is called…", "accept": ["diluting", "diluting it", "dilution", "diluting the solution", "dilute"], "why": "Adding more solvent to a solution is called diluting it.<br>The concentration goes down."}, {"type": "mcq", "tag": "term", "stem": "A student diluted a solution. What did she do to it?", "options": ["She added more solute.", "She took some solute out.", "She added more solvent."], "key": 2, "fb": ["Adding solute makes a solution more concentrated, not diluted.", "Diluting takes no solute out. It adds solvent.", "Adding more solvent is diluting; the concentration goes down."], "why": "Adding more solvent to a solution is called diluting it.<br>The same solute spreads through more solvent, so the concentration goes down."}, {"type": "mcq", "tag": "what", "stem": "A glass holds 300 mL of apple juice. A student adds 300 mL of water and stirs. What happens to the concentration of the juice?", "options": ["It goes down.", "It goes up.", "It stays the same."], "key": 0, "fb": ["The same juice is spread through twice as much liquid.", "Adding water adds solvent, not solute, so the concentration cannot go up.", "The juice is spread through more water, so each sip carries less juice."], "why": "The student added solvent, not solute.<br>The same juice is now spread through twice as much liquid.<br>Each sip carries less juice, so the concentration goes down."}, {"type": "frq", "tag": "why", "task": "A student adds 300 mL of water to 300 mL of apple juice and stirs. The juice now tastes weaker. Explain why.", "starter": "The juice tastes weaker because…", "model": "The juice tastes weaker because the same juice is now spread through twice as much liquid.<br>No juice was taken out.<br>Each sip carries less juice than before.<br>So the concentration has gone down, and the juice tastes weaker.", "points": ["the same juice is spread through more liquid (no juice was taken out)", "each sip carries less juice", "so the concentration has gone down"]}, {"type": "mcq", "tag": "misconception", "stem": "Freya fills up a glass of dark fruit syrup drink with water, and it turns pale. She says: \"The water washed some of the syrup away, so there is less syrup now.\" Is Freya correct?", "options": ["yes", "no"], "key": 1, "fb": ["All the syrup is still in the glass. It is spread through more water, so each sip carries less of it.", "All the syrup is still in the glass. It is spread through more water, so each sip carries less of it."], "why": "Adding water adds solvent; it takes no solute away.<br>All the syrup is still in the glass, spread through more water.<br>Each sip carries less syrup, so the drink is paler, and Freya is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "A cook adds a cup of water to a pot of salty broth and stirs. How does each spoonful taste now?", "options": ["more salty", "less salty", "just as salty"], "key": 1, "fb": ["Adding water adds no salt, so the broth cannot get saltier.", "The same salt is spread through more broth: diluted.", "The salt is spread through more broth, so each spoonful carries less salt."], "why": "The cook added solvent, not solute.<br>The same salt is spread through more broth.<br>Each spoonful carries less salt, so the broth is less salty: diluted."}, {"type": "mcq", "tag": "transfer", "stem": "A student wants her cup of tea to taste weaker without pouring any out. What should she add?", "options": ["more hot water", "a spoon of sugar", "another tea bag"], "key": 0, "fb": ["More water spreads the same tea through more liquid: diluted, weaker.", "Sugar adds a solute; it does not spread the tea through more water.", "Another tea bag adds more tea, so the tea gets stronger."], "why": "To make a solution weaker, add solvent.<br>More hot water spreads the same tea through more liquid.<br>The concentration goes down, so the tea tastes weaker."}, {"type": "mcq", "tag": "transfer", "stem": "A student stirs a second spoon of lemonade mix into the same glass of water. What happens to the concentration?", "options": ["It goes down.", "It stays the same.", "It goes up."], "key": 2, "fb": ["Adding solute is the opposite of diluting: the concentration rises.", "The water is the same and the mix doubled, so the concentration changes.", "More solute in the same solvent means more concentrated."], "why": "The student added solute, not solvent.<br>More solute in the same solvent means more concentrated.<br>So the concentration goes up: this is not diluting."}, {"type": "mcq", "tag": "transfer", "stem": "Honey is dissolved in a glass of water, and then the glass is filled up with more water. How much honey is in the glass now, compared with before?", "options": ["twice as much", "the same amount", "half as much"], "key": 1, "fb": ["Adding water adds no honey.", "Adding water adds no honey and takes none away.", "Adding water takes no honey away. The honey is spread thinner, but it is all there."], "why": "Diluting adds solvent only.<br>No honey was added, and no honey was taken away.<br>So the glass holds the same amount of honey, spread through more water."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The student added water to the syrup drink, and it turned paler. What happened to its concentration?", "options": ["It went down.", "It went up.", "It stayed the same."], "key": 0, "fb": ["The same syrup spread through more water: diluted, less concentrated.", "Adding water adds solvent, not solute, so the concentration cannot rise.", "The syrup was spread through twice the water, so each sip carried less."], "why": "Adding more solvent to a solution is called diluting it.<br>The same syrup was spread through twice as much water.<br>So the concentration went down."}]}, {"id": "L05", "atom": "MAT-037", "title": "Mass adds up when a solution forms", "video": "definitely a video", "lesson_type": "Simple equation lesson (mass of solution = mass of solvent + mass of solute) with the worked form on the page; no term coined", "check_design": "Type (b) multi-step routine → one recall MCQ (Topic 2: frozen juice thawing in a sealed bottle keeps its mass) and one recall MCQ (L01: dissolved honey is still in the tea as particles), then the worked example on the page in the worked form → four step items on a fresh case (bath salt 35 g into 500 g of water: which equation; which substitution; calculate; which unit) → three bare typed masses, one with a surplus temperature → one trap item (300 mL is a volume, not a mass) → one student-claim item (Tessa: the sugar is still in the water so the balance reads 200 g; key YES, the topic's one true named claim).", "headache": ["A student puts an empty beaker on a balance and makes the balance read zero.", "She pours water into the beaker until the balance reads 200 g.", "She measures 15 g of salt onto a paper.", "She tips the salt into the water and stirs until every grain has vanished.", "She puts the beaker of salt water back on the balance.", "What does the balance read?"], "forest": ["What happens to the mass when a solute dissolves?", "Every salt particle is still in the beaker, spread through the water.", "No particle left, and none arrived.", "So the mass of the solution is the mass of the water plus the mass of the salt.", "200 g + 15 g = 215 g."], "article": [{"t": "idea", "text": "A student puts an empty beaker on a balance and makes the balance read zero."}, {"t": "idea", "text": "So the balance now reads the mass of whatever goes into the beaker, not the beaker itself."}, {"t": "idea", "text": "She pours water into the beaker until the balance reads 200 g."}, {"t": "idea", "text": "She measures 15 g of salt onto a paper."}, {"t": "idea", "text": "She tips the salt into the water and stirs until every grain has vanished."}, {"t": "idea", "text": "She puts the beaker of salt water back on the balance."}, {"t": "idea", "text": "What does the balance read?"}, {"t": "h", "text": "Mass stays the same, again"}, {"t": "idea", "text": "When ice melts inside a sealed bag, the mass of the bag stays the same."}, {"t": "idea", "text": "The same particles are all still there, so the mass is all still there."}, {"t": "h", "text": "Zoom in on the salt water"}, {"t": "idea", "text": "The salt breaks into particles too small to see."}, {"t": "idea", "text": "The salt particles spread out among the water particles."}, {"t": "idea", "text": "Every salt particle is still in the beaker."}, {"t": "idea", "text": "No particle left the beaker, and no particle arrived."}, {"t": "idea", "text": "So the mass of the salt is still in the beaker, added to the mass of the water."}, {"t": "fig", "key": "mass_balances", "cap": "Three balances, each zeroed with its empty beaker or paper: the water reads 200 g, the salt on its paper reads 15 g, and the salt water reads 215 g. The salt vanished from sight, but not from the balance."}, {"t": "h", "text": "The equation"}, {"t": "idea", "text": "The mass of a solution equals the mass of the solvent plus the mass of the solute."}, {"t": "fig", "key": "mass_equation", "cap": "The equation mass of solution = mass of solvent + mass of solute, each term labeled for the salt water. Every mass is in grams."}, {"t": "idea", "text": "Every mass is in grams."}, {"t": "idea", "text": "The water is the solvent, with a mass of 200 g."}, {"t": "idea", "text": "The salt is the solute, with a mass of 15 g."}, {"t": "idea", "text": "200 g + 15 g = 215 g, so the salt water has a mass of 215 g."}, {"t": "fig", "key": "worked_mass_salt", "cap": "The salt water's mass in the worked form: the values, the equation, the substitution, the calculation, and the answer with its unit."}, {"t": "h", "text": "Writing out the calculation"}, {"t": "idea", "text": "Every time, write the calculation in the same five lines."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Write down the values given, each with its unit."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Write down the equation."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Substitute the values into the equation."}, {"t": "idea", "do": true, "text": "<b>4.<\/b> Calculate."}, {"t": "idea", "do": true, "text": "<b>5.<\/b> Write the answer with its unit."}, {"t": "h", "text": "A second example"}, {"t": "idea", "text": "Now consider 12 g of baking soda stirred into 250 g of water until it vanishes."}, {"t": "idea", "text": "The water is the solvent, 250 g; the baking soda is the solute, 12 g."}, {"t": "idea", "text": "250 g + 12 g = 262 g, so the solution has a mass of 262 g."}, {"t": "fig", "key": "worked_mass_soda", "cap": "The baking soda solution's mass in the same five lines: 250 g + 12 g = 262 g."}, {"t": "h", "text": "Two traps"}, {"t": "idea", "text": "A volume in milliliters is not a mass, so a volume is never added to a mass."}, {"t": "idea", "text": "A temperature in °C is not a mass either, so a temperature is left out of the sum."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The mass of a solution equals the mass of the solvent plus the mass of the solute. Every solute particle is still there, so no mass is lost when it dissolves. Add the two masses in grams."}, {"t": "idea", "text": "Back to the beaker: 200 g of water plus 15 g of salt."}, {"t": "idea", "text": "The balance reads 215 g."}], "script": [{"say": "A student zeroes a balance with an empty beaker on it, then pours in water until it reads two hundred grams.", "screen": "[an empty beaker on a balance: readout 0 g; water pours in; readout 200 g]"}, {"say": "She measures fifteen grams of salt onto a paper.", "screen": "[a paper with a heap on a second balance; 15 g]"}, {"say": "She tips the salt in and stirs until every grain has vanished.", "screen": "[the heap slides in; the spoon stirs; the grains disappear]"}, {"say": "Back on the balance: what does the salt water read?", "screen": "[the beaker returns; readout blank; question mark]"}, {"say": "Ice melting in a sealed bag keeps its mass: the same particles are still there.", "screen": "[a sealed bag of ice, then water; the same reading]"}, {"say": "Zoom in: the salt particles are spread out among the water particles.", "screen": "[sample box: open salt particles spread among filled water particles]"}, {"say": "Every salt particle is still in the beaker, so its mass is still there.", "screen": "[the box outline; nothing crosses it]"}, {"say": "The mass of a solution equals the mass of the solvent plus the mass of the solute.", "screen": "[equation: mass of solution = mass of solvent + mass of solute]"}, {"say": "Two hundred grams plus fifteen grams equals two hundred fifteen grams.", "screen": "[worked form fills line by line; readout 215 g]"}, {"say": "Write the values, the equation, the substitution, the calculation, and the answer with its unit.", "screen": "[the five line labels appear in turn]"}, {"say": "Twelve grams of baking soda in two hundred fifty grams of water makes two hundred sixty-two grams.", "screen": "[worked form for the baking soda; 262 g]"}, {"say": "Milliliters measure volume, not mass, so only grams are added.", "screen": "[300 mL crossed out of a sum]"}, {"say": "So here is the rule: mass of solution equals mass of solvent plus mass of solute.", "screen": "[rule slide reuses the three balances; rule text]"}, {"say": "Back to the beaker: two hundred plus fifteen, so the balance reads two hundred fifteen grams.", "screen": "[readout 215 g]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A sealed bottle of frozen juice is left on a table, and the juice thaws inside the sealed bottle. What happens to the mass of the bottle?", "options": ["It goes down.", "It goes up.", "It stays the same."], "key": 2, "fb": ["No particle left the sealed bottle, so no mass left.", "No particle entered the sealed bottle, so no mass arrived.", "The same particles are all still inside the sealed bottle."], "why": "The bottle is sealed, so no particle left and none arrived.<br>The same particles are all still there.<br>So the mass stays the same."}, {"type": "mcq", "tag": "recall", "stem": "A spoon of honey has dissolved in a mug of tea. Where is the honey now?", "options": ["spread through the tea as tiny particles", "gone from the mug for good", "floating in a sweet layer on top of the tea"], "key": 0, "fb": ["Dissolving spreads the honey particles evenly through the tea.", "The honey is not gone: every sip is sweet.", "Dissolved honey is spread evenly through the tea, not in a layer."], "why": "Dissolving breaks the honey into particles too small to see.<br>Those particles spread evenly through the tea.<br>So the honey is still in the mug, spread through the tea."}, {"type": "mcq", "tag": "scaffold", "fig": "bal_bathsalt", "stem": "35 g of bath salt is stirred into 500 g of water until it vanishes. Which equation finds the mass of the salt water?", "options": ["mass of solution = mass of solvent + mass of solute", "mass of solution = mass of solvent − mass of solute", "mass of solution = mass of solvent"], "key": 0, "fb": ["Every solute particle is still there, so the two masses add.", "Nothing left the water, so no mass is taken away.", "The bath salt is still in the water, so its mass counts too."], "why": "Every bath salt particle is still in the water.<br>So the mass of the salt is added to the mass of the water.<br>Mass of solution = mass of solvent + mass of solute."}, {"type": "mcq", "tag": "scaffold", "stem": "35 g of bath salt is stirred into 500 g of water. Which line substitutes the values correctly?", "options": ["mass of solution = 500 g − 35 g", "mass of solution = 500 g × 35 g", "mass of solution = 500 g + 35 g"], "key": 2, "fb": ["Nothing is taken away when the salt dissolves, so the masses add.", "The equation adds; it does not multiply.", "Mass of solvent + mass of solute: 500 g + 35 g."], "why": "The equation is mass of solution = mass of solvent + mass of solute.<br>Put the water, 500 g, in place of the solvent and the bath salt, 35 g, in place of the solute.<br>So mass of solution = 500 g + 35 g."}, {"type": "text", "tag": "scaffold", "stem": "35 g of bath salt is stirred into 500 g of water. Calculate the mass of the salt water, in g.", "accept": ["535 g", "535", "535 grams"], "why": "Values: mass of water = 500 g, mass of bath salt = 35 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 500 g + 35 g.<br>Calculate: 500 + 35 = 535.<br>Answer: mass of solution = 535 g."}, {"type": "mcq", "tag": "scaffold", "stem": "The water's mass and the bath salt's mass were both in grams. Which unit does the mass of the salt water carry?", "options": ["mL", "g", "°C"], "key": 1, "fb": ["Milliliters measure a volume, not a mass.", "Both masses were in grams, so the sum is in grams.", "Degrees Celsius measure a temperature, not a mass."], "why": "The water's mass was in g and the bath salt's mass was in g.<br>Grams added to grams come out in grams.<br>So the mass of the salt water is in g."}, {"type": "text", "tag": "bare", "stem": "18 g of instant coffee dissolves in 300 g of hot water. What is the mass of the coffee drink, in g?", "accept": ["318 g", "318", "318 grams"], "why": "Values: mass of water = 300 g, mass of instant coffee = 18 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 300 g + 18 g.<br>Calculate: 300 + 18 = 318.<br>Answer: mass of solution = 318 g."}, {"type": "text", "tag": "bare", "stem": "9 g of powdered plant food dissolves in 991 g of water. What is the mass of the plant-food water, in g?", "accept": ["1,000 g", "1000 g", "1000", "1,000", "1000 grams", "1,000 grams"], "why": "Values: mass of water = 991 g, mass of plant food = 9 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 991 g + 9 g.<br>Calculate: 991 + 9 = 1,000.<br>Answer: mass of solution = 1,000 g."}, {"type": "text", "tag": "bare", "stem": "6 g of instant tea is stirred into 240 g of hot water at 75 °C until it vanishes. What is the mass of the tea drink, in g?", "accept": ["246 g", "246", "246 grams"], "why": "The temperature, 75 °C, is not a mass, so it is left out.<br>Values: mass of water = 240 g, mass of instant tea = 6 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 240 g + 6 g.<br>Calculate: 240 + 6 = 246.<br>Answer: mass of solution = 246 g."}, {"type": "mcq", "tag": "scaffold", "stem": "A student stirs 10 g of salt into 300 mL of water. Why can she not add 10 and 300 to find the mass of the salt water?", "options": ["Salt loses its mass when it dissolves.", "300 mL is a volume, not a mass.", "The two numbers must be multiplied together instead."], "key": 1, "fb": ["The salt keeps all its mass; every salt particle is still there.", "She needs the mass of the water in grams before she can add.", "Masses are added, never multiplied, but both values must be masses first."], "why": "The equation adds two masses in grams.<br>300 mL is a volume, not a mass.<br>She needs the mass of the water in grams before she can add."}, {"type": "mcq", "tag": "misconception", "stem": "Tessa stirs 25 g of sugar into 175 g of water until it vanishes. She says: \"The sugar is still in the water, so the sugar water has a mass of 200 g.\" Is Tessa correct?", "options": ["yes", "no"], "key": 0, "fb": ["Every sugar particle is still in the water, so 175 g + 25 g = 200 g.", "Every sugar particle is still in the water, so 175 g + 25 g = 200 g."], "why": "Every sugar particle is still in the water, spread among the water particles.<br>Mass of solution = mass of solvent + mass of solute.<br>175 g + 25 g = 200 g, so Tessa is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "On the zeroed balance, the water read 200 g and the salt read 15 g. After the salt dissolved, what did the salt water read?", "options": ["200 g", "215 g", "185 g"], "key": 1, "fb": ["The salt vanished from sight, not from the balance: its 15 g are still in the beaker.", "Every salt particle is still in the water, so the two masses add.", "Nothing left the beaker, so no mass was lost."], "why": "Every salt particle is still in the beaker.<br>The mass of a solution equals the mass of the solvent plus the mass of the solute.<br>200 g + 15 g = 215 g."}]}, {"id": "L06", "atom": "MAT-038", "title": "Dissolving faster: warmer water", "video": "definitely a video", "lesson_type": "Transformation lesson (which of two set-ups dissolves faster when only the temperature differs, with the particle reason); no term coined", "check_design": "Type (c) concept understanding → one recall MCQ (Topic 1: heated water particles move faster), then the what (salt in two drawn bowls at 15 °C and 45 °C: which dissolves faster), the why (free response on the SAME bowls — James's what-then-why model; the task states the case and the observation, never the what item's key text), the reason as an MCQ, a student-claim misconception (Luis: the heat melts the sugar; key no), transfer ×3 (drink powder in a drawn iced and hot glass; two drawn cups at the same temperature — same time; a hard candy to last longer — cooler), a time prediction (less than 10 minutes) and one fluency item on the mechanism (harder and more often).", "headache": ["Two cups each hold 200 mL of water and one sugar cube.", "One cup is at 20 °C; the other is at 60 °C.", "Nobody stirs either cup.", "The cube in the hot cup is gone in 3 minutes; the cube in the cold cup takes 12 minutes.", "Why does the hot water dissolve the cube faster?"], "forest": ["Why does sugar dissolve faster in hot water?", "Heating makes the water particles move faster.", "Faster water particles hit the sugar cube harder and more often.", "They knock sugar particles off the cube sooner.", "So the warmer the solvent, the faster the solute dissolves."], "article": [{"t": "idea", "text": "Two cups each hold 200 mL of water and one sugar cube."}, {"t": "idea", "text": "One cup is at 20 °C; the other is at 60 °C."}, {"t": "idea", "text": "Nobody stirs either cup."}, {"t": "idea", "text": "The cube in the hot cup is gone in 3 minutes; the cube in the cold cup takes 12 minutes."}, {"t": "idea", "text": "Why does the hot water dissolve the cube faster?"}, {"t": "h", "text": "Only one thing differs"}, {"t": "fig", "key": "cups_temp_table", "cap": "The two cups in one table: the same water, the same cube, no stirring in either. Only the temperature differs, and so does the time."}, {"t": "idea", "text": "Both cups hold the same water and the same cube, and neither is stirred."}, {"t": "idea", "text": "Only the temperature differs, so the temperature is the reason."}, {"t": "h", "text": "Heating, again"}, {"t": "idea", "text": "Heating makes particles move faster."}, {"t": "idea", "text": "The water particles in the hot cup move faster than the water particles in the cold cup."}, {"t": "h", "text": "Zoom in on the cube"}, {"t": "idea", "text": "Water particles bump into the surface of the cube all the time."}, {"t": "idea", "text": "Each bump can knock a sugar particle off the cube."}, {"t": "idea", "text": "The knocked-off sugar particle spreads out among the water particles: it has dissolved."}, {"t": "h", "text": "Hot water, harder bumps"}, {"t": "idea", "text": "In the hot cup, the water particles move faster."}, {"t": "idea", "text": "Faster water particles hit the cube harder."}, {"t": "idea", "text": "Faster water particles also hit the cube more often."}, {"t": "idea", "text": "So the hot water knocks sugar particles off sooner, and the cube is gone in 3 minutes."}, {"t": "idea", "text": "In the cold cup, the water particles move slowly."}, {"t": "idea", "text": "Slow water particles hit the cube more gently and less often."}, {"t": "idea", "text": "So the cold water knocks sugar particles off more slowly, and the cube lasts 12 minutes."}, {"t": "fig", "key": "hot_cold_particles", "cap": "The two cups zoomed in, the water drawn as a liquid with its particles touching. Cold water: short arrows on the particles next to the cube, the particles move slowly, the cube lasts 12 minutes. Hot water: long arrows, the particles move fast, the cube is gone in 3 minutes."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a spoon of salt dropped into cold water and another into warm water."}, {"t": "idea", "text": "The warm water's particles move faster, so the warm water dissolves the salt faster."}, {"t": "idea", "text": "Now consider drink powder in ice water and in hot water."}, {"t": "idea", "text": "The ice water's particles move slowly, so the powder dissolves slowly in the ice water."}, {"t": "fig", "key": "temp_examples", "cap": "The two examples in one table: the same solute dissolves slowly in the colder water and faster in the warmer water."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The warmer the solvent, the faster the solute dissolves. Heating makes the water particles move faster. Faster water particles hit the solute harder and more often. So they knock solute particles off sooner."}, {"t": "idea", "text": "Back to the cups: the hot water's particles hit the cube harder and more often."}, {"t": "idea", "text": "So the hot cup's cube dissolved in 3 minutes, and the cold cup's cube took 12 minutes."}], "script": [{"say": "Two cups each hold two hundred milliliters of water and one sugar cube.", "screen": "[two cups; a cube drops into each]"}, {"say": "One cup is at twenty degrees, the other at sixty, and nobody stirs.", "screen": "[labels 20 °C and 60 °C; no spoon]"}, {"say": "The hot cup's cube is gone in three minutes; the cold cup's takes twelve.", "screen": "[two timers; the hot cube shrinks fast, the cold cube slowly]"}, {"say": "Why does the hot water dissolve the cube faster?", "screen": "[question mark]"}, {"say": "Only the temperature differs between the cups, so the temperature is the reason.", "screen": "[the two-cup table; the temperature row highlighted]"}, {"say": "Heating makes particles move faster.", "screen": "[chip: HEATING MAKES PARTICLES MOVE FASTER]"}, {"say": "Zoom in on the cube: water particles bump into its surface all the time.", "screen": "[box: a cube on the floor; water particles with arrows]"}, {"say": "Each bump can knock a sugar particle off, and that particle spreads out among the water.", "screen": "[one open particle leaves the cube and drifts away]"}, {"say": "In the hot cup, the water particles move faster, so they hit the cube harder and more often.", "screen": "[hot box: long arrows; many hits]"}, {"say": "So the hot water knocks sugar particles off sooner, and the cube is gone in three minutes.", "screen": "[the hot cube shrinks away; 3 minutes]"}, {"say": "In the cold cup, slow water particles knock sugar off slowly, so the cube lasts twelve minutes.", "screen": "[cold box: short arrows; the cube barely shrinks; 12 minutes]"}, {"say": "Salt dissolves faster in warm water than in cold.", "screen": "[two bowls, the warm one clears first]"}, {"say": "Drink powder dissolves slowly in ice water.", "screen": "[two glasses, the hot one colors first]"}, {"say": "So here is the rule: the warmer the solvent, the faster the solute dissolves.", "screen": "[rule slide reuses the two boxes; rule text]"}, {"say": "Back to the cups: harder, more frequent hits, so the hot cup's cube dissolved first.", "screen": "[the two cups; 3 minutes against 12]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A pan of water is heated on a stove. What happens to the water particles?", ["Harder and more frequent hits knock solute particles off sooner.", "Dissolving is done by water particles hitting the solute, not by gaps.", "Warming does not remove water particles; it speeds them up."], "why": "Heating makes the water particles move faster.<br>Faster water particles hit the solute harder and more often.<br>So they knock solute particles off sooner, and the solute dissolves faster."}, {"type": "mcq", "tag": "misconception", "stem": "Luis says: \"Hot water dissolves sugar faster because the heat melts the sugar.\" Is Luis correct?", "options": ["yes", "no"], "key": 1, "fb": ["The sugar does not melt; it dissolves. The hot water's particles hit the sugar harder and more often, so they knock sugar particles off sooner.", "The sugar does not melt; it dissolves. The hot water's particles hit the sugar harder and more often, so they knock sugar particles off sooner."], "why": "The sugar does not melt in the cup; it dissolves.<br>Heating makes the water particles move faster.<br>Faster water particles hit the sugar harder and more often, so they knock sugar particles off sooner, and Luis is not correct."}, {"type": "mcq", "tag": "transfer", "fig": "tt_drink", "stem": "In which glass does the drink powder dissolve faster?", "options": ["the iced glass", "the hot glass"], "key": 1, "fb": ["The iced glass is at 5 °C, so its water particles move slowly.", "The hot glass is at 70 °C, so its water particles move fast and hit the powder harder and more often."], "why": "The same powder, no stirring: only the temperature differs.<br>The hot glass's water particles move faster and hit the powder harder and more often.<br>So the powder dissolves faster in the hot glass."}, {"type": "mcq", "tag": "transfer", "fig": "tt_same", "stem": "In which cup does the salt dissolve faster?", "options": ["cup A", "cup B", "neither: both take the same time"], "key": 2, "fb": ["Both cups are at 25 °C, so their water particles move at the same speed.", "Both cups are at 25 °C, so their water particles move at the same speed.", "Nothing differs between the cups, so the salt dissolves at the same rate in each."], "why": "Both cups are at 25 °C.<br>Their water particles move at the same speed, so they hit the salt equally hard and equally often.<br>So the salt takes the same time in each cup."}, {"type": "mcq", "tag": "transfer", "stem": "A student wants a hard candy to last as long as possible in a glass of water. Which water should she use?", "options": ["cooler water", "warmer water"], "key": 0, "fb": ["Cooler water's particles move more slowly, so they knock candy particles off more slowly.", "Warmer water dissolves the candy faster, so it would last less time."], "why": "The warmer the solvent, the faster the solute dissolves.<br>Cooler water's particles move more slowly and hit the candy less hard and less often.<br>So the candy lasts longer in cooler water."}, {"type": "mcq", "tag": "transfer", "stem": "A lump of rock salt needs 10 minutes to dissolve in cool water. The same kind of lump is dropped into hot water and not stirred. How long does it need?", "options": ["less than 10 minutes", "10 minutes", "more than 10 minutes"], "key": 0, "fb": ["Hot water's particles hit the lump harder and more often, so the lump goes sooner.", "The temperature changed, so the time changes too.", "Hot water speeds dissolving up; it does not slow it down."], "why": "The warmer the solvent, the faster the solute dissolves.<br>The hot water's particles hit the lump harder and more often.<br>So the lump dissolves in less than 10 minutes."}, {"type": "mcq", "tag": "fluency", "stem": "Compared with cold water, how do the particles of hot water hit a lump of salt?", "options": ["more gently and less often", "in the same way", "harder and more often"], "key": 2, "fb": ["Slower, gentler hits belong to cold water.", "Hot water particles move faster than cold water particles, so the hits differ.", "Heating makes the water particles move faster, so each hit is harder and hits come more often."], "why": "Heating makes the water particles move faster.<br>Faster particles hit harder and arrive more often.<br>So hot water's particles hit the lump harder and more often."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The sugar cube in the hot cup dissolved first. Why?", "options": ["Its water particles hit the cube harder and more often.", "The heat melted the sugar cube, so the sugar ran out into the water.", "Hot water has bigger gaps between its particles for the sugar to fall into."], "key": 0, "fb": ["Heating makes the water particles move faster, so their hits are harder and more frequent.", "Sugar does not melt in hot water; it dissolves. The water's faster particles knock sugar particles off.", "Dissolving is done by water particles hitting the cube, not by gaps between them."], "why": "Heating makes the water particles move faster.<br>Faster water particles hit the cube harder and more often.<br>So they knock sugar particles off sooner, and the hot cup's cube dissolved first."}]}, {"id": "L07", "atom": "MAT-039", "title": "Dissolving faster: smaller pieces", "video": "definitely a video", "lesson_type": "Transformation lesson (which of two equal-mass solute samples dissolves faster when only the size of the pieces differs, with the surface reason); no term coined", "check_design": "Type (c) concept understanding → one recall MCQ (L06: a water particle's bump knocks a solute particle off), then the what (a bath bomb whole or crumbled: which dissolves faster), the why (free response on the SAME bath bombs — the task states the case and the observation, not the what item's key text), the reason as an MCQ, a student-claim misconception (Dante: the grains dissolved faster because there was less sugar; key no), transfer ×2 (coarse and fine salt; a hard candy to last longest — drop it in whole), and three fluency items on the mechanism (where the knocking happens; the mass of the broken pieces; which has more surface).", "headache": ["Two cups each hold 200 mL of water at 20 °C.", "One cup gets a 4 g sugar cube; the other gets 4 g of loose sugar grains.", "Nobody stirs either cup.", "The grains are gone in 2 minutes; the cube takes 12 minutes.", "The sugar, the water and the temperature are the same in both cups, so why do the grains win?"], "forest": ["Why do small grains dissolve faster than one cube?", "Water particles can only knock sugar particles off the surface of the sugar.", "The loose grains have far more surface for the water to reach.", "So more sugar particles are knocked off at once.", "The smaller the pieces, the faster the solute dissolves."], "article": [{"t": "idea", "text": "Two cups each hold 200 mL of water at 20 °C."}, {"t": "idea", "text": "One cup gets a 4 g sugar cube; the other gets 4 g of loose sugar grains."}, {"t": "idea", "text": "Nobody stirs either cup."}, {"t": "idea", "text": "The grains are gone in 2 minutes; the cube takes 12 minutes."}, {"t": "idea", "text": "The sugar, the water and the temperature are the same in both cups, so why do the grains win?"}, {"t": "h", "text": "Only one thing differs"}, {"t": "fig", "key": "cups_size_table", "cap": "The two cups in one table: the same water, the same temperature, the same 4 g of sugar, no stirring. Only the size of the pieces differs, and so does the time."}, {"t": "idea", "text": "Both cups hold the same water at the same temperature, and the same 4 g of sugar."}, {"t": "idea", "text": "Only the size of the pieces differs, so the size of the pieces is the reason."}, {"t": "h", "text": "Dissolving happens at the surface"}, {"t": "idea", "text": "Water particles bump into the surface of the sugar."}, {"t": "idea", "text": "Each bump can knock a sugar particle off the surface."}, {"t": "idea", "text": "A sugar particle deep inside the cube cannot be reached until the sugar around it has gone."}, {"t": "idea", "text": "So dissolving happens only at the surface."}, {"t": "h", "text": "More pieces, more surface"}, {"t": "idea", "text": "The cube has six faces for the water to reach."}, {"t": "idea", "text": "Suppose the cube is cut into eight small cubes. Each small cube has six faces of its own."}, {"t": "idea", "text": "The eight small cubes have 48 faces between them, and the water reaches every one."}, {"t": "idea", "text": "Those 48 small faces add up to twice the surface of the one cube."}, {"t": "idea", "text": "Loose grains are smaller still, so their surface is far greater still."}, {"t": "fig", "key": "cube_vs_grains", "cap": "One 4 g cube beside the same 4 g as eight small cubes. The water reaches 6 faces of the cube and 48 faces of the small cubes: the same sugar, twice the surface."}, {"t": "idea", "text": "More surface means more water particles hitting sugar at the same moment."}, {"t": "idea", "text": "So more sugar particles are knocked off at once, and the grains are gone in 2 minutes."}, {"t": "idea", "text": "The cube offers less surface, so fewer sugar particles are knocked off at once."}, {"t": "idea", "text": "So the cube stays in the cup for 12 minutes."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a bath bomb dropped into a tub whole, and another crumbled first."}, {"t": "idea", "text": "The crumbs have far more surface, so the crumbled bath bomb dissolves faster."}, {"t": "idea", "text": "Now consider coarse salt and fine salt dropped into two bowls of water."}, {"t": "idea", "text": "The fine salt's tiny grains have more surface, so the fine salt dissolves faster."}, {"t": "fig", "key": "size_examples", "cap": "The two examples in one table: the same solute dissolves slowly in bigger pieces and faster in smaller pieces."}, {"t": "h", "text": "The same mass either way"}, {"t": "idea", "text": "The cube and the grains hold the same 4 g of sugar."}, {"t": "idea", "text": "Breaking a solute into smaller pieces changes its surface, not its mass."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The smaller the pieces of a solute, the faster it dissolves. Water particles knock solute particles off the surface only. Small pieces have far more surface for the water to reach."}, {"t": "idea", "text": "Back to the cups: the grains offered far more surface than the cube."}, {"t": "idea", "text": "So the grains were gone in 2 minutes, and the cube took 12 minutes."}], "script": [{"say": "Two cups each hold two hundred milliliters of water at twenty degrees.", "screen": "[two cups; label 20 °C]"}, {"say": "One gets a four-gram cube, the other four grams of loose grains, and nobody stirs.", "screen": "[a cube drops into one; grains pour into the other]"}, {"say": "The grains are gone in two minutes; the cube takes twelve.", "screen": "[two timers; the grains vanish; the cube barely shrinks]"}, {"say": "Same sugar, same water, same temperature, so why do the grains win?", "screen": "[the two-cup table; the sugar row highlighted; question mark]"}, {"say": "Water particles bump into the sugar's surface, and each bump can knock a sugar particle off.", "screen": "[box: water particles hitting a cube; one open particle leaves]"}, {"say": "A particle deep inside the cube cannot be reached until the sugar around it has gone.", "screen": "[the cube's inside shaded; arrows stop at the surface]"}, {"say": "So dissolving happens only at the surface.", "screen": "[chip: ONLY AT THE SURFACE]"}, {"say": "The cube has six faces for the water to reach.", "screen": "[the cube; its six faces flash]"}, {"say": "Cut it into eight small cubes, and there are forty-eight faces: twice the surface, all reached by water.", "screen": "[the cube splits into eight; 48 faces flash; label: twice the surface]"}, {"say": "More surface means more water particles hitting sugar at once, so more sugar comes off at once.", "screen": "[many arrows hit many grains; open particles leave from all sides]"}, {"say": "A crumbled bath bomb dissolves faster than a whole one.", "screen": "[a tub; the crumbled bath bomb fizzes away first]"}, {"say": "Fine salt dissolves faster than coarse salt.", "screen": "[two bowls, the fine salt clears first]"}, {"say": "Both cups hold the same four grams: breaking changes the surface, not the mass.", "screen": "[4 g under the cube; 4 g under the grains]"}, {"say": "So here is the rule: the smaller the pieces of a solute, the faster it dissolves.", "screen": "[rule slide reuses the cube and the eight small cubes; rule text]"}, {"say": "Back to the cups: far more surface, so the grains were gone in two minutes.", "screen": "[the two cups; 2 minutes against 12]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Water particles bump into a lump of salt. What can each bump do?", "options": ["knock a salt particle off the lump", "push the lump to the bottom", "make the water around the lump colder"], "key": 0, "fb": ["A knocked-off salt particle spreads out among the water particles: it has dissolved.", "The bumps work on the salt particles, not on where the lump sits.", "The bumps do not cool the water; they knock salt particles off."], "why": "Water particles bump into the surface of the salt all the time.<br>Each bump can knock a salt particle off the lump.<br>That salt particle then spreads out among the water: it has dissolved."}, {"type": "mcq", "tag": "what", "stem": "One bath bomb is dropped into a tub whole. Another, the same size, is crumbled first and dropped in. Which dissolves faster?", "options": ["the crumbled one", "the whole one"], "key": 0, "fb": ["The crumbs have far more surface for the water to reach.", "The whole bath bomb offers less surface, so fewer particles are knocked off at once."], "why": "Dissolving happens only at the surface.<br>The crumbs have far more surface than the whole bath bomb.<br>More particles are knocked off at once, so the crumbled one dissolves faster."}, {"type": "frq", "tag": "why", "task": "One bath bomb goes into a tub whole, and another of the same size is crumbled first. The crumbled one is gone first. Explain why.", "starter": "The crumbled bath bomb dissolves faster because…", "model": "The crumbled bath bomb dissolves faster because water particles knock particles off the surface only.<br>The crumbs have far more surface than the whole bath bomb.<br>So more water particles hit the bath bomb at the same moment.<br>So more particles are knocked off at once, and the crumbled bath bomb dissolves faster.", "points": ["water particles knock particles off the surface only", "the crumbs have far more surface than the whole bath bomb", "so more particles are knocked off at once, and it dissolves faster"]}, {"type": "mcq", "tag": "why", "stem": "Why does a crushed tablet dissolve faster than a whole tablet?", "options": ["Crushing makes the water around the tablet warmer.", "The crushed pieces have more surface for the water to reach.", "The crushed pieces have less mass for the water to dissolve away."], "key": 1, "fb": ["Crushing changes the tablet, not the water's temperature.", "More surface means more water particles hitting the tablet at once.", "The pieces hold the same mass as the whole tablet. Only the surface changes."], "why": "Dissolving happens only at the surface.<br>The crushed pieces have far more surface than the whole tablet.<br>So more particles are knocked off at once, and the crushed tablet dissolves faster."}, {"type": "mcq", "tag": "misconception", "stem": "Dante drops 5 g of sugar grains into one glass of water and a 5 g sugar cube into another. The grains dissolve first. He says: \"The grains dissolved faster because there was less sugar.\" Is Dante correct?", "options": ["yes", "no"], "key": 1, "fb": ["Both glasses got 5 g of sugar. The grains dissolved faster because they have far more surface.", "Both glasses got 5 g of sugar. The grains dissolved faster because they have far more surface."], "why": "Both glasses got the same 5 g of sugar, so there was
