 not less sugar.<br>The loose grains have far more surface for the water to reach.<br>More surface, not less mass, is the reason, so Dante is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "Coarse salt with big crystals and fine salt with tiny crystals, the same mass of each, are dropped into two bowls of water that are equally warm. Which dissolves faster?", "options": ["the coarse salt", "the fine salt"], "key": 1, "fb": ["Big crystals offer less surface, so fewer salt particles are knocked off at once.", "Tiny crystals have far more surface, so more salt particles are knocked off at once."], "why": "Dissolving happens only at the surface.<br>The fine salt's tiny crystals have far more surface than the coarse salt's big crystals.<br>So the fine salt dissolves faster."}, {"type": "mcq", "tag": "transfer", "stem": "A student wants a piece of hard candy to dissolve as slowly as possible in her water. What should she do with it?", "options": ["crush it first", "drop it in whole", "grate it into powder"], "key": 1, "fb": ["Crushing adds surface, so the candy would dissolve faster.", "One whole piece offers the least surface, so it dissolves slowest.", "Powder has the most surface of all, so it would dissolve fastest."], "why": "The smaller the pieces, the faster a solute dissolves.<br>One whole piece has the least surface for the water to reach.<br>So the whole piece dissolves slowest."}, {"type": "mcq", "tag": "fluency", "stem": "Where do water particles knock solute particles off a lump?", "options": ["from the whole lump at the same time", "only from deep inside the lump", "only at the surface of the lump"], "key": 2, "fb": ["Water cannot reach the inside of the lump until the outside has gone.", "The inside is not reached until the surface around it has gone.", "Water particles can only hit the surface, so that is where the knocking happens."], "why": "Water particles can only bump into the surface of the lump.<br>A particle deep inside cannot be reached until the solute around it has gone.<br>So the knocking happens only at the surface."}, {"type": "mcq", "tag": "fluency", "stem": "A 6 g lump of rock candy is broken into small pieces. What is the total mass of the pieces?", "options": ["less than 6 g", "6 g", "more than 6 g"], "key": 1, "fb": ["Breaking moves no candy away. Every piece is still there.", "Breaking changes the surface, not the mass: the pieces still hold 6 g.", "Breaking adds no candy."], "why": "Breaking a solute into pieces changes its surface, not its mass.<br>Every piece of the lump is still there.<br>So the pieces have a total mass of 6 g."}, {"type": "mcq", "tag": "fluency", "stem": "A powder and a single lump have the same mass. Which has more surface for the water to reach?", "options": ["the powder", "the lump", "They have the same surface."], "key": 0, "fb": ["Every tiny grain of the powder has faces of its own for the water to reach.", "One lump has the least surface for its mass.", "The same mass in many small pieces has far more surface than in one lump."], "why": "Cut a solid into smaller pieces, and every piece gains faces of its own.<br>The powder is the same mass in many tiny pieces.<br>So the powder has far more surface than the lump."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The loose grains dissolved before the cube, though both were 4 g of sugar. Why?", "options": ["The grains had less sugar in them than the one cube had.", "The grains had far more surface for the water to reach.", "The grains were in warmer water than the cube was."], "key": 1, "fb": ["Both cups got 4 g. The mass was the same.", "Dissolving happens only at the surface, and the grains had far more of it.", "Both cups were at 20 °C. The temperature was the same."], "why": "Dissolving happens only at the surface of the sugar.<br>The loose grains had far more surface than the one cube.<br>So more sugar particles were knocked off at once, and the grains were gone first."}]}, {"id": "L08", "atom": "MAT-040", "title": "Dissolving faster: stirring", "video": "definitely a video", "lesson_type": "Transformation lesson (which of two otherwise identical set-ups dissolves faster when one is stirred, with the fresh-water reason); no term coined; closes with the three speed-ups side by side", "check_design": "Type (c) concept understanding → one recall MCQ (L06/L07: knocked-off particles spread into the water next to the lump), then the what (salt in a shaken bottle or a still one: which dissolves faster), the why (free response on the SAME bottles — the task states the case and the observation, not the what item's key text), the reason as an MCQ, a student-claim misconception (Yara: stirring dissolves more sugar in total; key no), transfer ×2 (drink powder stirred or left; the set-up that dissolves salt fastest), a boundary (which change does NOT speed dissolving: a glass cup instead of a plastic one), and two fluency items (both glasses hold the same sugar; the water next to a still cube).", "headache": ["Two cups each hold 200 mL of water at 20 °C and one sugar cube.", "A student stirs one cup and leaves the other still.", "The stirred cube is gone in 2 minutes; the still cube takes 12 minutes.", "Why does stirring help?"], "forest": ["Why does stirring speed up dissolving?", "Around a still cube, the water nearby soon holds many sugar particles.", "Stirring sweeps that water away and brings fresh water to the cube.", "Fresh water knocks more sugar particles off.", "So stirring makes a solute dissolve faster."], "article": [{"t": "idea", "text": "Two cups each hold 200 mL of water at 20 °C and one sugar cube."}, {"t": "idea", "text": "A student stirs one cup and leaves the other still."}, {"t": "idea", "text": "The stirred cube is gone in 2 minutes; the still cube takes 12 minutes."}, {"t": "idea", "text": "Why does stirring help?"}, {"t": "h", "text": "Only one thing differs"}, {"t": "fig", "key": "cups_stir_table", "cap": "The two cups in one table: the same water, the same temperature, the same cube. Only the stirring differs, and so does the time."}, {"t": "idea", "text": "Both cups hold the same water at the same temperature, and the same cube."}, {"t": "idea", "text": "Only the stirring differs, so the stirring is the reason."}, {"t": "h", "text": "Knocked off, again"}, {"t": "idea", "text": "Water particles bump into the cube and knock sugar particles off its surface."}, {"t": "idea", "text": "The knocked-off sugar particles spread out into the water next to the cube."}, {"t": "h", "text": "The still cup"}, {"t": "idea", "text": "In the still cup, the knocked-off sugar particles stay close to the cube."}, {"t": "idea", "text": "Soon the water next to the cube holds many sugar particles."}, {"t": "idea", "text": "That water is crowded with sugar particles."}, {"t": "idea", "text": "The crowded water has little room for new sugar particles, so fewer sugar particles come off."}, {"t": "idea", "text": "The sugar particles move away only slowly, so the cube lasts 12 minutes."}, {"t": "h", "text": "The stirred cup"}, {"t": "idea", "text": "In the stirred cup, the spoon sweeps the crowded water away from the cube."}, {"t": "idea", "text": "Fresh water, with no sugar in it yet, arrives at the cube."}, {"t": "idea", "text": "Fresh water can knock off new sugar particles quickly."}, {"t": "idea", "text": "The spoon keeps bringing fresh water, so the cube is gone in 2 minutes."}, {"t": "fig", "key": "stir_cups", "cap": "The two cups zoomed in. Still: the water around the cube is crowded with sugar particles (open circles, in the shaded dome), and the cube lasts 12 minutes. Stirred: the spoon sweeps that crowded water away, fresh water arrives, and the cube is gone in 2 minutes."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider salt in a bottle of water that is shaken, and salt in a bottle left still."}, {"t": "idea", "text": "Shaking brings fresh water to the salt, just as stirring does, so the shaken salt dissolves faster."}, {"t": "idea", "text": "Now consider drink powder stirred with a spoon, and drink powder left to sit."}, {"t": "idea", "text": "The stirred powder dissolves faster."}, {"t": "fig", "key": "stir_examples", "cap": "The two examples in one table: the same solute dissolves slowly when left still and faster when the water is moved by shaking or stirring."}, {"t": "h", "text": "Three ways to speed up dissolving"}, {"t": "fig", "key": "speedups_table", "cap": "The three speed-ups side by side: warmer water, smaller pieces, stirring. Each changes how fast the solute dissolves, never how much solute there is."}, {"t": "idea", "text": "Warmer water, smaller pieces and stirring each make a solute dissolve faster."}, {"t": "idea", "text": "None of the three changes how much solute there is; each changes only how fast it dissolves."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Stirring makes a solute dissolve faster. Stirring moves the crowded water away from the solute. Fresh water arrives at the solute. Fresh water can knock off more solute particles."}, {"t": "idea", "text": "Back to the cups: the spoon kept bringing fresh water to the stirred cube."}, {"t": "idea", "text": "So the stirred cube was gone in 2 minutes, and the still cube took 12 minutes."}], "script": [{"say": "Two cups each hold two hundred milliliters of water at twenty degrees and one sugar cube.", "screen": "[two cups; a cube in each; label 20 °C]"}, {"say": "A student stirs one cup and leaves the other still.", "screen": "[a spoon circles in one cup]"}, {"say": "The stirred cube is gone in two minutes; the still one takes twelve.", "screen": "[two timers; the stirred cube vanishes]"}, {"say": "Why does stirring help?", "screen": "[question mark]"}, {"say": "Only the stirring differs, so stirring is the reason.", "screen": "[the two-cup table; the stirring row highlighted]"}, {"say": "Water particles knock sugar particles off the cube into the water next to it.", "screen": "[box: a cube; open particles leave its surface]"}, {"say": "In the still cup, that water soon holds many sugar particles.", "screen": "[a shaded dome of open particles around the cube]"}, {"say": "That crowded water has little room for new sugar, so fewer sugar particles come off: the cube lasts twelve minutes.", "screen": "[few new particles leave; 12 minutes]"}, {"say": "In the stirred cup, the spoon sweeps that crowded water away, and fresh water arrives.", "screen": "[the spoon; curved sweep arrows; the crowded water is carried off]"}, {"say": "Fresh water knocks off new sugar quickly, so the cube is gone in two minutes.", "screen": "[many particles leave; 2 minutes]"}, {"say": "Shaking a bottle does the same job, so the salt dissolves faster.", "screen": "[two bottles; the shaken one clears first]"}, {"say": "Warmer water, smaller pieces and stirring each make a solute dissolve faster.", "screen": "[the three-row table of speed-ups]"}, {"say": "None of the three changes how much solute there is, only how fast it dissolves.", "screen": "[chip: FASTER, NOT MORE]"}, {"say": "So here is the rule: stirring brings fresh water to the solute, so it dissolves faster.", "screen": "[rule slide reuses the stirred box; rule text]"}, {"say": "Back to the cups: fresh water kept arriving, so the stirred cube went first.", "screen": "[the two cups; 2 minutes against 12]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Water particles knock solute particles off a lump. Where do the knocked-off particles go?", "options": ["into the water next to the lump", "back into the lump", "out of the water as a gas"], "key": 0, "fb": ["They spread out into the water next to the lump, and then farther.", "A knocked-off particle has left the lump; it spreads into the water.", "The particles stay in the water; that is dissolving."], "why": "Each bump knocks a solute particle off the surface.<br>The knocked-off particle spreads out into the water next to the lump.<br>That is how the solute dissolves."}, {"type": "mcq", "tag": "what", "stem": "Two identical bottles hold water and the same amount of salt. One bottle is shaken, and one is left still. In which bottle does the salt dissolve faster?", "options": ["the still bottle", "the shaken bottle"], "key": 1, "fb": ["In the still bottle the salty water stays around the salt, so fewer new salt particles come off.", "Shaking sweeps the salty water away and brings fresh water to the salt."], "why": "Only the shaking differs between the bottles.<br>Shaking sweeps the salty water away from the salt and brings fresh water to it.<br>Fresh water knocks off more salt particles, so the shaken salt dissolves faster."}, {"type": "frq", "tag": "why", "task": "Two identical bottles hold water and the same salt; one is shaken and one is left still. The shaken bottle's salt is gone first. Explain why.", "starter": "The salt dissolves faster in the shaken bottle because…", "model": "The salt dissolves faster in the shaken bottle because shaking sweeps the salty water away from the salt.<br>Fresh water, with no salt in it yet, arrives at the salt.<br>Fresh water knocks off more salt particles.<br>So the salt dissolves faster in the shaken bottle.", "points": ["shaking sweeps the salty water away from the salt", "fresh water arrives at the salt", "fresh water knocks off more salt particles, so the salt dissolves faster"]}, {"type": "mcq", "tag": "why", "stem": "Why does stirring make a solute dissolve faster?", "options": ["Stirring heats the water around the solute.", "Stirring breaks the water particles into smaller pieces.", "Stirring brings fresh water to the solute."], "key": 2, "fb": ["Stirring does not warm the water. It moves the water.", "Water particles do not break. Stirring moves them.", "Stirring sweeps the crowded water away, and fresh water knocks off more solute particles than crowded water does."], "why": "Around a still solute, the nearby water soon holds many solute particles.<br>Stirring sweeps that crowded water away and brings fresh water to the solute.<br>Fresh water knocks off more solute particles, so the solute dissolves faster."}, {"type": "mcq", "tag": "misconception", "stem": "Yara drops the same kind of sugar cube into two cups of water and stirs only one. She says: \"Stirring dissolves more sugar in total, so the stirred cup ends up sweeter.\" Is Yara correct?", "options": ["yes", "no"], "key": 1, "fb": ["Both cups got one cube, so both end up with the same sugar. Stirring changes how fast the cube dissolves, not how much sugar there is.", "Both cups got one cube, so both end up with the same sugar. Stirring changes how fast the cube dissolves, not how much sugar there is."], "why": "Each cup got the same cube, so each holds the same sugar once the cube has dissolved.<br>Stirring changes only how fast the sugar dissolves.<br>It does not change how much sugar there is, so Yara is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "A student stirs drink powder in one glass and lets the same powder sit in another glass, equally warm. Which powder dissolves faster?", "options": ["the stirred powder", "the powder left to sit"], "key": 0, "fb": ["Stirring keeps bringing fresh water to the powder.", "Around the still powder, the nearby water soon holds many powder particles, so fewer new ones come off."], "why": "Only the stirring differs between the glasses.<br>Stirring sweeps the powder-rich water away and brings fresh water to the powder.<br>So the stirred powder dissolves faster."}, {"type": "mcq", "tag": "transfer", "stem": "A student wants a spoon of salt to dissolve as fast as possible. Which set-up is fastest?", "options": ["cold water, fine salt, left still", "warm water, coarse salt, left still", "warm water, fine salt, stirred"], "key": 2, "fb": ["Fine salt helps, but cold still water is slow on the other two counts.", "Warm water helps, but coarse salt and no stirring are slow on the other two counts.", "Warmer water, smaller pieces and stirring each speed dissolving, and this set-up has all three."], "why": "Warmer water, smaller pieces and stirring each make a solute dissolve faster.<br>Warm water, fine salt and stirring use all three.<br>So that set-up dissolves the salt fastest."}, {"type": "mcq", "tag": "transfer", "stem": "Which of these does NOT make a lump of salt dissolve faster?", "options": ["using warmer water", "using a glass cup", "crushing the lump first", "stirring the water"], "key": 1, "fb": ["Warmer water's particles hit the lump harder and more often.", "The cup's material changes nothing about the water or the lump.", "Crushing gives the salt far more surface for the water to reach.", "Stirring brings fresh water to the lump."], "why": "Warmer water, smaller pieces and stirring each make a solute dissolve faster.<br>The material of the cup changes neither the water nor the lump.<br>So a glass cup instead of a plastic cup makes no difference."}, {"type": "mcq", "tag": "fluency", "stem": "Two glasses each got one salt tablet, and both tablets have fully dissolved. Only one glass was stirred. Which glass holds more salt?", "options": ["the stirred glass", "both the same", "the still glass"], "key": 1, "fb": ["Stirring changed the speed, not the amount: one tablet each.", "Each glass got one tablet, so each holds the same salt.", "The still glass got the same one tablet."], "why": "Each glass got one tablet of the same salt.<br>Stirring changes only how fast the tablet dissolves.<br>So both glasses hold the same salt."}, {"type": "mcq", "tag": "fluency", "stem": "In a still cup, what happens to the water right next to a lump of salt?", "options": ["It stays free of salt.", "It gets warmer than the rest.", "It soon holds many salt particles."], "key": 2, "fb": ["Knocked-off salt particles spread into that water first.", "Dissolving does not warm the water next to the lump.", "The knocked-off salt particles stay close to the lump, so that water grows crowded with them."], "why": "Water particles knock salt particles off the lump.<br>In a still cup those salt particles stay close to the lump.<br>So the water next to the lump soon holds many salt particles."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The stirred cube dissolved first. What did the stirring keep bringing to the cube?", "options": ["fresh water", "warmer water", "more sugar"], "key": 0, "fb": ["The spoon swept the water crowded with sugar particles away and brought fresh water, which knocks off more sugar particles.", "Stirring does not warm the water.", "Stirring adds no sugar; it changes how fast the cube dissolves."], "why": "Around a still cube, the nearby water soon holds many sugar particles.<br>Stirring sweeps that water away and brings fresh water to the cube.<br>Fresh water knocks off more sugar particles, so the stirred cube dissolved first."}]}, {"id": "L09", "atom": "MAT-041", "title": "Choose a way to separate a mixture", "video": "definitely a video", "lesson_type": "Procedural lesson (a three-step routine: name the parts, find the property one part has and the other does not, pick the method) walked on four bench mixtures; coins filtering, evaporating, using a magnet, sieving", "check_design": "Type (b) multi-step routine → one recall MCQ each for Topic 5 (steel pins in beans are still magnetic) and L01 (dissolved salt is particles too small to see), then the worked walk on the page (four bench mixtures, then bits of leaf in rainwater) → three step items on a fresh mixture (steel bolts among wooden beads of the same size: which part is magnetic; which property differs; which method — each step restates the case, never an earlier step's key) → a fluency quiz of eight bare picks from the four methods (eggshell in water; salt from sea water; steel screws among brass screws of the same size; plastic bottle caps in beach sand; baking soda dissolved in water; steel washers among plastic washers of the same size; dried peas in flour; cornmeal in water — every case states the material or the size so exactly one method works), keys f e m s e m s f → one routine item (what to look for first). Four options in the run: the four coined names are the atom's category set (ruling 25 Sep 2026).", "headache": ["Four mixtures sit on a bench: coffee grounds in water, dissolved salt in water, iron nails in wood shavings, marbles in sand.", "A student must get one part out of each.", "The same method will not work for all four.", "How does she pick?"], "forest": ["How do you pick a way to separate a mixture?", "Find a property that one part has and the other does not.", "Grounds do not dissolve, so filter paper holds them back: filtering. Salt is dissolved, so heat the water away: evaporating.", "A magnet pulls iron and not wood: using a magnet. Big pieces stay on a mesh: sieving.", "Name the parts, find the property that differs, pick the method that uses it."], "article": [{"t": "idea", "text": "Four mixtures sit on a bench: coffee grounds in water, dissolved salt in water, iron nails in wood shavings, marbles in sand."}, {"t": "idea", "text": "A student must get one part out of each."}, {"t": "idea", "text": "The same method will not work for all four."}, {"t": "idea", "text": "How does she pick?"}, {"t": "h", "text": "Each part keeps its properties, again"}, {"t": "idea", "text": "In a mixture each substance keeps its own properties: the things you can observe about it."}, {"t": "idea", "text": "So the parts of a mixture can be separated."}, {"t": "idea", "text": "A property that one part has and the other does not lets you pull the parts apart."}, {"t": "h", "text": "Coffee grounds in water"}, {"t": "idea", "text": "The coffee grounds do not dissolve; they stay as grains."}, {"t": "idea", "text": "A paper cone has tiny holes: water pours through the holes, but coffee grounds are too big to pass."}, {"t": "idea", "text": "The student pours the mixture through the paper cone: the water runs through, and the grounds stay on the paper."}, {"t": "idea", "text": "Pouring a mixture through paper that holds back the undissolved pieces is called <b>filtering<\/b>, and the paper is called filter paper."}, {"t": "fig", "key": "setup_filter", "cap": "Filtering: the mixture is poured into a paper cone in a funnel. The coffee grounds are held by the paper; clear water runs through into the beaker."}, {"t": "h", "text": "Salt dissolved in water"}, {"t": "idea", "text": "The salt has dissolved, so its particles are far too small for any paper to hold back."}, {"t": "idea", "text": "Filtering would let the salt water straight through."}, {"t": "idea", "text": "When the salt water is warmed, the water evaporates: it turns into a gas and leaves."}, {"t": "idea", "text": "The salt does not evaporate."}, {"t": "idea", "text": "The student leaves the salt water in a shallow pan in a warm place."}, {"t": "idea", "text": "The water leaves as a gas, and the salt is left behind on the pan."}, {"t": "idea", "text": "Letting the solvent evaporate away to leave the dissolved solute is called <b>evaporating<\/b>."}, {"t": "fig", "key": "setup_evaporate", "cap": "Evaporating, before and after: the salt water sat in a shallow pan in a warm place. The water has left as a gas; the salt grains are left on the dry pan."}, {"t": "h", "text": "Iron nails in wood shavings"}, {"t": "idea", "text": "A magnet pulls iron; it does not pull wood."}, {"t": "idea", "text": "The student holds a magnet over the shavings: the nails jump to the magnet, and the shavings stay."}, {"t": "idea", "text": "Lifting the magnetic part out of a mixture with a magnet is called <b>using a magnet<\/b>."}, {"t": "fig", "key": "setup_magnet", "cap": "Using a magnet: a bar magnet held over the tray. The iron nails cling to the magnet; the wood shavings stay in the tray."}, {"t": "h", "text": "Marbles in sand"}, {"t": "idea", "text": "Marbles are big; sand grains are small."}, {"t": "idea", "text": "A sieve is a mesh with holes: sand grains fall through the holes, and marbles stay on the mesh."}, {"t": "idea", "text": "Separating big pieces from small ones with a mesh is called <b>sieving<\/b>."}, {"t": "fig", "key": "setup_sieve", "cap": "Sieving: a mesh held over a bowl. The marbles stay on the mesh; the sand falls through."}, {"t": "h", "text": "How to pick"}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Name the two parts of the mixture, one and then the other."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Find a property that one part has and the other does not."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Pick the method that uses that property."}, {"t": "fig", "key": "four_setups", "cap": "The four separations together, two by two: filtering, evaporating, using a magnet, sieving."}, {"t": "fig", "key": "methods_table", "cap": "The four bench mixtures in one table: the two parts, the property one part has and the other does not, and the method that uses it."}, {"t": "h", "text": "Walk it on a fresh mixture"}, {"t": "idea", "text": "Now consider bits of leaf floating in a bucket of rainwater."}, {"t": "idea", "text": "The two parts are the leaf bits and the water."}, {"t": "idea", "text": "The leaf bits do not dissolve, and the water pours through paper."}, {"t": "idea", "text": "So the method is filtering."}, {"t": "fig", "key": "leaf_walk_table", "cap": "The fresh mixture in the same table: leaf bits stay whole and water passes paper, so the method is filtering."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To separate a mixture, find a property that one part has and the other does not, and pick the method that uses it. Filtering separates undissolved pieces from a liquid. Evaporating separates a dissolved solute from its solvent. A magnet lifts out a magnetic part. Sieving separates big pieces from small ones."}, {"t": "idea", "text": "Back to the bench: the student filters the coffee grounds and evaporates the salt water."}, {"t": "idea", "text": "She lifts the nails out with a magnet and sieves the marbles from the sand."}], "script_cap_note": "four coinings in one lesson; James's Topic 1 allowance for a merged sort (~130 s) applied so each method keeps two full beats (Role B, 25 Sep 2026)", "script": [{"say": "Four mixtures sit on a bench: coffee grounds in water, dissolved salt, nails in wood shavings, marbles in sand.", "screen": "[four containers in a row, labeled]"}, {"say": "A student must get one part out of each, and one method will not do.", "screen": "[a question mark over each]"}, {"say": "How does she pick?", "screen": "[question mark]"}, {"say": "Find a property that one part has and the other does not.", "screen": "[chip: FIND THE PROPERTY THAT DIFFERS]"}, {"say": "Coffee grounds do not dissolve. Water pours through a paper cone's tiny holes; the grounds cannot.", "screen": "[a paper cone in a funnel; the mixture pours in]"}, {"say": "Pour it through the paper: the water runs through and the grounds stay: filtering.", "screen": "[clear water drips into the beaker; grounds on the paper; chip: FILTERING]"}, {"say": "Dissolved salt is too small for paper to hold, but water evaporates and salt does not.", "screen": "[salt water runs straight through a filter; then a pan]"}, {"say": "Leave the salt water in a warm pan: the water leaves as a gas, the salt stays: evaporating.", "screen": "[the pan of salt water; wavy lines rise; then the dry pan with salt grains left; chip: EVAPORATING]"}, {"say": "A magnet pulls iron, not wood: hold one over the shavings and the nails jump up: using a magnet.", "screen": "[a bar magnet; nails cling; shavings stay; chip: USING A MAGNET]"}, {"say": "Marbles are big, sand grains small: pour them onto a mesh and the sand falls through: sieving.", "screen": "[a mesh over a bowl; sand falls; chip: SIEVING]"}, {"say": "So here is the rule: to separate a mixture, find the property that differs and pick the method that uses it.", "screen": "[the three numbered steps; the methods table]"}, {"say": "Filtering for undissolved pieces in a liquid; evaporating for a dissolved solute; a magnet for a magnetic part; sieving for big pieces among small.", "screen": "[the four set-ups two by two with their names]"}, {"say": "Back to the bench: filter the grounds, evaporate the salt water, lift the nails with a magnet, sieve the marbles.", "screen": "[the four containers with their method labels]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Steel pins are mixed into a jar of dried beans. Steel is magnetic. In the mixture, are the pins still magnetic?", "options": ["yes", "no"], "key": 0, "fb": ["In a mixture each substance keeps its own properties.", "Mixing changes nothing about the steel: it keeps its magnetism."], "why": "In a mixture each substance keeps its own properties.<br>The pins are still steel.<br>So the pins are still magnetic."}, {"type": "mcq", "tag": "recall", "stem": "Salt has dissolved in a jar of water. What has happened to the salt?", "options": ["It sank to the bottom of the jar as grains of salt.", "It spread through the water as particles too small to see.", "It floated to the top of the water in a layer."], "key": 1, "fb": ["Dissolved salt does not sit as grains; its particles are spread through the water.", "That is what dissolving means: particles too small to see, spread evenly.", "Dissolved salt is spread evenly through the water, not in a layer."], "why": "Dissolving breaks the salt into particles too small to see.<br>Those particles spread evenly through the water.<br>So no grains of salt remain to be seen."}, {"type": "mcq", "tag": "scaffold", "stem": "Steel bolts are mixed with wooden beads of the same size in a box. Steel is magnetic; wood is not. Which part is magnetic?", "options": ["the bolts", "the beads"], "key": 0, "fb": ["Steel is magnetic, and the bolts are steel.", "The beads are wood, and wood is not magnetic."], "why": "Steel is magnetic, and wood is not.<br>The bolts are steel, so the bolts are magnetic.<br>The beads are wood, so the beads are not."}, {"type": "mcq", "tag": "scaffold", "stem": "Steel bolts are mixed with wooden beads of the same size. Which property do the bolts have that the beads do not?", "options": ["dissolving in water", "being magnetic", "being bigger than the beads"], "key": 1, "fb": ["Neither steel nor wood dissolves in water, so that property does not differ.", "Steel is magnetic and wood is not: a property one part has and the other does not.", "The bolts and the beads are the same size, so size does not differ here. Steel is magnetic and wood is not."], "why": "Find a property that one part has and the other does not.<br>Steel is magnetic, and wood is not.<br>So being magnetic is the property the bolts have and the beads do not."}, {"type": "mcq", "tag": "scaffold", "stem": "Steel bolts are mixed with wooden beads of the same size. Which method separates the bolts from the beads?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 2, "fb": ["Filtering separates undissolved pieces from a liquid; there is no liquid here.", "Evaporating separates a dissolved solute from its solvent; nothing is dissolved here.", "A magnet pulls the steel bolts and does not pull the wooden beads.", "The bolts and the beads are the same size, so a mesh holds both or drops both."], "why": "The property that differs is magnetism: steel is magnetic, wood is not.<br>Pick the method that uses that property.<br>A magnet lifts the bolts and leaves the beads."}, {"type": "mcq", "tag": "fluency", "stem": "Crushed eggshell, ground as fine as flour, is stirred into water and stays as bits. Which method gets the eggshell out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 0, "fb": ["The eggshell did not dissolve, so paper holds it back while the water runs through.", "Nothing is dissolved here; the eggshell bits can be held back by paper.", "Eggshell is not magnetic.", "A mesh is for big pieces among small ones. Here the other part is water: paper lets the water run through and holds the eggshell bits back."], "why": "The two parts are eggshell bits and water.<br>The eggshell did not dissolve, and water pours through paper.<br>So the method is filtering."}, {"type": "mcq", "tag": "fluency", "stem": "Salt is dissolved in a pan of sea water. Which method gets the salt out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 1, "fb": ["Dissolved salt particles are far too small for paper to hold back.", "The water evaporates and the salt does not, so the salt is left behind.", "Salt is not magnetic.", "Dissolved salt has no pieces for a mesh to hold."], "why": "The two parts are dissolved salt and water.<br>Water evaporates when warmed; salt does not.<br>So the method is evaporating."}, {"type": "mcq", "tag": "fluency", "stem": "Steel screws are mixed with brass screws of the same size. Steel is magnetic; brass is not. Which method gets the steel screws out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 2, "fb": ["There is no liquid to pour through paper.", "Nothing is dissolved in a solvent.", "A magnet pulls the steel screws and does not pull the brass screws.", "The screws are the same size, so a mesh holds both or drops both."], "why": "The two parts are steel screws and brass screws.<br>A magnet pulls steel and does not pull brass.<br>So the method is using a magnet."}, {"type": "mcq", "tag": "fluency", "stem": "Plastic bottle caps are mixed into dry beach sand. Which method gets the caps out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 3, "fb": ["There is no liquid to pour through paper.", "Nothing is dissolved in a solvent.", "Plastic is not magnetic; the difference is size.", "Caps are big and sand grains are small, so the sand falls through a mesh and the caps stay."], "why": "The two parts are plastic bottle caps and sand.<br>Caps are big; sand grains are small.<br>So the method is sieving."}, {"type": "mcq", "tag": "fluency", "stem": "Baking soda is dissolved in a bowl of water. Which method gets the baking soda out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 1, "fb": ["Dissolved baking soda particles pass straight through paper.", "The water evaporates and the baking soda does not, so it is left behind.", "Baking soda is not magnetic.", "Dissolved baking soda has no pieces for a mesh to hold."], "why": "The two parts are dissolved baking soda and water.<br>Water evaporates when warmed; baking soda does not.<br>So the method is evaporating."}, {"type": "mcq", "tag": "fluency", "stem": "Steel washers are mixed with plastic washers of the same size. Steel is magnetic. Which method gets the steel washers out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 2, "fb": ["There is no liquid to pour through paper.", "Nothing is dissolved in a solvent.", "A magnet pulls the steel washers and does not pull the plastic washers.", "The washers are the same size, so a mesh holds both or drops both."], "why": "The two parts are steel washers and plastic washers.<br>A magnet pulls steel and does not pull plastic.<br>So the method is using a magnet."}, {"type": "mcq", "tag": "fluency", "stem": "Dried peas are mixed into a bag of flour. Which method gets the peas out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 3, "fb": ["There is no liquid to pour through paper.", "Nothing is dissolved in a solvent.", "Neither peas nor flour is magnetic.", "Peas are big and flour grains are tiny, so the flour falls through a mesh and the peas stay."], "why": "The two parts are peas and flour.<br>Peas are big; flour grains are tiny.<br>So the method is sieving."}, {"type": "mcq", "tag": "fluency", "stem": "Cornmeal stirred into water clouds it and then settles as grains. Which method gets the cornmeal out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 0, "fb": ["The cornmeal did not dissolve, so paper holds it back while the water runs through.", "Evaporating takes the water away and leaves everything behind, cornmeal included. Nothing is dissolved here, so filtering is the method.", "Cornmeal is not magnetic.", "The other part is water: paper lets the water run through and holds the cornmeal grains back, so filtering is the method."], "why": "The two parts are cornmeal grains and water.<br>The cornmeal did not dissolve, and water pours through paper.<br>So the method is filtering."}, {"type": "mcq", "tag": "routine", "stem": "A student must separate a mixture. After naming its two parts, what does she look for?", "options": ["a property one part has and the other lacks", "the part that there is more of in the mixture", "the part that has the most mass in the mixture"], "key": 0, "fb": ["That property is what the method will use.", "How much of each part there is does not pull the parts apart; a property that differs does.", "Mass alone does not pull parts apart; a property that differs does."], "why": "The routine is: name the two parts; find a property one part has and the other does not; pick the method that uses it.<br>So after naming the parts she looks for the property that differs."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The salt had dissolved in the water, so filter paper could not hold it back. Which method got the salt out?", "options": ["filtering", "evaporating", "sieving"], "key": 1, "fb": ["Dissolved salt particles are far too small for paper to hold back.", "The water left as a gas, and the salt stayed on the pan.", "Dissolved salt has no pieces for a mesh to hold."], "why": "The salt was dissolved, so no paper or mesh could hold its particles back.<br>Water evaporates when warmed, and salt does not.<br>So evaporating left the salt behind."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-033", "stem": "Drink crystals stirred into water vanish and spread evenly through it. A mixture made like this, by one substance dissolving evenly into another, is called a…", "accept": ["solution", "a solution"], "why": "A mixture in which one substance has dissolved evenly into another is called a solution."}, {"type": "text", "tag": "term", "atom": "MAT-034", "stem": "Drink mix dissolves in a pitcher of water. The drink mix is the substance that dissolves, so the drink mix is called the…", "accept": ["solute", "the solute"], "why": "The substance that dissolves is called the solute."}, {"type": "text", "tag": "term", "atom": "MAT-034", "stem": "Drink mix dissolves in a pitcher of water. The water is the substance the drink mix dissolves into, so the water is called the…", "accept": ["solvent", "the solvent"], "why": "The substance the solute dissolves into is called the solvent."}, {"type": "text", "tag": "term", "atom": "MAT-035", "stem": "Two mugs hold the same water, but one holds more dissolved coffee. How much solute is dissolved in a given amount of solvent is called the…", "accept": ["concentration", "the concentration"], "why": "How much solute is dissolved in a given amount of solvent is called the concentration."}, {"type": "text", "tag": "term", "atom": "MAT-036", "stem": "A student adds more water to a glass of strong juice, and the juice gets weaker. Adding more solvent to a solution is called…", "accept": ["diluting", "diluting it", "dilution", "dilute", "diluting the solution"], "why": "Adding more solvent to a solution is called diluting it.<br>The concentration goes down."}, {"type": "text", "tag": "calc", "atom": "MAT-037", "stem": "45 g of sugar dissolves in 455 g of water. What is the mass of the sugar water, in g?", "accept": ["500 g", "500", "500 grams"], "why": "Values: mass of water = 455 g, mass of sugar = 45 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 455 g + 45 g.<br>Calculate: 455 + 45 = 500.<br>Answer: mass of solution = 500 g."}, {"type": "text", "tag": "calc", "atom": "MAT-037", "stem": "14 g of salt dissolves in 386 g of water at 30 °C. What is the mass of the salt water, in g?", "accept": ["400 g", "400", "400 grams"], "why": "The temperature, 30 °C, is not a mass, so it is left out.<br>Values: mass of water = 386 g, mass of salt = 14 g.<br>Equation: mass of solution = mass of solvent + mass of solute.<br>Substitute: 386 g + 14 g.<br>Calculate: 386 + 14 = 400.<br>Answer: mass of solution = 400 g."}, {"type": "frq", "tag": "why", "atom": "MAT-038", "task": "A sugar cube dissolves in 4 minutes in a cup of hot water and in 15 minutes in a cup of cold water. Neither cup is stirred. Explain why the cube dissolves faster in the hot water.", "starter": "The cube dissolves faster in the hot water because…", "model": "The cube dissolves faster in the hot water because heating makes the water particles move faster.<br>Faster water particles hit the cube harder and more often.<br>So they knock sugar particles off the cube sooner.<br>So the cube dissolves faster in the hot water.", "points": ["heating makes the water particles move faster", "faster water particles hit the cube harder and more often", "so they knock sugar particles off sooner, and the cube dissolves faster"]}, {"type": "frq", "tag": "why", "atom": "MAT-037", "task": "A student dissolves 30 g of salt in 270 g of water. Before she puts the salt water on the balance, she predicts it will read 300 g. Explain why her prediction is right.", "starter": "The balance reads 300 g because…", "model": "The balance reads 300 g because every salt particle is still in the water after it dissolves.<br>No particle left the beaker, and none arrived.<br>So the mass of the solution equals the mass of the water plus the mass of the salt.<br>270 g + 30 g = 300 g.", "points": ["every salt particle is still in the water (none left, none arrived)", "so the mass of the solution equals the mass of the water plus the mass of the salt", "270 g + 30 g = 300 g"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-035", "fig": "ct_pr_tea", "stem": "Which mug is more concentrated?", "options": ["mug A", "mug B"], "key": 0, "fb": ["Both mugs hold 6 g of instant tea, and mug A has less water.", "Both mugs hold 6 g of instant tea. Mug B spreads it through more water."], "why": "The instant tea is the same: 6 g in each mug.<br>Mug A holds 250 mL of water; mug B holds 350 mL.<br>The same solute in less solvent means more concentrated, so mug A."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-041", "stem": "A jar holds water with some sugar dissolved in it. Which method gets the sugar back out?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 1, "fb": ["Dissolved sugar particles are far too small for paper to hold back.", "The water evaporates and the sugar does not, so the sugar is left behind.", "Sugar is not magnetic.", "Dissolved sugar has no pieces for a mesh to hold."], "why": "The two parts are dissolved sugar and water.<br>Water evaporates when warmed; sugar does not.<br>So the method is evaporating."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-040", "stem": "Greta stirs a cup of water with a sugar cube in it, and the cube dissolves faster than an unstirred one. She says: \"Stirring works because the spoon warms the water.\" Is Greta correct?", "options": ["yes", "no"], "key": 1, "fb": ["Stirring does not warm the water. It sweeps the water crowded with sugar particles away and brings fresh water to the cube.", "Stirring does not warm the water. It sweeps the water crowded with sugar particles away and brings fresh water to the cube."], "why": "Stirring does not warm the water.<br>It sweeps the water crowded with sugar particles away from the cube and brings fresh water to it.<br>Fresh water knocks off more sugar particles, so the cube dissolves faster, and Greta is not correct."}], "pp100": [{"d": "easy", "atom": "MAT-033", "stem": "Which of these is a solution?", "options": ["fine sand stirred into water", "flour stirred into water", "gravel shaken hard in a jar of water", "salt stirred into water until it vanishes"], "key": 3, "why": "A solution is a mixture in which one substance has dissolved evenly into another.<br>The salt vanished: it dissolved evenly into the water.<br>Sand, flour and gravel do not dissolve: their pieces stay pieces and settle."}, {"d": "easy", "atom": "MAT-034", "stem": "Salt dissolves in a bowl of warm water. What is the water called?", "options": ["the solvent", "the solute", "the solution", "the concentration"], "key": 0, "why": "The substance the solute dissolves into is called the solvent.<br>The salt dissolves into the water, so the water is the solvent and the salt is the solute.<br>The salty water, salt and water together, is the solution."}, {"d": "easy", "atom": "MAT-035", "stem": "What does the concentration of a solution tell you?", "options": ["how hot the solvent was when the solute went in", "how much solute is in a given amount of solvent", "how quickly the solute dissolved into the solvent", "how much of its container the finished solution fills up"], "key": 1, "why": "How much solute is dissolved in a given amount of solvent is called the concentration.<br>More solute in the same solvent means more concentrated.<br>Temperature, speed and container size are different things."}, {"d": "easy", "atom": "MAT-036", "stem": "A student adds water to a bottle of strong mouthwash to make it milder. Which word describes what she did to the mouthwash?", "options": ["concentrated it", "filtered it", "evaporated it", "diluted it"], "key": 3, "why": "Adding more solvent to a solution is called diluting it.<br>The same mouthwash is spread through more water, so the concentration goes down.<br>Adding solute would concentrate it; filtering and evaporating are separation methods."}, {"d": "easy", "atom": "MAT-040", "stem": "A cook drops a bouillon cube into a pan of water and swirls the pan around and around until the cube is gone. Which of the three ways to speed up dissolving is she using?", "options": ["warmer water", "smaller pieces", "more water", "stirring"], "key": 3, "why": "Swirling the pan moves the water, just as stirring with a spoon does.<br>Moving the water sweeps the crowded water away from the cube and brings fresh water to it.<br>So the cook is using stirring: the water is no warmer, and the cube is no smaller."}, {"d": "easy", "atom": "MAT-041", "stem": "Which method separates a dissolved solute from its solvent?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 1, "why": "A dissolved solute is particles too small for paper or a mesh to hold back.<br>The solvent evaporates when warmed, and the solute does not.<br>So evaporating leaves the solute behind."}, {"d": "easy", "atom": "MAT-033", "stem": "A solution is one kind of…", "options": ["mixture.", "pure substance.", "new substance.", "solvent."], "key": 0, "why": "A solution is a mixture in which one substance has dissolved evenly into another.<br>Zoom in, and two kinds of particle are there: the solute's and the solvent's.<br>Two kinds of matter mingled together is a mixture, not a pure substance and not a new substance."}, {"d": "easy", "atom": "MAT-034", "stem": "A spoon of maple syrup dissolves into a glass of milk. Which pair names the solute and then the solvent?", "options": ["the milk, then the syrup", "the syrup, then the milk", "the sweet milk, then the milk", "the syrup, then the sweet milk"], "key": 1, "why": "The substance that dissolves is the solute: the syrup.<br>The substance it dissolves into is the solvent: the milk.<br>The sweet milk is the whole solution, not one of its two parts."}, {"d": "easy", "atom": "MAT-034", "stem": "A student stirs a scoop of pool salt into a wading pool until every grain has vanished. Which one is the solution?", "options": ["the salt grains", "the plain water", "the salty pool water", "the dissolved salt on its own"], "key": 2, "why": "The salt is the solute, and the water is the solvent.<br>Solute and solvent together make the solution.<br>So the salty pool water is the solution; the dissolved salt on its own is only the solute."}, {"d": "easy", "atom": "MAT-035", "fig": "ct_pp_equal", "stem": "How do the concentrations of the two jars compare?", "options": ["Jar A is more concentrated.", "Jar B is more concentrated.", "You cannot tell the concentrations from the table.", "The two jars have the same concentration."], "key": 3, "why": "Concentration is how much solute is dissolved in a given amount of solvent.<br>Both jars hold 15 g of brown sugar in 250 mL of water: the same solute in the same solvent.<br>So the two jars have the same concentration."}, {"d": "easy", "atom": "MAT-036", "stem": "A student dilutes a solution. Which of these quantities goes down?", "options": ["the concentration", "the amount of solvent", "the amount of solute", "the total mass of the solution"], "key": 0, "why": "Diluting means adding more solvent to a solution.<br>The same solute is spread through more solvent, so the concentration goes down.<br>The amount of solvent and the total mass go up, and the amount of solute stays the same."}, {"d": "easy", "atom": "MAT-037", "stem": "10 g of salt is stirred into a glass of water until every grain has vanished. What is the mass of the salt now?", "options": ["0 g", "less than 10 g", "10 g", "more than 10 g"], "key": 2, "why": "Dissolving breaks the salt into particles too small to see.<br>Every salt particle is still in the water; none left the glass.<br>So the salt still has a mass of 10 g."}, {"d": "easy", "atom": "MAT-038", "fig": "tt4_pp_cups", "stem": "One spoon of the same salt goes into each cup, and no cup is stirred. In which cup does the salt dissolve fastest?", "options": ["cup A", "cup B", "cup C", "cup D"], "key": 1, "why": "The salt and the stirring are the same in every cup, so only the temperature differs.<br>Warmer water makes a solute dissolve faster.<br>Cup B is the warmest, at 70 °C, so the salt dissolves fastest in cup B."}, {"d": "easy", "atom": "MAT-039", "stem": "A lump of a solute is broken into small pieces. Which of these properties does the breaking change?", "options": ["its mass", "its temperature", "the kind of substance it is", "its surface"], "key": 3, "why": "Every piece of the lump is still there, so the mass is the same.<br>Each piece now has faces of its own for the water to reach.<br>So breaking changes the surface, and nothing else."}, {"d": "easy", "atom": "MAT-040", "stem": "A student stirs a spoon of salt in a glass of water. Which of these does the stirring change?", "options": ["how much salt dissolves in total", "how warm the water is", "how fast the salt dissolves", "the mass of the salt water"], "key": 2, "why": "Stirring sweeps the crowded water away from the salt and brings fresh water to it.<br>So the salt dissolves faster.<br>Stirring adds no salt, no warmth and no mass, so the other three stay the same."}, {"d": "easy", "atom": "MAT-041", "stem": "A mixture is poured through filter paper. What does the paper hold back?", "options": ["a solute that has dissolved", "the liquid part of the mixture", "the grains and the dissolved solute together", "grains that did not dissolve"], "key": 3, "why": "Filter paper has tiny holes.<br>The liquid runs through the holes, and dissolved particles are far too small to be held.<br>Grains that did not dissolve are too big for the holes, so the paper holds them back."}, {"d": "medium", "atom": "MAT-033", "fig": "sbox6_even_pp", "stem": "Each circle is a particle; filled and open circles are two different kinds. Which mixture could this box show?", "options": ["salt dissolved in water", "sand settled in water", "flour clouding water", "oil floating on water"], "key": 0, "why": "The open particles are spread evenly among the filled ones: one substance dissolved evenly into another, a solution.<br>Salt dissolved in water is a solution.<br>Settled sand and clouding flour stay as grains, and floating oil sits in a layer on top: none is spread evenly."}, {"d": "medium", "atom": "MAT-034", "stem": "A cleaner is made by stirring 50 mL of rubbing alcohol into 950 mL of water. Which is the solvent, and why?", "options": ["the alcohol, because it is the part that cleans", "the water, because water is always the solute", "the water, because the alcohol dissolved into it", "the alcohol, because there is less of it in the cleaner"], "key": 2, "why": "The substance the solute dissolves into is the solvent.<br>The small amount of alcohol vanished into the large amount of water.<br>So the water is the solvent and the alcohol is the solute."}, {"d": "medium", "atom": "MAT-035", "fig": "ct3_pp_dye", "stem": "Which bowl is the most concentrated?", "options": ["bowl A", "bowl B", "bowl C", "All three are the same."], "key": 1, "why": "The water is the same: 400 mL in every bowl.<br>Bowl B holds 12 g of dye, more than bowl C's 8 g or bowl A's 4 g.<br>The most solute in the same solvent means the most concentrated, so bowl B."}, {"d": "medium", "atom": "MAT-036", "stem": "A beaker holds 100 mL of salt water. A student adds 100 mL of water and stirs. Compared with before, how much salt does one 10 mL spoonful carry now?", "options": ["twice as much", "the same amount", "a little less", "half as much"], "key": 3, "why": "The same salt is now spread through twice as much water: the salt water has been diluted.<br>A spoonful is the same size as before, but the salt is spread twice as thin.<br>So each spoonful carries half as much salt."}, {"d": "medium", "atom": "MAT-037", "fig": "bal_pp_crystals", "stem": "Each balance was zeroed with the empty beaker or the empty paper on it. The drink crystals are stirred into the water until they vanish. What does the beaker's balance read for the finished drink?", "options": ["445 g", "355 g", "400 g", "45 g"], "key": 0, "why": "Every crystal particle is still in the water after it dissolves.<br>Mass of solution = mass of solvent + mass of solute.<br>400 g + 45 g = 445 g."}, {"d": "medium", "atom": "MAT-038", "fig": "tt_pp_tea", "stem": "A tea bag is dropped into each mug, and neither is stirred. In which mug does the tea color the water faster, and why?", "options": ["mug B: cooler water has more room between its particles for the tea", "mug A: hot water has fewer particles in the way of the tea", "mug A: its water particles hit the tea harder and more often", "mug B: cooler water holds on to tea better than hot water"], "key": 2, "why": "Heating makes the water particles move faster.<br>Mug A is hotter, so its water particles hit the tea harder and more often and knock tea particles off sooner.<br>So the tea colors the water faster in mug A."}, {"d": "medium", "atom": "MAT-039", "fig": "tt3_pp_candy", "stem": "The table gives how long 5 g of hard candy took to dissolve in three forms, in the same water at the same temperature, with no stirring. Which form had the most surface for the water to reach?", "options": ["the one piece", "the four pieces", "the powder", "They all had the same surface."], "key": 2, "why": "Dissolving happens only at the surface, so more surface means a shorter time.<br>The powder dissolved in 1 minute, the shortest time of the three.<br>So the powder had the most surface: the same 5 g in the most, smallest pieces."}, {"d": "medium", "atom": "MAT-040", "stem": "A lump of sugar sits at the bottom of a glass of water. A student blows bubbles through a straw into the water, and the lump dissolves faster than a lump in a still glass. Why?", "options": ["The bubbles heat the water around the lump as they rise.", "The bubbles move the water, so fresh water keeps reaching the lump.", "The bubbles push sugar particles out of the lump as they pass.", "The air from the straw dissolves the sugar as it bubbles through."], "key": 1, "why": "Around a still lump, the nearby water soon holds many sugar particles.<br>The rising bubbles move the water, so that crowded water is swept away and fresh water reaches the lump.<br>Fresh water knocks off more sugar particles, so the lump dissolves faster."}, {"d": "medium", "atom": "MAT-033", "stem": "Kira dissolves a spoon of salt in a jar of water, seals the jar and leaves it standing for a week. What happens to the salt during the week?", "options": ["It slowly sinks and gathers on the bottom of the jar.", "It slowly rises and gathers at the surface of the water.", "It stays spread evenly through the water.", "It slowly turns back into grains floating in the water."], "key": 2, "why": "Dissolved salt is particles too small to see, spread evenly through the water.<br>The moving water particles keep them spread out, so they do not sink, rise or gather back into grains.<br>So after a week the salt is still spread evenly through the water."}, {"d": "medium", "atom": "MAT-034", "stem": "A bench holds a beaker of salt water and a beaker of sugar water. What do the two solutions have in common?", "options": ["the same solute", "the same solvent", "the same solute and the same solvent", "neither the solute nor the solvent"], "key": 1, "why": "In salt water the salt dissolved into water; in sugar water the sugar dissolved into water.<br>The solutes differ: salt in one, sugar in the other.<br>The solvent, the substance each dissolved into, is water in both."}, {"d": "medium", "atom": "MAT-035", "stem": "A pitcher of fruit punch made from powder tastes too weak. Which of these makes the punch more concentrated?", "options": ["stirring it for longer", "adding more water", "pouring half of it away", "adding more powder"], "key": 3, "why": "Concentration is how much solute is dissolved in a given amount of solvent.<br>More powder in the same water means more solute in the same solvent: more concentrated.<br>More water spreads the powder thinner; stirring and pouring away change neither the powder nor the water each sip carries."}, {"d": "medium", "atom": "MAT-036", "stem": "Esme has 300 mL of strong mint tea and wants every sip half as strong. How much hot water should she add?", "options": ["100 mL", "150 mL", "300 mL", "600 mL"], "key": 2, "why": "Diluting spreads the same solute through more solvent.<br>For each sip to carry half as much, the same tea must be spread through twice the water.<br>300 mL becomes 600 mL when 300 mL of water is added, so she adds 300 mL."}, {"d": "medium", "atom": "MAT-037", "fig": "bal_pp_kosher", "stem": "The balance was zeroed with the empty beaker on it. A student poured in water, then stirred in kosher salt until it vanished; the balances show the water alone and the finished salt water. What was the mass of the salt?", "options": ["18 g", "320 g", "338 g", "658 g"], "key": 0, "why": "Values: mass of salt water = 338 g, mass of water = 320 g.<br>Equation: mass of solute = mass of solution − mass of solvent.<br>Substitute: 338 g − 320 g.<br>Calculate: 338 − 320 = 18.<br>Answer: mass of salt = 18 g."}, {"d": "medium", "atom": "MAT-038", "fig": "tt3_pp_drop", "stem": "The table gives how long one cough drop took to dissolve at three water temperatures. A fourth cough drop of the same kind goes into water at 70 °C, unstirred. About how long does it take?", "options": ["less than 4 minutes", "4 minutes", "between 4 and 8 minutes", "more than 16 minutes"], "key": 0, "why": "Each warmer cup dissolved the cough drop in less time: 16, then 8, then 4 minutes.<br>Warmer water particles hit the cough drop harder and more often, so they knock particles off sooner.<br>70 °C is warmer than 50 °C, so the fourth drop takes less than 4 minutes."}, {"d": "medium", "atom": "MAT-039", "stem": "A bag of brown sugar has hardened into one solid lump. A baker wants the lump to dissolve fast in a bowl of cold water without stirring. What should she do?", "options": ["use less of the lump", "break the lump into small pieces", "use a bigger bowl of water", "use a metal bowl instead of a glass one"], "key": 1, "why": "Dissolving happens only at the surface of the sugar.<br>Small pieces have far more surface for the water to reach than one lump.<br>So breaking the lump makes it dissolve faster; less sugar, more water and a different bowl add no surface."}, {"d": "medium", "atom": "MAT-040", "stem": "A student stirs drink powder into a glass of water, and every grain has dissolved. She keeps stirring for another minute. What does the extra minute of stirring do?", "options": ["It makes the drink more concentrated.", "It keeps the powder spread evenly through the water.", "It makes the drink warmer.", "It changes nothing."], "key": 3, "why": "Stirring only speeds up dissolving: it brings fresh water to the solute.<br>Every grain has already dissolved, so there is no solute left to dissolve.<br>Dissolved powder stays spread evenly on its own, and stirring adds no powder and no warmth, so the extra minute changes nothing."}, {"d": "medium", "atom": "MAT-041", "stem": "Which of these mixtures can be separated by sieving?", "options": ["acorns mixed into fine potting soil", "sugar dissolved in water", "steel nuts and brass nuts of the same size", "chalk dust stirred into water"], "key": 0, "why": "Sieving separates big pieces from small ones: the small pieces fall through the mesh.<br>Acorns are big and potting soil is fine, so the soil falls through and the acorns stay.<br>Dissolved sugar has no pieces, the nuts are the same size, and chalk dust is far too fine for a mesh."}, {"d": "medium", "atom": "MAT-041", "fig": "pt_pp_bells", "stem": "Large steel bells and small steel bells are mixed in a craft box. The table gives three properties of each. Which method separates the large bells from the small ones?", "options": ["filtering", "evaporating", "using a magnet", "sieving"], "key": 3, "why": "Find a property that one part has and the other does not.<br>A magnet pulls both kinds of bell, and neither dissolves, so those properties are the same for both.<br>Only the size differs: the small bells fall through a mesh and the large ones stay, so the method is sieving."}, {"d": "medium", "atom": "MAT-035", "fig": "pp_cubes_table", "stem": "The table shows two mugs of hot water. After all the sugar has dissolved, how do the concentrations of the two mugs compare?", "options": ["Mug A is more concentrated.", "Mug B is more concentrated.", "The two mugs have the same concentration.", "Mug A is more concentrated at first; then the two are the same."], "key": 1, "why": "Crushing a cube changes its surface, not its mass: the powder in mug A is still one cube of sugar.<br>Mug B holds two cubes: twice the sugar in the same 250 mL of water.<br>More solute in the same solvent means more concentrated, so mug B, once everything has dissolved."}, {"d": "medium", "atom": "MAT-041", "stem": "A student dissolves salt in water for a project. Later she wants both the salt and the water back, so she leaves the salt water in a warm pan until it is dry. What does evaporating give her back?", "options": ["the salt only", "the water only", "the salt and the water, each on its own", "neither the salt nor the water"], "key": 0, "why": "The water evaporates: it turns into a gas and leaves the pan for the air.<br>The salt does not evaporate, so the salt is left behind on the dry pan.<br>Evaporating gets the dissolved salt back, but the water is gone into the air, so she gets the salt only."}, {"d": "hard", "atom": "MAT-033", "stem": "Nico shakes fine sand into a jar of water. The water turns cloudy, and for a minute every scoop looks the same. He says: \"It looks the same all through, so it is a solution.\" Which statement about Nico's claim is correct?", "options": ["Nico is right: it looked the same all the way through for a minute.", "Nico is right: the sand broke into pieces too small to see.", "Nico is wrong: the sand did not dissolve, and it will settle.", "Nico is wrong: sand is a solid, and solids never make solutions."], "key": 2, "why": "A solution is made when one substance dissolves evenly into another.<br>The sand grains stayed grains; they only swirled about, and they will settle.<br>Looking the same for a minute is not dissolving, so the jar does not hold a solution; many solids, such as salt, do make solutions."}, {"d": "hard", "atom": "MAT-036", "stem": "Oscar finds his lemonade too sweet. He pours half of it away, then tops the glass up with water. His friend says the pouring away made it weaker. Which statement is correct?", "options": ["Adding the water made it weaker; pouring away did not.", "Pouring away made it weaker; the added water made no difference.", "Both steps made the lemonade weaker.", "Neither step changed the concentration of the lemonade."], "key": 0, "why": "Pouring half away removes lemonade and water together, so what is left is just as concentrated.<br>Adding water spreads the same lemonade through more water: diluting.<br>So only the added water made the drink weaker."}, {"d": "hard", "atom": "MAT-037", "stem": "Ibrahim zeroes a balance with an empty beaker on it, then dissolves 20 g of sugar in 300 g of water in the beaker. The balance reads 320 g. He says: \"The sugar disappeared, so it should read 300 g; the balance must be broken.\" Which statement is correct?", "options": ["Ibrahim is right: dissolved sugar has no mass of its own.", "The balance is right: dissolving adds extra mass to the water itself.", "Ibrahim is right: only solids have mass on a balance.", "The balance is right: the dissolved sugar is still in the water."], "key": 3, "why": "Dissolving breaks the sugar into particles too small to see, spread through the water.<br>Every sugar particle is still in the beaker, so its mass is still there.<br>300 g + 20 g = 320 g, so the balance is right."}, {"d": "hard", "atom": "MAT-038", "fig": "pp_zainab_table", "stem": "Two identical sugar cubes go into two cups of water, set up as the table shows. Cup B's cube dissolves first. Zainab says this proves warmer water dissolves sugar faster. Which statement about Zainab's claim is correct?", "options": ["It does not prove it: the cups differ in temperature and in stirring.", "It proves it: cup B was warmer, and its cube won.", "It proves it: stirring only matters when the water is cold.", "It does not prove it: one cube was probably smaller than the other."], "key": 0, "why": "To show that one thing is the cause, only that one thing may differ.<br>The cups differ in temperature and in stirring, and stirring also changes the speed.<br>So the result cannot prove which difference made cup B's cube win."}, {"d": "hard", "atom": "MAT-039", "stem": "Pablo breaks a 6 g sugar cube into eight pieces and drops them into water. He says: \"The pieces dissolve faster because breaking made the sugar lighter.\" Which statement about Pablo's claim is correct?", "options": ["The pieces dissolve faster, because they have less mass than the cube had.", "The pieces dissolve faster, because they have more surface than the cube had.", "The pieces dissolve more slowly, because eight pieces are more work for the water.", "The pieces dissolve at the same rate, because their mass is still 6 g."], "key": 1, "why": "Breaking changes the surface, not the mass: the pieces still hold 6 g.<br>Dissolving happens only at the surface, and eight pieces have far more surface than one cube.<br>So the pieces dissolve faster, for a different reason than Pablo's."}, {"d": "hard", "atom": "MAT-041", "stem": "A jar holds sand, salt and water. The salt has dissolved; the sand has not. How can a student get the sand out and the salt out, each on its own?", "options": ["evaporate the water first, then filter the dry solid", "filter once: the paper holds back both the sand and the salt", "filter, then evaporate the water that ran through", "sieve the sand out, then filter the salt out of the water"], "key": 2, "why": "The sand did not dissolve, so filtering holds it back and lets the salt water through.<br>The salt is dissolved in that water, so evaporating the water leaves the salt.<br>Evaporating first would leave sand and salt mixed, and paper cannot hold back dissolved salt."}, {"d": "hard", "atom": "MAT-033", "stem": "Jude stirs a spoon of salt and a spoon of dried parsley flakes into a pan of water. He says: \"The salt did not dissolve, because I can still see bits floating in the water.\" Which statement about Jude's claim is correct?", "options": ["Jude is correct: bits floating in the water mean that the salt is still there as grains.", "Jude is not correct: the floating bits are parsley; the salt dissolved and cannot be seen.", "Jude is correct: salt and parsley flakes stick together, so the salt floats with the parsley.", "Jude is not correct: the parsley dissolved as well, only more slowly than the salt did."], "key": 1, "why": "Salt dissolves: it breaks into particles too small to see and spreads through the water.<br>Dried parsley flakes do not dissolve: they stay flakes and float.<br>So the bits Jude sees are parsley, not salt, and Jude is not correct."}, {"d": "hard", "atom": "MAT-034", "stem": "Petra shakes 5 mL of water into a bottle holding 250 mL of nail-polish remover, and the water vanishes into the remover. She says: \"The water is the solvent, because water is always the solvent.\" Which statement about Petra's claim is correct?", "options": ["Petra is not correct: the water dissolved into the remover, so here the water is the solute.", "Petra is correct: water is the solvent in every solution that it is part of, however little of it there is.", "Petra is correct: a solvent can never dissolve into another substance.", "Petra is not correct: neither one is a solute, because both are liquids."], "key": 0, "why": "The substance that dissolves is the solute; the substance it dissolves into is the solvent.<br>The small amount of water vanished into the large amount of remover.<br>So here the remover is the solvent and the water is the solute.<br>Water is the solvent only when something dissolves into it, so Petra is not correct."}, {"d": "hard", "atom": "MAT-035", "stem": "Two glasses of salt water look exactly alike. Uma says: \"They look the same, so they must have the same concentration.\" Which statement about Uma's claim is correct?", "options": ["Uma is correct: two solutions that look exactly the same must hold exactly the same amount of solute in the same water.", "Uma is correct: salt water is always the same concentration.", "Uma is not correct: the glass with more water in it is always the more concentrated one.", "Uma is not correct: dissolved salt is too small to see, so looks cannot tell the concentration."], "key": 3, "why": "Dissolved salt is particles too small to see, and salt water has no color.<br>A glass with 5 g of salt and a glass with 20 g in the same water look exactly alike.<br>Concentration is how much solute is in a given amount of solvent, so the masses tell it and looks do not.<br>So Uma is not correct."}, {"d": "hard", "atom": "MAT-036", "stem": "Zeke pours 100 g of water into 200 g of cherry drink and stirs. He says: \"The drink is weaker now, so it has less mass than before.\" Which statement about Zeke's claim is correct?", "options": ["Zeke is correct: a weaker drink always has less mass.", "Zeke is correct: some of the drink's mass spread out into the water he added, and that mass was lost.", "Zeke is not correct: adding water adds mass, so the drink now has a mass of 300 g.", "Zeke is not correct: the mass stays 200 g, because diluting changes only the taste."], "key": 2, "why": "Weaker means less concentrated: the same drink mix spread through more water.<br>Values: mass of drink = 200 g, mass of water added = 100 g.<br>Equation: mass after = mass before + mass of water added.<br>Substitute: 200 g + 100 g.<br>Calculate: 200 + 100 = 300.<br>Answer: 300 g, so Zeke is not correct."}, {"d": "hard", "atom": "MAT-037", "stem": "Orla dissolves 20 g of sugar in 180 g of water in an open beaker on a balance zeroed with the empty beaker, and the balance reads 200 g. The next day the same beaker reads 196 g, and Orla says: \"Dissolving destroyed some of the sugar's mass.\" Which statement about her claim is correct?", "options": ["Orla is correct: dissolved sugar slowly loses its mass.", "Orla is correct: a balance always reads a little low for a solution.", "Orla is not correct: some of the water evaporated from the open beaker.", "Orla is not correct: the balance is broken, because a reading should never change overnight."], "key": 2, "why": "Every sugar particle is still in the beaker: dissolving destroys no mass.<br>The beaker is open, so some water evaporated: it left as a gas.<br>200 g − 196 g = 4 g of water left; the 20 g of sugar is all still there.<br>So Orla is not correct."}, {"d": "hard", "atom": "MAT-038", "stem": "Rashid drops a sugar cube into a glass of cold water from the fridge and does not stir. He says: \"It will dissolve in this too; it will just take longer than in warm water.\" Which statement about Rashid's claim is correct?", "options": ["Rashid is correct: cold water has bigger gaps between its particles, so the sugar has more room to fall into.", "Rashid is correct: cold water particles still hit the cube, only more gently and less often.", "Rashid is not correct: sugar dissolves only in warm water.", "Rashid is not correct: in cold water the sugar freezes instead of dissolving."], "key": 1, "why": "Water particles knock sugar particles off the cube in cold water and in warm water alike.<br>Cold water particles move more slowly, so they hit more gently and less often.<br>So the cube still dissolves, only more slowly, and Rashid is correct.<br>Gaps between particles do not dissolve sugar; the hits do."}, {"d": "hard", "atom": "MAT-039", "stem": "Fatima drops a 5 g sugar cube into one beaker of water at 20 °C and 5 g of the same sugar, ground to powder, into a matching beaker of water; neither is stirred. She says: \"The powder will be gone first, but in the end both beakers will be equally sweet.\" Which statement about Fatima's claim is correct?", "options": ["Fatima is not correct: the powder holds less sugar, so its water ends up less sweet.", "Fatima is correct: each beaker holds 5 g of sugar, and the powder has more surface.", "Fatima is not correct: the powder dissolves more sugar in total, so its water ends up sweeter.", "Fatima is correct: the powder's grains are lighter, so the water lifts them and dissolves them first."], "key": 1, "why": "Dissolving happens only at the surface, and the powder has far more surface than the cube.<br>So more sugar particles are knocked off at once, and the powder is gone first.<br>Grinding changes the surface, not the mass: each beaker holds 5 g of sugar in the same water, so both end up equally sweet.<br>So Fatima is correct."}, {"d": "hard", "atom": "MAT-040", "stem": "Lorenzo stirs a cup of water until the sugar cube in it is gone. He says: \"The spoon knocked the sugar particles off the cube; the water did nothing.\" Which statement about Lorenzo's claim is correct?", "options": ["Lorenzo is correct: only a moving spoon can knock sugar particles off a cube, and still water on its own cannot.", "Lorenzo is correct: the spoon warmed the water, and the warm water did the work.", "Lorenzo is not correct: the spoon pushed sugar particles off, but the water carried them away.", "Lorenzo is not correct: water particles knock the sugar particles off; the spoon only brings fresh water."], "key": 3, "why": "Water particles bump into the cube and knock sugar particles off its surface, stirred or not.<br>Around a still cube that water soon grows crowded with sugar particles, so fewer come off.<br>The spoon sweeps the crowded water away and brings fresh water, which knocks off more.<br>So the water did the dissolving, and Lorenzo is not correct."}], "figs": {"box_drinkmix_flour": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 550 230\" style=\"width:100%;max-width:687px;height:auto\" role=\"img\" aria-label=\"Two sample boxes side by side. Left, the drink mix glass: open drink mix particles spread evenly among filled water particles. Right, the flour glass: filled water particles above, and along the bottom two clumps of open flour particles stuck together as grains\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"550\" height=\"230\" fill=\"#ffffff\"/><rect x=\"110\" y=\"15\" width=\"150\" height=\"110\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><circle cx=\"137.0\" cy=\"33.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"33.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"201.0\" cy=\"33.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"233.0\" cy=\"33.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"137.0\" cy=\"59.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"59.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"201.0\" cy=\"59.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"233.0\" cy=\"59.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"137.0\" cy=\"85.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"85.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"201.0\" cy=\"85.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"233.0\" cy=\"85.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"137.0\" cy=\"111.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"111.0\" r=\"7\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"201.0\" cy=\"111.0\" r=\"7\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/
