<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 215" width="100%" role="img" aria-label="Q: What is the mass of the salt water? Worked in five lines: values, mass of water 200 g and mass of salt 15 g; equation, mass of solution = mass of solvent + mass of solute; substitute, 200 g + 15 g; calculate, 200 + 15 = 215; answer, mass of solution = 215 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="215" fill="#ffffff"/><text x="30" y="26" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Q: What is the mass of the salt water?</text><text x="30" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Values</text><text x="140" y="56" text-anchor="start" font-size="14" font-weight="normal" fill="#222">mass of water = 200 g, mass of salt = 15 g</text><text x="30" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Equation</text><text x="140" y="86" text-anchor="start" font-size="14" font-weight="normal" fill="#222">mass of solution = mass of solvent + mass of solute</text><text x="30" y="116" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Substitute</text><text x="140" y="116" text-anchor="start" font-size="14" font-weight="normal" fill="#222">mass of solution = 200 g + 15 g</text><text x="30" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Calculate</text><text x="140" y="146" text-anchor="start" font-size="14" font-weight="normal" fill="#222">200 + 15 = 215</text><text x="30" y="176" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Answer</text><text x="140" y="176" text-anchor="start" font-size="14" font-weight="normal" fill="#222">mass of solution = 215 g</text></svg>