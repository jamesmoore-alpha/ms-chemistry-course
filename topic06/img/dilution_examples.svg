<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 158" width="100%" role="img" aria-label="A table of three cases: salty soup with a cup of water added, more solvent, diluted and less concentrated; dark tea with hot water added, more solvent, diluted and less concentrated; the drink with more syrup added, more solute, not diluting and more concentrated. Note: adding solvent dilutes; adding solute does not. A table. Header: the case | what is added | the result. Row: salty soup + a cup of water | more solvent | diluted: less concentrated. Row: dark tea + hot water | more solvent | diluted: less concentrated. Row: the drink + more syrup | more solute | not diluting: more concentrated. Note under the table: Adding solvent dilutes; adding solute does not." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="158" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="100.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the case</text><text x="250.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what is added</text><text x="420.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the result</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="100.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salty soup + a cup of water</text><text x="250.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more solvent</text><text x="420.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">diluted: less concentrated</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="100.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">dark tea + hot water</text><text x="250.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more solvent</text><text x="420.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">diluted: less concentrated</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="100.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the drink + more syrup</text><text x="250.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more solute</text><text x="420.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">not diluting: more concentrated</text><line x1="190" y1="10" x2="190" y2="122" stroke="#222"/><line x1="310" y1="10" x2="310" y2="122" stroke="#222"/><text x="270.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Adding solvent dilutes; adding solute does not.</text><!--blind: A table. Header: the case | what is added | the result. Row: salty soup + a cup of water | more solvent | diluted: less concentrated. Row: dark tea + hot water | more solvent | diluted: less concentrated. Row: the drink + more syrup | more solute | not diluting: more concentrated. Note under the table: Adding solvent dilutes; adding solute does not.--></svg>