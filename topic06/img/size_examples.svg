<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 130" width="100%" role="img" aria-label="A table of two more examples: a bath bomb dissolves slowly whole and faster crumbled; salt dissolves slowly as coarse crystals and faster as fine crystals. Note: the smaller the pieces, the faster the solute dissolves. A table. Header: the solute | bigger pieces | smaller pieces. Row: a bath bomb | whole: dissolves slowly | crumbled: dissolves faster. Row: salt | coarse: dissolves slowly | fine: dissolves faster. Note under the table: The smaller the pieces, the faster the solute dissolves." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="130" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solute</text><text x="235.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bigger pieces</text><text x="425.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">smaller pieces</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a bath bomb</text><text x="235.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">whole: dissolves slowly</text><text x="425.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">crumbled: dissolves faster</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt</text><text x="235.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">coarse: dissolves slowly</text><text x="425.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">fine: dissolves faster</text><line x1="140" y1="10" x2="140" y2="94" stroke="#222"/><line x1="330" y1="10" x2="330" y2="94" stroke="#222"/><text x="265.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The smaller the pieces, the faster the solute dissolves.</text><!--blind: A table. Header: the solute | bigger pieces | smaller pieces. Row: a bath bomb | whole: dissolves slowly | crumbled: dissolves faster. Row: salt | coarse: dissolves slowly | fine: dissolves faster. Note under the table: The smaller the pieces, the faster the solute dissolves.--></svg>