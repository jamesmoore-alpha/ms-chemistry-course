<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" role="img" aria-label="Two glasses. Left, before: dark liquid up to a line marked 200 mL, labeled 40 g of syrup in 200 mL of water. An arrow labeled add water. Right, after: paler liquid up to a line marked 400 mL, labeled the same 40 g in 400 mL of water. Beneath: dark and strong, then paler and weaker" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="250" fill="#ffffff"/><path d="M 60 30 L 68 180 L 142 180 L 150 30" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="64,117.0 146,117.0 141,179 69,179" fill="#555"/><line x1="62" y1="117.0" x2="148" y2="117.0" stroke="#222"/><text x="156" y="121.0" text-anchor="start" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="105" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">before</text><text x="105" y="218" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 g of syrup in 200 mL of water</text><line x1="215.0" y1="100.0" x2="265.0" y2="100.0" stroke="#222" stroke-width="1.6"/><polyline points="259.6,102.6 265.0,100.0 259.6,97.4" fill="none" stroke="#222" stroke-width="1.6"/><text x="240" y="88" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">add</text><text x="240" y="122" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><path d="M 300 30 L 308 180 L 382 180 L 390 30" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="302,54.0 388,54.0 381,179 309,179" fill="#d9d9d9"/><line x1="302" y1="54.0" x2="388" y2="54.0" stroke="#222"/><text x="396" y="58.0" text-anchor="start" font-size="13" font-weight="normal" fill="#222">400 mL</text><text x="345" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after</text><text x="345" y="218" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the same 40 g in 400 mL of water</text><text x="255" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">dark and strong  →  paler and weaker</text></svg>