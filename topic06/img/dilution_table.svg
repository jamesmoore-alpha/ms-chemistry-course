<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 130" width="100%" role="img" aria-label="A table: before, 40 g of syrup in 200 mL of water, more concentrated; after, 40 g of syrup in 400 mL of water, less concentrated. Note: the same solute in more solvent, the concentration goes down. A table. Header: (blank) | syrup (solute) | water (solvent) | concentration. Row: before | 40 g | 200 mL | more concentrated. Row: after | 40 g | 400 mL | less concentrated. Note under the table: The same solute in more solvent: the concentration goes down." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="130" fill="#ffffff"/><rect x="10" y="10" width="490" height="28" fill="#f1f1f1" stroke="#222"/><text x="50.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="150.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">syrup (solute)</text><text x="275.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water (solvent)</text><text x="420.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">concentration</text><rect x="10" y="38" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="50.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">before</text><text x="150.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 g</text><text x="275.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="420.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more concentrated</text><rect x="10" y="66" width="490" height="28" fill="#ffffff" stroke="#222"/><text x="50.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after</text><text x="150.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 g</text><text x="275.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">400 mL</text><text x="420.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">less concentrated</text><line x1="90" y1="10" x2="90" y2="94" stroke="#222"/><line x1="210" y1="10" x2="210" y2="94" stroke="#222"/><line x1="340" y1="10" x2="340" y2="94" stroke="#222"/><text x="255.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The same solute in more solvent: the concentration goes down.</text><!--blind: A table. Header: (blank) | syrup (solute) | water (solvent) | concentration. Row: before | 40 g | 200 mL | more concentrated. Row: after | 40 g | 400 mL | less concentrated. Note under the table: The same solute in more solvent: the concentration goes down.--></svg>