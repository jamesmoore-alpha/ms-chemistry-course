<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" role="img" aria-label="The equation mass of solution = mass of solvent + mass of solute, with each term labeled beneath: the water with the salt in it; the water; the salt; every mass in grams" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="160" fill="#ffffff"/><text x="95" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">mass of solution</text><text x="190" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">=</text><text x="275" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">mass of solvent</text><text x="360" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">+</text><text x="440" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">mass of solute</text><line x1="95" y1="60" x2="95" y2="82" stroke="#222"/><text x="95" y="98" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the water with the</text><text x="95" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">salt in it</text><line x1="275" y1="60" x2="275" y2="82" stroke="#222"/><text x="275" y="98" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the water</text><line x1="440" y1="60" x2="440" y2="82" stroke="#222"/><text x="440" y="98" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the salt</text><text x="265" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">every mass in grams (g)</text></svg>