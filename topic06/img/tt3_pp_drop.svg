<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 158" width="100%" role="img" aria-label="A table giving how long one cough drop took to dissolve in water at three temperatures, the same water and no stirring. A table. Header: water temperature | time for the cough drop to dissolve. Row: 10 °C | 16 minutes. Row: 30 °C | 8 minutes. Row: 50 °C | 4 minutes. Note under the table: Same kind of cough drop, same water, no stirring." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="158" fill="#ffffff"/><rect x="20" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="110.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water temperature</text><text x="325.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">time for the cough drop to dissolve</text><rect x="20" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">10 °C</text><text x="325.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">16 minutes</text><rect x="20" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">30 °C</text><text x="325.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8 minutes</text><rect x="20" y="94" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">50 °C</text><text x="325.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4 minutes</text><line x1="200" y1="10" x2="200" y2="122" stroke="#222"/><text x="235.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Same kind of cough drop, same water, no stirring.</text><!--blind: A table. Header: water temperature | time for the cough drop to dissolve. Row: 10 °C | 16 minutes. Row: 30 °C | 8 minutes. Row: 50 °C | 4 minutes. Note under the table: Same kind of cough drop, same water, no stirring.--></svg>