<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 130" width="100%" role="img" aria-label="A table of two more examples: salt in a bottle of water dissolves slowly left still and faster shaken; drink powder in a glass dissolves slowly left to sit and faster stirred. Note: stirring or shaking brings fresh water to the solute. A table. Header: the solute | left still | moved. Row: salt in a bottle of water | still: dissolves slowly | shaken: dissolves faster. Row: drink powder in a glass | left to sit: dissolves slowly | stirred: dissolves faster. Note under the table: Stirring or shaking brings fresh water to the solute." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="130" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="95.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solute</text><text x="265.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">left still</text><text x="435.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">moved</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="95.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt in a bottle of water</text><text x="265.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">still: dissolves slowly</text><text x="435.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">shaken: dissolves faster</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="95.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">drink powder in a glass</text><text x="265.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">left to sit: dissolves slowly</text><text x="435.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stirred: dissolves faster</text><line x1="180" y1="10" x2="180" y2="94" stroke="#222"/><line x1="350" y1="10" x2="350" y2="94" stroke="#222"/><text x="265.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Stirring or shaking brings fresh water to the solute.</text><!--blind: A table. Header: the solute | left still | moved. Row: salt in a bottle of water | still: dissolves slowly | shaken: dissolves faster. Row: drink powder in a glass | left to sit: dissolves slowly | stirred: dissolves faster. Note under the table: Stirring or shaking brings fresh water to the solute.--></svg>