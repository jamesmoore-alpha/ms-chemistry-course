nt-weight="normal" fill="#222">500 mL</text><text x="440.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more concentrated</text><line x1="110" y1="10" x2="110" y2="94" stroke="#222"/><line x1="230" y1="10" x2="230" y2="94" stroke="#222"/><line x1="360" y1="10" x2="360" y2="94" stroke="#222"/><text x="265.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The same sugar in less water: pitcher B is more concentrated.</text><!--blind: A table. Header: (blank) | sugar (solute) | water (solvent) | concentration. Row: pitcher A | 30 g | 1,000 mL | less concentrated. Row: pitcher B | 30 g | 500 mL | more concentrated. Note under the table: The same sugar in less water: pitcher B is more concentrated.--></svg>