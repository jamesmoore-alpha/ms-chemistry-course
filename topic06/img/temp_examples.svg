<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 130" width="100%" role="img" aria-label="A table of two more examples: a spoon of salt dissolves slowly in cold water and faster in warm water; drink powder dissolves slowly in ice water and faster in hot water. Note: the warmer the solvent, the faster the solute dissolves. A table. Header: the solute | colder water | warmer water. Row: a spoon of salt | cold: dissolves slowly | warm: dissolves faster. Row: drink powder | ice water: dissolves slowly | hot water: dissolves faster. Note under the table: The warmer the solvent, the faster the solute dissolves." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="130" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solute</text><text x="235.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">colder water</text><text x="425.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">warmer water</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a spoon of salt</text><text x="235.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cold: dissolves slowly</text><text x="425.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">warm: dissolves faster</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">drink powder</text><text x="235.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ice water: dissolves slowly</text><text x="425.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hot water: dissolves faster</text><line x1="140" y1="10" x2="140" y2="94" stroke="#222"/><line x1="330" y1="10" x2="330" y2="94" stroke="#222"/><text x="265.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The warmer the solvent, the faster the solute dissolves.</text><!--blind: A table. Header: the solute | colder water | warmer water. Row: a spoon of salt | cold: dissolves slowly | warm: dissolves faster. Row: drink powder | ice water: dissolves slowly | hot water: dissolves faster. Note under the table: The warmer the solvent, the faster the solute dissolves.--></svg>