<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 138" width="100%" role="img" aria-label="A table giving the temperature of the water and whether it is stirred in cup A and in cup B, with one sugar cube in each. A table. Header: (blank) | cup A | cup B. Row: temperature | 30 °C | 60 °C. Row: stirring | stirred | none. Row: sugar | one cube | one cube." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="138" fill="#ffffff"/><rect x="20" y="10" width="450" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="215.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cup A</text><text x="385.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cup B</text><rect x="20" y="38" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">temperature</text><text x="215.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">30 °C</text><text x="385.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">60 °C</text><rect x="20" y="66" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">stirring</text><text x="215.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stirred</text><text x="385.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><rect x="20" y="94" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar</text><text x="215.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one cube</text><text x="385.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one cube</text><line x1="130" y1="10" x2="130" y2="122" stroke="#222"/><line x1="300" y1="10" x2="300" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | cup A | cup B. Row: temperature | 30 °C | 60 °C. Row: stirring | stirred | none. Row: sugar | one cube | one cube.--></svg>