<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 214" width="100%" role="img" aria-label="A table of the two cups: both hold 200 mL of water at 20 °C, neither is stirred; the cube cup has one 4 g cube that takes 12 minutes to dissolve; the grains cup has 4 g of loose grains that dissolve in 2 minutes. Note: only the size of the pieces differs. A table. Header: (blank) | cube cup | grains cup. Row: water | 200 mL | 200 mL. Row: temperature | 20 °C | 20 °C. Row: stirring | none | none. Row: sugar | one 4 g cube | 4 g of loose grains. Row: time to dissolve | 12 minutes | 2 minutes. Note under the table: Only the size of the pieces differs." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="460" height="214" fill="#ffffff"/><rect x="10" y="10" width="440" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="215.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cube cup</text><text x="370.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">grains cup</text><rect x="10" y="38" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="215.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="370.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><rect x="10" y="66" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">temperature</text><text x="215.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">20 °C</text><text x="370.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">20 °C</text><rect x="10" y="94" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">stirring</text><text x="215.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><text x="370.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><rect x="10" y="122" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar</text><text x="215.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one 4 g cube</text><text x="370.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4 g of loose grains</text><rect x="10" y="150" width="440" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">time to dissolve</text><text x="215.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">12 minutes</text><text x="370.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2 minutes</text><line x1="140" y1="10" x2="140" y2="178" stroke="#222"/><line x1="290" y1="10" x2="290" y2="178" stroke="#222"/><text x="230.0" y="196" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Only the size of the pieces differs.</text><!--blind: A table. Header: (blank) | cube cup | grains cup. Row: water | 200 mL | 200 mL. Row: temperature | 20 °C | 20 °C. Row: stirring | none | none. Row: sugar | one 4 g cube | 4 g of loose grains. Row: time to dissolve | 12 minutes | 2 minutes. Note under the table: Only the size of the pieces differs.--></svg>