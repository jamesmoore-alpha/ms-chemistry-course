<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 166" width="100%" role="img" aria-label="A table of the four bench mixtures, the property one part has and the other does not, and the method: coffee grounds in water, the grounds do not dissolve, filtering; salt dissolved in water, the water evaporates and the salt does not, evaporating; iron nails in wood shavings, a magnet pulls iron, using a magnet; marbles in sand, marbles are big and sand grains are small, sieving. A table. Header: the mixture | the property that differs | the method. Row: coffee grounds in water | grounds stay whole; water passes paper | filtering. Row: salt dissolved in water | water evaporates; salt does not | evaporating. Row: nails in wood shavings | a magnet pulls iron, not wood | using a magnet. Row: marbles in sand | marbles big; sand grains small | sieving." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="166" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="90.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the mixture</text><text x="300.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the property that differs</text><text x="480.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the method</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">coffee grounds in water</text><text x="300.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">grounds stay whole; water passes paper</text><text x="480.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">filtering</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt dissolved in water</text><text x="300.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water evaporates; salt does not</text><text x="480.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">evaporating</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nails in wood shavings</text><text x="300.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a magnet pulls iron, not wood</text><text x="480.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">using a magnet</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">marbles in sand</text><text x="300.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">marbles big; sand grains small</text><text x="480.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sieving</text><line x1="170" y1="10" x2="170" y2="150" stroke="#222"/><line x1="430" y1="10" x2="430" y2="150" stroke="#222"/><!--blind: A table. Header: the mixture | the property that differs | the method. Row: coffee grounds in water | grounds stay whole; water passes paper | filtering. Row: salt dissolved in water | water evaporates; salt does not | evaporating. Row: nails in wood shavings | a magnet pulls iron, not wood | using a magnet. Row: marbles in sand | marbles big; sand grains small | sieving.--></svg>