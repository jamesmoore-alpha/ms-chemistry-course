<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 158" width="100%" role="img" aria-label="A table of the three mugs ordered by concentration: the third mug with 20 g of coffee in 200 mL of water is the most concentrated; the second holds 10 g in 200 mL and is in between; the first, 5 g in 200 mL, is the least concentrated. A table. Header: the mug | coffee (solute) | water (solvent) | concentration. Row: third mug | 20 g | 200 mL | most concentrated. Row: second mug | 10 g | 200 mL | in between. Row: first mug | 5 g | 200 mL | least concentrated. Note under the table: Same water in every mug: the mug with the most coffee is the most concentrated." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="158" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="65.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the mug</text><text x="180.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">coffee (solute)</text><text x="300.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water (solvent)</text><text x="440.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">concentration</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">third mug</text><text x="180.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">20 g</text><text x="300.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="440.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">most concentrated</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">second mug</text><text x="180.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10 g</text><text x="300.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="440.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">in between</text><rect x="10" y="94" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">first mug</text><text x="180.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">5 g</text><text x="300.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="440.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">least concentrated</text><line x1="120" y1="10" x2="120" y2="122" stroke="#222"/><line x1="240" y1="10" x2="240" y2="122" stroke="#222"/><line x1="360" y1="10" x2="360" y2="122" stroke="#222"/><text x="265.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Same water in every mug: the mug with the most coffee is the most concentrated.</text><!--blind: A table. Header: the mug | coffee (solute) | water (solvent) | concentration. Row: third mug | 20 g | 200 mL | most concentrated. Row: second mug | 10 g | 200 mL | in between. Row: first mug | 5 g | 200 mL | least concentrated. Note under the table: Same water in every mug: the mug with the most coffee is the most concentrated.--></svg>