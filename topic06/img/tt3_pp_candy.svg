<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 158" width="100%" role="img" aria-label="A table giving how long 5 g of hard candy took to dissolve as one piece, as four pieces and crushed to powder, in the same water at the same temperature with no stirring. A table. Header: the 5 g of candy | time to dissolve. Row: one piece | 14 minutes. Row: four pieces, 5 g in all | 6 minutes. Row: crushed to powder | 1 minute. Note under the table: Same water, same temperature, no stirring." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="430" height="158" fill="#ffffff"/><rect x="20" y="10" width="390" height="28" fill="#f1f1f1" stroke="#222"/><text x="130.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the 5 g of candy</text><text x="325.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">time to dissolve</text><rect x="20" y="38" width="390" height="28" fill="#ffffff" stroke="#222"/><text x="130.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one piece</text><text x="325.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">14 minutes</text><rect x="20" y="66" width="390" height="28" fill="#ffffff" stroke="#222"/><text x="130.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">four pieces, 5 g in all</text><text x="325.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">6 minutes</text><rect x="20" y="94" width="390" height="28" fill="#ffffff" stroke="#222"/><text x="130.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">crushed to powder</text><text x="325.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 minute</text><line x1="240" y1="10" x2="240" y2="122" stroke="#222"/><text x="215.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Same water, same temperature, no stirring.</text><!--blind: A table. Header: the 5 g of candy | time to dissolve. Row: one piece | 14 minutes. Row: four pieces, 5 g in all | 6 minutes. Row: crushed to powder | 1 minute. Note under the table: Same water, same temperature, no stirring.--></svg>