<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" role="img" aria-label="Evaporating, before and after. Before: a shallow pan of salt water, the salt dissolved and too small to see, the water leaving as wavy lines. An arrow labeled 'a warm place'. After: the same pan dry, the water gone as a gas, a line of salt grains left on the pan" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="180" fill="#ffffff"/><path d="M 110 80 l 10 40 h 110 l 10 -40" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="114,96 236,96 229,119 121,119" fill="#d9d9d9"/><path d="M 141 84 q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#222" stroke-width="1.5"/><path d="M 176 84 q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#222" stroke-width="1.5"/><path d="M 211 84 q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#222" stroke-width="1.5"/><text x="175" y="32" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">before: salt water</text><text x="175" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the salt is dissolved,</text><text x="175" y="155" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">too small to see</text><line x1="252.0" y1="102.0" x2="313.0" y2="102.0" stroke="#222" stroke-width="1.6"/><polyline points="307.6,104.6 313.0,102.0 307.6,99.4" fill="none" stroke="#222" stroke-width="1.6"/><text x="282.5" y="70" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a warm place</text><path d="M 325 80 l 10 40 h 110 l 10 -40" fill="none" stroke="#222" stroke-width="1.5"/><path d="M 373 84 q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#222" stroke-width="1.5"/><path d="M 408 84 q 6 -10 0 -20 q -6 -10 0 -20" fill="none" stroke="#222" stroke-width="1.5"/><circle cx="341" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="352" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="363" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="374" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="385" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="396" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="407" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="418" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="429" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="440" cy="116" r="2.2" fill="#ffffff" stroke="#222"/><text x="390" y="32" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">after: the water has left as a gas</text><text x="390" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">salt grains are left on the pan</text><text x="390" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">evaporating</text></svg>