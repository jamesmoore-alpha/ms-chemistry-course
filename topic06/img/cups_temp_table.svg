<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 214" width="100%" role="img" aria-label="A table of the two cups: both hold 200 mL of water and one sugar cube, neither is stirred; the cold cup is at 20 °C and its cube takes 12 minutes to dissolve; the hot cup is at 60 °C and its cube is gone in 3 minutes. Note: only the temperature differs. A table. Header: (blank) | cold cup | hot cup. Row: water | 200 mL | 200 mL. Row: sugar | one cube | one cube. Row: stirring | none | none. Row: temperature | 20 °C | 60 °C. Row: time to dissolve | 12 minutes | 3 minutes. Note under the table: Only the temperature differs." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="450" height="214" fill="#ffffff"/><rect x="10" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="215.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cold cup</text><text x="365.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hot cup</text><rect x="10" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="215.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><text x="365.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">200 mL</text><rect x="10" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar</text><text x="215.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one cube</text><text x="365.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">one cube</text><rect x="10" y="94" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">stirring</text><text x="215.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><text x="365.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><rect x="10" y="122" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">temperature</text><text x="215.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">20 °C</text><text x="365.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">60 °C</text><rect x="10" y="150" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">time to dissolve</text><text x="215.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">12 minutes</text><text x="365.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3 minutes</text><line x1="140" y1="10" x2="140" y2="178" stroke="#222"/><line x1="290" y1="10" x2="290" y2="178" stroke="#222"/><text x="225.0" y="196" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Only the temperature differs.</text><!--blind: A table. Header: (blank) | cold cup | hot cup. Row: water | 200 mL | 200 mL. Row: sugar | one cube | one cube. Row: stirring | none | none. Row: temperature | 20 °C | 60 °C. Row: time to dissolve | 12 minutes | 3 minutes. Note under the table: Only the temperature differs.--></svg>