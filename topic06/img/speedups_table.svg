<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 158" width="100%" role="img" aria-label="A table of the three ways to speed up dissolving: warmer water, the water particles hit the solute harder and more often; smaller pieces, the water particles reach far more surface; stirring, fresh water keeps arriving. Each makes the solute dissolve faster. Note: none changes how much solute there is, only how fast it dissolves. A table. Header: what you change | what the water particles do | so the solute dissolves. Row: warmer water | hit the solute harder and more often | faster. Row: smaller pieces | reach far more surface | faster. Row: stirring | fresh water keeps arriving | faster. Note under the table: None of the three changes how much solute there is, only how fast it dissolves." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="158" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what you change</text><text x="260.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what the water particles do</text><text x="455.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">so the solute dissolves</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">warmer water</text><text x="260.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hit the solute harder and more often</text><text x="455.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">faster</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">smaller pieces</text><text x="260.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">reach far more surface</text><text x="455.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">faster</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">stirring</text><text x="260.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">fresh water keeps arriving</text><text x="455.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">faster</text><line x1="140" y1="10" x2="140" y2="122" stroke="#222"/><line x1="380" y1="10" x2="380" y2="122" stroke="#222"/><text x="270.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">None of the three changes how much solute there is, only how fast it dissolves.</text><!--blind: A table. Header: what you change | what the water particles do | so the solute dissolves. Row: warmer water | hit the solute harder and more often | faster. Row: smaller pieces | reach far more surface | faster. Row: stirring | fresh water keeps arriving | faster. Note under the table: None of the three changes how much solute there is, only how fast it dissolves.--></svg>