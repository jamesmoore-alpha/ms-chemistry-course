<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 138" width="100%" role="img" aria-label="A table giving the temperature of the water in bowl A and in bowl B, with the same amount of salt in each and no stirring. A table. Header: (blank) | bowl A | bowl B. Row: temperature | 45 °C | 15 °C. Row: salt | same amount | same amount. Row: stirring | none | none." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="138" fill="#ffffff"/><rect x="20" y="10" width="450" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="215.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bowl A</text><text x="385.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bowl B</text><rect x="20" y="38" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">temperature</text><text x="215.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">45 °C</text><text x="385.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">15 °C</text><rect x="20" y="66" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt</text><text x="215.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">same amount</text><text x="385.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">same amount</text><rect x="20" y="94" width="450" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">stirring</text><text x="215.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><text x="385.0" y="113" text-anchor="middle" font-size="13" font-weight="no