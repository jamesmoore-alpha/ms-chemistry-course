<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 260" width="100%" role="img" aria-label="Three balances in a row with a plus and an equals sign between them: a beaker of water on a balance zeroed with the empty beaker reads 200 g; a paper holding a heap of salt reads 15 g; the beaker of salt water, with the salt dissolved, reads 215 g. Beneath: 200 g + 15 g = 215 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="260" fill="#ffffff"/><rect x="10" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="10" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="50" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="85" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">200 g</text><rect x="53" y="96" width="64" height="54" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="54" y="112" width="62" height="37" fill="#d9d9d9"/><line x1="54" y1="112" x2="116" y2="112" stroke="#222"/><text x="85" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the water</text><rect x="190" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="190" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="230" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="265" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">15 g</text><polygon points="225,150 305,150 299,142 231,142" fill="#f1f1f1" stroke="#222"/><path d="M 247 142 q 18 -22 36 0 z" fill="#ffffff" stroke="#222"/><circle cx="257" cy="136" r="1.3" fill="#222"/><circle cx="265" cy="130" r="1.3" fill="#222"/><circle cx="273" cy="136" r="1.3" fill="#222"/><circle cx="262" cy="139" r="1.3" fill="#222"/><circle cx="270" cy="140" r="1.3" fill="#222"/><text x="265" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the salt on its paper</text><rect x="370" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="370" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="410" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="445" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">215 g</text><rect x="413" y="96" width="64" height="54" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="414" y="112" width="62" height="37" fill="#d9d9d9"/><line x1="414" y1="112" x2="476" y2="112" stroke="#222"/><text x="445" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the salt water</text><text x="175" y="192" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">+</text><text x="355" y="192" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">=</text><text x="265" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">200 g + 15 g = 215 g</text></svg>