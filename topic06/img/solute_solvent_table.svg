<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 194" width="100%" role="img" aria-label="A table of five solutions with their solute and solvent: hummingbird nectar, sugar in water; salt water, salt in water; soda water, carbon dioxide gas in water; sweet tea, honey in tea; tinted water, food coloring in water. A table. Header: the solution | solute (dissolves) | solvent (dissolves it). Row: hummingbird nectar | sugar | water. Row: salt water | salt | water. Row: soda water | carbon dioxide gas | water. Row: sweet tea | honey | tea. Row: tinted water | food coloring | water." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="194" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="90.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solution</text><text x="255.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solute (dissolves)</text><text x="430.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solvent (dissolves it)</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hummingbird nectar</text><text x="255.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sugar</text><text x="430.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt water</text><text x="255.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">salt</text><text x="430.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><rect x="10" y="94" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soda water</text><text x="255.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon dioxide gas</text><text x="430.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><rect x="10" y="122" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sweet tea</text><text x="255.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">honey</text><text x="430.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">tea</text><rect x="10" y="150" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tinted water</text><text x="255.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">food coloring</text><text x="430.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><line x1="170" y1="10" x2="170" y2="178" stroke="#222"/><line x1="340" y1="10" x2="340" y2="178" stroke="#222"/><!--blind: A table. Header: the solution | solute (dissolves) | solvent (dissolves it). Row: hummingbird nectar | sugar | water. Row: salt water | salt | water. Row: soda water | carbon dioxide gas | water. Row: sweet tea | honey | tea. Row: tinted water | food coloring | water.--></svg>