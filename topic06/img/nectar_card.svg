<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" role="img" aria-label="A recipe card reading 'Hummingbird nectar: dissolve 50 g of sugar in 200 mL of water', with an arrow from 'sugar' to the words 'the sugar dissolves: the solute' and an arrow from 'water' to 'the water does the dissolving: the solvent'; beneath, the line 'solute + solvent → solution'" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="250" fill="#ffffff"/><rect x="30" y="20" width="440" height="70" rx="6" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="250" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Hummingbird nectar</text><text x="250" y="72" text-anchor="middle" font-size="14" font-weight="normal" fill="#222">Dissolve 50 g of sugar in 200 mL of water.</text><line x1="238.0" y1="92.0" x2="130.0" y2="140.0" stroke="#222" stroke-width="1.6"/><polyline points="133.9,135.4 130.0,140.0 136.0,140.2" fill="none" stroke="#222" stroke-width="1.6"/><text x="105" y="160" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the sugar dissolves:</text><text x="105" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solute</text><line x1="357.0" y1="92.0" x2="400.0" y2="140.0" stroke="#222" stroke-width="1.6"/><polyline points="394.5,137.7 400.0,140.0 398.3,134.2" fill="none" stroke="#222" stroke-width="1.6"/><text x="410" y="160" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the water does the dissolving:</text><text x="410" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the solvent</text><text x="250" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">solute + solvent → solution</text><text x="250" y="235" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the sugar (solute) dissolves into the water (solvent), and the nectar is the solution</text></svg>