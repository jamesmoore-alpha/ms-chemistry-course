<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 205" width="100%" role="img" aria-label="Two bottles side by side. The left bottle's label reads Co, capital C and small o, and under it: a hard, gray metal. The right bottle's label reads CO, two capital letters, and under it: a poisonous gas. Between them: one small letter apart" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="480" height="205" fill="#ffffff"/><rect x="60" y="30" width="70" height="24" rx="6" fill="#d9d9d9" stroke="#222"/><rect x="40" y="52" width="110" height="120" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="55" y="90" width="80" height="44" fill="#f1f1f1" stroke="#222"/><text x="95" y="122" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">Co</text><rect x="350" y="30" width="70" height="24" rx="6" fill="#d9d9d9" stroke="#222"/><rect x="330" y="52" width="110" height="120" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="345" y="90" width="80" height="44" fill="#f1f1f1" stroke="#222"/><text x="385" y="122" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">CO</text><text x="95" y="190" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a hard, gray metal</text><text x="385" y="190" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a poisonous gas</text><text x="240" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">one small letter apart</text></svg>