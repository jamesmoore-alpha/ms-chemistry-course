<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" role="img" aria-label="A desk with a dozen small cards scattered on it at angles, each carrying a symbol and a number, such as Fe 26, O 8, Au 79, Cl 17, Xe 54, Li 3, U 92, Ag 47, Zn 30, H 1, Mg 12, Br 35; a line reads: and 106 more" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="190" fill="#ffffff"/><rect x="10" y="30" width="520" height="150" rx="6" fill="#f1f1f1" stroke="#222"/><text x="270" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">118 cards, one for each element, tipped onto a desk</text><g transform="translate(60 55) rotate(-12)"><rect x="-22" y="-16" width="44" height="32" rx="3" fill="#ffffff" stroke="#222"/><text x="-17" y="-5" text-anchor="start" font-size="8" font-weight="normal" fill="#222">26</text><text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Fe</text></g><g transform="translate(130 100) rotate(15)"><rect x="-22" y="-16" width="44" height="32" rx="3" fill="#ffffff" stroke="#222"/><text x="-17" y="-5" text-anchor="start" font-size="8" font-weight="normal" fill="#222">8</text><text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">O</text></g><g transform="translate(200 55) rotate(30)"><rect x="-22" y="-16" width="44" height="32" rx="3" fill="#ffffff" stroke="#222"/><text x="-17" y="-5" text-anchor="start" font-size="8" font-weight="normal" fill="#222">79</text><text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Au</text></g><g transform="translate(300 115) rotate(-25)"><rect x="-22" y="-16" width="44" height="32" rx="3" fill="#ffffff" stroke="#222"/><text x="-17" y="-5" text-anchor="start" font-size="8" font-weight="normal" fill="#222">17</text><text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Cl</text></g><g transform="translate(400 60) rotate(8)"><rect x="-22" y="