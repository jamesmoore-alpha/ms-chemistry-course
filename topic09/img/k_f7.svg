<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 82" width="100%" role="img" aria-label="A table of one element's three properties" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="625" height="82" fill="#ffffff"/><rect x="10" y="10" width="605" height="28" fill="#f1f1f1" stroke="#222"/><text x="60.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="176.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">shiny?</text><text x="331.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">conducts electricity?</text><text x="518.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><rect x="10" y="38" width="605" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bromine</text><text x="176.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no, a dull liquid</text><text x="331.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="518.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="110" y1="10" x2="110" y2="66" stroke="#222"/><line x1="242" y1="10" x2="242" y2="66" stroke="#222"/><line x1="421" y1="10" x2="421" y2="66" stroke="#222"/><!--blind: A table. Header: element | shiny? | conducts electricity? | bends without breaking?. Row: bromine | no, a dull liquid | no | no.--></svg>