<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 583 138" width="100%" role="img" aria-label="A table of three elements' answers to three questions" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="583" height="138" fill="#ffffff"/><rect x="10" y="10" width="563" height="28" fill="#f1f1f1" stroke="#222"/><text x="60.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="155.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">shiny?</text><text x="289.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">conducts electricity?</text><text x="476.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><rect x="10" y="38" width="563" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cadmium</text><text x="155.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="289.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="476.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="563" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tellurium</text><text x="155.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="289.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">only a little</text><text x="476.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="94" width="563" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nitrogen</text><text x="155.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no, a gas</text><text x="289.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="476.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="110" y1="10" x2="110" y2="122" stroke="#222"/><line x1="200" y1="10" x2="200" y2="122" stroke="#222"/><line x1="379" y1="10" x2="379" y2="122" stroke="#222"/><!--blind: A table. Header: element | shiny? | conducts electricity? | bends without breaking?. Row: cadmium | yes | yes | yes. Row: tellurium | yes | only a little | no. Row: nitrogen | no, a gas | no | no.--></svg>