<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 138" width="100%" role="img" aria-label="A table of the three kinds of element and three properties: a metal is shiny, conducts electricity and bends without breaking; a nonmetal is dull, does not conduct and crumbles or is a gas; a metalloid is shiny, conducts only a little and shatters" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="138" fill="#ffffff"/><rect x="10" y="10" width="540" height="28" fill="#f1f1f1" stroke="#222"/><text x="60.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="155.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">shiny?</text><text x="280.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">conducts electricity?</text><text x="455.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><rect x="10" y="38" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">metal</text><text x="155.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="280.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="455.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nonmetal</text><text x="155.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no, dull</text><text x="280.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="455.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: crumbles, or is a gas</text><rect x="10" y="94" width="540" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">metalloid</text><text x="155.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="280.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">only a little</text><text x="455.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: shatters</text><line x1="110" y1="10" x2="110" y2="122" stroke="#222"/><line x1="200" y1="10" x2="200" y2="122" stroke="#222"/><line x1="360" y1="10" x2="360" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | shiny? | conducts electricity? | bends without breaking?. Row: metal | yes | yes | yes. Row: nonmetal | no, dull | no | no: crumbles, or is a gas. Row: metalloid | yes | only a little | no: shatters.--></svg>