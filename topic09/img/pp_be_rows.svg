<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 138" width="100%" role="img" aria-label="A table of three elements, two rows filled and one row of question marks" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="420" height="138" fill="#ffffff"/><rect x="10" y="10" width="400" height="28" fill="#f1f1f1" stroke="#222"/><text x="60.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="170.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solid or gas?</text><text x="320.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">conducts electricity?</text><rect x="10" y="38" width="400" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">magnesium</text><text x="170.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">solid</text><text x="320.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="400" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nitrogen</text><text x="170.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gas</text><text x="320.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="94" width="400" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">beryllium</text><text x="170.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">?</text><text x="320.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">?</text><line x1="110" y1="10" x2="110" y2="122" stroke="#222"/><line x1="231" y1="10" x2="231" y2="122" stroke="#222"/><!--blind: A table. Header: element | solid or gas? | conducts electricity?. Row: magnesium | solid | yes. Row: nitrogen | gas | no. Row: beryllium | ? | ?.--></svg>