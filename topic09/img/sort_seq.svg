<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559 194" width="100%" role="img" aria-label="A table of five elements in the same frame: copper shiny yes, conducts yes, bends yes, so it is a metal; sulfur dull, no, crumbles, nonmetal; silicon shiny, conducts only a little, shatters, metalloid; aluminum yes, yes, yes, metal; oxygen a gas, no, a gas, nonmetal" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="559" height="194" fill="#ffffff"/><rect x="6" y="10" width="547" height="28" fill="#f1f1f1" stroke="#222"/><text x="48.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="127.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">shiny?</text><text x="238.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">conducts electricity?</text><text x="394.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><text x="514.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">so it is a…</text><rect x="6" y="38" width="547" height="28" fill="#ffffff" stroke="#222"/><text x="48.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">copper</text><text x="127.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="238.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="394.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="514.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">metal</text><rect x="6" y="66" width="547" height="28" fill="#ffffff" stroke="#222"/><text x="48.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sulfur</text><text x="127.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no, dull</text><text x="238.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="394.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: crumbles</text><text x="514.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">nonmetal</text><rect x="6" y="94" width="547" height="28" fill="#ffffff" stroke="#222"/><text x="48.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">silicon</text><text x="127.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="238.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">only a little</text><text x="394.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: shatters</text><text x="514.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">metalloid</text><rect x="6" y="122" width="547" height="28" fill="#ffffff" stroke="#222"/><text x="48.5" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">aluminum</text><text x="127.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="238.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="394.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="514.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">metal</text><rect x="6" y="150" width="547" height="28" fill="#ffffff" stroke="#222"/><text x="48.5" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="127.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no, a gas</text><text x="238.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="394.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: a gas</text><text x="514.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">nonmetal</text><line x1="91" y1="10" x2="91" y2="178" stroke="#222"/><line x1="163" y1="10" x2="163" y2="178" stroke="#222"/><line x1="313" y1="10" x2="313" y2="178" stroke="#222"/><line x1="475" y1="10" x2="475" y2="178" stroke="#222"/><!--blind: A table. Header: element | shiny? | conducts electricity? | bends without breaking? | so it is a…. Row: copper | yes | yes | yes | metal. Row: sulfur | no, dull | no | no: crumbles | nonmetal. Row: silicon | yes | only a little | no: shatters | metalloid. Row: aluminum | yes | yes | yes | metal. Row: oxygen | no, a gas | no | no: a gas | nonmetal.--></svg>