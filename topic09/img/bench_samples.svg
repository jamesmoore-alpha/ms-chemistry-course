<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 168" width="100%" role="img" aria-label="Three samples on a bench: a strip of copper, shiny, bends, lights the bulb; a lump of sulfur, dull yellow, crumbles, bulb stays dark; a chip of silicon, shiny, shatters, bulb glows faintly" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="168" fill="#ffffff"/><text x="90" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a strip of copper</text><rect x="30" y="60" width="120" height="16" rx="3" fill="#d9d9d9" stroke="#222"/><text x="90" y="108" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">shiny</text><text x="90" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">bends</text><text x="90" y="142" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">lights the bulb</text><text x="275" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a lump of sulfur</text><path d="M 215 80 l 20 -28 l 30 -6 l 40 12 l 12 22 l -18 14 l -50 4 z" fill="#f1f1f1" stroke="#222"/><text x="275" y="108" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">dull yellow</text><text x="275" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">crumbles</text><text x="275" y="142" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">bulb stays dark</text><text x="460" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a chip of silicon</text><path d="M 400 50 l 70 -8 l 30 36 l -75 6 z" fill="#d9d9d9" stroke="#222"/><text x="460" y="108" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">shiny</text><text x="460" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">shatters</text><text x="460" y="142" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">bulb glows faintly</text></svg>