<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="100%" role="img" aria-label="A table of the two open-container traps: limestone heated in a dish, carbon dioxide gas leaves, the balance reads less; steel wool rusting on the pan, oxygen gas comes in and joins the iron, the balance reads more; in neither is mass destroyed or created" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="110" fill="#ffffff"/><rect x="5" y="10" width="530" height="28" fill="#f1f1f1" stroke="#222"/><text x="95.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">open container</text><text x="247.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what the gas does</text><text x="352.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the reading</text><text x="465.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">mass lost or made?</text><rect x="5" y="38" width="530" height="28" fill="#ffffff" stroke="#222"/><text x="95.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">limestone in an open dish</text><text x="247.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas leaves</text><text x="352.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">less</text><text x="465.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><rect x="5" y="66" width="530" height="28" fill="#ffffff" stroke="#222"/><text x="95.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel wool on an open pan</text><text x="247.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas comes in</text><text x="352.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">more</text><text x="465.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><line x1="185" y1="10" x2="185" y2="94" stroke="#222"/><line x1="310" y1="10" x2="310" y2="94" stroke="#222"/><line x1="395" y1="10" x2="395" y2="94" stroke="#222"/><!--blind: A table. Header: open container | what the gas does | the reading | mass lost or made?. Row: limestone in an open dish | a gas leaves | less | none. Row: steel wool on an open pan | a gas comes in | more | none.--></svg>