<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" role="img" aria-label="The word equation magnesium  +  oxygen  react to make  magnesium oxide in a strip, and under it the same reaction written with formulas: 2Mg + O₂ → 2MgO" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="120" fill="#ffffff"/><text x="260.0" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Another example, in words and in formulas</text><rect x="20" y="30" width="480" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="260.0" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">magnesium  +  oxygen  →  magnesium oxide</text><text x="147.20264" y="98" text-anchor="start" font-size="26" font-weight="normal" fill="#222">2</text><text x="161.65864" y="98" text-anchor="start" font-size="26" font-weight="bold" fill="#222">Mg</text><text x="214.02264" y="98" text-anchor="middle" font-size="26" font-weight="normal" fill="#222">+</text><text x="228.84264000000002" y="98" text-anchor="start" font-size="26" font-weight="bold" fill="#222">O</text><text x="250.11064000000002" y="105.28" text-anchor="start" font-size="16" font-weight="normal" fill="#222">2</text><text x="280.34136" y="98" text-anchor="middle" font-size="26" font-weight="normal" fill="#222">→</text><text x="300.56936" y="98" text-anchor="start" font-size="26" font-weight="normal" fill="#222">2</text><text x="315.02536000000003" y="98" text-anchor="start" font-size="26" font-weight="bold" fill="#222">Mg</text><text x="352.56936" y="98" text-anchor="start" font-size="26" font-weight="bold" fill="#222">O</text></svg>