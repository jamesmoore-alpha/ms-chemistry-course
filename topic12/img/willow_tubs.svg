<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 326" width="100%" role="img" aria-label="Two tubs of soil with the soil line at the same height: at year 0 a small willow, tree 2.3 kg; at year 5 a tall willow, tree 76.7 kg, and under its tub: soil 0.06 kg less than at year 0. Under them: only water was added for five years" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="326" fill="#ffffff"/><text x="130" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">year 0</text><text x="390" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">year 5</text><rect x="126" y="168" width="6" height="32" fill="#555" stroke="#222"/><ellipse cx="130" cy="153" rx="24" ry="20" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 75 200 L 83 240 L 177 240 L 185 200 z" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="78" y="208" width="104" height="30" fill="#f1f1f1"/><line x1="78" y1="208" x2="182" y2="208" stroke="#222" stroke-dasharray="3 2"/><rect x="382" y="126" width="14" height="74" fill="#555" stroke="#222"/><ellipse cx="390" cy="92" rx="55" ry="48" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 335 200 L 343 240 L 437 240 L 445 200 z" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="338" y="208" width="104" height="30" fill="#f1f1f1"/><line x1="338" y1="208" x2="442" y2="208" stroke="#222" stroke-dasharray="3 2"/><text x="130" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tree: 2.3 kg</text><text x="390" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tree: 76.7 kg</text><text x="390" y="284" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">soil: 0.06 kg less than at year 0</text><text x="260" y="312" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Only water was added for five years. The soil line is the same height in both tubs.</text></svg>