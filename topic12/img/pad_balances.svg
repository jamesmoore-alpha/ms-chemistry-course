<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 240" width="100%" role="img" aria-label="Two balances: a shiny pad of steel wool reads 10.0 g on day 1; the same pad, brown and crumbly a week later, reads 11.2 g. Above them: nobody added anything, the balance reads 1.2 g more" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="240" fill="#ffffff"/><rect x="40" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="80" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">10.0 g</text><ellipse cx="115" cy="132" rx="34" ry="18" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><path d="M 93 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#222" stroke-width="1.2"/><path d="M 109 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#222" stroke-width="1.2"/><path d="M 125 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#222" stroke-width="1.2"/><text x="115" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the pad, day 1</text><rect x="320" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="320" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="360" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="395" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">11.2 g</text><ellipse cx="395" cy="132" rx="36" ry="18" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><path d="M 373 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#555" stroke-width="1.2"/><path d="M 389 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#555" stroke-width="1.2"/><path d="M 405 132 q 6 -10 12 0 q -6 8 -12 0" fill="none" stroke="#555" stroke-width="1.2"/><circle cx="371" cy="136" r="1.6" fill="#222"/><circle cx="385" cy="124" r="1.6" fill="#222"/><circle cx="401" cy="120" r="1.6" fill="#222"/><circle cx="415" cy="128" r="1.6" fill="#222"/><circle cx="421" cy="140" r="1.6" fill="#222"/><circle cx="393" cy="142" r="1.6" fill="#222"/><circle cx="407" cy="138" r="1.6" fill="#222"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the same pad, a week later</text><text x="255" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Nobody added anything. The balance reads 1.2 g more.</text></svg>