ext><rect x="363" y="86" width="64" height="64" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="364" y="118" width="62" height="31" fill="#d9d9d9"/><line x1="364" y1="118" x2="426" y2="118" stroke="#222"/><circle cx="389" cy="128" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="394" cy="144" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="372" cy="126" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="421" cy="141" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="375" cy="135" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="406" cy="125" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="401" cy="130" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="371" cy="126" r="2.2" fill="#ffffff" stroke="#222"/><circle cx="396" cy="137" r="2.2" fill="#ffffff" stroke="#222"/><rect x="359" y="78" width="72" height="9" rx="2" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after: fizzed, still sealed</text><text x="255" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The mixture fizzed and the jar filled with gas. The reading did not change.</text></svg>