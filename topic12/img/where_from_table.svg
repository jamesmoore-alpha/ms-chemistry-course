<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 138" width="100%" role="img" aria-label="A table: the carbon atoms in the glucose came from the air, from carbon dioxide; the hydrogen atoms from the watering can, from water; the oxygen atoms: cannot tell by counting, because both reactants bring oxygen" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="138" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="88.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms in the glucose</text><text x="251.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">came from</text><text x="433.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">which reactant</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="88.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">6 carbon atoms</text><text x="251.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the air</text><text x="433.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon dioxide</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="88.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">12 hydrogen atoms</text><text x="251.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the watering can</text><text x="433.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="88.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">6 oxygen atoms</text><text x="251.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cannot tell by counting</text><text x="433.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">both reactants bring oxygen</text><line x1="166" y1="10" x2="166" y2="122" stroke="#222"/><line x1="336" y1="10" x2="336" y2="122" stroke="#222"/><!--blind: A table. Header: atoms in the glucose | came from | which reactant. Row: 6 carbon atoms | the air | carbon dioxide. Row: 12 hydrogen atoms | the watering can | water. Row: 6 oxygen atoms | cannot tell by counting | both reactants bring oxygen.--></svg>