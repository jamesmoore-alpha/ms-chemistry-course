<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 253" width="100%" role="img" aria-label="Q: In a sealed flask, 4.0 g of hydrogen burns in 32.0 g of oxygen, and water forms. What is the mass of the water? Worked line by line: Values, mass of hydrogen = 4.0 g; mass of oxygen = 32.0 g; Equation, total mass of the products = total mass of the reactants; In this reaction, mass of water = mass of hydrogen + mass of oxygen; Substitute, mass of water = 4.0 g + 32.0 g; Calculate, 4.0 + 32.0 = 36.0; Answer, mass of water = 36.0 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="253" fill="#ffffff"/><text x="20" y="24" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Q: In a sealed flask, 4.0 g of hydrogen burns in 32.0 g of</text><text x="20" y="44" text-anchor="start" font-size="14" font-weight="bold" fill="#222">oxygen, and water forms. What is the mass of the water?</text><text x="20" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Values</text><text x="170" y="72" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of hydrogen = 4.0 g; mass of oxygen = 32.0 g</text><text x="20" y="99" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Equation</text><text x="170" y="99" text-anchor="start" font-size="13" font-weight="normal" fill="#222">total mass of the products = total mass of the</text><text x="170" y="118" text-anchor="start" font-size="13" font-weight="normal" fill="#222">reactants</text><text x="20" y="145" text-anchor="start" font-size="13" font-weight="bold" fill="#222">In this reaction</text><text x="170" y="145" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of water = mass of hydrogen + mass of oxygen</text><text x="20" y="172" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Substitute</text><text x="170" y="172" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of water = 4.0 g + 32.0 g</text><text x="20" y="199" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Calculate</text><text x="170" y="199" text-anchor="start" font-size="13" font-weight="normal" fill="#222">4.0 + 32.0 = 36.0</text><text x="20" y="226" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Answer</text><text x="170" y="226" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of water = 36.0 g</text></svg>