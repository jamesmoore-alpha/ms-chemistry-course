<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 134" width="100%" role="img" aria-label="A counting table, one row per element: its atoms on the left of the equation, its atoms on the right, and whether the two counts match; the title names the equation" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="520" height="134" fill="#ffffff"/><rect x="20" y="30" width="480" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="200.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms on the left</text><text x="340.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">atoms on the right</text><text x="455.0" y="49" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">match?</text><rect x="20" y="58" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="200.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><text x="340.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><text x="455.0" y="77" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="86" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="200.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="340.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="455.0" y="105" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><line x1="130" y1="30" x2="130" y2="114" stroke="#222"/><line x1="270" y1="30" x2="270" y2="114" stroke="#222"/><line x1="410" y1="30" x2="410" y2="114" stroke="#222"/><!--blind: A table. Header: element | atoms on the left | atoms on the right | match?. Row: hydrogen | 4 | 4 | yes. Row: oxygen | 2 | 2 | yes.--><text x="260" y="18" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">2H₂ + O₂ → 2H₂O</text></svg>