<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 166" width="100%" role="img" aria-label="A table of four reactions with the reactants, the substances that go in, in one column and the products, the substances that come out, in the other" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="530" height="166" fill="#ffffff"/><rect x="10" y="10" width="510" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">reaction</text><text x="235.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">reactants (go in)</text><text x="420.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">products (come out)</text><rect x="10" y="38" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">iron rusting</text><text x="235.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">iron, oxygen</text><text x="420.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">iron oxide</text><rect x="10" y="66" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen burning</text><text x="235.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hydrogen, oxygen</text><text x="420.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water</text><rect x="10" y="94" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">charcoal burning</text><text x="235.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon, oxygen</text><text x="420.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon dioxide</text><rect x="10" y="122" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">methane burning</text><text x="235.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">methane, oxygen</text><text x="420.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">carbon dioxide, water</text><line x1="150" y1="10" x2="150" y2="150" stroke="#222"/><line x1="320" y1="10" x2="320" y2="150" stroke="#222"/><!--blind: A table. Header: reaction | reactants (go in) | products (come out). Row: iron rusting | iron, oxygen | iron oxide. Row: hydrogen burning | hydrogen, oxygen | water. Row: charcoal burning | carbon, oxygen | carbon dioxide. Row: methane burning | methane, oxygen | carbon dioxide, water.--></svg>