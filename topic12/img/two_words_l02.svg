<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" role="img" aria-label="Three word equations in strips: hydrogen plus oxygen react to make water; carbon plus oxygen react to make carbon dioxide; methane plus oxygen react to make carbon dioxide and water" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="150" fill="#ffffff"/><rect x="20" y="10" width="460" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="250.0" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">hydrogen  +  oxygen  →  water</text><rect x="20" y="56" width="460" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="250.0" y="79" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">carbon  +  oxygen  →  carbon dioxide</text><rect x="20" y="102" width="460" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="250.0" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">methane  +  oxygen  →  carbon dioxide  +  water</text></svg>