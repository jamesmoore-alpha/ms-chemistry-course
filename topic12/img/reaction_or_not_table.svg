<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" width="100%" role="img" aria-label="A table of the five changes: what the atoms are doing after, and whether each is a chemical reaction" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="194" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the change</text><text x="265.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the atoms after</text><text x="460.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a chemical reaction?</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen burns</text><text x="265.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">new partners: water</text><text x="460.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ice melts</text><text x="265.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the same water particles</text><text x="460.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">charcoal burns</text><text x="265.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">new partners: carbon dioxide</text><text x="460.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar dissolves</text><text x="265.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the same sugar particles</text><text x="460.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">methane burns</text><text x="265.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">new partners: carbon dioxide and water</text><text x="460.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><line x1="140" y1="10" x2="140" y2="178" stroke="#222"/><line x1="390" y1="10" x2="390" y2="178" stroke="#222"/><!--blind: A table. Header: the change | the atoms after | a chemical reaction?. Row: hydrogen burns | new partners: water | yes. Row: ice melts | the same water particles | no. Row: charcoal burns | new partners: carbon dioxide | yes. Row: sugar dissolves | the same sugar particles | no. Row: methane burns | new partners: carbon dioxide and water | yes.--></svg>