<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 78" width="100%" role="img" aria-label="The word equation carbon dioxide  +  water  react to make  glucose  +  oxygen, in one strip, with the note: light is needed for this reaction to run" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="78" fill="#ffffff"/><rect x="20" y="10" width="460" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="250.0" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">carbon dioxide  +  water  →  glucose  +  oxygen</text><text x="250.0" y="60" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">light is needed for this reaction to run</text></svg>