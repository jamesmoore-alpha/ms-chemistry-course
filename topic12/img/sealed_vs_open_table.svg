"122" width="510" height="28" fill="#ffffff" stroke="#222"/><text x="95.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">mass destroyed?</text><text x="255.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><text x="425.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><line x1="180" y1="10" x2="180" y2="150" stroke="#222"/><line x1="330" y1="10" x2="330" y2="150" stroke="#222"/><!--blind: A table. Header: (blank) | sealed jar | open dish. Row: mass before | 10.0 g | 10.0 g. Row: where the gas goes | stays in the jar | floats away into the air. Row: mass on the balance after | 10.0 g | 5.6 g. Row: mass destroyed? | none | none.--></svg>