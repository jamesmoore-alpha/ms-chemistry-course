<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 357" width="100%" role="img" aria-label="Q: 10.0 g of calcium carbonate makes 5.6 g of calcium oxide and some carbon dioxide. What is the mass of the carbon dioxide? Worked line by line: Values, mass of calcium carbonate = 10.0 g; mass of calcium oxide = 5.6 g; Equation, total mass of the products = total mass of the reactants; In this reaction, mass of calcium oxide + mass of carbon dioxide = mass of calcium carbonate; Make it the subject, mass of carbon dioxide = mass of calcium carbonate − mass of calcium oxide; Substitute, mass of carbon dioxide = 10.0 g − 5.6 g; Calculate, 10.0 − 5.6 = 4.4; Answer, mass of carbon dioxide = 4.4 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="357" fill="#ffffff"/><text x="20" y="24" text-anchor="start" font-size="14" font-weight="bold" fill="#222">Q: 10.0 g of calcium carbonate makes 5.6 g of calcium oxide</text><text x="20" y="44" text-anchor="start" font-size="14" font-weight="bold" fill="#222">and some carbon dioxide. What is the mass of the carbon</text><text x="20" y="64" text-anchor="start" font-size="14" font-weight="bold" fill="#222">dioxide?</text><text x="20" y="92" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Values</text><text x="170" y="92" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of calcium carbonate = 10.0 g; mass of calcium</text><text x="170" y="111" text-anchor="start" font-size="13" font-weight="normal" fill="#222">oxide = 5.6 g</text><text x="20" y="138" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Equation</text><text x="170" y="138" text-anchor="start" font-size="13" font-weight="normal" fill="#222">total mass of the products = total mass of the</text><text x="170" y="157" text-anchor="start" font-size="13" font-weight="normal" fill="#222">reactants</text><text x="20" y="184" text-anchor="start" font-size="13" font-weight="bold" fill="#222">In this reaction</text><text x="170" y="184" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of calcium oxide + mass of carbon dioxide =</text><text x="170" y="203" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of calcium carbonate</text><text x="20" y="230" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Make it the subject</text><text x="170" y="230" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of carbon dioxide = mass of calcium carbonate −</text><text x="170" y="249" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of calcium oxide</text><text x="20" y="276" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Substitute</text><text x="170" y="276" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of carbon dioxide = 10.0 g − 5.6 g</text><text x="20" y="303" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Calculate</text><text x="170" y="303" text-anchor="start" font-size="13" font-weight="normal" fill="#222">10.0 − 5.6 = 4.4</text><text x="20" y="330" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Answer</text><text x="170" y="330" text-anchor="start" font-size="13" font-weight="normal" fill="#222">mass of carbon dioxide = 4.4 g</text></svg>