<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" width="100%" role="img" aria-label="The equation 2Mg + O₂ → 2MgO written with formulas, every symbol underlined; under it each symbol once with its element's name: Mg is magnesium, O is oxygen; and the count of elements, 2" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="194" fill="#ffffff"/><text x="157.20264" y="60" text-anchor="start" font-size="26" font-weight="normal" fill="#222">2</text><text x="171.65864" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#222">Mg</text><text x="224.02264" y="60" text-anchor="middle" font-size="26" font-weight="normal" fill="#222">+</text><text x="238.84264000000002" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#222">O</text><text x="260.11064000000005" y="67.28" text-anchor="start" font-size="16" font-weight="normal" fill="#222">2</text><text x="290.34136" y="60" text-anchor="middle" font-size="26" font-weight="normal" fill="#222">→</text><text x="310.56936" y="60" text-anchor="start" font-size="26" font-weight="normal" fill="#222">2</text><text x="325.02536000000003" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#222">Mg</text><text x="362.56936" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#222">O</text><line x1="172.7" y1="68" x2="208.2" y2="68" stroke="#222" stroke-width="2.6"/><line x1="239.8" y1="68" x2="258.1" y2="68" stroke="#222" stroke-width="2.6"/><line x1="326.0" y1="68" x2="361.6" y2="68" stroke="#222" stroke-width="2.6"/><line x1="363.6" y1="68" x2="381.8" y2="68" stroke="#222" stroke-width="2.6"/><text x="270.0" y="100" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">each underlined symbol names one element; write each element once:</text><text x="270.0" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Mg  =  magnesium</text><text x="270.0" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">O  =  oxygen</text><text x="270.0" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2 elements take part</text></svg>