28" text-anchor="start" font-size="16" font-weight="normal" fill="#222">2</text><text x="404.06744" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#222">O</text><line x1="116.7" y1="68" x2="133.5" y2="68" stroke="#222" stroke-width="2.6"/><line x1="135.5" y1="68" x2="152.2" y2="68" stroke="#222" stroke-width="2.6"/><line x1="209.4" y1="68" x2="227.6" y2="68" stroke="#222" stroke-width="2.6"/><line x1="281.1" y1="68" x2="297.9" y2="68" stroke="#222" stroke-width="2.6"/><line x1="299.9" y1="68" x2="318.1" y2="68" stroke="#222" stroke-width="2.6"/><line x1="375.3" y1="68" x2="392.0" y2="68" stroke="#222" stroke-width="2.6"/><line x1="405.1" y1="68" x2="423.3" y2="68" stroke="#222" stroke-width="2.6"/><text x="270.0" y="100" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">each underlined symbol names one element; write each element once:</text><text x="270.0" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">C  =  carbon</text><text x="270.0" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">H  =  hydrogen</text><text x="270.0" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">O  =  oxygen</text><text x="270.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">3 elements take part</text></svg>