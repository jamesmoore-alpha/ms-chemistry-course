<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 78" width="100%" role="img" aria-label="The word equation copper  +  oxygen  react to make  copper oxide, in one strip, with the note: the oxygen atoms came from the air" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="420" height="78" fill="#ffffff"/><rect x="20" y="10" width="380" height="34" rx="6" fill="#f1f1f1" stroke="#222"/><text x="210.0" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">copper  +  oxygen  →  copper oxide</text><text x="210.0" y="60" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the oxygen atoms came from the air</text></svg>