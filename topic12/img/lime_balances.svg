<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 240" width="100%" role="img" aria-label="Two balances, each zeroed with the empty lidded jar: before, a heap of limestone in the jar reads 10.0 g; after heating, a smaller white heap with the jar full of gas, still lidded, reads 10.0 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="240" fill="#ffffff"/><rect x="40" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="80" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">10.0 g</text><rect x="83" y="86" width="64" height="64" fill="#ffffff" stroke="#222" stroke-width="1.5"/><path d="M 93 149 q 22 -32 44 0 z" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><circle cx="101" cy="143" r="1.3" fill="#222"/><circle cx="111" cy="137" r="1.3" fill="#222"/><circle cx="123" cy="141" r="1.3" fill="#222"/><circle cx="131" cy="145" r="1.3" fill="#222"/><circle cx="117" cy="145" r="1.3" fill="#222"/><rect x="79" y="78" width="72" height="9" rx="2" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="115" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">before: limestone, sealed</text><rect x="320" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="320" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="360" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="395" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">10.0 g</text><rect x="363" y="86" width="64" height="64" fill="#ffffff" stroke="#222" stroke-width="1.5"/><path d="M 377 149 q 18 -24 36 0 z" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="364" y="150" width="62" height="-1" fill="#d9d9d9"/><line x1="364" y1="150" x2="426" y2="150" stroke="#222"/><rect x="359" y="78" width="72" height="9" rx="2" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after: heated, still sealed</text><text x="255" y="24" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Zeroed with the empty jar on it: the balance reads what is inside.</text><text x="255" y="42" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">White solid 5.6 g, carbon dioxide gas the rest.</text></svg>