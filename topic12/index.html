: "Calcium burns in oxygen: 2Ca + O₂ → 2CaO. Isadora counts calcium 2 and 2, oxygen 2 and 2, and says: \"The counts match, so the mass of calcium oxide made equals the mass of calcium plus the mass of oxygen used.\" Which statement is correct?", "options": ["Isadora is correct: the same atoms are on both sides, and each atom keeps its mass.", "Isadora is not correct: three particles became two particles, so the mass of the product must be lower.", "Isadora is not correct: matching counts say nothing about mass.", "Isadora is not correct: oxygen is a gas, so its mass does not count."], "key": 0, "why": "Matching counts mean every atom on the left is on the right.<br>Each atom keeps its own mass.<br>So the mass of the product equals the mass of the two reactants together; the number of particles does not matter, and a gas has mass.<br>Isadora is correct."}, {"d": "hard", "atom": "MAT-070", "stem": "Sodium burns in oxygen: 4Na + O₂ → 2Na₂O. Jasper says: \"The oxygen count does not match: 2 atoms on the left but only 1 on the right, so the equation was written wrong.\" Which statement is correct?", "options": ["Jasper is correct: Na₂O holds one oxygen atom, and the 2 in front of it belongs to the sodium only, so it does not change the oxygen count.", "Jasper is correct: the 2 in front counts particles, and particles are not atoms, so it never changes an atom count.", "Jasper is not correct: the 2 in front of Na₂O multiplies every count in the formula, so oxygen is 2 × 1 = 2 on the right.", "Jasper is not correct: a coefficient adds 2 to each count, so oxygen is 1 + 2 = 3 on the right."], "key": 2, "why": "A coefficient counts whole particles and multiplies every count in the formula.<br>2Na₂O is two particles, each with 1 oxygen atom: 2 × 1 = 2 oxygen atoms.<br>Sodium: 4 on the left, 2 × 2 = 4 on the right.<br>Every count matches, so Jasper is not correct."}, {"d": "hard", "atom": "MAT-071", "fig": "pt_si_c", "stem": "Part of the periodic table is supplied. The hard, dark grit of a knife-sharpening stone has the formula SiC. Roisin says: \"SiC names three elements: sulfur, iodine and carbon.\" Which statement is correct?", "options": ["Roisin is correct: S, I and C are three symbols, so three elements take part, and the small i is just the way I is printed.", "Roisin is correct: every letter in a formula is one element.", "Roisin is not correct: SiC names one element, because it is one substance.", "Roisin is not correct: Si is one symbol, a capital S with a small i, so SiC names two elements: silicon and carbon."], "key": 3, "why": "A symbol is a capital letter with any small letter after it.<br>Si is one symbol: on the periodic table, Si is silicon.<br>C is carbon.<br>So SiC names two elements, silicon and carbon, and Roisin is not correct."}, {"d": "hard", "atom": "MAT-072", "stem": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Marguerite says: \"Every oxygen atom in the glucose came from the water, because water is a reactant with oxygen in it.\" Which statement is correct?", "options": ["Marguerite is correct: water is the only reactant that brings oxygen atoms.", "Marguerite is correct: the oxygen in the carbon dioxide all leaves again as the oxygen gas, so none of it can be in the glucose.", "Marguerite is not correct: glucose holds no oxygen atoms at all.", "Marguerite has not shown it: carbon dioxide brings oxygen atoms too, so counting alone cannot say."], "key": 3, "why": "Trace each element to the reactants that bring it.<br>Only carbon dioxide brings carbon, and only water brings hydrogen.<br>Both carbon dioxide and water bring oxygen atoms.<br>So counting alone cannot say which oxygen atoms went into the glucose; Marguerite's claim cannot be settled this way."}, {"d": "hard", "atom": "MAT-072", "stem": "In daylight a leafy plant gives off oxygen gas, and over a summer the plant gains mass. Bettina says: \"The plant gains mass even though it gives off a gas, because it keeps the glucose it builds and lets go only the oxygen.\" Which statement is correct?", "options": ["Bettina is correct: the glucose's atoms stay in the plant and each has mass, so the plant gains what it keeps.", "Bettina is correct, but only because oxygen gas has no mass, so giving it off takes nothing away.", "Bettina is not correct: a plant that gives off a gas must lose mass, as an open dish does.", "Bettina is not correct: the mass a plant gains comes from the soil, so what it builds or gives off has nothing to do with it."], "key": 0, "why": "Plants build glucose from carbon dioxide and water, and let the oxygen go.<br>The glucose's atoms stay in the plant as its leaves and wood; each atom has mass.<br>The oxygen that leaves has mass too, but the plant took in more atoms than it let go: 36 in, 12 out.<br>So the plant gains mass, and Bettina is correct."}], "figs": {"pad_balances": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 510 240\" style=\"width:100%;max-width:637px;height:auto\" role=\"img\" aria-label=\"Two balances: a shiny pad of steel wool reads 10.0 g on day 1; the same pad, brown and crumbly a week later, reads 11.2 g. Above them: nobody added anything, the balance reads 1.2 g more\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"510\" height=\"240\" fill=\"#ffffff\"/><rect x=\"40\" y=\"150\" width=\"150\" height=\"10\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"40\" y=\"160\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#f1f1f1\" stroke=\"#222\"/><rect x=\"80\" y=\"170\" width=\"70\" height=\"20\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"115\" y=\"185\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">10.0 g<\/text><ellipse cx=\"115\" cy=\"132\" rx=\"34\" ry=\"18\" fill=\"#d9d9d9\" stroke=\"#222\" stroke-width=\"1.5\"/><path d=\"M 93 132 q 6 -10 12 0 q -6 8 -12 0\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.2\"/><path d=\"M 109 132 q 6 -10 12 0 q -6 8 -12 0\" fill=\"none\" stroke=\"#222\" stroke-width=\"1.2\"/><path d=\"M 125 e = mass of calcium carbonate; Make it the subject, mass of carbon dioxide = mass of calcium carbonate − mass of calcium oxide; Substitute, mass of carbon dioxide = 10.0 g − 5.6 g; Calculate, 10.0 − 5.6 = 4.4; Answer, mass of carbon dioxide = 4.4 g\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"540\" height=\"357\" fill=\"#ffffff\"/><text x=\"20\" y=\"24\" text-anchor=\"start\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">Q: 10.0 g of calcium carbonate makes 5.6 g of calcium oxide<\/text><text x=\"20\" y=\"44\" text-anchor=\"start\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">and some carbon dioxide. What is the mass of the carbon<\/text><text x=\"20\" y=\"64\" text-anchor=\"start\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">dioxide?<\/text><text x=\"20\" y=\"92\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Values<\/text><text x=\"170\" y=\"92\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of calcium carbonate = 10.0 g; mass of calcium<\/text><text x=\"170\" y=\"111\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">oxide = 5.6 g<\/text><text x=\"20\" y=\"138\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Equation<\/text><text x=\"170\" y=\"138\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">total mass of the products = total mass of the<\/text><text x=\"170\" y=\"157\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">reactants<\/text><text x=\"20\" y=\"184\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">In this reaction<\/text><text x=\"170\" y=\"184\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of calcium oxide + mass of carbon dioxide =<\/text><text x=\"170\" y=\"203\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of calcium carbonate<\/text><text x=\"20\" y=\"230\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Make it the subject<\/text><text x=\"170\" y=\"230\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of carbon dioxide = mass of calcium carbonate −<\/text><text x=\"170\" y=\"249\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of calcium oxide<\/text><text x=\"20\" y=\"276\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Substitute<\/text><text x=\"170\" y=\"276\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of carbon dioxide = 10.0 g − 5.6 g<\/text><text x=\"20\" y=\"303\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Calculate<\/text><text x=\"170\" y=\"303\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">10.0 − 5.6 = 4.4<\/text><text x=\"20\" y=\"330\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Answer<\/text><text x=\"170\" y=\"330\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of carbon dioxide = 4.4 g<\/text><\/svg>", "hydrogen_worked": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 253\" style=\"width:100%;max-width:675px;height:auto\" role=\"img\" aria-label=\"Q: In a sealed flask, 4.0 g of hydrogen burns in 32.0 g of oxygen, and water forms. What is the mass of the water? Worked line by line: Values, mass of hydrogen = 4.0 g; mass of oxygen = 32.0 g; Equation, total mass of the products = total mass of the reactants; In this reaction, mass of water = mass of hydrogen + mass of oxygen; Substitute, mass of water = 4.0 g + 32.0 g; Calculate, 4.0 + 32.0 = 36.0; Answer, mass of water = 36.0 g\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"540\" height=\"253\" fill=\"#ffffff\"/><text x=\"20\" y=\"24\" text-anchor=\"start\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">Q: In a sealed flask, 4.0 g of hydrogen burns in 32.0 g of<\/text><text x=\"20\" y=\"44\" text-anchor=\"start\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">oxygen, and water forms. What is the mass of the water?<\/text><text x=\"20\" y=\"72\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Values<\/text><text x=\"170\" y=\"72\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of hydrogen = 4.0 g; mass of oxygen = 32.0 g<\/text><text x=\"20\" y=\"99\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Equation<\/text><text x=\"170\" y=\"99\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">total mass of the products = total mass of the<\/text><text x=\"170\" y=\"118\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">reactants<\/text><text x=\"20\" y=\"145\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">In this reaction<\/text><text x=\"170\" y=\"145\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of water = mass of hydrogen + mass of oxygen<\/text><text x=\"20\" y=\"172\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Substitute<\/text><text x=\"170\" y=\"172\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of water = 4.0 g + 32.0 g<\/text><text x=\"20\" y=\"199\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Calculate<\/text><text x=\"170\" y=\"199\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">4.0 + 32.0 = 36.0<\/text><text x=\"20\" y=\"226\" text-anchor=\"start\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">Answer<\/text><text x=\"170\" y=\"226\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">mass of water = 36.0 g<\/text><\/svg>", "dish_balances_q": "<svg xmlns=\"http://www. text><text x=\"18\" y=\"104.84615384615384\" text-anchor=\"end\" font-size=\"10\" font-weight=\"normal\" fill=\"#222\">2<\/text><text x=\"18\" y=\"186.84615384615384\" text-anchor=\"end\" font-size=\"10\" font-weight=\"normal\" fill=\"#222\">3<\/text><text x=\"18\" y=\"268.84615384615387\" text-anchor=\"end\" font-size=\"10\" font-weight=\"normal\" fill=\"#222\">4<\/text><text x=\"18\" y=\"350.84615384615387\" text-anchor=\"end\" font-size=\"10\" font-weight=\"normal\" fill=\"#222\">5<\/text><text x=\"185.0\" y=\"15\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">part of the periodic table:<\/text><text x=\"185.0\" y=\"31\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">groups 14–17, periods 2–5<\/text><\/g><text x=\"185.0\" y=\"414\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">SiC<\/text><\/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
