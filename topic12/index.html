e.", "screen": "[rule slide reuses the two balances; rule text]"}, {"say": "Back to the limestone: gas kept in the jar, gone from the dish.", "screen": "[the two after readouts side by side]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In a chemical reaction, how does the total mass of the products compare with the total mass of the reactants?", "options": ["it is less", "it is the same", "it is more"], "key": 1, "fb": ["No atom vanishes, so the total cannot fall.", "The total mass of the products equals the total mass of the reactants: the law of conservation of mass.", "No atom is made from nothing, so the total cannot rise."], "why": "Every atom that was there before is still there after.<br>Each atom keeps its own mass.<br>So the total mass of the products equals the total mass of the reactants."}, {"type": "mcq", "tag": "recall", "stem": "A balance shows 5.6 for a heap of white powder. Which unit belongs after the number?", "options": ["g", "mL", "cm³"], "key": 0, "fb": ["A balance measures mass, and mass is measured in grams, g.", "mL is a unit of volume, not mass.", "cm³ is a unit of volume, not mass."], "why": "A balance measures mass.<br>Mass is measured in grams, written g.<br>So the reading is 5.6 g."}, {"type": "mcq", "tag": "scaffold", "stem": "12.0 g of magnesium burns in oxygen and makes 19.9 g of magnesium oxide, which holds every atom that reacted. Write the law in this reaction's substances. Which line is right?", "options": ["mass of magnesium + mass of oxygen = mass of magnesium oxide", "mass of magnesium = mass of oxygen + mass of magnesium oxide", "mass of magnesium × mass of oxygen = mass of magnesium oxide"], "key": 0, "fb": ["Two reactants go in, one product comes out: the two reactant masses add up to the product's mass.", "Oxygen is a reactant, not a product; it belongs on the reactants' side with the magnesium.", "Masses add; they are never multiplied."], "why": "The reactants are magnesium and oxygen; the product is magnesium oxide.<br>The total mass of the products equals the total mass of the reactants.<br>So mass of magnesium + mass of oxygen = mass of magnesium oxide."}, {"type": "mcq", "tag": "scaffold", "stem": "Make the mass of oxygen the subject of your line for magnesium burning. Which line is right?", "options": ["mass of oxygen = mass of magnesium − mass of magnesium oxide", "mass of oxygen = mass of magnesium oxide + mass of magnesium", "mass of oxygen = mass of magnesium oxide − mass of magnesium"], "key": 2, "fb": ["This takes the larger mass away from the smaller; the oxygen is the product's mass minus the magnesium's.", "Adding gives more than the product's whole mass; the oxygen is what is left when the magnesium is taken away.", "Take the mass of magnesium away from both sides: the oxygen's mass is the product's mass minus the magnesium's."], "why": "Start from mass of magnesium + mass of oxygen = mass of magnesium oxide.<br>Take the mass of magnesium away from both sides.<br>So mass of oxygen = mass of magnesium oxide − mass of magnesium."}, {"type": "mcq", "tag": "scaffold", "stem": "Substitute the values for magnesium burning. Which line is right?", "options": ["mass of oxygen = 12.0 g − 19.9 g", "mass of oxygen = 19.9 g − 12.0 g", "mass of oxygen = 19.9 g + 12.0 g"], "key": 1, "fb": ["The magnesium oxide, 19.9 g, comes first; the magnesium, 12.0 g, is taken away from it.", "Mass of magnesium oxide, 19.9 g, minus mass of magnesium, 12.0 g.", "The masses are subtracted here, not added."], "why": "The line is mass of oxygen = mass of magnesium oxide − mass of magnesium.<br>The magnesium oxide is 19.9 g and the magnesium is 12.0 g.<br>So mass of oxygen = 19.9 g − 12.0 g."}, {"type": "text", "tag": "scaffold", "stem": "Calculate. What mass of oxygen joined the magnesium, in g?", "accept": ["7.9 g", "7.9", "7.9 grams", "7.9g"], "why": "mass of oxygen = 19.9 g − 12.0 g.<br>19.9 − 12.0 = 7.9.<br>So 7.9 g of oxygen joined the magnesium."}, {"type": "text", "tag": "bare", "stem": "In a sealed container, 14.0 g of iron reacts with 8.0 g of sulfur, and every atom ends up in one product, iron sulfide. What is the mass of the iron sulfide, in g?", "accept": ["22.0 g", "22.0", "22.0 grams", "22.0g", "22 g", "22", "22 grams"], "why": "mass of iron sulfide = mass of iron + mass of sulfur.<br>mass of iron sulfide = 14.0 g + 8.0 g.<br>14.0 + 8.0 = 22.0, so the iron sulfide has a mass of 22.0 g."}, {"type": "text", "tag": "bare", "stem": "25.2 g of baking soda is heated in a lidded jar. It makes 15.9 g of a white powder, 2.7 g of water and some carbon dioxide. What is the mass of the carbon dioxide, in g?", "accept": ["6.6 g", "6.6", "6.6 grams", "6.6g"], "why": "mass of powder + mass of water + mass of carbon dioxide = mass of baking soda.<br>mass of carbon dioxide = 25.2 g − 15.9 g − 2.7 g.<br>25.2 − 15.9 − 2.7 = 6.6, so the carbon dioxide has a mass of 6.6 g."}, {"type": "mcq", "tag": "recall", "stem": "A gas rises out of an open cup and drifts across the room. Does the gas that left have mass?", "options": ["yes", "no"], "key": 0, "fb": ["A gas is matter, so it has mass wherever it goes.", "Leaving the cup does not take the mass away from the gas: a gas is matter, with mass, in the cup or in the room."], "why": "A gas is matter.<br>Matter has mass.<br>So the gas that left the cup has mass, and it took that mass with it."}, {"type": "mcq", "tag": "what", "stem": "Suppose a fizzing tablet is dropped into water in an open cup on a balance. The tablet fizzes until it is gone. Compared with the first reading, what does the balance read at the end?", "options": ["more", "the same", "less"], "key": 2, "fb": ["Nothing came in from the air here; a gas left, so the reading cannot rise.", "The cup is open, so the gas from the fizz floated away and took its mass with it.", "The fizz made a gas, the cup has no lid, and the gas floated away with its mass."], "why": "The fizz makes a gas, and a gas has mass.<br>The cup is open, so the gas floats away into the room.<br>The balance reads only what is left, so it reads less."}, {"type": "frq", "tag": "why", "fig": "l6_dish", "task": "The balance was zeroed with the empty open dish, and a heap of white powder reads 12.0 g. The powder is heated, a gas comes off, and the powder left reads 9.8 g. Explain what happened to the missing 2.2 g.", "starter": "No mass was destroyed…", "model": "No mass was destroyed.<br>The powder gave off a gas, and a gas is matter with mass.<br>The dish is open, so the gas floated away into the air.<br>The balance reads only what is left in the dish.<br>So the missing 2.2 g is the mass of the gas that left.", "points": ["no mass was destroyed", "the gas is matter with mass, and the open dish let it float away", "the balance reads only what is left, so the missing 2.2 g is the gas that left"]}, {"type": "mcq", "tag": "misconception", "stem": "Jorge says: \"When limestone is heated in an open dish, the 4.4 g that the balance loses is destroyed.\" Is Jorge correct?", "options": ["yes", "no"], "key": 1, "fb": ["Nothing was destroyed: the 4.4 g is carbon dioxide gas that floated out of the open dish; in a lidded jar the balance would still read 10.0 g.", "The 4.4 g floated out of the open dish as carbon dioxide gas, with its mass; in a lidded jar the balance would still read 10.0 g."], "why": "The 4.4 g is the carbon dioxide made in the reaction.<br>The dish is open, so the gas floated away into the air with its mass.<br>In a lidded jar the balance would still read 10.0 g, so nothing was destroyed and Jorge is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "A candle burns on a balance for an hour, and the reading falls. Where did the wax's atoms go?", "options": ["the flame destroyed them, so they are gone", "they turned into the heat and light of the flame", "they left as carbon dioxide gas and water vapor"], "key": 2, "fb": ["No atom is destroyed; the atoms left in the gases the flame gave off.", "Heat and light are not atoms; the atoms left in the gases the flame gave off.", "Wax and oxygen react to make carbon dioxide and water vapor, and the open air lets those gases float away."], "why": "Candle wax + oxygen → carbon dioxide + water.<br>Both products are gases here, and the candle is in the open.<br>So the wax's atoms floated away in the carbon dioxide and the water vapor."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video heated limestone in an open dish. What did the balance reading do as the gas left?", "options": ["it fell", "it stayed at 10.0 g", "it rose"], "key": 0, "fb": ["The carbon dioxide gas floated out of the open dish with its mass, so the reading fell to 5.6 g.", "The reading stayed at 10.0 g only in the lidded jar; the open dish let the gas leave.", "A gas left; none came in, so the reading did not rise."], "why": "The reaction made carbon dioxide gas, which has mass.<br>The dish was open, so the gas floated away.<br>So the reading fell from 10.0 g to 5.6 g."}]}, {"id": "L07", "atom": "MAT-070", "title": "Count the atoms on both sides", "video": "could do without a video", "lesson_type": "Procedural lesson (a three-step routine): count the atoms of each element on the left, count them on the right, compare kind for kind; a match means the equation obeys the law of conservation of mass; no term coined", "check_design": "Type (b) scaffolded sequence → two recall MCQs (Topic 10: hydrogen atoms in 3H₂O; L05: no atom made or lost), the worked count on the page (hydrogen burning, then methane burning; a wrong equation as the non-example), five scaffold steps on a SECOND case (2CO + O₂ → 2CO₂: carbon left, carbon right, oxygen left, oxygen right, match?), five bare yes / no items on fresh equations, two of them written wrong (keys y n n y y after the scaffold's y: no four alternate), and one student claim (Kavya: 2H₂ + O₂ → H₂O obeys the law because both sides have hydrogen and oxygen; key no). 13 items.", "headache": ["Here is hydrogen burning, written with formulas: 2H₂ + O₂ → 2H₂O.", "The law of conservation of mass says no atom is made and no atom is lost.", "So the atoms on the left should match the atoms on the right, kind for kind.", "Do they?"], "forest": ["How do you check that an equation obeys the law of conservation of mass?", "Count the atoms of each element on the left, then count them on the right.", "On the left there are 4 hydrogen atoms and 2 oxygen atoms, and on the right there are also 4 hydrogen atoms and 2 oxygen atoms.", "The counts match, so the equation obeys the law.", "If the counts did not match, someone wrote the equation wrong."], "article": [{"t": "idea", "text": "Here is hydrogen burning, written with formulas: 2H₂ + O₂ → 2H₂O."}, {"t": "fig", "key": "hydrogen_formula", "cap": "Hydrogen burning twice over: the word equation hydrogen + oxygen → water, and under it the formula form 2H₂ + O₂ → 2H₂O."}, {"t": "idea", "text": "The law of conservation of mass says no atom is made and no atom is lost."}, {"t": "idea", "text": "So the atoms on the left should match the atoms on the right, kind for kind."}, {"t": "idea", "text": "Do they?"}, {"t": "h", "text": "Two facts to hold"}, {"t": "idea", "text": "A full-size number in front of a formula is called a coefficient, and it counts whole particles."}, {"t": "idea", "text": "A coefficient multiplies every count in the formula."}, {"t": "idea", "text": "The total mass of the products equals the total mass of the reactants, because every atom is still there."}, {"t": "h", "text": "Three steps"}, {"t": "idea", "text": "To check an equation, there are three steps to follow."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Count the atoms of each element on the left."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Count the atoms of each element on the right."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Compare the two counts for each element."}, {"t": "h", "text": "Count hydrogen burning"}, {"t": "idea", "text": "On the left, 2H₂ is two particles of 2 hydrogen atoms each: 2 × 2 = 4 hydrogen atoms."}, {"t": "idea", "text": "On the left, O₂ is 2 oxygen atoms."}, {"t": "idea", "text": "On the right, 2H₂O is two water particles: 2 × 2 = 4 hydrogen atoms and 2 × 1 = 2 oxygen atoms."}, {"t": "fig", "key": "hydrogen_strip", "cap": "The atoms of each side drawn as loose circles to count: on the left 4 hydrogen atoms and 2 oxygen atoms; on the right the same 4 and 2."}, {"t": "idea", "text": "Hydrogen: 4 on the left and 4 on the right."}, {"t": "idea", "text": "Oxygen: 2 on the left and 2 on the right."}, {"t": "idea", "text": "The counts match, kind for kind, so the equation obeys the law of conservation of mass."}, {"t": "fig", "key": "hydrogen_table", "cap": "The counting table for 2H₂ + O₂ → 2H₂O: hydrogen 4 and 4, oxygen 2 and 2, both a match."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider methane burning: methane + oxygen → carbon dioxide + water, written CH₄ + 2O₂ → CO₂ + 2H₂O."}, {"t": "idea", "text": "Carbon: 1 on the left, in CH₄; 1 on the right, in CO₂."}, {"t": "idea", "text": "Hydrogen: 4 on the left, in CH₄; 2 × 2 = 4 on the right, in 2H₂O."}, {"t": "idea", "text": "Oxygen: 2 × 2 = 4 on the left, in 2O₂; 2 + 2 = 4 on the right, in CO₂ and 2H₂O."}, {"t": "fig", "key": "methane_strip", "cap": "Methane burning, each side's atoms drawn as loose circles: 1 carbon, 4 hydrogen and 4 oxygen atoms on the left; the same 1, 4 and 4 on the right."}, {"t": "fig", "key": "methane_table", "cap": "The counting table for CH₄ + 2O₂ → CO₂ + 2H₂O: carbon 1 and 1, hydrogen 4 and 4, oxygen 4 and 4, all a match."}, {"t": "idea", "text": "Every count matches, so this equation obeys the law too."}, {"t": "h", "text": "An equation written wrong"}, {"t": "idea", "text": "Suppose someone writes hydrogen burning as 2H₂ + O₂ → H₂O."}, {"t": "idea", "text": "Hydrogen: 4 on the left, but only 2 on the right."}, {"t": "idea", "text": "Oxygen: 2 on the left, but only 1 on the right."}, {"t": "idea", "text": "The counts do not match."}, {"t": "idea", "text": "Atoms would have to vanish."}, {"t": "idea", "text": "So this line breaks the law."}, {"t": "idea", "text": "Nature does not lose atoms, so the person wrote the equation wrong."}, {"t": "fig", "key": "wrong_equation", "cap": "A cross beside 2H₂ + O₂ → H₂O, with its counting table: hydrogen 4 against 2, oxygen 2 against 1, no match. Written wrong."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "An equation obeys the law of conservation of mass when each kind of atom counts the same on both sides. Count the atoms of each element on each side, using the coefficients, and compare. If the counts do not match, the equation was written wrong."}, {"t": "idea", "text": "Back to 2H₂ + O₂ → 2H₂O: 4 hydrogen and 2 oxygen atoms on each side."}, {"t": "idea", "text": "The counts match, so hydrogen burning is written right."}], "script": [{"say": "Here is hydrogen burning, written with formulas: 2H₂ plus O₂ react to make 2H₂O.", "screen": "[the word strip; the formula form under it]"}, {"say": "No atom is made or lost, so the left should match the right: do they?", "screen": "[question mark between the two sides]"}, {"say": "A coefficient counts whole particles and multiplies every count in the formula.", "screen": "[the 2 in 2H₂ boxed; two particles appear]"}, {"say": "To check an equation, there are three steps to follow.", "screen": "[1, 2, 3 as bold numbers]"}, {"say": "One: count each element on the left: 2H₂ is 4 hydrogen atoms, and O₂ is 2 oxygen atoms.", "screen": "[a row of 4 small dark circles; a row of 2 large open circles]"}, {"say": "Two: count each element on the right: 2H₂O is 4 hydrogen atoms and 2 oxygen atoms.", "screen": "[matching rows appear under the right side]"}, {"say": "Three: compare, kind for kind: 4 and 4, 2 and 2, so the equation obeys the law.", "screen": "[the table fills: yes, yes]"}, {"say": "Now consider methane burning: carbon 1 and 1, hydrogen 4 and 4, oxygen 4 and 4, a match.", "screen": "[the methane strip; the table fills]"}, {"say": "Suppose someone writes 2H₂ plus O₂ react to make H₂O: 4 hydrogen atoms on the left, only 2 on the right.", "screen": "[the wrong line; the table: 4 against 2, 2 against 1; cross]"}, {"say": "Atoms would have to vanish, so that line was written wrong.", "screen": "[label: written wrong]"}, {"say": "The rule: an equation obeys the law when each kind of atom counts the same on both sides.", "screen": "[rule slide reuses the hydrogen table; rule text]"}, {"say": "Back to 2H₂ plus O₂ react to make 2H₂O: 4 hydrogen and 2 oxygen atoms on each side.", "screen": "[the two rows lined up; tick]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "How many hydrogen atoms does 3H₂O hold in all?", "options": ["2 atoms", "3 atoms", "6 atoms"], "key": 2, "fb": ["2 is the hydrogen count in ONE water particle; the coefficient 3 multiplies it.", "3 is the number of particles, not the hydrogen atoms.", "Three particles of 2 hydrogen atoms each: 3 × 2 = 6 hydrogen atoms."], "why": "One H₂O particle holds 2 hydrogen atoms.<br>The coefficient 3 means three particles, so multiply: 3 × 2 = 6.<br>So 3H₂O holds 6 hydrogen atoms in all."}, {"type": "mcq", "tag": "recall", "stem": "Which of these is true in every chemical reaction?", "options": ["no atom is made and no atom is lost", "some atoms are made to build the products", "some atoms are lost as heat"], "key": 0, "fb": ["Every atom that was there before is still there after: that is why the total mass is conserved.", "The products are built from atoms that were in the reactants; none are made.", "Heat is not made of atoms; no atom is lost."], "why": "In a reaction the atoms only swap partners.<br>Every atom that was there before is still there after.<br>So no atom is made and no atom is lost."}, {"type": "text", "tag": "scaffold", "stem": "Carbon monoxide burns: carbon monoxide + oxygen → carbon dioxide, written 2CO + O₂ → 2CO₂. Count the carbon atoms on the left.", "accept": ["2", "two", "2 carbon atoms", "2 atoms"], "why": "On the left, only 2CO holds carbon.<br>The coefficient 2 means two particles of 1 carbon atom each: 2 × 1 = 2.<br>So there are 2 carbon atoms on the left."}, {"type": "text", "tag": "scaffold", "stem": "In 2CO + O₂ → 2CO₂, count the carbon atoms on the right.", "accept": ["2", "two", "2 carbon atoms", "2 atoms"], "why": "On the right, 2CO₂ holds the carbon.<br>Two particles of 1 carbon atom each: 2 × 1 = 2.<br>So there are 2 carbon atoms on the right."}, {"type": "text", "tag": "scaffold", "stem": "In 2CO + O₂ → 2CO₂, count the oxygen atoms on the left.", "accept": ["4", "four", "4 oxygen atoms", "4 atoms"], "why": "2CO holds 2 × 1 = 2 oxygen atoms.<br>O₂ holds 2 oxygen atoms.<br>Add them: 2 + 2 = 4 oxygen atoms on the left."}, {"type": "text", "tag": "scaffold", "stem": "In 2CO + O₂ → 2CO₂, count the oxygen atoms on the right.", "accept": ["4", "four", "4 oxygen atoms", "4 atoms"], "why": "2CO₂ is two particles of 2 oxygen atoms each.<br>Multiply: 2 × 2 = 4.<br>So there are 4 oxygen atoms on the right."}, {"type": "mcq", "tag": "scaffold", "stem": "Compare your counts for 2CO + O₂ → 2CO₂, kind for kind. Does the equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Carbon 2 and 2, oxygen 4 and 4: every count matches, so the equation obeys the law.", "Compare your counts again: carbon 2 and 2, oxygen 4 and 4; every count matches, so the equation obeys the law."], "why": "Carbon: 2 on the left and 2 on the right.<br>Oxygen: 4 on the left and 4 on the right.<br>The counts match, so the equation obeys the law."}, {"type": "mcq", "tag": "bare", "stem": "Sodium burns in chlorine: 2Na + Cl₂ → 2NaCl. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Sodium 2 and 2, chlorine 2 and 2: a match.", "Count again: sodium 2 and 2, chlorine 2 and 2; every count matches."], "why": "Sodium: 2 on the left, 2 on the right in 2NaCl.<br>Chlorine: 2 on the left in Cl₂, 2 on the right in 2NaCl.<br>The counts match, so the equation obeys the law."}, {"type": "mcq", "tag": "bare", "stem": "A student writes hydrogen burning in chlorine as H₂ + Cl₂ → HCl. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 1, "fb": ["Hydrogen: 2 on the left but only 1 on the right; the counts do not match.", "Hydrogen 2 against 1, chlorine 2 against 1: the counts do not match, so the line was written wrong."], "why": "Hydrogen: 2 on the left in H₂, but 1 on the right in HCl.<br>Chlorine: 2 on the left, but 1 on the right.<br>The counts do not match, so the equation was written wrong."}, {"type": "mcq", "tag": "bare", "stem": "A student writes magnesium burning as 2Mg + O₂ → MgO. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 1, "fb": ["Magnesium: 2 on the left but only 1 on the right; the counts do not match.", "Magnesium 2 against 1, oxygen 2 against 1: the counts do not match, so the line was written wrong."], "why": "Magnesium: 2 on the left in 2Mg, but 1 on the right in MgO.<br>Oxygen: 2 on the left, but 1 on the right.<br>The counts do not match, so the equation was written wrong."}, {"type": "mcq", "tag": "bare", "stem": "Ammonia is made from nitrogen and hydrogen: N₂ + 3H₂ → 2NH₃. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Nitrogen 2 and 2, hydrogen 3 × 2 = 6 and 2 × 3 = 6: a match.", "Count again: nitrogen 2 and 2; hydrogen 3 × 2 = 6 on the left and 2 × 3 = 6 on the right; every count matches."], "why": "Nitrogen: 2 on the left in N₂, 2 on the right in 2NH₃.<br>Hydrogen: 3 × 2 = 6 on the left, 2 × 3 = 6 on the right.<br>The counts match, so the equation obeys the law."}, {"type": "mcq", "tag": "bare", "stem": "Zinc and sulfur are heated together: Zn + S → ZnS. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Zinc 1 and 1, sulfur 1 and 1: a match.", "Count again: zinc 1 and 1, sulfur 1 and 1; every count matches."], "why": "Zinc: 1 on the left, 1 on the right.<br>Sulfur: 1 on the left, 1 on the right.<br>The counts match, so the equation obeys the law."}, {"type": "mcq", "tag": "misconception", "stem": "Kavya says: \"2H₂ + O₂ → H₂O obeys the law of conservation of mass, because both sides have hydrogen and oxygen.\" Is Kavya correct?", "options": ["yes", "no"], "key": 1, "fb": ["Kavya's reason is not the test: having the same elements is not enough; the counts must match, and hydrogen is 4 against 2, oxygen 2 against 1.", "The counts must match kind for kind: hydrogen is 4 against 2 and oxygen 2 against 1, so the line was written wrong and Kavya is not correct."], "why": "The law is about the count of each kind of atom, not only which kinds appear.<br>Hydrogen: 4 on the left, 2 on the right. Oxygen: 2 on the left, 1 on the right.<br>The counts do not match, so Kavya is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video counted the hydrogen atoms on each side of 2H₂ + O₂ → 2H₂O. How many did it find on each side?", "options": ["2 atoms", "4 atoms", "6 atoms"], "key": 1, "fb": ["2 is the hydrogen count in ONE particle; the coefficient 2 doubles it.", "2H₂ is 2 × 2 = 4 hydrogen atoms, and 2H₂O is 2 × 2 = 4 hydrogen atoms.", "6 is not a count on either side; each side holds 4 hydrogen atoms."], "why": "On the left, 2H₂ is two particles of 2 hydrogen atoms: 4.<br>On the right, 2H₂O is two particles of 2 hydrogen atoms: 4.<br>So the video found 4 hydrogen atoms on each side."}]}, {"id": "L08", "atom": "MAT-072", "title": "Photosynthesis: a tree's mass comes from the air", "video": "definitely a video", "lesson_type": "Procedural lesson (the counting routine on the photosynthesis equation) with a concept close (where each atom in the glucose came from, so where a plant's new mass comes from); photosynthesis is named, not coined", "check_design": "Type (b) scaffolded sequence, then a type (c) close → two recall MCQs (LIF-073 stated on the page: the two reactants of photosynthesis; L07: what you compare to check an equation), seven scaffold steps on a SECOND case, the equation run the other way as living things use glucose (C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, printed in every stem: carbon left and right, hydrogen left and right, oxygen left and right, match?), two bare yes / no items (the photosynthesis equation itself, the atom's own equation, key yes; photosynthesis written wrong with O₂ alone, key no), two student claims (Lachlan, with a one-clause set-up: the willow's new mass came from the soil, key no; Meike: every carbon atom in the glucose came from carbon dioxide, key yes), and one transfer (predict a potted corn plant's soil reading). 14 items.", "headache": ["About 400 years ago, a scientist planted a small willow tree in a tub of soil.", "The tree had a mass of 2.3 kg.", "He watered it for five years and added nothing else.", "After five years the tree had a mass of 76.7 kg.", "The soil had lost only 0.06 kg.", "Where did the other 74 kg of tree come from?"], "forest": ["Where do the atoms in a plant come from?", "Plants build a sugar called glucose from carbon dioxide and water, using light.", "This reaction is called photosynthesis.", "Count the atoms on each side of the photosynthesis equation: they match.", "Every carbon atom in the glucose came from carbon dioxide in the air, and every hydrogen atom came from water.", "So the tree's 74 kg came from the air and the watering can, not from the soil."], "article": [{"t": "idea", "text": "About 400 years ago, a scientist planted a small willow tree in a tub of soil."}, {"t": "idea", "text": "The tree had a mass of 2.3 kg."}, {"t": "idea", "text": "He watered it for five years and added nothing else."}, {"t": "idea", "text": "After five years the tree had a mass of 76.7 kg."}, {"t": "idea", "text": "The soil had lost only 0.06 kg."}, {"t": "fig", "key": "willow_tubs", "cap": "The willow at year 0 and at year 5: the tree from 2.3 kg to 76.7 kg, the soil only 0.06 kg less, the soil line the same height in both tubs."}, {"t": "idea", "text": "Where did the other 74 kg of tree come from?"}, {"t": "h", "text": "Two facts to hold"}, {"t": "idea", "text": "Plants build a sugar called glucose from carbon dioxide and water, using light."}, {"t": "idea", "text": "This reaction is called photosynthesis."}, {"t": "idea", "text": "Photo means light, and synthesis means building: building with light."}, {"t": "fig", "key": "photo_words", "cap": "The word equation for photosynthesis: carbon dioxide + water → glucose + oxygen. Light is needed for the reaction to run."}, {"t": "idea", "text": "An equation obeys the law of conservation of mass when each kind of atom counts the same on both sides."}, {"t": "h", "text": "The equation with formulas"}, {"t": "idea", "text": "With formulas, photosynthesis is written 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂."}, {"t": "fig", "key": "photo_formula", "cap": "Photosynthesis in words and in formulas: carbon dioxide + water → glucose + oxygen; 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂."}, {"t": "idea", "text": "Glucose, C₆H₁₂O₆, is one particle of 6 carbon atoms, 12 hydrogen atoms and 6 oxygen atoms."}, {"t": "h", "text": "Count the atoms on each side"}, {"t": "idea", "text": "Carbon: 6CO₂ holds 6 × 1 = 6 carbon atoms on the left, and C₆H₁₂O₆ holds 6 on the right."}, {"t": "idea", "text": "Hydrogen: 6H₂O holds 6 × 2 = 12 hydrogen atoms on the left, and C₆H₁₂O₆ holds 12 on the right."}, {"t": "idea", "text": "Oxygen on the left: 6CO₂ holds 6 × 2 = 12, and 6H₂O holds 6 × 1 = 6, so 18 oxygen atoms."}, {"t": "idea", "text": "Oxygen on the right: C₆H₁₂O₆ holds 6, and 6O₂ holds 6 × 2 = 12, so 18 oxygen atoms."}, {"t": "fig", "key": "photo_strip", "cap": "Each side's atoms drawn as loose circles: 6 carbon, 12 hydrogen and 18 oxygen atoms on the left; the same 6, 12 and 18 on the right."}, {"t": "fig", "key": "photo_table", "cap": "The counting table for 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂: carbon 6 and 6, hydrogen 12 and 12, oxygen 18 and 18, all a match."}, {"t": "idea", "text": "Every count matches, so the photosynthesis equation obeys the law of conservation of mass."}, {"t": "h", "text": "Where each atom in the glucose came from"}, {"t": "idea", "text": "The atoms in a new substance come from the substances that were there before."}, {"t": "idea", "text": "Only carbon dioxide brings carbon, so every carbon atom in the glucose came from carbon dioxide in the air."}, {"t": "idea", "text": "Water is the only reactant with hydrogen, so every hydrogen atom in the glucose came from the water."}, {"t": "idea", "text": "Both reactants bring oxygen atoms, so counting alone cannot say which oxygen atoms went into the glucose."}, {"t": "fig", "key": "where_from_table", "cap": "The atoms in one glucose particle and where each kind came from: carbon from the air's carbon dioxide, hydrogen from the water; oxygen: both reactants bring it, so the equation alone cannot say."}, {"t": "h", "text": "From glucose to a tree"}, {"t": "idea", "text": "The tree uses the glucose to build its leaves, its wood and its roots."}, {"t": "idea", "text": "So the atoms in the new wood came from carbon dioxide in the air and water from the can."}, {"t": "idea", "text": "The soil lost only 0.06 kg, so the soil supplied almost none of the 74 kg."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Plants build glucose from carbon dioxide and water: carbon dioxide + water → glucose + oxygen, with light needed. The equation conserves every atom, and every carbon atom in the glucose came from the air. So a plant's new mass comes from the air and the water, not from the soil."}, {"t": "idea", "text": "Back to the willow: for five years it took in carbon dioxide from the air and water from the can."}, {"t": "idea", "text": "Those atoms became 74 kg of tree, and the soil barely changed."}], "script": [{"say": "About 400 years ago, a scientist planted a small willow tree, 2.3 kg, in a tub of soil.", "screen": "[a small tree in a tub; label 2.3 kg]"}, {"say": "He only watered it; five years on, the tree was 76.7 kg and the soil had lost 0.06 kg.", "screen": "[the tree grows tall; the soil line stays; labels 76.7 kg and 0.06 kg]"}, {"say": "Where did the other 74 kg of tree come from?", "screen": "[question mark over the tree]"}, {"say": "Plants build glucose from carbon dioxide and water, using light: this reaction is called photosynthesis.", "screen": "[strip: carbon dioxide + water → glucose + oxygen; a sun above]"}, {"say": "Watch carbon dioxide drift in from the air and water rise from the can.", "screen": "[carbon dioxide molecules flow in from the air; water molecules flow up from the can]"}, {"say": "With formulas: 6CO₂ plus 6H₂O react to make C₆H₁₂O₆ plus 6O₂.", "screen": "[the formula form under the strip]"}, {"say": "Count carbon: 6 and 6; hydrogen: 12 and 12; oxygen: 18 and 18.", "screen": "[rows of circles each side; the table: yes, yes, yes]"}, {"say": "Every count matches, so the equation obeys the law of conservation of mass.", "screen": "[chip: A MATCH]"}, {"say": "Only carbon dioxide brings carbon, so every carbon atom in the glucose came from the air.", "screen": "[the gray circles trace back to the carbon dioxide]"}, {"say": "Only water brings hydrogen, so every hydrogen atom came from the watering can.", "screen": "[the small dark circles trace back to the water]"}, {"say": "The tree builds its leaves, wood and roots from the glucose.", "screen": "[the tree thickens as glucose flows into it]"}, {"say": "So here is the rule: a plant's new mass comes from the air and the water, not from the soil.", "screen": "[rule slide reuses the two tubs; rule text]"}, {"say": "Back to the willow: 74 kg of air and water, built into a tree.", "screen": "[the tall tree; the soil line unchanged]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which two substances does a plant use to build glucose in photosynthesis?", "options": ["water and minerals from the soil", "oxygen from the air and soil", "carbon dioxide and water"], "key": 2, "fb": ["Soil is not a reactant; the plant builds glucose from carbon dioxide and water.", "Oxygen is a product of photosynthesis, and soil is not a reactant.", "Plants build glucose from carbon dioxide and water, using light."], "why": "Plants build a sugar called glucose from carbon dioxide and water.<br>Light is needed, but light is not made of atoms.<br>So the two reactants are carbon dioxide and water."}, {"type": "mcq", "tag": "recall", "stem": "To check that an equation obeys the law of conservation of mass, what do you compare?", "options": ["the count of each kind of atom on each side", "the number of particles on each side of the arrow", "the number of formulas on each side"], "key": 0, "fb": ["An equation obeys the law when each kind of atom counts the same on both sides.", "The number of particles can change; it is the atoms of each kind that must match.", "How many formulas there are does not matter; the atoms of each kind must match."], "why": "The law says no atom is made and no atom is lost.<br>So each kind of atom must count the same on the left and on the right.<br>That is what you compare."}, {"type": "text", "tag": "scaffold", "stem": "Living things use glucose in a reaction that runs the other way: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O. Count the carbon atoms on the left.", "accept": ["6", "six", "6 carbon atoms", "6 atoms"], "why": "Only C₆H₁₂O₆ holds carbon on the left.<br>The small low number after the C is 6.<br>So there are 6 carbon atoms on the left."}, {"type": "text", "tag": "scaffold", "stem": "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, count the carbon atoms on the right.", "accept": ["6", "six", "6 carbon atoms", "6 atoms"], "why": "Only 6CO₂ holds carbon on the right.<br>Six particles of 1 carbon atom each: 6 × 1 = 6.<br>So there are 6 carbon atoms on the right."}, {"type": "text", "tag": "scaffold", "stem": "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, count the hydrogen atoms on the left.", "accept": ["12", "twelve", "12 hydrogen atoms", "12 atoms"], "why": "Only C₆H₁₂O₆ holds hydrogen on the left.<br>The small low number after the H is 12.<br>So there are 12 hydrogen atoms on the left."}, {"type": "text", "tag": "scaffold", "stem": "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, count the hydrogen atoms on the right.", "accept": ["12", "twelve", "12 hydrogen atoms", "12 atoms"], "why": "Only 6H₂O holds hydrogen on the right.<br>Six particles of 2 hydrogen atoms each: 6 × 2 = 12.<br>So there are 12 hydrogen atoms on the right."}, {"type": "text", "tag": "scaffold", "stem": "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, count the oxygen atoms on the left. Add the oxygen in C₆H₁₂O₆ to the oxygen in 6O₂.", "accept": ["18", "eighteen", "18 oxygen atoms", "18 atoms"], "why": "C₆H₁₂O₆ holds 6 oxygen atoms.<br>6O₂ holds 6 × 2 = 12 oxygen atoms.<br>Add them: 6 + 12 = 18 oxygen atoms on the left."}, {"type": "text", "tag": "scaffold", "stem": "In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, count the oxygen atoms on the right. Add the oxygen in 6CO₂ to the oxygen in 6H₂O.", "accept": ["18", "eighteen", "18 oxygen atoms", "18 atoms"], "why": "6CO₂ holds 6 × 2 = 12 oxygen atoms.<br>6H₂O holds 6 × 1 = 6 oxygen atoms.<br>Add them: 12 + 6 = 18 oxygen atoms on the right."}, {"type": "mcq", "tag": "scaffold", "stem": "Compare your counts for C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, kind for kind. Does the equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Carbon 6 and 6, hydrogen 12 and 12, oxygen 18 and 18: every count matches.", "Compare your counts again: carbon 6 and 6, hydrogen 12 and 12, oxygen 18 and 18; every count matches, so the equation obeys the law."], "why": "Carbon: 6 and 6. Hydrogen: 12 and 12. Oxygen: 18 and 18.<br>Each kind of atom counts the same on both sides.<br>So the equation obeys the law."}, {"type": "mcq", "tag": "bare", "stem": "Photosynthesis is written 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Carbon 6 and 6, hydrogen 12 and 12, oxygen 12 + 6 = 18 and 6 + 12 = 18: every count matches.", "Count again: carbon 6 and 6, hydrogen 12 and 12, oxygen 18 and 18; every count matches."], "why": "Carbon: 6 on the left in 6CO₂, 6 on the right in C₆H₁₂O₆.<br>Hydrogen: 12 and 12. Oxygen: 12 + 6 = 18 on the left, 6 + 12 = 18 on the right.<br>The counts match, so the equation obeys the law."}, {"type": "mcq", "tag": "bare", "stem": "A student writes photosynthesis as 6CO₂ + 6H₂O → C₆H₁₂O₆ + O₂. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 1, "fb": ["Oxygen: 18 on the left, but only 6 + 2 = 8 on the right; the counts do not match.", "Oxygen 18 against 8: the counts do not match, so the line was written wrong."], "why": "Oxygen on the left: 12 + 6 = 18.<br>Oxygen on the right: 6 in C₆H₁₂O₆ + 2 in O₂ = 8.<br>The counts do not match, so the equation was written wrong."}, {"type": "mcq", "tag": "misconception", "stem": "A willow grown in a tub for five years gained 74 kg, and its soil lost only 0.06 kg. Lachlan says: \"The willow's extra 74 kg came from the soil, because that is what the roots sit in.\" Is Lachlan correct?", "options": ["yes", "no"], "key": 1, "fb": ["The soil cannot be the source: it lost only 0.06 kg. The plant built its glucose from carbon dioxide in the air and water from the can.", "The soil lost only 0.06 kg, far less than 74 kg; the plant built its glucose from carbon dioxide in the air and water from the can."], "why": "The soil lost only 0.06 kg in five years, far less than 74 kg.<br>The plant builds glucose from carbon dioxide and water.<br>So the new mass came from the air and the water, and Lachlan is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Meike says: \"Every carbon atom in the glucose came from carbon dioxide, because carbon dioxide is the only reactant with carbon.\" Is Meike correct?", "options": ["yes", "no"], "key": 0, "fb": ["The atoms in a new substance come from the substances that were there before, and only carbon dioxide brought carbon.", "Meike is right: the atoms in a new substance come from the substances that were there before, and of the two reactants only carbon dioxide brought carbon."], "why": "The atoms in a new substance come from the substances that were there before.<br>Of the two reactants, only carbon dioxide holds carbon atoms.<br>So every carbon atom in the glucose came from carbon dioxide, and Meike is correct."}, {"type": "mcq", "tag": "transfer", "stem": "A corn plant grows in a large pot for a summer and gains 2.0 kg. The soil in the pot is weighed at the start and at the end. What does the soil's mass do?", "options": ["it falls by about 2.0 kg", "it barely changes", "it rises by about 2.0 kg"], "key": 1, "fb": ["The plant did not take its new mass from the soil; the soil supplies almost none of it.", "The corn built its mass from carbon dioxide in the air and from water, so the soil's mass barely changes.", "Nothing adds mass to the soil; the plant's new atoms came from the air and the water."], "why": "Plants build glucose from carbon dioxide and water.<br>The plant's new mass is built from that glucose, so almost none of it comes from the soil.<br>So the soil's mass barely changes."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video's willow grew from 2.3 kg to 76.7 kg. Where did it say the new mass came from?", "options": ["the air and the water", "the soil", "the sunlight, which turned into wood"], "key": 0, "fb": ["The plant built glucose from carbon dioxide in the air and water from the can, then built wood from the glucose.", "The soil lost only 0.06 kg, so it supplied almost none of the new mass.", "Light is needed, but light is not made of atoms; the atoms came from the air and the water."], "why": "Plants build glucose from carbon dioxide and water.<br>The tree built its wood from that glucose.<br>So the new mass came from the air and the water, not the soil."}]}], "practice": [{"type": "text", "tag": "mass", "atom": "MAT-069b", "stem": "In a sealed flask, 5.4 g of aluminum burns in 4.8 g of oxygen, and every atom ends up in one product, aluminum oxide. What is the mass of the aluminum oxide, in g?", "accept": ["10.2 g", "10.2", "10.2 grams", "10.2g"], "why": "mass of aluminum oxide = mass of aluminum + mass of oxygen.<br>mass of aluminum oxide = 5.4 g + 4.8 g.<br>5.4 + 4.8 = 10.2, so the aluminum oxide has a mass of 10.2 g."}, {"type": "text", "tag": "count", "atom": "MAT-070", "stem": "Aluminum burns in chlorine: 2Al + 3Cl₂ → 2AlCl₃. How many chlorine atoms are on the right?", "accept": ["6", "six", "6 chlorine atoms", "6 atoms"], "why": "On the right, 2AlCl₃ is two particles.<br>Each holds 3 chlorine atoms: 2 × 3 = 6.<br>So there are 6 chlorine atoms on the right."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-070", "stem": "Aluminum burns in chlorine: 2Al + 3Cl₂ → 2AlCl₃. Does this equation obey the law of conservation of mass?", "options": ["yes", "no"], "key": 0, "fb": ["Aluminum 2 and 2, chlorine 3 × 2 = 6 and 2 × 3 = 6: every count matches.", "Count again: aluminum 2 and 2; chlorine 3 × 2 = 6 on the left and 2 × 3 = 6 on the right; every count matches."], "why": "Aluminum: 2 on the left, 2 on the right.<br>Chlorine: 3 × 2 = 6 on the left, 2 × 3 = 6 on the right.<br>The counts match, so the equation obeys the law."}, {"type": "frq", "tag": "why", "atom": "MAT-069b", "task": "A student heats 20.0 g of green copper carbonate powder in an open dish on a balance zeroed with the empty dish. The powder turns black, a gas comes off, and the reading falls to 12.9 g. In a lidded jar, the same powder heated the same way would still read 20.0 g. Explain why the open dish reads 12.9 g.", "starter": "No mass was destroyed…", "model": "No mass was destroyed.<br>The reaction made a gas, and a gas has mass.<br>In the lidded jar the gas stays in, so the balance still reads 20.0 g.<br>The dish is open, so the gas floated away with its mass.<br>So the dish reads only the 12.9 g left, and the missing 7.1 g is the gas.", "points": ["no mass was destroyed", "the lid keeps the gas in, so the jar still reads 20.0 g", "the open dish lets the gas leave with its mass, so the dish reads only what is left"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-066", "fig": "pr_pair", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 0, "fb": ["Before, the gray circles stood alone and the small dark circles came in pairs; after, each gray circle is joined to four small dark circles: new partners.", "Before, the gray circles stood alone; after, each is joined to four small dark circles that left their pairs. The partners changed."], "why": "Before: two single gray circles and four pairs of small dark circles.<br>After: each gray circle is joined to four small dark circles.<br>The atoms changed partners, so this is a chemical reaction."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-069", "stem": "A sealed flask of two clear liquids reads 120.0 g. The liquids react, and a yellow solid forms. Niamh says: \"The flask will now read more than 120.0 g, because a solid weighs more than a liquid.\" Is Niamh correct?", "options": ["yes", "no"], "key": 1, "fb": ["The solid is made of atoms that were in the liquids already; no atom came in, so no mass was added.", "Every atom is still in the sealed flask and keeps its mass: the reading stays at 120.0 g, so Niamh is not correct."], "why": "The yellow solid is made of atoms that were in the two liquids before.<br>The flask is sealed, so no atom came in and none left.<br>Each atom keeps its mass, so the flask still reads 120.0 g, and Niamh is not correct."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-071", "fig": "pt_ag_s", "stem": "Part of the periodic table is supplied. A spoon darkens in the air: 2Ag + S → Ag₂S. Which elements take part?", "options": ["gold and sulfur", "silver and sulfur", "silver, sulfur and a third element for the 2"], "key": 1, "fb": ["Ag is silver's symbol; gold is Au.", "Ag is silver and S is sulfur; the 2s count particles and atoms, not elements.", "The 2s are numbers, not symbols; only two symbols appear, Ag and S."], "why": "The symbols are Ag and S.<br>On the periodic table, Ag is silver and S is sulfur.<br>So two elements take part: silver and sulfur."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-066", "stem": "A glacier melts a little each summer, and streams of water run off it. Is the melting a chemical reaction?", "options": ["yes", "no"], "key": 1, "fb": ["Melting is a change of state: each water molecule is still one oxygen atom joined to two hydrogen atoms, so no atom changed partners.", "The ice melts into liquid water; each molecule keeps its atoms, so no atom changed partners and this is not a chemical reaction."], "why": "The ice melts into liquid water: the molecules move more freely.<br>Each molecule is still one oxygen atom joined to two hydrogen atoms.<br>No atom changed partners, so this is not a chemical reaction."}, {"type": "text", "tag": "term", "atom": "MAT-066", "stem": "A change in which atoms let go of their old partners and join new ones, so that new substances form, is called a…", "accept": ["chemical reaction", "a chemical reaction", "reaction", "a reaction"], "why": "The atoms rearrange into new substances.<br>A change in which atoms rearrange into new substances is called a chemical reaction."}, {"type": "text", "tag": "term", "atom": "MAT-067", "stem": "In calcium + chlorine → calcium chloride, calcium and chlorine go into the reaction and stand on the left. What are they called?", "accept": ["reactants", "the reactants", "reactant"], "why": "Calcium and chlorine go into the reaction.<br>The substances that go into a reaction are called the reactants."}, {"type": "text", "tag": "term", "atom": "MAT-067", "stem": "In tin + oxygen → tin oxide, tin oxide comes out of the reaction and stands on the right. What is it called?", "accept": ["product", "the product", "a product", "products"], "why": "Tin oxide comes out of the reaction.<br>The substances that come out of a reaction are called the products."}, {"type": "text", "tag": "term", "atom": "MAT-069", "stem": "A chemist weighs a sealed flask before a reaction inside it and again after, and gets the same reading both times. Which law does the same reading show?", "accept": ["law of conservation of mass", "the law of conservation of mass", "conservation of mass", "the conservation of mass"], "why": "The same reading means the total mass was kept through the reaction.<br>This rule is called the law of conservation of mass."}], "pp100": [{"d": "easy", "atom": "MAT-066", "stem": "Atoms let go of their old partners and join new ones, and new substances form. What is this kind of change called?", "options": ["a change of state, like melting", "dissolving into a solution", "a physical change", "a chemical reaction"], "key": 3, "why": "In a chemical reaction the atoms let go of their old partners and join new ones.<br>New groupings of atoms are new substances.<br>So a change in which atoms rearrange into new substances is a chemical reaction."}, {"d": "easy", "atom": "MAT-067", "stem": "lead + oxygen → lead oxide. Which is the product?", "options": ["lead", "lead oxide", "oxygen", "lead and oxygen together"], "key": 1, "why": "The products are written on the right of the arrow.<br>Lead oxide is on the right.<br>So lead oxide is the product; lead and oxygen are the reactants."}, {"d": "easy", "atom": "MAT-069", "stem": "A lidded jar of reacting substances reads the same on a balance before and after the reaction inside it. Which rule says that it must?", "options": ["the particle model of matter", "the word equation", "the law of conservation of mass", "the periodic table of the elements"], "key": 2, "why": "In a reaction every atom is still there and keeps its mass.<br>So the total mass of the products equals the total mass of the reactants.<br>This rule is the law of conservation of mass."}, {"d": "easy", "atom": "MAT-068", "stem": "In any chemical reaction, where do the atoms in the products come from?", "options": ["they are made during the reaction", "from the reactants", "from the container", "from the heat"], "key": 1, "why": "No atom is made from nothing, and no atom vanishes.<br>The atoms only swap partners.<br>So the atoms in the products come from the reactants."}, {"d": "easy", "atom": "MAT-071", "stem": "In the equation 2Zn + O₂ → 2ZnO, which of the numbers names an element?", "options": ["the 2 in front of Zn", "the small 2 after the O", "both 2s", "none of the numbers"], "key": 3, "why": "A number in front counts particles.<br>A small low number counts atoms in one particle.<br>Only the symbols, Zn and O, name elements, so none of the numbers does."}, {"d": "easy", "atom": "MAT-069", "stem": "After a reaction inside a lidded jar, the products inside have a total mass of 30.0 g. What was the total mass of the reactants before the reaction?", "options": ["30.0 g", "less than 30.0 g, because the reaction made more matter", "more than 30.0 g, because some was used up", "it cannot be known without weighing the reactants"], "key": 0, "why": "The total mass of the products equals the total mass of the reactants.<br>The lid kept every atom in, so nothing left or came in.<br>So the reactants also had a total mass of 30.0 g."}, {"d": "easy", "atom": "MAT-070", "stem": "For one equation a student counts the atoms of each element: carbon 2 on the left and 2 on the right; oxygen 4 on the left and 3 on the right. Which statement is correct?", "options": ["The equation obeys the law: every element appears on both sides.", "The equation cannot be checked without the formulas.", "The equation was written wrong: the oxygen counts do not match.", "The equation was written wrong: the carbon counts do not match."], "key": 2, "why": "An equation obeys the law when each kind of atom counts the same on both sides.<br>Carbon matches, 2 and 2.<br>Oxygen does not, 4 against 3, so the equation was written wrong."}, {"d": "easy", "atom": "MAT-067", "stem": "hydrogen peroxide → water + oxygen. How many reactants and how many products does this word equation show?", "options": ["2 reactants and 1 product", "1 reactant and 1 product", "1 reactant and 2 products", "3 reactants and no product"], "key": 2, "why": "The reactants stand on the left of the arrow: hydrogen peroxide, one substance.<br>The products stand on the right: water and oxygen, two substances.<br>So 1 reactant and 2 products."}, {"d": "easy", "atom": "MAT-066", "stem": "Copper is heated with sulfur: copper + sulfur → copper sulfide. Before the reaction, each sulfur atom was joined to other sulfur atoms. After it, what is each copper atom joined to?", "options": ["another copper atom", "a sulfur atom", "an oxygen atom from the air", "nothing: each copper atom stands alone"], "key": 1, "why": "In a chemical reaction the atoms let go of their old partners and join new ones.<br>The product is copper sulfide: copper atoms joined to sulfur atoms.<br>So after the reaction each copper atom is joined to a sulfur atom, its new partner."}, {"d": "easy", "atom": "MAT-067", "stem": "In the word equation zinc + chlorine → zinc chloride, how is the plus sign read aloud?", "options": ["makes", "equals", "then", "and"], "key": 3, "why": "A word equation is read aloud as a sentence.<br>The plus sign between two substances on one side reads “and”.<br>The arrow reads “react to make”.<br>So the line reads: zinc and chlorine react to make zinc chloride."}, {"d": "easy", "atom": "MAT-067", "stem": "Lightning makes this reaction happen in the air: nitrogen + oxygen → nitrogen monoxide. Which sentence reads the word equation aloud?", "options": ["Nitrogen monoxide reacts to make nitrogen and oxygen.", "Nitrogen and oxygen react to make nitrogen monoxide.", "Nitrogen and oxygen are the same as nitrogen monoxide.", "Nitrogen reacts with nitrogen monoxide to make oxygen."], "key": 1, "why": "The reactants stand on the left: nitrogen and oxygen.<br>The arrow reads “react to make”.<br>The product stands on the right: nitrogen monoxide.<br>So the line reads: nitrogen and oxygen react to make nitrogen monoxide."}, {"d": "easy", "atom": "MAT-069", "stem": "In a chemical reaction, why does the total mass of the products equal the total mass of the reactants?", "options": ["Every atom is still there after, and each keeps its own mass.", "The products are always the same substances as the reactants.", "The heat given off makes up for any atoms that are lost.", "New atoms are made at exactly the rate old ones are destroyed."], "key": 0, "why": "In a reaction the atoms only swap partners.<br>So every atom that was there before is still there after.<br>Each atom keeps its own mass.<br>So the total mass of the products equals the total mass of the reactants."}, {"d": "easy", "atom": "MAT-069b", "stem": "Hydrogen gas is passed over hot copper oxide: hydrogen + copper oxide → copper + water. Which line writes the law of conservation of mass in this reaction's substances?", "options": ["mass of hydrogen + mass of copper oxide + mass of copper = mass of water", "mass of hydrogen = mass of copper oxide + mass of copper + mass of water", "mass of copper oxide − mass of hydrogen = mass of copper − mass of water", "mass of hydrogen + mass of copper oxide = mass of copper + mass of water"], "key": 3, "why": "The reactants are hydrogen and copper oxide; the products are copper and water.<br>The total mass of the products equals the total mass of the reactants.<br>So mass of hydrogen + mass of copper oxide = mass of copper + mass of water."}, {"d": "easy", "atom": "MAT-071", "stem": "A formula equation holds the symbol Sr. To find which element Sr names, where do you look it up?", "options": ["in the coefficient in front of the formula", "in the subscript after the symbol", "on the periodic table", "on the count table of atoms on each side"], "key": 2, "why": "Step 2 of the routine is to look each symbol up on the periodic table.<br>The periodic table has one box per element, with its symbol.<br>Sr is in the box for strontium.<br>The numbers count particles and atoms; they name no element."}, {"d": "easy", "atom": "MAT-072", "stem": "In photosynthesis a plant builds glucose. Which other substance does the reaction make?", "options": ["carbon dioxide", "water", "oxygen", "nitrogen"], "key": 2, "why": "Photosynthesis: carbon dioxide + water → glucose + oxygen.<br>Carbon dioxide and water are the reactants.<br>The products stand on the right: glucose and oxygen.<br>So the other product is oxygen."}, {"d": "easy", "atom": "MAT-072", "stem": "Using light, a plant builds glucose from carbon dioxide and water. What is this reaction called?", "options": ["dissolving", "evaporation", "photosynthesis", "the law of conservation of mass"], "key": 2, "why": "Plants build a sugar called glucose from carbon dioxide and water, using light.<br>Photo means light, and synthesis means building.<br>So this reaction is called photosynthesis."}, {"d": "medium", "atom": "MAT-066", "fig": "pp_pair_a", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Which statement about the change is correct?", "options": ["New atoms appeared in the after box, so it is a chemical reaction.", "Some atoms vanished, so it is a chemical reaction.", "The atoms changed partners, so it is a chemical reaction.", "No atom changed partners, so it is not a chemical reaction."], "key": 3, "why": "Before: three groups of a large open circle joined to two small dark circles, and three single gray circles.<br>After: the same groups and singles, in new places.<br>No atom changed partners, so this is not a chemical reaction."}, {"d": "medium", "atom": "MAT-068", "fig": "pp_pair_b", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Compared with the before box, what does the after box hold?", "options": ["the same atoms, in new partners", "more atoms than before", "fewer atoms than before", "different kinds of atom from before"], "key": 0, "why": "Count each kind: 4 gray, 2 large open and 2 small dark circles before, and 4, 2 and 2 after.<br>Before, each gray circle was joined to a small dark or a large open circle; after, gray is joined to gray and large open to small dark.<br>So the after box holds the same atoms, in new partners."}, {"d": "medium", "atom": "MAT-071", "fig": "pt_na_h_c_o", "stem": "Part of the periodic table is supplied. Baking soda is heated: 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂. Which list names every element that takes part?", "options": ["sodium, hydrogen, cobalt and oxygen", "sodium, hydrogen, carbon and oxygen", "nitrogen, sodium, hydrogen, carbon and oxygen", "sodium and oxygen"], "key": 1, "why": "Read each capital with any small letter after it: Na, H, C, O.<br>On the periodic table, Na is sodium, H is hydrogen, C is carbon, O is oxygen.<br>Each is written once: four elements."}, {"d": "medium", "atom": "MAT-069b", "stem": "Zinc burns in oxygen: 13.0 g of zinc makes 16.2 g of zinc oxide, which holds every atom that reacted. What mass of oxygen joined the zinc?", "options": ["3.2 g", "13.0 g", "16.2 g", "29.2 g"], "key": 0, "why": "mass of zinc + mass of oxygen = mass of zinc oxide.<br>mass of oxygen = 16.2 g − 13.0 g.<br>16.2 − 13.0 = 3.2, so 3.2 g of oxygen joined the zinc."}, {"d": "medium", "atom": "MAT-069b", "fig": "pp_dish", "stem": "The balance was zeroed with the empty open dish on it. A powder is heated in the dish and gives off a gas. Which sentence explains the change in the reading?", "options": ["A gas made in the reaction floated away into the air.", "Some of the mass was destroyed by the heat of the burner.", "The powder shrank, so it has less mass.", "The dish lost mass as it warmed."], "key": 0, "why": "The reaction made a gas, and a gas is matter with mass.<br>The dish is open, so the gas floated away into the air.<br>The balance reads only what is left, so the reading fell from 16.0 g to 12.6 g."}, {"d": "medium", "atom": "MAT-070", "stem": "Lithium burns in oxygen. Which of these equations obeys the law of conservation of mass?", "options": ["2Li + O₂ → 2Li₂O", "4Li + O₂ → 2Li₂O", "4Li + O₂ → Li₂O", "Li + O₂ → Li₂O"], "key": 1, "why": "Count lithium and oxygen on each side.<br>4Li + O₂ → 2Li₂O: lithium 4 and 4, oxygen 2 and 2, a match.<br>In each of the others one count differs, so those lines were written wrong."}, {"d": "medium", "atom": "MAT-072", "stem": "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Which reactant supplies the hydrogen atoms in the glucose?", "options": ["the carbon dioxide", "the soil around the roots", "the water", "the light"], "key": 2, "why": "The atoms in a new substance come from the substances that were there before.<br>Of the two reactants, only H₂O holds hydrogen atoms.<br>So the water supplies the hydrogen atoms in the glucose."}, {"d": "medium", "atom": "MAT-069", "stem": "Oren mixes vinegar and baking soda in a lidded jar on a balance. Paloma mixes the same amounts in an open cup on a balance. Both mixtures fizz. Whose reading stays the same?", "options": ["both readings stay the same", "Paloma's only", "neither reading stays the same", "Oren's only"], "key": 3, "why": "The fizz makes carbon dioxide gas, which has mass.<br>Oren's lid keeps the gas in, so every atom stays on his balance and the reading stays the same.<br>Paloma's cup is open, so the gas floats away and her reading falls."}, {"d": "medium", "atom": "MAT-066", "fig": "pp_choice_a", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The top box shows the atoms before a change. Boxes J and K show two different pictures of what the after box might hold. Which box shows a chemical reaction?", "options": ["box J", "box K", "both boxes", "neither box"], "key": 1, "why": "Before: two pairs of a large open circle joined to a small dark circle, and two single gray circles.<br>Box J holds the same pairs and singles in new places: no atom changed partners.<br>Box K holds two groups of three kinds joined: the atoms changed partners.<br>So box K shows a chemical reaction."}, {"d": "medium", "atom": "MAT-066", "stem": "Two wires from a battery dip into a beaker of water. Bubbles rise from both wires: the gas from one wire is hydrogen, and the gas from the other is oxygen. Is this a chemical reaction, and why?", "options": ["Yes: each water molecule's atoms let go of each other and join new partners, so hydrogen and oxygen, two new substances, form.", "No: the hydrogen and the oxygen were already dissolved in the water as two gases, and the electricity only shook them out of the water.", "No: water is made of hydrogen atoms and oxygen atoms, so hydrogen gas and oxygen gas coming out of it are not new substances, only its parts set free.", "Yes: the electricity turned into hydrogen atoms and oxygen atoms, so new atoms were made from it."], "key": 0, "why": "Before, each water molecule is one oxygen atom joined to two hydrogen atoms.<br>The electricity makes the atoms let go of each other.<br>The hydrogen atoms pair up with hydrogen atoms, and the oxygen atoms pair up with oxygen atoms: new partners.<br>Hydrogen gas and oxygen gas are new substances, so this is a chemical reaction."}, {"d": "medium", "atom": "MAT-067", "stem": "A solid, magnesium nitride, forms when a magnesium ribbon burns in nitrogen gas. Which line writes this as a word equation?", "options": ["magnesium nitride → magnesium + nitrogen", "magnesium + nitrogen → magnesium nitride", "magnesium + magnesium nitride → nitrogen", "nitrogen → magnesium + magnesium nitride"], "key": 1, "why": "The substances that go in are the reactants: magnesium and nitrogen.<br>They stand on the left, whatever order the sentence names them in.<br>Magnesium nitride comes out, so it is the product and stands on the right.<br>So: magnesium + nitrogen → magnesium nitride."}, {"d": "medium", "atom": "MAT-068", "stem": "A shiny iron nail stands in a beaker of blue copper sulfate solution. Within an hour a brown coat of copper covers the nail. Where did the copper atoms in the coat come from?", "options": ["from the air above the beaker", "from the iron atoms, which turned into copper atoms", "from the blue liquid", "from nowhere: the change made them"], "key": 2, "why": "The atoms in a new substance come from the substances that were there before.<br>The nail held iron atoms; the blue liquid, copper sulfate, held copper atoms.<br>An iron atom cannot turn into a copper atom, and no atom is made from nothing.<br>So the coat's copper atoms came from the blue liquid."}, {"d": "medium", "atom": "MAT-069", "stem": "A lidded jar of two substances that react and make a gas reads 300.0 g before the reaction. Afterwards it reads 299.4 g. Which statement explains the readings?", "options": ["The lid let some of the gas leak out, and that gas took its mass with it.", "The reaction destroyed 0.6 g of matter.", "The gas made in the reaction has less mass than the solid substances it was made from.", "The balance always reads less after a reaction."], "key": 0, "why": "The law of conservation of mass: in a sealed jar the reading does not change.<br>This reading fell by 0.6 g, so the jar was not sealed.<br>A gas has mass, and some gas got past the lid.<br>So the 0.6 g is gas that leaked out, not mass destroyed."}, {"d": "medium", "atom": "MAT-069", "stem": "An old-style camera flashbulb is a sealed glass bulb holding a thin metal wire and oxygen; on a balance it reads 6.0 g. The bulb is fired: a bright flash, and the wire becomes a white powder. What does the balance read now?", "options": ["less than 6.0 g", "exactly 6.0 g", "more than 6.0 g", "it depends on how bright the flash was"], "key": 1, "why": "The bulb is sealed, so no atom came in and none left.<br>The wire's atoms joined oxygen atoms that were already inside the bulb.<br>Light and heat are not made of atoms, so they carry no mass away.<br>Each atom keeps its mass, so the bulb still reads 6.0 g."}, {"d": "medium", "atom": "MAT-069b", "stem": "In a lidded jar, potassium chlorate is heated until it has all split up: potassium chlorate → potassium chloride + oxygen. The jar now holds 14.9 g of potassium chloride and 9.6 g of oxygen. What mass of potassium chlorate was heated?", "options": ["5.3 g", "9.6 g", "14.9 g", "24.5 g"], "key": 3, "why": "mass of potassium chloride + mass of oxygen = mass of potassium chlorate.<br>mass of potassium chlorate = 14.9 g + 9.6 g.<br>14.9 + 9.6 = 24.5, so 24.5 g of potassium chlorate was heated."}, {"d": "medium", "atom": "MAT-069b", "fig": "pp_dish_b", "stem": "The balance was zeroed with the empty open dish on it. White magnesium carbonate powder is heated in the dish: magnesium carbonate → magnesium oxide + carbon dioxide. Which statement accounts for the change in the reading?", "options": ["13.2 g of carbon dioxide gas floated away into the air.", "13.2 g of magnesium oxide floated away into the air.", "12.1 g of carbon dioxide gas floated away into the air.", "13.2 g of heat left the dish along with the flame."], "key": 0, "why": "The reading fell from 25.3 g to 12.1 g: 25.3 − 12.1 = 13.2 g gone.<br>The word equation says the reaction makes carbon dioxide, a gas.<br>The dish is open, so the carbon dioxide floated away with its mass.<br>The magnesium oxide, a solid, stayed in the dish, and heat has no mass."}, {"d": "medium", "atom": "MAT-070", "stem": "A student writes magnesium burning in bromine as Mg + Br₂ → MgBr. Which element's count does not match on the two sides?", "options": ["magnesium", "bromine", "both magnesium and bromine", "neither: the counts match"], "key": 1, "why": "Magnesium: 1 on the left in Mg, 1 on the right in MgBr: a match.<br>Bromine: 2 on the left in Br₂, but 1 on the right in MgBr.<br>The bromine counts do not match, so the equation was written wrong."}, {"d": "medium", "atom": "MAT-070", "stem": "Ethane, a gas in natural gas, burns: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O. How many oxygen atoms are on the right?", "options": ["7 atoms", "8 atoms", "10 atoms", "14 atoms"], "key": 3, "why": "Oxygen sits in two formulas on the right.<br>4CO₂ is four particles of 2 oxygen atoms: 4 × 2 = 8.<br>6H₂O is six particles of 1 oxygen atom: 6 × 1 = 6.<br>Add them: 8 + 6 = 14 oxygen atoms on the right."}, {"d": "medium", "atom": "MAT-071", "fig": "pt_fe_cl", "stem": "Part of the periodic table is supplied. A hot metal strip burns in a jar of green gas: 2Fe + 3Cl₂ → 2FeCl₃. Which elements take part?", "options": ["fluorine and chlorine", "iron and carbon", "iron and chlorine", "iron, chlorine and a third element for the 3"], "key": 2, "why": "Read each capital with any small letter after it: Fe and Cl.<br>On the periodic table, Fe is iron and Cl is chlorine.<br>The 2 and the 3 are numbers, not symbols.<br>So two elements take part: iron and chlorine."}, {"d": "medium", "atom": "MAT-071", "stem": "Which of these formula equations uses exactly two elements?", "options": ["2H₂S + 3O₂ → 2SO₂ + 2H₂O", "SiO₂ + 2C → Si + 2CO", "CS₂ + 3O₂ → CO₂ + 2SO₂", "P₄ + 5O₂ → P₄O₁₀"], "key": 3, "why": "Read each capital with any small letter after it, and count the different symbols in each line.<br>P₄ + 5O₂ → P₄O₁₀ holds P and O only: two elements, phosphorus and oxygen.<br>The other three lines each hold three symbols: H, S and O; Si, O and C; C, S and O."}, {"d": "medium", "atom": "MAT-072", "stem": "In a greenhouse, lettuce grows with its roots in flowing water and no soil at all, and each plant gains far more mass than the seed it grew from. Where did the atoms in the new lettuce come from?", "options": ["from the water only", "from carbon dioxide in the air and from the water", "from the plastic pipes the roots sit in", "from the light of the greenhouse lamps, which turned into matter"], "key": 1, "why": "Plants build glucose from carbon dioxide and water, using light.<br>Only carbon dioxide brings carbon atoms, and only water brings hydrogen atoms.<br>Light is not made of atoms, and the pipes give the plant nothing.<br>So the new atoms came from the air's carbon dioxide and from the water."}, {"d": "hard", "atom": "MAT-069b", "stem": "A log burns in a fireplace and leaves a small heap of ash. Quentin says: \"Most of the log's mass was destroyed by the fire.\" Which statement is correct?", "options": ["The ash has the same mass as the log.", "Quentin is correct: fire destroys matter, and the ash is all that is left.", "The mass left as gases into the air; nothing was destroyed.", "The mass turned into light and heat."], "key": 2, "why": "Burning wood makes carbon dioxide and water vapor, gases with mass.<br>The fireplace is open, so the gases floated away up the chimney.<br>No atom was destroyed, so Quentin is not correct."}, {"d": "hard", "atom": "MAT-070", "stem": "Rhea says 2H₂ + O₂ → 2H₂O obeys the law of conservation of mass, because 4 hydrogen and 2 oxygen atoms sit on each side. Soraya says it does not, because 3 particles become 2. Who is correct?", "options": ["Rhea", "Soraya", "both of them", "neither of them"], "key": 0, "why": "The law is about atoms, not particles: no atom is made or lost.<br>Hydrogen 4 and 4, oxygen 2 and 2: every count matches.<br>The number of particles may change, so Rhea is correct and Soraya is not."}, {"d": "hard", "atom": "MAT-072", "stem": "A pumpkin vine gains 40 kg over a summer, and only water was added to its pot. Tadeo says: \"Only water was added, so all the new mass came from the water.\" Which statement is correct?", "options": ["Tadeo is correct: only water was added to the pot, so only water could have added mass.", "Carbon dioxide from the air added mass too: the plant builds glucose from both.", "The new mass came from the soil in the pot.", "The new mass came from sunlight, which became matter."], "key": 1, "why": "Plants build glucose from carbon dioxide and water.<br>The carbon dioxide came in from the air, not from anything Tadeo added.<br>So the new mass came from the air and the water, and Tadeo is not correct."}, {"d": "hard", "atom": "MAT-066", "stem": "Ronan says: \"Stirring honey into hot tea is a chemical reaction, because the honey disappears.\" Which statement is correct?", "options": ["Ronan is correct: a substance that disappears has reacted.", "Ronan is correct: the honey's atoms joined the water's atoms.", "Not correct: the honey melted into a thin liquid, which is a change of state, not a reaction.", "Not correct: the honey's molecules stay whole among the water molecules."], "key": 3, "why": "When honey dissolves, its molecules spread out among the water molecules.<br>Every honey molecule is still a honey molecule: no atom changed partners.<br>So dissolving is not a chemical reaction, and Ronan is not correct."}, {"d": "hard", "atom": "MAT-066", "stem": "Wet concrete mix hardens within a day, and it hardens even when it is kept under water. Bastian says: \"Hardening is a chemical reaction: the atoms in the water and in the cement join new partners, so a new substance forms.\" Which statement is correct?", "options": ["Bastian is correct: the atoms changed partners and a new, hard substance formed.", "Bastian is not correct: the concrete only dried out, like a puddle.", "Bastian is not correct: hardening is a change of state, liquid to solid, like water freezing.", "Bastian is correct, but only because hardened concrete can never be made soft again."], "key": 0, "why": "In a chemical reaction atoms let go of old partners and join new ones.<br>The mix hardens under water, so it did not dry out.<br>The atoms in the water and in the cement join new partners, and the hard concrete is a new substance.<br>So Bastian is correct; whether it can be undone is not the test."}, {"d": "hard", "atom": "MAT-066", "stem": "Overnight the water in a dog's outdoor bowl freezes solid. Cosima says: \"Freezing is a chemical reaction, because the water molecules join together to make the solid.\" Which statement is correct?", "options": ["Cosima is correct: the molecules joined, so they have new partners.", "Cosima is correct: ice is a new substance, because ice is hard and floats on water, and liquid water does neither of those.", "Cosima is not correct: nothing at all happens to the particles when water freezes.", "Cosima is not correct: each water molecule keeps its own atoms; the molecules only lock into fixed places."], "key": 3, "why": "Changing partners means an atom lets go of one atom and joins another.<br>In freezing, each water molecule is still one oxygen atom joined to two hydrogen atoms.<br>The molecules slow down and lock into fixed places, but no atom changed partners.<br>So freezing is not a chemical reaction, and Cosima is not correct."}, {"d": "hard", "atom": "MAT-067", "stem": "In a car's airbag, one solid splits in a flash into a metal and a gas that fills the bag: sodium azide → sodium + nitrogen. Umberto says: \"This cannot be a chemical reaction, because a reaction needs two substances to mix, and here only one goes in.\" Which statement is correct?", "options": ["Umberto is correct: a word equation always needs at least two reactants on the left of the arrow, or it is not a reaction at all.", "Umberto is correct: with one substance, nothing can change partners.", "Umberto is not correct: one reactant can split into products; its atoms let go of each other and join new partners.", "Umberto is not correct: the air in the car is the second reactant."], "key": 2, "why": "A chemical reaction is a change in which atoms let go of their old partners and join new ones.<br>Sodium azide's atoms let go of each other: the sodium atoms join other sodium atoms, and the nitrogen atoms pair up.<br>New substances form from one reactant, so it is a reaction, and Umberto is not correct."}, {"d": "hard", "atom": "MAT-067", "stem": "calcium + sulfur → calcium sulfide. Eleni says: \"Calcium is on both sides of the arrow, because the word calcium appears on the right too.\" Which statement is correct?", "options": ["Eleni is correct: the same substance sits on both sides of the arrow, so the arrow works like an equals sign and the line could be written with one.", "Eleni is correct: calcium sulfide is just calcium with some sulfur stuck to it.", "Eleni is not correct: the right side holds only sulfur.", "Eleni is not correct: calcium sulfide is a new substance; its name shows which atoms it holds, not that calcium is still there as itself."], "key": 3, "why": "The products are new substances, so the same substance never sits on both sides.<br>Calcium sulfide is calcium atoms joined to sulfur atoms: a new substance with its own properties.<br>Its name tells you which atoms it holds.<br>The metal calcium itself is only on the left, so Eleni is not correct."}, {"d": "hard", "atom": "MAT-068", "stem": "A shiny copper strip sits in a lidded jar of air, and the jar is heated through the glass. The strip turns black and gains mass, while the jar's reading does not change. What happened to the mass of the air inside the jar?", "options": ["It stayed the same: the air took no part in the reaction.", "It fell: oxygen atoms left the air and joined the copper.", "It rose: the heat made the air heavier.", "It became zero: the air was used up."], "key": 1, "why": "The black coat is copper oxide: copper atoms joined to oxygen atoms.<br>The jar is lidded, so the oxygen atoms came from the air inside it.<br>Those atoms left the air and joined the strip, taking their mass with them.<br>The strip gained what the air lost, so the jar's total did not change."}, {"d": "hard", "atom": "MAT-069", "stem": "A hand warmer's iron powder rusts and warms when air reaches it. One is left in a lidded jar of air: the warmer ends up 0.2 g heavier, yet the jar still reads 260.0 g. Fionn says: \"The jar reads the same because the oxygen that joined the iron was already inside the jar.\" Which statement is correct?", "options": ["Fionn is correct: the oxygen that joined the iron was already on the balance, inside the jar.", "Fionn is not correct: the warmer gained mass, so the jar must have gained 0.2 g too.", "Fionn is not correct: the jar should read less, because the warmth carried mass away.", "Fionn is not correct: the balance is faulty, because a part cannot gain while the whole stays the same."], "key": 0, "why": "The jar is lidded, so no atom came in and none left.<br>The oxygen atoms that joined the iron came from the air inside the jar.<br>The warmer gained 0.2 g and the air inside lost 0.2 g, so the total is unchanged.<br>Warmth is not made of atoms, so it carries no mass away. Fionn is correct."}, {"d": "hard", "atom": "MAT-069", "stem": "Yeast, sugar and warm water are sealed in a plastic bottle. Bubbles form, and the bottle goes hard as gas builds up inside. Giulia says: \"The hard bottle presses down harder, so the balance will read more than before.\" Which statement is correct?", "options": ["Giulia is correct: a gas squeezed under pressure weighs more than the same gas spread out loosely, so the total goes up.", "Giulia is correct: the bottle is bigger and firmer, so it has more mass.", "Giulia is not correct: the gas only pushes on the bottle's inside; the same atoms are inside as before, so the reading is the same.", "Giulia is not correct: the reading falls, because the gas is lighter than the sugar it was made from and floats up inside the bottle."], "key": 2, "why": "The bottle is sealed, so every atom is still inside.<br>The gas is made of atoms that were in the sugar before, and each keeps its mass.<br>The gas's push acts on the bottle's inside walls; the balance feels only the total mass.<br>So the reading is the same, and Giulia is not correct."}, {"d": "hard", "atom": "MAT-069b", "stem": "Hamid heats 25.1 g of zinc carbonate in an open dish: zinc carbonate → zinc oxide + carbon dioxide. Afterwards the dish holds 16.3 g of zinc oxide. Hamid says: \"The law of conservation of mass must be wrong: my products have less mass than my reactant.\" Which statement is correct?", "options": ["Hamid is correct: the law holds only for reactions in liquids.", "Hamid is correct: 8.8 g of matter was destroyed by the heat.", "Hamid is not correct: the law is about atoms, not mass, so masses are allowed to change as long as the atoms match.", "Hamid is not correct: the law counts the carbon dioxide too, and 8.8 g of it floated out of the open dish."], "key": 3, "why": "The products are zinc oxide and carbon dioxide.<br>25.1 − 16.3 = 8.8 g: the mass of the carbon dioxide made.<br>Carbon dioxide is a gas, and the dish is open, so it floated away with its mass.<br>In a lidded jar the dish would still read 25.1 g. The law holds, and Hamid is not correct."}, {"d": "hard", "atom": "MAT-069b", "stem": "Silver oxide is heated in an open dish on a zeroed balance: silver oxide → silver + oxygen. The reading falls from 23.2 g to 21.6 g. If the same 23.2 g were heated in a lidded jar on a zeroed balance, what would the jar read afterwards?", "options": ["1.6 g", "21.6 g", "23.2 g", "24.8 g"], "key": 2, "why": "In the open dish the 1.6 g that left was oxygen gas: 23.2 − 21.6 = 1.6.<br>A lid keeps the oxygen in the jar.<br>Every atom is then still on the balance, and each keeps its mass.<br>So the jar reads the reactant's mass, 23.2 g."}, {"d": "hard", "atom": "MAT-070", "stem"
