"The atoms in a new substance come from…", "model": "The atoms in a new substance come from the substances that were there before.<br>The zinc atoms joined with oxygen atoms from the air.<br>The white powder is zinc atoms joined to oxygen atoms.<br>Each oxygen atom has its own mass.<br>So the extra mass is the mass of the oxygen atoms that joined on.", "points": ["the atoms in the new substance came from the substances that were there before", "oxygen atoms from the air joined onto the zinc atoms", "each oxygen atom has its own mass, so the extra mass is the oxygen atoms that joined on"]}, {"type": "text", "tag": "what", "fig": "l1_count", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. How many large open circles does the after box hold?", "accept": ["4", "four", "4 circles", "4 large open circles"], "why": "Count the large open circles in the before box: two pairs, 4 circles.<br>Every atom that was there before is still there after.<br>Count the after box: 4 large open circles, now joined to gray circles."}, {"type": "mcq", "tag": "what", "fig": "l1_from", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Where did the small dark circles in the after box come from?", "options": ["the change made them", "from outside the boxes, in the air", "from the before box"], "key": 2, "fb": ["No atom is made from nothing; count the small dark circles in the before box and you find the same four.", "Nothing came in from outside the boxes; the before box already holds four small dark circles.", "The before box holds two pairs of small dark circles, four atoms; the after box holds the same four, joined to new partners."], "why": "Count the small dark circles in the before box: two pairs, 4 atoms.<br>The atoms in the new particles come from the particles that were there before.<br>So the 4 small dark circles in the after box were in the before box already."}, {"type": "mcq", "tag": "fluency", "stem": "Iron oxide forms on a damp iron railing. Which of these supplied the oxygen atoms in the iron oxide?", "options": ["the iron itself", "the air around the railing", "nothing: the change made them"], "key": 1, "fb": ["Iron atoms stay iron atoms; they cannot turn into oxygen atoms.", "The air holds oxygen, and its oxygen atoms joined onto the iron atoms.", "No atom is made from nothing; the oxygen atoms were in the air already."], "why": "The air around the railing holds oxygen.<br>Oxygen atoms from the air joined onto the iron atoms.<br>So the air supplied the oxygen atoms in the iron oxide."}, {"type": "mcq", "tag": "misconception", "stem": "Cormac says: \"When steel wool rusts, the change makes new oxygen atoms inside the rust.\" Is Cormac correct?", "options": ["yes", "no"], "key": 1, "fb": ["Cormac's claim needs atoms made from nothing. No atom is made from nothing: the oxygen atoms were in the air already, and the change joined them onto the iron.", "The oxygen atoms were in the air before the change; the change only joined them onto the iron atoms."], "why": "The atoms in a new substance come from the substances that were there before.<br>The oxygen atoms in the rust were in the air before the change.<br>The change joined them onto the iron atoms, so Cormac is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "A copper roof turns green over many years. The green layer is a new substance: copper atoms joined to other kinds of atom. Where did those other atoms come from?", "options": ["from the air around the roof", "from nowhere: the change made them", "the copper atoms turned into them"], "key": 0, "fb": ["The atoms in a new substance come from the substances that were there before: here, the air around the roof.", "No atom is made from nothing; the other atoms were in the air already.", "A copper atom stays a copper atom; the other atoms came from the air."], "why": "The atoms in a new substance come from the substances that were there before.<br>The roof touched only the air.<br>So the other atoms in the green layer came from the air."}, {"type": "mcq", "tag": "transfer", "stem": "A magnesium ribbon burns in air with a bright white flame and leaves a white ash. The ash has more mass than the ribbon. What is the extra mass?", "options": ["heat from the flame that soaked into the ribbon", "oxygen atoms that joined onto the magnesium", "magnesium atoms that grew bigger in the flame"], "key": 1, "fb": ["Heat is not matter and has no mass; the extra mass is atoms that joined on.", "Oxygen atoms from the air joined onto the magnesium atoms, and each oxygen atom has its own mass.", "An atom does not grow; the extra mass is oxygen atoms from the air that joined on."], "why": "The white ash is magnesium atoms joined to oxygen atoms.<br>The oxygen atoms came from the air and joined on.<br>Each oxygen atom has its own mass, so the ash has more mass than the ribbon."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video's balance climbed from 10.0 g to 11.2 g. What did it say the extra mass was?", "options": ["iron atoms that grew bigger", "oxygen atoms that joined on", "water soaked into the pad"], "key": 1, "fb": ["An atom does not grow; the video showed oxygen atoms from the air landing on the iron and joining on.", "The video showed oxygen atoms from the air landing on the iron atoms and joining on, and the reading climbed with each one.", "The video said nothing soaked in; it showed oxygen atoms joining the iron atoms."], "why": "Oxygen atoms from the air joined onto the iron atoms.<br>Each oxygen atom has its own mass.<br>So the extra 1.2 g is the mass of the oxygen atoms that joined on."}]}, {"id": "L02", "atom": "MAT-066", "title": "A chemical reaction rearranges atoms", "video": "definitely a video", "lesson_type": "Categorical lesson with an example sequence (reaction / not, judged from before-and-after drawings): in a chemical reaction the atoms let go of their old partners and join new ones, so new substances form; melting and dissolving keep the same particles; coins chemical reaction", "check_design": "Type (a) fluency quiz on drawn pairs → three recall MCQs (L01: where a new substance's atoms come from; Topic 7: atoms joined make a molecule; Topic 11: melting keeps the same particles), eight two-option items on fresh before-and-after drawings under one fixed question (Did the atoms change partners?), keys y n n y y n n y, then two student claims (Eitan: charcoal burning is a reaction because the carbon atoms join new partners, key yes; Delphine: boiling water is a reaction because bubbles form, key no) — the whole two-option run reads y n n y y n n y y n, no four alternating; the first item is the case type shown last (a reaction). 13 items.", "headache": ["Here are three changes, each drawn before and after.", "In the first, ice melts into liquid water.", "In the second, sugar dissolves in water.", "In the third, hydrogen gas burns in oxygen.", "Only one of the three makes a new substance.", "Which one is it, and how can the drawings tell you?"], "forest": ["How do you tell a chemical reaction from any other change?", "Look at the atoms before and after.", "In a chemical reaction the atoms let go of their old partners and join new ones.", "So new substances form.", "A change in which atoms rearrange into new substances is called a chemical reaction.", "Melting and dissolving move the particles around.", "The particles stay the same particles, so melting and dissolving are not chemical reactions."], "article": [{"t": "idea", "text": "Here are three changes, each drawn before and after."}, {"t": "fig", "key": "three_pairs_headache", "cap": "The three changes, each drawn before and after: ice melting, sugar dissolving, and hydrogen burning in oxygen. Each size and shade of circle is a different kind of atom, and touching circles are joined."}, {"t": "idea", "text": "In the first, ice melts into liquid water."}, {"t": "idea", "text": "In the second, sugar dissolves in water."}, {"t": "idea", "text": "In the third, hydrogen gas burns in oxygen."}, {"t": "idea", "text": "Only one of the three makes a new substance."}, {"t": "idea", "text": "Which one is it, and how can the drawings tell you?"}, {"t": "h", "text": "Three facts to hold"}, {"t": "idea", "text": "The atoms in a new substance come from the substances that were there before."}, {"t": "idea", "text": "Two or more atoms joined together make one particle called a molecule."}, {"t": "idea", "text": "When ice melts or sugar dissolves, the particles are the same particles, arranged or moving differently."}, {"t": "h", "text": "Hydrogen burns: did the atoms change partners?"}, {"t": "idea", "text": "Before, each hydrogen atom is joined to another hydrogen atom, and each oxygen atom to another oxygen atom."}, {"t": "idea", "text": "The atoms let go of their old partners."}, {"t": "idea", "text": "Each oxygen atom joins two hydrogen atoms: a water molecule."}, {"t": "idea", "text": "New groupings of atoms are new substances, so water is a new substance."}, {"t": "fig", "key": "hydrogen_pair", "cap": "Before: four pairs of hydrogen atoms (small dark) and two pairs of oxygen atoms (large open). After: four water molecules, each one oxygen atom joined to two hydrogen atoms. The same 8 hydrogen atoms and 4 oxygen atoms; new partners. Yes: the atoms changed partners."}, {"t": "h", "text": "Ice melts: did the atoms change partners?"}, {"t": "idea", "text": "Before, each water molecule is one oxygen atom joined to two hydrogen atoms."}, {"t": "idea", "text": "After melting, each water molecule is still one oxygen atom joined to two hydrogen atoms."}, {"t": "idea", "text": "The molecules moved."}, {"t": "idea", "text": "No atom changed partners."}, {"t": "idea", "text": "So no new substance formed."}, {"t": "fig", "key": "ice_pair", "cap": "Ice, then liquid water: the same five water molecules, each still one oxygen atom joined to two hydrogen atoms, in new places. The drawing shows which atoms are joined, not the state. No: no atom changed partners."}, {"t": "h", "text": "Charcoal burns: did the atoms change partners?"}, {"t": "idea", "text": "Charcoal is carbon."}, {"t": "idea", "text": "The air holds pairs of oxygen atoms."}, {"t": "idea", "text": "Each carbon atom joins two oxygen atoms: a carbon dioxide molecule, a new substance."}, {"t": "fig", "key": "charcoal_pair", "cap": "Before: three carbon atoms (gray) and three pairs of oxygen atoms. After: three carbon dioxide molecules, each one carbon atom joined between two oxygen atoms. The same 3 carbon atoms and 6 oxygen atoms; new partners. Yes: the atoms changed partners."}, {"t": "h", "text": "Sugar dissolves: did the atoms change partners?"}, {"t": "idea", "text": "The sugar molecules spread out among the water molecules."}, {"t": "idea", "text": "Every sugar molecule is still a sugar molecule, and every water molecule is still water."}, {"t": "idea", "text": "No atom changed partners, so no new substance formed."}, {"t": "fig", "key": "sugar_pair", "cap": "Sugar in water, before and after dissolving, drawn simply: the same two sugar molecules and four water molecules in new places. No: no atom changed partners."}, {"t": "h", "text": "Methane burns: did the atoms change partners?"}, {"t": "idea", "text": "Methane, the main gas in natural gas, is one carbon atom joined to four hydrogen atoms."}, {"t": "idea", "text": "The atoms let go of their partners and regroup: carbon dioxide and water, two new substances."}, {"t": "fig", "key": "methane_pair", "cap": "Before: one methane molecule and two pairs of oxygen atoms. After: one carbon dioxide molecule and two water molecules. The same 1 carbon atom, 4 hydrogen atoms and 4 oxygen atoms; new partners. Yes: the atoms changed partners."}, {"t": "h", "text": "The name for this"}, {"t": "idea", "text": "In three of the five changes, the atoms let go of their old partners and joined new ones."}, {"t": "idea", "text": "A change in which atoms rearrange into new substances is called a <b>chemical reaction<\/b>."}, {"t": "idea", "text": "A chemical reaction is what happens inside every chemical change: the atoms rearrange."}, {"t": "fig", "key": "reaction_or_not_table", "cap": "The five changes in one table: what the atoms are doing after, and whether each change is a chemical reaction."}, {"t": "h", "text": "The three reactions in one line each"}, {"t": "idea", "text": "Chemists write each reaction on one line, and the arrow reads “makes”."}, {"t": "fig", "key": "two_words_l02", "cap": "The three reactions in one line each: hydrogen + oxygen → water; carbon + oxygen → carbon dioxide; methane + oxygen → carbon dioxide + water."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a chemical reaction the atoms let go of their old partners and join new ones. So new substances form. Melting and dissolving move the particles around without changing them. So they are not chemical reactions. To tell them apart, look at the atoms before and after: did they change partners?"}, {"t": "idea", "text": "Back to the three drawings: only the third shows atoms changing partners."}, {"t": "idea", "text": "So hydrogen burning is the chemical reaction, and melting and dissolving are not."}], "script": [{"say": "Here are three changes drawn before and after: ice melting, sugar dissolving, and hydrogen burning in oxygen.", "screen": "[three before-and-after pairs in a row]"}, {"say": "Only one makes a new substance: which one?", "screen": "[question mark over the three pairs]"}, {"say": "The atoms in a new substance come from the substances that were there before.", "screen": "[chip: SAME ATOMS]"}, {"say": "Watch hydrogen burn: each pair of hydrogen atoms lets go, and each pair of oxygen atoms lets go.", "screen": "[the pairs separate in the before box]"}, {"say": "Now each oxygen atom joins two hydrogen atoms: a water molecule, a new substance.", "screen": "[the atoms regroup into four water molecules; label: water]"}, {"say": "Count the circles: the same 8 hydrogen and 4 oxygen atoms before and after.", "screen": "[counts appear under both boxes]"}, {"say": "Now watch ice melt: the water molecules move, but every atom keeps its partners.", "screen": "[the same five molecules drift; no atom lets go; cross]"}, {"say": "A change in which atoms rearrange into new substances is called a chemical reaction.", "screen": "[chip: CHEMICAL REACTION over the hydrogen pair]"}, {"say": "Now consider charcoal burning: each carbon atom joins two oxygen atoms, a chemical reaction.", "screen": "[carbon and oxygen pairs regroup into carbon dioxide; tick]"}, {"say": "And sugar dissolving: the sugar molecules spread among the water molecules, still whole: not a reaction.", "screen": "[sugar molecules drift apart among water molecules; cross]"}, {"say": "Each reaction goes on one line: hydrogen plus oxygen makes water.", "screen": "[strip: hydrogen + oxygen → water]"}, {"say": "So here is the rule: in a chemical reaction the atoms let go of their old partners and join new ones.", "screen": "[rule slide reuses the hydrogen pair; rule text]"}, {"say": "Back to the three drawings: only hydrogen burning shows atoms changing partners.", "screen": "[the third pair comes forward; tick]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Where do the atoms in a new substance come from?", "options": ["the change makes them from nothing as it happens", "from the heat that the change gives off", "from the substances that were there before"], "key": 2, "fb": ["No atom is made from nothing.", "Heat is not made of atoms; the atoms were there before the change.", "The atoms in a new substance come from the substances that were there before."], "why": "No atom is made from nothing.<br>No atom vanishes.<br>So the atoms in a new substance come from the substances that were there before."}, {"type": "mcq", "tag": "recall", "stem": "Two or more atoms joined together make one particle. What is that particle called?", "options": ["an element", "a molecule", "a mixture"], "key": 1, "fb": ["An element is a substance made of one kind of atom; the particle of joined atoms is a molecule.", "Two or more atoms joined together make one particle called a molecule.", "A mixture is substances mingled, not joined; the particle of joined atoms is a molecule."], "why": "Two or more atoms joined together make one particle.<br>That particle is called a molecule."}, {"type": "mcq", "tag": "recall", "stem": "A popsicle melts into a puddle. Are the particles in the puddle the same particles that were in the popsicle?", "options": ["yes", "no"], "key": 0, "fb": ["Melting changes the state, not the particles: the same particles, moving more freely.", "No new particles form when a popsicle melts; the same particles are there, moving more freely."], "why": "Melting changes the state of a substance.<br>The particles are the same particles, arranged or moving differently.<br>So the puddle holds the same particles as the popsicle."}, {"type": "mcq", "tag": "fluency", "fig": "r_f1", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 0, "fb": ["Before, the small dark circles were in pairs and the gray circles stood alone; after, each gray circle is joined to two small dark circles: new partners, a chemical reaction.", "Look at the pairs: before, the small dark circles were paired with each other; after, each is joined to a gray circle. The partners changed."], "why": "Before: two pairs of small dark circles and two single gray circles.<br>After: each gray circle is joined to two small dark circles.<br>The atoms changed partners, so this is a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f2", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 1, "fb": ["Look at each group: after, it is still one large open circle joined to two small dark circles, the same as before. Moving is not changing partners.", "Every group after is still one large open circle joined to two small dark circles, the same as before; the groups only moved."], "why": "Before: four groups, each one large open circle joined to two small dark circles.<br>After: the same four groups, in new places.<br>No atom changed partners, so this is not a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f3", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 1, "fb": ["Look at each group: the three-atom groups and the pairs of small dark circles are the same after as before. Moving is not changing partners.", "The three-atom groups and the pairs of small dark circles are the same after as before; they only moved."], "why": "Before: three groups of a gray circle between two large open circles, and two pairs of small dark circles.<br>After: the same groups and pairs, in new places.<br>No atom changed partners, so this is not a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f4", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 0, "fb": ["Before, gray circles were joined to gray and small dark to small dark; after, each gray circle is joined to a small dark circle: new partners.", "Before, like was joined to like; after, each gray circle is joined to a small dark circle. The partners changed."], "why": "Before: pairs of gray circles and pairs of small dark circles.<br>After: each gray circle is joined to a small dark circle.<br>The atoms changed partners, so this is a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f5", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 0, "fb": ["Before, the gray circles stood alone and the large open circles came in pairs; after, each gray circle is joined to a large open circle.", "Before, the gray circles stood alone; after, each is joined to a large open circle that left its pair. The partners changed."], "why": "Before: four single gray circles and two pairs of large open circles.<br>After: each gray circle is joined to one large open circle.<br>The atoms changed partners, so this is a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f6", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 1, "fb": ["Look at each pair: after, it is still a pair of small dark circles, the same as before. Moving is not changing partners.", "Every pair after is still a pair of small dark circles, the same as before; the pairs only moved."], "why": "Before: five pairs of small dark circles.<br>After: the same five pairs, in new places.<br>No atom changed partners, so this is not a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f7", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 1, "fb": ["Look at each group: the three-kind groups and the single large open circles are the same after as before. Moving is not changing partners.", "The three-kind groups and the single large open circles are the same after as before; they only moved."], "why": "Before: three groups of three kinds joined, and three single large open circles.<br>After: the same groups and singles, in new places.<br>No atom changed partners, so this is not a chemical reaction."}, {"type": "mcq", "tag": "fluency", "fig": "r_f8", "stem": "Each size and shade of circle is a different kind of atom, and touching circles are joined. The two boxes show the atoms before and after a change. Did the atoms change partners?", "options": ["yes", "no"], "key": 0, "fb": ["Before, each large open circle was joined to two small dark circles; after, it is joined to a gray circle, and the small dark circles pair up: new partners.", "Before, each large open circle was joined to two small dark circles; after, it is joined to a gray circle. The partners changed."], "why": "Before: two groups of a large open circle joined to two small dark circles, and two single gray circles.<br>After: each large open circle is joined to a gray circle, and the small dark circles are in pairs.<br>The atoms changed partners, so this is a chemical reaction."}, {"type": "mcq", "tag": "misconception", "stem": "Eitan says: \"Charcoal burning is a chemical reaction, because the carbon atoms join new partners.\" Is Eitan correct?", "options": ["yes", "no"], "key": 0, "fb": ["Each carbon atom lets go of the charcoal and joins two oxygen atoms from the air: new partners, a new substance, a chemical reaction.", "Eitan's reason is the test itself: the carbon atoms join new partners, oxygen atoms, and carbon dioxide is a new substance, so this is a chemical reaction."], "why": "When charcoal burns, each carbon atom joins two oxygen atoms from the air.<br>The atoms changed partners, and carbon dioxide is a new substance.<br>So charcoal burning is a chemical reaction, and Eitan is correct."}, {"type": "mcq", "tag": "misconception", "stem": "Delphine says: \"Boiling water is a chemical reaction, because bubbles form.\" Is Delphine correct?", "options": ["yes", "no"], "key": 1, "fb": ["Bubbles are not the test. The bubbles are water molecules spread out into a gas; each is still one oxygen atom joined to two hydrogen atoms: no partner changed.", "The bubbles are water molecules that spread out into a gas; every molecule keeps its atoms, so no atom changed partners and boiling is not a chemical reaction."], "why": "The bubbles in boiling water are water molecules that have spread out into a gas.<br>Each water molecule is still one oxygen atom joined to two hydrogen atoms.<br>No atom changed partners, so boiling is not a chemical reaction, and Delphine is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, which change showed atoms changing partners?", "options": ["ice melting", "sugar dissolving", "hydrogen burning"], "key": 2, "fb": ["When the ice melted, every water molecule kept its atoms; they only moved.", "When the sugar dissolved, every sugar molecule stayed whole among the water molecules.", "When hydrogen burned, the pairs let go and each oxygen atom joined two hydrogen atoms: water."], "why": "In hydrogen burning, the hydrogen pairs and the oxygen pairs let go.<br>Each oxygen atom joined two hydrogen atoms, making water.<br>So hydrogen burning showed atoms changing partners: a chemical reaction."}]}, {"id": "L03", "atom": "MAT-067", "title": "Reactants and products: the word equation", "video": "could do without a video", "lesson_type": "Procedural lesson (a one-step format routine): the substances that go in are written on the left and called reactants, the substances that come out on the right and called products, the arrow between reads “react to make”; coins reactant, product, word equation", "check_design": "Type (a) fluency quiz → one recall MCQ (L02: what a chemical reaction does to atoms), six two-option fluency items on fresh word equations, every option ONE substance and every ask singular (which of these is a reactant? which of these is the product?) so grammar cannot pick the option, keys A B B A A B (no four alternate), one reverse item (a described reaction to its word equation, MCQ), one student claim (Wynn: the arrow means equals, so the same substances sit on both sides; key no), then the three coined terms typed LAST (Topic 1's order: the run's stems print the terms, so the production items sit at the end — adjudication 2026-09-25). 12 items.", "headache": ["Methane, the main gas in natural gas, burns on a kitchen stove.", "Two substances go in: methane and oxygen from the air.", "Two substances come out: carbon dioxide and water vapor.", "A chemist writes all of this on one line with an arrow in the middle.", "Which substances belong on the left, and which on the right?"], "forest": ["How do you write down a chemical reaction in one line?", "Write the substances that go in on the left: these are called the reactants.", "Write the substances that come out on the right: these are called the products.", "An arrow sits between them, and the arrow reads “react to make”.", "This line is called a word equation."], "article": [{"t": "idea", "text": "Methane, the main gas in natural gas, burns on a kitchen stove."}, {"t": "idea", "text": "Two substances go in: methane and oxygen from the air."}, {"t": "idea", "text": "Two substances come out: carbon dioxide and water vapor."}, {"t": "idea", "text": "A chemist writes all of this on one line with an arrow in the middle."}, {"t": "idea", "text": "Which substances belong on the left, and which on the right?"}, {"t": "h", "text": "What a chemical reaction is"}, {"t": "idea", "text": "In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form."}, {"t": "idea", "text": "Methane burning is a chemical reaction: carbon dioxide and water are new substances."}, {"t": "h", "text": "What goes in"}, {"t": "idea", "text": "Methane and oxygen are the substances that go into the reaction."}, {"t": "idea", "text": "The chemist writes them on the left of the line."}, {"t": "idea", "text": "The substances that go into a reaction are called the <b>reactants<\/b>."}, {"t": "h", "text": "What comes out"}, {"t": "idea", "text": "Carbon dioxide and water are the substances that come out of the reaction."}, {"t": "idea", "text": "The chemist writes them on the right of the line."}, {"t": "idea", "text": "The substances that come out of a reaction are called the <b>products<\/b>."}, {"t": "h", "text": "The arrow and the line"}, {"t": "idea", "text": "An arrow sits between the reactants and the products."}, {"t": "idea", "text": "The arrow reads “react to make”."}, {"t": "idea", "text": "A plus sign between two substances on one side reads “and”."}, {"t": "idea", "text": "This line, written in words, is called a <b>word equation<\/b>."}, {"t": "fig", "key": "methane_labeled", "cap": "The word equation for methane burning: methane + oxygen → carbon dioxide + water. The reactants stand on the left, the products on the right, and the arrow reads “react to make”."}, {"t": "idea", "text": "Read it aloud: methane and oxygen react to make carbon dioxide and water."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "In iron rusting, iron and oxygen are the reactants, and iron oxide is the product."}, {"t": "idea", "text": "In hydrogen burning, hydrogen and oxygen are the reactants, and water is the product."}, {"t": "idea", "text": "In charcoal burning, carbon and oxygen are the reactants, and carbon dioxide is the product."}, {"t": "fig", "key": "two_sides_table", "cap": "Four reactions in one table: the reactants, the substances that go in, and the products, the substances that come out."}, {"t": "h", "text": "The arrow is not an equals sign"}, {"t": "idea", "text": "The arrow reads “react to make”, not “equals”."}, {"t": "idea", "text": "The products are new substances, so the same substances never sit on both sides."}, {"t": "fig", "key": "arrow_not_equals", "cap": "A tick for the word equation with an arrow, a cross for a line with an equals sign and the same substances on both sides: the arrow means “react to make”."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A word equation has three parts. <b>Left:<\/b> the reactants, the substances that go in. <b>Middle:<\/b> an arrow that reads “react to make”. <b>Right:<\/b> the products, the substances that come out."}, {"t": "idea", "text": "Back to the stove: methane and oxygen belong on the left, as the reactants."}, {"t": "idea", "text": "Carbon dioxide and water belong on the right, as the products."}], "script": [{"say": "Methane, the main gas in natural gas, burns on a kitchen stove.", "screen": "[a stove flame]"}, {"say": "Methane and oxygen go in; carbon dioxide and water come out.", "screen": "[two boxes flow into the flame; two flow out]"}, {"say": "A chemist writes this on one line with an arrow: which substances go left, which right?", "screen": "[an empty strip with an arrow; question mark]"}, {"say": "In a chemical reaction the atoms join new partners, so new substances form.", "screen": "[chip: CHEMICAL REACTION]"}, {"say": "Methane and oxygen go into the reaction, so they go on the left.", "screen": "[methane + oxygen slide onto the left of the strip]"}, {"say": "The substances that go into a reaction are called the reactants.", "screen": "[chip: REACTANTS over the left half]"}, {"say": "Carbon dioxide and water come out, so they go on the right.", "screen": "[carbon dioxide + water slide onto the right]"}, {"say": "The substances that come out of a reaction are called the products.", "screen": "[chip: PRODUCTS over the right half]"}, {"say": "The arrow reads “react to make”.", "screen": "[the arrow glows; label: react to make]"}, {"say": "A plus sign reads “and”.", "screen": "[the plus signs glow; label: and]"}, {"say": "This line, written in words, is called a word equation.", "screen": "[chip: WORD EQUATION under the strip]"}, {"say": "Read it aloud: methane and oxygen react to make carbon dioxide and water.", "screen": "[each word lights as it is spoken]"}, {"say": "Now consider iron rusting: iron and oxygen are the reactants, iron oxide the product.", "screen": "[strip: iron + oxygen → iron oxide; labels]"}, {"say": "The arrow is not an equals sign: the products are new substances.", "screen": "[a crossed-out line with an equals sign]"}, {"say": "The rule: reactants on the left, an arrow that reads react to make, products on the right.", "screen": "[rule slide reuses the methane strip; rule text]"}, {"say": "Back to the stove: methane and oxygen left, carbon dioxide and water right.", "screen": "[the finished strip over the flame]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In a chemical reaction, what do the atoms do?", "options": ["they let go of old partners and join new ones", "they move to new places and keep their partners", "they vanish and new atoms appear"], "key": 0, "fb": ["In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form.", "Keeping the same partners is melting or dissolving, not a chemical reaction.", "No atom vanishes and none is made from nothing; the atoms change partners."], "why": "In a chemical reaction the atoms let go of their old partners.<br>They join new partners.<br>So new substances form."}, {"type": "mcq", "tag": "fluency", "stem": "zinc + sulfur → zinc sulfide. Which of these is a reactant?", "options": ["sulfur", "zinc sulfide"], "key": 0, "fb": ["Sulfur is on the left of the arrow: it goes in, so it is a reactant.", "Zinc sulfide is on the right of the arrow, so it comes out: it is the product."], "why": "The reactants are written on the left of the arrow.<br>Sulfur is on the left.<br>So sulfur is a reactant."}, {"type": "mcq", "tag": "fluency", "stem": "sodium + chlorine → sodium chloride. Which of these is the product?", "options": ["sodium", "sodium chloride"], "key": 1, "fb": ["Sodium is on the left of the arrow, so it goes in: it is a reactant.", "Sodium chloride is on the right of the arrow: it comes out, so it is the product."], "why": "The products are written on the right of the arrow.<br>Sodium chloride is on the right.<br>So sodium chloride is the product."}, {"type": "mcq", "tag": "fluency", "stem": "copper + oxygen → copper oxide. Which of these is the product?", "options": ["oxygen", "copper oxide"], "key": 1, "fb": ["Oxygen is on the left of the arrow, so it goes in: it is a reactant.", "Copper oxide is on the right of the arrow: it comes out, so it is the product."], "why": "The products are written on the right of the arrow.<br>Copper oxide is on the right.<br>So copper oxide is the product."}, {"type": "mcq", "tag": "fluency", "stem": "magnesium + oxygen → magnesium oxide. Which of these is a reactant?", "options": ["magnesium", "magnesium oxide"], "key": 0, "fb": ["Magnesium is on the left of the arrow: it goes in, so it is a reactant.", "Magnesium oxide is on the right of the arrow, so it comes out: it is the product."], "why": "The reactants are written on the left of the arrow.<br>Magnesium is on the left.<br>So magnesium is a reactant."}, {"type": "mcq", "tag": "fluency", "stem": "hydrogen + chlorine → hydrogen chloride. Which of these is a reactant?", "options": ["chlorine", "hydrogen chloride"], "key": 0, "fb": ["Chlorine is on the left of the arrow: it goes in, so it is a reactant.", "Hydrogen chloride is on the right of the arrow: it comes out, so it is the product."], "why": "The reactants are written on the left of the arrow.<br>Chlorine is on the left.<br>So chlorine is a reactant."}, {"type": "mcq", "tag": "fluency", "stem": "sulfur + oxygen → sulfur dioxide. Which of these is the product?", "options": ["sulfur", "sulfur dioxide"], "key": 1, "fb": ["Sulfur is on the left of the arrow: it goes in, so it is a reactant.", "Sulfur dioxide is on the right of the arrow: it comes out, so it is the product."], "why": "The products are written on the right of the arrow.<br>Sulfur dioxide is on the right.<br>So sulfur dioxide is the product."}, {"type": "mcq", "tag": "transfer", "stem": "Zinc and oxygen react and make zinc oxide. Which line writes this as a word equation?", "options": ["zinc + oxygen → zinc oxide", "zinc oxide → zinc + oxygen", "zinc + zinc oxide → oxygen"], "key": 0, "fb": ["Zinc and oxygen go in, on the left; zinc oxide comes out, on the right.", "This line puts what comes out on the left; the reactants, zinc and oxygen, belong on the left.", "Zinc oxide comes out of the reaction, so it belongs on the right, not among the reactants."], "why": "Zinc and oxygen go in, so they are the reactants and stand on the left.<br>Zinc oxide comes out, so it is the product and stands on the right.<br>The arrow between them reads “react to make”: zinc + oxygen → zinc oxide."}, {"type": "mcq", "tag": "misconception", "stem": "Wynn says: \"The arrow in a word equation means equals, so the same substances sit on both sides.\" Is Wynn correct?", "options": ["yes", "no"], "key": 1, "fb": ["The arrow is not an equals sign: it reads “react to make”, and the products are new substances, so the two sides name different substances.", "The arrow reads “react to make”; the products are new substances, so the two sides name different substances and Wynn is not correct."], "why": "The arrow in a word equation reads “react to make”.<br>The products are new substances, made from the reactants.<br>So different substances sit on the two sides, and Wynn is not correct."}, {"type": "text", "tag": "term", "stem": "In a reaction, the substances that go in, like the iron and the oxygen when iron rusts, are written on the left. What are these substances called?", "accept": ["reactants", "the reactants", "reactant", "a reactant"], "why": "The iron and the oxygen go into the reaction.<br>The substances that go into a reaction are called the reactants."}, {"type": "text", "tag": "term", "stem": "In a reaction, the substances that come out, like the iron oxide when iron rusts, are written on the right. What are these substances called?", "accept": ["products", "the products", "product", "a product"], "why": "The iron oxide comes out of the reaction.<br>The substances that come out of a reaction are called the products."}, {"type": "text", "tag": "term", "stem": "A chemist writes a reaction as one line of words with an arrow in the middle. What is a line like this called?", "accept": ["word equation", "a word equation", "the word equation", "an equation", "equation"], "why": "The line writes what goes in, an arrow, and what comes out, all in words.<br>A line like this is called a word equation."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video read the arrow in a word equation aloud. What does the arrow read?", "options": ["react to make", "is the same as", "and"], "key": 0, "fb": ["The arrow reads “react to make”: methane and oxygen react to make carbon dioxide and water.", "The arrow is not an equals sign; the products are new substances, not the same as the reactants.", "The plus sign reads “and”; the arrow reads “react to make”."], "why": "A word equation writes the reactants, an arrow, and the products.<br>The arrow reads “react to make”.<br>So methane and oxygen react to make carbon dioxide and water."}]}, {"id": "L04", "atom": "MAT-071", "title": "Which elements take part: read the symbols", "video": "could do without a video", "lesson_type": "Procedural lesson (a three-step routine): read each capital letter with any small letter after it as one symbol, look each symbol up on the periodic table, write each element once; no term coined", "check_design": "Type (b) scaffolded sequence → three recall MCQs (Topic 9: count the capitals; Topic 9: one box, one element; Topic 10: what a subscript counts), the worked case on the page (methane, then magnesium), four scaffold steps on a fresh second case (2Na + Cl₂ → 2NaCl: which symbols; Na is which element; Cl is which element; how many elements), three bare typed lists on third, fourth and fifth cases (Zn + S; 2Cu + O₂; 2K + 2H₂O), the CO / Co trap, and one true student claim (Gus: CO₂ names two elements; key yes). Every stem gives the FORMULA form only (no word equation beside it), so the look-up is needed; the why restores the word equation as its last line. Every look-up item carries a NAMED CROP of the periodic table (≤ 6 columns, names in the cells), never the whole table (adjudication 2026-09-25). 12 items.", "headache": ["A chemist writes methane burning with formulas: CH₄ + 2O₂ → CO₂ + 2H₂O.", "The letters are chemical symbols.", "Each symbol names one element.", "Which elements take part in this reaction?"], "forest": ["How do you find every element in a reaction?", "Read each capital letter, with any small letter after it, as one symbol.", "Look each symbol up on the periodic table.", "Write each element down once, however many times its symbol appears.", "Methane burning uses three elements: carbon, hydrogen and oxygen."], "article": [{"t": "idea", "text": "A chemist writes methane burning with formulas: CH₄ + 2O₂ → CO₂ + 2H₂O."}, {"t": "fig", "key": "methane_formula", "cap": "The same reaction twice: the word equation methane + oxygen → carbon dioxide + water, and under it the formula form CH₄ + 2O₂ → CO₂ + 2H₂O."}, {"t": "idea", "text": "The letters are chemical symbols."}, {"t": "idea", "text": "Each symbol names one element."}, {"t": "idea", "text": "Which elements take part in this reaction?"}, {"t": "h", "text": "Symbols and formulas"}, {"t": "idea", "text": "Every element has a chemical symbol of one or two letters: the first a capital, the second small."}, {"t": "idea", "text": "A chemical formula writes one particle of a substance, and each symbol names one element in the particle."}, {"t": "idea", "text": "The periodic table is a chart of every known element, one box per element."}, {"t": "h", "text": "Three steps"}, {"t": "idea", "text": "To find every element in a reaction, there are three steps to follow."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Read each capital letter, with any small letter after it, as one symbol."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Look each symbol up on the periodic table."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Write each element down once, however many times its symbol appears."}, {"t": "h", "text": "Read the methane equation"}, {"t": "idea", "text": "CH₄ holds two symbols: C and H."}, {"t": "idea", "text": "2O₂ holds one symbol: O."}, {"t": "idea", "text": "CO₂ holds C and O again, and 2H₂O holds H and O again."}, {"t": "idea", "text": "On the periodic table, C is carbon, H is hydrogen and O is oxygen."}, {"t": "idea", "text": "C, H and O each appear more than once, but each element is written once."}, {"t": "idea", "text": "So methane burning uses three elements: carbon, hydrogen and oxygen."}, {"t": "fig", "key": "methane_symbols", "cap": "The equation with every symbol underlined: C, H, O, C, O, H, O. Each element written once: C is carbon, H is hydrogen, O is oxygen. Three elements take part."}, {"t": "h", "text": "The numbers are not symbols"}, {"t": "idea", "text": "A full-size number in front, like the 2 in 2O₂, counts whole particles."}, {"t": "idea", "text": "A small low number, called a subscript, like the 4 in CH₄, counts atoms in one particle."}, {"t": "idea", "text": "Neither number names an element, so the numbers are skipped when you list the elements."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a magnesium ribbon burning in air: magnesium + oxygen → magnesium oxide."}, {"t": "idea", "text": "With formulas, a chemist writes 2Mg + O₂ → 2MgO."}, {"t": "idea", "text": "Mg is one symbol: a capital M with a small g after it."}, {"t": "idea", "text": "On the periodic table, Mg is magnesium and O is oxygen."}, {"t": "idea", "text": "So magnesium burning uses two elements: magnesium and oxygen."}, {"t": "fig", "key": "magnesium_formula", "cap": "Magnesium burning in words, magnesium + oxygen → magnesium oxide, and in formulas, 2Mg + O₂ → 2MgO: two symbols, Mg and O, so two elements."}, {"t": "fig", "key": "magnesium_symbols", "cap": "The magnesium equation with every symbol underlined: Mg, O, Mg, O. Each element written once: Mg is magnesium, O is oxygen. Two elements take part."}, {"t": "h", "text": "One capital letter, or two?"}, {"t": "idea", "text": "CO has two capital letters, so it is two symbols: carbon and oxygen."}, {"t": "idea", "text": "Co has one capital letter and a small o, so it is one symbol: cobalt, a metal."}, {"t": "fig", "key": "co_vs_co", "cap": "Co, one capital letter with a ring under it: one symbol, cobalt, one element. CO, two capital letters with a ring under each: two symbols, carbon and oxygen, two elements."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To find every element in a reaction: <b>1.<\/b> Read each capital letter, with any small letter after it, as one symbol. <b>2.<\/b> Look each symbol up on the periodic table. <b>3.<\/b> Write each element down once, however many times its symbol appears. The numbers count particles and atoms; they never name an element."}, {"t": "idea", "text": "Back to the stove: C, H and O are the symbols in CH₄ + 2O₂ → CO₂ + 2H₂O."}, {"t": "idea", "text": "So carbon, hydrogen and oxygen take part in methane burning."}], "script": [{"say": "A chemist writes methane burning with formulas: CH₄ plus 2O₂ react to make CO₂ plus 2H₂O.", "screen": "[the word equation strip; the formula form appears under it]"}, {"say": "Each letter group is a chemical symbol, and each symbol names one element: which elements take part?", "screen": "[the letters glow; question mark]"}, {"say": "To find every element in a reaction, there are three steps to follow.", "screen": "[1, 2, 3 as bold numbers]"}, {"say": "One: read each capital letter, with any small letter after it, as one symbol.", "screen": "[C, H, O, C, O, H, O underlined in turn]"}, {"say": "Two: look each symbol up on the periodic table: C is carbon, H is hydrogen, O is oxygen.", "screen": "[the periodic table; the three boxes ringed]"}, {"say": "Three: write each element down once, however many times its symbol appears.", "screen": "[the list: carbon, hydrogen, oxygen]"}, {"say": "So methane burning uses three elements: carbon, hydrogen and oxygen.", "screen": "[chip: 3 ELEMENTS]"}, {"say": "The numbers are not symbols: a number in front counts particles, and a small low number counts atoms.", "screen": "[the 2 and the 4 boxed; label: not elements]"}, {"say": "Now consider magnesium burning: 2Mg plus O₂ react to make 2MgO.", "screen": "[magnesium + oxygen → magnesium oxide; the formula form]"}, {"say": "Mg is one symbol, magnesium, and O is oxygen.", "screen": "[Mg underlined; O underlined]"}, {"say": "Watch out for one capital or two: CO is carbon and oxygen, but Co is one element, cobalt.", "screen": "[CO with two underlines; Co with one]"}, {"say": "The rule: read each symbol, look it up on the periodic table, and write each element once.", "screen": "[rule slide reuses the methane equation; rule text]"}, {"say": "Back to the stove: carbon, hydrogen and oxygen take part in methane burning.", "screen": "[the three names under the equation]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Count the capital letters in HBr. How many elements does HBr name?", "options": ["one element", "two elements"], "key": 1, "fb": ["HBr has two capital letters, H and B, so it names two elements: hydrogen and bromine.", "Every capital letter starts a new symbol. H and Br are two symbols: hydrogen and bromine."], "why": "Every capital letter starts a new chemical symbol.<br>HBr has two capital letters, the H and the B.<br>So HBr names two elements, hydrogen and bromine."}, {"type": "mcq", "tag": "recall", "stem": "On the periodic table, what does one box stand for?", "options": ["one element", "one atom", "one compound"], "key": 0, "fb": ["The periodic table is a chart of every known element, one box per element.", "A box stands for an element, not a single atom; every atom of that element belongs to the box.", "Compounds are not on the periodic table; each box is one element."], "why": "The periodic table is a chart of every known element.<br>Each element has one box.<br>So one box stands for one element."}, {"type": "mcq", "tag": "recall", "stem": "In the formula SO₂, what does the small 2 count?", "options": ["the elements in the particle", "sulfur atoms in one particle", "oxygen atoms in one particle"], "key": 2, "fb": ["A subscript counts atoms, not elements; the symbols name the elements.", "The 2 comes just after the O, not the S, so it counts oxygen atoms.", "A subscript counts the atoms of the element just before it: 2 oxygen atoms in one particle."], "why": "A subscript counts the atoms of the element just before it.<br>The 2 comes just after the O.<br>So the 2 counts 2 oxygen atoms in one particle."}, {"type": "mcq", "tag": "scaffold", "stem": "A soft, silvery metal burns in a yellow-green gas: 2Na + Cl₂ → 2NaCl. Read each capital letter with any small letter after it. Which symbols appear?", "options": ["N, a, C and l, as four symbols", "Na, Cl and the 2", "Na and Cl"], "key": 2, "fb": ["A small letter after a capital belongs to the same symbol: Na is one symbol and Cl is one symbol.", "The 2 is a number in front; it counts particles and is not a symbol.", "Two symbols: Na, a capital N with a small a; and Cl, a capital C with a small l."], "why": "A symbol is a capital letter with any small letter after it.<br>Na is one symbol and Cl is one symbol.<br>The 2 counts particles, so the symbols are Na and Cl."}, {"type": "text", "tag": "scaffold", "fig": "pt_na", "stem": "Part of the periodic table is supplied. Look up Na. Which element is Na?", "accept": ["sodium"], "why": "Find the box marked Na on the periodic table.<br>The box is sodium, atomic number 11.<br>So Na is sodium."}, {"type": "text", "tag": "scaffold", "fig": "pt_cl", "stem": "Part of the periodic table is supplied. Look up Cl. Which element is Cl?", "accept": ["chlorine"], "why": "Find the box marked Cl on the periodic table.<br>The box is chlorine, atomic number 17.<br>So Cl is chlorine."}, {"type": "text", "tag": "scaffold", "stem": "Na and Cl each appear twice in 2Na + Cl₂ → 2NaCl. Write each element once. How many elements take part?", "accept": ["2", "two", "2 elements"], "why": "Na is sodium, and Cl is chlorine.<br>Each element is written once, however many times its symbol appears.<br>So two elements take part: sodium and chlorine."}, {"type": "text", "tag": "bare", "fig": "pt_zn_s", "stem": "Part of the periodic table is supplied. Zn + S → ZnS. List every element that takes part.", "accept": ["zinc, sulfur", "zinc and sulfur", "zinc, and sulfur", "zinc sulfur", "sulfur, zinc", "sulfur and zinc", "sulfur, and zinc", "sulfur zinc"], "why": "The symbols are Zn and S.<br>On the periodic table, Zn is zinc and S is sulfur.<br>So two elements take part: zinc and sulfur.<br>In words, Zn + S → ZnS is zinc + sulfur → zinc sulfide."}, {"type": "text", "tag": "bare", "fig": "pt_cu_o", "stem": "Part of the periodic table is supplied. 2Cu + O₂ → 2CuO. List every element that takes part.", "accept": ["copper, oxygen", "copper and oxygen", "copper, and oxygen", "copper oxygen", "oxygen, copper", "oxygen and copper", "oxygen, and copper", "oxygen copper"], "why": "The symbols are Cu and O.<br>On the periodic table, Cu is copper and O is oxygen.<br>So two elements take part: copper and oxygen.<br>In words, 2Cu + O₂ → 2CuO is copper + oxygen → copper oxide."}, {"type": "text", "tag": "bare", "fig": "pt_k_h_o", "stem": "Part of the periodic table is supplied. 2K + 2H₂O → 2KOH + H₂. List every element that takes part.", "accept": ["potassium, hydrogen, oxygen", "potassium and hydrogen and oxygen", "potassium, and hydrogen, and oxygen", "potassium hydrogen oxygen", "potassium, hydrogen and oxygen", "potassium, hydrogen, and oxygen", "potassium, oxygen, hydrogen", "potassium and oxygen and hydrogen", "potassium, and oxygen, and hydrogen", "potassium oxygen hydrogen", "potassium, oxygen and hydrogen", "potassium, oxygen, and hydrogen", "hydrogen, potassium, oxygen", "hydrogen and potassium and oxygen", "hydrogen, and potassium, and oxygen", "hydrogen potassium oxygen", "hydrogen, potassium and oxygen", "hydrogen, potassium, and oxygen", "hydrogen, oxygen, potassium", "hydrogen and oxygen and potassium", "hydrogen, and oxygen, and potassium", "hydrogen oxygen potassium", "hydrogen, oxygen and potassium", "hydrogen, oxygen, and potassium", "oxygen, potassium, hydrogen", "oxygen and potassium and hydrogen", "oxygen, and potassium, and hydrogen", "oxygen potassium hydrogen", "oxygen, potassium and hydrogen", "oxygen, potassium, and hydrogen", "oxygen, hydrogen, potassium", "oxygen and hydrogen and potassium", "oxygen, and hydrogen, and potassium", "oxygen hydrogen potassium", "oxygen, hydrogen and potassium", "oxygen, hydrogen, and potassium"], "why": "The symbols are K, H and O.<br>On the periodic table, K is potassium, H is hydrogen and O is oxygen.<br>Each is written once, so three elements take part.<br>In words: potassium + water → potassium hydroxide + hydrogen."}, {"type": "mcq", "tag": "transfer", "fig": "pt_co_c", "stem": "Part of the periodic table is supplied. CO is a poisonous gas, and Co is a metal used in some magnets. How many elements does each name?", "options": ["both name two elements", "CO names two elements and Co names one", "CO names one element and Co names two elements"], "key": 1, "fb": ["Co has one capital letter and a small o, so it is one symbol: cobalt.", "CO is two capitals, C and O, carbon and oxygen; Co is one capital with a small o, one symbol, cobalt.", "CO has two capitals, C and O, so it is two symbols; Co has one capital and a small o, so it is one: the other way round."], "why": "Every capital letter starts a new symbol.<br>CO has two capitals: C, carbon, and O, oxygen: two elements.<br>Co has one capital and a small o: one symbol, cobalt: one element."}, {"type": "mcq", "tag": "misconception", "stem": "Gus says: \"In CO₂, the capital O starts a second symbol, so CO₂ names two elements: carbon and oxygen.\" Is Gus correct?", "options": ["yes", "no"], "key": 0, "fb": ["Every capital letter starts a new symbol: C is carbon and O is oxygen, two elements; the small 2 counts atoms, not elements.", "Gus is right: the capital O starts a second symbol, so CO₂ names carbon and oxygen; the small 2 counts oxygen atoms, not a third element."], "why": "Every capital letter starts a new chemical symbol.<br>CO₂ has two capitals, C and O: carbon and oxygen.<br>The 2 counts oxygen atoms, not elements, so Gus is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video listed the elements that take part in methane burning. How many did it find?", "options": ["2 elements", "3 elements", "4 elements"], "key": 1, "fb": ["Three symbols appear: C, H and O; that is three elements, not two.", "C is carbon, H is hydrogen, O is oxygen: three elements, each written once.", "The numbers in the equation are not symbols; only C, H and O name elements."], "why": "The symbols in CH₄ + 2O₂ → CO₂ + 2H₂O are C, H and O.<br>Each element is written once, however often its symbol appears.<br>So three elements take part."}]}, {"id": "L05", "atom": "MAT-069", "title": "The law of conservation of mass", "video": "could do without a video", "lesson_type": "Concept-introduction lesson (a fact with its reason): in a chemical reaction the total mass of the products equals the total mass of the reactants, because every atom is still there and keeps its own mass; coins law of conservation of mass", "check_design": "Type (c) concept understanding on a fact → three recall MCQs (L01: where the oxygen atoms in rust were before; the grade-5 sealed-jar fact stated in the lesson; Topic 1: a gas has mass), the law picked from three parallel sentences (the stem does not name the law), the what (a fizzing tablet in a sealed bottle: less, the same, more), the why as a free response on a FRESH case (milk turning sour in a sealed carton), two student claims (Halle: the mass should fall because a gas has no mass, key no; Ivo: each atom keeps its mass and every atom is still there, key yes), one transfer (bread dough rising in a sealed bag), one typed fluency item (8.0 g of reactants in a sealed flask), and the coined term typed LAST (Topic 1's order — adjudication 2026-09-25). 11 items.", "headache": ["Suppose a lidded jar holds vinegar, and a small paper packet of baking soda stands above the vinegar.", "On the balance the jar has a mass of 250.0 g.", "The jar is tipped, so the vinegar runs onto the baking soda.", "The mixture fizzes, and the jar fills with gas.", "The jar goes back on the balance.", "It still has a mass of 250.0 g.", "Why did the mass not change?"], "forest": ["What happens to the total mass in a chemical reaction?", "The total mass stays the same.", "The atoms only swap partners.", "Every atom that was there before is still there after.", "Each atom keeps its own mass.", "So the total mass of the products equals the total mass of the reactants.", "This rule is called the law of conservation of mass."], "article": [{"t": "idea", "text": "Suppose a lidded jar holds vinegar, and a small paper packet of baking soda stands above the vinegar."}, {"t": "idea", "text": "On the balance the jar has a mass of 250.0 g."}, {"t": "idea", "text": "The jar is tipped, so the vinegar runs onto the baking soda."}, {"t": "idea", "text": "The mixture fizzes, and the jar fills with gas."}, {"t": "idea", "text": "The jar goes back on the balance."}, {"t": "idea", "text": "It still has a mass of 250.0 g."}, {"t": "fig", "key": "flask_balances", "cap": "The lidded jar on the balance before and after: 250.0 g with the packet dry, 250.0 g after the fizz, the jar still sealed."}, {"t": "idea", "text": "Why did the mass not change?"}, {"t": "h", "text": "Three facts to hold"}, {"t": "idea", "text": "The atoms in a new substance come from the substances that were there before."}, {"t": "idea", "text": "When substances change inside a sealed jar, the total mass in the jar stays the same."}, {"t": "idea", "text": "A gas is matter: it has mass and takes up space."}, {"t": "h", "text": "The reaction in one line"}, {"t": "idea", "text": "Baking soda and vinegar react to make three new substances, one of them the gas carbon dioxide."}, {"t": "fig", "key": "soda_words", "cap": "The word equation: baking soda + vinegar → sodium acetate + water + carbon dioxide."}, {"t": "h", "text": "Why the mass stays the same"}, {"t": "idea", "text": "In the reaction, the atoms only swap partners."}, {"t": "idea", "text": "Every atom that was there before is still there after."}, {"t": "idea", "text": "Each atom keeps its own mass."}, {"t": "idea", "text": "The carbon dioxide is a gas."}, {"t": "idea", "text": "A gas is matter, so its molecules have mass too."}, {"t": "idea", "text": "The lid keeps the gas in the jar, so every atom is still on the balance."}, {"t": "idea", "text": "So the total mass of the products equals the total mass of the reactants."}, {"t": "idea", "text": "The balance shows it: 250.0 g before, 250.0 g after."}, {"t": "h", "text": "The name for this"}, {"t": "idea", "text": "This rule is called the <b>law of conservation of mass<\/b>."}, {"t": "idea", "text": "To conserve something is to keep it: the total mass is kept through the reaction."}, {"t": "fig", "key": "law_words", "cap": "The law in one line, total mass of the products = total mass of the reactants, with its reason: every atom that was there before is still there after, and each atom keeps its own mass."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a lidded jar in which damp iron rusts: 180.0 g before, 180.0 g after."}, {"t": "idea", "text": "Now consider a lidded jar in which hydrogen burns in oxygen: 64.0 g before, 64.0 g after."}, {"t": "idea", "text": "In every case the same atoms are in the jar after as before, so the mass is the same."}, {"t": "fig", "key": "sealed_examples_table", "cap": "Three reactions in lidded jars, each with the jar's mass before and after: the same reading every time."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "In a chemical reaction the total mass of the products equals the total mass of the reactants: this is the law of conservation of mass. It holds because every atom that was there before is still there after, and each atom keeps its own mass."}, {"t": "idea", "text": "Back to the jar: the fizz swapped the atoms into new partners, and the lid kept every atom inside."}, {"t": "idea", "text": "So the balance reads 250.0 g, before and after."}], "script": [{"say": "Suppose a lidded jar holds vinegar and a packet of baking soda, and the balance reads 250.0 g.", "screen": "[the lidded jar on the balance; readout 250.0 g]"}, {"say": "Tip the jar: the vinegar runs onto the baking soda, the mixture fizzes, and the jar fills with gas.", "screen": "[the jar tips; bubbles rise]"}, {"say": "Back on the balance it still reads 250.0 g: why did the mass not change?", "screen": "[readout 250.0 g; question mark]"}, {"say": "A gas is matter, so it has mass.", "screen": "[chip: A GAS HAS MASS]"}, {"say": "Baking soda and vinegar react to make sodium acetate, water and carbon dioxide.", "screen": "[strip: baking soda + vinegar → sodium acetate + water + carbon dioxide]"}, {"say": "Zoom in: the atoms only swap partners, so every atom that was there before is still there after.", "screen": "[atoms regroup inside the jar; none leaves]"}, {"say": "Each atom keeps its own mass, and the lid keeps the carbon dioxide molecules inside.", "screen": "[gas molecules bounce under the lid]"}, {"say": "So the total mass of the products equals the total mass of the reactants.", "screen": "[the line appears: total mass of the products = total mass of the reactants]"}, {"say": "This rule is called the law of conservation of mass: the total mass is kept through the reaction.", "screen": "[chip: LAW OF CONSERVATION OF MASS]"}, {"say": "Now consider a lidded jar in which damp iron rusts: the same reading before and after.", "screen": "[a second jar; two readouts]"}, {"say": "So here is the rule: the total mass of the products equals the total mass of the reactants, because every atom is still there.", "screen": "[rule slide reuses the two readouts; rule text]"}, {"say": "Back to the jar: new partners, every atom kept inside, the same 250.0 g.", "screen": "[the jar; readout 250.0 g]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "When iron rusts, where were the oxygen atoms in the rust before the change?", "options": ["in the air", "inside the iron atoms", "nowhere: the change made them"], "key": 0, "fb": ["The atoms in a new substance come from the substances that were there before: the oxygen atoms were in the air.", "An iron atom holds no oxygen atoms; the oxygen came from outside the iron.", "No atom is made from nothing; the oxygen atoms were in the air already."], "why": "The atoms in a new substance come from the substances that were there before.<br>The air around the iron holds oxygen.<br>So the oxygen atoms in the rust were in the air before the change."}, {"type": "mcq", "tag": "recall", "stem": "Two substances inside a sealed jar change into a new substance. What happens to the total mass in the jar?", "options": ["it goes up", "it stays the same", "it goes down"], "key": 1, "fb": ["Nothing came in through the seal, so the mass cannot go up.", "When substances change inside a sealed jar, the total mass in the jar stays the same.", "Nothing left through the seal, so the mass cannot go down."], "why": "The jar is sealed, so nothing comes in and nothing leaves.<br>When substances change inside a sealed jar, the total mass stays the same."}, {"type": "mcq", "tag": "recall", "stem": "Carbon dioxide gas fills a jar. Does the gas have mass?", "options": ["yes", "no"], "key": 0, "fb": ["A gas is matter: it has mass and takes up space.", "You cannot see the gas, but a gas is matter: it has mass and takes up space."], "why": "A gas is matter.<br>Matter has mass and takes up space.<br>So the carbon dioxide gas has mass."}, {"type": "mcq", "tag": "what", "stem": "In a chemical reaction, which sentence is true of the total mass?", "options": ["The total mass of the products is less than the total mass of the reactants.", "The total mass of the products is more than the total mass of the reactants.", "The total mass of the products equals the total mass of the reactants."], "key": 2, "fb": ["A gas has mass like any matter; the total mass does not fall.", "New substances are the same atoms in new partners; no mass is added.", "Every atom that was there before is still there after, and each keeps its mass: the totals are equal."], "why": "Every atom that was there before is still there after.<br>Each atom keeps its own mass.<br>So the total mass of the products equals the total mass of the reactants."}, {"type": "mcq", "tag": "what", "stem": "Suppose a sealed bottle holds water and a fizzing tablet. The tablet fizzes until it is gone, and the bottle stays sealed. Compared with before, what is the bottle's mass now?", "options": ["less", "the same", "more"], "key": 1, "fb": ["The gas from the fizz is still in the sealed bottle, and it has mass.", "Every atom is still in the sealed bottle, and each keeps its mass: the total is the same.", "Nothing came into the sealed bottle, so no mass was added."], "why": "The atoms only swapped partners inside the bottle.<br>The seal kept every atom inside, the gas included.<br>Each atom keeps its own mass, so the bottle's mass is the same."}, {"type": "frq", "tag": "why", "task": "Suppose a sealed carton of milk is left in a warm room, and the milk turns sour: a chemical change. The carton's mass does not change. Explain why.", "starter": "In the reaction, the atoms only…", "model": "In the reaction, the atoms only swap partners.<br>Every atom that was there before is still there after.<br>The carton is sealed, so no atom left and none came in.<br>Each atom keeps its own mass.<br>So the total mass of the products equals the total mass of the reactants, and the carton has the same mass.", "points": ["the atoms only swap partners, so every atom is still there", "the carton is sealed, so nothing left or came in", "each atom keeps its own mass, so the total mass is the same"]}, {"type": "mcq", "tag": "misconception", "stem": "Halle says: \"The sealed jar's mass should go down when the fizz makes a gas, because a gas has no mass.\" Is Halle correct?", "options": ["yes", "no"], "key": 1, "fb": ["Halle's reason is wrong: a gas is matter, so its molecules have mass; the lid keeps them in the jar, and the total mass stays the same.", "A gas is matter, so its molecules have mass; the lid keeps them in the jar, so the total mass stays the same and Halle is not correct."], "why": "A gas is matter, and matter has mass.<br>The carbon dioxide molecules are made of atoms that were in the jar before, each with its own mass.<br>The lid keeps them in, so the mass stays the same, and Halle is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Ivo says: \"Each atom keeps its own mass, and every atom is still in the sealed jar, so the total mass cannot change.\" Is Ivo correct?", "options": ["yes", "no"], "key": 0, "fb": ["That is the reason behind the law of conservation of mass: the same atoms, each with the same mass, so the same total.", "Ivo is right: the same atoms are still in the jar, each with the same mass, so the total cannot change."], "why": "In a reaction the atoms only swap partners, so every atom is still there.<br>Each atom keeps its own mass.<br>So the total mass cannot change, and Ivo is correct."}, {"type": "mcq", "tag": "transfer", "stem": "A sealed bag holds bread dough. The yeast in the dough makes carbon dioxide gas, and the dough puffs up. What happens to the bag's mass?", "options": ["it goes up", "it stays the same", "it goes down"], "key": 1, "fb": ["Bigger is not more mass; the same atoms fill more space.", "The gas came from atoms already in the dough, and the sealed bag keeps every atom in: the total mass is the same.", "The gas left the dough but not the sealed bag; every atom is still inside."], "why": "The carbon dioxide is made of atoms that were in the dough before.<br>The bag is sealed, so every atom stays inside.<br>Each atom keeps its own mass, so the bag's mass stays the same."}, {"type": "text", "tag": "fluency", "stem": "In a sealed flask, 8.0 g of reactants react completely and nothing else is added. What is the total mass of the products, in g?", "accept": ["8.0 g", "8.0", "8.0 grams", "8.0g", "8 g", "8", "8 grams"], "why": "The total mass of the products equals the total mass of the reactants.<br>The reactants had a mass of 8.0 g.<br>So the products have a total mass of 8.0 g."}, {"type": "text", "tag": "term", "stem": "In a chemical reaction, the total mass of the products equals the total mass of the reactants. What is this rule called?", "accept": ["law of conservation of mass", "the law of conservation of mass", "conservation of mass", "the conservation of mass"], "why": "The total mass is kept, or conserved, through the reaction.<br>This rule is called the law of conservation of mass."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video's lidded jar read 250.0 g before the fizz. What did it read after?", "options": ["less than 250.0 g", "250.0 g", "more than 250.0 g"], "key": 1, "fb": ["The gas stayed in the lidded jar with its mass, so the reading did not fall.", "Every atom stayed in the jar and kept its mass, so the reading stayed at 250.0 g.", "Nothing came into the lidded jar, so the reading did not rise."], "why": "The atoms only swapped partners inside the jar.<br>The lid kept every atom in, and each kept its mass.<br>So the jar still read 250.0 g."}]}, {"id": "L06", "atom": "MAT-069b", "title": "Work out a missing mass, and the open-dish trap", "video": "definitely a video", "lesson_type": "Solve-routine lesson in two parts (part 1: the law expanded in the reaction's substances, the unknown made the subject, substitute, calculate; part 2: why the balance reads less in an open container, a gas leaving, and more when a gas comes in); no term coined", "check_design": "Part 1, type (b) scaffolded sequence → two recall MCQs (L05: the totals are equal; Topic 3: the unit g), the worked case on the page (limestone, then hydrogen burning as the two-reactant example), four scaffold steps on a SECOND case (magnesium burning, 12.0 g → 19.9 g by molar mass: the law in this reaction's substances; make the mass of oxygen the subject; substitute; calculate 7.9 g), two bare typed masses on a third and fourth case (iron + sulfur → iron sulfide, two reactants one product, 22.0 g; 25.2 g of baking soda heated, one reactant three products, 6.6 g — no bare answer repeats another item's). Part 2, type (c) → one recall MCQ (Topic 1: the gas that left has mass), the what (a fizzing tablet in an open cup: more, the same, less), the why as a free response on a FRESH drawn case (a white powder heated in an open dish, 12.0 g to 9.8 g), one student claim (Jorge: the missing 4.4 g was destroyed; key no), and one transfer (a candle on a balance). 13 items.", "headache": ["Suppose you heat 10.0 g of limestone, which is calcium carbonate, in a lidded jar.", "The balance was zeroed with the empty jar on it, so it reads the mass of what is inside.", "The limestone splits into two products: calcium oxide, a white solid, and carbon dioxide, a gas.", "The white solid has a mass of 5.6 g.", "What is the mass of the carbon dioxide?"], "forest": ["How do you find the mass of one product when you know the others?", "Use the law of conservation of mass: the total mass of the products equals the total mass of the reactants.", "Write the law in this reaction's substances, make the unknown mass the subject, substitute, and calculate: 10.0 g − 5.6 g = 4.4 g of carbon dioxide.", "In an open dish the carbon dioxide gas floats away.", "So the balance reads 4.4 g less.", "No mass was destroyed."], "article": [{"t": "idea", "text": "Suppose you heat 10.0 g of limestone, which is calcium carbonate, in a lidded jar."}, {"t": "idea", "text": "The balance was zeroed with the empty jar on it, so it reads the mass of what is inside."}, {"t": "idea", "text": "The limestone splits into two products: calcium oxide, a white solid, and carbon dioxide, a gas."}, {"t": "fig", "key": "lime_words", "cap": "The word equation: calcium carbonate → calcium oxide + carbon dioxide. One reactant, two products."}, {"t": "idea", "text": "The white solid has a mass of 5.6 g."}, {"t": "idea", "text": "What is the mass of the carbon dioxide?"}, {"t": "h", "text": "The law"}, {"t": "idea", "text": "The total mass of the products equals the total mass of the reactants: the law of conservation of mass."}, {"t": "idea", "text": "A balance measures mass in grams, written g."}, {"t": "h", "text": "The jar before and after"}, {"t": "fig", "key": "lime_balances", "cap": "The lidded jar on a balance zeroed with the empty jar: 10.0 g of limestone before; after heating, 5.6 g of white solid and the carbon dioxide gas, still 10.0 g together, because the lid kept the gas in."}, {"t": "idea", "text": "The lid keeps the carbon dioxide in, so the balance still reads 10.0 g after heating."}, {"t": "idea", "text": "The 10.0 g is now the calcium oxide and the carbon dioxide together."}, {"t": "h", "text": "Work it out, line by line"}, {"t": "idea", "text": "To find a missing mass, there are five lines to write."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Write the values you know, each with its unit."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Write the law, then write it again in this reaction's own substances."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Make the unknown mass the subject."}, {"t": "idea", "do": true, "text": "<b>4.<\/b> Substitute the values."}, {"t": "idea", "do": true, "text": "<b>5.<\/b> Calculate, and write the answer with its unit."}, {"t": "fig", "key": "lime_worked", "cap": "The worked lines: values; the law; the law in this reaction's substances; the mass of carbon dioxide made the subject; substitute 10.0 g − 5.6 g; calculate 4.4; answer, 4.4 g of carbon dioxide."}, {"t": "idea", "text": "So the carbon dioxide has a mass of 4.4 g."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a sealed flask in which 4.0 g of hydrogen burns in 32.0 g of oxygen."}, {"t": "idea", "text": "Water forms."}, {"t": "idea", "text": "Two reactants go in and one product comes out, so their masses add."}, {"t": "fig", "key": "hydrogen_worked", "cap": "The worked lines for hydrogen burning: mass of water = mass of hydrogen + mass of oxygen = 4.0 g + 32.0 g = 36.0 g."}, {"t": "idea", "text": "So the water has a mass of 36.0 g."}, {"t": "h", "text": "Now the limestone in an open dish"}, {"t": "idea", "text": "The balance was zeroed with the empty dish on it, so it reads only what is in the dish."}, {"t": "idea", "text": "Now the same 10.0 g of limestone is heated in the open dish."}, {"t": "idea", "text": "The reading falls to 5.6 g."}, {"t": "idea", "text": "Where did the missing 4.4 g go?"}, {"t": "fig", "key": "dish_balances_q", "cap": "The open dish on a balance zeroed with the empty dish: 10.0 g of limestone before; 5.6 g of white solid after. The reading fell by 4.4 g."}, {"t": "idea", "text": "The missing 4.4 g is the carbon dioxide."}, {"t": "idea", "text": "A gas is matter, so the carbon dioxide has mass."}, {"t": "idea", "text": "The dish has no lid, so the carbon dioxide gas floated away into the air."}, {"t": "fig", "key": "dish_balances", "cap": "The same two balances, with the answer drawn in: the carbon dioxide gas leaving the open dish. The reading fell by 4.4 g because the gas left."}, {"t": "idea", "text": "The balance reads only what is left in the dish."}, {"t": "idea", "text": "No mass was destroyed: the 4.4 g of carbon dioxide is in the air of the room."}, {"t": "fig", "key": "sealed_vs_open_table", "cap": "The lidded jar and the open dish side by side: the same 10.0 g before; the gas stays in the jar and floats away from the dish; 10.0 g and 5.6 g on the balance after; no mass destroyed in either."}, {"t": "h", "text": "The other trap: a gas coming in"}, {"t": "idea", "text": "A gas can also come in from the air."}, {"t": "idea", "text": "Oxygen gas from the air joins the iron in steel wool rusting on an open pan."}, {"t": "idea", "text": "So the pad gains mass, and the balance reads more."}, {"t": "idea", "text": "No mass was created: the extra mass came from the air."}, {"t": "fig", "key": "two_traps_table", "cap": "The two open-container traps in one table: a gas leaving (the reading falls) and a gas coming in (the reading rises); in neither is mass destroyed or created."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To find a missing mass: <b>1.<\/b> Write the law of conservation of mass in the reaction's own substances. <b>2.<\/b> Make the unknown mass the subject. <b>3.<\/b> Substitute. <b>4.<\/b> Calculate, with units. In an open container a gas made by the reaction floats away, so the balance reads less. A gas from the air can join on, so the balance reads more. No mass is destroyed or created either way."}, {"t": "idea", "text": "Back to the limestone in the lidded jar: 10.0 g − 5.6 g gives 4.4 g of carbon dioxide."}, {"t": "idea", "text": "In the open dish, that 4.4 g of carbon dioxide floated away, so the balance read 5.6 g."}], "script": [{"say": "Suppose you heat 10.0 g of limestone in a lidded jar on a zeroed balance.", "screen": "[the lidded jar on the balance; readout 10.0 g]"}, {"say": "It splits into 5.6 g of calcium oxide and some carbon dioxide gas: what is the gas's mass?", "screen": "[strip: calcium carbonate → calcium oxide + carbon dioxide; question mark]"}, {"say": "The law of conservation of mass: total mass of the products equals total mass of the reactants.", "screen": "[the law in one line]"}, {"say": "In this reaction, mass of calcium oxide plus mass of carbon dioxide equals mass of calcium carbonate.", "screen": "[the line builds word by word]"}, {"say": "Make the unknown the subject: carbon dioxide equals calcium carbonate minus calcium oxide.", "screen": "[the line rearranges]"}, {"say": "Substitute and calculate: 10.0 minus 5.6 is 4.4 g.", "screen": "[10.0 g − 5.6 g = 4.4 g]"}, {"say": "Now heat the same limestone in an open dish, zeroed the same way: the reading falls to 5.6 g.", "screen": "[the open dish on the balance; readout falls from 10.0 g to 5.6 g]"}, {"say": "Where did 4.4 g go?", "screen": "[question mark over the readout]"}, {"say": "Watch: carbon dioxide gas floats out of the open dish, and the missing 4.4 g is in the air.", "screen": "[carbon dioxide molecules float up and off; molecules in the air above]"}, {"say": "No mass was destroyed: every atom is still somewhere.", "screen": "[chip: NOTHING DESTROYED]"}, {"say": "Steel wool rusting on an open pan gains mass.", "screen": "[a pad on a balance; readout climbs]"}, {"say": "Oxygen joins on, and no mass was created.", "screen": "[oxygen pairs land on the pad]"}, {"say": "The rule: write the law in the reaction's substances, make the unknown the subject, and calculat
