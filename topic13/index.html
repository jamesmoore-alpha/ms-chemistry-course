ll on each other; they do not push apart.", "The particles of one drop pull on the particles of the other, so the drops do not stay separate.", "The particles of one drop pull on the particles of the other, so the two drops join into one."], "why": "Water particles pull on each other.<br>When the drops touch, the particles of one drop pull on the particles of the other.<br>So the two drops join into one bigger drop."}, {"type": "mcq", "tag": "transfer", "stem": "After rain, beads of water hang on the threads of a spider's web. Why is each bead rounded?", "options": ["the thread squeezes the water into a ball", "the water particles pull on each other", "the air presses the water into a ball"], "key": 1, "fb": ["A thread holds the bead in place; it does not squeeze the water.", "Cohesion pulls each bead's outer particles in toward the rest, so the bead is rounded.", "The air does not shape the bead; the water's own particles pull each other in."], "why": "Water particles pull on each other: cohesion.<br>Cohesion pulls each bead's outer particles in toward the rest.<br>So each bead gathers into a rounded shape."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, what did cohesion do to the water on the penny?", "options": ["pulled it together into a dome", "pushed it off the edge", "turned it into water vapor"], "key": 0, "fb": ["Cohesion pulls the outer particles in toward the rest, so the water stands as a dome.", "Nothing pushed the water off the edge; cohesion pulled the water together.", "The water stayed liquid; cohesion pulled it together into a dome."], "why": "Water particles pull on each other: cohesion.<br>Cohesion pulls the water's outer particles in toward the rest.<br>So the water on the penny stands as a rounded dome."}]}, {"id": "L02", "atom": "MAT-074", "title": "Water pulls on other surfaces too", "video": "could do without a video", "lesson_type": "Classification lesson (a two-way sort): cohesion is the pull between particles of the same substance, adhesion the pull between particles of different substances; coins adhesion; the example sequence runs under one question, 'Same substance pulling on itself?'", "check_design": "Type (a) one-step categorisation → one recall item (L01's term typed from its meaning), the coined term typed and its meaning as an MCQ, then a fluency run of eight 'Which pull is this?' items, two options in one order, six in words (a bead on a tabletop; a sponge soaking; a paintbrush's bristles; raindrops on a trash can's lid running together; a faucet's stream holding together; rain clinging under a railing) and two answered from a drawing with the convention datum (a_f2: the arrow joins two particles, cohesion; a_f1: the arrow joins a particle to the glass wall, adhesion); keys c a a c c c a a (4 / 4; windows caac aacc accc ccca ccaa, none alternating, no pair pattern — the questions review's reorder, recomputed; the run opens on cohesion, the case type the article showed last, and ends on adhesion so Malia's stem, which names cohesion, does not follow a cohesion key); then one student-claim misconception (Malia: water sticking to a window is cohesion because it is water; key no). 12 items.", "headache": ["A student dips the corner of a paper towel into a glass of water.", "The water climbs up the towel, higher than the water in the glass.", "Now she tips the glass and pours the water out.", "A thin film of water stays stuck to the inside of the glass.", "Cohesion pulls water toward water.", "What pulls water toward paper and glass?"], "forest": ["What do you call the pull between water and a different substance?", "Water particles also pull on the particles of glass and paper.", "The pull between particles of different substances is called adhesion.", "Cohesion is the pull between water and water.", "Adhesion is the pull between water and something else.", "To sort a case, ask what is pulling on what."], "article": [{"t": "idea", "text": "A student dips the corner of a paper towel into a glass of water."}, {"t": "idea", "text": "The water climbs up the towel, higher than the water in the glass."}, {"t": "idea", "text": "Now she tips the glass and pours the water out."}, {"t": "idea", "text": "A thin film of water stays stuck to the inside of the glass."}, {"t": "fig", "key": "towel_and_glass", "cap": "Left: the towel after the water has climbed it, its wet part above the water level in the glass. Right: the glass after it is tipped out, a thin film of water left on its inside."}, {"t": "idea", "text": "Cohesion pulls water toward water."}, {"t": "idea", "text": "What pulls water toward paper and glass?"}, {"t": "h", "text": "Cohesion, again"}, {"t": "idea", "text": "Water particles pull on each other."}, {"t": "idea", "text": "The pull between particles of the same substance is called cohesion."}, {"t": "idea", "text": "Cohesion pulls a drop into a rounded shape."}, {"t": "h", "text": "Water pulls on other substances too"}, {"t": "idea", "text": "Zoom in on the towel."}, {"t": "idea", "text": "The water particles pull on the particles of the paper."}, {"t": "idea", "text": "That pull drags the water's edge up the towel, above the level in the glass."}, {"t": "idea", "text": "Now zoom in on the glass."}, {"t": "idea", "text": "The water particles pull on the particles of the glass."}, {"t": "idea", "text": "So a thin film of water stays stuck to the glass after the rest is poured out."}, {"t": "h", "text": "A name for this pull"}, {"t": "idea", "text": "Water pulling on paper, or on glass, is two different substances pulling on each other."}, {"t": "idea", "text": "The pull between particles of different substances is called <b>adhesion<\/b>."}, {"t": "idea", "text": "Cohesion is the pull between water and water."}, {"t": "idea", "text": "Adhesion is the pull between water and something else."}, {"t": "fig", "key": "two_pulls", "cap": "The same pull arrow, two partners. Left: water pulling on water, the same substance: cohesion. Right: water pulling on glass, drawn as a hatched band, two different substances: adhesion."}, {"t": "h", "text": "How to sort a case"}, {"t": "idea", "text": "To sort a case, ask what is pulling on what."}, {"t": "idea", "text": "Water pulling on water is the same substance pulling on itself: cohesion."}, {"t": "idea", "text": "Water pulling on paper, glass or anything else is two different substances: adhesion."}, {"t": "h", "text": "Five cases"}, {"t": "idea", "text": "A drop beads on a leaf: water pulls on water, so cohesion."}, {"t": "idea", "text": "Water climbs a towel: water pulls on paper, so adhesion."}, {"t": "idea", "text": "Two drops join into one: water pulls on water, so cohesion."}, {"t": "idea", "text": "Water clings to a window: water pulls on glass, so adhesion."}, {"t": "idea", "text": "A dome stands on a penny: water pulls on water, so cohesion."}, {"t": "fig", "key": "sort_cases_l02", "cap": "The five cases under one question, 'Same substance pulling on itself?' A tick means yes, cohesion; a cross means no, adhesion."}, {"t": "fig", "key": "sort_table_l02", "cap": "The five cases in a table: what pulls on what, and the verdict."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Water particles also pull on the particles of other substances, such as glass and paper. The pull between particles of different substances is called adhesion. To sort a case, ask what is pulling on what: the same substance is cohesion; different substances is adhesion."}, {"t": "idea", "text": "Back to the towel and the glass: water pulls on paper, and water pulls on glass."}, {"t": "idea", "text": "Each time, two different substances pull on each other."}, {"t": "idea", "text": "So both cases are adhesion."}], "script": [{"say": "Dip the corner of a paper towel into a glass of water.", "screen": "[a glass; a towel strip dips in]"}, {"say": "The water climbs up the towel, above the water in the glass.", "screen": "[the wet part rises above the level]"}, {"say": "Tip the glass and pour the water out; a thin film stays stuck inside.", "screen": "[the glass tips, empties, and stands again with a film on its inside]"}, {"say": "Cohesion pulls water toward water; what pulls water toward paper and glass?", "screen": "[question mark between the towel and the glass]"}, {"say": "Zoom in on the towel: the water particles pull on the paper's particles.", "screen": "[gray circles beside a hatched band labeled paper; pull arrows to the band]"}, {"say": "That pull drags the water's edge up the towel.", "screen": "[the edge climbs]"}, {"say": "In the glass, water pulls on glass, so a film stays stuck.", "screen": "[gray circles pulled to a hatched band labeled glass]"}, {"say": "Water pulling on paper or glass is two different substances pulling on each other.", "screen": "[label: water on paper; water on glass]"}, {"say": "The pull between particles of different substances is called adhesion.", "screen": "[chip: ADHESION]"}, {"say": "Cohesion is water pulling on water; adhesion is water pulling on something else.", "screen": "[the two-panel figure: water on water, water on glass]"}, {"say": "To sort a case, ask what is pulling on what.", "screen": "[the question written large]"}, {"say": "A drop beads on a leaf: water on water, cohesion; water climbs a towel: water on paper, adhesion.", "screen": "[tick over the bead; cross over the towel; the question Same substance pulling on itself? above]"}, {"say": "Two drops join: cohesion; water clings to a window: adhesion.", "screen": "[tick, cross over the two cases]"}, {"say": "The rule: water also pulls on other substances.", "screen": "[rule slide reuses the five cases; rule text, first line]"}, {"say": "That pull is called adhesion.", "screen": "[rule text, second line]"}, {"say": "Back to the towel and the glass: water on paper, water on glass; both are adhesion.", "screen": "[the towel and the glass, labeled adhesion]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "text", "tag": "recall", "stem": "A drop of water pulls itself into a rounded shape. What is the pull between water particles and other water particles called?", "accept": ["cohesion", "the cohesion"], "why": "Water particles pull on each other.<br>The pull between particles of the same substance is called cohesion."}, {"type": "text", "tag": "term", "stem": "Water particles pull on the particles of glass. What is this pull, between particles of two different substances, called?", "accept": ["adhesion", "the adhesion"], "why": "The pull between particles of different substances is called adhesion.<br>Water pulling on glass is adhesion."}, {"type": "mcq", "tag": "term", "stem": "What does adhesion mean?", "options": ["water pulling on a different substance", "water pulling on more water", "water spreading out to fill its container"], "key": 0, "fb": ["Adhesion is the pull between particles of different substances, such as water on glass.", "Water pulling on water is the same substance: that is cohesion.", "Spreading out to fill a container is what a gas does; adhesion is a pull between particles."], "why": "Water particles also pull on the particles of other substances.<br>The pull between particles of different substances is called adhesion.<br>So adhesion means water pulling on a different substance."}, {"type": "mcq", "tag": "fluency", "stem": "A drop of water on a tabletop stands as a rounded bead. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 0, "fb": ["Water pulls on water: the same substance, so cohesion.", "The bead is water pulling on water, the same substance; adhesion needs two different substances."], "why": "Ask what is pulling on what.<br>The drop's water particles pull on each other: water on water.<br>The same substance pulling on itself is cohesion."}, {"type": "mcq", "tag": "fluency", "stem": "Water soaks up into a dry sponge set in a puddle. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 1, "fb": ["Water pulls on the sponge, a different substance; cohesion is water pulling on water.", "Water pulls on the sponge: two different substances, so adhesion."], "why": "Ask what is pulling on what.<br>The water particles pull on the particles of the sponge: water on sponge.<br>Two different substances pulling on each other is adhesion."}, {"type": "mcq", "tag": "fluency", "stem": "After rinsing, water clings to the bristles of a paintbrush. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 1, "fb": ["Water pulls on the bristles, a different substance; cohesion is water pulling on water.", "Water pulls on the bristles: two different substances, so adhesion."], "why": "Ask what is pulling on what.<br>The water particles pull on the particles of the bristles: water on bristle.<br>Two different substances pulling on each other is adhesion."}, {"type": "mcq", "tag": "fluency", "stem": "Two raindrops on the lid of a trash can run together into one bigger drop. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 0, "fb": ["The two drops' water particles pull on each other: water on water, so cohesion.", "The joining is water pulling on water, the same substance; the lid is not part of that pull."], "why": "Ask what is pulling on what.<br>The particles of one drop pull on the particles of the other: water on water.<br>The same substance pulling on itself is cohesion."}, {"type": "mcq", "tag": "fluency", "stem": "A thin stream of water from a faucet holds together as one rope as it falls. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 0, "fb": ["The stream's water particles pull on each other: water on water, so cohesion.", "Holding together is water pulling on water, the same substance; adhesion needs a different substance."], "why": "Ask what is pulling on what.<br>The water particles in the stream pull on each other: water on water.<br>The same substance pulling on itself is cohesion."}, {"type": "mcq", "tag": "fluency", "fig": "a_f2", "stem": "Gray circles are water particles, the hatched band is a glass wall, and the double-headed arrow shows a pull. Which pull does the arrow show?", "options": ["cohesion", "adhesion"], "key": 0, "fb": ["The arrow joins two water particles: the same substance, so cohesion.", "The arrow joins two gray circles, two water particles, not a particle and the glass."], "why": "Ask what is pulling on what.<br>The arrow joins two gray circles: two water particles.<br>Water on water is the same substance, so the pull is cohesion."}, {"type": "mcq", "tag": "fluency", "fig": "a_f1", "stem": "Gray circles are water particles, the hatched band is a glass wall, and the double-headed arrow shows a pull. Which pull does the arrow show?", "options": ["cohesion", "adhesion"], "key": 1, "fb": ["The arrow joins a water particle to the glass wall, not to another water particle.", "The arrow joins a water particle to the glass wall: two different substances, so adhesion."], "why": "Ask what is pulling on what.<br>The arrow joins a gray circle, a water particle, to the hatched band, the glass.<br>Water on glass is two different substances, so the pull is adhesion."}, {"type": "mcq", "tag": "fluency", "stem": "Rain clings to the underside of a metal railing instead of falling straight off. Which pull is this?", "options": ["cohesion", "adhesion"], "key": 1, "fb": ["Water pulls on the metal, a different substance; cohesion is water pulling on water.", "Water pulls on the metal railing: two different substances, so adhesion."], "why": "Ask what is pulling on what.<br>The water particles pull on the particles of the metal: water on metal.<br>Two different substances pulling on each other is adhesion."}, {"type": "mcq", "tag": "misconception", "stem": "Malia says: \"Water sticking to a window is cohesion, because the sticking thing is water.\" Is Malia correct?", "options": ["yes", "no"], "key": 1, "fb": ["Being water is not the test; what pulls on what is. Water pulls on glass, two different substances, so it is adhesion.", "Water and glass are two different substances, so water sticking to a window is adhesion. Cohesion is water pulling on water."], "why": "Ask what is pulling on what.<br>The water particles pull on the particles of the glass: water on glass.<br>Two different substances pulling on each other is adhesion, so Malia is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, water climbed up the paper towel. Which two things were pulling on each other?", "options": ["water and water", "water and glass", "water and paper"], "key": 2, "fb": ["Water pulling on water is cohesion; the climb came from the water pulling on the paper.", "The glass held the water; the climb up the towel was the water pulling on the paper.", "The water particles pulled on the particles of the paper: two different substances, adhesion."], "why": "The water particles pulled on the particles of the paper towel.<br>Water and paper are two different substances.<br>That pull, adhesion, dragged the water's edge up the towel."}]}, {"id": "L03", "atom": "MAT-075", "title": "The surface acts like a stretched skin", "video": "definitely a video", "lesson_type": "Concept lesson (what, then why): a small object lowered gently rests on water because the surface particles, pulled only sideways and down, hold together like a stretched skin; coins surface tension; retrieves density (Topic 4) in one sentence pair", "check_design": "Type (c) concept understanding → two recall MCQs (Topic 4: steel at about 8 g/cm³ dropped into water at 1.0 g/cm³ sinks; L01: the pull between water particles is cohesion), the coined term typed and its meaning as an MCQ, the what (a dry sewing needle lowered flat onto still water: rests on top), the why as free response on a FRESH case the article never shows (a dry steel thumbtack lowered gently rests though steel is denser than water — the fresh-case form, open for James), one student-claim misconception (Otto: the paper clip floats because steel is less dense than water; key no), one drawn item with the convention (s_f1: a top-row particle X, in which directions its neighbors pull it: sideways and down), one what on a particle deep inside (pulled from every side), one transfer (a mosquito stands on a pond: the surface skin holds it up), one chain (a resting needle pushed through the surface sinks to the bottom), and one yes / no (is a resting clip floating like a cork: no). 12 items.", "headache": ["A student drops a steel paper clip into a glass of water.", "The clip sinks.", "Now she dries the clip and lays it flat on the water, very gently.", "The clip rests on top.", "The water surface dips under it like a thin sheet.", "Why does the same clip sink one time and rest the next?"], "forest": ["How can water hold up an object denser than itself?", "Inside the water, neighbors pull on every particle from all sides.", "A particle at the surface has no water above it, so its neighbors pull it only sideways and down.", "So the surface particles hold together like a tight, stretched skin: this skin effect is called surface tension.", "A small object lowered gently does not break the skin, so it rests on top.", "Dropped hard, the clip punches through the skin and sinks."], "article": [{"t": "idea", "text": "A student drops a steel paper clip into a glass of water."}, {"t": "idea", "text": "The clip sinks."}, {"t": "idea", "text": "Now she dries the clip and lays it flat on the water, very gently."}, {"t": "idea", "text": "The clip rests on top."}, {"t": "idea", "text": "The water surface dips under it like a thin sheet."}, {"t": "idea", "text": "Why does the same clip sink one time and rest the next?"}, {"t": "fig", "key": "clip_two_ways", "cap": "Two end states. Left: dropped in, the clip lies on the bottom. Right: laid on gently, the same clip rests on the surface, and the surface dips under it like a sheet."}, {"t": "h", "text": "Denser than water"}, {"t": "idea", "text": "Steel has a density of about 8 g/cm³."}, {"t": "idea", "text": "Water has a density of 1.0 g/cm³."}, {"t": "idea", "text": "So steel is denser than water."}, {"t": "idea", "text": "An object denser than water sinks when it is dropped in."}, {"t": "idea", "text": "So the dropped clip sinks to the bottom."}, {"t": "fig", "key": "density_table_l03", "cap": "The two densities: steel about 8 g/cm³, water 1.0 g/cm³. Steel is denser than water, so a steel object dropped in sinks."}, {"t": "idea", "text": "The resting clip is the same steel."}, {"t": "idea", "text": "So it is not floating the way a cork floats."}, {"t": "idea", "text": "Something else holds the resting clip up."}, {"t": "h", "text": "Cohesion, again"}, {"t": "idea", "text": "Water particles pull on each other."}, {"t": "idea", "text": "The pull between particles of the same substance is called cohesion."}, {"t": "h", "text": "Inside the water"}, {"t": "idea", "text": "Zoom in below the surface."}, {"t": "idea", "text": "A particle inside the water has neighbors on every side."}, {"t": "idea", "text": "Its neighbors pull it from every side."}, {"t": "h", "text": "At the surface"}, {"t": "idea", "text": "Now consider a particle in the top row."}, {"t": "idea", "text": "A particle at the surface has no water above it."}, {"t": "idea", "text": "So its neighbors pull it only sideways and down."}, {"t": "idea", "text": "Every particle in the top row is pulled the same way: sideways, along the row, and down."}, {"t": "idea", "text": "So the surface particles hold together like a tight, stretched skin."}, {"t": "fig", "key": "skin_zoom", "cap": "The water zoomed in. Particle P, inside, has neighbors on every side and is pulled from every side. Particle S, in the top row, has no water above it and is pulled only sideways and down."}, {"t": "h", "text": "A name for the skin effect"}, {"t": "idea", "text": "This skin effect is called <b>surface tension<\/b>."}, {"t": "idea", "text": "Surface tension comes from cohesion: the surface particles pulling on each other."}, {"t": "h", "text": "Resting on the skin"}, {"t": "idea", "text": "The student lowers the clip onto the water very gently."}, {"t": "idea", "text": "The clip presses the surface down a little."}, {"t": "idea", "text": "The skin dips under the clip."}, {"t": "idea", "text": "The skin does not break."}, {"t": "idea", "text": "So the clip rests on top, held up by the skin."}, {"t": "fig", "key": "clip_on_skin", "cap": "The clip resting. The top row of particles dips under the clip and pulls sideways along itself, like a stretched skin; the skin does not break."}, {"t": "idea", "text": "Dropped in hard, the clip punches through the skin."}, {"t": "idea", "text": "Below the skin, steel is denser than water, so the clip sinks."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Two more objects behave the same way."}, {"t": "idea", "text": "A steel staple lowered gently rests on the skin."}, {"t": "idea", "text": "Dropped hard, the staple sinks."}, {"t": "idea", "text": "A scrap of aluminum foil lowered gently rests on the skin."}, {"t": "idea", "text": "Dropped hard, the foil sinks."}, {"t": "fig", "key": "gently_hard_table", "cap": "Two more objects, each lowered gently and dropped hard: lowered gently, each rests on top; dropped hard, each sinks."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A particle at the surface has no water above it, so its neighbors pull it only sideways and down. The surface particles hold together like a tight, stretched skin: this skin effect is called surface tension. A small object lowered gently does not break the skin, so it rests on top."}, {"t": "idea", "text": "Back to the clip: laid on gently, it dips the skin but does not break it."}, {"t": "idea", "text": "So the clip rests on top."}, {"t": "idea", "text": "Dropped hard, it punches through the skin, and steel denser than water sinks."}], "script": [{"say": "Drop a steel paper clip into water, and it sinks.", "screen": "[the clip falls to the bottom]"}, {"say": "Steel has a density of about 8 g/cm³; water, 1.0 g/cm³. Steel is denser.", "screen": "[the two-row density table]"}, {"say": "Lay a dry clip flat on the water, gently: it rests, and the surface dips under it.", "screen": "[the clip lowered; the surface line dips under it]"}, {"say": "Why does the same clip sink one time and rest the next?", "screen": "[question mark between the two glasses]"}, {"say": "Steel is denser than water, so the resting clip is not floating.", "screen": "[label: not floating]"}, {"say": "Water particles pull on each other: cohesion.", "screen": "[zoom: gray circles with pull arrows]"}, {"say": "A particle inside has neighbors on every side, so it is pulled from every side.", "screen": "[particle P ringed; six arrows]"}, {"say": "A particle at the surface has no water above it, so its neighbors pull it only sideways and down.", "screen": "[particle S in the top row; four arrows, none upward]"}, {"say": "So the surface particles hold together like a tight, stretched skin.", "screen": "[arrows along the whole top row]"}, {"say": "This skin effect is called surface tension.", "screen": "[chip: SURFACE TENSION]"}, {"say": "Laid on gently, the clip dips the skin but does not break it, so it rests.", "screen": "[the sagging top row under the clip]"}, {"say": "Dropped hard, it punches through the skin, and steel denser than water sinks.", "screen": "[the clip breaks the row and falls]"}, {"say": "The rule: pulled only sideways and down, the surface particles hold together like a stretched skin. That is surface tension.", "screen": "[rule slide reuses the skin zoom; rule text]"}, {"say": "Back to the clip: gently, it rests; hard, it breaks through and sinks.", "screen": "[the two glasses side by side]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Steel has a density of about 8 g/cm³ and water has a density of 1.0 g/cm³. A steel nut is dropped into a bucket of water. What does the nut do?", "options": ["it sinks", "it floats"], "key": 0, "fb": ["Steel is denser than water, so the nut sinks.", "An object floats only if it is less dense than the water; steel at about 8 g/cm³ is denser than water at 1.0 g/cm³."], "why": "Steel has a density of about 8 g/cm³ and water 1.0 g/cm³.<br>Steel is denser than water.<br>An object denser than water sinks when it is dropped in, so the nut sinks."}, {"type": "mcq", "tag": "recall", "stem": "Which name is given to the pull between water particles and other water particles?", "options": ["adhesion", "cohesion", "density"], "key": 1, "fb": ["Adhesion is the pull between water and a different substance.", "The pull between particles of the same substance is called cohesion.", "Density is how much mass a material packs into each cubic centimeter; it is not a pull."], "why": "Water particles pull on each other.<br>Water on water is the same substance.<br>The pull between particles of the same substance is called cohesion."}, {"type": "text", "tag": "term", "stem": "The particles at the surface of water hold together like a tight, stretched skin. What is this skin effect called?", "accept": ["surface tension", "the surface tension"], "why": "The surface particles are pulled only sideways and down, so they hold together like a stretched skin.<br>This skin effect is called surface tension."}, {"type": "mcq", "tag": "term", "stem": "What does surface tension mean?", "options": ["the surface particles pull each other into a tight skin", "the water at the surface is denser than the water below", "the air presses down on the surface"], "key": 0, "fb": ["The surface particles, pulled only sideways and down, hold together like a stretched skin: surface tension.", "The surface water is the same water, with the same density; the skin comes from the pulls between its particles.", "Air pressing down is not surface tension; the skin comes from the surface particles pulling on each other."], "why": "A particle at the surface has no water above it, so its neighbors pull it only sideways and down.<br>So the surface particles hold together like a tight, stretched skin.<br>This skin effect is called surface tension."}, {"type": "mcq", "tag": "what", "stem": "A dry sewing needle is lowered flat onto still water, very gently. What happens?", "options": ["it sinks at once", "it rests on top of the water", "it floats half out of the water"], "key": 1, "fb": ["The needle was lowered gently, so it does not break the skin.<br>The skin holds it up, so it does not sink.", "Lowered gently, the needle dips the surface skin but does not break it, so the skin holds the needle up.", "The needle is not floating; the surface skin holds it up, lying on the surface."], "why": "The surface particles hold together like a stretched skin.<br>A small object lowered gently does not break the skin.<br>So the needle rests on top of the water."}, {"type": "frq", "tag": "why", "task": "A dry steel thumbtack is laid flat on still water, very gently, and it rests on top, although steel is denser than water. Explain why the thumbtack does not sink.", "starter": "A particle at the surface…", "model": "A particle at the surface has no water above it.<br>So its neighbors pull it only sideways and down.<br>So the surface particles hold together like a tight, stretched skin.<br>The thumbtack is laid on gently, so it does not break the skin.<br>So the skin holds the thumbtack up.", "points": ["a surface particle is pulled only sideways and down (no water above it)", "the surface particles hold together like a stretched skin (surface tension)", "laid on gently, the thumbtack does not break the skin, so the skin holds it up"]}, {"type": "mcq", "tag": "misconception", "stem": "Otto says: \"The paper clip floats on the water because steel is less dense than water.\" Is Otto correct?", "options": ["yes", "no"], "key": 1, "fb": ["Steel at about 8 g/cm³ is denser than water at 1.0 g/cm³, so the clip is not floating. The surface skin holds it up.", "Steel is denser than water, so the clip cannot float. The surface skin holds the resting clip up."], "why": "Steel has a density of about 8 g/cm³ and water 1.0 g/cm³, so steel is denser than water.<br>A denser object cannot float; dropped in, the clip sinks.<br>The resting clip is held up by the surface skin, so Otto is not correct."}, {"type": "mcq", "tag": "what", "fig": "s_f1", "stem": "Gray circles are water particles. One particle in the top row is marked X. In which directions do X's neighbors pull it?", "options": ["sideways and down", "only down", "up, down and sideways"], "key": 0, "fb": ["X is in the top row, so no water sits above it; its neighbors pull it only sideways and down.", "X has neighbors beside it as well as below it, so X is pulled sideways too.", "X has no neighbor above it, so no pull is upward; it is pulled sideways and down only."], "why": "X sits in the top row, so X has no water above it.<br>A particle's neighbors pull on it.<br>X's neighbors are beside it and below it, so they pull it only sideways and down."}, {"type": "mcq", "tag": "what", "stem": "A water particle sits deep inside a bowl of water, far below the surface. In which directions do its neighbors pull it?", "options": ["only sideways", "from every side", "only down"], "key": 1, "fb": ["Deep inside, the particle has neighbors above and below as well as beside it.", "Deep inside the water, a particle has neighbors on every side, so it is pulled from every side.", "Deep inside, the particle has neighbors above it and beside it too, not only below."], "why": "A particle deep inside the water has neighbors on every side.<br>Every neighbor pulls on it.<br>So the particle is pulled from every side."}, {"type": "mcq", "tag": "transfer", "stem": "A mosquito lands on a pond and stands on the water without going under. What holds it up?", "options": ["the mosquito is light enough to float like a cork", "the water at the surface is thicker than the water below", "the surface skin of the water holds its feet up"], "key": 2, "fb": ["Floating is for things less dense than water; the mosquito stands on the surface skin, denting it but not breaking it.", "The surface water is the same water; the skin comes from the surface particles pulling on each other.", "The mosquito's feet dent the surface skin but do not break it, so the skin holds the mosquito up."], "why": "The surface particles hold together like a stretched skin: surface tension.<br>The mosquito's feet press the skin down a little but do not break it.<br>So the skin holds the mosquito up."}, {"type": "mcq", "tag": "transfer", "stem": "A sewing needle rests on water. A fingertip pushes it down through the surface. What happens next?", "options": ["it rises back to the surface", "it floats just under the surface", "it sinks to the bottom"], "key": 2, "fb": ["The skin held the needle up only while it was unbroken; steel denser than water does not rise.", "Steel is denser than water, so below the skin the needle sinks all the way down.", "The skin is broken, and steel is denser than water, so the needle sinks."], "why": "The surface skin held the needle up while it was unbroken.<br>The fingertip pushes the needle through the skin.<br>Below the skin, steel is denser than water, so the needle sinks to the bottom."}, {"type": "mcq", "tag": "what", "stem": "Is a steel clip resting on water floating the same way a cork floats?", "options": ["yes", "no"], "key": 1, "fb": ["A cork floats because it is less dense than water. Steel is denser than water, so the clip is held up by the surface skin, not floating.", "Steel is denser than water, so the clip cannot float like a cork. The surface skin holds the clip up."], "why": "A cork is less dense than water, so it floats.<br>Steel is denser than water, so a steel clip cannot float.<br>The resting clip is held up by the surface skin, so it is not floating the way a cork floats."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, the paper clip laid on gently rested on the water. What held it up?", "options": ["the clip being less dense than water", "the water's surface skin", "air bubbles under the clip"], "key": 1, "fb": ["Steel is denser than water, so the clip cannot float; the surface skin held it up.", "The surface particles hold together like a stretched skin, and the skin held the clip up.", "No air was trapped under the clip; the surface skin held it up."], "why": "The surface particles are pulled only sideways and down.<br>So they hold together like a tight, stretched skin.<br>The clip did not break the skin, so the skin held it up."}]}, {"id": "L04", "atom": "MAT-076", "title": "Which property explains it?", "video": "could do without a video", "lesson_type": "Classification lesson (a three-way sort): a scene is sorted as cohesion, adhesion or surface tension by asking what is pulling on what; no term coined", "check_design": "Type (a) one-step categorisation → three recall MCQs, one per property (the same three options in one order; keys 0 1 2), then a fluency run of eight scenes with the three options in one order (a piece of dry wire rests on water; a bead on a waxy apple; water climbs a celery stalk; water soaks up into a dry paper napkin; two drops on a countertop run together; a beetle stands on a puddle; water climbs a dry cotton string; drips from a wet umbrella fall as round drops; keys 2 0 1 1 0 2 1 0, so the table-read item that asks for adhesion does not follow an adhesion key), one table-read item (t_f1: three scenes FRESH against the run — a bead standing on a leaf, water soaking into chalk, a staple on a puddle — with what pulls on what as 'X on Y' in every row; which is adhesion: the chalk), and one student-claim item that is TRUE on a NON-climbing adhesion scene (Wren: the film left on a rinsed plastic lunchbox lid is adhesion because the water pulls on the plastic; key yes — second read 2026-09-25: the reed claim stated the rule q6 and q10 test). 13 items.", "headache": ["Here are three scenes from the same pond.", "A raindrop rounds itself into a bead on a lily pad.", "Water climbs up inside the reeds' narrow stems.", "A water strider stands on the pond without sinking.", "Each scene is explained by one of three properties of water.", "Which is which?"], "forest": ["Which property explains each everyday scene?", "Ask what is pulling on what.", "Water pulling water into a rounded shape is cohesion.", "Water clinging to the walls of a narrow stem and climbing is adhesion.", "Water's surface holding up a small object is surface tension."], "article": [{"t": "idea", "text": "Here are three scenes from the same pond."}, {"t": "idea", "text": "A raindrop rounds itself into a bead on a lily pad."}, {"t": "idea", "text": "Water climbs up inside the reeds' narrow stems."}, {"t": "idea", "text": "A water strider stands on the pond without sinking."}, {"t": "fig", "key": "pond_three", "cap": "The three scenes at one pond: 1, a raindrop beads on a lily pad; 2, water has climbed up inside a reed's stem, above the pond's level; 3, a water strider stands on the surface, each foot in a small dent."}, {"t": "idea", "text": "Each scene is explained by one of three properties of water."}, {"t": "idea", "text": "Which is which?"}, {"t": "h", "text": "The three properties, again"}, {"t": "idea", "text": "Water particles pull on each other: that pull is cohesion."}, {"t": "idea", "text": "Water particles also pull on the particles of other substances: that pull is adhesion."}, {"t": "idea", "text": "The surface particles, pulled only sideways and down, hold together like a stretched skin: that is surface tension."}, {"t": "h", "text": "Ask what is pulling on what"}, {"t": "idea", "text": "To sort a scene, ask what is pulling on what."}, {"t": "idea", "text": "Water pulling water into a rounded shape is cohesion."}, {"t": "idea", "text": "Water clinging to the walls of another substance and climbing is adhesion."}, {"t": "idea", "text": "Water's surface holding up a small object is surface tension."}, {"t": "idea", "text": "A rounding drop has nothing resting on its surface."}, {"t": "idea", "text": "So a drop rounding itself is sorted as cohesion, not surface tension."}, {"t": "h", "text": "Scene 1: the raindrop"}, {"t": "idea", "text": "The raindrop on the lily pad is water pulling on water."}, {"t": "idea", "text": "Cohesion pulls its outer particles in."}, {"t": "idea", "text": "So the raindrop rounds into a bead: cohesion."}, {"t": "h", "text": "Scene 2: the reed"}, {"t": "idea", "text": "The water inside the reed's stem pulls on the stem's walls."}, {"t": "idea", "text": "Water on the stem's walls is two different substances: adhesion."}, {"t": "idea", "text": "Adhesion drags the water's edge up the narrow stem."}, {"t": "idea", "text": "Cohesion then pulls the rest of the water up after the climbing edge."}, {"t": "idea", "text": "The pull that lifts the edge is adhesion, so the scene is adhesion."}, {"t": "h", "text": "Scene 3: the water strider"}, {"t": "idea", "text": "The strider's feet press down on the pond's surface."}, {"t": "idea", "text": "The surface skin dips under each foot but does not break."}, {"t": "idea", "text": "The skin holds the strider up: surface tension."}, {"t": "fig", "key": "scene_table_l04", "cap": "The three pond scenes in a table: what pulls on what, and the property that explains each."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "A drop hangs from a leaf tip as a bead: water on water, so cohesion."}, {"t": "idea", "text": "Water climbs the dry edge of a sock lying in a puddle: water on cotton, so adhesion."}, {"t": "idea", "text": "A scrap of foil rests on a puddle: the surface skin holds it up, so surface tension."}, {"t": "fig", "key": "more_scenes_l04", "cap": "Three more scenes in a table: what pulls on what, and the property that explains each."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To sort a scene, ask what is pulling on what. Water pulling water into a rounded shape is cohesion. Water clinging to the walls of another substance and climbing is adhesion. Water's surface holding up a small object is surface tension."}, {"t": "idea", "text": "Back to the pond: the raindrop is cohesion, and the climbing water is adhesion."}, {"t": "idea", "text": "The water strider standing on the pond is surface tension."}], "script": [{"say": "Here are three scenes from the same pond.", "screen": "[the pond drawing]"}, {"say": "A raindrop rounds itself into a bead on a lily pad.", "screen": "[scene 1 highlighted]"}, {"say": "Water climbs up inside the reeds' narrow stems.", "screen": "[scene 2 highlighted; the water level inside the stem above the pond's]"}, {"say": "A water strider stands on the pond without sinking.", "screen": "[scene 3 highlighted]"}, {"say": "One of three properties of water explains each scene; which is which?", "screen": "[question marks over the three]"}, {"say": "Water pulling on water is cohesion; water pulling on another substance, adhesion.", "screen": "[two chips: COHESION, ADHESION, each with its pull drawing]"}, {"say": "The surface particles, pulled only sideways and down, hold together like a stretched skin: surface tension.", "screen": "[chip: SURFACE TENSION; the top row with its arrows]"}, {"say": "To sort a scene, ask what is pulling on what.", "screen": "[the question written large]"}, {"say": "The raindrop is water pulling on water, so it rounds into a bead: cohesion.", "screen": "[scene 1; label COHESION]"}, {"say": "The water in the stem pulls on the stem's walls, and adhesion drags its edge up.", "screen": "[scene 2; pull arrows to the stem walls]"}, {"say": "Adhesion lifts the edge; cohesion pulls the rest up behind it. So the scene is adhesion.", "screen": "[label ADHESION]"}, {"say": "The strider's feet dip the skin without breaking it, and the skin holds it up: surface tension.", "screen": "[scene 3; the dents; label SURFACE TENSION]"}, {"say": "The rule: ask what pulls on what.", "screen": "[rule slide reuses the three-scene table; rule text, first line]"}, {"say": "Rounding is cohesion; clinging and climbing is adhesion; a surface holding something up is surface tension.", "screen": "[rule text, the three verdicts]"}, {"say": "Back to the pond: raindrop, cohesion; climbing water, adhesion; strider, surface tension.", "screen": "[the pond, the three labels]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which pull is water pulling on water?", "options": ["cohesion", "adhesion", "surface tension"], "key": 0, "fb": ["The pull between particles of the same substance is cohesion.", "Adhesion is water pulling on a different substance.", "Surface tension is the skin effect at the surface, not the name of water pulling on water."], "why": "Water particles pull on each other.<br>Water on water is the same substance.<br>The pull between particles of the same substance is cohesion."}, {"type": "mcq", "tag": "recall", "stem": "Which pull is water pulling on a different substance, such as paper?", "options": ["cohesion", "adhesion", "surface tension"], "key": 1, "fb": ["Cohesion is water pulling on water.", "The pull between particles of different substances is adhesion.", "Surface tension is the skin effect at the surface, not water pulling on paper."], "why": "Water particles also pull on the particles of other substances.<br>Water on paper is two different substances.<br>The pull between particles of different substances is adhesion."}, {"type": "mcq", "tag": "recall", "stem": "Which name is given to the skin effect at the surface of water?", "options": ["cohesion", "adhesion", "surface tension"], "key": 2, "fb": ["Cohesion is the pull between water particles; the skin effect it makes at the surface has its own name.", "Adhesion is water pulling on a different substance.", "The surface particles hold together like a stretched skin: surface tension."], "why": "A particle at the surface has no water above it, so its neighbors pull it only sideways and down.<br>The surface particles hold together like a stretched skin.<br>This skin effect is called surface tension."}, {"type": "mcq", "tag": "fluency", "stem": "A short piece of thin dry wire, laid flat on water, rests on top. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 2, "fb": ["The wire is not pulled into a rounded shape; the surface holds it up.", "The wire is not clinging to another surface and climbing; the water's surface holds it up.", "The surface skin dips under the wire but does not break, so the skin holds it up: surface tension."], "why": "Ask what is pulling on what.<br>The water's surface skin holds the wire up.<br>Water's surface holding up a small object is surface tension."}, {"type": "mcq", "tag": "fluency", "stem": "A drop of water sits as a round bead on a waxy apple. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 0, "fb": ["Water pulls water into a rounded shape: cohesion.", "The water is not clinging to the apple and climbing; it pulls itself into a bead.", "No object rests on the water's surface; the water rounds itself."], "why": "Ask what is pulling on what.<br>The drop's water particles pull on each other and round the drop.<br>Water pulling water into a rounded shape is cohesion."}, {"type": "mcq", "tag": "fluency", "stem": "Water climbs up the stalk of a celery stick standing in a cup of water. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 1, "fb": ["Water is not being pulled into a rounded shape; it clings to the stalk and climbs.", "The water clings to the walls inside the stalk and climbs: adhesion.", "No object rests on the water's surface; the water climbs the stalk."], "why": "Ask what is pulling on what.<br>The water pulls on the walls inside the stalk and climbs.<br>Water clinging to another substance and climbing is adhesion."}, {"type": "mcq", "tag": "fluency", "stem": "Water soaks up into a dry paper napkin laid on a spill. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 1, "fb": ["The water is not rounding itself; it clings to the paper and climbs into it.", "The water clings to the paper and climbs into the napkin: adhesion.", "No object rests on the water's surface; the water climbs into the paper."], "why": "Ask what is pulling on what.<br>The water pulls on the paper and climbs into it.<br>Water clinging to another substance and climbing is adhesion."}, {"type": "mcq", "tag": "fluency", "stem": "Two drops on a countertop run together into one drop. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 0, "fb": ["Water pulls on water, and the two drops gather into one: cohesion.", "The joining is water on water, not water clinging to the countertop and climbing.", "No object rests on the water's surface; the drops pull each other together."], "why": "Ask what is pulling on what.<br>The particles of one drop pull on the particles of the other: water on water.<br>Water pulling water together is cohesion."}, {"type": "mcq", "tag": "fluency", "stem": "A small beetle stands on a puddle without going under. Which property explains it?", "options": ["cohesion", "adhesion", "surface tension"], "key": 2, "fb": ["The beetle is not water rounding itself; the puddle's surface holds it up.", "The beetle is not water clinging to another substance; the puddle's surface holds it up.", "The surface skin dips under the beetle's feet but does not break: surface tension."], "why": "Ask what is pulling on what.<br>The puddle's surface skin holds the beetle up.<br>Water's surface holding up a small object is surface tension."}, {"type": "mcq", "tag": "fluency", "stem":  adhesion, because the water pulls on the plastic.\" Is Wren correct?", "options": ["yes", "no"], "key": 0, "fb": ["The water pulls on the plastic, two different substances, and that pull keeps the film on the lid: adhesion.", "Water on plastic is two different substances pulling on each other. That pull is adhesion, and it keeps the film on the lid."], "why": "Ask what is pulling on what.<br>The water pulls on the plastic of the lid: two different substances.<br>That pull, adhesion, keeps the film clinging to the lid, so Wren is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, which pond scene was cohesion?", "options": ["the raindrop beading on the lily pad", "the water climbing the reed's stem", "the water strider standing on the pond"], "key": 0, "fb": ["The raindrop is water pulling on water: cohesion.", "The climbing water pulls on the stem's walls: adhesion.", "The surface skin holds the strider up: surface tension."], "why": "Ask what is pulling on what.<br>The raindrop is water pulling water into a rounded shape.<br>So the raindrop scene is cohesion."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-073", "stem": "Two water particles pull on each other. What is this pull, between particles of the same substance, called?", "accept": ["cohesion", "the cohesion"], "why": "Water particles pull on each other.<br>The pull between particles of the same substance is called cohesion."}, {"type": "text", "tag": "term", "atom": "MAT-074", "stem": "Water particles pull on the particles of a cotton shirt. What is this pull, between particles of different substances, called?", "accept": ["adhesion", "the adhesion"], "why": "Water particles also pull on the particles of other substances.<br>The pull between particles of different substances is called adhesion."}, {"type": "text", "tag": "term", "atom": "MAT-075", "stem": "The top layer of water holds together like a tight, stretched skin. What is this skin effect called? without breaking it.<br>Water's surface holding up a small object is surface tension.<br>Steel is denser than water, so the clip is not floating."}, {"d": "medium", "atom": "MAT-076", "stem": "After rain, drops of water cling to the sloping plastic sheet of a tent without sliding off. Where two of the drops touch, they join into one drop. Which pair names the property behind the clinging, then the property behind the joining?", "options": ["adhesion, then cohesion", "cohesion, then adhesion", "adhesion, then surface tension", "cohesion, then cohesion"], "key": 0, "why": "Ask what is pulling on what in each part.<br>The drops cling to the plastic sheet: water on plastic, two different substances, so the clinging is adhesion.<br>Where two drops touch, the particles of one pull on the particles of the other: water on water, so the joining is cohesion."}, {"d": "medium", "atom": "MAT-073", "stem": "Two drops of water sit on a plastic cutting board about 2 cm apart, not touching. The board is left still. What happens to the two drops?", "options": ["they creep toward each other and join into one drop", "they spread out into flat sheets until they meet", "they stay where they are, as two separate drops", "they push each other further apart"], "key": 2, "why": "A water particle pulls only on the neighbors that touch it.<br>The two drops do not touch, so the particles of one drop do not pull on the particles of the other.<br>Each drop's own particles pull each other in, so each drop holds together where it is."}, {"d": "hard", "atom": "MAT-075", "stem": "Kwame drops a needle into a glass of water, and it sinks. He says: \"Steel always sinks, so a needle can never stay on top of water.\" Which statement is correct?", "options": ["Anything denser than water goes under, however gently it is placed.", "Laid on gently, a needle does not break the surface skin.", "A needle can stay on top only if it is lighter than water.", "A needle stays on top only in salt water."], "key": 1, "why": "Steel is denser than water, so a needle dropped in sinks.<br>Lowered gently, a needle dips the surface skin but does not break it.<br>So the skin holds the needle up, and Kwame is not correct."}, {"d": "hard", "atom": "MAT-076", "stem": "A drop of rain on a rubber boot gathers into a round bead. Saoirse says: \"The pull that rounds this drop is cohesion, because the water is pulling on water.\" Which statement about the pull that rounds the drop is correct?", "options": ["It is between particles of the same substance.", "It is between the water and the air around the drop.", "It is between the water and the rubber of the boot.", "It needs two different substances."], "key": 0, "why": "Ask what is pulling on what.<br>In a rounding drop the water particles pull on each other: the same substance.<br>The pull between particles of the same substance is cohesion, so Saoirse is correct."}, {"d": "hard", "atom": "MAT-074", "type": "text", "stem": "Water climbs up a strip of cloth hung into a cup of water. Reza says: \"The water climbs because water particles pull on each other, so it is cohesion.\" Which pull drags the water's edge up the cloth? Type the name of the pull.", "accept": ["adhesion", "the adhesion", "its adhesion", "it is adhesion", "adhesion of water", "water's adhesion", "the water's adhesion"], "why": "Ask what is pulling on what.<br>The water's edge pulls on the cloth, two different substances, and that pull, adhesion, drags the edge up.<br>Cohesion pulls the rest of the water up after the edge.<br>So the climb is adhesion, and Reza is not correct."}, {"d": "hard", "atom": "MAT-075", "stem": "A dry razor blade rests flat on water. A student taps it; it goes under and sinks to the bottom. Why does it sink now?", "options": ["the blade soaked up water and got heavier", "the tap made the blade denser than before", "the tap broke the skin under the blade, and steel does not float", "the water below the surface pulls the blade down harder than the skin holds it"], "key": 2, "why": "The surface skin held the blade up while it was unbroken.<br>The tap pushes the blade through the skin.<br>Below the skin, steel is denser than water, so the blade sinks."}, {"d": "hard", "atom": "MAT-073", "stem": "Ingrid says: \"In a drop, only the outer particles are pulled; the particles inside feel no pull.\" Which particles in the drop are pulled?", "options": ["only the outer particles", "every particle", "only the inside particles", "no particle"], "key": 1, "why": "Every water particle pulls on the particles next to it.<br>A particle inside the drop has neighbors on every side, so it is pulled from every side.<br>An outer particle has neighbors only on its inner side, so it is pulled in; Ingrid is not correct."}, {"d": "hard", "atom": "MAT-073", "type": "text", "stem": "In a space station, a blob of water floats free, touching nothing, and becomes a round ball. Matteo says: \"The ball is round only because nothing is pressing on it; the water's own particles play no part.\" Which property rounds the blob?", "accept": ["cohesion", "the cohesion", "its cohesion", "it is cohesion", "cohesion of water", "water's cohesion", "the water's cohesion"], "why": "Water particles pull on each other: cohesion.<br>Every outer particle of the blob has neighbors only on its inner side, so it is pulled in toward the rest.<br>So the blob rounds itself: the water's own particles do the rounding, and Matteo is not correct.<br>The station's air and the water's density play no part."}, {"d": "hard", "atom": "MAT-074", "type": "text", "stem": "A drop of water hangs from the underside of a wooden shelf without falling. Jovan says: \"Cohesion holds the drop there, because the drop's particles pull on each other.\" Which pull holds the drop to the shelf? Type the name of the pull.", "accept": ["adhesion", "the adhesion", "its adhesion", "it is adhesion", "adhesion of water", "water's adhesion", "the water's adhesion"], "why": "Ask what is pulling on what.<br>The drop's particles pull on each other: cohesion, which holds the drop together as one rounded drop.<br>The drop's particles also pull on the wood: adhesion, and that pull holds the drop to the shelf.<br>So Jovan has named only one of the two pulls."}, {"d": "hard", "atom": "MAT-074", "type": "text", "fig": "pp_gap_climb", "stem": "Two glass plates stand close together in a trough of water. The water between the plates stands higher than the water outside them. Which property lifts the water's edge up the glass?", "accept": ["adhesion", "the adhesion", "its adhesion", "it is adhesion", "adhesion of water", "water's adhesion", "the water's adhesion"], "why": "Ask what is pulling on what.<br>The water's edge pulls on the glass: two different substances, adhesion, and that pull drags the edge up between the plates.<br>The water particles pull on each other: cohesion, which pulls the rest of the water up after the edge.<br>So the level between the plates rises."}, {"d": "hard", "atom": "MAT-075", "stem": "Pilar says: \"A particle in the top row of the water is pulled only sideways and down.\" Why is that so?", "options": ["Nothing sits above the top row to pull those particles up.", "The air above pushes the top row down.", "The particles below pull harder than the ones beside it do.", "The top row is colder than the water below it."], "key": 0, "why": "A particle at the surface has no water above it.<br>Its neighbors are beside it and below it, so they pull it only sideways and down.<br>The air does not pull the particles up, and only the inside particles are pulled from every side, so Pilar is correct."}, {"d": "hard", "atom": "MAT-075", "stem": "Tarun says: \"The skin on water is a thin layer of a different substance, like the skin that forms on cooling soup.\" What is the skin on water?", "options": ["a thin layer of a lighter substance floating on top", "a layer of air pressed tightly onto the water", "the water's own top row of particles", "a layer of colder, thicker water on the surface"], "key": 2, "why": "The water's surface is water, the same substance as below.<br>A top-row particle has no water above it, so its neighbors pull it only sideways and down.<br>So the top row holds together like a stretched skin; no second substance is there, and Tarun is not correct."}, {"d": "hard", "atom": "MAT-075", "type": "text", "stem": "A dry sewing needle rests on the water in a cup. Viggo says: \"The water under the needle pushes it up, the same way water pushes a cork up, so the needle floats.\" Which property holds the needle up?", "accept": ["surface tension", "the surface tension", "its surface tension", "it is surface tension", "surface tension of water", "water's surface tension", "the water's surface tension", "the surface skin", "it is the surface skin", "the skin", "it is the skin", "the water's skin", "it is the water's skin", "surface skin", "it is surface skin", "the skin on the water", "it is the skin on the water"], "why": "Steel has a density of about 8 g/cm³ and water 1.0 g/cm³, so the needle is denser than water.<br>A denser object cannot float the way a cork does; dropped in, it sinks.<br>The resting needle is held up by the surface skin, which it dips but does not break: surface tension.<br>So Viggo is not correct."}, {"d": "hard", "atom": "MAT-076", "type": "text", "stem": "A dry brick stands in a shallow puddle, and a dark wet band climbs a short way up the brick above the puddle. Oona says: \"That is surface tension: the water's skin pulls the water up the brick.\" Which property lifts the water up the brick?", "accept": ["adhesion", "the adhesion", "its adhesion", "it is adhesion", "adhesion of water", "water's adhesion", "the water's adhesion"], "why": "Ask what is pulling on what.<br>The water's edge pulls on the brick: two different substances, adhesion, and that pull drags the edge up.<br>Surface tension is the skin at a still surface holding a small object up; it does not lift water up a wall.<br>So Oona is not correct."}, {"d": "hard", "atom": "MAT-076", "type": "text", "stem": "A dry twig dropped into a pond stays on top of the water. Sigrid says: \"Surface tension holds the twig up, the same way it holds up an insect standing on the pond.\" Which property explains why the twig stays on top? Type the property's name.", "accept": ["density", "the density", "its density", "it is density", "density of water", "water's density", "the water's density", "low density", "it is low density", "lower density", "it is lower density"], "why": "Wood is less dense than water, so the twig floats, even when it is dropped in.<br>A denser object dropped in punches through the skin and sinks.<br>Only a small, denser object lowered gently rests on the skin.<br>So the property is density, the same reason a cork floats, and Sigrid is not correct."}], "figs": {"penny_dome": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 190\" style=\"width:100%;max-width:587px;height:auto\" role=\"img\" aria-label=\"A penny seen from the side, drawn as a hatched band, with water standing on it as a rounded dome labeled water; a dropper above it; a pointer labels the dome a rounded dome, not spilling; title: after 25 drops\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"470\" height=\"190\" fill=\"#ffffff\"/><text x=\"180\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">after 25 drops<\/text><rect x=\"170\" y=\"36\" width=\"20\" height=\"40\" rx=\"4\" fill=\"#ffffff\" stroke=\"#222\"/><path d=\"M 172 76 L 178 92 L 182 92 L 188 76 Z\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"220\" y=\"60\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">the dropper<\/text><path d=\"M 105.0 150.0 C 105.0 104.8 255.0 104.8 255.0 150.0 Z\" fill=\"#d9d9d9\" stroke=\"#222\" stroke-width=\"1.2\"/><text x=\"180\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">wat <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  const typedKind = q.type==='text' || q.type==='numeric';  // a PP100 item may be typed — text or numeric entry (James, 2026-09-28); same grader as the lesson quizzes
  if(q.type==='mcq' || (q.d && !typedKind && q.type!=='frq')){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(typedKind){
    return `<div class="item typed" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><input ${q.type==='numeric' ? 'inputmode="decimal" ' : ''}placeholder="${q.type==='numeric' ? 'Type the number, with its unit' : 'Type your answer'}"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Questions from easy to hard. Most are multiple choice; the hardest ask you to type the answer. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
