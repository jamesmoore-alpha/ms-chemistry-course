<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 138" width="100%" role="img" aria-label="A table of three scenes and what pulls on what in each" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="466" height="138" fill="#ffffff"/><rect x="10" y="10" width="446" height="28" fill="#f1f1f1" stroke="#222"/><text x="139.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">scene</text><text x="362.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what pulls on what</text><rect x="10" y="38" width="446" height="28" fill="#ffffff" stroke="#222"/><text x="139.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a bead of water stands on a leaf</text><text x="362.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><rect x="10" y="66" width="446" height="28" fill="#ffffff" stroke="#222"/><text x="139.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water soaks up into a dry stick of chalk</text><text x="362.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on chalk</text><rect x="10" y="94" width="446" height="28" fill="#ffffff" stroke="#222"/><text x="139.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a dry steel staple rests on a puddle</text><text x="362.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water, at the surface</text><line x1="268" y1="10" x2="268" y2="122" stroke="#222"/><!--blind: A table. Header: scene | what pulls on what. Row: a bead of water stands on a leaf | water on water. Row: water soaks up into a dry stick of chalk | water on chalk. Row: a dry steel staple rests on a puddle | water on water, at the surface.--></svg>