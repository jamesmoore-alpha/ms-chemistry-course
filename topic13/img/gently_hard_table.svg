<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="100%" role="img" aria-label="A table of two objects: a steel staple rests on top when lowered gently and sinks when dropped hard; a scrap of aluminum foil rests on top when lowered gently and sinks when dropped hard" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="480" height="110" fill="#ffffff"/><rect x="10" y="10" width="460" height="28" fill="#f1f1f1" stroke="#222"/><text x="105.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">object</text><text x="270.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lowered gently</text><text x="405.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">dropped hard</text><rect x="10" y="38" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a steel staple</text><text x="270.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">rests on top</text><text x="405.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sinks</text><rect x="10" y="66" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a scrap of aluminum foil</text><text x="270.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">rests on top</text><text x="405.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sinks</text><line x1="200" y1="10" x2="200" y2="94" stroke="#222"/><line x1="340" y1="10" x2="340" y2="94" stroke="#222"/><!--blind: A table. Header: object | lowered gently | dropped hard. Row: a steel staple | rests on top | sinks. Row: a scrap of aluminum foil | rests on top | sinks.--></svg>