<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" role="img" aria-label="A key. Left: a gray circle labeled one water particle; two touching gray circles labeled two water particles, touching: packed close, as in any liquid, not joined; two touching gray circles joined by a dark double-headed arrow labeled a pull: the two particles pull on each other, not a movement. Right, past a dashed line: the same water particle drawn much closer up, one large open circle joined to two small dark circles, labeled three atoms joined into one particle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="210" fill="#ffffff"/><text x="270.0" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">the key</text><circle cx="50.0" cy="60.0" r="10" fill="#d9d9d9" stroke="#222" stroke-width="1"/><text x="74" y="64" text-anchor="start" font-size="13" font-weight="normal" fill="#222">one water particle</text><circle cx="50.0" cy="104.0" r="10" fill="#d9d9d9" stroke="#222" stroke-width="1"/><circle cx="70.0" cy="104.0" r="10" fill="#d9d9d9" stroke="#222" stroke-width="1"/><text x="94" y="100" text-anchor="start" font-size="13" font-weight="normal" fill="#222">two water particles, touching:</text><text x="94" y="116" text-anchor="start" font-size="13" font-weight="normal" fill="#222">packed close, as in any liquid; not joined</text><circle cx="50.0" cy="156.0" r="10" fill="#d9d9d9" stroke="#222" stroke-width="1"/><circle cx="70.0" cy="156.0" r="10" fill="#d9d9d9" stroke="#222" stroke-width="1"/><line x1="50.0" y1="156.0" x2="70.0" y2="156.0" stroke="#222" stroke-width="2.0"/><polyline points="63.7,159.0 70.0,156.0 63.7,153.0" fill="none" stroke="#222" stroke-width="2.0" stroke-linejoin="round"/><polyline points="56.3,153.0 50.0,156.0 56.3,159.0" fill="none" stroke="#222" stroke-width="2.0" stroke-linejoin="round"/><text x="94" y="152" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a pull: the two particles pull</text><text x="94" y="168" text-anchor="start" font-size="13" font-weight="normal" fill="#222">on each other (not a movement)</text><line x1="340" y1="40" x2="340" y2="190" stroke="#222" stroke-dasharray="4 3"/><text x="440" y="60" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the same water particle,</text><text x="440" y="76" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">drawn much closer up:</text><circle cx="440.0" cy="126.8" r="16.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="422.4" cy="112.4" r="8.0" fill="#222" stroke="#222" stroke-width="1"/><circle cx="457.6" cy="112.4" r="8.0" fill="#222" stroke="#222" stroke-width="1"/><text x="440" y="160" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">three atoms joined</text><text x="440" y="176" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">into one particle</text></svg>