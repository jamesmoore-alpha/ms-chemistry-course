<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 130" width="100%" role="img" aria-label="A table: steel has a density of about 8 g/cm³ and water has a density of 1.0 g/cm³. Note: steel is denser than water: dropped in, a steel object sinks" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="380" height="130" fill="#ffffff"/><rect x="10" y="10" width="360" height="28" fill="#f1f1f1" stroke="#222"/><text x="110.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">material</text><text x="290.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">density</text><rect x="10" y="38" width="360" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel</text><text x="290.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">about 8 g/cm³</text><rect x="10" y="66" width="360" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="290.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1.0 g/cm³</text><line x1="210" y1="10" x2="210" y2="94" stroke="#222"/><text x="190.0" y="112" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Steel is denser than water: dropped in, a steel object sinks.</text><!--blind: A table. Header: material | density. Row: steel | about 8 g/cm³. Row: water | 1.0 g/cm³. Note under the table: Steel is denser than water: dropped in, a steel object sinks.--></svg>