<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 194" width="100%" role="img" aria-label="A table of the five cases: what pulls on what and the verdict. A drop beads on a leaf: water on water, cohesion. Water climbs a towel: water on paper, adhesion. Two drops join into one: water on water, cohesion. Water clings to a window: water on glass, adhesion. A dome stands on a penny: water on water, cohesion" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="194" fill="#ffffff"/><rect x="10" y="10" width="480" height="28" fill="#f1f1f1" stroke="#222"/><text x="110.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">case</text><text x="295.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what pulls on what</text><text x="435.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">verdict</text><rect x="10" y="38" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a drop beads on a leaf</text><text x="295.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><text x="435.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cohesion</text><rect x="10" y="66" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water climbs a towel</text><text x="295.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on paper</text><text x="435.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">adhesion</text><rect x="10" y="94" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">two drops join into one</text><text x="295.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><text x="435.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cohesion</text><rect x="10" y="122" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water clings to a window</text><text x="295.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on glass</text><text x="435.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">adhesion</text><rect x="10" y="150" width="480" height="28" fill="#ffffff" stroke="#222"/><text x="110.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a dome stands on a penny</text><text x="295.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><text x="435.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cohesion</text><line x1="210" y1="10" x2="210" y2="178" stroke="#222"/><line x1="380" y1="10" x2="380" y2="178" stroke="#222"/><!--blind: A table. Header: case | what pulls on what | verdict. Row: a drop beads on a leaf | water on water | cohesion. Row: water climbs a towel | water on paper | adhesion. Row: two drops join into one | water on water | cohesion. Row: water clings to a window | water on glass | adhesion. Row: a dome stands on a penny | water on water | cohesion.--></svg>