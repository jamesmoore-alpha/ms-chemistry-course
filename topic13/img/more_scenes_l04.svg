<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 549 138" width="100%" role="img" aria-label="A table of three more scenes: a drop hangs from a leaf tip as a bead, water on water, cohesion; water climbs the dry edge of a sock, water on cotton, adhesion; a scrap of foil rests on a puddle, the surface skin holds it up, surface tension" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="549" height="138" fill="#ffffff"/><rect x="10" y="10" width="529" height="28" fill="#f1f1f1" stroke="#222"/><text x="135.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">scene</text><text x="347.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what pulls on what</text><text x="486.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the property</text><rect x="10" y="38" width="529" height="28" fill="#ffffff" stroke="#222"/><text x="135.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a drop hangs from a leaf tip as a bead</text><text x="347.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on water</text><text x="486.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">cohesion</text><rect x="10" y="66" width="529" height="28" fill="#ffffff" stroke="#222"/><text x="135.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water climbs the dry edge of a sock</text><text x="347.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">water on cotton</text><text x="486.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">adhesion</text><rect x="10" y="94" width="529" height="28" fill="#ffffff" stroke="#222"/><text x="135.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a scrap of foil rests on a puddle</text><text x="347.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the surface skin holds it up</text><text x="486.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">surface tension</text><line x1="261" y1="10" x2="261" y2="122" stroke="#222"/><line x1="434" y1="10" x2="434" y2="122" stroke="#222"/><!--blind: A table. Header: scene | what pulls on what | the property. Row: a drop hangs from a leaf tip as a bead | water on water | cohesion. Row: water climbs the dry edge of a sock | water on cotton | adhesion. Row: a scrap of foil rests on a puddle | the surface skin holds it up | surface tension.--></svg>