<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 195" width="100%" role="img" aria-label="A table of three cases: the mass before a change of state, the change, and the mass after" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="560" height="195" fill="#ffffff"/><rect x="20" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="110" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">before</text><text x="280" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">the change</text><text x="450" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">after</text><rect x="20" y="38" width="520" height="40" fill="#ffffff" stroke="#222"/><text x="110" y="63" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">45 g of ice, sealed bag</text><text x="280" y="63" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">melts into water</text><text x="450" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">45 g of water</text><rect x="20" y="78" width="520" height="40" fill="#ffffff" stroke="#222"/><text x="110" y="103" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">80 g of melted wax, sealed jar</text><text x="280" y="103" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">freezes into solid wax</text><text x="450" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">80 g of wax</text><rect x="20" y="118" width="520" height="40" fill="#ffffff" stroke="#222"/><text x="110" y="143" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">500 g of water, open pan</text><text x="280" y="143" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">boils; 200 g of water vapor escapes</text><text x="450" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">300 g of water left</text><text x="280" y="178" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">The mass after equals the mass before, minus anything that escaped.</text></svg>