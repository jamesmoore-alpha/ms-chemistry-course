text": "When some of the substance escapes"}, {"t": "idea", "text": "Now consider an open pan of water on a stove."}, {"t": "idea", "text": "The pan holds 500 g of water."}, {"t": "idea", "text": "The water boils, and 200 g of it leaves the pan as water vapor."}, {"t": "idea", "text": "The particles that left are now in the air, not in the pan."}, {"t": "idea", "text": "So the mass left in the pan is the mass before minus the mass that escaped."}, {"t": "h", "text": "The working"}, {"t": "idea", "text": "mass left = mass before − mass escaped"}, {"t": "idea", "text": "mass left = 500 g − 200 g"}, {"t": "idea", "text": "mass left = 300 g"}, {"t": "idea", "text": "The pan now holds 300 g of water."}, {"t": "fig", "key": "mass_table", "cap": "Three worked cases in a table: the mass before, the change, and the mass after. Sealed bag of ice melts: 45 g, then 45 g. Sealed jar of wax freezes: 80 g, then 80 g. Open pan boils and 200 g escapes: 500 g, then 300 g."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "When a substance changes state, its mass after equals its mass before. If some of the substance escapes as a gas, the mass left behind is the mass before minus the mass that escaped."}, {"t": "idea", "text": "Back to the bag: the mass does not change when the ice melts."}, {"t": "idea", "text": "So the water has a mass of 45 g, and the student can answer without weighing the bag again."}], "script": [{"say": "Here is a sealed bag of ice on a balance: 45 grams.", "screen": "[sealed bag of ice on a balance; readout 45 g]"}, {"say": "The ice melts inside the bag.", "screen": "[the ice becomes water]"}, {"say": "A student is asked for the mass of the water, but she has not weighed it.", "screen": "[balance grayed out; question mark]"}, {"say": "Can she still give the answer?", "screen": "[chip: CAN SHE ANSWER?]"}, {"say": "The mass of a substance does not change when it changes state.", "screen": "[chip: MASS DOES NOT CHANGE]"}, {"say": "The bag is sealed, so every ice particle is still there as water.", "screen": "[sixteen particles: grid becomes heap]"}, {"say": "So the mass of the water equals the mass of the ice: 45 grams.", "screen": "[line: mass after melting = mass before melting = 45 g]"}, {"say": "The bag held 45 grams of ice. The ice melted while sealed, so the bag holds 45 grams of water.", "screen": "[table: before, change, after; cells fill in turn]"}, {"say": "Now consider an open pan holding 500 grams of water.", "screen": "[open pan on a burner; label 500 g]"}, {"say": "The water boils, and 200 grams leaves as water vapor.", "screen": "[vapor particles rise out of the pan; label 200 g leaves]"}, {"say": "Those particles are now in the air.", "screen": "[particles above the pan highlighted]"}, {"say": "So the mass left is the mass before minus the mass that escaped.", "screen": "[line: mass left = mass before − mass escaped]"}, {"say": "500 grams minus 200 grams leaves 300 grams.", "screen": "[lines: mass left = 500 g − 200 g; mass left = 300 g]"}, {"say": "Here is the rule: when a substance changes state, its mass after equals its mass before.", "screen": "[rule slide reuses the table; rule text line 1]"}, {"say": "If some of the substance escapes as a gas, the mass left is the mass before minus the mass that escaped.", "screen": "[rule text line 2]"}, {"say": "Back to the bag: the mass does not change, so the water is 45 grams.", "screen": "[the bag of water; 45 g]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A substance changes state inside a sealed container. What happens to its mass?", "options": ["The mass goes up.", "The mass stays the same.", "The mass goes down."], "key": 1, "fb": ["No particle arrived, so the mass cannot go up.", "The same particles are all still there, so the mass does not change.", "No particle left, so the mass cannot go down."], "why": "The mass of a substance does not change when it changes state.<br>The same particles are all still there."}, {"type": "text", "tag": "scaffold", "stem": "A sealed bag holds 120 g of water. The bag is put in a freezer at −18 °C until all the water is ice. What is the mass of the ice, in grams?", "accept": ["120", "120 g", "120 grams"], "why": "Mass of ice = mass of water = 120 g. The bag is sealed, so the mass does not change."}, {"type": "text", "tag": "scaffold", "stem": "A sealed can holds 200 g of solid cooking fat. The can sits by a warm stove until all the fat is liquid. What is the mass of the liquid fat, in grams?", "accept": ["200", "200 g", "200 grams"], "why": "Mass of liquid fat = mass of solid fat = 200 g. The can is sealed, so the mass does not change."}, {"type": "mcq", "tag": "scaffold", "stem": "An open pot of soup boils on a stove, and some of the water in it leaves as water vapor. Does the mass of soup in the pot stay the same?", "options": ["yes", "no"], "key": 1, "fb": ["The particles that left as water vapor are in the air now, not in the pot, so the mass in the pot went down.", "The particles that left as water vapor are in the air now, so the mass in the pot went down."], "why": "Some water particles left the open pot as water vapor.<br>Those particles are in the air, not in the pot.<br>So the mass of soup in the pot went down."}, {"type": "text", "tag": "scaffold", "stem": "An open kettle holds 800 g of water. The water boils, and 150 g of it leaves the kettle as water vapor. What mass of water is left in the kettle, in grams?", "accept": ["650", "650 g", "650 grams"], "why": "Mass left = mass before − mass escaped = 800 g − 150 g = 650 g."}, {"type": "text", "tag": "bare", "stem": "A sealed bottle holds 330 g of fruit juice. The bottle is frozen solid. What is the mass of the frozen juice, in grams?", "accept": ["330", "330 g", "330 grams"], "why": "Mass of frozen juice = mass of liquid juice = 330 g. The bottle is sealed, so the mass does not change."}, {"type": "text", "tag": "bare", "stem": "An open saucepan holds 600 g of milk. The milk is heated until it boils, and 100 g of water leaves it as water vapor. What mass of milk is left in the saucepan, in grams?", "accept": ["500", "500 g", "500 grams"], "why": "Mass left = mass before − mass escaped = 600 g − 100 g = 500 g."}, {"type": "text", "tag": "fluency", "stem": "A sealed bag holds 350 g of frozen strawberries. The strawberries thaw completely inside the bag. What is the mass of the thawed strawberries, in grams?", "accept": ["350", "350 g", "350 grams"], "why": "Mass of thawed strawberries = mass of frozen strawberries = 350 g. The bag is sealed, so the mass does not change."}, {"type": "text", "tag": "fluency", "stem": "An open fish tank holds 9000 g of water. Over a month, 700 g of the water evaporates into the air. What mass of water is left in the tank, in grams?", "accept": ["8300", "8300 g", "8300 grams", "8,300", "8,300 g"], "why": "Mass left = mass before − mass escaped = 9000 g − 700 g = 8300 g."}, {"type": "text", "tag": "fluency", "stem": "An open pan holds 800 g of tomato sauce. The sauce boils, and 250 g of water leaves it as water vapor. What mass of sauce is left in the pan, in grams?", "accept": ["550", "550 g", "550 grams"], "why": "Mass left = mass before − mass escaped = 800 g − 250 g = 550 g."}], "video_question": [{"type": "text", "tag": "video", "stem": "45 g of ice melts inside a sealed bag. What is the mass of the water, in grams?", "accept": ["45", "45 g", "45 grams"], "why": "The mass does not change when a substance changes state.<br>45 g of ice becomes 45 g of water."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-020", "stem": "A block of hard cocoa butter turns into a runny liquid in a warm cupboard. What is this change of state called?", "accept": ["melting"], "why": "A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-023", "stem": "Drops of water form on the outside of a cold metal pipe in a warm basement. Where did the water come from?", "options": ["from water vapor in the air", "from inside the pipe", "from the ceiling"], "key": 0, "fb": ["Water vapor in the air hit the cold pipe, slowed down and condensed.", "The pipe did not leak. Water vapor in the air condensed on it.", "Nothing dripped. Water vapor in the air condensed on the cold pipe."], "why": "The air holds water vapor.<br>Water vapor particles that hit the cold pipe slow down and crowd together.<br>The water vapor condenses into drops."}, {"type": "text", "tag": "term", "atom": "MAT-022", "stem": "Water in a saucepan reaches 100 °C, and bubbles of water vapor form all through it. What is this change of state called?", "accept": ["boiling"], "why": "A liquid turning into a gas all through the liquid, as bubbles, is called boiling."}, {"type": "text", "tag": "numeric", "atom": "MAT-026b", "stem": "A sealed pouch holds 75 g of soup. The pouch is frozen solid. What is the mass of the frozen soup, in grams?", "accept": ["75", "75 g", "75 grams"], "why": "Mass of frozen soup = mass of liquid soup = 75 g. The pouch is sealed, so the mass does not change."}, {"type": "text", "tag": "term", "atom": "MAT-021", "stem": "Liquid wax in a mold cools and turns into a solid crayon. What is this change of state called?", "accept": ["freezing"], "why": "A liquid turning into a solid is called freezing."}, {"type": "frq", "tag": "written", "atom": "MAT-020", "task": "A frozen water balloon is left on a picnic table in the sun. An hour later the balloon holds only liquid water. Explain why, using particles.", "starter": "The ice turned into water because…", "model": "The ice turned into water because heat flowed from the warm air and sunshine into the cold ice.<br>Heating gives the particles energy.<br>The particles vibrated faster and broke out of their fixed positions.<br>Now the particles slide past one another, so the ice is liquid water.", "points": ["heat flowed in and gave the particles energy", "the particles broke out of their fixed positions", "the particles now slide past one another, which is a liquid"]}, {"type": "text", "tag": "term", "atom": "MAT-024", "stem": "Ice cubes left in a freezer tray for months slowly shrink, and no water ever appears in the tray. What is this change of state called?", "accept": ["sublimation", "subliming"], "why": "No liquid ever formed.<br>A solid turning straight into a gas is called sublimation."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-025", "stem": "Liquid gold is poured into a mold and cools into a solid ring. What is the ring made of?", "options": ["a new substance made from the liquid gold", "gold", "gold mixed with air"], "key": 1, "fb": ["A change of state never makes a new substance.", "The same gold particles are there; only their arrangement and movement changed.", "No air particles joined the gold. The same gold particles locked into fixed positions."], "why": "Freezing is a change of state.<br>The same gold particles are there before and after.<br>Only their arrangement and their movement changed.<br>So the ring is gold."}, {"type": "text", "tag": "term", "atom": "MAT-022", "stem": "A wet swimsuit dries slowly on a chair. What is the change of state that dried it called?", "accept": ["evaporation", "evaporating"], "why": "The water left the swimsuit from its surface, a particle at a time.<br>A liquid turning into a gas from its surface is called evaporation."}, {"type": "text", "tag": "numeric", "atom": "MAT-026b", "stem": "An open pan holds 1200 g of water. The water boils, and 300 g of it leaves the pan as water vapor. What mass of water is left in the pan, in grams?", "accept": ["900", "900 g", "900 grams"], "why": "Mass left = mass before − mass escaped = 1200 g − 300 g = 900 g."}, {"type": "text", "tag": "term", "atom": "MAT-023", "stem": "Water vapor from a kettle hits a cold window and turns into drops of liquid water. What is this change of state called?", "accept": ["condensation", "condensing"], "why": "A gas turning into a liquid is called condensation."}, {"type": "frq", "tag": "written", "atom": "MAT-026", "task": "A sealed cup holds 90 g of chicken broth. In a freezer the broth turns solid, and the cup still reads 90 g on the balance. Explain why the mass did not change.", "starter": "The mass did not change because…", "model": "The mass did not change because the cup is sealed.<br>No particle left the cup, and no particle arrived.<br>Every particle that was in the liquid broth is still in the cup as solid broth.<br>The same particles have the same mass.", "points": ["the cup is sealed, so no particle left or arrived", "every particle of the liquid broth is still there as solid broth", "the same particles have the same mass"]}], "pp100": [{"d": "easy", "atom": "MAT-020", "stem": "Which of the following is an example of melting?", "options": ["A block of lard in a warm pan turning runny.", "A lake's surface turning to ice in winter.", "A wet road drying in the sun.", "Drops forming on the outside of a cold glass pitcher."], "key": 0, "why": "The lard was a solid and became a liquid.<br>A solid turning into a liquid is called melting."}, {"d": "easy", "atom": "MAT-021", "stem": "Melted cheese on a pizza cools and turns solid. What is this change of state called?", "options": ["melting", "evaporation", "freezing", "condensation"], "key": 2, "why": "The cheese was a liquid and became a solid.<br>A liquid turning into a solid is called freezing."}, {"d": "easy", "atom": "MAT-022", "stem": "A wet dog's fur dries in the sun. What is this change of state called?", "options": ["evaporation", "boiling", "condensation", "melting"], "key": 0, "why": "The water left the fur from its surface, a particle at a time.<br>A liquid turning into a gas from its surface is called evaporation."}, {"d": "easy", "atom": "MAT-023", "stem": "Which change of state is a gas turning into a liquid?", "options": ["boiling", "sublimation", "freezing", "condensation"], "key": 3, "why": "A gas turning into a liquid is called condensation."}, {"d": "easy", "atom": "MAT-024", "stem": "Which change of state skips the liquid state altogether?", "options": ["melting", "freezing", "boiling", "sublimation"], "key": 3, "why": "Sublimation is a solid turning straight into a gas.<br>No liquid ever forms."}, {"d": "easy", "atom": "MAT-025", "stem": "Used aluminum cans are melted in a furnace. What is the liquid in the furnace?", "options": ["a new metal made from the cans", "aluminum mixed with air", "smoke", "aluminum"], "key": 3, "why": "Melting is a change of state.<br>A change of state never makes a new substance.<br>The same aluminum particles are there; only their arrangement and their movement changed."}, {"d": "easy", "atom": "MAT-026", "stem": "A sealed bag of frozen peas reads 400 g. The peas thaw completely inside the sealed bag. What does the balance read now?", "options": ["less than 400 g", "400 g", "more than 400 g", "It cannot be known without weighing the bag again."], "key": 1, "why": "The bag is sealed, so no particle left and no particle arrived.<br>The same particles have the same mass, so the balance still reads 400 g."}, {"d": "easy", "atom": "MAT-026b", "stem": "A sealed can holds 250 g of frozen lemonade. The lemonade thaws completely inside the can. What is the mass of the liquid lemonade?", "options": ["200 g", "250 g", "300 g", "It cannot be worked out without weighing the can again."], "key": 1, "why": "The mass of a substance does not change when it changes state.<br>The can is sealed, so every lemonade particle is still there as a liquid.<br>Mass of liquid lemonade = mass of frozen lemonade = 250 g."}, {"d": "easy", "atom": "MAT-020", "stem": "A plumber touches a hot soldering iron to a piece of solder. The tip of the solder turns into a shiny liquid drop. What is this change of state called?", "options": ["condensation", "freezing", "melting", "evaporation"], "key": 2, "why": "The solder was a solid and became a liquid.<br>A solid turning into a liquid is called melting."}, {"d": "easy", "atom": "MAT-021", "stem": "A wet mitten is left on a back step on a cold night. By morning the water in it has turned into ice, and the mitten is stiff. What is this change of state called?", "options": ["sublimation", "condensation", "freezing", "melting"], "key": 2, "why": "The water in the mitten was a liquid and became solid ice.<br>A liquid turning into a solid is called freezing."}, {"d": "easy", "atom": "MAT-022", "stem": "Which change of state happens when only the fastest particles at the surface of a liquid fly off into the air as a gas?", "options": ["boiling", "condensation", "evaporation", "melting"], "key": 2, "why": "The particles leave from the surface of the liquid, not from all through it.<br>A liquid turning into a gas from its surface is called evaporation."}, {"d": "easy", "atom": "MAT-023", "stem": "On a humid summer day, the cold concrete floor of a garage is damp all over, though nothing was spilled on it. What is this change of state called?", "options": ["condensation", "evaporation", "freezing", "melting"], "key": 0, "why": "Water vapor in the air turned into liquid drops on the cold floor.<br>A gas turning into a liquid is called condensation."}, {"d": "easy", "atom": "MAT-023", "stem": "Water vapor condenses on a cold surface. What do the water particles do?", "options": ["The particles break apart into smaller particles.", "The particles lock into fixed positions on the spot.", "The particles slow down and crowd together.", "The particles speed up and fly farther apart."], "key": 2, "why": "Cooling takes energy away from the particles.<br>Water vapor particles that hit the cold surface slow down.<br>The slow particles crowd together, touching, and slide past one another.<br>The gas has become a liquid."}, {"d": "easy", "atom": "MAT-024", "stem": "A pair of jeans on a clothesline has frozen stiff at −15 °C. A week later the jeans are dry, and no water ever dripped from them. What is this change of state called?", "options": ["condensation", "melting", "sublimation", "evaporation"], "key": 2, "why": "No water ever dripped, so no liquid ever formed.<br>The ice particles flew straight off the solid into the air as a gas.<br>A solid turning straight into a gas is called sublimation."}, {"d": "easy", "atom": "MAT-025", "stem": "Ice, liquid water and water vapor are…", "options": ["the same substance in three states.", "three different substances.", "two substances: ice and liquid water are the same, but water vapor is different.", "the same substance, but made of different particles in each state."], "key": 0, "why": "Ice, liquid water and water vapor are all made of the same water particles.<br>Only the arrangement and the movement of the particles differ.<br>The same particles make the same substance."}, {"d": "easy", "atom": "MAT-025", "stem": "The frost inside a chest freezer slowly sublimes into a gas. What is the gas?", "options": ["air", "water vapor", "a new gas made from the frost", "carbon dioxide"], "key": 1, "why": "Frost is ice: solid water.<br>Sublimation is a change of state, and a change of state never makes a new substance.<br>The same water particles are now flying about as a gas, so the gas is water vapor."}, {"d": "easy", "atom": "MAT-026", "stem": "A sealed bottle of smoothie freezes solid in a cold cabin. Afterward the frozen bottle reads 600 g on a balance. What did the bottle read before the smoothie froze?", "options": ["less than 600 g", "600 g", "more than 600 g", "It depends on how cold the cabin got."], "key": 1, "why": "The bottle is sealed, so no particle left and no particle arrived.<br>Freezing changed only the arrangement and the movement of the particles.<br>The same particles had the same mass before, so the bottle read 600 g then too."}, {"d": "easy", "atom": "MAT-026b", "stem": "A sealed pouch holds 180 g of mango chunks. The mango is frozen, thawed in a lunchbox and frozen again, all inside the sealed pouch. What is the mass of the frozen mango at the end?", "options": ["170 g", "180 g", "190 g", "It cannot be known without weighing the pouch again."], "key": 1, "why": "The pouch is sealed, so every mango particle is still there after every change.<br>A change of state never changes mass, however many times it happens.<br>Mass at the end = mass at the start = 180 g."}, {"d": "medium", "atom": "MAT-020", "stem": "A glue stick in a hot glue gun turns runny. Why does the glue turn runny?", "options": ["The glue's particles broke out of their fixed positions.", "The glue's particles got bigger.", "The glue's particles turned into a different, softer substance.", "The glue's particles stopped moving."], "key": 0, "why": "The glue gun heats the glue.<br>Heating gives the particles energy.<br>The particles broke out of their fixed positions and now slide past one another, so the glue is runny."}, {"d": "medium", "atom": "MAT-021", "stem": "Melted sugar is poured onto a cold tray and hardens into candy within a minute. Why does the sugar harden?", "options": ["The particles get bigger and jam together.", "The particles lock into fixed positions.", "The particles stop moving.", "The cold sticks the particles together like glue."], "key": 1, "why": "Heat flows out of the hot sugar into the cold tray.<br>Cooling takes energy away from the particles.<br>The particles slow down, stop sliding and lock into fixed positions.<br>Each particle still vibrates on the spot."}, {"d": "medium", "atom": "MAT-022", "stem": "Water boils in a pot. Why do bubbles form all through the water and not only at its surface?", "options": ["Air from the room is pushed down into the water.", "Particles all through the water fly apart into pockets of gas.", "The hot bottom of the pot pushes air up through the water.", "The water particles split into smaller particles."], "key": 1, "why": "At 100 °C the particles all through the water have enough energy to fly apart.<br>Deep inside the water, particles fly apart into pockets of gas.<br>Each pocket is a bubble of water vapor, so bubbles form all through the water."}, {"d": "medium", "atom": "MAT-023", "stem": "A cold metal spoon is held above a mug of very hot chocolate. Within seconds the spoon is covered in drops of water. Why?", "options": ["Hot chocolate splashed up onto the spoon.", "The metal of the spoon melted a little.", "Water vapor from the drink condensed on the spoon.", "The spoon sweated water out from inside its metal."], "key": 2, "why": "The hot drink fills the air above it with water vapor.<br>Heat flows from the water vapor into the cold spoon.<br>Water vapor particles that hit the spoon slow down and crowd together, touching.<br>The water vapor condenses into drops."}, {"d": "medium", "atom": "MAT-024", "stem": "On a very cold, dry, windy day, the snow on a mountainside slowly disappears. No melt water runs off. What happened to the snow?", "options": ["The snow turned straight into a gas.", "The snow melted into liquid water.", "The snow froze even harder.", "The snow condensed into drops of water."], "key": 0, "why": "No liquid ever formed.<br>The snow particles flew straight off the solid into the air as a gas.<br>A solid turning straight into a gas is called sublimation."}, {"d": "medium", "atom": "MAT-025", "stem": "A puddle of nail-polish remover on a desk evaporates into the air. What is the gas in the air?", "options": ["air made from the remover", "nail-polish remover as a gas", "water vapor", "a new substance"], "key": 1, "why": "Evaporation is a change of state.<br>A change of state never makes a new substance.<br>The same remover particles are in the air, now far apart and flying, so the gas is nail-polish remover."}, {"d": "medium", "atom": "MAT-026b", "stem": "An open bucket holds 3000 g of water. Over a week in the sun, 1200 g of the water evaporates into the air. What mass of water is left in the bucket?", "options": ["4200 g", "3000 g", "1200 g", "1800 g"], "key": 3, "why": "The particles that left as water vapor are in the air, not in the bucket.<br>Mass left = mass before − mass escaped.<br>3000 g − 1200 g = 1800 g."}, {"d": "medium", "atom": "MAT-024", "stem": "Dry-ice pellets are packed around a box of frozen food for delivery. When the box is opened two days later, the pellets have gone and the inside of the box is dry. Kai says: \"The dry ice evaporated.\" Which statement is correct?", "options": ["The pellets evaporated from their surface, as Kai says.", "The pellets melted, and then the liquid evaporated.", "The pellets turned straight from a solid into a gas.", "The pellets froze onto the inside walls of the box."], "key": 2, "why": "Evaporation is a liquid turning into a gas.<br>The box stayed dry, so no liquid ever formed.<br>The solid turned straight into a gas, which is sublimation."}, {"d": "medium", "atom": "MAT-020", "stem": "A stick of solid deodorant sits in a cool cabinet. What must happen to its particles for the deodorant to melt?", "options": ["The particles must lose energy and lock more tightly together.", "The particles must gain energy and break out of fixed positions.", "The particles must turn into liquid particles one by one.", "The particles must spread far apart, with empty space between them."], "key": 1, "why": "Melting needs the particles to break out of their fixed positions.<br>Only energy lets them do that.<br>Heating gives the particles energy, so warming the deodorant would melt it."}, {"d": "medium", "atom": "MAT-021", "stem": "A 3D printer pushes out a thin line of hot melted plastic, and the plastic must harden quickly so the shape holds. Which of these would make the plastic harden faster?", "options": ["a heater warming the air around the plastic", "a fan blowing cool air on the plastic", "keeping the air around the plastic perfectly still", "pressing down on the plastic"], "key": 1, "why": "Hardening is freezing: the particles must slow down and lock into fixed positions.<br>Cooling takes energy away from the particles.<br>Cool moving air carries heat away from the plastic faster, so the particles lock sooner."}, {"d": "medium", "atom": "MAT-022", "stem": "A vase of water, with no flowers in it, stands in a cool spare room at 12 °C. Over a month the water disappears, and nobody touched the vase. How did the water leave the vase?", "options": ["The fastest surface particles flew off as a gas.", "The water slowly boiled away in the cool room.", "The water soaked out through the glass of the vase.", "The water slowly turned into ordinary air."], "key": 0, "why": "Evaporation happens at any temperature.<br>Some particles at the surface of the water move fast enough to fly off into the air as water vapor.<br>Particle after particle left, so the vase emptied.<br>The water never reached 100 °C, so it did not boil."}, {"d": "medium", "atom": "MAT-022", "stem": "Water in a beaker on a hot plate is boiling. Bubbles rise through the water and burst at the surface. What happens to the gas inside a bubble when it bursts?", "options": ["The gas turns into air.", "The gas turns back into liquid water and drops into the beaker.", "The gas disappears, and nothing is left of it.", "The gas spreads into the air as water vapor."], "key": 3, "why": "Each bubble is a pocket of water vapor: water as a gas.<br>When the bubble bursts, that gas joins the air above the beaker.<br>The particles are still water particles, far apart and flying fast."}, {"d": "medium", "atom": "MAT-023", "stem": "Drops form on the outside of a glass of iced tea on some days but not on others. On which kind of day do drops form?", "options": ["when the air is very dry", "when the air is much colder than the glass", "when bright sun shines on the glass", "when the air holds a lot of water vapor"], "key": 3, "why": "The drops are water vapor from the air that condensed on the cold glass.<br>On a humid day the air holds a lot of water vapor.<br>More water vapor particles hit the cold glass, slow down and crowd together into drops."}, {"d": "medium", "atom": "MAT-024", "stem": "On a cold, dry winter day, two identical blocks of ice sit outdoors, one in the sun and one in the shade. Both blocks shrink, but only the block in the sun leaves a puddle. Which block shrank only by sublimation?", "options": ["the block in the shade", "the block in the sun", "both blocks", "neither block"], "key": 0, "why": "To tell melting from sublimation, ask whether a liquid ever formed.<br>The block in the sun left a puddle, so it melted.<br>The block in the shade left the ground dry, so its particles flew straight off the solid as a gas.<br>Only the shaded block shrank by sublimation alone."}, {"d": "medium", "atom": "MAT-025", "stem": "A lump of a metal called gallium melts into a silvery liquid in a student's warm hand. Why is the liquid still gallium?", "options": ["The same particles are there, arranged and moving differently.", "Each solid particle turned into a liquid gallium particle.", "The liquid is still shiny and silver-colored, just like the solid lump was.", "The liquid gallium has the same mass as the lump did."], "key": 0, "why": "Melting is a change of state.<br>Heating gave the gallium particles energy, and they broke out of their fixed positions.<br>The particles themselves did not change.<br>The same particles make the same substance, so the liquid is gallium."}, {"d": "medium", "atom": "MAT-026", "stem": "A sealed bag of frozen grapes reads 300 g on a balance. The grapes thaw completely inside the sealed bag, and the balance still reads 300 g. Why is the mass unchanged?", "options": ["Every particle of the frozen grapes is still in the bag.", "Ice and water are the same substance, so they must have the same mass.", "The thawed grapes take up the same space as the frozen grapes did.", "Mass never changes, whatever happens to a thing."], "key": 0, "why": "The bag is sealed, so no particle left and no particle arrived.<br>Thawing is melting: the ice in the grapes changed only the arrangement and the movement of its particles.<br>The same particles have the same mass."}, {"d": "medium", "atom": "MAT-026b", "stem": "Over a hot week, 2100 g of water evaporates from an open horse trough, and 5400 g of water is left in it. What mass of water did the trough hold at the start of the week?", "options": ["2100 g", "3300 g", "5400 g", "7500 g"], "key": 3, "why": "The water that evaporated is in the air, and the rest is in the trough; both were in the trough at the start.<br>Mass before = mass left + mass escaped.<br>5400 g + 2100 g = 7500 g."}, {"d": "medium", "atom": "MAT-026b", "stem": "A slow cooker with its lid off holds 1500 g of bean stew. After an evening of cooking, 1150 g of stew is left. What mass of water left the stew as water vapor?", "options": ["350 g", "1150 g", "1500 g", "2650 g"], "key": 0, "why": "The stew lost mass only because water left it as water vapor.<br>Mass escaped = mass before − mass left.<br>1500 g − 1150 g = 350 g."}, {"d": "hard", "atom": "MAT-026", "stem": "A sealed bottle of juice reads 500 g. It is frozen solid. Maya says: \"The frozen bottle has more mass, because ice is harder than juice.\" Which statement is correct?", "options": ["Maya is right, because harder things have more mass.", "The frozen bottle has less mass, because ice is lighter than liquid juice.", "The mass is still 500 g, because every particle is still in the bottle.", "It cannot be known, because the bottle must be weighed again."], "key": 2, "why": "The bottle is sealed, so no particle left and no particle arrived.<br>Freezing changed only the arrangement and the movement of the particles.<br>The same particles have the same mass, so the reading is still 500 g.<br>Hardness is not mass."}, {"d": "hard", "atom": "MAT-022", "stem": "Two identical dishes each hold 100 g of water. One dish sits on a warm radiator, the other on a cool floor. Which dish empties first, and why?", "options": ["The warm dish, because more of its particles fly off the surface.", "The cool dish, because cold water is thinner.", "The warm dish, because the water on the radiator boils away.", "Both empty at the same time, because they hold the same mass."], "key": 0, "why": "Heating gives particles energy.<br>The warm water has more fast particles at its surface.<br>More particles fly off into the air as water vapor each minute, so the warm dish evaporates first."}, {"d": "hard", "atom": "MAT-023", "stem": "A pot of water is heated on a stove until bubbles rise all through it. A lid is put on the pot. A minute later, the underside of the lid is covered in drops of water. Which two changes of state happened, in order?", "options": ["boiling, then freezing", "boiling, then condensation", "condensation, then boiling", "boiling, then melting"], "key": 1, "why": "The water boiled: water particles flew off as bubbles of water vapor.<br>The water vapor hit the cooler lid, slowed down and crowded together.<br>The water vapor condensed into drops on the lid."}, {"d": "hard", "atom": "MAT-025", "stem": "Ice on a pond melts in spring, and over the summer some of the pond water evaporates into the air. Noor says: \"The ice turned into two new substances: water, and then water vapor.\" Which statement is correct?", "options": ["Noor is right: each change of state makes a new substance.", "Noor is partly right: only evaporation made a new substance.", "Noor is partly right: only melting made a new substance.", "Noor is wrong: all three are one substance in three states."], "key": 3, "why": "A change of state never makes a new substance.<br>Ice, liquid water and water vapor are made of the same water particles.<br>Melting and evaporation changed only the arrangement and the movement of those particles."}, {"d": "hard", "atom": "MAT-020", "stem": "Ice covers a bird bath on a cold morning, and by noon the sun has turned the ice into water. Kenji says: \"The sun made the ice particles stop vibrating and start sliding.\" Which statement about the ice particles is correct?", "options": ["The particles stopped vibrating, then started to slide.", "The particles slowed down, then locked into fixed positions.", "The particles turned into water particles, then slid.", "The particles vibrated harder, then broke loose and slid."], "key": 3, "why": "Heating gives the particles energy.<br>The ice particles vibrated faster and faster, not more slowly.<br>At last the particles broke out of their fixed positions.<br>Now the particles slide past one another, so the ice is water."}, {"d": "hard", "atom": "MAT-020", "stem": "A frozen gel ice pack softens in a lunch bag, and by noon the gel inside flows. Jonah says: \"The particles got bigger and pushed one another farther and farther apart until they could flow.\" Which statement about the gel particles is correct?", "options": ["The particles stayed the same size and broke out of their fixed positions.", "The particles stayed the same size and pushed one another farther and farther apart.", "The particles got bigger and broke out of their fixed positions.", "The particles got bigger and pushed one another farther and farther apart."], "key": 0, "why": "Heating never changes the size of particles.<br>The warm bag gave the gel particles energy.<br>The particles vibrated harder and broke out of their fixed positions.<br>Now the particles slide past one another, so the gel flows."}, {"d": "hard", "atom": "MAT-021", "stem": "On a very cold night, a farmer sprays water onto her orange trees to protect them, and the water turns to ice on the branches. Tariq says: \"The cold took energy from the water particles, so they have stopped moving.\" Which statement about the water particles is correct?", "options": ["The particles gained energy and now do not move at all.", "The particles gained energy and now vibrate on the spot.", "The particles lost energy and now do not move at all.", "The particles lost energy and now vibrate on the spot."], "key": 3, "why": "Cooling takes energy away from particles, so Tariq is right about the energy.<br>But particles never stop moving.<br>The slow particles locked into fixed positions.<br>In the ice each particle still vibrates on the spot."}, {"d": "hard", "atom": "MAT-022", "stem": "Wet hiking boots left in a cold barn at 4 °C are dry two days later. Hana says: \"The water cannot have evaporated, because the water never got warm.\" Which statement is correct?", "options": ["Hana is right: the water soaked into the leather instead of leaving.", "Hana is right: a liquid must be hot before it can turn into a gas.", "Hana is wrong: the fastest surface particles fly off at any temperature.", "Hana is wrong: the water froze first, and then the ice turned straight into a gas."], "key": 2, "why": "Evaporation happens at any temperature, warm or cool.<br>Even in cold water, some particles at the surface move fast enough to fly off as water vapor.<br>A cold liquid evaporates more slowly, but it still evaporates.<br>So the boots dried without ever getting warm."}, {"d": "hard", "atom": "MAT-023", "stem": "Wet rain jackets hang in a small, closed mudroom overnight. By morning the jackets are dry, and the cold metal door of the room is covered in drops. Which two changes of state happened, in order?", "options": ["boiling, then condensation", "condensation, then evaporation", "evaporation, then condensation", "evaporation, then freezing"], "key": 2, "why": "The water on the jackets evaporated: the fastest surface particles flew off into the air as water vapor.<br>The door is colder than the air.<br>Water vapor particles that hit the cold door slowed down and crowded together.<br>The water vapor condensed into drops."}, {"d": "hard", "atom": "MAT-024", "stem": "Through a month of cold, dry, sunny weather at −8 °C, the ice on an unused outdoor rink gets thinner, and the rink never gets wet. Amara says: \"The ice melted a little each day, and the water evaporated.\" Which statement is correct?", "options": ["Amara is right: ice always melts before it can turn into a gas.", "Amara is right: sunshine melts a little ice every day.", "Amara is wrong: the ice turned straight into a gas.", "Amara is wrong: the ice packed down harder, so it only looks thinner."], "key": 2, "why": "Melting makes a liquid.<br>The rink never got wet, so no liquid ever formed.<br>The ice particles flew straight off the solid into the air as a gas.<br>The ice sublimed, and the rink stayed dry."}, {"d": "hard", "atom": "MAT-025", "stem": "Broken zinc roof gutters are melted down at a scrap yard, and the liquid zinc is cooled into blocks. Wei says: \"The blocks are a new metal, because melting changed the zinc.\" Which statement is correct?", "options": ["Wei is right: melting always makes a new substance.", "Wei is right: metals change when they get hot.", "Wei is wrong: melting changed the particles, but freezing changed them back.", "Wei is wrong: the same particles are there, rearranged."], "key": 3, "why": "Melting and freezing are changes of state.<br>A change of state never makes a new substance.<br>The zinc particles never changed: they broke loose and slid when the zinc melted, then locked back into fixed positions when it cooled.<br>So the blocks are zinc."}, {"d": "hard", "atom": "MAT-026", "stem": "An open cooler full of ice sits on a sunny boat dock all day, and by evening the ice has melted and most of the water has evaporated. Dev says: \"The cooler and its contents still have the same mass, because a change of state never changes mass.\" Which statement is correct?", "options": ["Dev is right: a change of state never changes the mass of anything.", "Dev is right: the water that evaporated has no mass, because it is a gas.", "Dev is wrong: melting makes water lighter than ice.", "Dev is wrong: the evaporated particles have left the cooler."], "key": 3, "why": "Melting changed nothing: every ice particle was still in the cooler as water.<br>But the cooler is open.<br>Evaporation carried water particles out of the cooler into the air as water vapor.<br>Those particles are gone from the cooler, so its mass went down."}, {"d": "hard", "atom": "MAT-026", "stem": "A sealed jar of pickles straight from a refrigerator reads 900 g on a balance. Ten minutes later, on a humid day, the outside of the jar is wet and the balance reads 902 g. Where did the extra 2 g come from?", "options": ["from the glass of the jar, which sweats water when it is cold", "from the liquid in the jar leaking out through the glass", "from the pickles warming up", "from water vapor in the air condensing on the cold jar"], "key": 3, "why": "The jar is sealed, so nothing inside it could add mass.<br>The air holds water vapor.<br>Water vapor particles that hit the cold jar slowed down and crowded together into drops.<br>Those particles came from the air, so the jar and its drops read 2 g more."}, {"d": "hard", "atom": "MAT-026b", "stem": "A humidifier's open water tank holds 1000 g of water, and overnight 250 g leaves it as water vapor. The water left in the tank is poured into a bottle, sealed and frozen. What is the mass of the ice?", "options": ["250 g", "750 g", "1000 g", "1250 g"], "key": 1, "why": "First the open tank: mass left = 1000 g − 250 g = 750 g of water.<br>Then the sealed bottle: freezing does not change mass.<br>Mass of ice = mass of water = 750 g."}], "figs": {"melt_panels": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 550 235\" style=\"width:100%;max-width:687px;height:auto\" role=\"img\" aria-label=\"Melting in three panels: the same sixteen particles go from the solid grid, through breaking loose, to the liquid heap as heat goes in\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"550\" height=\"235\" fill=\"#ffffff\"/><rect x=\"20\" y=\"20\" width=\"150\" height=\"110\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">ice: a solid<\/text><text x=\"95.0\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" font- 0\" width=\"110\" height=\"80\" rx=\"14\" fill=\"#ffffff\" stroke=\"#222\" stroke-dasharray=\"4 3\"/><text x=\"105\" y=\"62\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"normal\" fill=\"#222\">sealed bag<\/text><rect x=\"65\" y=\"100\" width=\"18\" height=\"18\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"95\" y=\"95\" width=\"18\" height=\"18\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"125\" y=\"105\" width=\"18\" height=\"18\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"80\" y=\"125\" width=\"18\" height=\"18\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"110\" y=\"128\" width=\"18\" height=\"18\" fill=\"#d9d9d9\" stroke=\"#222\"/><text x=\"105\" y=\"222\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">50 g of ice, sealed<\/text><rect x=\"330\" y=\"150\" width=\"150\" height=\"10\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"330\" y=\"160\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#f1f1f1\" stroke=\"#222\"/><rect x=\"370\" y=\"170\" width=\"70\" height=\"20\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"405\" y=\"185\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">50 g<\/text><rect x=\"350\" y=\"70\" width=\"110\" height=\"80\" rx=\"14\" fill=\"#ffffff\" stroke=\"#222\" stroke-dasharray=\"4 3\"/><text x=\"405\" y=\"62\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"normal\" fill=\"#222\">sealed bag<\/text><rect x=\"352\" y=\"115\" width=\"106\" height=\"33\" rx=\"10\" fill=\"#d9d9d9\"/><text x=\"405\" y=\"222\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">the same bag after the ice melts<\/text><line x1=\"200.0\" y1=\"110.0\" x2=\"310.0\" y2=\"110.0\" stroke=\"#222\" stroke-width=\"2.0\"/><polyline points=\"304.6,112.6 310.0,110.0 304.6,107.4\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.0\"/><text x=\"255\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"normal\" fill=\"#222\">melts<\/text><\/svg>", "mass_table": "<svg xmlns=\"http://www.  font-weight=\"normal\" fill=\"#222\">boils; 200 g of water vapor escapes<\/text><text x=\"450\" y=\"143\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#222\">300 g of water left<\/text><text x=\"280\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"normal\" fill=\"#222\">The mass after equals the mass before, minus anything that escaped.<\/text><\/svg>", "bal_rice_pasta": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 510 240\" style=\"width:100%;max-width:637px;height:auto\" role=\"img\" aria-label=\"Two balances: a bag of rice reads 800 g; a bag of pasta reads 500 g\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"510\" height=\"240\" fill=\"#ffffff\"/><rect x=\"40\" y=\"150\" width=\"150\" height=\"10\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"40\" y=\"160\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#f1f1f1\" stroke=\"#222\"/><rect x=\"80\" y=\"170\" width=\"70\" height=\"20\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"115\" y=\"185\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">800 g<\/text><rect x=\"78\" y=\"93\" width=\"75\" height=\"57\" rx=\"8\" fill=\"#f1f1f1\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"115\" y=\"222\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">a bag of rice<\/text><rect x=\"320\" y=\"150\" width=\"150\" height=\"10\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"320\" y=\"160\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#f1f1f1\" stroke=\"#222\"/><rect x=\"360\" y=\"170\" width=\"70\" height=\"20\" fill=\"#ffffff\" stroke=\"#222\"/><text x=\"395\" y=\"185\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#222\">500 g<\/text><rect x=\"365\" y=\"104\" width=\"60\" height=\"46\" rx=\"8\" fill=\"#f1f1f1\" stroke=\"#222\" stroke-width=\"1.5\"/><text x=\"395\" y=\"222\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">a bag of pasta<\/text><\/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
