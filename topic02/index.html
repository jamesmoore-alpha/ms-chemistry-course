 a liquid."], "why": "The paint was a liquid, and no solid turned into a liquid.<br>Melting is a solid turning into a liquid."}, {"type": "mcq", "tag": "fluency", "stem": "Solid coconut oil in a jar turns into a liquid on a hot day. Is this melting?", "options": ["yes", "no"], "key": 0, "fb": ["A solid turned into a liquid.", "A solid turned into a liquid, and that is melting."], "why": "The coconut oil was a solid and became a liquid.<br>A solid turning into a liquid is called melting."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Heating the ice made its particles…", "options": ["break out of their fixed positions and slide.", "stop moving."], "key": 0, "fb": ["Heating gives particles energy, so they vibrate harder and break loose.", "Heating speeds particles up; it never stops them."], "why": "Heating gives the particles energy.<br>They break out of their fixed positions and slide.<br>The ice melts."}]}, {"id": "L02", "atom": "MAT-021", "title": "Water freezes", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (a change of state and its particle reason); coins the term freezing", "check_design": "Type (c) → two recall MCQs first (L01 melting; T1 L04 cooling slows particles), the coined term straight after (typed, then a definition MCQ), then what (a fresh liquid cools) → why (free response, fresh case) → student-claim misconception (the particles stop moving completely) → transfer (melted metal in a mold), then a two-option fluency tail: melting or freezing.", "headache": ["A student pours water into an ice-cube tray.", "She puts the tray in a freezer at −18 °C.", "Three hours later every cube is solid.", "Nobody stirred or pressed the water.", "What happened to its particles?"], "forest": ["Why does a liquid freeze when it cools?", "Cooling takes energy away from the particles.", "The particles in the water move more and more slowly.", "They stop sliding past one another.", "They lock into fixed positions and only vibrate on the spot.", "The liquid has become a solid."], "article": [{"t": "idea", "text": "A student pours water into an ice-cube tray."}, {"t": "idea", "text": "She puts the tray in a freezer at −18 °C."}, {"t": "idea", "text": "Three hours later, every cube is solid."}, {"t": "idea", "text": "Nobody stirred or pressed the water."}, {"t": "idea", "text": "What happened to its particles?"}, {"t": "h", "text": "Zoom in on the water"}, {"t": "idea", "text": "Water is a liquid."}, {"t": "idea", "text": "In a liquid the particles touch but have no fixed positions."}, {"t": "idea", "text": "The particles slide past one another."}, {"t": "idea", "text": "The freezer air is much colder than the water."}, {"t": "idea", "text": "Heat flows out of the warm water into the cold freezer air."}, {"t": "idea", "text": "Cooling takes energy away from the particles."}, {"t": "idea", "text": "The water particles move more and more slowly."}, {"t": "h", "text": "Locking into place"}, {"t": "idea", "text": "The slow particles stop sliding past one another."}, {"t": "idea", "text": "Each particle locks into a fixed position."}, {"t": "idea", "text": "The particles still move: each particle vibrates on the spot."}, {"t": "fig", "key": "freeze_panels", "cap": "Freezing in three panels. Left: the liquid box, sixteen particles sliding. Middle: heat goes out and the particles lock into place. Right: the solid box, the same sixteen particles touching in fixed positions."}, {"t": "idea", "text": "The liquid has become a solid."}, {"t": "idea", "text": "The water has turned into ice."}, {"t": "idea", "text": "A liquid turning into a solid is called <b>freezing<\/b>."}, {"t": "idea", "text": "Freezing is melting run backwards."}, {"t": "idea", "text": "The ice cube holds the same particles that the water held."}, {"t": "idea", "text": "Only the arrangement and the movement of the particles changed."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider melted chocolate poured into a mold and put in a fridge."}, {"t": "idea", "text": "Heat flows out of the warm chocolate into the cold fridge air."}, {"t": "idea", "text": "Cooling takes energy away from the chocolate particles."}, {"t": "idea", "text": "The particles slow down and lock into fixed positions."}, {"t": "idea", "text": "The chocolate freezes into a solid bar."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Cooling takes energy away from particles. The particles in a liquid slow down, stop sliding and lock into fixed positions. The liquid freezes into a solid."}, {"t": "idea", "text": "Back to the tray: the cold freezer took energy away from the water particles."}, {"t": "idea", "text": "The particles slowed down and locked into fixed positions."}, {"t": "idea", "text": "So every cube of water froze into solid ice."}], "script": [{"say": "Here is a tray of water in a freezer at minus 18 degrees Celsius.", "screen": "[tray of water slides into a freezer; label −18 °C]"}, {"say": "Three hours later, every cube is solid.", "screen": "[clock runs 3 h; the cubes turn to ice]"}, {"say": "Nobody touched the water, so what happened to its particles?", "screen": "[chip: NOBODY TOUCHED IT; question mark over the tray]"}, {"say": "Water is a liquid: its particles touch, with no fixed positions, and slide past one another.", "screen": "[magnifier grows into the liquid box; particles slide; chip: NO FIXED POSITIONS]"}, {"say": "Heat flows out of the warm water into the cold freezer air.", "screen": "[arrow down under the box, labelled HEAT OUT]"}, {"say": "Cooling takes energy away from the particles, so they slow down.", "screen": "[chip: COOLING TAKES ENERGY AWAY; sliding slows]"}, {"say": "The slow particles stop sliding and lock into fixed positions.", "screen": "[middle panel: particles snap into the grid; chip: FIXED POSITIONS]"}, {"say": "Each particle still vibrates on the spot.", "screen": "[small jiggles; chip: VIBRATES ON THE SPOT]"}, {"say": "The liquid has become a solid.", "screen": "[label LIQUID becomes SOLID; ice cube beside the box]"}, {"say": "A liquid turning into a solid is called freezing.", "screen": "[chip: FREEZING]"}, {"say": "Freezing is melting run backwards.", "screen": "[the melting arrow reverses]"}, {"say": "The ice cube holds the same particles; only their arrangement and movement changed.", "screen": "[sixteen particles counted in both boxes; chip: SAME PARTICLES, NEW ARRANGEMENT]"}, {"say": "Now consider melted chocolate in a mold in a fridge.", "screen": "[liquid chocolate in a mold]"}, {"say": "Heat flows out, and cooling takes energy from its particles.", "screen": "[HEAT OUT arrow; chip: COOLING TAKES ENERGY AWAY]"}, {"say": "The particles lock into fixed positions, and the chocolate freezes.", "screen": "[particles snap into a grid; the bar pops out]"}, {"say": "Here is the rule: cooling takes energy away from particles.", "screen": "[rule slide reuses the three freezing panels; rule text line 1]"}, {"say": "The particles in a liquid slow down, stop sliding and lock into fixed positions.", "screen": "[rule text line 2]"}, {"say": "The liquid freezes into a solid.", "screen": "[rule text line 3]"}, {"say": "Back to the tray: the freezer took energy from the water particles, so they locked into place and froze.", "screen": "[tray in the freezer; HEAT OUT arrow; the tray of ice cubes]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "What is melting?", "options": ["a solid turning into a liquid", "a liquid turning into a solid", "a solid getting warmer but staying solid"], "key": 0, "fb": ["A solid turning into a liquid is called melting.", "A liquid turning into a solid is the reverse change. Melting is a solid turning into a liquid.", "A warm solid is still a solid. Melting is a solid turning into a liquid."], "why": "A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "recall", "stem": "A cup of tea cools from 60 °C to 20 °C. What happens to the speed of its particles?", "options": ["The particles move faster.", "The particles stop moving.", "The particles move more slowly."], "key": 2, "fb": ["Cooling slows particles down; heating speeds them up.", "Particles never stop moving. Cooling only slows them down.", "Cooling makes particles move more slowly."], "why": "Cooling a substance makes its particles move more slowly.<br>The tea is cooled, so its particles move more slowly."}, {"type": "text", "tag": "term", "stem": "What is a liquid turning into a solid called?", "accept": ["freezing", "freeze"], "why": "A liquid turning into a solid is called freezing."}, {"type": "mcq", "tag": "term", "stem": "What is freezing?", "options": ["a liquid getting colder but staying liquid", "a liquid turning into a solid", "a solid turning into a liquid"], "key": 1, "fb": ["A cold liquid is still a liquid. Freezing is a liquid turning into a solid.", "A liquid turning into a solid is called freezing.", "A solid turning into a liquid is melting. Freezing is a liquid turning into a solid."], "why": "A liquid turning into a solid is called freezing."}, {"type": "mcq", "tag": "what", "stem": "Hot, runny caramel is poured onto a tray and left to cool. What happens to the caramel?", "options": ["The caramel turns into a gas.", "The caramel stays a runny liquid.", "The caramel turns into a solid."], "key": 2, "fb": ["Cooling takes energy away; the liquid turns into a solid, not a gas.", "Cooling slows the particles until they lock into fixed positions.", "Cooling takes energy away from the particles, and the liquid freezes into a solid."], "why": "Heat flows out of the hot caramel into the cooler air.<br>Cooling takes energy away from the particles.<br>The particles slow down and lock into fixed positions.<br>So the caramel freezes into a solid."}, {"type": "frq", "tag": "why", "task": "A bucket of water is left outside on a very cold night. By morning the water has turned into ice. Explain why the water froze, using particles.", "starter": "The water froze because…", "model": "The water froze because heat flowed out of the water into the cold night air.<br>Cooling takes energy away from the particles.<br>The water particles moved more and more slowly.<br>The particles stopped sliding past one another.<br>Each particle locked into a fixed position, so the water is now solid ice.", "points": ["heat flowed out of the water, so cooling took energy away from its particles", "the particles slowed down and stopped sliding", "the particles locked into fixed positions, which is a solid"]}, {"type": "mcq", "tag": "misconception", "stem": "A puddle turns into ice on a cold night. Aisha says: \"The water particles have stopped moving completely.\" Is Aisha correct?", "options": ["yes", "no"], "key": 1, "fb": ["Particles never stop moving. In the ice each particle vibrates on the spot.", "Particles never stop moving. In the ice each particle vibrates on the spot."], "why": "Particles are always moving.<br>Cooling slowed the water particles down.<br>The particles locked into fixed positions.<br>In the ice each particle still vibrates on the spot."}, {"type": "mcq", "tag": "transfer", "stem": "Melted metal is poured into a mold and left to cool. What happens to the metal's particles as it cools?", "options": ["The particles slow down and lock into fixed positions.", "The particles speed up and fly apart.", "The particles keep sliding past one another."], "key": 0, "fb": ["Cooling takes energy away, so the particles slow down and lock into place.", "Cooling slows particles down; it does not speed them up.", "The slow particles stop sliding and lock into fixed positions."], "why": "Heat flows out of the hot metal into the cooler air and mold.<br>Cooling takes energy away from the particles.<br>The particles slow down and stop sliding.<br>Each particle locks into a fixed position, so the metal is now a solid."}, {"type": "mcq", "tag": "fluency", "stem": "Hailstones on a deck turn into water within an hour. Is this melting or freezing?", "options": ["melting", "freezing"], "key": 0, "fb": ["A solid turned into a liquid.", "A solid turned into a liquid. That is melting."], "why": "The hailstones were solid and became liquid water.<br>A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "fluency", "stem": "Olive oil turns solid in a cold garage. Is this melting or freezing?", "options": ["melting", "freezing"], "key": 1, "fb": ["A liquid turned into a solid. That is freezing.", "A liquid turned into a solid."], "why": "The olive oil was a liquid and became a solid.<br>A liquid turning into a solid is called freezing."}, {"type": "mcq", "tag": "fluency", "stem": "Hot lava flows down a hillside, cools and turns into solid rock. Is this melting or freezing?", "options": ["melting", "freezing"], "key": 1, "fb": ["A liquid turned into a solid. That is freezing.", "A liquid turned into a solid."], "why": "The lava was a liquid and became a solid.<br>A liquid turning into a solid is called freezing."}, {"type": "mcq", "tag": "fluency", "stem": "A frozen lake turns back into liquid water in spring. Is this melting or freezing?", "options": ["melting", "freezing"], "key": 0, "fb": ["A solid turned into a liquid.", "A solid turned into a liquid. That is melting."], "why": "The lake ice was a solid and became a liquid.<br>A solid turning into a liquid is called melting."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Cooling the water made its particles…", "options": ["fly apart.", "lock into fixed positions."], "key": 1, "fb": ["Cooling slows particles; flying apart is what a gas does.", "Slower particles stop sliding and lock into place."], "why": "Cooling takes energy away.<br>The particles slow, stop sliding, and lock into fixed positions.<br>The water freezes."}]}, {"id": "L03", "atom": "MAT-022", "script_cap_note": "two cases (evaporation and boiling) in one lesson on the register; the script carries both cases and the closing return, about 105 s — James to accept or split at the pan", "title": "Water turns to a gas: evaporation and boiling", "video": "definitely a video", "lesson_type": "Why / mechanism lesson with two cases (from the surface; all through the liquid); coins the terms water vapor, evaporation and boiling", "check_design": "Type (c) → one recall MCQ first (T1 L08 the gas arrangement; heating was recalled in L01 and L02), the coined terms straight after (water vapor typed, evaporation typed, boiling definition MCQ), then what (wet laundry dries) → why (free response, fresh case) → student-claim misconception (the bubbles are air) → transfer (rain on a car hood), then a two-option fluency tail: is this evaporation or boiling.", "headache": ["A puddle sits on a playground after rain.", "The sun comes out.", "By the afternoon the puddle has gone, and the ground is dry.", "Nobody mopped it up.", "Where did the water go?"], "forest": ["Where does a liquid go when it turns into a gas?", "Heating gives the particles energy.", "The fastest particles at the surface fly off into the air as a gas.", "Water as a gas is called water vapor.", "A liquid turning into a gas from its surface is called evaporation.", "Heat a pan of water to 100 °C and particles fly off all through the liquid, as bubbles of water vapor.", "That is called boiling."], "article": [{"t": "idea", "text": "A puddle sits on a playground after rain."}, {"t": "idea", "text": "The sun comes out."}, {"t": "idea", "text": "By the afternoon, the puddle has gone."}, {"t": "idea", "text": "The ground is dry."}, {"t": "idea", "text": "Nobody mopped it up."}, {"t": "idea", "text": "Where did the water go?"}, {"t": "h", "text": "Zoom in on the surface of the puddle"}, {"t": "idea", "text": "In the puddle the particles touch and slide past one another."}, {"t": "idea", "text": "The sun heats the puddle."}, {"t": "idea", "text": "Heating gives the particles energy."}, {"t": "idea", "text": "Some particles at the surface now move very fast."}, {"t": "idea", "text": "The fastest particles at the surface fly off into the air."}, {"t": "idea", "text": "In the air these particles are far apart and fly fast in every direction."}, {"t": "idea", "text": "So these particles are now a gas."}, {"t": "idea", "text": "Water as a gas is called <b>water vapor<\/b>."}, {"t": "h", "text": "Leaving from the surface"}, {"t": "idea", "text": "Particle after particle flies off the surface into the air."}, {"t": "idea", "text": "The puddle shrinks, and at last the puddle is gone."}, {"t": "idea", "text": "The water is still there, spread through the air as water vapor."}, {"t": "idea", "text": "A liquid turning into a gas from its surface is called <b>evaporation<\/b>."}, {"t": "idea", "text": "Evaporation happens at any temperature, warm or cool."}, {"t": "idea", "text": "A warmer liquid has more fast particles at its surface."}, {"t": "idea", "text": "So a warmer liquid evaporates faster."}, {"t": "h", "text": "Leaving from everywhere at once"}, {"t": "idea", "text": "Now consider a pan of water on a stove."}, {"t": "idea", "text": "The burner heats the water to 100 °C."}, {"t": "idea", "text": "Now particles all through the water have enough energy to fly apart."}, {"t": "idea", "text": "Deep inside the water, particles fly apart into pockets of gas."}, {"t": "idea", "text": "Each pocket of gas is a bubble of water vapor."}, {"t": "idea", "text": "The bubbles rise to the top and burst into the air."}, {"t": "idea", "text": "A liquid turning into a gas all through the liquid, as bubbles, is called <b>boiling<\/b>."}, {"t": "idea", "text": "The bubbles in boiling water are water vapor, not air."}, {"t": "fig", "key": "evap_boil", "cap": "Left: a puddle in the sun. The fastest particles at the surface fly off one at a time as water vapor. Right: a pan of water at 100 °C. Bubbles of water vapor form all through the water and rise."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Heating gives particles energy. The fastest particles at the surface of a liquid fly off as a gas: that is evaporation. At 100 °C, water particles fly off all through the liquid as bubbles of water vapor: that is boiling."}, {"t": "idea", "text": "Back to the playground: the sun gave the puddle's particles energy."}, {"t": "idea", "text": "The fastest particles flew off the surface, one after another."}, {"t": "idea", "text": "So the puddle evaporated into the air as water vapor."}], "script": [{"say": "Here is a puddle on a playground after rain.", "screen": "[puddle on a playground]"}, {"say": "The sun comes out, and by afternoon the puddle has gone.", "screen": "[sun appears; clock runs; puddle shrinks to nothing]"}, {"say": "Nobody mopped it up, so where did the water go?", "screen": "[question mark over the dry ground]"}, {"say": "The sun heats the puddle, giving its particles energy.", "screen": "[magnifier on the surface: liquid box; HEAT IN arrow; chip: HEATING GIVES ENERGY]"}, {"say": "The fastest surface particles fly off into the air.", "screen": "[one particle shoots up from the surface, then another]"}, {"say": "In the air these particles are far apart and flying: a gas.", "screen": "[particles above the surface scatter; label GAS]"}, {"say": "Water as a gas is called water vapor.", "screen": "[chip: WATER VAPOR]"}, {"say": "Particle after particle flies off, until the puddle is gone.", "screen": "[puddle shrinks as particles leave]"}, {"say": "A liquid turning into a gas from its surface is called evaporation.", "screen": "[chip: EVAPORATION]"}, {"say": "Evaporation happens at any temperature. A warmer liquid evaporates faster.", "screen": "[chip: ANY TEMPERATURE; a warm puddle shrinks faster than a cool one]"}, {"say": "Now consider a pan of water at 100 degrees Celsius.", "screen": "[pan on a burner; thermometer reads 100 °C]"}, {"say": "Particles all through the water fly apart into pockets of gas.", "screen": "[magnifier deep in the water; a bubble forms, drawn as the gas box]"}, {"say": "Each pocket is a bubble of water vapor. The bubbles rise and burst.", "screen": "[bubbles rise and burst at the top]"}, {"say": "A liquid turning into a gas all through the liquid, as bubbles, is called boiling.", "screen": "[chip: BOILING]"}, {"say": "The bubbles in boiling water are water vapor, not air.", "screen": "[chip: WATER VAPOR, NOT AIR]"}, {"say": "Here is the rule: heating gives particles energy.", "screen": "[rule slide reuses the puddle and the pan; rule text line 1]"}, {"say": "The fastest particles at the surface fly off as a gas: evaporation.", "screen": "[rule text line 2]"}, {"say": "At 100 degrees, water particles fly off all through the liquid as bubbles: boiling.", "screen": "[rule text line 3]"}, {"say": "Back to the playground: the sun gave the puddle's particles energy, and the fastest flew off as water vapor into the air.", "screen": "[the dry playground; vapor particles in the air]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "How are the particles in a gas arranged?", "options": ["touching, in fixed positions", "touching, with no fixed positions", "far apart, with empty space between them"], "key": 2, "fb": ["Particles touching in fixed positions are a solid. In a gas the particles are far apart.", "Particles touching with no fixed positions are a liquid. In a gas the particles are far apart.", "In a gas the particles are far apart, with empty space between them."], "why": "In a gas the particles are far apart, with empty space between them.<br>The gas particles fly fast in every direction."}, {"type": "text", "tag": "term", "stem": "What is water as a gas called?", "accept": ["water vapor", "vapor", "water vapour"], "why": "Water as a gas is called water vapor."}, {"type": "text", "tag": "term", "stem": "What is a liquid turning into a gas from its surface called?", "accept": ["evaporation", "evaporating", "evaporate"], "why": "A liquid turning into a gas from its surface is called evaporation."}, {"type": "mcq", "tag": "term", "stem": "What is boiling?", "options": ["a liquid turning into a gas from its surface only", "a liquid turning into a gas all through the liquid, as bubbles", "a gas turning back into a liquid"], "key": 1, "fb": ["A liquid turning into a gas from its surface only is evaporation. Boiling happens all through the liquid.", "Bubbles of gas form all through the liquid. That is boiling.", "A gas turning into a liquid is the reverse change. Boiling is a liquid turning into a gas, as bubbles."], "why": "A liquid turning into a gas all through the liquid, as bubbles, is called boiling."}, {"type": "mcq", "tag": "what", "stem": "Wet laundry hangs on a line on a breezy day. By evening the laundry is dry. What happened to the water?", "options": ["The water went into the air as a gas.", "The water soaked deeper into the cloth.", "The water went into the air as tiny drops of liquid."], "key": 0, "fb": ["The fastest particles flew off the surface into the air as water vapor.", "The cloth is dry, so the water is not in it. The water left as a gas.", "Tiny drops are liquid water. The water left the cloth as single particles, far apart: a gas."], "why": "Some particles at the surface of the wet cloth move fast enough to fly off into the air as water vapor.<br>Particle after particle left, so the laundry dried."}, {"type": "frq", "tag": "why", "task": "A shallow dish of water is left on a sunny windowsill. Three days later the dish is empty. Explain where the water went, using particles.", "starter": "The water went…", "model": "The water went into the air as water vapor.<br>The sun heated the water and gave its particles energy.<br>The fastest particles at the surface flew off into the air.<br>In the air these particles are far apart and fly in every direction, so they are a gas.<br>Particle after particle left until the dish was empty.", "points": ["the water is in the air as water vapor (a gas)", "heating gave the particles energy", "the fastest particles at the surface flew off, one after another, until none were left"]}, {"type": "mcq", "tag": "misconception", "stem": "Water in a glass teapot on a stove reaches 100 °C, and bubbles rise through it. Ravi says: \"The bubbles are made of air.\" Is Ravi correct?", "options": ["yes", "no"], "key": 1, "fb": ["The bubbles are water vapor. Water particles all through the teapot fly apart into pockets of gas.", "The bubbles are water vapor. Water particles all through the teapot fly apart into pockets of gas."], "why": "At 100 °C the water particles all through the teapot have enough energy to fly apart.<br>The particles fly apart into pockets of gas.<br>Each pocket is a bubble of water vapor, not air."}, {"type": "mcq", "tag": "transfer", "stem": "Rain leaves drops on the hood of a car. An hour of sunshine later, the hood is dry. What happened to the water?", "options": ["The water turned into a solid.", "The water soaked into the metal.", "The fastest water particles flew off the surface into the air as a gas."], "key": 2, "fb": ["Nothing cooled the water. Its particles flew off into the air as a gas.", "Water cannot soak into metal. The hood is dry because the water left as a gas.", "The fastest particles at the surface flew off into the air. That is evaporation."], "why": "The fastest water particles at the surface flew off into the air as a gas.<br>Particle after particle left, so the hood dried.<br>The water evaporated."}, {"type": "mcq", "tag": "fluency", "stem": "Water in a pot over a campfire reaches 100 °C, and bubbles form all through it. Is this evaporation or boiling?", "options": ["evaporation", "boiling"], "key": 1, "fb": ["Evaporation happens from the surface only. Here bubbles form all through the water.", "Bubbles of gas form all through the liquid. That is boiling."], "why": "Bubbles of gas form all through the water.<br>A liquid turning into a gas all through the liquid, as bubbles, is called boiling."}, {"type": "mcq", "tag": "fluency", "stem": "A wet towel dries slowly on a hook. Is this evaporation or boiling?", "options": ["evaporation", "boiling"], "key": 0, "fb": ["The water left the surface of the towel a particle at a time. That is evaporation.", "No bubbles formed; the towel is not at 100 °C. The water left from the surface."], "why": "The water left the towel from its surface, a particle at a time.<br>A liquid turning into a gas from its surface is called evaporation."}, {"type": "mcq", "tag": "fluency", "stem": "Sweat disappears from a runner's skin. Is this evaporation or boiling?", "options": ["evaporation", "boiling"], "key": 0, "fb": ["The sweat left the skin's surface a particle at a time. That is evaporation.", "No bubbles formed; skin is far below 100 °C. The sweat left from the surface."], "why": "The sweat left from its surface, a particle at a time.<br>A liquid turning into a gas from its surface is called evaporation."}, {"type": "mcq", "tag": "fluency", "stem": "A pot of chili on a stove reaches 100 °C, and bubbles rise all through it. Is this evaporation or boiling?", "options": ["evaporation", "boiling"], "key": 1, "fb": ["Evaporation happens from the surface only. Here bubbles form all through the chili.", "Bubbles form all through the liquid. That is boiling."], "why": "Bubbles form all through the chili.<br>A liquid turning into a gas all through the liquid, as bubbles, is called boiling."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The bubbles in the boiling water are made of…", "options": ["air", "water vapor"], "key": 1, "fb": ["The bubbles are water that has turned into a gas.", "Boiling makes bubbles of water vapor all through the water."], "why": "In boiling water, particles fly off all through the liquid as bubbles of water vapor."}]}, {"id": "L04", "atom": "MAT-023", "title": "Water vapor turns back to liquid", "video": "definitely a video", "lesson_type": "Why / mechanism lesson (a change of state and its particle reason); coins the term condensation", "check_design": "Type (c) → two recall MCQs first (L03 water vapor; T1 L04 cooling slows particles), the coined term straight after (typed, then a definition MCQ), then what (a bathroom mirror fogs) → why (free response, fresh case) → student-claim misconception (the water leaked through) → transfer (dew on grass), then a two-option fluency tail: condensation or evaporation.", "headache": ["A student takes a can of soda out of the fridge on a warm, humid day.", "Within a minute the outside of the can is covered in drops of water.", "The can was dry when it came out.", "Where did the water come from?"], "forest": ["Where do the drops on a cold can come from?", "The air holds water vapor: water particles flying about as a gas.", "Heat flows from the warm air to the cold can, so the air next to the can cools.", "Water vapor particles that hit the cold can slow down.", "They crowd together, touching, and slide past one another.", "The gas has become a liquid on the can.", "A gas turning into a liquid is called condensation."], "article": [{"t": "idea", "text": "A student takes a can of soda out of the fridge on a warm, humid day."}, {"t": "idea", "text": "Within a minute, the outside of the can is covered in drops of water."}, {"t": "idea", "text": "The can was dry when it came out of the fridge."}, {"t": "idea", "text": "Where did the water come from?"}, {"t": "h", "text": "Zoom in on the air next to the can"}, {"t": "idea", "text": "The air in the room holds water vapor."}, {"t": "idea", "text": "Water vapor is water particles flying about as a gas, far apart."}, {"t": "idea", "text": "The can is much colder than the air."}, {"t": "idea", "text": "Heat always flows from a warmer thing to a colder thing."}, {"t": "idea", "text": "So heat flows from the warm air into the cold can."}, {"t": "idea", "text": "The air next to the can cools."}, {"t": "idea", "text": "Cooling takes energy away from the particles."}, {"t": "h", "text": "Crowding together"}, {"t": "idea", "text": "Water vapor particles hit the cold can and slow down."}, {"t": "idea", "text": "The slow particles no longer fly apart."}, {"t": "idea", "text": "The slow particles crowd together on the can, touching."}, {"t": "idea", "text": "Now the particles touch but have no fixed positions."}, {"t": "idea", "text": "They slide past one another."}, {"t": "fig", "key": "can_condense", "cap": "The gas box beside a cold can. Heat goes out of the air into the can. Water vapor particles that hit the can slow down and crowd together as the liquid box on its surface."}, {"t": "idea", "text": "The gas has become a liquid."}, {"t": "idea", "text": "The water vapor has turned into drops of liquid water on the can."}, {"t": "idea", "text": "A gas turning into a liquid is called <b>condensation<\/b>."}, {"t": "idea", "text": "Condensation is evaporation run backwards."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a car window on a cold morning, with people breathing inside."}, {"t": "idea", "text": "The air inside the car holds water vapor."}, {"t": "idea", "text": "Heat flows from the warm air into the cold glass."}, {"t": "idea", "text": "Water vapor particles that hit the glass slow down and crowd together."}, {"t": "idea", "text": "The water vapor condenses into a mist of tiny drops on the glass."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Cooling takes energy away from particles. Gas particles that touch a cold surface slow down and crowd together, touching and sliding. The gas condenses into a liquid."}, {"t": "idea", "text": "Back to the can: the cold can took energy away from the water vapor particles that hit it."}, {"t": "idea", "text": "The particles slowed down and crowded together, touching."}, {"t": "idea", "text": "So water vapor from the air condensed into drops on the can."}], "script": [{"say": "Here is a can of soda from the fridge on a warm, humid day.", "screen": "[cold can; chips: WARM, HUMID]"}, {"say": "Within a minute, the can is covered in drops of water.", "screen": "[clock runs 1 min; drops appear on the can]"}, {"say": "The can was dry, so where did the water come from?", "screen": "[question mark beside the can]"}, {"say": "The air holds water vapor: water particles flying about as a gas.", "screen": "[magnifier: gas box beside the can wall; label WATER VAPOR]"}, {"say": "Heat always flows from a warmer thing to a colder thing.", "screen": "[chip: HEAT FLOWS WARM TO COLD]"}, {"say": "So heat flows from the warm air into the cold can.", "screen": "[HEAT OUT arrow from the air into the can]"}, {"say": "Cooling takes energy away from the particles.", "screen": "[chip: COOLING TAKES ENERGY AWAY]"}, {"say": "Water vapor particles hit the cold can and slow down.", "screen": "[a particle hits the can wall; its arrow shortens]"}, {"say": "The slow particles crowd together on the can, touching.", "screen": "[particles gather on the wall into a heap]"}, {"say": "Now the particles touch and slide past one another.", "screen": "[liquid box on the can wall; chip: SLIDE PAST]"}, {"say": "The gas has become a liquid.", "screen": "[label GAS becomes LIQUID; drops on the can]"}, {"say": "A gas turning into a liquid is called condensation.", "screen": "[chip: CONDENSATION]"}, {"say": "Condensation is evaporation run backwards.", "screen": "[the evaporation arrow reverses]"}, {"say": "Now consider a cold car window.", "screen": "[car interior; cold glass]"}, {"say": "Water vapor from people's breath hits the glass, slows down and crowds together.", "screen": "[particles gather on the glass]"}, {"say": "The window mists over.", "screen": "[mist spreads across the glass]"}, {"say": "Here is the rule: cooling takes energy away from particles.", "screen": "[rule slide reuses the can and the gas box; rule text line 1]"}, {"say": "Gas particles that touch a cold surface slow down and crowd together, touching and sliding.", "screen": "[rule text line 2]"}, {"say": "The gas condenses into a liquid.", "screen": "[rule text line 3]"}, {"say": "Back to the can: the cold can took energy from the vapor particles, so they crowded into drops.", "screen": "[the can; HEAT OUT arrow; drops on the can]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "What is water vapor?", "options": ["water as a solid", "water as a liquid", "water as a gas"], "key": 2, "fb": ["Water as a solid is ice.", "Water as a liquid is just water.", "Water as a gas is called water vapor."], "why": "Water as a gas is called water vapor."}, {"type": "mcq", "tag": "recall", "stem": "A mug of cocoa cools from 80 °C to 40 °C. What happens to the speed of its particles?", "options": ["The particles move more slowly.", "The particles move faster.", "The speed of the particles does not change."], "key": 0, "fb": ["Cooling makes particles move more slowly.", "Heating speeds particles up; cooling slows them down.", "Cooling changes the speed of the particles: they move more slowly."], "why": "Cooling a substance makes its particles move more slowly.<br>The cocoa is cooled, so its particles move more slowly."}, {"type": "text", "tag": "term", "stem": "What is a gas turning into a liquid called?", "accept": ["condensation", "condensing", "condense"], "why": "A gas turning into a liquid is called condensation."}, {"type": "mcq", "tag": "term", "stem": "What is condensation?", "options": ["a liquid turning into a gas", "a gas turning into a liquid", "a gas getting colder but staying a gas"], "key": 1, "fb": ["A liquid turning into a gas is evaporation. Condensation is a gas turning into a liquid.", "A gas turning into a liquid is called condensation.", "A cold gas is still a gas. Condensation is a gas turning into a liquid."], "why": "A gas turning into a liquid is called condensation."}, {"type": "mcq", "tag": "what", "stem": "During a hot shower, the bathroom mirror fogs up. What forms on the mirror?", "options": ["tiny drops of liquid water", "a thin layer of ice", "a layer of soap"], "key": 0, "fb": ["Water vapor from the shower hit the cooler mirror and condensed into tiny drops.", "The mirror is cooler than the air, but not cold enough to turn the water into ice. The water vapor condensed into liquid drops.", "Soap did not reach the mirror. Water vapor condensed on it."], "why": "The hot shower filled the air with water vapor.<br>The mirror is cooler than the air, so heat flows from the air into the mirror.<br>Water vapor particles that hit the mirror slow down and crowd together.<br>The water vapor condenses into tiny drops of liquid water."}, {"type": "frq", "tag": "why", "task": "A man walks from a cold street into a warm, crowded café. His eyeglasses fog up at once. Explain where the fog on his glasses came from, using particles.", "starter": "The fog came from…", "model": "The fog came from the water vapor in the warm café air.<br>The glasses are much colder than the air, so heat flows from the air into the glasses.<br>Cooling takes energy away from the particles.<br>Water vapor particles that hit the cold glasses slow down.<br>The slow particles crowd together, touching, so the water vapor condenses into tiny drops on the glasses.", "points": ["the water came from water vapor in the air", "the cold glasses took energy away from the water vapor particles that hit them", "the slow particles crowded together as a liquid (condensation)"]}, {"type": "mcq", "tag": "misconception", "stem": "On a humid summer day, the outside of a toilet's cold water tank is wet. Sam says: \"Water is leaking through the tank.\" Is Sam correct?", "options": ["yes", "no"], "key": 1, "fb": ["The water came from water vapor in the air. The water vapor condensed on the cold tank.", "The water came from water vapor in the air. The water vapor condensed on the cold tank."], "why": "The tank is not leaking.<br>The air holds water vapor.<br>Water vapor particles that hit the cold tank slow down and crowd together.<br>The water vapor condenses into drops on the outside of the tank."}, {"type": "mcq", "tag": "transfer", "stem": "On a cool morning, drops of water cover the grass in a garden. Nobody watered the grass, and no rain fell. Where did the drops come from?", "options": ["from inside the grass blades", "from the soil, pushed up through the blades", "from water vapor in the air"], "key": 2, "fb": ["The grass did not leak. Water vapor in the air condensed on the cold blades.", "The soil did not push water up. Water vapor in the air condensed on the cold blades.", "Water vapor in the air condensed on the cold grass into drops."], "why": "The air holds water vapor.<br>The grass cooled overnight, so heat flows from the air into the cold blades.<br>Water vapor particles that hit the cold grass slow down and crowd together.<br>The water vapor condenses into drops."}, {"type": "mcq", "tag": "fluency", "stem": "The inside of a tent is covered in drops on a cold morning. Is this condensation or evaporation?", "options": ["condensation", "evaporation"], "key": 0, "fb": ["A gas turned into a liquid on the cold tent.", "A gas turned into a liquid, not the other way. That is condensation."], "why": "Water vapor in the tent's air turned into liquid drops on the cold fabric.<br>A gas turning into a liquid is called condensation."}, {"type": "mcq", "tag": "fluency", "stem": "A wet sidewalk dries in the sun. Is this condensation or evaporation?", "options": ["condensation", "evaporation"], "key": 1, "fb": ["A liquid turned into a gas, not the other way. That is evaporation.", "A liquid turned into a gas from its surface."], "why": "The water on the sidewalk turned into a gas from its surface.<br>A liquid turning into a gas from its surface is called evaporation."}, {"type": "mcq", "tag": "fluency", "stem": "A swimmer's wet hair dries in the wind. Is this condensation or evaporation?", "options": ["condensation", "evaporation"], "key": 1, "fb": ["A liquid turned into a gas, not the other way. That is evaporation.", "A liquid turned into a gas from its surface."], "why": "The water in the hair turned into a gas from its surface.<br>A liquid turning into a gas from its surface is called evaporation."}, {"type": "mcq", "tag": "fluency", "stem": "Drops form on the outside of a jug of cold milk on a hot day. Is this condensation or evaporation?", "options": ["condensation", "evaporation"], "key": 0, "fb": ["A gas turned into a liquid on the cold jug.", "A gas turned into a liquid, not the other way. That is condensation."], "why": "Water vapor in the air turned into liquid drops on the cold jug.<br>A gas turning into a liquid is called condensation."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Where did the drops on the cold can come from?", "options": ["water vapor in the air", "inside the can"], "key": 0, "fb": ["Water vapor particles hit the cold can, slowed, and crowded into drops.", "The can was sealed. The water came from the air."], "why": "Water vapor particles in the air hit the cold can.<br>They slow down and crowd together into liquid drops."}]}, {"id": "L05", "atom": "MAT-024", "title": "Straight from solid to gas", "video": "definitely a video", "lesson_type": "Example-sequence classification lesson (melting or sublimation, judged by whether a liquid ever formed); coins the term sublimation; shows the full state-change map", "check_design": "Type (a) one-step sort → two recall MCQs first (L01 melting; L03 what gas particles do), the coined term straight after (typed, then a definition MCQ), then a fluency quiz, two options (melting / sublimation), six fresh described cases, then one student-claim misconception item (it melted very fast).", "headache": ["A block of dry ice sits in a bowl at a party.", "Over the evening the block shrinks and disappears.", "The bowl stays dry: no puddle, no water.", "Ice would have left a puddle.", "Where did the dry ice go?"], "forest": ["Can a solid turn into a gas without melting first?", "Dry ice is frozen carbon dioxide, not frozen water.", "Warm dry ice, and its particles fly straight off the solid into the air as a gas.", "The particles never slide as a liquid in between.", "A solid turning straight into a gas is called sublimation.", "Melting goes solid to liquid; sublimation skips the liquid altogether."], "article": [{"t": "idea", "text": "A block of dry ice sits in a bowl at a party."}, {"t": "idea", "text": "Over the evening, the block shrinks and disappears."}, {"t": "idea", "text": "The bowl stays dry: no puddle, no water."}, {"t": "idea", "text": "A block of ordinary ice would have left a puddle."}, {"t": "idea", "text": "Where did the dry ice go?"}, {"t": "h", "text": "Ordinary ice first"}, {"t": "idea", "text": "Warm ordinary ice."}, {"t": "idea", "text": "Heating gives its particles energy."}, {"t": "idea", "text": "The particles break loose and slide as a liquid."}, {"t": "idea", "text": "The ice melts into a puddle."}, {"t": "idea", "text": "Warm the puddle further, and the fastest particles fly off as water vapor."}, {"t": "idea", "text": "So ordinary ice goes solid, then liquid, then gas."}, {"t": "h", "text": "Now the dry ice"}, {"t": "idea", "text": "Dry ice is not frozen water."}, {"t": "idea", "text": "Dry ice is frozen carbon dioxide, the gas we breathe out."}, {"t": "idea", "text": "Warm dry ice."}, {"t": "idea", "text": "Heating gives its particles energy."}, {"t": "idea", "text": "The particles fly straight off the solid as a gas."}, {"t": "idea", "text": "No puddle ever forms."}, {"t": "idea", "text": "The particles never slide past one another as a liquid in between."}, {"t": "idea", "text": "So the bowl stays dry."}, {"t": "h", "text": "The name"}, {"t": "idea", "text": "A solid turning straight into a gas is called <b>sublimation<\/b>."}, {"t": "idea", "text": "Melting goes solid to liquid."}, {"t": "idea", "text": "Sublimation skips the liquid altogether."}, {"t": "h", "text": "The whole map"}, {"t": "fig", "key": "state_map", "cap": "The state-change map: the solid, liquid and gas boxes. Melting and freezing run between solid and liquid. Evaporation, boiling and condensation run between liquid and gas. Sublimation runs straight from solid to gas."}, {"t": "idea", "text": "The changes in this topic each have a name on this map."}, {"t": "idea", "text": "To tell melting from sublimation, ask one question: did a liquid ever form?"}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "A snowman shrinks in the sun, and water runs off it."}, {"t": "idea", "text": "A liquid formed, so the snow is melting."}, {"t": "idea", "text": "A mothball in a closet shrinks over months, and nothing wet ever appears."}, {"t": "idea", "text": "No liquid formed, so the mothball is subliming."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Melting is a solid turning into a liquid. Sublimation is a solid turning straight into a gas, skipping the liquid. If a liquid formed, the solid melted; if no liquid ever formed, the solid sublimed."}, {"t": "idea", "text": "Back to the party: the dry ice particles flew straight off the solid into the air as carbon dioxide gas."}, {"t": "idea", "text": "No liquid ever formed, so the bowl stayed dry."}], "script": [{"say": "Here is a block of dry ice in a bowl at a party.", "screen": "[block in a bowl; label DRY ICE]"}, {"say": "Over the evening the block disappears, and the bowl stays dry.", "screen": "[clock runs; block shrinks to nothing; chip: NO PUDDLE]"}, {"say": "Ice would have left a puddle, so where did the dry ice go?", "screen": "[a second bowl: an ice block becomes a puddle; question mark]"}, {"say": "Warm ordinary ice, and its particles break loose and slide: the ice melts into a puddle.", "screen": "[ice block; solid box becomes liquid box; puddle; label MELTING]"}, {"say": "Warm the puddle, and its fastest particles fly off: the puddle evaporates.", "screen": "[particles leave the surface; label EVAPORATION]"}, {"say": "Dry ice is not frozen water; it is frozen carbon dioxide.", "screen": "[dry ice block; label CARBON DIOXIDE, the gas we breathe out; magnifier: solid box]"}, {"say": "Warm dry ice, and its particles fly straight off as gas.", "screen": "[HEAT IN arrow; particles leave the solid grid directly; gas box]"}, {"say": "The particles never slide as a liquid, so no puddle forms.", "screen": "[the liquid box is skipped, crossed out]"}, {"say": "A solid turning straight into a gas is called sublimation.", "screen": "[chip: SUBLIMATION]"}, {"say": "Here is the whole map.", "screen": "[state map: melting, freezing, evaporation, boiling, condensation, sublimation]"}, {"say": "To tell melting from sublimation, ask: did a liquid form?", "screen": "[chip: DID A LIQUID FORM?]"}, {"say": "A snowman shrinks and water runs off: a liquid formed, so the snow is melting.", "screen": "[snowman with a puddle; tick under MELTING]"}, {"say": "A mothball shrinks over months and nothing wet appears: no liquid, so the mothball is subliming.", "screen": "[mothball shrinking on a dry shelf; tick under SUBLIMATION]"}, {"say": "Here is the rule: melting is solid to liquid; sublimation is solid straight to gas.", "screen": "[rule slide reuses the state map; rule text line 1]"}, {"say": "If a liquid formed, the solid melted; if not, the solid sublimed.", "screen": "[rule text line 2]"}, {"say": "Back to the party: the dry ice particles flew straight off as gas, so the bowl stayed dry.", "screen": "[the dry bowl; gas particles above it]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "What is melting?", "options": ["a solid turning into a liquid", "a liquid turning into a gas", "a liquid turning into a solid"], "key": 0, "fb": ["A solid turning into a liquid is called melting.", "A liquid turning into a gas is evaporation or boiling. Melting is a solid turning into a liquid.", "A liquid turning into a solid is freezing. Melting is a solid turning into a liquid."], "why": "A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "recall", "stem": "How do the particles in a gas move?", "options": ["Each particle vibrates on the spot.", "The particles slide past one another.", "The particles fly fast in every direction."], "key": 2, "fb": ["Vibrating on the spot is what particles do in a solid. In a gas the particles fly fast in every direction.", "Sliding past one another is what particles do in a liquid. In a gas the particles fly fast in every direction.", "In a gas the particles fly fast in every direction."], "why": "In a gas the particles are far apart, and they fly fast in every direction."}, {"type": "text", "tag": "term", "stem": "What is a solid turning straight into a gas called?", "accept": ["sublimation", "subliming", "sublime"], "why": "A solid turning straight into a gas is called sublimation."}, {"type": "mcq", "tag": "term", "stem": "What is sublimation?", "options": ["a solid turning into a liquid, then a gas", "a solid turning straight into a gas", "a gas turning straight into a solid"], "key": 1, "fb": ["A solid turning into a liquid, then a gas, is melting followed by evaporation. Sublimation skips the liquid.", "A solid turning straight into a gas is called sublimation.", "Sublimation runs from solid to gas, not gas to solid."], "why": "A solid turning straight into a gas is called sublimation.<br>No liquid ever forms."}, {"type": "mcq", "tag": "fluency", "stem": "A gummy bear left in a pocket on a hot day turns into a sticky liquid. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 0, "fb": ["A liquid formed.", "A liquid formed, so the solid melted."], "why": "A liquid formed.<br>A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "fluency", "stem": "A solid air freshener in a car shrinks to nothing over a month. Nothing wet ever appears. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 1, "fb": ["No liquid ever formed, so the solid did not melt.", "No liquid ever formed."], "why": "No liquid ever formed.<br>A solid turning straight into a gas is called sublimation."}, {"type": "mcq", "tag": "fluency", "stem": "A bag of frozen vegetables left in a freezer for a year has shrunk and dried out. No water ever collected in the bag. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 1, "fb": ["No water ever collected, so the ice in the vegetables did not melt.", "No liquid ever formed."], "why": "No liquid ever formed.<br>A solid turning straight into a gas is called sublimation."}, {"type": "mcq", "tag": "fluency", "stem": "An ice sculpture at a wedding slowly turns into a pool of water on the table. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 0, "fb": ["A liquid formed.", "A liquid formed, so the solid melted."], "why": "A liquid formed.<br>A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "fluency", "stem": "A tub of lip balm left on a sunny windowsill turns runny. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 0, "fb": ["A liquid formed.", "A liquid formed, so the solid melted."], "why": "A liquid formed.<br>A solid turning into a liquid is called melting."}, {"type": "mcq", "tag": "fluency", "stem": "A dark gray solid called iodine is warmed gently in a dish. A purple gas rises from it, and the dish stays dry. Is this melting or sublimation?", "options": ["melting", "sublimation"], "key": 1, "fb": ["No liquid ever formed, so the solid did not melt.", "No liquid ever formed."], "why": "No liquid ever formed.<br>A solid turning straight into a gas is called sublimation."}, {"type": "mcq", "tag": "misconception", "stem": "Frost covers a car windshield on a very cold, dry morning. By noon the frost has gone, and the glass never got wet. Ben says: \"The frost melted very fast.\" Is Ben correct?", "options": ["yes", "no"], "key": 1, "fb": ["No liquid ever formed. The frost turned straight into a gas: sublimation.", "No liquid ever formed. The frost turned straight into a gas: sublimation."], "why": "Melting makes a liquid.<br>The glass never got wet, so no liquid ever formed.<br>The frost particles flew straight off the solid into the air as a gas.<br>The frost sublimed."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The dry ice shrank away and left no puddle. It went…", "options": ["from solid to liquid to gas.", "straight from solid to gas."], "key": 1, "fb": ["No liquid ever formed.", "That is sublimation: the liquid stage is skipped."], "why": "The particles flew straight off the solid as a gas.<br>No liquid formed.<br>That is sublimation."}]}, {"id": "L06", "atom": "MAT-025", "title": "Same substance, different state", "video": "could do without a video", "lesson_type": "Why / mechanism lesson (a fact and its particle reason); coins no term", "check_design": "Type (c) → one recall MCQ first (L01: what happens to the particles when a solid melts), then what (melted copper: still copper?) → a second what (evaporated alcohol: still alcohol?) → why (free response, fresh case) → student-claim misconception (water vapor is a different substance) → transfer (thawed orange juice), then a yes / no fluency tail: is it still the same substance, on four fresh cases.", "headache": ["A candle burns on a table.", "Wax near the flame melts and runs down the side.", "At the bottom it cools and hardens into lumps.", "Is the hardened lump still the same wax?", "Is the melted wax still wax at all?"], "forest": ["Does a substance become something new when it changes state?", "The wax particles never changed.", "When the wax melted, the same particles broke out of fixed positions and slid.", "When it hardened, the same particles locked back into fixed positions.", "Only the arrangement and the movement of the particles changed.", "So melted wax is still wax, and hardened wax is still wax.", "A change of state never makes a new substance."], "article": [{"t": "idea", "text": "A candle burns on a table."}, {"t": "idea", "text": "Wax near the flame melts and runs down the side."}, {"t": "idea", "text": "At the bottom, the runny wax cools and hardens into lumps."}, {"t": "idea", "text": "Is the hardened lump still the same wax?"}, {"t": "idea", "text": "Is the melted wax still wax at all?"}, {"t": "h", "text": "Zoom in on the wax"}, {"t": "idea", "text": "The candle is made of wax particles."}, {"t": "idea", "text": "Near the flame, heating gave the wax particles energy."}, {"t": "idea", "text": "The same wax particles broke out of their fixed positions and slid past one another."}, {"t": "idea", "text": "So the wax melted."}, {"t": "idea", "text": "At the bottom, cooling took energy away from the wax particles."}, {"t": "idea", "text": "The same wax particles slowed down and locked back into fixed positions."}, {"t": "idea", "text": "So the wax froze into a hard lump."}, {"t": "h", "text": "What changed, and what did not"}, {"t": "fig", "key": "same_particles_three", "cap": "The solid, liquid and gas boxes side by side, with the same sixteen particles in each. Only the arrangement and the movement of the particles differ. The particles themselves are the same every time."}, {"t": "idea", "text": "The wax particles never changed."}, {"t": "idea", "text": "Only the arrangement and the movement of the particles changed."}, {"t": "idea", "text": "The same particles make the same substance."}, {"t": "idea", "text": "So melted wax is still wax, and hardened wax is still wax."}, {"t": "h", "text": "Water in three states"}, {"t": "idea", "text": "Now consider water."}, {"t": "idea", "text": "Ice, liquid water and water vapor are all made of the same water particles."}, {"t": "idea", "text": "Melt the ice, and the same particles slide instead of vibrating on the spot."}, {"t": "idea", "text": "Boil the water, and the same particles fly instead of sliding."}, {"t": "idea", "text": "Ice is water, liquid water is water, and water vapor is water."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A change of state never makes a new substance. The same particles are there before and after; only their arrangement and their movement change."}, {"t": "idea", "text": "Back to the candle: the melted wax is still wax."}, {"t": "idea", "text": "The hardened lump is still the same wax."}, {"t": "idea", "text": "Only the arrangement and the movement of its particles changed, and then changed back."}], "script": [{"say": "Here is a candle burning.", "screen": "[candle with a flame]"}, {"say": "Wax near the flame melts and runs down the side.", "screen": "[runny wax runs down]"}, {"say": "At the bottom, the wax cools and hardens into lumps.", "screen": "[lumps form at the base]"}, {"say": "Is the lump still the same wax, and is the melted wax still wax?", "screen": "[question marks on the lump and the runny wax]"}, {"say": "Near the flame, heating gave the wax particles energy.", "screen": "[magnifier: solid box; HEAT IN arrow]"}, {"say": "The same particles broke out of their fixed positions, so the wax melted.", "screen": "[solid box becomes liquid box; label MELTING]"}, {"say": "At the bottom, cooling took energy away from the wax particles.", "screen": "[HEAT OUT arrow]"}, {"say": "The same particles locked back into fixed positions, so the wax froze.", "screen": "[liquid box becomes solid box; label FREEZING]"}, {"say": "Look at the three boxes.", "screen": "[three boxes side by side, sixteen particles each]"}, {"say": "The particles never changed; only their arrangement and movement changed.", "screen": "[chips: SAME PARTICLES; ONLY ARRANGEMENT AND MOVEMENT CHANGE]"}, {"say": "The same particles make the same substance.", "screen": "[chip: SAME PARTICLES, SAME SUBSTANCE]"}, {"say": "So melted wax is still wax, and hardened wax is still wax.", "screen": "[label WAX over all three boxes]"}, {"say": "Now consider water: ice, liquid water and water vapor are the same particles.", "screen": "[labels change to ICE, WATER, WATER VAPOR]"}, {"say": "Melt the ice or boil the water, and the same particles only move differently.", "screen": "[particles animate: vibrate, slide, fly]"}, {"say": "Ice is water, liquid water is water, and water vapor is water.", "screen": "[label WATER over all three boxes]"}, {"say": "Here is the rule: a change of state never makes a new substance.", "screen": "[rule slide reuses the three boxes; rule text line 1]"}, {"say": "The same particles are there before and after; only their arrangement and movement change.", "screen": "[rule text line 2]"}, {"say": "Back to the candle: the melted wax and the hardened lump are both still wax.", "screen": "[the candle; the lumps]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A solid melts. What happens to its particles?", "options": ["The particles break out of their fixed positions and slide past one another.", "The particles stop moving.", "The particles turn into different particles."], "key": 0, "fb": ["Heating gives the particles energy, and they break loose and slide.", "Particles never stop moving. Heating gives them energy.", "The particles stay the same. Only their arrangement and movement change."], "why": "Heating gives the particles energy.<br>The particles break out of their fixed positions and slide past one another.<br>The particles themselves do not change."}, {"type": "mcq", "tag": "what", "stem": "A copper wire is melted in a furnace. Is the liquid still copper?", "options": ["yes", "no"], "key": 0, "fb": ["The same copper particles are there; only their arrangement and movement changed.", "The same copper particles are there; only their arrangement and movement changed."], "why": "Solid copper and liquid copper are made of the same copper particles.<br>Melting changed only the arrangement and the movement of the particles.<br>So the liquid is still copper."}, {"type": "mcq", "tag": "what", "stem": "Rubbing alcohol evaporates from a cloth into the air. Is the gas in the air still rubbing alcohol?", "options": ["yes", "no"], "key": 0, "fb": ["The same alcohol particles are there, now far apart and flying.", "The same alcohol particles are there, now far apart and flying."], "why": "The gas is made of the same alcohol particles as the liquid.<br>Evaporation changed only the arrangement and the movement of the particles.<br>So the gas is still rubbing alcohol."}, {"type": "frq", "tag": "why", "task": "A jeweler melts a silver spoon, pours the liquid silver into a mold and lets it harden into a ring. Explain why the ring is still silver.", "starter": "The ring is still silver because…", "model": "The ring is still silver because its particles never changed.<br>When the spoon melted, the same silver particles broke out of their fixed positions and slid.<br>When the silver hardened, the same particles locked back into fixed positions.<br>Only the arrangement and the movement of the particles changed.<br>The same particles make the same substance.", "points": ["the particles did not change into different particles", "melting and freezing changed only how the particles are arranged and how they move", "the same particles make the same substance, so it is still silver"]}, {"type": "mcq", "tag": "misconception", "stem": "A wet chalkboard dries after it is wiped. Priya says: \"The water has turned into a different substance, water vapor.\" Is Priya correct?", "options": ["yes", "no"], "key": 1, "fb": ["Water vapor is water as a gas. The same water particles are there, now far apart and flying.", "Water vapor is water as a gas. The same water particles are there, now far apart and flying."], "why": "Water vapor is water as a gas.<br>The water vapor is made of the same water particles as the liquid water on the board.<br>Evaporation changed only the arrangement and the movement of the particles.<br>A change of state never makes a new substance."}, {"type": "mcq", "tag": "transfer", "stem": "A carton of frozen orange juice is left out until it thaws into a liquid. What is the liquid?", "options": ["a new substance made from the frozen juice", "orange juice", "water that came out of the juice"], "key": 1, "fb": ["A change of state never makes a new substance.", "The same particles are there; only their arrangement and movement changed.", "The juice's particles did not separate or change. The whole liquid is orange juice."], "why": "Thawing is melting: a solid turning into a liquid.<br>The same particles are there before and after.<br>Only their arrangement and their movement changed.<br>So the liquid is still orange juice."}, {"type": "mcq", "tag": "fluency", "stem": "Liquid tin is poured into a mold and hardens into a solid. Is the solid still tin?", "options": ["yes", "no"], "key": 0, "fb": ["The same tin particles are there; only their arrangement and movement changed.", "The same tin particles are there; only their arrangement and movement changed."], "why": "Freezing changed only the arrangement and the movement of the tin particles.<br>The same particles make the same substance.<br>So the solid is still tin."}, {"type": "mcq", "tag": "fluency", "stem": "A jar of peanut oil turns cloudy and solid in a refrigerator. Is the solid still peanut oil?", "options": ["yes", "no"], "key": 0, "fb": ["The same oil particles are there; only their arrangement and movement changed.", "The same oil particles are there; only their arrangement and movement changed."], "why": "Cooling took energy away from the oil particles, and they locked into fixed positions.<br>The same particles make the same substance.<br>So the solid is still peanut oil."}, {"type": "mcq", "tag": "fluency", "stem": "Water vapor from a bowl of very hot rice condenses into drops on the lid. Is the liquid on the lid a new substance?", "options": ["yes", "no"], "key": 1, "fb": ["Condensation changed only the arrangement and the movement of the water particles. The drops are water.", "Condensation changed only the arrangement and the movement of the water particles. The drops are water."], "why": "Water vapor is water as a gas.<br>Condensation changed only the arrangement and the movement of the water particles.<br>A change of state never makes a new substance.<br>So the drops are water, not a new substance."}, {"type": "mcq", "tag": "fluency", "stem": "An iron horseshoe is melted in a furnace. Is the liquid a new substance?", "options": ["yes", "no"], "key": 1, "fb": ["Melting changed only the arrangement and the movement of the iron particles. The liquid is iron.", "Melting changed only the arrangement and the movement of the iron particles. The liquid is iron."], "why": "Melting changed only the arrangement and the movement of the iron particles.<br>A change of state never makes a new substance.<br>So the liquid is iron, not a new substance."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Melted candle wax is…", "options": ["still wax.", "a new substance."], "key": 0, "fb": ["The same particles, arranged and moving differently.", "A change of state never makes a new substance."], "why": "The wax particles never changed.<br>Only their arrangement and movement changed.<br>Melted wax is still wax."}]}, {"id": "L07", "atom": "MAT-026", "title": "Mass stays the same when state changes", "video": "could do without a video", "lesson_type": "Why / mechanism lesson (a fact and its particle reason); coins no term", "check_design": "Type (c) → two recall MCQs first (L06 the particles stay the same; T1 L01 a bigger balance reading means more mass), then what (a sealed bottle of water freezes: its mass) → why (free response, fresh case) → student-claim item whose claim is TRUE (the same particles, so the same mass; the one true claim in the topic, James 25 Sep 2026) → transfer (butter melted in a sealed tub), then a fluency tail of four fresh sealed cases, one of them the misconception (a solid has more mass than a liquid).", "headache": ["A student seals 50 g of ice in a plastic bag.", "The bag reads 50 g on a balance.", "She leaves it on the counter until every piece has melted.", "She weighs the bag of water.", "What does the balance read?"], "forest": ["Does a substance lose or gain mass when it changes state?", "The bag still reads 50 g.", "Every particle that was in the ice is still in the bag as water.", "No particle left, and no particle arrived.", "So the mass does not change when a substance changes state."], "article": [{"t": "idea", "text": "A student seals 50 g of ice in a plastic bag."}, {"t": "idea", "text": "She puts the bag on a balance, and the balance reads 50 g."}, {"t": "idea", "text": "She leaves the bag on the counter until every piece of ice has melted."}, {"t": "idea", "text": "Then she puts the bag of water back on the balance."}, {"t": "idea", "text": "What does the balance read?"}, {"t": "h", "text": "Count the particles"}, {"t": "idea", "text": "The balance measures the mass of everything in the bag."}, {"t": "idea", "text": "The bag is sealed, so no particle can get out and no particle can get in."}, {"t": "idea", "text": "Heating gave the ice particles energy, and the ice melted into water."}, {"t": "idea", "text": "Every particle that was in the ice is still in the bag, now as water."}, {"t": "idea", "text": "The particles did not change, and their number did not change."}, {"t": "idea", "text": "The same particles have the same mass."}, {"t": "idea", "text": "So the balance still reads 50 g."}, {"t": "fig", "key": "bag_balance", "cap": "The sealed bag on the balance before and after melting. Both readings are 50 g."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a sealed jar of melted wax on a balance."}, {"t": "idea", "text": "The balance reads 80 g."}, {"t": "idea", "text": "The wax cools and freezes into a solid block."}, {"t": "idea", "text": "No particle left the sealed jar, and no particle arrived."}, {"t": "idea", "text": "So the balance still reads 80 g."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The mass of a substance does not change when it changes state. The same particles are all still there, so the mass is the same before and after."}, {"t": "idea", "text": "Back to the bag: every ice particle is still in the bag as a water particle."}, {"t": "idea", "text": "No particle left, and no particle arrived."}, {"t": "idea", "text": "So the bag of water reads 50 g, just as the bag of ice did."}], "script": [{"say": "Here is a sealed plastic bag of 50 grams of ice on a balance.", "screen": "[sealed bag of ice on a balance; readout 50 g]"}, {"say": "The balance reads 50 grams.", "screen": "[readout pulses]"}, {"say": "A student leaves the bag on the counter until all the ice has melted.", "screen": "[clock runs; the ice becomes water inside the bag]"}, {"say": "She weighs the bag of water again: what does the balance read?", "screen": "[bag of water on the balance; readout hidden; question mark]"}, {"say": "The balance measures the mass of everything in the bag.", "screen": "[chip: MASS OF EVERYTHING IN THE BAG]"}, {"say": "The bag is sealed, so no particle can get out or in.", "screen": "[magnifier on the seal; chip: NOTHING IN, NOTHING OUT]"}, {"say": "Heating gave the ice particles energy, and the ice melted into water.", "screen": "[solid box becomes liquid box beneath the bag]"}, {"say": "Every particle that was in the ice is still in the bag, now as water.", "screen": "[sixteen particles counted in both boxes]"}, {"say": "The particles did not change, and their number did not change.", "screen": "[chip: SAME PARTICLES, SAME NUMBER]"}, {"say": "The same particles have the same mass, so the balance still reads 50 grams.", "screen": "[readout shows 50 g]"}, {"say": "Now consider a sealed jar of melted wax on a balance, reading 80 grams.", "screen": "[jar of liquid wax on a balance; readout 80 g]"}, {"say": "The wax freezes solid; no particle left or arrived, so the balance still reads 80 grams.", "screen": "[wax turns solid; HEAT OUT arrow; readout stays 80 g]"}, {"say": "Here is the rule: the mass of a substance does not change when it changes state.", "screen": "[rule slide reuses the two bags; rule text line 1]"}, {"say": "The same particles are all still there, so the mass is the same before and after.", "screen": "[rule text line 2]"}, {"say": "Back to the bag: every ice particle is still there as water, so the bag still reads 50 grams.", "screen": "[the bag of water; readout 50 g beside the earlier 50 g]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A substance changes state. Are its particles the same particles before and after?", "options": ["yes", "no"], "key": 0, "fb": ["The same particles are there before and after. Only their arrangement and movement change.", "The same particles are there before and after. Only their arrangement and movement change."], "why": "A change of state never makes a new substance.<br>The same particles are there before and after.<br>Only their arrangement and their movement change."}, {"type": "mcq", "tag": "recall", "fig": "bal_rice_pasta", "stem": "Which bag has more mass?", "options": ["the pasta", "the rice", "they have the same mass"], "key": 1, "fb": ["A bigger balance reading means more mass, and the rice reads more.", "A bigger balance reading means more mass.", "The two bags read differently, so their masses differ."], "why": "A bigger reading on the balance means more mass.<br>The rice reads 800 g and the pasta reads 500 g.<br>So the rice has more mass."}, {"type": "mcq", "tag": "what", "stem": "A sealed bottle of water is put in a freezer. All the water turns to ice. What happens to the mass of the bottle and its contents?", "options": ["The mass goes up.", "The mass goes down.", "The mass stays the same."], "key": 2, "fb": ["No particle arrived. The same particles are there, so the mass is the same.", "No particle left the sealed bottle. The same particles are there, so the mass is the same.", "The same particles are all still there, so the mass does not change."], "why": "The bottle is sealed, so no particle left and no particle arrived.<br>Freezing changed only the arrangement and the movement of the particles.<br>The same particles have the same mass.<br>So the mass stays the same."}, {"type": "frq", "tag": "why", "task": "A sealed jar holds 120 g of solid coconut oil. In a hot room all the oil turns liquid, and the jar still reads 120 g. Explain why the mass did not change.", "starter": "The mass did not change because…", "model": "The mass did not change because the jar is sealed.<br>No particle left the jar, and no particle arrived.<br>Melting changed only the arrangement and the movement of the oil particles.<br>Every particle that was in the solid oil is still in the jar as liquid oil.<br>The same particles have the same mass.", "points": ["the jar is sealed, so no particle left or arrived", "melting changed only how the particles are arranged and move", "the same particles have the same mass"]}, {"type": "mcq", "tag": "misconception", "stem": "A sealed plastic bottle of frozen root beer is left in the sun until the root beer is liquid again. Leo says: \"The bottle has the same mass, because the same particles are still inside it.\" Is Leo correct?", "options": ["yes", "no"], "key": 0, "fb": ["Every root beer particle is still in the sealed bottle, now as a liquid, so the mass is the same.", "Every root beer particle is still in the sealed bottle, now as a liquid, so the mass is the same."], "why": "The bottle is sealed, so no particle left and no particle arrived.<br>Every root beer particle is still in the bottle, now as a liquid.<br>The same particles have the same mass.<br>So the mass is the same, just as Leo says."}, {"type": "mcq", "tag": "transfer", "stem": "A sealed tub of solid butter reads 250 g. In a warm room all the butter melts. What does the balance read now?", "options": ["less than 250 g", "250 g", "more than 250 g"], "key": 1, "fb": ["No particle left the sealed tub. The same particles have the same mass.", "The same particles are all still there, so the mass is the same.", "No particle arrived in the sealed tub. The same particles have the same mass."], "why": "The tub is sealed, so no particle left and no particle arrived.<br>Every butter particle is still in the tub, now as a liquid.<br>The same particles have the same mass.<br>So the balance still reads 250 g."}, {"type": "mcq", "tag": "fluency", "stem": "A sealed pouch of applesauce is frozen solid. Compared with before, what is the mass of the pouch and its contents now?", "options": ["less", "the same", "more"], "key": 1, "fb": ["No particle left the sealed pouch. The same particles have the same mass.", "The same particles are all still in the pouch, so the mass is the same.", "No particle arrived in the sealed pouch. The same particles have the same mass."], "why": "The pouch is sealed, so no particle left and no particle arrived.<br>Freezing changed only the arrangement and the movement of the particles.<br>The same particles have the same mass."}, {"type": "mcq", "tag": "fluency", "stem": "A sealed glass flask holds water vapor. The flask cools, and the water vapor condenses into drops inside it. Does the mass of the flask and its contents change?", "options": ["yes", "no"], "key": 1, "fb": ["Every water particle is still inside the sealed flask, now as a liquid, so the mass is the same.", "Every water particle is still inside the sealed flask, now as a liquid, so the mass is the same."], "why": "The flask is sealed, so no particle left and no particle arrived.<br>Condensation changed only the arrangement and the movement of the water particles.<br>The same particles have the same mass.<br>So the mass does not change."}, {"type": "mcq", "tag": "fluency", "stem": "A sealed tub of ice cream is weighed, left to melt in a warm car, and weighed again. Which reading is bigger?", "options": ["the first reading, before melting", "the second reading, after melting", "neither: both readings are the same"], "key": 2, "fb": ["No particle left the sealed tub, so the mass did not go down.", "No particle arrived in the sealed tub, so the mass did not go up.", "The same particles are in the tub before and after, so both readings are the same."], "why": "The tub is sealed, so no particle left and no particle arrived.<br>Every ice cream particle is still in the tub, now as a liquid.<br>The same particles have the same mass.<br>So both readings are the same."}, {"type": "mcq", "tag": "fluency", "stem": "A sealed bottle of vinegar is left in a freezer until the vinegar is solid. Nadia says: \"The bottle has more mass now, because a solid has more mass than a liquid.\" Is Nadia correct?", "options": ["yes", "no"], "key": 1, "fb": ["The same vinegar particles are in the sealed bottle before and after, so the mass is the same.", "The same vinegar particles are in the sealed bottle before and after, so the mass is the same."], "why": "The bottle is sealed, so no particle left and no particle arrived.<br>Freezing changed only the arrangement and the movement of the vinegar particles.<br>The same particles have the same mass.<br>So the mass did not go up."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The sealed bag of ice read 50 g. After the ice melted, the bag read…", "options": ["less than 50 g", "50 g", "more than 50 g"], "key": 1, "fb": ["No particle left the sealed bag.", "Every particle is still in the bag.", "No particle arrived."], "why": "Every particle that was in the ice is still in the bag as water.<br>So the mass is still 50 g."}]}, {"id": "L08", "atom": "MAT-026b", "title": "Work out the mass after a change of state", "video": "could do without a video", "lesson_type": "Procedural lesson (a one-rule routine with a worked example on the page; a second case where some substance escapes)", "check_design": "Type (b) scaffolded sequence → one recall MCQ first (L07 the mass law), then the worked example is shown on the page (45 g of ice → 45 g of water), then typed numeric items in grams: a sealed bag of water freezes (temperature given, to ignore) → a sealed can of solid fat melts → an open pot boils, with one scaffold MCQ (does the mass in the pot stay the same?) before the typed subtraction → two bare items (one sealed, one open) → three fluency-repetition items on fresh surfaces (thawing, evaporation over weeks, a sauce boiling).", "headache": ["A sealed bag of ice reads 45 g on a balance.", "The ice melts completely inside the bag.", "A student is asked for the mass of the water, in grams.", "She has not weighed the bag again.", "Can she still give the answer?"], "forest": ["How do you find the mass after a change of state?", "The mass does not change when a substance changes state.", "So the mass of the water equals the mass of the ice.", "The water has a mass of 45 g.", "If some of the substance escapes as a gas, the mass left behind is the mass before minus the mass that escaped."], "article": [{"t": "idea", "text": "A sealed bag of ice reads 45 g on a balance."}, {"t": "idea", "text": "The ice melts completely inside the bag."}, {"t": "idea", "text": "A student is asked for the mass of the water, in grams."}, {"t": "idea", "text": "She has not weighed the bag again."}, {"t": "idea", "text": "Can she still give the answer?"}, {"t": "h", "text": "Use the rule"}, {"t": "idea", "text": "The mass of a substance does not change when it changes state."}, {"t": "idea", "text": "The bag is sealed, so every ice particle is still in the bag as water."}, {"t": "idea", "text": "So the mass of the water equals the mass of the ice."}, {"t": "idea", "text": "So the mass of the water is 45 g."}, {"t": "h", "text": "A worked example, step by step"}, {"t": "idea", "text": "Write the mass before: 45 g of ice."}, {"t": "idea", "text": "Write the change: the ice melts into water, sealed in the bag."}, {"t": "idea", "text": "Nothing left the bag, so the mass after equals the mass before."}, {"t": "idea", "text": "mass after melting = mass before melting = 45 g"}, {"t": "idea", "text": "Write the answer with its unit: 45 g of water."}, {"t": "h", "
