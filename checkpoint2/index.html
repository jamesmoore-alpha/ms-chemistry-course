<script id="data" type="application/json">{"topic": {"code": "CP2", "title": "Checkpoint 2 — Atoms, the inside of the atom, the periodic table and formulas (Topics 7–10)", "blurb": ["Everything from Topics 7 to 10, in one test: atoms, elements, molecules and compounds; protons, neutrons and electrons; the periodic table;", "and chemical formulas.", "Every question is a new case, and most of them use two topics at once: the ideas are the ones you have already used."], "lexicon": [], "terms": {}, "coined_at": {}, "intro_script": [], "summary_script": [], "intro_question": [], "summary_question": []}, "lessons": [], "practice": [], "pp100": [{"d": "easy", "atom": "MAT-042b+MAT-049", "topic": "T7", "stem": "A lump of pure tin is made of tin atoms. Inside each tin atom are protons, neutrons and electrons. Which of these is the smallest piece of tin that is still tin?", "options": ["one proton from a tin atom", "one electron from a tin atom", "one tin atom", "the nucleus of a tin atom"], "key": 2, "why": "One atom of an element is the smallest piece that is still that element.<br>Inside a tin atom are protons, neutrons and electrons, and none of them is tin.<br>A nucleus is only part of an atom, so it is not tin either.<br>So the smallest piece of tin is one tin atom.", "type": "mcq"}, {"d": "easy", "atom": "MAT-043+MAT-051", "topic": "T7", "stem": "A scientist counts the protons in every atom of a sample. Every atom has 29 protons. Which category is the sample?", "options": ["a compound", "a mixture", "a molecule", "an element"], "key": 3, "why": "The number of protons decides which element an atom is.<br>Every atom has 29 protons, so every atom is the same kind of atom.<br>A substance made of only one kind of atom is an element.<br>A molecule is a particle, not a category of substance.", "type": "mcq"}, {"d": "easy", "atom": "MAT-044+MAT-059", "topic": "T7", "stem": "Bromine is a dark red liquid with the formula Br₂. Which word names one Br₂ particle?", "options": ["an element", "a compound", "an atom", "a molecule"], "key": 3, "why": "A subscript counts the atoms in one particle: Br₂ is two bromine atoms joined.<br>Two or more atoms joined together make one particle called a molecule.<br>So one Br₂ particle is a molecule.<br>Element names the whole substance, not one particle.<br>The two atoms are the same kind, so bromine is not a compound.", "type": "mcq"}, {"d": "easy", "atom": "MAT-045+MAT-059", "topic": "T7", "stem": "Which formula writes a compound?", "options": ["Br₂", "Ne", "S₈", "HBr"], "key": 3, "why": "Count the capital letters, and you count the kinds of atom.<br>HBr has two capitals, H and Br: two kinds of atom, joined in one particle, so HBr writes a compound.<br>Br₂, Ne and S₈ each have one capital letter: one kind of atom each, so each writes an element, whether its atoms are single or joined.", "type": "mcq"}, {"d": "easy", "atom": "MAT-046+MAT-053", "topic": "T7", "fig": "cp2_box_ti", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. Which of these could this drawing show?", "options": ["titanium, Ti", "titanium dioxide, TiO₂", "a mixture of titanium and oxygen", "a mixture of titanium dioxide and oxygen"], "key": 0, "why": "Every circle in the box is the same gray circle: one kind of atom.<br>Ti is one symbol, so titanium has one kind of atom: the drawing could show titanium.<br>TiO₂ and both mixtures hold two kinds of atom, so each would need two sizes or shades of circle.", "type": "mcq"}, {"d": "easy", "atom": "MAT-047+MAT-053", "topic": "T7", "stem": "Which of these samples is a pure substance?", "options": ["the air in a balloon", "a cup of seawater", "the gas, Ne, inside a glowing shop sign", "a brass door handle: copper and zinc mingled"], "key": 2, "why": "A pure substance contains only one kind of matter.<br>Ne is one chemical symbol, so the gas in the sign is one element: one kind of matter.<br>Air, seawater and brass each hold two or more substances mingled together, so each is a mixture.", "type": "mcq"}, {"d": "easy", "atom": "MAT-050+MAT-054", "topic": "T8", "stem": "Sodium's box on the periodic table carries the atomic number 11. Where in a sodium atom are the 11 particles this number counts?", "options": ["on the rings, outside the nucleus", "spread through the whole atom", "half in the nucleus and half outside it", "in the nucleus"], "key": 3, "why": "The atomic number is the number of protons.<br>Protons and neutrons sit together in the nucleus.<br>So the 11 protons of a sodium atom sit in its nucleus.<br>The particles on the rings are the electrons.", "type": "mcq"}, {"d": "easy", "atom": "MAT-052+MAT-054", "topic": "T8", "stem": "Aluminum's atomic number is 13. How many electrons does a neutral aluminum atom have?", "options": ["0 electrons", "13 electrons", "14 electrons", "26 electrons"], "key": 1, "why": "The atomic number is the number of protons: 13 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So a neutral aluminum atom has 13 electrons.", "type": "mcq"}, {"d": "easy", "atom": "MAT-051b+MAT-054", "topic": "T8", "stem": "The boxes of the periodic table run 1, 2, 3 and on to 118. From one box to the next along a row, what goes up by one?", "options": ["the number of neutrons in each atom", "the number of atoms in each particle", "the number of protons in each atom", "the number of letters in the symbol"], "key": 2, "why": "The boxes run in order of atomic number.<br>The atomic number is the number of protons in each atom of the element.<br>So from one box to the next, the proton count goes up by one: one more proton makes the next element.", "type": "mcq"}, {"d": "easy", "atom": "MAT-053+MAT-059", "topic": "T9", "stem": "Ca is calcium, C is carbon and S is sulfur. Which formula writes one particle made of one calcium atom joined to one sulfur atom?", "options": ["CS", "CAS", "Ca₂S", "CaS"], "key": 3, "why": "Every capital letter starts a new symbol, and a small letter belongs to the symbol before it.<br>Calcium's symbol is Ca, so the formula opens with Ca, not C.<br>One calcium atom and one sulfur atom need no subscript: CaS.<br>CS writes carbon and sulfur, CAS has three capitals for three elements, and Ca₂S writes two calcium atoms.", "type": "mcq"}, {"d": "easy", "atom": "MAT-058+MAT-059", "topic": "T9", "fig": "cp2_crop_mgbr2", "stem": "In this part of the periodic table, each box shows the element's atomic number at the top, its symbol in the middle, and its name below. A label reads Na₂Se. Find the element the symbol Se stands for. Which element is it?", "options": ["sulfur", "silicon", "strontium", "selenium"], "key": 3, "why": "Every capital letter starts a new symbol, so Se is one symbol: the S with its small e.<br>Find the box whose symbol is Se: row 4, under the column numbered 16.<br>The name under the symbol is selenium.<br>Sulfur is S, silicon is Si and strontium is Sr.", "type": "mcq"}, {"d": "easy", "atom": "MAT-056", "topic": "T9", "stem": "Four elements are tested on a bench. Which one is a metalloid?", "options": ["a dull gas that leaves the bulb dark", "a shiny solid that bends without breaking when it is struck and lights the bulb brightly", "a shiny solid that shatters when it is struck and makes a bulb glow only faintly", "a dull solid that crumbles and leaves the bulb dark"], "key": 2, "why": "A metalloid looks shiny but shatters, and conducts electricity only a little.<br>The shiny solid that shatters and makes the bulb glow faintly matches that.<br>A shiny solid that bends and lights the bulb is a metal.<br>A dull element that passes no current, whether a gas or a crumbling solid, is a nonmetal.", "type": "mcq"}, {"d": "easy", "atom": "MAT-054b", "topic": "T9", "stem": "Two elements sit in the same group of the periodic table. Which of these do the two share?", "options": ["their properties", "their atomic number", "their period", "the first letter of their symbols"], "key": 0, "why": "A group is a column of the table.<br>The table was built by stacking elements that behave alike in one column.<br>So elements in the same group share properties.<br>Each element keeps its own atomic number, its own period and its own symbol.", "type": "mcq"}, {"d": "easy", "atom": "MAT-058+MAT-059", "topic": "T9", "fig": "cp2_crop_sr", "stem": "In this part of the periodic table, each box shows the element's atomic number at the top, its symbol in the middle, and its name below. Strontium chloride, SrCl₂, colors some fireworks red. Find the element the symbol Sr stands for. What is its atomic number?", "options": ["atomic number 37", "atomic number 38", "atomic number 39", "atomic number 56"], "key": 1, "why": "Sr is one symbol: the S with its small r.<br>Find the box whose symbol is Sr: row 5, under the column numbered 2.<br>The small number at the top is 38.<br>37 is rubidium's box, 39 is yttrium's and 56 is barium's, below strontium.", "type": "mcq"}, {"d": "easy", "atom": "MAT-059+MAT-046", "topic": "T10", "stem": "The formula O₂ holds one chemical symbol, and the formula H₂O holds two. What does the number of symbols in a formula tell you?", "options": ["how many kinds of atom the particle holds", "how many atoms the particle holds", "how many particles the sample holds", "whether the substance is a solid, a liquid or a gas"], "key": 0, "why": "Each symbol names one element in the particle.<br>So the number of symbols is the number of kinds of atom: one kind in O₂, two kinds in H₂O.<br>The subscripts count the atoms, a coefficient would count particles, and a formula says nothing about the state.", "type": "mcq"}, {"d": "easy", "atom": "MAT-060+MAT-046", "topic": "T10", "stem": "The mineral fluorite is calcium fluoride, CaF₂; Ca is calcium, F is fluorine. How many atoms does one CaF₂ particle hold, and how many kinds of atom?", "options": ["2 atoms of 2 kinds", "3 atoms of 3 kinds", "2 atoms of 3 kinds", "3 atoms of 2 kinds"], "key": 3, "why": "Take the symbols one at a time: Ca with no subscript is 1 calcium atom; F₂ is 2 fluorine atoms.<br>Add the counts: 1 + 2 = 3 atoms.<br>Two capital letters, Ca and F, are two symbols, so two kinds of atom.", "type": "mcq"}, {"d": "easy", "atom": "MAT-061+MAT-044", "topic": "T10", "stem": "Neon's particles are single atoms. A chemist writes 4Ne. What does the line 4Ne describe?", "options": ["four neon atoms, none joined to another", "one particle of four neon atoms joined", "four neon molecules, each of two neon atoms joined", "one neon atom with four protons"], "key": 0, "why": "A full-size number in front is a coefficient, and it counts whole particles.<br>A neon particle is one atom, so 4Ne is four neon particles: four single atoms.<br>Only a subscript would count atoms joined inside one particle, and Ne has none.<br>So the four atoms are not joined.", "type": "mcq"}, {"d": "medium", "atom": "MAT-042b+MAT-049", "topic": "T7", "stem": "A helium atom has 2 protons in its nucleus. One proton is taken out of a helium atom and kept on its own. Which statement about that proton is correct?", "options": ["It is not helium: one whole atom is the smallest piece of helium.", "It is not helium yet: it becomes helium again only when it joins a clump of other protons.", "It is helium: it came out of a helium atom.", "It is helium: a proton is what makes an atom helium."], "key": 0, "why": "One helium atom is the smallest piece that is still helium.<br>A proton is a particle inside the atom, so it is smaller than one atom.<br>A piece smaller than one atom is not helium.<br>A clump of protons is not an atom either, so it is not helium.<br>So the proton on its own is not helium.", "type": "mcq"}, {"d": "medium", "atom": "MAT-046+MAT-051", "topic": "T7", "stem": "A sample holds atoms with 26 protons and atoms with 6 protons, mingled evenly through it, and no atom is joined to another. Which category is the sample?", "options": ["an element", "a compound", "a homogeneous mixture", "a heterogeneous mixture"], "key": 2, "why": "The number of protons decides the element, so 26 protons and 6 protons are two kinds of atom.<br>The kinds are not joined, so the sample is a mixture, not a compound.<br>The kinds are mingled evenly, so the mixture is the same all the way through: homogeneous.", "type": "mcq"}, {"d": "medium", "atom": "MAT-044+MAT-061", "topic": "T7", "fig": "cp2_row_n2h4", "stem": "Touching circles are joined. In this drawing, light gray circles are nitrogen atoms and small dark circles are hydrogen atoms. How many molecules and how many atoms does the drawing show?", "options": ["2 molecules made of 12 atoms", "12 molecules made of 12 atoms", "2 molecules made of 6 atoms", "1 molecule made of 12 atoms"], "key": 0, "why": "Two or more atoms joined together make one molecule.<br>The drawing shows two groups of touching circles, apart from each other: 2 molecules.<br>Each group holds 2 light gray circles and 4 small dark circles: 6 atoms.<br>Two molecules of 6 atoms hold 2 × 6 = 12 atoms.", "type": "mcq"}, {"d": "medium", "atom": "MAT-046+MAT-059", "topic": "T7", "fig": "cp2_box_water_h2", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. In this drawing, large open circles are oxygen atoms and small dark circles are hydrogen atoms. Which two formulas write the two kinds of particle in the box?", "options": ["H₂O and H₂", "H₂O and O₂", "H₃O and H₂", "H₄O only: the box holds one kind of particle"], "key": 0, "why": "The box holds two kinds of particle: a mixture of two substances.<br>One kind is a large open circle joined to two small dark circles: 1 oxygen atom and 2 hydrogen atoms, H₂O.<br>The other kind is two small dark circles joined: 2 hydrogen atoms, H₂.<br>No particle is two oxygen atoms joined, so no O₂.", "type": "mcq"}, {"d": "medium", "atom": "MAT-047+MAT-059", "topic": "T7", "stem": "A jar's label carries one chemical formula, K₂CO₃, and nothing else. Which category is the substance in the jar?", "options": ["an element", "a homogeneous mixture", "a compound", "a heterogeneous mixture"], "key": 2, "why": "A chemical formula writes one particle of one substance, so the jar holds one kind of matter: a pure substance, not a mixture.<br>K₂CO₃ has three capital letters, K, C and O: three kinds of atom, joined in one particle.<br>A pure substance with different kinds of atom joined in a fixed pattern is a compound.", "type": "mcq"}, {"d": "medium", "atom": "MAT-048+MAT-060", "topic": "T7", "stem": "Carbon, C, is a black solid. Hydrogen, H, is a gas that burns. Oxygen, O, is a gas. Methanol has the formula CH₄O. Which of these can you work out about methanol from its formula alone?", "options": ["It is black, like carbon.", "It is a gas, like hydrogen and oxygen.", "It is a black gas: carbon's color and hydrogen's state.", "Each of its particles holds 6 atoms."], "key": 3, "why": "A formula writes one particle, atom by atom: C is 1 carbon atom, H₄ is 4 hydrogen atoms, O is 1 oxygen atom, so 1 + 4 + 1 = 6 atoms.<br>A compound's particles are new particles, so a compound has its own properties.<br>Its color and its state cannot be read off from its elements, alone or blended.", "type": "mcq"}, {"d": "medium", "atom": "MAT-044+MAT-050", "topic": "T7", "stem": "Fluorine gas is F₂: every molecule is two fluorine atoms joined. Every atom has one nucleus, and a fluorine atom has 9 protons. How many nuclei does one F₂ molecule hold?", "options": ["1 nucleus", "2 nuclei", "9 nuclei", "18 nuclei"], "key": 1, "why": "A molecule is two or more atoms joined; joining does not merge the atoms.<br>Each atom keeps its own nucleus.<br>One F₂ molecule is 2 atoms, so it holds 2 nuclei.<br>The 9 protons of each atom sit inside its nucleus; they are not nuclei themselves.", "type": "mcq"}, {"d": "medium", "atom": "MAT-047+MAT-059", "topic": "T7", "type": "frq", "task": "A bottle holds a clear, thick liquid. Its label reads glycerin, C₃H₈O₃. Sort the liquid into one of the four categories using the full tree, and give your answer to each question you asked.", "starter": "The liquid is…", "model": "The liquid is a compound.<br>Question 1: is there more than one kind of matter? No: one formula writes one substance, so the liquid is a pure substance.<br>Next question, for a pure substance: does it have only one kind of atom? No: C, H and O are three kinds of atom, joined in one particle.<br>A pure substance with different kinds of atom joined in a fixed pattern is a compound.", "points": 3}, {"d": "medium", "atom": "MAT-043+MAT-051", "topic": "T7", "type": "frq", "task": "Two gases are described by their atoms. In gas A, every atom has 8 protons, and the atoms are joined in pairs. In gas B, every particle is one atom with 6 protons joined to two atoms with 8 protons, the same pattern every time. Determine which gas is an element and which is a compound, and support your answer.", "starter": "Gas A is…", "model": "Gas A is the element, and gas B is the compound.<br>The number of protons decides which element an atom is, so every atom in gas A is one kind of atom.<br>One kind of atom, single or joined, makes an element.<br>Gas B holds atoms with 6 protons and atoms with 8 protons: two kinds, joined in one fixed pattern, so gas B is a compound.", "points": 3}, {"d": "medium", "atom": "MAT-044+MAT-059", "topic": "T7", "type": "frq", "task": "White phosphorus is a waxy solid that is kept under water because it catches fire in air. Its formula is P₄: every particle is four phosphorus atoms joined. Explain why one P₄ particle is a molecule but white phosphorus is not a compound.", "starter": "One P₄ particle is a molecule because…", "model": "One P₄ particle is a molecule because it is four atoms joined together, moving as one particle.<br>A compound needs two or more kinds of atom joined.<br>P₄ has one capital letter, P, so every atom in the particle is a phosphorus atom: one kind.<br>A substance made of only one kind of atom is an element, so white phosphorus is an element, not a compound.", "points": 3}, {"d": "medium", "atom": "MAT-051+MAT-058", "topic": "T8", "fig": "cp2_atom_na_crop", "stem": "Filled circles marked + are protons, open circles are neutrons. This atom is drawn with its electrons left off. Count its protons, then find that atomic number in the part of the periodic table beside it. Which element is the atom?", "options": ["neon", "magnesium", "sodium", "potassium"], "key": 2, "why": "Count only the filled circles marked plus: 11 protons; the 12 open circles are neutrons and do not decide the element.<br>The number of protons is the atomic number.<br>Find 11 at the top of a box: the symbol is Na and the name is sodium.<br>So the atom is sodium.", "type": "mcq"}, {"d": "medium", "atom": "MAT-051b+MAT-054", "topic": "T8", "stem": "Magnesium's atomic number is 12. One proton is taken out of a magnesium atom's nucleus. Which box of the periodic table is the atom's element in now?", "options": ["sodium's box, atomic number 11", "still magnesium's box, atomic number 12", "aluminum's box, atomic number 13", "no box: the table lists elements, not changed atoms"], "key": 0, "why": "The number of protons decides which element an atom is.<br>12 protons take away 1 proton is 11 protons.<br>The atomic number is the number of protons, so the atom's element is the box with atomic number 11: sodium.<br>Every atom belongs to some element's box.", "type": "mcq"}, {"d": "medium", "atom": "MAT-052+MAT-060", "topic": "T8", "stem": "Hydrogen's atomic number is 1 and fluorine's is 9. A particle of hydrogen fluoride, HF, is one hydrogen atom joined to one fluorine atom, both neutral. How many electrons does one HF particle hold in all?", "options": ["1 electron", "8 electrons", "10 electrons", "18 electrons"], "key": 2, "why": "In a neutral atom the number of electrons equals the number of protons.<br>The hydrogen atom has 1 proton, so 1 electron; the fluorine atom has 9 protons, so 9 electrons.<br>Add the counts: 1 + 9 = 10 electrons in one HF particle.", "type": "mcq"}, {"d": "medium", "atom": "MAT-050+MAT-054", "topic": "T8", "stem": "Bromine's atomic number is 35. What does the nucleus of a bromine atom hold?", "options": ["35 protons, with its neutrons", "35 electrons", "35 protons and 35 electrons, packed together", "35 neutrons only"], "key": 0, "why": "The atomic number is the number of protons: 35 protons.<br>Protons and neutrons sit together in the nucleus.<br>Electrons move around the outside of the nucleus, never inside it.<br>So the nucleus holds 35 protons, with the atom's neutrons.", "type": "mcq"}, {"d": "medium", "atom": "MAT-051+MAT-059", "topic": "T8", "stem": "Silver nitrate, AgNO₃, was used in old photography; Ag is silver, N is nitrogen, O is oxygen. Every oxygen atom has 8 protons. How many atoms in one AgNO₃ particle have 8 protons?", "options": ["1 atom", "3 atoms", "5 atoms", "8 atoms"], "key": 1, "why": "The number of protons decides the element, so the atoms with 8 protons are the oxygen atoms.<br>A subscript counts the atoms of the element just before it: O₃ is 3 oxygen atoms.<br>So 3 atoms in the particle have 8 protons; Ag and N, with no subscript, are 1 atom each of other elements.", "type": "mcq"}, {"d": "medium", "atom": "MAT-052+MAT-058", "topic": "T8", "type": "frq", "task": "Chlorine's box on the periodic table carries the atomic number 17. Determine how many electrons a neutral chlorine atom has, and support your answer.", "starter": "A neutral chlorine atom has…", "model": "A neutral chlorine atom has 17 electrons.<br>The atomic number is the number of protons, so every chlorine atom has 17 protons.<br>Each proton carries one positive charge: 17 positive charges.<br>A neutral atom has no overall charge, so 17 negative charges are needed to cancel them, one electron each.", "points": 3}, {"d": "medium", "atom": "MAT-058+MAT-051b", "topic": "T9", "fig": "cp2_crop_hf", "stem": "In this part of the periodic table, each box shows the element's atomic number at the top and its symbol in the middle. One box is ringed. Which symbol belongs to the element whose atoms have one proton more than the ringed element's atoms?", "options": ["Zr", "Hf", "Ta", "W"], "key": 2, "why": "The number at the top of the ringed box is 72: its atomic number, so 72 protons in each atom.<br>One proton more is 73 protons, so the atomic number is 73.<br>Find the box with 73 at the top: the next box along, with the symbol Ta.<br>Zr, 40, sits above the ringed box, and W is 74.", "type": "mcq"}, {"d": "medium", "atom": "MAT-057+MAT-059", "topic": "T9", "fig": "cp2_crop_sio2", "stem": "The heavy zigzag line is the staircase. Sand is mostly silicon dioxide, SiO₂. Find the two elements of SiO₂ on this part of the table. Which of them is a metalloid?", "options": ["silicon", "oxygen", "both of them", "neither of them"], "key": 0, "why": "SiO₂ has two capital letters, so it names two elements: Si, silicon, and O, oxygen.<br>The staircase runs down silicon's left side and along its bottom, so silicon is a metalloid.<br>Oxygen sits to the right of the staircase, clear of it, so oxygen is a nonmetal.", "type": "mcq"}, {"d": "medium", "atom": "MAT-057+MAT-051", "topic": "T9", "fig": "cp2_crop_8p", "stem": "In this part of the periodic table, each box shows the element's atomic number at the top and its symbol in the middle. The heavy zigzag line is the staircase. Every atom of one element has 8 protons. Find that element's box on this part of the table. Which kind of element is it?", "options": ["a metal", "a nonmetal", "a metalloid", "impossible to tell from the proton count"], "key": 1, "why": "The number of protons is the atomic number, so find the box with 8 at the top: row 2, under column 16.<br>The staircase runs down boron's left side.<br>Carbon and nitrogen sit between boron and the box with 8, so that box is to the right of the staircase.<br>Elements to the right of the staircase are nonmetals.", "type": "mcq"}, {"d": "medium", "atom": "MAT-054b+MAT-051", "topic": "T9", "fig": "cp2_crop_v", "stem": "In this part of the periodic table, each box shows the element's atomic number at the top and its symbol in the middle. The numbers across the top of this part of the table are the group numbers; the numbers down the side are the period numbers. One cell is ringed. How many protons does each atom of the ringed element have, and in which period does the element sit?", "options": ["23 protons, period 3", "23 protons, period 4", "5 protons, period 4", "5 protons, period 3"], "key": 1, "why": "The small number at the top of the ringed cell is 23: its atomic number, so 23 protons in each atom.<br>Read the number at the side of its row: 4.<br>So the element sits in period 4; the 5 above its column is its group.", "type": "mcq"}, {"d": "medium", "atom": "MAT-055+MAT-059", "topic": "T9", "stem": "Chlorine joins with sodium to make table salt, NaCl. Bromine sits directly below chlorine in group 17. Which formula would you predict for the compound bromine makes with sodium?", "options": ["NaBr", "NaBr₂", "Na₂Br", "BrCl"], "key": 0, "why": "Elements in the same group share properties.<br>Bromine is chlorine's group-mate, so bromine should join with sodium the way chlorine does: one sodium atom to one bromine atom.<br>So the predicted formula is NaBr, with Br in chlorine's place.<br>BrCl holds no sodium at all.", "type": "mcq"}, {"d": "medium", "atom": "MAT-054+MAT-051", "topic": "T9", "stem": "Hydrogen's box is the first box on the periodic table. Why is it first?", "options": ["Its atoms have 1 proton, the smallest count of any element.", "Its name begins with H, early in the alphabet.", "It is the commonest element in the universe, so it was found first.", "It is the lightest gas."], "key": 0, "why": "The boxes run in order of atomic number.<br>The atomic number is the number of protons.<br>A hydrogen atom has 1 proton, and no atom has fewer.<br>So hydrogen's box comes first; the alphabet, how common an element is and its state play no part in the order.", "type": "mcq"}, {"d": "medium", "atom": "MAT-055+MAT-051", "topic": "T9", "type": "frq", "fig": "cp2_crop_nb", "task": "In this part of the periodic table, each box shows the element's atomic number at the top, its symbol in the middle, and its name below. Every atom of one element has 41 protons. The element directly above it in its group and the element directly below it are both shiny metals that conduct electricity. Find the element on this part of the table, name it and its two group-mates, and predict what it is like.", "starter": "The element with 41 protons is…", "model": "The element with 41 protons is niobium, Nb: the atomic number is the number of protons, so its box carries 41 at the top.<br>Niobium sits in group 5, under vanadium (23) and above tantalum (73).<br>Elements in the same group share properties.<br>So niobium should be a shiny metal that conducts electricity, like its two group-mates.", "points": 3}, {"d": "medium", "atom": "MAT-057+MAT-059", "topic": "T9", "type": "frq", "fig": "cp2_crop_zns", "task": "The heavy zigzag line is the staircase. Zinc sulfide, ZnS, is the glowing powder in some glow-in-the-dark toys. Determine which of its two elements is a metal, and support your answer from the drawing.", "starter": "ZnS names two elements…", "model": "ZnS names two elements: Zn, zinc, and S, sulfur, one capital letter each.<br>Zinc's box, atomic number 30, sits to the left of the staircase, two cells from it.<br>Elements to the left of the staircase are metals, so zinc is the metal.<br>Sulfur's box, atomic number 16, sits to the right of the staircase, so sulfur is a nonmetal.", "points": 3}, {"d": "medium", "atom": "MAT-061+MAT-051", "topic": "T10", "stem": "A helium atom has 2 protons. A chemist writes 3He. How many protons do the atoms written by 3He hold in all?", "options": ["2 protons", "3 protons", "5 protons", "6 protons"], "key": 3, "why": "The 3 in front is a coefficient, and it counts whole particles: three helium atoms.<br>Each helium atom has 2 protons.<br>A coefficient multiplies every count: 3 × 2 = 6 protons in all.", "type": "mcq"}, {"d": "medium", "atom": "MAT-059b+MAT-047", "topic": "T10", "stem": "MnO is a green powder and MnO₂ is a black powder; Mn is manganese, O is oxygen. A student tips both powders into one jar and stirs them together. How many substances does the jar hold?", "options": ["one substance: both powders are manganese oxide", "two substances mingled: a mixture", "one compound written two ways", "three substances: manganese, oxygen and the powder"], "key": 1, "why": "The subscripts differ: 1 oxygen atom in an MnO particle, 2 in an MnO₂ particle.<br>Different particles are different substances, so the jar holds two substances.<br>Stirring mingles their particles and does not join them.<br>Two substances mingled together make a mixture.", "type": "mcq"}, {"d": "medium", "atom": "MAT-060+MAT-044", "topic": "T10", "fig": "cp2_box_h2_nine", "stem": "Each size and shade of circle is a different kind of atom. Touching circles are joined. In this drawing, small dark circles are hydrogen atoms, and every particle in the box is written H₂. How many hydrogen atoms does the whole box hold?", "options": ["2 hydrogen atoms", "9 hydrogen atoms", "18 hydrogen atoms", "36 hydrogen atoms"], "key": 2, "why": "A subscript counts the atoms in ONE particle: H₂ is 2 hydrogen atoms.<br>Count the particles in the box: 9 pairs of touching circles.<br>Nine particles of 2 atoms hold 9 × 2 = 18 hydrogen atoms.", "type": "mcq"}, {"d": "medium", "atom": "MAT-060+MAT-051", "topic": "T10", "stem": "Hydrogen sulfide, H₂S, is the gas that smells of rotten eggs. A hydrogen atom has 1 proton and a sulfur atom has 16 protons. How many protons does one H₂S particle hold in all?", "options": ["3 protons", "17 protons", "18 protons", "34 protons"], "key": 2, "why": "Count the atoms first: H₂ is 2 hydrogen atoms, S is 1 sulfur atom.<br>Each hydrogen atom has 1 proton: 2 × 1 = 2 protons.<br>The sulfur atom has 16 protons.<br>Add the counts: 2 + 16 = 18 protons in one particle; 3 counts the atoms, and 17 forgets the second hydrogen atom.", "type": "mcq"}, {"d": "medium", "atom": "MAT-061", "topic": "T10", "type": "frq", "task": "Zinc nitrate is Zn(NO₃)₂; Zn is zinc, N is nitrogen, O is oxygen. A chemist writes 3Zn(NO₃)₂. Calculate how many atoms in all the line 3Zn(NO₃)₂ writes. Show your work.", "starter": "One Zn(NO₃)₂ particle holds…", "model": "One Zn(NO₃)₂ particle holds 1 zinc atom, and inside the parentheses 1 nitrogen atom and 3 oxygen atoms.<br>The 2 after the closing parenthesis repeats the group: 2 nitrogen atoms and 6 oxygen atoms.<br>Add the counts: 1 + 2 + 6 = 9 atoms in one particle.<br>The coefficient 3 means three particles: 3 × 9 = 27 atoms in all.", "points": 3}, {"d": "hard", "atom": "MAT-045+MAT-053", "topic": "T7", "stem": "Scandium's symbol is Sc. Jace says: \"Sc has two letters, so scandium must be a compound of sulfur and carbon.\" Which statement about Jace's claim is correct?", "options": ["Jace is correct: two letters name two elements joined.", "Sc has one capital letter, so it is one symbol and scandium is an element.", "Sc names two elements that are not joined, so scandium is a mixture.", "Sc is a molecule of sulfur and carbon, so scandium is neither an element nor a compound."], "key": 1, "why": "Every capital letter starts a new symbol, and a small letter belongs to the symbol before it.<br>Sc has one capital letter, so Sc is one symbol: scandium.<br>One symbol means one kind of atom, and one kind of atom makes an element.<br>So scandium is an element, and Jace is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-047+MAT-061", "topic": "T7", "stem": "A worksheet writes 3LiF; LiF is lithium fluoride, a white powder. Luca says: \"That is a mixture, because there are three of something.\" Which statement about Luca's claim is correct?", "options": ["Luca is correct: three particles are three kinds of matter.", "The 3 in front counts three particles of one substance, lithium fluoride, so the sample is a pure substance.", "The 3 in front means three different elements are mingled in the powder, so the sample is a mixture of three substances.", "The 3 in front makes a new compound, with three times as many atoms in each of its particles."], "key": 1, "why": "A full-size number in front is a coefficient, and it counts whole particles.<br>3LiF is three LiF particles, and all three are lithium fluoride particles.<br>Three particles of the same kind are one kind of matter: a pure substance.<br>A mixture needs two or more substances mingled, so Luca is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-048+MAT-059", "topic": "T7", "stem": "Aluminum, Al, is a shiny metal that conducts electricity well. Oxygen, O₂, is a gas. Aluminum oxide, Al₂O₃, is the hard white grit on some sandpaper, and it does not conduct electricity. Bea says: \"Al₂O₃ can hold aluminum atoms and still not conduct, because an Al₂O₃ particle is a new particle with its own properties.\" Which statement about Bea's claim is correct?", "options": ["Bea is wrong: anything that holds metal atoms conducts electricity.", "Bea is wrong: Al₂O₃ stops conducting only because its aluminum atoms have been used up.", "Bea is wrong: Al₂O₃ is a mixture of aluminum and oxygen, and the oxygen gas between the aluminum atoms blocks the current.", "Bea is correct: a compound's particles are new particles, so a compound has its own properties."], "key": 3, "why": "In Al₂O₃ the aluminum atoms are joined to oxygen atoms in new particles.<br>New particles behave in new ways, so aluminum oxide has its own properties, not aluminum's.<br>The aluminum atoms are still there, joined; nothing is used up, and nothing is mingled.<br>So Bea is correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-048", "topic": "T7", "type": "frq", "task": "Hydrogen, H₂, is a gas that burns. Chlorine, Cl₂, is a poisonous green gas. Hydrogen chloride, HCl, is a gas with no color that does not burn. Determine whether HCl's properties can be worked out from hydrogen's and chlorine's, and support your answer.", "starter": "HCl's properties…", "model": "HCl's properties cannot be worked out from hydrogen's and chlorine's.<br>In HCl, each hydrogen atom is joined to a chlorine atom in a new particle.<br>New particles behave in new ways, so HCl has its own properties.<br>So HCl need not burn like hydrogen or be green like chlorine: it is a colorless gas that does not burn.", "points": 3}, {"d": "hard", "atom": "MAT-051+MAT-054", "topic": "T8", "stem": "Kiran says: \"Two atoms belong in the same box of the periodic table only if they have the same number of neutrons.\" Which statement about Kiran's claim is correct?", "options": ["Kiran is correct: the atomic number counts the neutrons.", "Two atoms belong in one box when they have the same number of protons; their neutron counts can differ.", "Two atoms belong in one box only when both their proton counts and their neutron counts match each other exactly.", "Two atoms belong in one box when their protons and neutrons add up to the same total."], "key": 1, "why": "One box holds one element.<br>The number of protons decides which element an atom is, and the box's atomic number is that proton count.<br>The neutron count does not decide the element, so two atoms of one element can hold different numbers of neutrons.<br>So Kiran is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-052+MAT-054", "topic": "T8", "stem": "Argon's atomic number is 18. Wes says: \"A neutral argon atom has 18 electrons, because the atomic number counts an atom's electrons.\" Which statement about Wes's claim is correct?", "options": ["Wes is correct: the atomic number is the electron count.", "18 electrons, but because the atomic number counts protons and a neutral atom's electrons match its protons.", "The atom has 36 electrons: 18 protons and 18 more for the neutrons.", "The periodic table says nothing about electrons at all, so the count cannot be found from the atomic number alone."], "key": 1, "why": "The atomic number is the number of protons: 18 protons.<br>In a neutral atom the number of electrons equals the number of protons: 18 electrons.<br>So Wes's count is right, but his reason is not: the atomic number counts protons, and the electrons match them only because the atom is neutral.", "type": "mcq"}, {"d": "hard", "atom": "MAT-051b+MAT-054", "topic": "T8", "type": "frq", "task": "Fluorine's atomic number is 9, and oxygen's box sits just to the left of fluorine's in the same row. Silas says: \"Take one proton out of a fluorine atom, and the atom's element moves one box to the left, to oxygen.\" Evaluate Silas's claim.", "starter": "Silas is…", "model": "Silas is correct.<br>The number of protons decides which element an atom is.<br>9 protons take away 1 proton is 8 protons.<br>The boxes run in order of atomic number, and the atomic number is the proton count, so 8 protons is the box just to the left of 9: oxygen.", "points": 3}, {"d": "hard", "atom": "MAT-053+MAT-059", "topic": "T9", "stem": "A label reads NiO. Noa says: \"NiO is one element, because it is one word.\" Which statement about Noa's claim is correct?", "options": ["Noa is correct: a label that carries one word always names one element, whatever letters the word holds.", "NiO names three elements: N, i and O.", "NiO is one element with a three-letter symbol.", "NiO has two capital letters, so it names two elements, nickel and oxygen, joined in one particle."], "key": 3, "why": "Every capital letter starts a new symbol, and a small letter belongs to the symbol before it.<br>NiO has two capital letters: Ni and O, nickel and oxygen.<br>A chemical symbol has at most two letters, so no element is written NiO.<br>So NiO writes a particle of two elements, and Noa is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-056+MAT-047", "topic": "T9", "stem": "A bronze medal is shiny, conducts electricity and bends without breaking. Tilly says: \"So bronze is a metal element, and its box sits to the left of the staircase.\" Which statement about Tilly's claim is correct?", "options": ["Tilly is correct: only an element can be shiny, conduct electricity and bend.", "Bronze is a compound of copper and tin, so its box sits along the staircase, with the six metalloids.", "Bronze is a nonmetal: only nonmetals conduct electricity.", "Bronze is copper and tin mingled, a mixture of two metals, so it has no box of its own."], "key": 3, "why": "The three tests sort ELEMENTS into metals, nonmetals and metalloids.<br>Bronze is copper atoms and tin atoms mingled together: a mixture, not an element.<br>The periodic table has one box per element, so a mixture has no box.<br>Bronze behaves like a metal because both its elements are metals, and Tilly is not correct.", "type": "mcq"}, {"d": "hard", "atom": "MAT-055+MAT-054b", "topic": "T9", "stem": "HF and HCl are both acids. Dmitri says: \"HBr should be an acid too, because bromine sits right next to chlorine in the same row.\" Which statement about Dmitri's claim is correct?", "options": ["Dmitri is correct: neighbors in a row behave alike.", "HBr should be an acid, but because bromine sits below chlorine in the same group, not beside it in a row.", "HBr should not be an acid: bromine is in a different row from chlorine.", "The periodic table says nothing about compounds, so no prediction about HBr can be made from where bromine sits on it."], "key": 1, "why": "Elements in the same group share properties; a row runs through all three kinds and does not predict what an element is like.<br>Fluorine, chlorine and bromine sit one under another in group 17.<br>So HBr should behave like HF and HCl: Dmitri's prediction is right, but his reason names the row instead of the group.", "type": "mcq"}, {"d": "hard", "atom": "MAT-054b+MAT-059", "topic": "T9", "type": "frq", "task": "Lithium joins with chlorine to make LiCl. Sodium joins with chlorine to make NaCl. Potassium joins with chlorine to make KCl. Lithium, sodium and potassium sit one under another in group 1. Explain how these three formulas demonstrate what the groups of the periodic table tell you.", "starter": "The three formulas show…", "model": "The three formulas show the same pattern: one lithium, sodium or potassium atom joined to one chlorine atom.<br>Lithium, sodium and potassium sit one under another, in group 1.<br>A group is a column of elements that behave alike.<br>So the three formulas show what a group tells you: elements in the same group share properties.", "points": 3}, {"d": "hard", "atom": "MAT-054+MAT-051", "topic": "T9", "type": "frq", "task": "Ida says: \"If scientists ever make an atom with 119 protons, the periodic table will need a 119th box, because none of its 118 boxes can hold that atom.\" Evaluate Ida's claim.", "starter": "Ida is…", "model": "Ida is correct.<br>The number of protons decides which element an atom is.<br>Each box holds one element with one proton count, and the counts run from 1 to 118.<br>An atom with 119 protons matches no box's number, so it is not any of the 118 elements.<br>It is a new element, and a new element needs a new box, next after 118.", "points": 3}, {"d": "hard", "atom": "MAT-059+MAT-053", "topic": "T10", "stem": "A label reads PbS. Bianca says: \"One PbS particle holds 3 atoms: P, b and S.\" Rafi says: \"One PbS particle holds 2 atoms.\" Who is correct?", "options": ["Bianca", "both of them", "Rafi", "neither of them"], "key": 2, "why": "Every capital letter starts a new symbol, and a small letter belongs to the symbol before it.<br>PbS has two capital letters: Pb, lead, and S, sulfur.<br>Neither symbol has a subscript, so one PbS particle holds 1 lead atom and 1 sulfur atom: 2 atoms.<br>So Rafi is correct, and Bianca is not.", "type": "mcq"}, {"d": "hard", "atom": "MAT-059b+MAT-048", "topic": "T10", "type": "frq", "task": "Tin has two oxides, SnO and SnO₂; Sn is tin, O is oxygen. Both are made only of tin and oxygen. SnO is a dark powder. Determine whether SnO₂ must also be a dark powder, and support your answer.", "starter": "The formulas SnO and SnO₂ differ…", "model": "The formulas SnO and SnO₂ differ by one subscript.<br>An SnO particle holds 1 tin atom and 1 oxygen atom; an SnO₂ particle holds 1 tin atom and 2 oxygen atoms.<br>So the two particles are different particles, and different particles make different substances.<br>A substance's properties come from its particles, so SnO₂ has its own color, which SnO's color cannot tell you.<br>So SnO₂ need not be dark; in fact it is a white powder.", "points": 3}], "figs": {"cp2_box_ti": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 170\" style=\"width:100%;max-width:425px;height:auto\" role=\"img\" aria-label=\"A box of particles drawn as circles, zoomed in on a sample\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"340\" height=\"170\" fill=\"#ffffff\"/><rect x=\"75\" y=\"15\" width=\"190\" height=\"140\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><circle cx=\"103.0\" cy=\"125.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"230.0\" cy=\"83.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"104.0\" cy=\"46.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"167.0\" cy=\"90.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"233.0\" cy=\"127.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"162.0\" cy=\"41.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"163.0\" cy=\"124.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"235.0\" cy=\"40.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"108.0\" cy=\"88.0\" r=\"7.0\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><\/svg>", "cp2_box_water_h2": " cy=\"128.2\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"103.8\" cy=\"123.8\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"110.2\" cy=\"130.2\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"170.8\" cy=\"79.1\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"175.2\" cy=\"86.9\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"226.8\" cy=\"36.8\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"233.2\" cy=\"43.2\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"122.5\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"169.0\" cy=\"131.5\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"164.5\" cy=\"44.0\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"173.5\" cy=\"44.0\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"230.8\" cy=\"89.9\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"235.2\" cy=\"82.1\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"105.8\" cy=\"80.8\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><circle cx=\"112.2\" cy=\"87.2\" r=\"5.0\" fill=\"#222\" stroke=\"#222\" stroke-width=\"1\"/><\/svg>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
