<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 250" width="100%" role="img" aria-label="A table of the seven household liquids with the pH of each and whether it is acidic, neutral or basic" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="422" height="250" fill="#ffffff"/><rect x="20" y="10" width="382" height="28" fill="#f1f1f1" stroke="#222"/><text x="95.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">liquid</text><text x="201.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH</text><text x="316.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">acidic, neutral or basic?</text><rect x="20" y="38" width="382" height="28" fill="#ffffff" stroke="#222"/><text x="95.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lemon juice</text><text x="201.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><text x="316.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">acidic</text><rect x="20" y="66" width="382" height="28" fill="#ffffff" stroke="#222"/><text x="95.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">vinegar</text><text x="201.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="316.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">acidic</text><rect x="20" y="94" width="382" height="28" fill="#ffffff" stroke="#222"/><text x="95.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soda water</text><text x="201.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><text x="316.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">acidic</text><rect x="20" y="122" width="382" height="28" fill="#ffffff" stroke="#222"/><text x="95.5" y="141" text-anchor="middle" font-size="1