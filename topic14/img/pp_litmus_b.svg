<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 373 138" width="100%" role="img" aria-label="A table of three solutions, X to Z, and what blue litmus paper and red litmus paper each do in them" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="373" height="138" fill="#ffffff"/><rect x="20" y="10" width="333" height="28" fill="#f1f1f1" stroke="#222"/><text x="61.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solution</text><text x="167.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper</text><text x="292.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">red litmus paper</text><rect x="20" y="38" width="333" height="28" fill="#ffffff" stroke="#222"/><text x="61.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solution X</text><text x="167.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="292.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><rect x="20" y="66" width="333" height="28" fill="#ffffff" stroke="#222"/><text x="61.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solution Y</text><text x="167.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="292.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><rect x="20" y="94" width="333" height="28" fill="#ffffff" stroke="#222"/><text x="61.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">solution Z</text><text x="167.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="292.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns blue</text><line x1="103" y1="10" x2="103" y2="122" stroke="#222"/><line x1="231" y1="10" x2="231" y2="122" stroke="#222"/><!--blind: A table. Header: solution | blue litmus paper | red litmus paper. Row: solution X | turns red | stays red. Row: solution Y | stays blue | stays red. Row: solution Z | stays blue | turns blue.--></svg>