<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 166" width="100%" role="img" aria-label="A table of four additions: what is added, the pH at the start and what the pH does afterward" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="414" height="166" fill="#ffffff"/><rect x="20" y="10" width="374" height="28" fill="#f1f1f1" stroke="#222"/><text x="96.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what is added</text><text x="226.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH at the start</text><text x="337.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH afterward</text><rect x="20" y="38" width="374" height="28" fill="#ffffff" stroke="#222"/><text x="96.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a base into an acid</text><text x="226.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="337.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">climbs toward 7</text><rect x="20" y="66" width="374" height="28" fill="#ffffff" stroke="#222"/><text x="96.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">exactly enough base</text><text x="226.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="337.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">7</text><rect x="20" y="94" width="374" height="28" fill="#ffffff" stroke="#222"/><text x="96.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">more base than that</text><text x="226.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="337.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">climbs past 7</text><rect x="20" y="122" width="374" height="28" fill="#ffffff" stroke="#222"/><text x="96.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an acid into a base</text><text x="226.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><text x="337.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">falls toward 7</text><line x1="172" y1="10" x2="172" y2="150" stroke="#222"/><line x1="281" y1="10" x2="281" y2="150" stroke="#222"/><!--blind: A table. Header: what is added | pH at the start | pH afterward. Row: a base into an acid | 3 | climbs toward 7. Row: exactly enough base | 3 | 7. Row: more base than that | 3 | climbs past 7. Row: an acid into a base | 10 | falls toward 7.--></svg>