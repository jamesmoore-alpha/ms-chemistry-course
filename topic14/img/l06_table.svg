<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 459 158" width="100%" role="img" aria-label="A table of three neutralizations: the acid, the base and the salt made; a note says the other product is water in every row" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="459" height="158" fill="#ffffff"/><rect x="20" y="10" width="419" height="28" fill="#f1f1f1" stroke="#222"/><text x="84.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the acid</text><text x="224.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the base</text><text x="369.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the salt</text><rect x="20" y="38" width="419" height="28" fill="#ffffff" stroke="#222"/><text x="84.5" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrochloric acid</text><text x="224.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sodium hydroxide</text><text x="369.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sodium chloride</text><rect x="20" y="66" width="419" height="28" fill="#ffffff" stroke="#222"/><text x="84.5" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrochloric acid</text><text x="224.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">magnesium hydroxide</text><text x="369.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">magnesium chloride</text><rect x="20" y="94" width="419" height="28" fill="#ffffff" stroke="#222"/><text x="84.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sulfuric acid</text><text x="224.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">potassium hydroxide</text><text x="369.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">potassium sulfate</text><line x1="149" y1="10" x2="149" y2="122" stroke="#222"/><line x1="300" y1="10" x2="300" y2="122" stroke="#222"/><text x="229.5" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The other product is water in every row.</text><!--blind: A table. Header: the acid | the base | the salt. Row: hydrochloric acid | sodium hydroxide | sodium chloride. Row: hydrochloric acid | magnesium hydroxide | magnesium chloride. Row: sulfuric acid | potassium hydroxide | potassium sulfate. Note under the table: The other product is water in every row.--></svg>