90" fill="#ffffff" stroke="#222" stroke-width="1.5"/><rect x="402" y="96.0" width="68" height="53.0" fill="#d9d9d9" stroke="none"/><line x1="402" y1="96.0" x2="470" y2="96.0" stroke="#222" stroke-width="1"/><rect x="431" y="42" width="10" height="54" fill="url(#litmusblue)" stroke="#222" stroke-width="1"/><rect x="431" y="96" width="10" height="24" fill="#555" stroke="#222" stroke-width="1"/><text x="436.66666666666663" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soda water</text><text x="436.66666666666663" y="187" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="270.0" y="225" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hatched = blue litmus paper · dark gray = red litmus paper</text></svg>