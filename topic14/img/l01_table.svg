<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 194" width="100%" role="img" aria-label="A table of the five liquids: their taste, what blue litmus paper does in each, and whether each is an acid" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="429" height="194" fill="#ffffff"/><rect x="20" y="10" width="389" height="28" fill="#f1f1f1" stroke="#222"/><text x="69.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">liquid</text><text x="162.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">taste</text><text x="270.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper</text><text x="371.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an acid?</text><rect x="20" y="38" width="389" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">vinegar</text><text x="162.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sour</text><text x="270.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="371.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="66" width="389" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lemon juice</text><text x="162.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sour</text><text x="270.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="371.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="94" width="389" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pure water</text><text x="162.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no taste</text><text x="270.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="371.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="20" y="122" width="389" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soda water</text><text x="162.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sharp, sour</text><text x="270.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="371.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="20" y="150" width="389" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soapy water</text><text x="162.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">bitter</text><text x="270.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="371.5" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="118" y1="10" x2="118" y2="178" stroke="#222"/><line x1="206" y1="10" x2="206" y2="178" stroke="#222"/><line x1="334" y1="10" x2="334" y2="178" stroke="#222"/><!--blind: A table. Header: liquid | taste | blue litmus paper | an acid?. Row: vinegar | sour | turns red | yes. Row: lemon juice | sour | turns red | yes. Row: pure water | no taste | stays blue | no. Row: soda water | sharp, sour | turns red | yes. Row: soapy water | bitter | stays blue | no.--></svg>