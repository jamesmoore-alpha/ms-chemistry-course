<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339 166" width="100%" role="img" aria-label="A table lining up an acid and a base: taste, feel, what blue litmus paper does, what red litmus paper does" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="339" height="166" fill="#ffffff"/><rect x="20" y="10" width="299" height="28" fill="#f1f1f1" stroke="#222"/><text x="84.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="192.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an acid</text><text x="278.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a base</text><rect x="20" y="38" width="299" height="28" fill="#ffffff" stroke="#222"/><text x="84.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">taste</text><text x="192.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sour</text><text x="278.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">bitter</text><rect x="20" y="66" width="299" height="28" fill="#ffffff" stroke="#222"/><text x="84.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">feel</text><text x="192.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">not slippery</text><text x="278.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">slippery</text><rect x="20" y="94" width="299" height="28" fill="#ffffff" stroke="#222"/><text x="84.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper</text><text x="192.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="278.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><rect x="20" y="122" width="299" height="28" fill="#ffffff" stroke="#222"/><text x="84.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">red litmus paper</text><text x="192.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><text x="278.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns blue</text><line x1="148" y1="10" x2="148" y2="150" stroke="#222"/><line x1="237" y1="10" x2="237" y2="150" stroke="#222"/><!--blind: A table. Header: (blank) | an acid | a base. Row: taste | sour | bitter. Row: feel | not slippery | slippery. Row: blue litmus paper | turns red | stays blue. Row: red litmus paper | stays red | turns blue.--></svg>