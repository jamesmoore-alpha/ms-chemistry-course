<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 96" width="100%" role="img" aria-label="The acid and the base each drawn as two joined blocks, one part named in each block" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="96" fill="#ffffff"/><text x="270.0" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">before: the acid and the base</text><rect x="30" y="34" width="108" height="30" rx="6" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><rect x="138" y="34" width="99" height="30" rx="6" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="84.0" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen part</text><text x="187.5" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">chloride part</text><text x="133.5" y="82" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">hydrochloric acid</text><text x="270.0" y="54" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">+</text><rect x="304" y="34" width="95" height="30" rx="6" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><rect x="399" y="34" width="111" height="30" rx="6" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="351.5" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sodium part</text><text x="454.5" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydroxide part</text><text x="407.0" y="82" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sodium hydroxide</text></svg>