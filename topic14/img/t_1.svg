<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 242" width="100%" role="img" aria-label="A table of six clues and the box each puts a liquid in; a note under the table names the liquid" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="320" height="242" fill="#ffffff"/><rect x="28" y="10" width="264" height="28" fill="#f1f1f1" stroke="#222"/><text x="126.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the clue</text><text x="258.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the box</text><rect x="28" y="38" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper turns red</text><text x="258.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">acid</text><rect x="28" y="66" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">red litmus paper turns blue</text><text x="258.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">base</text><rect x="28" y="94" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neither paper changes color</text><text x="258.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">neutral</text><rect x="28" y="122" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH below 7</text><text x="258.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">acid</text><rect x="28" y="150" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH exactly 7</text><text x="258.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">neutral</text><rect x="28" y="178" width="264" height="28" fill="#ffffff" stroke="#222"/><text x="126.0" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pH above 7</text><text x="258.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">base</text><line x1="224" y1="10" x2="224" y2="206" stroke="#222"/><text x="160.0" y="224" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the liquid: pineapple juice</text><!--blind: A table. Header: the clue | the box. Row: blue litmus paper turns red | acid. Row: red litmus paper turns blue | base. Row: neither paper changes color | neutral. Row: pH below 7 | acid. Row: pH exactly 7 | neutral. Row: pH above 7 | base. Note under the table: the liquid: pineapple juice.--></svg>