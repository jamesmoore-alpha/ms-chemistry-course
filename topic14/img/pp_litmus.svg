<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 166" width="100%" role="img" aria-label="A table of four liquids and what blue litmus paper and red litmus paper each do in them" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="388" height="166" fill="#ffffff"/><rect x="20" y="10" width="348" height="28" fill="#f1f1f1" stroke="#222"/><text x="69.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">liquid</text><text x="182.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">blue litmus paper</text><text x="307.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">red litmus paper</text><rect x="20" y="38" width="348" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">orange juice</text><text x="182.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="307.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><rect x="20" y="66" width="348" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">limewater</text><text x="182.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="307.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns blue</text><rect x="20" y="94" width="348" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">sugar syrup</text><text x="182.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays blue</text><text x="307.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><rect x="20" y="122" width="348" height="28" fill="#ffffff" stroke="#222"/><text x="69.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">apple cider</text><text x="182.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns red</text><text x="307.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">stays red</text><line x1="118" y1="10" x2="118" y2="150" stroke="#222"/><line x1="246" y1="10" x2="246" y2="150" stroke="#222"/><!--blind: A table. Header: liquid | blue litmus paper | red litmus paper. Row: orange juice | turns red | stays red. Row: limewater | stays blue | turns blue. Row: sugar syrup | stays blue | stays red. Row: apple cider | turns red | stays red.--></svg>