 the base can use up."], "why": "A little acid uses up a little of the base.<br>Base is left, so the liquid is still basic.<br>So the pH has fallen but is still above 7."}, {"type": "frq", "tag": "why", "atom": "MAT-080", "task": "Potassium chloride is a salt made in a neutralization. Explain which reactant gave the salt each of its two parts, and name that reactant.", "starter": "The potassium part came from…", "model": "The potassium part came from the base, because the base gives the salt its metal part.<br>That base was potassium hydroxide.<br>The chloride part came from the acid, because the acid gives the salt its other part.<br>That acid was hydrochloric acid.", "points": ["the potassium part came from the base, because the base gives the salt its metal part: potassium hydroxide", "the chloride part came from the acid, because the acid gives the salt its other part: hydrochloric acid", "each part is traced by the rule: metal part from the base, other part from the acid"]}, {"type": "text", "tag": "term", "atom": "MAT-077", "stem": "A liquid tastes sour and turns blue litmus paper red. Which family does it belong to?", "accept": ["acid", "acids", "an acid", "the acids", "the acid family"], "why": "A sour taste and blue litmus paper turning red are the properties acids share.<br>So the liquid is an acid."}, {"type": "text", "tag": "term", "atom": "MAT-078", "stem": "A liquid feels slippery, tastes bitter and turns red litmus paper blue. Which family does it belong to?", "accept": ["base", "bases", "a base", "the bases", "the base family"], "why": "A slippery feel, a bitter taste and red litmus paper turning blue are the properties bases share.<br>So the liquid is a base."}, {"type": "text", "tag": "term", "atom": "MAT-077", "stem": "Litmus paper changes color to show which family a liquid belongs to. What is a substance that does this called?", "accept": ["indicator", "an indicator", "indicators"], "why": "The paper changes color to show a liquid's family.<br>A substance that does this is called an indicator."}, {"type": "text", "tag": "term", "atom": "MAT-081", "stem": "An acid and a base react and use each other up, and the pH moves toward 7. What is this reaction called?", "accept": ["neutralization", "neutralisation", "a neutralization", "a neutralisation"], "why": "The acid and the base use each other up.<br>An acid and a base reacting and using each other up is called neutralization."}, {"type": "text", "tag": "term", "atom": "MAT-080", "stem": "Sodium chloride, magnesium chloride and potassium sulfate are each made when a base's metal part joins an acid's other part. In chemistry, what is this family called?", "accept": ["salt", "salts", "the salts", "a salt"], "why": "Each is made when a base's metal part joins an acid's other part.<br>In chemistry, a substance made this way is called a salt."}], "pp100": [{"d": "easy", "atom": "MAT-077", "stem": "Which of these is a property that every acid has?", "options": ["It feels slippery.", "It has a pH above 7.", "It tastes sour.", "It turns red litmus paper blue."], "key": 2, "why": "Acids share a set of properties.<br>They taste sour, and they turn blue litmus paper red.<br>A slippery feel, red litmus turning blue and a pH above 7 are a base's marks."}, {"d": "easy", "atom": "MAT-078", "stem": "Which litmus result shows that a liquid is a base?", "options": ["blue litmus paper turns red", "red litmus paper turns blue", "red litmus paper stays red", "blue litmus paper stays blue"], "key": 1, "why": "Bases turn red litmus paper blue.<br>Blue litmus turning red is an acid's mark.<br>Red litmus staying red happens in an acid or a neutral liquid, and blue litmus staying blue happens in a base or a neutral liquid."}, {"d": "easy", "atom": "MAT-079", "stem": "Pure water reads pH 7 on a pH meter. What is a liquid at pH 7 called?", "options": ["acidic", "basic", "an indicator", "neutral"], "key": 3, "why": "Pure water sits in the middle of the pH scale at 7.<br>It is not an acid and not a base.<br>A liquid at pH 7 is called neutral."}, {"d": "easy", "atom": "MAT-082", "stem": "A pH meter dipped in a liquid reads 12. Which box does the liquid go in?", "options": ["base", "acid", "neutral", "cannot tell from a pH alone"], "key": 0, "why": "The clue is a pH.<br>12 is above 7, and a pH above 7 means base.<br>So the liquid goes in the base box."}, {"d": "easy", "atom": "MAT-081", "stem": "Toothpaste is a base. It reacts with the acid that bacteria leave on teeth, and the two use each other up. What is this reaction called?", "options": ["neutralization", "dissolving", "evaporation", "the law of conservation of mass"], "key": 0, "why": "The toothpaste, a base, reacts with the acid.<br>The two use each other up.<br>An acid and a base reacting and using each other up is called neutralization."}, {"d": "easy", "atom": "MAT-080", "stem": "A student writes the word equation nitric acid + sodium hydroxide → sodium nitrate + water. Which product is the salt?", "options": ["nitric acid", "water", "sodium nitrate", "sodium hydroxide"], "key": 2, "why": "A salt is made when a base's metal part joins an acid's other part.<br>Sodium from the base joined nitrate from the acid.<br>So sodium nitrate is the salt; water is the other product."}, {"d": "easy", "atom": "MAT-077", "stem": "Which of these is an indicator?", "options": ["vinegar", "a pH meter", "baking soda solution", "litmus paper"], "key": 3, "why": "An indicator is a substance that changes color to show which family a liquid belongs to.<br>Litmus paper changes color: red in an acid, blue in a base.<br>A pH meter gives a number and changes no color; vinegar and baking soda solution are liquids being tested."}, {"d": "easy", "atom": "MAT-078", "stem": "A liquid feels slippery between the fingers and turns red litmus paper blue. Which family does it belong to?", "options": ["acids", "bases", "indicators", "neutral liquids"], "key": 1, "why": "Bases share a set of properties.<br>They feel slippery, and they turn red litmus paper blue.<br>So the liquid is a base."}, {"d": "easy", "atom": "MAT-082", "stem": "Blue litmus paper dipped in sauerkraut juice turns red. Which box does sauerkraut juice go in?", "options": ["acid", "base", "neutral", "cannot tell from one paper"], "key": 0, "why": "The clue is a litmus color.<br>Blue litmus paper turning red means acid.<br>So sauerkraut juice goes in the acid box."}, {"d": "easy", "atom": "MAT-077", "stem": "What does an indicator do?", "options": ["It changes color to show a liquid's family.", "It gives every liquid a number from 0 to 14.", "It uses up some of the acid in a liquid.", "It makes a liquid taste sour or bitter."], "key": 0, "why": "An indicator is a substance that changes color to show which family a liquid belongs to.<br>Litmus paper turns red in an acid and blue in a base.<br>A pH meter, not an indicator, gives the number from 0 to 14.<br>A base, not an indicator, uses up acid."}, {"d": "easy", "atom": "MAT-077", "stem": "A bottle on the lab shelf has lost its label. Which is the right way to test whether the liquid inside is an acid?", "options": ["taste a small drop of it on the tip of the tongue", "rub a drop between two fingers", "dip a strip of blue litmus paper into it", "smell it from close up, with the bottle held under the nose"], "key": 2, "why": "Acids turn blue litmus paper red.<br>Some acids, like the sulfuric acid in a car battery, burn skin.<br>So in a lab the test for an acid is litmus paper: never taste and never touch.<br>A smell tells nothing about the family."}, {"d": "easy", "atom": "MAT-078", "stem": "How does a base feel between the fingers?", "options": ["sticky", "slippery", "gritty", "scratchy"], "key": 1, "why": "Bases share a set of properties.<br>They feel slippery, taste bitter and turn red litmus paper blue.<br>So the feel a base has is slippery."}, {"d": "easy", "atom": "MAT-079", "fig": "pp_s_1", "stem": "The scale marks a liquid's pH. Which word describes the liquid?", "options": ["neutral", "acidic", "basic", "cannot tell without a litmus test"], "key": 1, "why": "Pure water sits at 7.<br>The marker at 1 sits below 7, near the most acidic end.<br>Below 7 a liquid is acidic, so this liquid is acidic.<br>A pH alone is enough: no paper is needed."}, {"d": "easy", "atom": "MAT-079", "stem": "Which reading is the most acidic reading on the pH scale?", "options": ["pH 0", "pH 1", "pH 7", "pH 14"], "key": 0, "why": "The pH scale runs from 0 to 14.<br>Below 7 a liquid is acidic, and the lower the pH, the more acidic it is.<br>0 is the lowest reading, so pH 0 is the most acidic reading on the scale.<br>pH 14 is the most basic reading."}, {"d": "easy", "atom": "MAT-080", "stem": "Calcium hydroxide, a base, and sulfuric acid react in just the right amounts. One product is a salt. What is the other product?", "options": ["hydrogen", "a new acid", "water", "a new base"], "key": 2, "why": "A neutralization makes a salt and water.<br>The base's calcium part joins the acid's sulfate part: the salt.<br>The leftover parts, hydrogen from the acid and hydroxide from the base, join to make water.<br>So the other product is water."}, {"d": "easy", "atom": "MAT-080", "stem": "Table salt, sodium chloride, is one salt. In chemistry, what does the word salt name?", "options": ["only the white grains sprinkled on food", "any substance that dissolves in water and leaves white crystals behind when the water dries away", "any white crystal that can be ground to a powder", "the family of substances made when a base's metal part joins an acid's other part"], "key": 3, "why": "In chemistry, salt names a whole family, not only the one in the kitchen.<br>A salt is made when a base's metal part joins an acid's other part.<br>Sodium chloride, magnesium chloride and potassium sulfate are all salts."}, {"d": "easy", "atom": "MAT-081", "stem": "Which of these is a neutralization?", "options": ["Sugar is stirred into water until it disappears.", "Salt water is left out in the sun until only salt is left.", "An ice cube melts in a glass of juice.", "A base is stirred into an acid until the meter reads 7."], "key": 3, "why": "An acid and a base reacting and using each other up is called neutralization.<br>Only the last event has an acid and a base reacting: the base uses up the acid, and the pH reaches 7.<br>Dissolving, drying and melting are not chemical reactions."}, {"d": "easy", "atom": "MAT-082", "stem": "Blue litmus paper dipped in liquid F turns red, and red litmus paper dipped in it stays red. Which box does liquid F go in?", "options": ["acid", "base", "neutral", "cannot tell"], "key": 0, "why": "Blue litmus paper turning red means acid.<br>Red litmus paper stays red in an acid, so the second paper agrees.<br>So liquid F goes in the acid box."}, {"d": "easy", "atom": "MAT-082", "stem": "Neither litmus paper changes color in liquid G, and a pH meter dipped in it reads 7. Which box does liquid G go in?", "options": ["acid", "base", "neutral", "cannot tell without a taste test"], "key": 2, "why": "Neither paper changing color means neutral.<br>A pH of exactly 7 means neutral too.<br>Both clues agree, so liquid G goes in the neutral box.<br>No liquid is tasted in a lab."}, {"d": "easy", "atom": "MAT-078", "stem": "A liquid is a base. A strip of blue litmus paper and a strip of red litmus paper are dipped into it. Which pair of results do the two papers give?", "options": ["blue paper turns red and red paper stays red", "blue paper stays blue and red paper stays red", "blue paper stays blue and red paper turns blue", "blue paper turns red and red paper turns blue at once"], "key": 2, "why": "Bases turn red litmus paper blue.<br>A base does not turn blue litmus paper red: that is an acid's mark.<br>So the blue paper stays blue and the red paper turns blue."}, {"d": "medium", "atom": "MAT-079", "fig": "pp_drinks", "stem": "The table gives the pH of four drinks. Which drink is the most acidic?", "options": ["iced coffee", "fresh carrot juice", "oat milk", "pomegranate juice"], "key": 3, "why": "The lower the pH, the more acidic the liquid is.<br>Pomegranate juice reads 3, the lowest pH in the table.<br>So pomegranate juice is the most acidic; oat milk at 7 is neutral."}, {"d": "medium", "atom": "MAT-079", "stem": "A hot spring reads pH 10, and a pond beside it reads pH 8. Which water is more basic?", "options": ["the one at pH 8", "the one at pH 10", "both of them equally", "neither of them"], "key": 1, "why": "Both readings sit above 7, so both waters are basic.<br>The higher the pH, the more basic the liquid is.<br>10 is higher than 8, so the hot spring is more basic."}, {"d": "medium", "atom": "MAT-082", "stem": "Liquid J changes neither litmus paper, and a pH meter reads 7 for it. Liquid K turns red litmus paper blue. Which boxes do J and K go in?", "options": ["J base, K neutral", "J acid, K base", "J neutral, K base", "J neutral, K acid"], "key": 2, "why": "A pH reading of 7 means neutral, and neither paper changed, so J goes in the neutral box.<br>Red litmus paper turning blue means base, so K goes in the base box.<br>So J is neutral and K is a base."}, {"d": "medium", "atom": "MAT-078", "fig": "pp_litmus", "stem": "The table gives the litmus results for four liquids. Which liquid is a base?", "options": ["orange juice", "sugar syrup", "apple cider", "limewater"], "key": 3, "why": "Bases turn red litmus paper blue.<br>Only limewater turned red litmus paper blue.<br>Orange juice and apple cider turned blue paper red, and sugar syrup changed neither."}, {"d": "medium", "atom": "MAT-077", "stem": "A student says a liquid is an acid. Which observation supports the claim?", "options": ["Red litmus paper dipped in it turned blue.", "Blue litmus paper dipped in it turned red.", "The liquid felt slippery.", "A pH meter dipped in it read 9."], "key": 1, "why": "Acids turn blue litmus paper red.<br>Red litmus turning blue, a slippery feel and a pH of 9 are a base's marks.<br>So only blue litmus paper turning red supports the claim."}, {"d": "medium", "atom": "MAT-081", "stem": "A base is stirred into an acid at pH 3, and the reading climbs toward 7. Which statement explains why the pH climbs?", "options": ["The base reacts with the acid, using some of it up.", "The base mixes into the acid without reacting.", "The base's own high pH is added on top of the acid's pH.", "The acid boils away as the base is stirred in."], "key": 0, "why": "The base reacts with the acid and uses some of it up.<br>Less acid means the liquid is less acidic.<br>A less acidic liquid has a higher pH, so the pH climbs toward 7."}, {"d": "medium", "atom": "MAT-080", "stem": "A student writes the word equation sulfuric acid + magnesium hydroxide → magnesium sulfate + water. Magnesium sulfate is the salt. Which reactant gave the salt its sulfate part?", "options": ["magnesium hydroxide", "both reactants equally", "sulfuric acid", "neither reactant"], "key": 2, "why": "The base gives the salt its metal part, magnesium.<br>The acid gives the salt its other part.<br>Sulfate is sulfuric acid's other part, so sulfuric acid gave it."}, {"d": "medium", "atom": "MAT-077", "stem": "Blue litmus paper turns red in blueberry juice and in a tamarind drink, so both are acids. Which drink is the more acidic, judging from the paper alone?", "options": ["the drink whose paper turned red first", "the drink whose paper turned a deeper shade of red", "both drinks, equally", "neither drink can be picked out from the paper"], "key": 3, "why": "Acids turn blue litmus paper red, so both drinks are acids.<br>Litmus paper gives one color for every acid, however acidic.<br>Only a pH tells how acidic a liquid is.<br>So the paper cannot say which drink is the more acidic."}, {"d": "medium", "atom": "MAT-077", "stem": "Four drinks were tasted at home. Which one will turn blue litmus paper red in the lab?", "options": ["the one that tastes sour", "the one that tastes bitter", "the one that tastes sweet and not at all sour", "the one with no taste at all"], "key": 0, "why": "Acids taste sour, and acids turn blue litmus paper red.<br>So the sour drink is an acid, and it will turn the paper red.<br>A bitter taste is a base's mark; a base leaves blue litmus paper blue.<br>A drink with no sour taste is not an acid."}, {"d": "medium", "atom": "MAT-078", "stem": "Red litmus paper dipped in a solution turns blue. A pH meter is then dipped into the same solution. What will the meter read?", "options": ["a number below 7", "exactly 7", "a number above 7", "cannot tell"], "key": 2, "why": "Red litmus paper turning blue means the solution is a base.<br>Above pH 7 a liquid is basic.<br>So the meter reads a number above 7.<br>A meter reads any liquid; the paper does not change that."}, {"d": "medium", "atom": "MAT-079", "fig": "pp_bars_3", "stem": "The bar chart shows the pH of three drinks. Which drink is closest to neutral?", "options": ["honeydew juice", "blackberry juice", "ginger ale", "all three equally close"], "key": 0, "why": "Neutral is pH 7, where pure water sits.<br>Ginger ale's bar reaches 3, blackberry juice's reaches 4, honeydew juice's reaches 6.<br>6 is the nearest to 7.<br>So honeydew juice is closest to neutral, though still acidic."}, {"d": "medium", "atom": "MAT-079", "fig": "pp_ph_count", "stem": "The table gives the pH of four samples, L to R. How many of the four are acidic?", "options": ["1 sample", "2 samples", "3 samples", "4 samples"], "key": 2, "why": "Below pH 7 a liquid is acidic.<br>Sample L reads 3, sample M reads 5 and sample N reads 6: all three sit below 7.<br>Sample R reads 10, above 7, so it is basic.<br>So 3 of the 4 samples are acidic."}, {"d": "medium", "atom": "MAT-079", "stem": "Liquid H reads pH 5. A second liquid is more acidic than liquid H. Which reading could the second liquid show?", "options": ["pH 2", "pH 6", "pH 9", "pH 14"], "key": 0, "why": "The lower the pH, the more acidic the liquid is.<br>A liquid more acidic than liquid H has a pH lower than 5.<br>Of the four readings, only 2 is lower than 5.<br>6 is acidic but less acidic than 5; 9 and 14 sit above 7, so those liquids are basic."}, {"d": "medium", "atom": "MAT-080", "stem": "Nitric acid and lithium hydroxide, a base, react in just the right amounts. Which salt forms?", "options": ["lithium sulfate", "lithium chloride", "hydrogen nitrate", "lithium nitrate"], "key": 3, "why": "The base gives the salt its metal part: lithium.<br>The acid gives the salt its other part: nitric acid gives nitrate.<br>Lithium joined to nitrate is lithium nitrate.<br>Sulfate would need sulfuric acid, and chloride would need hydrochloric acid."}, {"d": "medium", "atom": "MAT-081", "fig": "pp_scale_before_after", "stem": "The scale marks a liquid's pH before and after a student stirred something into it. What did the student stir in?", "options": ["a base", "more of the same liquid", "a strip of litmus paper", "an acid"], "key": 3, "why": "Before, the liquid read 9: above 7, so it was basic.<br>After, it read 7: neutral.<br>An acid uses up base, so the pH falls toward 7.<br>A base would push the pH higher; more of the same liquid or a paper changes nothing."}, {"d": "medium", "atom": "MAT-081", "fig": "pp_ml_table", "stem": "A student adds a base to a beaker of an acid, 5 mL at a time, and reads the pH after each addition. The table gives the readings. How much base had been added when every bit of the acid had just been used up?", "options": ["5 mL of base", "10 mL of base", "15 mL of base", "20 mL of base"], "key": 1, "why": "Exactly enough base uses up every bit of the acid, and the pH is then 7.<br>The table reads 7 after 10 mL.<br>After 5 mL the pH was 3: acid was left.<br>After 15 mL and 20 mL the pH was above 7: base was left over."}, {"d": "medium", "atom": "MAT-082", "fig": "pp_litmus_b", "stem": "The table gives the litmus results for three solutions from the lab shelf. Which solution goes in the neutral box?", "options": ["solution X", "solution Y", "solution Z", "solutions X and Z"], "key": 1, "why": "Neither paper changing color means neutral.<br>Only solution Y left both papers as they were.<br>Solution X turned blue paper red: an acid.<br>Solution Z turned red paper blue: a base."}, {"d": "medium", "atom": "MAT-082", "stem": "Which one clue, on its own, is enough to put a liquid in the neutral box?", "options": ["red litmus paper stays red", "blue litmus paper stays blue", "a pH meter reads exactly 7", "the liquid has no taste at all"], "key": 2, "why": "A pH of exactly 7 means neutral, on its own.<br>Red litmus paper stays red in an acid too, and blue litmus paper stays blue in a base too: one unchanged paper cannot settle it.<br>Taste is never the lab test."}, {"d": "medium", "atom": "MAT-081", "stem": "The rinse water from a metal-plating shop reads pH 3. Before it goes down the drain, a worker stirs a base into it, not enough to use up all the acid. Which reading could the meter show now?", "options": ["pH 1", "pH 5", "pH 7", "pH 9"], "key": 1, "why": "The base reacts with the acid and uses up some of it.<br>Less acid means the water is less acidic, so the pH moves up from 3.<br>Not enough base to use up all the acid, so acid is left and the pH stays below 7.<br>Only pH 5 is above 3 and below 7."}, {"d": "hard", "atom": "MAT-081", "stem": "Marisol pours a base into an acid at pH 2 until the meter reads 7, then adds one more spoonful of the base. Nils says the liquid is now \"extra neutral\". What is the liquid now?", "options": ["more neutral than before", "basic", "acidic again", "neutral, still at pH 7"], "key": 1, "why": "At pH 7 every bit of acid was used up.<br>The extra spoonful of base has no acid to react with, so base is left over.<br>A liquid with base left over is basic, above 7, so Nils is not correct."}, {"d": "hard", "atom": "MAT-080", "stem": "Thea says: \"The water made in a neutralization comes from both reactants: the acid gives its hydrogen part and the base gives its hydroxide part.\" Thea is correct. Which parts join to make the salt?", "options": ["the acid's hydrogen part and the base's hydroxide part", "the acid's hydrogen part and the base's metal part", "the base's hydroxide part and the acid's other part", "the base's metal part and the acid's other part"], "key": 3, "why": "In a neutralization the four parts swap partners.<br>The base's metal part joins the acid's other part to make the salt.<br>The leftover parts, hydrogen from the acid and hydroxide from the base, join to make water, so Thea is correct."}, {"d": "hard", "atom": "MAT-079", "stem": "Vikram's liquid reads pH 3. Yasmin's liquid turns red litmus paper blue. Which liquid is more acidic?", "options": ["Yasmin's liquid", "both liquids equally", "Vikram's liquid", "cannot tell without a pH for Yasmin's liquid"], "key": 2, "why": "Yasmin's liquid turns red litmus paper blue, so it is a base, above pH 7.<br>Vikram's liquid at pH 3 is below 7, so it is acidic.<br>The lower pH is the more acidic, so Vikram's liquid is more acidic."}, {"d": "hard", "atom": "MAT-082", "stem": "Lorcan dips red litmus paper into a liquid, and the paper stays red. He says: \"The paper did not change, so the liquid is neutral.\" What can the liquid be?", "options": ["either an acid or a neutral liquid", "a neutral liquid and nothing else at all", "an acid and nothing else", "a base and nothing else"], "key": 0, "why": "Red litmus paper turns blue only in a base.<br>In an acid and in a neutral liquid it stays red.<br>So one unchanged paper cannot separate acid from neutral, and Lorcan is not correct."}, {"d": "hard", "atom": "MAT-077", "stem": "Callista says: \"Passion fruit juice tastes sour and is an acid, so I can test this unlabeled lab liquid the same way: I'll taste it.\" Why is an unlabeled lab liquid never tasted?", "options": ["A lab liquid never tastes sour, even when it is an acid.", "Some acids burn skin, as some bases do.", "Taste says nothing about whether a liquid is an acid.", "Tasting would use up the liquid."], "key": 1, "why": "Acids do taste sour, and passion fruit juice is an acid in food.<br>But some acids, like the sulfuric acid in a car battery, burn.<br>An unlabeled lab liquid could be one of them.<br>So it is never tasted: the lab test is litmus paper, and Callista is not correct."}, {"d": "hard", "atom": "MAT-078", "stem": "A drop of a lab liquid lands on Liesl's finger and feels slippery. She rinses it off and says: \"Slippery is a base's mark, but the lab test is litmus paper.\" Why was she also right to rinse the drop off?", "options": ["Some bases burn skin.", "A slippery liquid is always an acid.", "Rinsing shows whether the drop is a base.", "The drop would spoil the litmus test."], "key": 0, "why": "Bases feel slippery, so the feel is a base's mark.<br>In a lab no liquid is touched or tasted: the test is litmus paper.<br>The sodium hydroxide in drain cleaner is a base, and it burns skin.<br>So rinsing was right, and Liesl is correct."}, {"d": "hard", "atom": "MAT-079", "stem": "Benedikt dips a pH meter into a bottle of clear liquid, and it reads 7. He says: \"It reads 7, so it must be pure water.\" Which liquids read exactly 7 on a pH meter?", "options": ["pure water only", "any liquid that is neutral", "only a liquid with nothing dissolved in it", "any liquid that is not an acid"], "key": 1, "why": "Pure water sits at 7 and is the reference point.<br>But every liquid at pH 7 is neutral, not only pure water.<br>A sugar solution and a table-salt solution read 7 too.<br>So a reading of 7 does not prove pure water, and Benedikt is not correct."}, {"d": "hard", "atom": "MAT-080", "stem": "Lithium sulfate is a salt made when lithium hydroxide, a base, neutralizes sulfuric acid. Kasimir says: \"You could make lithium sulfate with nitric acid instead, because the base decides which salt forms.\" What decides which salt forms?", "options": ["the base alone", "the acid alone", "the acid together with the base", "neither the acid nor the base on its own"], "key": 2, "why": "The base gives the salt its metal part: lithium, from lithium hydroxide.<br>The acid gives the salt its other part: sulfuric acid gives sulfate.<br>Nitric acid would give nitrate instead, so the salt would be lithium nitrate.<br>The base alone does not decide, so Kasimir is not correct."}, {"d": "hard", "atom": "MAT-080", "stem": "Lithium nitrate and lithium sulfate are two salts, each made in a neutralization. Yannick says: \"The two salts share a lithium part, so both were made with the same base, lithium hydroxide.\" Yannick is correct. Why?", "options": ["The acid gives the salt its metal part.", "Two different salts can come only from one base.", "The lithium part came from the water that formed.", "The base gives the salt its metal part."], "key": 3, "why": "The base gives the salt its metal part.<br>Both salts have a lithium part, so both bases had a lithium part: lithium hydroxide.<br>The acids differed: nitric acid gave nitrate, sulfuric acid gave sulfate.<br>So Yannick is correct."}, {"d": "hard", "atom": "MAT-081", "stem": "A beaker holds a base at pH 12. Marit says: \"If I add an acid a little at a time, the pH will fall to 7, and if I keep adding acid it will fall below 7.\" Marit is correct. What is in the beaker when the pH reads exactly 7?", "options": ["neither acid nor base left over", "base left over", "acid left over", "both some acid and some base left over"], "key": 0, "why": "The acid reacts with the base and uses some of it up.<br>Less base means the liquid is less basic, so the pH falls toward 7.<br>Exactly enough acid uses up all the base: pH 7.<br>More acid than that is left over, so the liquid is acidic and the pH is below 7. Marit is correct."}, {"d": "hard", "atom": "MAT-081", "stem": "Runa wants to bring a beaker of acid at pH 2 to exactly pH 7. She pours in sodium hydroxide solution, a base, and the meter reads 9. What should she do now?", "options": ["stir in a little acid", "stir in a little more base", "leave it alone", "heat it until the extra base boils away"], "key": 0, "why": "At 9 the liquid is basic: all the acid is used up and base is left over.<br>An acid uses up base, so a little acid lowers the pH toward 7.<br>More base would push the pH higher.<br>The pH does not settle on its own, and heating does not remove the base."}, {"d": "hard", "atom": "MAT-082", "stem": "Ozan tests a liquid: the meter reads 8, and neither paper changes color. He says: \"The papers say neutral and the meter says basic, so one of my tests must be broken.\" Why can the meter read 8 while neither paper changes color?", "options": ["A liquid at 8 is neutral, exactly like pure water.", "Litmus paper changes color only in acids and never in any base.", "A pH meter cannot read a basic liquid correctly.", "Litmus is too rough to show a liquid only a little from 7."], "key": 3, "why": "Above 7 a liquid is basic, so a reading of 8 means basic, only a little.<br>Litmus is a rough test: a liquid only a little way from 7 can leave both papers unchanged.<br>8 is only a little way from 7.<br>So both results fit, nothing is broken, and Ozan is not correct."}, {"d": "hard", "atom": "MAT-079", "stem": "Three liquids read pH 2, pH 6 and pH 9. Dagny says: \"Two of them are acidic, and the one at 6 is the more acidic of those two.\" Which part of what Dagny says is correct?", "options": ["only the part about two liquids being acidic", "only the part about the liquid at 6 being the more acidic", "both parts", "neither part"], "key": 0, "why": "Above 7 a liquid is basic, and only 9 sits above 7.<br>So the liquid at 9 is the only basic one.<br>Below 7 a liquid is acidic: 6 sits just below 7, so it is acidic, only a little.<br>The lower the pH, the more acidic: 2 is lower than 6.<br>So Dagny is correct."}], "figs": {"l01_three": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 245\" style=\"width:100%;max-width:675px;height:auto\" role=\"img\" aria-label=\"Three beakers, lemon juice, vinegar and sod ght=\"normal\" fill=\"#222\">turns red<\/text><rect x=\"401\" y=\"60\" width=\"70\" height=\"90\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><rect x=\"402\" y=\"96.0\" width=\"68\" height=\"53.0\" fill=\"#d9d9d9\" stroke=\"none\"/><line x1=\"402\" y1=\"96.0\" x2=\"470\" y2=\"96.0\" stroke=\"#222\" stroke-width=\"1\"/><rect x=\"431\" y=\"42\" width=\"10\" height=\"54\" fill=\"url(#litmusblue)\" stroke=\"#222\" stroke-width=\"1\"/><rect x=\"431\" y=\"96\" width=\"10\" height=\"24\" fill=\"#555\" stroke=\"#222\" stroke-width=\"1\"/><text x=\"436.66666666666663\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#222\">soda water<\/text><text x=\"436.66666666666663\" y=\"187\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">turns red<\/text><text x=\"270.0\" y=\"225\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">hatched = blue litmus paper · dark gray = red litmus paper<\/text><\/svg>", "l01_cases": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 295\" style=\"width:100%;max-width:675px;height:auto\" role=\"img\" aria-label=\"Five beakers with blue litmus paper standing in each: vinegar, lemon juice and soda water have turned the dipped end red; pure water and soapy water have left it blue; under the question does blue litmus turn red, a tick under each of the three and a cross under each of the two\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"540\" height=\"295\" fill=\"#ffffff\"/><defs><pattern id=\"litmusblue\" patternUnits=\"userSpaceOnUse\" width=\"4\" height=\"4\" patternTransform=\"rotate(45)\"><rect width=\"4\" height=\"4\" fill=\"#ffffff\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"4\" stroke=\"#555\" stroke-width=\"1.5\"/><\/pattern><\/defs><rect x=\"35\" y=\"60\" width=\"70\" height=\"90\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><rect x=\"36\" y=\"96.0\" width=\"68\" height=\"53.0\" fill=\"#d function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
