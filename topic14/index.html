.<br>So the family is the acids."}, {"type": "text", "tag": "term", "stem": "Litmus paper turns red in one family of liquids and blue in the other, so it shows which family a liquid belongs to. What kind of substance is litmus paper called?", "accept": ["indicator", "an indicator", "indicators"], "why": "The paper turns one of two colors to show a liquid's family.<br>A substance that does this is called an indicator."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video dipped blue litmus paper into vinegar. What did the dipped end do?", "options": ["it turned red", "it stayed blue", "it turned green"], "key": 0, "fb": ["Vinegar is an acid, and acids turn blue litmus paper red.", "The paper stayed blue only in pure water and soapy water; in vinegar the dipped end turned red.", "Litmus paper turns red or blue, never green; in vinegar it turned red."], "why": "Vinegar tastes sour and is an acid.<br>Acids turn blue litmus paper red.<br>So the dipped end turned red."}]}, {"id": "L02", "atom": "MAT-078", "title": "Bases: the slippery family", "video": "could do without a video", "lesson_type": "Categorical lesson with an example sequence (base / not a base, judged from a feel, a taste or a red-litmus result in the same fixed frame as L01); coins base", "check_design": "Type (a) fluency quiz → two recall MCQs (L01: which family turns blue litmus paper red; Topic 3: a physical property), seven two-option items (Is X a base? yes / no) on fresh liquids from a red-litmus result, a feel or a taste, the first item the case type shown last (not a base), key string n y y n n y y, then two student claims, the RIGHT one first (Kenzo: vinegar is not a base because red litmus paper stays red in it; key yes — the article's own non-example, allowed for a claim item; Sadie: a base is a weak kind of acid; key no), then one typed term item (base) last. 12 items.", "headache": ["Soapy water feels slippery between your fingers.", "Washing soda solution feels slippery too.", "A strip of red litmus paper is dipped into each one.", "Each strip turns blue.", "Acids turned blue litmus paper red.", "These liquids do the opposite.", "What are they?"], "forest": ["How do you know a substance is a base?", "Bases feel slippery.", "Bases taste bitter.", "Bases turn red litmus paper blue.", "A substance with these properties is called a base.", "Some bases, like the sodium hydroxide in drain cleaner, burn skin as badly as a strong acid.", "So the lab test is litmus paper, never touch or taste."], "article": [{"t": "idea", "text": "Soapy water feels slippery between your fingers."}, {"t": "idea", "text": "Washing soda solution feels slippery too."}, {"t": "idea", "text": "A strip of red litmus paper is dipped into each one."}, {"t": "idea", "text": "Each strip turns blue."}, {"t": "fig", "key": "l02_two", "cap": "Soapy water and washing soda solution, each with a strip of red litmus paper standing in it. Every dipped end has turned blue. The hatched paper is blue litmus paper and the dark gray paper is red litmus paper."}, {"t": "idea", "text": "Acids turned blue litmus paper red."}, {"t": "idea", "text": "These liquids do the opposite."}, {"t": "idea", "text": "What are they?"}, {"t": "h", "text": "Two facts first"}, {"t": "idea", "text": "A physical property is something you can observe or measure about a material without changing it into anything else."}, {"t": "idea", "text": "Acids taste sour."}, {"t": "idea", "text": "Acids turn blue litmus paper red."}, {"t": "h", "text": "Soapy water first"}, {"t": "idea", "text": "Soapy water feels slippery and tastes bitter."}, {"t": "idea", "text": "Red litmus paper is dipped into soapy water."}, {"t": "idea", "text": "The dipped end turns blue."}, {"t": "h", "text": "Now washing soda solution"}, {"t": "idea", "text": "Washing soda solution feels slippery."}, {"t": "idea", "text": "Red litmus paper is dipped into washing soda solution."}, {"t": "idea", "text": "The dipped end turns blue."}, {"t": "h", "text": "Now vinegar"}, {"t": "idea", "text": "Vinegar tastes sour and does not feel slippery."}, {"t": "idea", "text": "Red litmus paper is dipped into vinegar."}, {"t": "idea", "text": "The paper stays red."}, {"t": "h", "text": "Now ammonia cleaner"}, {"t": "idea", "text": "Ammonia cleaner feels slippery."}, {"t": "idea", "text": "Red litmus paper is dipped into ammonia cleaner."}, {"t": "idea", "text": "The dipped end turns blue."}, {"t": "h", "text": "Now pure water"}, {"t": "idea", "text": "Pure water has no taste and does not feel slippery."}, {"t": "idea", "text": "Red litmus paper is dipped into pure water."}, {"t": "idea", "text": "The paper stays red."}, {"t": "fig", "key": "l02_cases", "cap": "The five liquids with their red strips, and under them the question the marks answer: does red litmus turn blue? A tick for soapy water, washing soda solution and ammonia cleaner; a cross for vinegar and pure water."}, {"t": "h", "text": "The pattern"}, {"t": "idea", "text": "The three slippery liquids all turned red litmus paper blue."}, {"t": "idea", "text": "Vinegar and pure water left the paper red."}, {"t": "idea", "text": "A slippery feel, a bitter taste and a blue strip go together."}, {"t": "h", "text": "The name"}, {"t": "idea", "text": "A substance that feels slippery, tastes bitter and turns red litmus paper blue is called a <b>base<\/b>."}, {"t": "idea", "text": "Soapy water, washing soda solution and ammonia cleaner are bases."}, {"t": "idea", "text": "Vinegar and pure water are not bases."}, {"t": "h", "text": "Acid and base, side by side"}, {"t": "idea", "text": "An acid and a base are opposite families."}, {"t": "idea", "text": "Each family has its own taste, its own feel and its own litmus color."}, {"t": "fig", "key": "l02_table", "cap": "An acid and a base lined up in one table: taste, feel, what blue litmus paper does, and what red litmus paper does."}, {"t": "h", "text": "Bases that burn"}, {"t": "idea", "text": "The sodium hydroxide in drain cleaner is a strong base."}, {"t": "idea", "text": "It burns skin and eyes as badly as a strong acid."}, {"t": "idea", "text": "So in a lab no liquid is touched or tasted; the test is litmus paper."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Bases feel slippery. Bases taste bitter. Bases turn red litmus paper blue. A substance with these properties is called a base. Acids and bases are opposite families: an acid turns blue litmus paper red. A base turns red litmus paper blue."}, {"t": "idea", "text": "Back to the two liquids: soapy water and washing soda solution turned red litmus paper blue."}, {"t": "idea", "text": "So both liquids are bases."}], "script": [{"say": "Soapy water feels slippery between your fingers, and so does washing soda solution.", "screen": "[two beakers: soapy water, washing soda solution; a hand rubs fingers]"}, {"say": "Dip red litmus paper into each one, and each strip turns blue.", "screen": "[dark gray strips dip; the dipped ends turn hatched; legend: hatched = blue litmus paper, dark gray = red]"}, {"say": "Acids turned blue litmus red. These do the opposite: what are they?", "screen": "[a blue strip turning red beside a red strip turning blue; question mark]"}, {"say": "Soapy water first: slippery, bitter, and the dipped end turns blue.", "screen": "[soapy water beaker; strip's dipped end turns hatched; labels: slippery, bitter]"}, {"say": "Washing soda solution: slippery, and the dipped end turns blue.", "screen": "[washing soda solution; same change]"}, {"say": "Vinegar: sour, not slippery, and the paper stays red.", "screen": "[vinegar; strip stays dark gray]"}, {"say": "Ammonia cleaner: slippery, and the dipped end turns blue.", "screen": "[ammonia cleaner; turns hatched]"}, {"say": "Pure water: no taste, not slippery, and the paper stays red.", "screen": "[pure water; stays dark gray]"}, {"say": "The three slippery liquids turned red litmus paper blue; vinegar and pure water left it red.", "screen": "[five beakers; question: Does red litmus turn blue? ticks under three, crosses under two]"}, {"say": "A substance that feels slippery, tastes bitter and turns red litmus paper blue is called a base.", "screen": "[chip: BASE over the three ticked beakers]"}, {"say": "Acids and bases are opposite families: blue litmus red for an acid, red litmus blue for a base.", "screen": "[the acid-and-base table: taste, feel, blue litmus, red litmus]"}, {"say": "The sodium hydroxide in drain cleaner is a strong base. It burns skin.", "screen": "[a drain cleaner bottle with a warning label]"}, {"say": "So in a lab no liquid is touched or tasted; the test is litmus paper.", "screen": "[a strip; crossed-out finger and tongue]"}, {"say": "Back to the two liquids: both turned red litmus paper blue, so both are bases.", "screen": "[the two beakers; ticks; label: bases]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which family of substances turns blue litmus paper red?", "options": ["acids", "indicators", "slippery liquids"], "key": 0, "fb": ["Acids taste sour and turn blue litmus paper red.", "An indicator is the paper itself: it changes color to show a liquid's family.", "The slippery liquids turn red litmus paper blue, the other way round."], "why": "Acids share a set of properties.<br>One property is that they turn blue litmus paper red.<br>So the family that turns blue litmus paper red is the acids."}, {"type": "mcq", "tag": "recall", "stem": "Which of these is a physical property of dishwashing liquid?", "options": ["Its price is low.", "It feels slippery.", "It stands on the shelf."], "key": 1, "fb": ["A price is not something you can observe or measure about the liquid itself.", "A physical property is something you can observe about a material, and its slippery feel is one.", "Where the bottle stands is not something you can observe or measure about the liquid."], "why": "A physical property is something you can observe or measure about a material without changing it into anything else.<br>You can feel that the liquid is slippery.<br>So its slippery feel is a physical property."}, {"type": "mcq", "tag": "fluency", "stem": "Red litmus paper dipped in tomato juice stays red. Is tomato juice a base?", "options": ["yes", "no"], "key": 1, "fb": ["A base turns red litmus paper blue; this paper stayed red.", "Bases turn red litmus paper blue, and this paper stayed red."], "why": "Bases turn red litmus paper blue.<br>In tomato juice the paper stayed red.<br>So tomato juice is not a base."}, {"type": "mcq", "tag": "fluency", "stem": "Red litmus paper dipped in oven cleaner turns blue. Is oven cleaner a base?", "options": ["yes", "no"], "key": 0, "fb": ["Bases turn red litmus paper blue, and this paper turned blue.", "The paper turned blue, and turning red litmus paper blue is the mark of a base."], "why": "Bases turn red litmus paper blue.<br>In oven cleaner the paper turned blue.<br>So oven cleaner is a base."}, {"type": "mcq", "tag": "fluency", "stem": "Red litmus paper dipped in milk of magnesia turns blue. Is milk of magnesia a base?", "options": ["yes", "no"], "key": 0, "fb": ["Bases turn red litmus paper blue, and this paper turned blue.", "The paper turned blue, and turning red litmus paper blue is the mark of a base."], "why": "Bases turn red litmus paper blue.<br>In milk of magnesia the paper turned blue.<br>So milk of magnesia is a base."}, {"type": "mcq", "tag": "fluency", "stem": "Red litmus paper dipped in distilled water stays red. Is distilled water a base?", "options": ["yes", "no"], "key": 1, "fb": ["A base turns red litmus paper blue; this paper stayed red.", "Bases turn red litmus paper blue, and this paper stayed red."], "why": "Bases turn red litmus paper blue.<br>In distilled water the paper stayed red.<br>So distilled water is not a base."}, {"type": "mcq", "tag": "fluency", "stem": "Buttermilk tastes sour, and red litmus paper dipped in it stays red. Is buttermilk a base?", "options": ["yes", "no"], "key": 1, "fb": ["A sour taste and a paper that stays red are an acid's marks, not a base's.", "Buttermilk shows an acid's marks: a sour taste, and red litmus paper that stays red."], "why": "Bases taste bitter and turn red litmus paper blue.<br>Buttermilk tastes sour, and the paper stayed red.<br>So buttermilk is not a base."}, {"type": "mcq", "tag": "fluency", "stem": "Borax stirred into water makes a solution that feels slippery between the fingers. Is the borax solution a base?", "options": ["yes", "no"], "key": 0, "fb": ["Bases feel slippery, and the borax solution feels slippery.", "A slippery feel is one of the properties bases share."], "why": "Bases feel slippery.<br>The borax solution feels slippery.<br>So the borax solution is a base."}, {"type": "mcq", "tag": "fluency", "stem": "Wood ash is stirred into water. Red litmus paper dipped in the water turns blue. Is the wood-ash water a base?", "options": ["yes", "no"], "key": 0, "fb": ["Bases turn red litmus paper blue, and this paper turned blue.", "The paper turned blue, and turning red litmus paper blue is the mark of a base."], "why": "Bases turn red litmus paper blue.<br>In the wood-ash water the paper turned blue.<br>So the wood-ash water is a base."}, {"type": "mcq", "tag": "misconception", "stem": "Kenzo says: \"Vinegar is not a base, because red litmus paper stays red in it.\" Is Kenzo correct?", "options": ["yes", "no"], "key": 0, "fb": ["Bases turn red litmus paper blue, and vinegar leaves the paper red, so vinegar is not a base.", "A base turns red litmus paper blue; vinegar leaves the paper red, so vinegar is not a base but an acid."], "why": "Bases turn red litmus paper blue.<br>In vinegar the paper stays red.<br>So vinegar is not a base, and Kenzo is correct."}, {"type": "mcq", "tag": "misconception", "stem": "Sadie says: \"A base is just a weak kind of acid.\" Is Sadie correct?", "options": ["yes", "no"], "key": 1, "fb": ["A base is the opposite family: it turns red litmus paper blue, the reverse of what an acid does.", "Acids and bases are opposite families: an acid turns blue litmus paper red, and a base turns red litmus paper blue."], "why": "An acid turns blue litmus paper red.<br>A base does the opposite: it turns red litmus paper blue.<br>A base is the opposite family, not a kind of acid, so Sadie is not correct."}, {"type": "text", "tag": "term", "stem": "Liquids that feel slippery and turn red litmus paper blue all belong to one family. What is the family called?", "accept": ["base", "bases", "a base", "the bases", "the base family"], "why": "A slippery feel and red litmus paper turning blue are properties bases share.<br>So the family is the bases."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video dipped red litmus paper into soapy water. What did the dipped end do?", "options": ["it stayed red", "it turned green", "it turned blue"], "key": 2, "fb": ["The paper stayed red only in vinegar and pure water; in soapy water the dipped end turned blue.", "Litmus paper turns red or blue, never green; in soapy water it turned blue.", "Soapy water is a base, and bases turn red litmus paper blue."], "why": "Soapy water feels slippery and is a base.<br>Bases turn red litmus paper blue.<br>So the dipped end turned blue."}]}, {"id": "L03", "atom": "MAT-079", "title": "The pH scale", "video": "could do without a video", "lesson_type": "Categorical lesson on a drawn scale (acidic / neutral / basic from a pH, water at 7 the reference point); coins pH, the pH scale, neutral, acidic, basic", "check_design": "Type (a) fluency quiz → two recall MCQs (L01: the family that tastes sour and turns blue litmus paper red; L02: the family that feels slippery and turns red litmus paper blue), five three-option sorts from a marker on the bare drawn scale (9, 3, 7, 6, 8: the first item the case type shown last, basic; both boundary cases), three two-option comparisons read from a bar chart (which is more acidic / more basic; key string B B A), two student claims (Nour: pH 0 means no acid at all, key no; Juno: pH 14 is the most basic reading on the scale, key yes), then two typed terms (pH; neutral) last. 14 items.", "headache": ["Lemon juice and soda water are both acids.", "Yet lemon juice tastes far more sour.", "Litmus paper turns red in both and cannot tell them apart.", "A pH meter is a probe with a readout that gives a liquid a number.", "Dipped in lemon juice it shows 2.", "Dipped in soda water it shows 4.", "Dipped in pure water it shows 7.", "What does the number tell you?"], "forest": ["How do you say how acidic or how basic a liquid is?", "Chemists use a scale from 0 to 14 called the pH scale.", "Pure water sits in the middle, at pH 7.", "A liquid at pH 7 is called neutral.", "Below 7 the liquid is acidic.", "The lower the pH, the more acidic the liquid is.", "Above 7 the liquid is basic.", "The higher the pH, the more basic the liquid is."], "article": [{"t": "idea", "text": "Lemon juice and soda water are both acids."}, {"t": "idea", "text": "Yet lemon juice tastes far more sour."}, {"t": "idea", "text": "Litmus paper turns red in both and cannot tell them apart."}, {"t": "idea", "text": "A pH meter is a probe with a readout that gives a liquid a number."}, {"t": "idea", "text": "Dipped in lemon juice it shows 2."}, {"t": "idea", "text": "Dipped in soda water it shows 4."}, {"t": "idea", "text": "Dipped in pure water it shows 7."}, {"t": "fig", "key": "l03_meters", "cap": "Three beakers with a meter dipped in each: lemon juice reads 2, soda water reads 4, pure water reads 7."}, {"t": "idea", "text": "What does the number tell you?"}, {"t": "h", "text": "Two facts first"}, {"t": "idea", "text": "Acids taste sour."}, {"t": "idea", "text": "Acids turn blue litmus paper red."}, {"t": "idea", "text": "Bases feel slippery and taste bitter."}, {"t": "idea", "text": "Bases turn red litmus paper blue."}, {"t": "h", "text": "The meter's number"}, {"t": "idea", "text": "The meter gives every liquid a number from 0 to 14."}, {"t": "idea", "text": "This number is called the <b>pH<\/b> of the liquid."}, {"t": "idea", "text": "The two letters are said one at a time: p, H."}, {"t": "h", "text": "Pure water first"}, {"t": "idea", "text": "Pure water reads pH 7."}, {"t": "idea", "text": "Pure water is not an acid and not a base."}, {"t": "idea", "text": "A liquid at pH 7 is called <b>neutral<\/b>."}, {"t": "idea", "text": "Pure water is the reference point: every other liquid is measured against it."}, {"t": "h", "text": "Below 7: the acids"}, {"t": "idea", "text": "Lemon juice reads pH 2."}, {"t": "idea", "text": "Vinegar reads pH 3."}, {"t": "idea", "text": "Soda water reads pH 4."}, {"t": "idea", "text": "All three are acids, and all three sit below 7."}, {"t": "idea", "text": "A liquid with a pH below 7 is called <b>acidic<\/b>."}, {"t": "idea", "text": "Lemon juice's pH is lower than soda water's."}, {"t": "idea", "text": "Lemon juice also tastes far more sour."}, {"t": "idea", "text": "The lower the pH, the more acidic the liquid is."}, {"t": "h", "text": "Above 7: the bases"}, {"t": "idea", "text": "Baking soda solution reads pH 8."}, {"t": "idea", "text": "Soapy water reads pH 10."}, {"t": "idea", "text": "Ammonia cleaner reads pH 11."}, {"t": "idea", "text": "All three are bases, and all three sit above 7."}, {"t": "idea", "text": "A liquid with a pH above 7 is called <b>basic<\/b>."}, {"t": "idea", "text": "The higher the pH, the more basic the liquid is."}, {"t": "fig", "key": "l03_scale", "cap": "The seven liquids on one line from 0 to 14: lemon juice at 2, vinegar at 3, soda water at 4, pure water at 7, baking soda solution at 8, soapy water at 10, ammonia cleaner at 11. Left of 7 is more acidic; right of 7 is more basic."}, {"t": "h", "text": "The line's name"}, {"t": "idea", "text": "The line from 0 to 14 is called the <b>pH scale<\/b>."}, {"t": "idea", "text": "Every liquid has one place on it."}, {"t": "fig", "key": "l03_table", "cap": "The seven liquids in one table: the pH of each, and whether it is acidic, neutral or basic."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "A liquid at pH 6 sits just below 7, so it is acidic, only a little."}, {"t": "idea", "text": "A liquid at pH 8 sits just above 7, so it is basic, only a little."}, {"t": "idea", "text": "A liquid at pH 0 sits at the most acidic end of the scale."}, {"t": "idea", "text": "So pH 0 does not mean no acid; it means the most acidic a liquid can be."}, {"t": "idea", "text": "A liquid at pH 14 sits at the most basic end."}, {"t": "fig", "key": "l03_ends", "cap": "The two ends of the scale: most acidic at 0, neutral pure water at 7, most basic at 14."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The pH scale runs from 0 to 14. Pure water sits in the middle, at pH 7. A liquid at pH 7 is called neutral. Below pH 7 a liquid is acidic. The lower the pH, the more acidic it is. Above pH 7 a liquid is basic. The higher the pH, the more basic it is."}, {"t": "idea", "text": "Back to the meter: lemon juice at pH 2 is more acidic than soda water at pH 4."}, {"t": "idea", "text": "So the pH tells you how acidic or how basic a liquid is, with pure water at 7 as the reference point."}], "script": [{"say": "Lemon juice and soda water are both acids, yet lemon juice tastes far more sour.", "screen": "[two beakers; a screwed-up face over the lemon juice]"}, {"say": "Litmus paper turns red in both, so it cannot tell them apart.", "screen": "[a strip dips into each; both dipped ends turn dark gray]"}, {"say": "A meter gives a liquid a number: lemon juice reads 2, soda water 4, pure water 7.", "screen": "[three meters; readouts 2, 4, 7]"}, {"say": "What does the number tell you?", "screen": "[question mark]"}, {"say": "The meter gives every liquid a number from 0 to 14: the pH of the liquid.", "screen": "[chip: pH; a bare line from 0 to 14 appears]"}, {"say": "Pure water sits in the middle at pH 7, and a liquid at pH 7 is called neutral.", "screen": "[marker at 7: pure water; chip: NEUTRAL]"}, {"say": "The acids sit below 7: lemon juice at 2, vinegar at 3, soda water at 4.", "screen": "[markers slide onto 2, 3, 4]"}, {"say": "A liquid below 7 is called acidic, and the lower the pH, the more acidic it is.", "screen": "[arrow pointing left under the line: more acidic; chip: ACIDIC]"}, {"say": "The bases sit above 7: baking soda solution at 8, soapy water at 10, ammonia cleaner at 11.", "screen": "[markers slide onto 8, 10, 11]"}, {"say": "A liquid above 7 is called basic, and the higher the pH, the more basic it is.", "screen": "[arrow pointing right: more basic; chip: BASIC]"}, {"say": "This line from 0 to 14 is called the pH scale. Its 0 end is the most acidic end, not no acid.", "screen": "[chip: THE pH SCALE over the whole line; label at 0: most acidic]"}, {"say": "Back to the meter: lemon juice at pH 2 is more acidic than soda water at pH 4.", "screen": "[the two markers; the arrow toward 0]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which family of substances tastes sour and turns blue litmus paper red?", "options": ["bases", "acids", "indicators"], "key": 1, "fb": ["Bases taste bitter and turn red litmus paper blue.", "Acids taste sour and turn blue litmus paper red.", "An indicator is the paper that changes color, not a family of liquids."], "why": "Acids share a set of properties.<br>They taste sour, and they turn blue litmus paper red.<br>So the family is the acids."}, {"type": "mcq", "tag": "recall", "stem": "Which family of substances feels slippery and turns red litmus paper blue?", "options": ["acids", "indicators", "bases"], "key": 2, "fb": ["Acids taste sour and turn blue litmus paper red.", "An indicator is the paper that changes color, not a family of liquids.", "Bases feel slippery, taste bitter and turn red litmus paper blue."], "why": "Bases share a set of properties.<br>They feel slippery, taste bitter and turn red litmus paper blue.<br>So the family is the bases."}, {"type": "mcq", "tag": "fluency", "fig": "s_9", "stem": "The scale marks a liquid's pH. The liquid reads pH 9. Is the liquid acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 2, "fb": ["An acidic liquid sits below 7, and 9 sits above 7.", "A neutral liquid sits exactly at 7, and 9 sits above 7.", "Above 7 a liquid is basic, and 9 sits above 7."], "why": "Pure water sits at 7.<br>The marker at 9 sits above 7.<br>Above 7 a liquid is basic, so this liquid is basic."}, {"type": "mcq", "tag": "fluency", "fig": "s_3", "stem": "The scale marks a liquid's pH. The liquid reads pH 3. Is the liquid acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 0, "fb": ["Below 7 a liquid is acidic, and 3 sits below 7.", "A neutral liquid sits exactly at 7, and 3 sits below 7.", "A basic liquid sits above 7, and 3 sits below 7."], "why": "Pure water sits at 7.<br>The marker at 3 sits below 7.<br>Below 7 a liquid is acidic, so this liquid is acidic."}, {"type": "mcq", "tag": "fluency", "fig": "s_7", "stem": "The scale marks a liquid's pH. The liquid reads pH 7. Is the liquid acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 1, "fb": ["An acidic liquid sits below 7; this marker sits exactly on 7.", "A liquid at exactly 7, where pure water sits, is neutral.", "A basic liquid sits above 7; this marker sits exactly on 7."], "why": "Pure water sits at 7 and is neutral.<br>The marker sits exactly on 7.<br>So this liquid is neutral."}, {"type": "mcq", "tag": "fluency", "fig": "s_6", "stem": "The scale marks a liquid's pH. The liquid reads pH 6. Is the liquid acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 0, "fb": ["Below 7 a liquid is acidic, and 6 sits just below 7: acidic, only a little.", "A neutral liquid sits exactly at 7, and 6 sits one step below it.", "A basic liquid sits above 7, and 6 sits below 7."], "why": "Pure water sits at 7.<br>The marker at 6 sits just below 7.<br>Below 7 a liquid is acidic, so this liquid is acidic, only a little."}, {"type": "mcq", "tag": "fluency", "fig": "s_8", "stem": "The scale marks a liquid's pH. The liquid reads pH 8. Is the liquid acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 2, "fb": ["An acidic liquid sits below 7, and 8 sits above 7.", "A neutral liquid sits exactly at 7, and 8 sits one step above it.", "Above 7 a liquid is basic, and 8 sits just above 7: basic, only a little."], "why": "Pure water sits at 7.<br>The marker at 8 sits just above 7.<br>Above 7 a liquid is basic, so this liquid is basic, only a little."}, {"type": "mcq", "tag": "fluency", "fig": "bars_a", "stem": "The bar chart shows the pH of two drinks. Which drink is more acidic?", "options": ["black coffee", "apple juice"], "key": 1, "fb": ["Black coffee's bar reaches 5, higher than apple juice's 3, so black coffee is the less acidic of the two.", "Apple juice's bar reaches 3 and black coffee's reaches 5; the lower pH is the more acidic."], "why": "The lower the pH, the more acidic the liquid is.<br>Apple juice's bar reaches 3 and black coffee's reaches 5.<br>3 is lower, so apple juice is more acidic."}, {"type": "mcq", "tag": "fluency", "fig": "bars_b", "stem": "The bar chart shows the pH of two liquids. Which liquid is more basic?", "options": ["sea water", "washing soda solution"], "key": 1, "fb": ["Sea water's bar reaches 8, lower than the washing soda solution's 11, so sea water is the less basic of the two.", "The washing soda solution's bar reaches 11 and sea water's reaches 8; the higher pH is the more basic."], "why": "The higher the pH, the more basic the liquid is.<br>The washing soda solution's bar reaches 11 and sea water's reaches 8.<br>11 is higher, so the washing soda solution is more basic."}, {"type": "mcq", "tag": "fluency", "fig": "bars_c", "stem": "The bar chart shows the pH of two kinds of water. Which is more acidic?", "options": ["rainwater", "tap water"], "key": 0, "fb": ["Rainwater's bar reaches 6 and tap water's reaches 7; the lower pH is the more acidic.", "Tap water's bar reaches 7, where pure water sits: neutral, not acidic at all."], "why": "The lower the pH, the more acidic the liquid is.<br>Rainwater's bar reaches 6 and tap water's reaches 7.<br>6 is lower, so rainwater is more acidic."}, {"type": "mcq", "tag": "misconception", "stem": "Nour says: \"pH 0 means there is no acid in the liquid at all.\" Is Nour correct?", "options": ["yes", "no"], "key": 1, "fb": ["pH 0 is the most acidic end of the scale; the lower the pH, the more acidic the liquid.", "The lower the pH, the more acidic the liquid is, so pH 0 is the most acidic end of the scale."], "why": "Below 7 a liquid is acidic.<br>The lower the pH, the more acidic the liquid is.<br>pH 0 is the most acidic end of the scale, not no acid, so Nour is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Juno says: \"A liquid at pH 14 is basic, and 14 is the most basic reading on the scale, because 14 is the top of the scale.\" Is Juno correct?", "options": ["yes", "no"], "key": 0, "fb": ["The higher the pH, the more basic the liquid is, and 14 is the highest reading the scale has.", "Above 7 a liquid is basic, and the higher the pH, the more basic it is; 14 is the top of the scale, so it is the most basic end."], "why": "Above 7 a liquid is basic.<br>The higher the pH, the more basic the liquid is.<br>14 is the highest reading on the scale, so a liquid at pH 14 has the most basic reading on the scale, and Juno is correct."}, {"type": "text", "tag": "term", "stem": "Every liquid can be given a number from 0 to 14 that says how acidic or how basic it is. What is this number called?", "accept": ["pH", "the pH", "ph", "the ph", "pH value", "the pH value", "a pH"], "why": "The meter gives every liquid a number from 0 to 14.<br>This number is called the pH of the liquid."}, {"type": "text", "tag": "term", "stem": "Pure water reads 7, so it is neither acidic nor basic. What word names a liquid at 7?", "accept": ["neutral", "a neutral liquid", "it is neutral"], "why": "Pure water sits in the middle of the scale at 7.<br>It is not an acid and not a base.<br>A liquid at 7 is called neutral."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video put pure water on the pH scale. Where did its marker sit?", "options": ["at 0", "at 7", "at 14"], "key": 1, "fb": ["0 is the most acidic end; pure water sits in the middle.", "Pure water sits in the middle of the scale at pH 7, and a liquid at 7 is neutral.", "14 is the most basic end; pure water sits in the middle."], "why": "The pH scale runs from 0 to 14.<br>Pure water sits in the middle, at pH 7.<br>So its marker sat at 7."}]}, {"id": "L04", "atom": "MAT-082", "title": "Sort with litmus or with pH", "video": "could do without a video", "lesson_type": "Procedural lesson (a one-step routine): read the one clue you have, a litmus color or a pH, and put the liquid in one of three boxes, acid, base or neutral; no term coined", "check_design": "Type (a) fluency quiz → three recall MCQs (L01: which paper an acid changes; L02: which paper a base changes; L03: where a neutral liquid sits on the scale), then ten three-option items (acid / base / neutral) on fresh liquids, alternating a litmus clue and a pH clue: the two-clue table is supplied on the first two only, as the scaffold that is then dropped; each pH item shows the reading as a bare marker on the scale; the last two items give both clues, which agree; key string a b n a b b a n a b (acid 4, base 4, neutral 2; no four alternate). 13 items.", "headache": ["Suppose you have six unlabeled liquids.", "For three of them, you have only a litmus test.", "For the other three, you have only a pH reading.", "Sort all six into acid, base or neutral."], "forest": ["How do you sort a liquid when you have one clue?", "If the clue is litmus, read the color.", "Blue litmus turning red means acid.", "Red litmus turning blue means base.", "Neither paper changing means neutral.", "If the clue is a pH, read the scale.", "Below 7 means acid.", "Exactly 7 means neutral.", "Above 7 means base."], "article": [{"t": "idea", "text": "Suppose you have six unlabeled liquids."}, {"t": "idea", "text": "For three of them, you have only a litmus test."}, {"t": "idea", "text": "For the other three, you have only a pH reading."}, {"t": "fig", "key": "l04_six_open", "cap": "Six beakers, liquids P to U, each with the one clue you have written under it."}, {"t": "idea", "text": "Sort all six into acid, base or neutral."}, {"t": "h", "text": "Three facts first"}, {"t": "idea", "text": "Acids turn blue litmus paper red."}, {"t": "idea", "text": "Bases turn red litmus paper blue."}, {"t": "idea", "text": "On the pH scale, pure water sits at 7."}, {"t": "idea", "text": "Below 7 a liquid is acidic."}, {"t": "idea", "text": "Above 7 a liquid is basic."}, {"t": "h", "text": "One clue: a litmus color"}, {"t": "idea", "text": "Blue litmus paper turning red means the liquid is an acid."}, {"t": "idea", "text": "Red litmus paper turning blue means the liquid is a base."}, {"t": "idea", "text": "Neither paper changing color means the liquid is neutral."}, {"t": "idea", "text": "Litmus paper is a rough test."}, {"t": "idea", "text": "A liquid only a little way from 7 can leave both papers unchanged."}, {"t": "h", "text": "One clue: a pH"}, {"t": "idea", "text": "A pH below 7 means the liquid is acidic, so it goes in the acid box."}, {"t": "idea", "text": "A pH of exactly 7 means the liquid is neutral."}, {"t": "idea", "text": "A pH above 7 means the liquid is basic, so it goes in the base box."}, {"t": "fig", "key": "l04_table", "cap": "The six clues in one table, and the box each clue puts a liquid in."}, {"t": "h", "text": "Sort the six"}, {"t": "idea", "text": "Liquid P turned blue litmus paper red, so liquid P is an acid."}, {"t": "idea", "text": "Liquid Q reads pH 9, above 7, so liquid Q is a base."}, {"t": "idea", "text": "Liquid R changed neither paper, so liquid R is neutral."}, {"t": "idea", "text": "Liquid S reads pH 7, so liquid S is neutral."}, {"t": "idea", "text": "Liquid T turned red litmus paper blue, so liquid T is a base."}, {"t": "idea", "text": "Liquid U reads pH 3, below 7, so liquid U is an acid."}, {"t": "fig", "key": "l04_six", "cap": "The six beakers again, each clue with the box it puts the liquid in: P acid, Q base, R neutral, S neutral, T base, U acid."}, {"t": "h", "text": "Two clues agree"}, {"t": "idea", "text": "Suppose you had both clues for liquid U."}, {"t": "idea", "text": "Its pH of 3 puts it in the acid box."}, {"t": "idea", "text": "Blue litmus paper dipped in it turns red, and that puts it in the acid box too."}, {"t": "idea", "text": "Both clues put liquid U in the same box."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A litmus color or a pH puts a liquid in one of three boxes: acid, base or neutral. Blue litmus turning red, or a pH below 7, means acid. Red litmus turning blue, or a pH above 7, means base. Neither paper changing, or a pH of exactly 7, means neutral."}, {"t": "idea", "text": "Back to the six liquids: P and U are acids, Q and T are bases, and R and S are neutral."}], "script": [{"say": "Suppose you have six unlabeled liquids and one clue for each.", "screen": "[six beakers, P to U, a clue under each]"}, {"say": "Three come with a litmus result, three with a pH reading: sort all six into acid, base or neutral.", "screen": "[three empty boxes: acid, base, neutral]"}, {"say": "If the clue is litmus, read the color change. Blue turning red means acid, red turning blue means base, neither changing means neutral.", "screen": "[the table's first three rows appear one by one]"}, {"say": "If the clue is a pH, read the scale: below 7 acid, exactly 7 neutral, above 7 base.", "screen": "[the table's last three rows appear]"}, {"say": "Now sort: liquid P turned blue litmus red, so P is an acid.", "screen": "[P slides into the acid box]"}, {"say": "Liquid Q reads pH 9, above 7, so Q is a base.", "screen": "[Q slides into the base box]"}, {"say": "Liquid R changed neither paper and liquid S reads pH 7, so both are neutral.", "screen": "[R and S slide into the neutral box]"}, {"say": "Liquid T turned red litmus blue, so T is a base. Liquid U reads pH 3, so U is an acid.", "screen": "[T into base; U into acid]"}, {"say": "Both clues for U agree: pH 3 says acid, and blue litmus turning red says acid too.", "screen": "[U with both clues; both arrows point at the acid box]"}, {"say": "So a litmus color or a pH puts a liquid in one of three boxes: acid, base or neutral.", "screen": "[rule slide reuses the table; rule text]"}, {"say": "Back to the six: P and U are acids, Q and T are bases, R and S are neutral.", "screen": "[the three filled boxes]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which litmus paper does an acid change, and to which color?", "options": ["blue litmus paper, to red", "red litmus paper, to blue", "neither paper changes"], "key": 0, "fb": ["Acids turn blue litmus paper red.", "Red litmus paper turning blue is a base's mark.", "A liquid that changes neither paper is neutral."], "why": "Acids share a set of properties.<br>One is that they turn blue litmus paper red.<br>So an acid changes blue litmus paper, to red."}, {"type": "mcq", "tag": "recall", "stem": "Which litmus paper does a base change, and to which color?", "options": ["blue litmus paper, to red", "red litmus paper, to blue", "neither paper changes"], "key": 1, "fb": ["Blue litmus paper turning red is an acid's mark.", "Bases turn red litmus paper blue.", "A liquid that changes neither paper is neutral."], "why": "Bases share a set of properties.<br>One is that they turn red litmus paper blue.<br>So a base changes red litmus paper, to blue."}, {"type": "mcq", "tag": "recall", "stem": "Where does a neutral liquid sit on the pH scale?", "options": ["below 7", "at 7", "above 7"], "key": 1, "fb": ["Below 7 a liquid is acidic.", "Pure water sits at 7, and a liquid at 7 is neutral.", "Above 7 a liquid is basic."], "why": "Pure water is the reference point and sits at 7.<br>A liquid at 7 is neutral.<br>So a neutral liquid sits at 7."}, {"type": "mcq", "tag": "fluency", "fig": "t_1", "stem": "The table of clues is supplied. Blue litmus paper dipped in pineapple juice turns red. Which box does pineapple juice go in?", "options": ["acid", "base", "neutral"], "key": 0, "fb": ["Blue litmus paper turning red means acid.", "Red litmus paper turning blue would mean base; here blue paper turned red.", "Neither paper changing would mean neutral; here the paper changed."], "why": "The clue is a litmus color.<br>Blue litmus paper turning red means acid.<br>So pineapple juice goes in the acid box."}, {"type": "mcq", "tag": "fluency", "fig": "t_2", "stem": "The table of clues is supplied. A pH meter dipped in window cleaner reads 11. Which box does the window cleaner go in?", "options": ["acid", "base", "neutral"], "key": 1, "fb": ["A pH below 7 would mean acid; 11 is above 7.", "A pH above 7 means base, and 11 is above 7.", "A pH of exactly 7 would mean neutral; 11 is above 7."], "why": "The clue is a pH.<br>11 is above 7, and a pH above 7 means base.<br>So the window cleaner goes in the base box."}, {"type": "mcq", "tag": "fluency", "stem": "Neither blue nor red litmus paper changes color in tap water. Which box does the tap water go in?", "options": ["acid", "base", "neutral"], "key": 2, "fb": ["An acid would turn blue litmus paper red; nothing changed.", "A base would turn red litmus paper blue; nothing changed.", "Neither paper changing color means neutral."], "why": "The clue is a litmus result.<br>Neither paper changing color means neutral.<br>So the tap water goes in the neutral box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_4", "stem": "The scale marks a liquid's pH. A pH meter dipped in a yogurt drink reads 4. Which box does the yogurt drink go in?", "options": ["acid", "base", "neutral"], "key": 0, "fb": ["A pH below 7 means acid, and 4 is below 7.", "A pH above 7 would mean base; 4 is below 7.", "A pH of exactly 7 would mean neutral; 4 is below 7."], "why": "The clue is a pH.<br>4 is below 7, and a pH below 7 means acid.<br>So the yogurt drink goes in the acid box."}, {"type": "mcq", "tag": "fluency", "stem": "Red litmus paper dipped in a laundry detergent solution turns blue. Which box does the solution go in?", "options": ["acid", "base", "neutral"], "key": 1, "fb": ["Blue litmus paper turning red would mean acid; here red paper turned blue.", "Red litmus paper turning blue means base.", "Neither paper changing would mean neutral; here the paper changed."], "why": "The clue is a litmus color.<br>Red litmus paper turning blue means base.<br>So the laundry detergent solution goes in the base box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_8", "stem": "The scale marks a liquid's pH. A pH meter dipped in sea water reads 8. Which box does the sea water go in?", "options": ["acid", "base", "neutral"], "key": 1, "fb": ["A pH below 7 would mean acid; 8 is above 7.", "A pH above 7 means base, and 8 is above 7.", "A pH of exactly 7 would mean neutral; 8 is one step above 7."], "why": "The clue is a pH.<br>8 is above 7, and a pH above 7 means base.<br>So the sea water goes in the base box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_5", "stem": "The scale marks a liquid's pH. A pH meter dipped in black tea reads 5. Which box does the black tea go in?", "options": ["acid", "base", "neutral"], "key": 0, "fb": ["A pH below 7 means acid, and 5 is below 7.", "A pH above 7 would mean base; 5 is below 7.", "A pH of exactly 7 would mean neutral; 5 is below 7."], "why": "The clue is a pH.<br>5 is below 7, and a pH below 7 means acid.<br>So the black tea goes in the acid box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_7", "stem": "The scale marks a liquid's pH. A pH meter dipped in a glass of milk reads 7. Which box does the milk go in?", "options": ["acid", "base", "neutral"], "key": 2, "fb": ["A pH below 7 would mean acid; the meter reads exactly 7.", "A pH above 7 would mean base; the meter reads exactly 7.", "A pH of exactly 7 means neutral."], "why": "The clue is a pH.<br>The reading is exactly 7, and a pH of exactly 7 means neutral.<br>So the milk goes in the neutral box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_3", "stem": "The scale marks a liquid's pH. Blue litmus paper dipped in cola turns red, and a pH meter dipped in it reads 3. Which box does the cola go in?", "options": ["acid", "base", "neutral"], "key": 0, "fb": ["Both clues agree: blue litmus turning red means acid, and a pH below 7 means acid.", "Blue paper turning red means acid, not base; and 3 is below 7, not above.", "The paper changed, so the cola is not neutral; and 3 is not 7."], "why": "Blue litmus paper turning red means acid.<br>A pH of 3 is below 7, and a pH below 7 means acid.<br>Both clues put the cola in the acid box."}, {"type": "mcq", "tag": "fluency", "fig": "s4_9", "stem": "The scale marks a liquid's pH. Red litmus paper dipped in a borax solution turns blue, and a pH meter dipped in it reads 9. Which box does the borax solution go in?", "options": ["acid", "base", "neutral"], "key": 1, "fb": ["Red paper turning blue means base, not acid; and 9 is above 7, not below.", "Both clues agree: red litmus turning blue means base, and a pH above 7 means base.", "The paper changed, so the borax solution is not neutral; and 9 is not 7."], "why": "Red litmus paper turning blue means base.<br>A pH of 9 is above 7, and a pH above 7 means base.<br>Both clues put the borax solution in the base box."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video sorted liquid U, which reads pH 3. Which box did it go in?", "options": ["acid", "base", "neutral"], "key": 0, "fb": ["A pH below 7 means acid, and 3 is below 7.", "A pH above 7 would mean base; 3 is below 7.", "A pH of exactly 7 would mean neutral; 3 is below 7."], "why": "Liquid U reads pH 3.<br>3 is below 7, and a pH below 7 means acid.<br>So liquid U went in the acid box."}]}, {"id": "L05", "atom": "MAT-081", "title": "Add a base to an acid: the pH climbs", "video": "definitely a video", "lesson_type": "Transformation lesson (a change read on a drawn scale): a base reacts with an acid and uses some of it up, so the pH climbs toward 7, reaches 7 with exactly enough base, and passes 7 with more; coins neutralization", "check_design": "Type (c) concept understanding → two recall MCQs (L03: a liquid at pH 4; Topic 12: what forms in a chemical reaction), the what (nitric acid at pH 2 with a base stirred in: rises / stays / falls), the why as a free response on a FRESH case (sulfuric acid at pH 1 with sodium hydroxide added, pH 1 → 5), five fluency items on direction with the marker drawn on the bare scale (base into pH 4; acid into pH 12; a little base; exactly enough; too much — key string B B A B C), two student claims, the RIGHT one first (Gideon: adding an acid to a base makes the base's pH fall, key yes; Odette: any amount of base makes an acid neutral at once, key no), a transfer (a lake made acidic by rain; slaked lime, a base, spread into it), then the coined term typed last. 13 items.", "headache": ["Suppose too much stomach acid, at pH 2, gives you heartburn.", "You take two antacid tablets.", "The tablets are a base.", "The burning stops.", "What did the base do to the acid's pH?"], "forest": ["What happens to the pH of an acid when you add a base?", "The base reacts with the acid and uses up some of it.", "Less acid means the liquid is less acidic.", "A less acidic liquid has a higher pH.", "So the pH climbs toward 7.", "Exactly enough base takes the pH to 7: the liquid is neutral.", "More base than that pushes the pH past 7, into the basic side.", "This reaction is called neutralization."], "article": [{"t": "idea", "text": "Suppose too much stomach acid, at pH 2, gives you heartburn."}, {"t": "idea", "text": "You take two antacid tablets."}, {"t": "idea", "text": "The tablets are a base."}, {"t": "idea", "text": "The burning stops."}, {"t": "fig", "key": "l05_open", "cap": "The pH scale with stomach acid marked at 2."}, {"t": "idea", "text": "What did the base do to the acid's pH?"}, {"t": "h", "text": "Two facts first"}, {"t": "idea", "text": "Below pH 7 a liquid is acidic, and the lower the pH, the more acidic it is."}, {"t": "idea", "text": "In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form."}, {"t": "h", "text": "The base reacts with the acid"}, {"t": "idea", "text": "Stomach acid is dilute hydrochloric acid."}, {"t": "idea", "text": "An antacid tablet made with magnesium hydroxide is a base."}, {"t": "idea", "text": "The base reacts with the acid."}, {"t": "idea", "text": "Two new substances form: magnesium chloride and water."}, {"t": "fig", "key": "l05_words", "cap": "The reaction in one line: magnesium hydroxide + hydrochloric acid → magnesium chloride + water. The arrow reads “react to make”."}, {"t": "h", "text": "Less acid, higher pH"}, {"t": "idea", "text": "The reaction uses up some of the acid."}, {"t": "idea", "text": "Less acid means the liquid is less acidic."}, {"t": "idea", "text": "A less acidic liquid has a higher pH."}, {"t": "idea", "text": "So the pH climbs toward 7."}, {"t": "h", "text": "Just enough, and too much"}, {"t": "idea", "text": "When exactly enough base is added, every bit of acid is used up."}, {"t": "idea", "text": "The pH reaches 7: the liquid is neutral."}, {"t": "idea", "text": "When more base than that is added, base is left over with no acid to react with."}, {"t": "idea", "text": "The pH climbs past 7 into the basic side."}, {"t": "fig", "key": "l05_climb", "cap": "The pH scale again: stomach acid at 2; a first arrow climbs to 7 as base is added, just enough; a second arrow climbs on to 9 when too much base goes in."}, {"t": "h", "text": "The name"}, {"t": "idea", "text": "An acid and a base reacting and using each other up is called <b>neutralization<\/b>."}, {"t": "idea", "text": "The antacid tablets neutralized some of the stomach acid."}, {"t": "h", "text": "The other way round"}, {"t": "idea", "text": "When an acid is added to a base, the same reaction runs: the acid uses up some of the base."}, {"t": "idea", "text": "Less base means the liquid is less basic."}, {"t": "idea", "text": "So the pH falls toward 7."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "A base goes into an acid at pH 3: the pH climbs toward 7."}, {"t": "idea", "text": "Exactly enough base goes in: the pH reaches 7."}, {"t": "idea", "text": "More base than that goes in: the pH climbs past 7."}, {"t": "idea", "text": "An acid goes into a base at pH 10: the pH falls toward 7."}, {"t": "fig", "key": "l05_table", "cap": "Four additions in one table: what is added, the pH at the start, and what the pH does afterward."}, {"t": "h", "text": "Acids that burn"}, {"t": "idea", "text": "Stomach acid is hydrochloric acid mixed with a lot of water."}, {"t": "idea", "text": "Hydrochloric acid from a lab bottle has far less water in it."}, {"t": "idea", "text": "The lab acid burns skin, so goggles and gloves are worn."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "When a base is added to an acid, the base uses up some of the acid. Less acid means the liquid is less acidic. A less acidic liquid has a higher pH. So the pH climbs toward 7. Exactly enough base takes the pH to 7. More base than that pushes the pH past 7. An acid and a base reacting and using each other up is called neutralization."}, {"t": "idea", "text": "Back to the heartburn: the tablets, a base, used up some of the stomach acid."}, {"t": "idea", "text": "So the acid's pH climbed toward 7, and the burning stopped."}], "script": [{"say": "Suppose stomach acid at pH 2 gives you heartburn. You take two antacid tablets.", "screen": "[a cartoon stomach; the pH scale with a marker at 2: stomach acid; two tablets]"}, {"say": "The tablets are a base, and the burning stops. What did the base do to the pH?", "screen": "[question mark over the marker]"}, {"say": "Stomach acid is dilute hydrochloric acid, and the tablet's magnesium hydroxide is a base.", "screen": "[two labels: hydrochloric acid; magnesium hydroxide]"}, {"say": "Magnesium hydroxide and hydrochloric acid react to make magnesium chloride and water.", "screen": "[strip: magnesium hydroxide + hydrochloric acid → magnesium chloride + water]"}, {"say": "The reaction uses up some of the acid, so the liquid is less acidic.", "screen": "[the acid level in a beaker drops as tablet pieces dissolve]"}, {"say": "A less acidic liquid has a higher pH, so watch the marker climb toward 7.", "screen": "[the marker slides from 2 toward 7 as base is poured in]"}, {"say": "Exactly enough base uses up every bit of acid: the marker reaches 7, and the liquid is neutral.", "screen": "[marker stops on 7; chip: NEUTRAL]"}, {"say": "More base than that is left over with nothing to react with: the marker climbs past 7.", "screen": "[more base pours in; marker slides on to 9; label: too much base]"}, {"say": "An acid and a base reacting and using each other up is called neutralization.", "screen": "[chip: NEUTRALIZATION over the strip]"}, {"say": "The other way round, an acid added to a base uses up base, so the pH falls toward 7.", "screen": "[a marker at 10 slides down toward 7 as acid pours in]"}, {"say": "Lab hydrochloric acid is a strong acid that burns skin, so goggles and gloves are worn.", "screen": "[a bottle with a warning label; goggles and gloves]"}, {"say": "Back to the heartburn: the tablets used up some of the acid, so its pH climbed and the burning stopped.", "screen": "[the stomach; the marker up from 2]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A liquid reads pH 4. Is the liquid neutral, acidic or basic?", "options": ["neutral", "acidic", "basic"], "key": 1, "fb": ["A neutral liquid sits exactly at 7, and 4 sits below 7.", "Below pH 7 a liquid is acidic, and 4 sits below 7.", "A basic liquid sits above 7, and 4 sits below 7."], "why": "Pure water sits at 7.<br>4 sits below 7.<br>Below pH 7 a liquid is acidic, so this liquid is acidic."}, {"type": "mcq", "tag": "recall", "stem": "In a chemical reaction, what forms?", "options": ["the same substances, warmer", "the same substances in a new state", "new substances"], "key": 2, "fb": ["Warming a substance changes its temperature, not its atoms' partners.", "A new state of the same substance is a change of state, not a chemical reaction.", "In a chemical reaction the atoms let go of their old partners and join new ones, so new substances form."], "why": "In a chemical reaction the atoms let go of their old partners.<br>They join new partners.<br>So new substances form."}, {"type": "mcq", "tag": "what", "stem": "A beaker of dilute nitric acid reads pH 2. A student stirs in some potassium hydroxide solution, a base. What happens to the pH?", "options": ["it falls", "it stays at 2", "it rises"], "key": 2, "fb": ["The base uses up some of the acid, and less acid means a higher pH, not a lower one.", "The base reacts with the acid and uses some of it up, so the pH does not stay put.", "The base uses up some of the acid; less acid means the liquid is less acidic, so the pH rises toward 7."], "why": "The base reacts with the acid and uses up some of it.<br>Less acid means the liquid is less acidic.<br>A less acidic liquid has a higher pH, so the pH rises toward 7."}, {"type": "frq", "tag": "why", "task": "A beaker of dilute sulfuric acid reads pH 1. A student adds sodium hydroxide solution, a base, a little at a time, and the reading climbs to 5. Explain why the pH climbed.", "starter": "The base reacts with…", "model": "The base reacts with the acid.<br>The reaction uses up some of the acid.<br>Less acid means the liquid is less acidic.<br>A less acidic liquid has a higher pH.<br>So the pH climbed from 1 to 5.", "points": ["the base reacts with the acid and uses up some of it", "less acid means the liquid is less acidic", "a less acidic liquid has a higher pH, so the pH climbed toward 7"]}, {"type": "mcq", "tag": "fluency", "fig": "s5_4", "stem": "The marker shows a liquid at pH 4, and a base is added. Which way does the pH move?", "options": ["down, toward 0", "up, toward 7", "it does not move"], "key": 1, "fb": ["A lower pH would mean more acid; the base uses acid up, so the pH climbs.", "The base uses up some of the acid, so the liquid is less acidic and the pH climbs toward 7.", "The base reacts with the acid and uses some of it up, so the pH moves."], "why": "The base uses up some of the acid.<br>Less acid means the liquid is less acidic.<br>So the pH moves up, toward 7."}, {"type": "mcq", "tag": "fluency", "fig": "s5_12", "stem": "The marker shows a liquid at pH 12, and an acid is added. Which way does the pH move?", "options": ["up, toward 14", "down, toward 7", "it does not move"], "key": 1, "fb": ["A higher pH would mean more base; the acid uses base up, so the pH falls.", "The acid uses up some of the base, so the liquid is less basic and the pH falls toward 7.", "The acid reacts with the base and uses some of it up, so the pH moves."], "why": "The acid uses up some of the base.<br>Less base means the liquid is less basic.<br>So the pH moves down, toward 7."}, {"type": "mcq", "tag": "fluency", "fig": "s5_2b", "stem": "The liquid starts at pH 2, and a little base is added, not enough to use up all the acid. Where is the pH now?", "options": ["still below 7", "exactly 7", "above 7"], "key": 0, "fb": ["Some acid is used up but some is left, so the liquid is still acidic and the pH is still below 7.", "The pH reaches 7 only when exactly enough base has used up all the acid.", "The pH passes 7 only when more base than needed has gone in."], "why": "A little base uses up a little of the acid.<br>Acid is left, so the liquid is still acidic.<br>So the pH has climbed but is still below 7."}, {"type": "mcq", "tag": "fluency", "fig": "s5_2c", "stem": "The liquid starts at pH 2, and exactly enough base is added to use up all the acid. Where is the pH now?", "options": ["still below 7", "exactly 7", "above 7"], "key": 1, "fb": ["A pH below 7 would mean acid is left; here every bit of acid is used up.", "Every bit of acid is used up and no base is left over, so the liquid is neutral at pH 7.", "A pH above 7 would mean base is left over; here exactly enough went in."], "why": "Exactly enough base uses up every bit of the acid.<br>No acid and no base is left over.<br>So the liquid is neutral, at exactly 7."}, {"type": "mcq", "tag": "fluency", "fig": "s5_2d", "stem": "The liquid starts at pH 2, and more base than needed is added. Where is the pH now?", "options": ["still below 7", "exactly 7", "above 7"], "key": 2, "fb": ["A pH below 7 would mean acid is left; here all the acid is used up and base is left over.", "A pH of exactly 7 needs exactly enough base; here more than that went in.", "All the acid is used up and base is left over, so the liquid is basic and the pH is above 7."], "why": "The base uses up all the acid.<br>Base is left over with no acid to react with.<br>So the liquid is basic, and the pH is above 7."}, {"type": "mcq", "tag": "misconception", "stem": "Gideon says: \"Adding an acid to a base makes the base's pH fall.\" Is Gideon correct?", "options": ["yes", "no"], "key": 0, "fb": ["The acid uses up some of the base, so the liquid is less basic and its pH falls toward 7.", "The acid reacts with the base and uses some of it up; less base means a lower pH."], "why": "The acid uses up some of the base.<br>Less base means the liquid is less basic.<br>A less basic liquid has a lower pH, so the pH falls, and Gideon is correct."}, {"type": "mcq", "tag": "misconception", "stem": "Odette says: \"Any amount of base makes an acid neutral at once.\" Is Odette correct?", "options": ["yes", "no"], "key": 1, "fb": ["A little base uses up only a little acid; the pH climbs step by step and reaches 7 only with exactly enough base.", "A little base uses up a little acid, so the pH climbs step by step; only exactly enough base brings it to 7."], "why": "A little base uses up only a little of the acid.<br>Acid is left, so the liquid is still acidic.<br>The pH reaches 7 only with exactly enough base, so Odette is not correct."}, {"type": "mcq", "tag": "transfer", "stem": "Acid rain has made a lake's water acidic, at pH 5. Workers spread powdered slaked lime, a base, into the lake. What happens to the lake's pH?", "options": ["it rises toward 7", "it stays at 5", "it falls toward 0"], "key": 0, "fb": ["The slaked lime, a base, uses up some of the acid in the water, so the water is less acidic and its pH rises toward 7.", "The slaked lime reacts with the acid in the water and uses some of it up, so the pH does not stay put.", "Falling would mean more acid; the base uses acid up."], "why": "Slaked lime is a base.<br>It reacts with the acid in the lake water and uses some of it up.<br>Less acid means the water is less acidic, so its pH rises toward 7."}, {"type": "text", "tag": "term", "stem": "A base is added to an acid; the two react and use each other up, and the pH moves toward 7. What is this reaction called?", "accept": ["neutralization", "neutralisation", "a neutralization", "a neutralisation", "neutralizing", "neutralising"], "why": "The base reacts with the acid, and the two use each other up.<br>An acid and a base reacting and using each other up is called neutralization."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "In the video, base was poured into the acid at pH 2. Which way did the marker move?", "options": ["toward 0", "it did not move", "toward 7"], "key": 2, "fb": ["Toward 0 would mean more acid; the base used acid up.", "The base reacted with the acid and used some of it up, so the marker moved.", "The base used up some of the acid, so the liquid was less acidic and the marker climbed toward 7."], "why": "The base used up some of the acid.<br>Less acid means a less acidic liquid, with a higher pH.<br>So the marker moved toward 7."}]}, {"id": "L06", "atom": "MAT-080", "title": "Where the salt comes from", "video": "definitely a video", "lesson_type": "Concept-introduction lesson (a fact with its picture): in a neutralization the base gives the salt its metal part and the acid gives its other part, and the leftover parts make water; coins salt in its chemistry sense", "check_design": "Type (c) concept understanding on a fact → three recall MCQs (L05: the name of the reaction; Topic 12: where a new substance's atoms come from; Topic 7: a compound), the what (sulfuric acid and potassium hydroxide react: which products form), the why as a free response on a FRESH case (nitric acid + calcium hydroxide → calcium nitrate + water: where the salt's two parts came from), a fluency item (which product is the salt), two student claims (Hattie: the salt was already dissolved in the acid, key no; Ishaan: every atom in the salt was in the acid or the base before, key yes — a TRUE conservation claim), a fluency item (which reactant gave the metal part) and a transfer (nitric acid + magnesium hydroxide → magnesium nitrate + water: which reactant gave the nitrate part), then the coined term typed last. 11 items.", "headache": ["Suppose you add sodium hydroxide, a base, to hydrochloric acid in just the right amount.", "The mixture reaches pH 7.", "The water is boiled away until only crystals are left.", "The crystals are white.", "The crystals are sodium chloride, table salt.", "Neither the acid nor the base had any salt in it.", "Where did the salt come from?"], "forest": ["Where does the salt in a neutralization come from?", "The salt's atoms come from both reactants.", "The base gives its metal part, sodium.", "The acid gives its other part, chloride.", "Sodium and chloride join: sodium chloride, the salt.", "The leftover parts, hydrogen from the acid and hydroxide from the base, join to make water.", "In chemistry, salt names a whole family of substances made this way.", "No atom appeared or vanished."], "article": [{"t": "idea", "text": "Suppose you add sodium hydroxide, a base, to hydrochloric acid in just the right amount."}, {"t": "idea", "text": "The mixture reaches pH 7."}, {"t": "idea", "text": "The water is boiled away until only crystals are left."}, {"t": "idea", "text": "The crystals are white."}, {"t": "idea", "text": "The crystals are sodium chloride, table salt."}, {"t": "fig", "key": "l06_scene", "cap": "Hydrochloric acid and sodium hydroxide, mixed in just the right amounts, read pH 7; boiling the water away leaves white grains of sodium chloride in the dish."}, {"t": "idea", "text": "Neither the acid nor the base had any salt in it."}, {"t": "idea", "text": "Where did the salt come from?"}, {"t": "h", "text": "Three facts first"}, {"t": "idea", "text": "An acid and a base reacting and using each other up is called neutralization."}, {"t": "idea", "text": "The atoms in a new substance come from the substances that were there before."}, {"t": "idea", "text": "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."}, {"t": "h", "text": "The reaction in one line"}, {"t": "idea", "text": "The acid and the base react to make two new substances: sodium chloride and water."}, {"t": "fig", "key": "l06_words", "cap": "The neutralization in one line: hydrochloric acid + sodium hydroxide → sodium chloride + water."}, {"t": "h", "text": "Two parts each"}, {"t": "idea", "text": "Hydrochloric acid is a compound with two parts: a hydrogen part and a chloride part."}, {"t": "idea", "text": "Sodium hydroxide, the base, is a compound with two parts: a sodium part and a hydroxide part."}, {"t": "fig", "key": "l06_parts_before", "cap": "The acid and the base drawn as two joined blocks each: hydrogen part and chloride part; sodium part and hydroxide part."}, {"t": "h", "text": "The parts swap partners"}, {"t": "idea", "text": "In the reaction, the four parts let go and swap partners."}, {"t": "idea", "text": "The sodium part from the base joins the chloride part from the acid."}, {"t": "idea", "text": "Sodium joined to chloride is sodium chloride."}, {"t": "idea", "text": "The hydrogen part from the acid joins the hydroxide part from the base."}, {"t": "idea", "text": "Hydrogen joined to hydroxide is water."}, {"t": "fig", "key": "l06_parts", "cap": "Before: the acid's two parts and the base's two parts. After: the same four parts paired the other way, sodium with chloride as sodium chloride, and hydrogen with hydroxide as water."}, {"t": "h", "text": "The name"}, {"t": "idea", "text": "A substance made when a base's metal part joins an acid's other part is called a <b>salt<\/b>."}, {"t": "idea", "text": "Table salt, sodium chloride, is one salt."}, {"t": "idea", "text": "Magnesium chloride and potassium sulfate are salts too."}, {"t": "idea", "text": "In chemistry, salt names the whole family, not only the one in the kitchen."}, {"t": "h", "text": "No atom appeared or vanished"}, {"t": "idea", "text": "Every atom in the salt was there in the acid or the base."}, {"t": "idea", "text": "Every atom in the water was there too."}, {"t": "idea", "text": "The reaction only swapped the parts' partners."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "The base magnesium hydroxide gives magnesium."}, {"t": "idea", "text": "The acid hydrochloric acid gives chloride."}, {"t": "idea", "text": "The salt is magnesium chloride."}, {"t": "idea", "text": "The base potassium hydroxide gives potassium."}, {"t": "idea", "text": "The acid sulfuric acid gives sulfate."}, {"t": "idea", "text": "The salt is potassium sulfate."}, {"t": "fig", "key": "l06_words_b", "cap": "A second neutralization in one line: sulfuric acid + potassium hydroxide → potassium sulfate + water."}, {"t": "fig", "key": "l06_table", "cap": "Three neutralizations in one table: the acid, the base and the salt made; the other product is water in every row."}, {"t": "h", "text": "Acids and bases that burn"}, {"t": "idea", "text": "Hydrochloric acid and sodium hydroxide from lab bottles are a strong acid and a strong base."}, {"t": "idea", "text": "Both burn skin and eyes, so goggles and gloves are worn, and the teacher does the mixing."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A neutralization makes a salt and water. The base gives the salt its metal part. The acid gives the salt its other part. The leftover parts, hydrogen from the acid and hydroxide from the base, make water. No atom appeared or vanished."}, {"t": "idea", "text": "Back to the crystals: the sodium part came from the base, and the chloride part came from the acid."}, {"t": "idea", "text": "So the salt came from both reactants, with the parts swapped."}], "script": [{"say": "Suppose you add sodium hydroxide, a base, to hydrochloric acid, just enough, and the mixture reads pH 7.", "screen": "[two beakers pour into one; a meter reads pH 7]"}, {"say": "Boil the water away, and white crystals are left: sodium chloride, table salt.", "screen": "[a dish; grains appear on its floor; label: sodium chloride]"}, {"say": "Neither had any salt in it, so where did the salt come from?", "screen": "[question mark over the crystals]"}, {"say": "The atoms in a new substance come from the substances that were there before.", "screen": "[chip: SAME ATOMS]"}, {"say": "This neutralization makes sodium chloride and water.", "screen": "[strip: hydrochloric acid + sodium hydroxide → sodium chloride + water]"}, {"say": "The acid has two parts: a hydrogen part and a chloride part.", "screen": "[two joined blocks: hydrogen part | chloride part]"}, {"say": "The base has two parts: a sodium part and a hydroxide part.", "screen": "[two joined blocks: sodium part | hydroxide part]"}, {"say": "Watch the parts swap partners.", "screen": "[the blocks separate and slide]"}, {"say": "The sodium part from the base joins the chloride part from the acid: sodium chloride.", "screen": "[sodium part | chloride part; label: sodium chloride]"}, {"say": "The leftover parts, hydrogen from the acid and hydroxide from the base, join: water.", "screen": "[hydrogen part | hydroxide part; label: water]"}, {"say": "The base gives the salt its metal part, and the acid gives its other part. A substance made this way is called a salt.", "screen": "[chip: SALT; a row: sodium chloride, magnesium chloride, potassium sulfate]"}, {"say": "Sulfuric acid and potassium hydroxide react to make potassium sulfate, a salt, and water.", "screen": "[strip: sulfuric acid + potassium hydroxide → potassium sulfate + water]"}, {"say": "Lab acids and bases burn skin, so the teacher does the mixing.", "screen": "[two bottles with warning labels; goggles and gloves]"}, {"say": "Back to the crystals: sodium from the base, chloride from the acid, and no atom appeared or vanished.", "screen": "[the crystals; the two parts colored in from their reactants]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A base is added to an acid, and the two use each other up. What is this reaction called?", "options": ["neutralization", "dissolving", "conservation of mass"], "key": 0, "fb": ["An acid and a base reacting and using each other up is called neutralization.", "Dissolving spreads a substance through a liquid without a reaction.", "Conservation of mass is a law about the total mass in a reaction, not the name of a reaction."], "why": "The base reacts with the acid.<br>The two use each other up.<br>An acid and a base reacting and using each other up is called neutralization."}, {"type": "mcq", "tag": "recall", "stem": "Where do the atoms in a new substance come from?", "options": ["from the heat that was added during the change", "from the substances that were there before", "the change makes them out of nothing"], "key": 1, "fb": ["Heat is not made of atoms.", "The atoms in a new substance come from the substances that were there before.", "No atom is made from nothing."], "why": "No atom is made from nothing.<br>No atom vanishes.<br>So the atoms in a new substance come from the substances that were there before."}, {"type": "mcq", "tag": "recall", "stem": "Sodium chloride is made of two kinds of atom joined together in a fixed pattern. What kind of substance is it?", "options": ["an element", "a mixture", "a compound"], "key": 2, "fb": ["An element is made of only one kind of atom.", "In a mixture the substances are mingled, not joined in a fixed pattern.", "A substance made of two or more kinds of atom joined together in a fixed pattern is called a compound."], "why": "Sodium chloride is made of two kinds of atom.<br>The atoms are joined together in a fixed pattern.<br>So sodium chloride is a compound."}, {"type": "mcq", "tag": "what", "stem": "Sulfuric acid and potassium hydroxide, a base, react in just the right amounts. Which products form?", "options": ["water only", "a salt and water", "a salt and a gas"], "key": 1, "fb": ["Water is one product; the metal part and the acid's other part make the second, a salt.", "The base's metal part joins the acid's other part as a salt, and the leftover parts make water.", "No gas forms; the leftover parts, hydrogen and hydroxide, make water."], "why": "The base's potassium part joins the acid's sulfate part: potassium sulfate, a salt.<br>The leftover parts, hydrogen and hydroxide, join to make water.<br>So the two products are a salt and water."}, {"type": "frq", "tag": "why", "task": "Nitric acid and calcium hydroxide, a base, react in just the right amounts. The products are calcium nitrate, a salt, and water. Explain where the two parts of the calcium nitrate came from.", "starter": "The base gives…", "model": "The base gives the salt its metal part.<br>So the calcium part came from the calcium hydroxide.<br>The acid gives the salt its other part.<br>So the nitrate part came from the nitric acid.", "points": ["the base gives the salt its metal part, so the calcium part came from the calcium hydroxide", "the acid gives the salt its other part, so the nitrate part came from the nitric acid"]}, {"type": "mcq", "tag": "fluency", "stem": "A student writes the word equation nitric acid + potassium hydroxide → potassium nitrate + water. Which product is the salt?", "options": ["potassium nitrate", "water"], "key": 0, "fb": ["Potassium nitrate is the base's metal part, potassium, joined to the acid's other part, nitrate: a salt.", "Water is made from the leftover parts, hydrogen and hydroxide; the salt is the other product."], "why": "A salt is made when a base's metal part joins an acid's other part.<br>Potassium from the base joined nitrate from the acid.<br>So potassium nitrate is the salt."}, {"type": "mcq", "tag": "misconception", "stem": "Hattie says: \"The salt was already dissolved in the acid; the base just made it show up.\" Is Hattie correct?", "options": ["yes", "no"], "key": 1, "fb": ["The salt's metal part came from the base, so the salt could not have been in the acid before the base arrived.", "The salt is made in the reaction: its metal part comes from the base and its other part from the acid."], "why": "The base gives the salt its metal part.<br>Before the base was added, no metal part was in the acid.<br>So the salt was not there already, and Hattie is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Ishaan says: \"Every atom in the salt was in the acid or the base before the reaction.\" Is Ishaan correct?", "options": ["yes", "no"], "key": 0, "fb": ["The atoms in a new substance come from the substances that were there before, and the salt's atoms were in the acid and the base.", "No atom appeared in the reaction: the salt's metal part was in the base and its other part was in the acid."], "why": "The atoms in a new substance come from the substances that were there before.<br>The salt's metal part was in the base, and its other part was in the acid.<br>So every atom in the salt was there before the reaction, and Ishaan is correct."}, {"type": "mcq", "tag": "fluency", "stem": "In a neutralization, the salt calcium sulfate forms. Which reactant gave the salt its calcium part?", "options": ["the base", "the acid"], "key": 0, "fb": ["The base gives the salt its metal part, and calcium is the metal part.", "The acid gives the salt its other part, here the sulfate part."], "why": "The base gives the salt its metal part.<br>Calcium is the metal part of calcium sulfate.<br>So the base gave the calcium part."}, {"type": "mcq", "tag": "transfer", "stem": "A student writes the word equation nitric acid + magnesium hydroxide → magnesium nitrate + water. Which reactant gave the nitrate part of the salt?", "options": ["the base", "the acid"], "key": 1, "fb": ["The base gives the salt its metal part, magnesium; the nitrate part came from the acid.", "The acid gives the salt its other part, and nitrate is the acid's other part."], "why": "The acid gives the salt its other part.<br>Nitrate is nitric acid's other part.<br>So the acid gave the nitrate part of magnesium nitrate."}, {"type": "text", "tag": "term", "stem": "Potassium sulfate, calcium nitrate and magnesium sulfate are all made when a base's metal part joins an acid's other part. In chemistry, what is this family of substances called?", "accept": ["salt", "salts", "a salt", "the salts", "the salt family"], "why": "Each is made when a base's metal part joins an acid's other part.<br>A substance made this way is called a salt.<br>In chemistry, salt names the whole family."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video showed the sodium part let go and join a new partner. Which part did it join?", "options": ["the hydrogen part", "the chloride part", "the hydroxide part"], "key": 1, "fb": ["The hydrogen part joined the hydroxide part to make water.", "The sodium part from the base joined the chloride part from the acid: sodium chloride, the salt.", "The hydroxide part was the sodium part's old partner; it joined the hydrogen part to make water."], "why": "The four parts let go and swapped partners.<br>The sodium part from the base joined the chloride part from the acid.<br>Sodium joined to chloride is sodium chloride, the salt."}]}], "practice": [{"type": "mcq", "tag": "mixed", "atom": "MAT-082", "stem": "A pH meter dipped in kombucha, a fizzy tea drink, reads 3. Is kombucha an acid, a base or neutral?", "options": ["an acid", "a base", "neutral"], "key": 0, "fb": ["A pH below 7 means acid, and 3 is below 7.", "A pH above 7 would mean base; 3 is below 7.", "A pH of exactly 7 would mean neutral; 3 is below 7."], "why": "The clue is a pH.<br>3 is below 7, and a pH below 7 means acid.<br>So kombucha is an acid."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-082", "stem": "Red litmus paper dipped in lye water turns blue. Is lye water an acid, a base or neutral?", "options": ["an acid", "a base", "neutral"], "key": 1, "fb": ["Blue litmus paper turning red would mean acid; here red paper turned blue.", "Red litmus paper turning blue means base.", "Neither paper changing would mean neutral; here the paper changed."], "why": "The clue is a litmus color.<br>Red litmus paper turning blue means base.<br>So lye water is a base."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-082", "stem": "In a solution of table salt, blue litmus paper stays blue and red litmus paper stays red. Is the solution an acid, a base or neutral?", "options": ["an acid", "a base", "neutral"], "key": 2, "fb": ["An acid would turn blue litmus paper red; it stayed blue.", "A base would turn red litmus paper blue; it stayed red.", "Neither paper changing color means neutral."], "why": "The clue is a litmus result.<br>Neither paper changed color, and that means neutral.<br>So the table salt solution is neutral."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-079", "fig": "pr_s_13", "stem": "The scale marks bleach at pH 13. Is the bleach acidic, neutral or basic?", "options": ["acidic", "neutral", "basic"], "key": 2, "fb": ["An acidic liquid sits below 7, and 13 sits above 7.", "A neutral liquid sits exactly at 7, and 13 sits above 7.", "Above 7 a liquid is basic, and 13 sits near the most basic end."], "why": "Pure water sits at 7.<br>The marker at 13 sits above 7.<br>Above 7 a liquid is basic, so the bleach is basic."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-081", "stem": "A beaker of hydrochloric acid reads pH 1. Sodium hydroxide, a base, is added a little at a time until the meter reads 7, and then more is added. Where is the pH now?", "options": ["below 7", "exactly 7", "above 7"], "key": 2, "fb": ["A pH below 7 would mean acid is left; at 7 every bit of acid was used up.", "The pH stayed at 7 only while exactly enough base had gone in; more went in after that.", "All the acid was used up at 7, and the extra base is left over, so the liquid is basic and the pH is above 7."], "why": "At pH 7 every bit of acid had been used up.<br>More base then went in, with no acid left to react with.<br>So the liquid is basic, and the pH is above 7."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-081", "stem": "A dishwasher tablet dissolved in water makes a base at pH 11. A little vinegar, an acid, is stirred in, not enough to use up all the base. Where is the pH now?", "options": ["above 7", "exactly 7", "below 7"], "key": 0, "fb": ["A little acid uses up a little of the base; base is left, so the liquid is still basic and the pH is still above 7.", "The pH reaches 7 only when exactly enough acid has used up all the base.", "A pH below 7 would need more acid than
