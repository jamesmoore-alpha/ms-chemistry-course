<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="100%" role="img" aria-label="Three cards with the same three labels down each: I observed, that shows, so the change is. Frying an egg: the clear, runny egg white turned white and solid; a new substance formed, the solid has properties the runny white did not have; a chemical change. Melting an ice cube: the ice turned into a clear liquid that looks, pours and tastes like water; the water is still water, no new substance formed; a physical change. A nail rusting: the shiny gray nail grew dull orange flakes that crumble and that a magnet barely pulls; a new substance formed; a chemical change" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="310" fill="#ffffff"/><rect x="10" y="10" width="170" height="290" rx="8" fill="#ffffff" stroke="#222"/><rect x="10" y="10" width="170" height="26" rx="8" fill="#f1f1f1" stroke="#222"/><text x="95.0" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">frying an egg</text><text x="18" y="54" text-anchor="start" font-size="13" font-weight="bold" fill="#222">I observed…</text><text x="18" y="70" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the clear, runny egg</text><text x="18" y="85" text-anchor="start" font-size="13" font-weight="normal" fill="#222">white turned white and</text><text x="18" y="100" text-anchor="start" font-size="13" font-weight="normal" fill="#222">solid</text><text x="18" y="123" text-anchor="start" font-size="13" font-weight="bold" fill="#222">That shows…</text><text x="18" y="139" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a new substance formed:</text><text x="18" y="154" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the solid has properties</text><text x="18" y="169" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the runny white did not</text><text x="18" y="184" text-anchor="start" font-size="13" font-weight="normal" fill="#222">have</text><text x="18" y="207" text-anchor="start" font-size="13" font-weight="bold" fill="#222">So the change is…</text><text x="18" y="223" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a chemical change</text><rect x="185" y="10" width="170" height="290" rx="8" fill="#ffffff" stroke="#222"/><rect x="185" y="10" width="170" height="26" rx="8" fill="#f1f1f1" stroke="#222"/><text x="270.0" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">melting an ice cube</text><text x="193" y="54" text-anchor="start" font-size="13" font-weight="bold" fill="#222">I observed…</text><text x="193" y="70" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the ice turned into a</text><text x="193" y="85" text-anchor="start" font-size="13" font-weight="normal" fill="#222">clear liquid that looks,</text><text x="193" y="100" text-anchor="start" font-size="13" font-weight="normal" fill="#222">pours and tastes like</text><text x="193" y="115" text-anchor="start" font-size="13" font-weight="normal" fill="#222">water</text><text x="193" y="138" text-anchor="start" font-size="13" font-weight="bold" fill="#222">That shows…</text><text x="193" y="154" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the water is still</text><text x="193" y="169" text-anchor="start" font-size="13" font-weight="normal" fill="#222">water; no new substance</text><text x="193" y="184" text-anchor="start" font-size="13" font-weight="normal" fill="#222">formed</text><text x="193" y="207" text-anchor="start" font-size="13" font-weight="bold" fill="#222">So the change is…</text><text x="193" y="223" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a physical change</text><rect x="360" y="10" width="170" height="290" rx="8" fill="#ffffff" stroke="#222"/><rect x="360" y="10" width="170" height="26" rx="8" fill="#f1f1f1" stroke="#222"/><text x="445.0" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a nail rusting</text><text x="368" y="54" text-anchor="start" font-size="13" font-weight="bold" fill="#222">I observed…</text><text x="368" y="70" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the shiny gray nail grew</text><text x="368" y="85" text-anchor="start" font-size="13" font-weight="normal" fill="#222">dull orange flakes that</text><text x="368" y="100" text-anchor="start" font-size="13" font-weight="normal" fill="#222">crumble and that a</text><text x="368" y="115" text-anchor="start" font-size="13" font-weight="normal" fill="#222">magnet barely pulls</text><text x="368" y="138" text-anchor="start" font-size="13" font-weight="bold" fill="#222">That shows…</text><text x="368" y="154" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a new substance formed</text><text x="368" y="177" text-anchor="start" font-size="13" font-weight="bold" fill="#222">So the change is…</text><text x="368" y="193" text-anchor="start" font-size="13" font-weight="normal" fill="#222">a chemical change</text></svg>