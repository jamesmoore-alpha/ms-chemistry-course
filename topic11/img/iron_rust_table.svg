<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 138" width="100%" role="img" aria-label="A table comparing iron with the orange flakes on three rows: color, shiny gray against dull orange-brown; bends without breaking, yes against no, they crumble; a magnet pulls hard, yes against no, barely" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="138" fill="#ffffff"/><rect x="10" y="10" width="470" height="28" fill="#f1f1f1" stroke="#222"/><text x="105.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="265.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">iron</text><text x="405.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the orange flakes</text><rect x="10" y="38" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">color</text><text x="265.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">shiny gray</text><text x="405.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">dull orange-brown</text><rect x="10" y="66" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><text x="265.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="405.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: they crumble</text><rect x="10" y="94" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a magnet pulls hard?</text><text x="265.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="405.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: barely</text><line x1="200" y1="10" x2="200" y2="122" stroke="#222"/><line x1="330" y1="10" x2="330" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | iron | the orange flakes. Row: color | shiny gray | dull orange-brown. Row: bends without breaking? | yes | no: they crumble. Row: a magnet pulls hard? | yes | no: barely.--></svg>