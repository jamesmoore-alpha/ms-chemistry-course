<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" width="100%" role="img" aria-label="A table of five changes with what you start with, what you end with, and whether it is the same substance: tearing paper, paper to two pieces of paper, yes; melting ice, ice to liquid water, yes; dissolving sugar, sugar and water to sugar in the water, yes; bending copper wire, copper to copper in a new shape, yes; a nail growing flakes, iron to orange-brown flakes, no" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="194" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="80.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the change</text><text x="205.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">you start with</text><text x="322.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">you end with</text><text x="457.5" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the same substance?</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">tearing paper</text><text x="205.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">paper</text><text x="322.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two pieces of paper</text><text x="457.5" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">melting ice</text><text x="205.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ice (water)</text><text x="322.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">liquid water</text><text x="457.5" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">dissolving sugar</text><text x="205.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sugar and water</text><text x="322.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">sugar in the water</text><text x="457.5" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bending copper wire</text><text x="205.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">copper</text><text x="322.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">copper, new shape</text><text x="457.5" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="80.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a nail growing flakes</text><text x="205.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">iron</text><text x="322.5" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">orange-brown flakes</text><text x="457.5" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="150" y1="10" x2="150" y2="178" stroke="#222"/><line x1="260" y1="10" x2="260" y2="178" stroke="#222"/><line x1="385" y1="10" x2="385" y2="178" stroke="#222"/><!--blind: A table. Header: the change | you start with | you end with | the same substance?. Row: tearing paper | paper | two pieces of paper | yes. Row: melting ice | ice (water) | liquid water | yes. Row: dissolving sugar | sugar and water | sugar in the water | yes. Row: bending copper wire | copper | copper, new shape | yes. Row: a nail growing flakes | iron | orange-brown flakes | no.--></svg>