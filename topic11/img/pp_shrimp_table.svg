<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 138" width="100%" role="img" aria-label="A table with three rows, color, see-through, soft or firm, and two columns, raw and cooked" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="450" height="138" fill="#ffffff"/><rect x="10" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="85.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="225.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">raw</text><text x="365.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cooked</text><rect x="10" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">color</text><text x="225.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gray</text><text x="365.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">pink and white</text><rect x="10" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">see-through?</text><text x="225.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="365.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="94" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">soft or firm?</text><text x="225.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">soft</text><text x="365.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">firm</text><line x1="160" y1="10" x2="160" y2="122" stroke="#222"/><line x1="290" y1="10" x2="290" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | raw 