<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" width="100%" role="img" aria-label="A table of six changes, what you end with, and whether a new substance formed: an iron nail rusting, orange-brown flakes, yes; wood burning, ash and smoke, yes; baking soda fizzing in vinegar, a gas that was not there, yes; an ice cube melting, liquid water, no; an egg frying, a white solid, yes; salt dissolving in water, salt spread in water, no" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="222" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="115.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the change</text><text x="315.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what you end with</text><text x="470.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a new substance?</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an iron nail rusting</text><text x="315.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">orange-brown flakes</text><text x="470.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">wood burning</text><text x="315.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ash and smoke</text><text x="470.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">baking soda fizzing in vinegar</text><text x="315.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas that was not there</text><text x="470.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an ice cube melting</text><text x="315.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">liquid water</text><text x="470.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an egg frying</text><text x="315.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a white solid</text><text x="470.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><rect x="10" y="178" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">salt dissolving in water</text><text x="315.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">salt spread in water</text><text x="470.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><line x1="220" y1="10" x2="220" y2="206" stroke="#222"/><line x1="410" y1="10" x2="410" y2="206" stroke="#222"/><!--blind: A table. Header: the change | what you end with | a new substance?. Row: an iron nail rusting | orange-brown flakes | yes. Row: wood burning | ash and smoke | yes. Row: baking soda fizzing in vinegar | a gas that was not there | yes. Row: an ice cube melting | liquid water | no. Row: an egg frying | a white solid | yes. Row: salt dissolving in water | salt spread in water | no.--></svg>