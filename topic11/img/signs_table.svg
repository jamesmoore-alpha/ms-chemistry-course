<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 214" width="100%" role="img" aria-label="A numbered table of the five signs with an everyday example each: 1 a color change, a cut apple turns brown; 2 a gas forming, bubbles or fizz, baking soda fizzes in vinegar; 3 a solid forming from two liquids, a precipitate, two clear liquids go cloudy white; 4 a temperature change, a match warms your fingers; 5 light given out, a match burns with a flame. Note: each sign is a clue, not proof; each can appear without a chemical change" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="214" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="25.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="185.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sign</text><text x="430.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an everyday example</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="25.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1</text><text x="185.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a color change</text><text x="430.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a cut apple turns brown</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="25.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2</text><text x="185.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a gas forming (bubbles, fizz)</text><text x="430.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">baking soda fizzes in vinegar</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="25.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">3</text><text x="185.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a solid forming from two liquids (a precipitate)</text><text x="430.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two clear liquids go cloudy white</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="25.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">4</text><text x="185.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a temperature change</text><text x="430.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a match warms your fingers</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="25.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">5</text><text x="185.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">light given out</text><text x="430.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a match burns with a flame</text><line x1="40" y1="10" x2="40" y2="178" stroke="#222"/><line x1="330" y1="10" x2="330" y2="178" stroke="#222"/><text x="270.0" y="196" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Each sign is a clue, not proof: each can appear without a chemical change.</text><!--blind: A table. Header: (blank) | the sign | an everyday example. Row: 1 | a color change | a cut apple turns brown. Row: 2 | a gas forming (bubbles, fizz) | baking soda fizzes in vinegar. Row: 3 | a solid forming from two liquids (a precipitate) | two clear liquids go cloudy white. Row: 4 | a temperature change | a match warms your fingers. Row: 5 | light given out | a match burns with a flame. Note under the table: Each sign is a clue, not proof: each can appear without a chemical change.--></svg>