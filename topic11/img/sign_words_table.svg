<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" width="100%" role="img" aria-label="A table of the five signs, the words you read for each, and an everyday example: a color change, turns brown, turns blue, a leaf turns brown; a gas forming, fizzes, bubbles, froths, a tablet fizzes in water; a solid forming, goes cloudy, a solid appears, two liquids turn cloudy; a temperature change, gets warm or cold on its own, a beaker warms by itself; light given out, glows, a flame, flashes, a glow stick glows" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="194" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="90.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the sign</text><text x="265.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the words you read</text><text x="445.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an everyday example</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a color change</text><text x="265.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">turns brown, turns blue</text><text x="445.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a leaf turns brown</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a gas forming</text><text x="265.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">fizzes, bubbles, froths</text><text x="445.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a tablet fizzes in water</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a solid forming</text><text x="265.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">goes cloudy, a solid appears</text><text x="445.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two liquids turn cloudy</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a temperature change</text><text x="265.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">gets warm or cold on its own</text><text x="445.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a beaker warms by itself</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">light given out</text><text x="265.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">glows, a flame, flashes</text><text x="445.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a glow stick glows</text><line x1="170" y1="10" x2="170" y2="178" stroke="#222"/><line x1="360" y1="10" x2="360" y2="178" stroke="#222"/><!--blind: A table. Header: the sign | the words you read | an everyday example. Row: a color change | turns brown, turns blue | a leaf turns brown. Row: a gas forming | fizzes, bubbles, froths | a tablet fizzes in water. Row: a solid forming | goes cloudy, a solid appears | two liquids turn cloudy. Row: a temperature change | gets warm or cold on its own | a beaker warms by itself. Row: light given out | glows, a flame, flashes | a glow stick glows.--></svg>