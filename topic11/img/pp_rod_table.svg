<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 138" width="100%" role="img" aria-label="A table with three rows, color, a magnet pulls it, bends without breaking, and two columns, before bending and after bending" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="490" height="138" fill="#ffffff"/><rect x="10" y="10" width="470" height="28" fill="#f1f1f1" stroke="#222"/><text x="105.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="270.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">before bending</text><text x="410.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after bending</text><rect x="10" y="38" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">color</text><text x="270.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">shiny silver-gray</text><text x="410.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">shiny silver-gray</text><rect x="10" y="66" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a magnet pulls it?</text><text x="270.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><text x="410.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no</text><rect x="10" y="94" width="470" height="28" fill="#ffffff" stroke="#222"/><text x="105.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">bends without breaking?</text><text x="270.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><text x="410.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes</text><line x1="200" y1="10" x2="200" y2="122" stroke="#222"/><line x1="340" y1="10" x2="340" y2="122" stroke="#222"/><!--blind: A table. Header: (blank) | before bending | after bending. Row: color | shiny silver-gray | shiny silver-gray. Row: a magnet pulls it? | no | no. Row: bends without breaking? | yes | yes.--></svg>