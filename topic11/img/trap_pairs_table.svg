<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 278" width="100%" role="img" aria-label="A table of four trap pairs, each pair one row physical and one row chemical, with what you see, whether a new substance formed, and the verdict: wax melting, the wax runs, still wax, no, physical change; wax burning, a flame and the wax turns to gas and soot, yes, chemical change; crushing an eggshell, eggshell powder, still eggshell, no, physical; an eggshell in vinegar, bubbles of a gas that was not there, yes, chemical; cutting an apple, two pieces of apple, no, physical; a cut apple turning brown, a brown layer that was not there, yes, chemical; ice cream melting, a runny liquid, still ice cream, no, physical; an egg frying, clear runny egg turns white and solid, yes, chemical" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="540" height="278" fill="#ffffff"/><rect x="10" y="10" width="520" height="28" fill="#f1f1f1" stroke="#222"/><text x="90.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">the change</text><text x="285.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">what you see</text><text x="465.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a new substance?</text><rect x="10" y="38" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">wax melting</text><text x="285.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the wax runs: still wax</text><text x="465.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: physical</text><rect x="10" y="66" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">wax burning</text><text x="285.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a flame; the wax turns to gas and soot</text><text x="465.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: chemical</text><rect x="10" y="94" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">crushing an eggshell</text><text x="285.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">eggshell powder: still eggshell</text><text x="465.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: physical</text><rect x="10" y="122" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an eggshell in vinegar</text><text x="285.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">bubbles of a gas that was not there</text><text x="465.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: chemical</text><rect x="10" y="150" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">cutting an apple</text><text x="285.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">two pieces of apple</text><text x="465.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: physical</text><rect x="10" y="178" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a cut apple browning</text><text x="285.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a brown layer that was not there</text><text x="465.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: chemical</text><rect x="10" y="206" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ice cream melting</text><text x="285.0" y="225" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a runny liquid: still ice cream</text><text x="465.0" y="225" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">no: physical</text><rect x="10" y="234" width="520" height="28" fill="#ffffff" stroke="#222"/><text x="90.0" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an egg frying</text><text x="285.0" y="253" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">runny egg white turns solid</text><text x="465.0" y="253" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">yes: chemical</text><line x1="170" y1="10" x2="170" y2="262" stroke="#222"/><line x1="400" y1="10" x2="400" y2="262" stroke="#222"/><!--blind: A table. Header: the change | what you see | a new substance?. Row: wax melting | the wax runs: still wax | no: physical. Row: wax burning | a flame; the wax turns to gas and soot | yes: chemical. Row: crushing an eggshell | eggshell powder: still eggshell | no: physical. Row: an eggshell in vinegar | bubbles of a gas that was not there | yes: chemical. Row: cutting an apple | two pieces of apple | no: physical. Row: a cut apple browning | a brown layer that was not there | yes: chemical. Row: ice cream melting | a runny liquid: still ice cream | no: physical. Row: an egg frying | runny egg white turns solid | yes: chemical.--></svg>