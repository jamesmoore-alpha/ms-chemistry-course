ge and a gas forming as bubbles", "a solid forming and a temperature change", "light given out and a gas forming as bubbles"], "key": 1, "fb": ["Cloudy white is a solid forming where two liquids met, and no bubbles are described.", "Turns cloudy white is a solid forming, a precipitate; the cup gets warm is a temperature change.", "Nothing glowed, and no bubbles are described."], "why": "The telling words are cloudy white and gets warm.<br>Cloudy means a solid formed where two liquids met: a precipitate.<br>Warm on its own means a temperature change, so both signs appear."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video matched the word \"fizzes\" to one sign. Which sign?", "options": ["a gas forming", "a color change", "light given out"], "key": 0, "fb": ["Fizz is bubbles of gas leaving the water: a gas forming.", "Fizz is about bubbles, not about color.", "Fizz is about bubbles, not about light."], "why": "Fizzes: bubbles of gas left the water.<br>Bubbles or fizz mean a gas formed.<br>So the sign is a gas forming."}]}, {"id": "L05", "atom": "MAT-065", "title": "Physical or chemical? The one test", "video": "definitely a video", "lesson_type": "Routine lesson (a one-question test applied to look-alike cases, walked as trap pairs): did a new substance form?; says once that \"can it be undone?\" is not the test; no term coined", "check_design": "Type (b) scaffolded → two recall MCQs (L02: a new substance forms in a chemical change; L03: bubbles alone do not prove one), the worked walk on the page (the kettle and the vinegar), two scaffold steps on a fresh case (yellow grains from two clear liquids: is the solid a new substance? so which change?), a fluency run of six described scenes in trap pairs (bread cut / toasted black; a seashell fizzing / ground; a pear sliced / browning; keys p c c p p c — the blueprint's eight became six, the wax and eggshell pairs living in the article's trap-pairs table), two drawn items (before-and-after boxes: oxygen pairs rearranged, physical; two kinds of pair becoming one joined particle, chemical), one student-claim misconception (Esme: ripping newspaper is chemical because it cannot be undone; key no) and one TRUE student claim (Rosa: grinding coffee beans is physical because the powder is still coffee; key yes). 14 items; the two-option key string across the shared option set (q1, q4–q12) is c c p c c p p c c p, no four alternating (corrected 2026-09-25: the author's string omitted q1).", "headache": ["Water boils in a kettle, and bubbles pour off it.", "Baking soda meets vinegar, and bubbles pour off that too.", "Bubbles rise in both.", "One is a physical change and one is a chemical change.", "How can you tell which is which?"], "forest": ["How do you decide whether a change is physical or chemical?", "Ask one question: did a new substance form?", "The kettle bubbles are water as a gas, the same substance as the liquid, so boiling is a physical change.", "The vinegar bubbles are carbon dioxide, a gas that was not there before, so the fizzing is a chemical change.", "The signs are clues; the new-substance question decides.", "Whether the change can be undone is not the test."], "article": [{"t": "idea", "text": "Water boils in a kettle, and bubbles pour off it."}, {"t": "idea", "text": "Baking soda meets vinegar, and bubbles pour off that too."}, {"t": "idea", "text": "Bubbles rise in both."}, {"t": "idea", "text": "One is a physical change and one is a chemical change."}, {"t": "idea", "text": "How can you tell which is which?"}, {"t": "h", "text": "Ask one question"}, {"t": "idea", "text": "The signs are clues, and bubbles are one sign."}, {"t": "idea", "text": "A clue is not proof, so ask the one question that decides: did a new substance form?"}, {"t": "h", "text": "The kettle"}, {"t": "idea", "text": "Zoom in on the kettle's bubbles."}, {"t": "idea", "text": "The gas in them is water as a gas: the same water particles that were in the liquid."}, {"t": "idea", "text": "No new substance formed, so boiling is a physical change."}, {"t": "h", "text": "The vinegar"}, {"t": "idea", "text": "Now zoom in on the vinegar's bubbles."}, {"t": "idea", "text": "The gas in them is carbon dioxide."}, {"t": "idea", "text": "There was no carbon dioxide in the vinegar or in the baking soda."}, {"t": "idea", "text": "A new substance formed, so the fizzing is a chemical change."}, {"t": "fig", "key": "two_beakers", "cap": "Left: the kettle, the liquid water before, and the gas in its bubbles after: the same water particles. Right: vinegar with baking soda in it before, drawn simply, and the gas in its bubbles after: carbon dioxide, a particle that was not there before."}, {"t": "h", "text": "Not \"can it be undone?\""}, {"t": "idea", "text": "Many students ask a different question: can the change be undone?"}, {"t": "idea", "text": "That is not the test."}, {"t": "idea", "text": "Suppose a sheet of newspaper is ripped in half: nobody can mend it, yet the pieces are still newspaper."}, {"t": "idea", "text": "No new substance formed, so ripping is a physical change."}, {"t": "idea", "text": "Only one question decides: did a new substance form?"}, {"t": "h", "text": "Trap pairs"}, {"t": "idea", "text": "Here are pairs of changes that look alike, with the question asked of each."}, {"t": "idea", "text": "Wax melts and runs: still wax, so a physical change."}, {"t": "idea", "text": "Wax burns with a flame and turns to gas and soot: new substances, so a chemical change."}, {"t": "idea", "text": "An eggshell is crushed to powder: still eggshell, so a physical change."}, {"t": "idea", "text": "An eggshell fizzes in vinegar with bubbles of a gas that was not there, so a chemical change."}, {"t": "fig", "key": "trap_pairs_table", "cap": "Four trap pairs in the same frame: what you see, whether a new substance formed, and so which change it is."}, {"t": "idea", "text": "An apple is cut: two pieces of apple, so a physical change."}, {"t": "idea", "text": "The cut apple turns brown: a brown layer that was not there, so a chemical change."}, {"t": "idea", "text": "Ice cream melts: still ice cream, so a physical change."}, {"t": "idea", "text": "An egg fries: the clear, runny white turns white and solid, so a chemical change."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To decide whether a change is physical or chemical, ask one question: did a new substance form? The signs are clues; the new-substance question decides. Whether the change can be undone is not the test."}, {"t": "idea", "text": "Back to the kettle and the vinegar: the kettle's bubbles are water; the vinegar's bubbles are a new substance."}, {"t": "idea", "text": "Boiling is a physical change, and the fizzing is a chemical change."}], "script": [{"say": "Water boils in a kettle, and bubbles pour off it.", "screen": "[the kettle bubbles]"}, {"say": "Baking soda meets vinegar, and bubbles pour off that too.", "screen": "[the beaker fizzes beside it]"}, {"say": "One is a physical change and one is a chemical change. How can you tell which is which?", "screen": "[question mark between them]"}, {"say": "Bubbles are a clue, not proof, so ask the question that decides: did a new substance form?", "screen": "[chip: DID A NEW SUBSTANCE FORM?]"}, {"say": "Inside the kettle's bubbles is water as a gas: the same water particles as in the liquid.", "screen": "[two_beakers, left column: the before box, the after box]"}, {"say": "No new substance formed, so boiling is a physical change.", "screen": "[label PHYSICAL CHANGE under the left column]"}, {"say": "Inside the vinegar's bubbles is carbon dioxide, and there was none in the vinegar or baking soda.", "screen": "[right column: the before box, the after box]"}, {"say": "A new substance formed, so the fizzing is a chemical change.", "screen": "[label CHEMICAL CHANGE under the right column]"}, {"say": "Many students ask instead whether the change can be undone, and that is not the test.", "screen": "[chip crossed out: CAN IT BE UNDONE?]"}, {"say": "Rip a newspaper in half: nobody can mend it.", "screen": "[a newspaper rips]"}, {"say": "Yet the pieces are still newspaper: a physical change.", "screen": "[label STILL NEWSPAPER]"}, {"say": "Line up look-alike pairs: wax melting, still wax, physical; wax burning to soot, chemical.", "screen": "[trap_pairs_table, first two rows]"}, {"say": "So here is the rule: ask one question, did a new substance form?", "screen": "[rule slide reuses the two columns; rule text]"}, {"say": "Back to the kettle and the beaker: water bubbles, a physical change; carbon dioxide bubbles, a chemical change.", "screen": "[the two columns with their labels]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In which kind of change does a new substance form?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["In a physical change no new substance forms; the particles are the same particles.", "A chemical change is a change in which a new substance forms."], "why": "A physical change forms no new substance.<br>A chemical change is a change in which a new substance forms."}, {"type": "mcq", "tag": "recall", "stem": "Bubbles appear in a liquid. Do the bubbles alone prove that a chemical change happened?", "options": ["yes", "no"], "key": 1, "fb": ["A gas forming is a clue, not proof: boiling water bubbles, and boiling is a physical change.", "A gas forming is a clue, not proof: boiling water bubbles, and boiling is a physical change."], "why": "A gas forming is one of the five signs.<br>Each sign is a clue, not proof, because each can appear without a chemical change.<br>So bubbles alone do not prove a chemical change."}, {"type": "mcq", "tag": "scaffold", "stem": "Two clear liquids are poured together. Yellow grains form and settle to the bottom. Is the yellow solid a new substance?", "options": ["yes", "no"], "key": 0, "fb": ["Neither liquid was yellow or a solid; the grains have properties neither liquid had, so they are a new substance.", "Both liquids were clear and runny; a yellow solid has properties neither had, so it is a new substance."], "why": "Both liquids were clear and runny.<br>The grains are yellow and solid: properties neither liquid had.<br>So the yellow solid is a new substance: yes."}, {"type": "mcq", "tag": "scaffold", "stem": "Two clear liquids are poured together, and yellow grains form and settle. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["A yellow solid that neither clear liquid was is a new substance, so this is not a physical change.", "A new substance, the yellow solid, formed, so this is a chemical change."], "why": "Ask: did a new substance form?<br>The yellow grains are a solid that neither clear liquid was.<br>A new substance formed, so this is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A slice of bread is cut into four squares. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Each square is still bread; only the size and shape changed.", "Cutting makes pieces of the same substance: each square is still bread."], "why": "Ask: did a new substance form?<br>Each square is still bread.<br>No new substance formed, so cutting is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A slice of bread left in the toaster turns black and gives off smoke. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Black, brittle crust and smoke are substances the soft bread was not: a new substance formed.", "The bread became black crust and smoke, substances with properties bread does not have."], "why": "Ask: did a new substance form?<br>The soft bread became black crust and smoke.<br>New substances formed, so burning the toast is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A seashell dropped into a sour cleaning liquid fizzes. The gas in the bubbles is carbon dioxide, and neither the shell nor the liquid is carbon dioxide. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Carbon dioxide formed where there was none: a new substance, so this is not a physical change.", "Carbon dioxide formed where there was none: a new substance, so a chemical change."], "why": "Ask: did a new substance form?<br>Neither the shell nor the liquid is carbon dioxide, yet the bubbles are carbon dioxide.<br>A new substance formed, so the fizzing is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A seashell is ground into a fine white powder. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The powder is still seashell in tiny pieces; only the size changed.", "Grinding makes tiny pieces of the same substance: the powder is still seashell."], "why": "Ask: did a new substance form?<br>The powder is the shell in tiny pieces.<br>No new substance formed, so grinding is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A pear is sliced into eight pieces. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Each piece is still pear; only the size and shape changed.", "Slicing makes pieces of the same substance: each piece is still pear."], "why": "Ask: did a new substance form?<br>Each piece is still pear.<br>No new substance formed, so slicing is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "The pear slices turn brown after an hour on the plate. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["A brown layer that was not there before formed on the pale flesh: a new substance.", "The brown layer has properties the pale flesh did not have: a new substance formed."], "why": "Ask: did a new substance form?<br>The pale flesh grew a brown layer that was not there before.<br>A new substance formed, so the browning is a chemical change."}, {"type": "mcq", "tag": "fluency", "fig": "ci_l05b", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The left box shows the particles before a change; the right box shows a sample of what is left after it. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Before, two kinds of pair sat apart; after, every particle is a new shape, so the substance is new.", "Every particle after is one large open circle joined to two small dark circles: a shape that was not there before, so a new substance."], "why": "Before, pairs of small dark circles and pairs of large open circles sit apart: two substances.<br>After, every particle is one large open circle joined to two small dark circles: a shape that was not there.<br>A new substance formed, so this is a chemical change."}, {"type": "mcq", "tag": "fluency", "fig": "ci_l05a", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The boxes show the particles before and after a change. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Every particle after is the same pair of large open circles as before, only laid out differently.", "Compare the shapes: the same pairs before and after, so no new substance formed."], "why": "Before, every particle is a pair of large open circles.<br>After, every particle is the same pair, only laid out differently.<br>No new substance formed, so this is a physical change."}, {"type": "mcq", "tag": "misconception", "stem": "Esme says: \"Ripping a sheet of newspaper in half is a chemical change, because you can never undo it.\" Is Esme correct?", "options": ["yes", "no"], "key": 1, "fb": ["Whether a change can be undone is not the test. The pieces are still newspaper, so no new substance formed: a physical change.", "Whether a change can be undone is not the test. The pieces are still newspaper, so no new substance formed: a physical change."], "why": "The test is one question: did a new substance form?<br>The ripped pieces are still newspaper, so no new substance formed.<br>Whether the change can be undone is not the test, so Esme is not correct."}, {"type": "mcq", "tag": "misconception", "stem": "Rosa says: \"Grinding coffee beans into powder is a physical change, because the powder is still coffee.\" Is Rosa correct?", "options": ["yes", "no"], "key": 0, "fb": ["The powder is the beans in tiny pieces: the same substance, so no new substance formed.", "The powder is the beans in tiny pieces: the same substance, so no new substance formed."], "why": "The test is one question: did a new substance form?<br>The ground powder is the coffee beans in tiny pieces: the same substance.<br>No new substance formed, so grinding is a physical change and Rosa is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video looked inside the kettle's bubbles. What did it find there?", "options": ["carbon dioxide, a new gas", "air that was trapped inside the water", "water as a gas, the same particles"], "key": 2, "fb": ["Carbon dioxide was in the vinegar's bubbles, not the kettle's.", "The kettle's bubbles were water as a gas, not trapped air.", "The kettle's bubbles were water as a gas: the same water particles as in the liquid."], "why": "The gas in the kettle's bubbles is water as a gas.<br>Those are the same water particles that were in the liquid.<br>No new substance formed, so boiling is a physical change."}]}, {"id": "L06", "atom": "MAT-065b", "title": "Show your evidence", "video": "could do without a video", "lesson_type": "Routine lesson (a three-line frame: I observed / that shows / so the change is; worked on the egg, then scaffolded on fresh cases, then bare); no term coined", "check_design": "Type (b) scaffolded → two recall MCQs (L05: the question that decides; L04: cloudy with grains settling is a solid forming), the worked answer on the page (the egg, and the ice cube for a physical change), three scaffold steps on a fresh chemical case (cake batter: which observation? what does it show? so which change?), two on a fresh physical case (a glass rod heated, bent and cooled: what does 'still clear, hard glass' show? so which change?), two bare free-response items (steel wool in a flame, chemical; a soap swan, physical), then four MCQs in test form: which sentence justifies the call correctly (a brass doorknob; a tide pool drying; a glow stick; an ice sculpture; distractors name the change with no evidence, cite 'cannot be undone', or cite a sign that was not in the scene; keys 0 2 1 3). 13 items.", "headache": ["A test asks: is frying an egg a physical or a chemical change?", "The test also says: explain your answer.", "A student writes \"chemical\" and stops.", "That answer earns half the points.", "The other half is the evidence.", "What does a full answer say?"], "forest": ["How do you justify a physical-or-chemical call?", "Say what you observed.", "Say what that observation shows about whether a new substance formed.", "Then name the change."], "article": [{"t": "idea", "text": "A test asks: is frying an egg a physical or a chemical change?"}, {"t": "idea", "text": "The test also says: explain your answer."}, {"t": "idea", "text": "A student writes \"chemical\" and stops."}, {"t": "idea", "text": "That answer earns half the points."}, {"t": "idea", "text": "The other half is the evidence."}, {"t": "idea", "text": "What does a full answer say?"}, {"t": "h", "text": "Three lines"}, {"t": "idea", "text": "A full answer has three lines."}, {"t": "idea", "text": "Line 1 says what you observed."}, {"t": "idea", "text": "Line 2 says what that observation shows about whether a new substance formed."}, {"t": "idea", "text": "Line 3 names the change."}, {"t": "h", "text": "The egg, in three lines"}, {"t": "idea", "text": "I observed: the clear, runny egg white turned white and solid."}, {"t": "idea", "text": "That shows: a new substance formed, because the solid has properties the runny white did not have."}, {"t": "idea", "text": "So the change is: a chemical change."}, {"t": "h", "text": "A physical change, in three lines"}, {"t": "idea", "text": "For a physical change, the evidence is that the substance is still there."}, {"t": "idea", "text": "I observed: the ice cube turned into a clear liquid that looks, pours and tastes like water."}, {"t": "idea", "text": "That shows: the water is still water, so no new substance formed."}, {"t": "idea", "text": "So the change is: a physical change."}, {"t": "fig", "key": "frame_cards", "cap": "The three-line frame filled for three cases in the same frame: frying an egg, melting an ice cube, a nail rusting."}, {"t": "h", "text": "Answers that lose points"}, {"t": "idea", "text": "\"It is chemical\" names the change and gives no evidence."}, {"t": "idea", "text": "\"It cannot be undone\" is not evidence: whether a change can be undone is not the test."}, {"t": "idea", "text": "\"It fizzed\" is not evidence when nothing in the scene fizzed."}, {"t": "idea", "text": "Cite only what you observed, and say what it shows."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "To justify a physical-or-chemical call: say what you observed, say what that observation shows about whether a new substance formed, then name the change."}, {"t": "idea", "text": "Back to the test: the full answer cites the solid egg white, says a new substance formed, and names a chemical change."}], "script": [{"say": "A test asks: is frying an egg physical or chemical? Explain.", "screen": "[a test page with the question]"}, {"say": "A student writes chemical and stops.", "screen": "[the word chemical, then a blank]"}, {"say": "That earns half the points; the other half is the evidence. What does a full answer say?", "screen": "[half the points; question mark]"}, {"say": "A full answer has three lines.", "screen": "[three empty lines]"}, {"say": "Line one says what you observed.", "screen": "[label I OBSERVED…]"}, {"say": "Line two says what that observation shows about whether a new substance formed.", "screen": "[label THAT SHOWS…]"}, {"say": "Line three names the change.", "screen": "[label SO THE CHANGE IS…]"}, {"say": "The egg: I observed the clear, runny white turn white and solid.", "screen": "[frame_cards, card one, line one fills]"}, {"say": "That shows a new substance formed: the solid has properties the runny white did not have.", "screen": "[line two fills]"}, {"say": "So the change is a chemical change.", "screen": "[line three fills]"}, {"say": "For a physical change, the evidence is that the substance is still there: the liquid looks, pours and tastes like water.", "screen": "[card two, lines one and two fill]"}, {"say": "Still water, no new substance, so a physical change.", "screen": "[card two, line three]"}, {"say": "Naming the change with no evidence earns half.", "screen": "[crossed-out answer: IT IS CHEMICAL]"}, {"say": "Cannot be undone is not the test; it fizzed counts only if something fizzed.", "screen": "[two more crossed-out answers]"}, {"say": "So here is the rule: say what you observed, say what it shows about a new substance, then name the change.", "screen": "[rule slide reuses the three cards; rule text]"}, {"say": "Back to the test: the egg white turned solid, a new substance formed, a chemical change.", "screen": "[the test page, three lines written]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which question decides whether a change is physical or chemical?", "options": ["Can the change be undone afterwards?", "Did a new substance form?", "Did bubbles appear?"], "key": 1, "fb": ["Whether a change can be undone is not the test.", "The one test is whether a new substance formed.", "Bubbles are a clue, not proof; the test is whether a new substance formed."], "why": "The signs are clues, and whether a change can be undone is not the test.<br>One question decides: did a new substance form?"}, {"type": "mcq", "tag": "recall", "stem": "Two clear liquids meet, the mixture goes cloudy, and grains settle. Which sign is this?", "options": ["a gas forming, seen as bubbles or fizz", "a color change to a new color", "a solid forming"], "key": 2, "fb": ["Grains that settle are a solid, not a gas.", "Cloudy with grains settling is a solid forming, not only a new color.", "A solid appearing where two liquids met is a solid forming: a precipitate."], "why": "The telling words are cloudy and grains settle.<br>A solid appearing where two liquids met means a precipitate formed.<br>So the sign is a solid forming."}, {"type": "mcq", "tag": "scaffold", "stem": "Pale, runny cake batter is baked into a brown, spongy cake. Which observation is the evidence?", "options": ["The runny batter turned into a brown, spongy solid.", "The oven was set to a high temperature for the whole bake.", "The cake was baked for exactly 30 minutes."], "key": 0, "fb": ["What the batter became is the observation that tells you about a new substance.", "The oven setting is what was done, not what the batter became.", "The time is what was done, not what the batter became."], "why": "The evidence is what you observed about the substance.<br>The batter was pale and runny; it became brown, spongy and solid.<br>That change in the substance is the observation to cite."}, {"type": "mcq", "tag": "scaffold", "stem": "Pale, runny cake batter baked into a brown, spongy cake. What does that observation show?", "options": ["The batter is still batter, in a new shape.", "A new substance formed.", "The change can be undone by cooling the cake."], "key": 1, "fb": ["Spongy, brown and solid are properties the runny batter did not have, so it is not the same substance.", "The cake has properties the batter did not have, so a new substance formed.", "Whether a change can be undone is not the test."], "why": "The runny batter became a brown, spongy solid.<br>Those are properties the batter did not have.<br>So a new substance formed."}, {"type": "mcq", "tag": "scaffold", "stem": "Pale, runny cake batter baked into a brown, spongy cake. Which kind of change is baking the cake?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["A new substance with new properties formed, so this is not a physical change.", "A new substance formed, so baking the cake is a chemical change."], "why": "The observation: runny batter became a brown, spongy solid.<br>That shows a new substance formed.<br>So baking the cake is a chemical change."}, {"type": "mcq", "tag": "scaffold", "stem": "A glass rod is heated until it softens, bent into a hook, and cooled: it is still clear, hard glass. What does that observation show?", "options": ["A new substance formed, with properties glass does not have.", "Heating made the glass a new substance, and cooling turned it back into glass.", "The glass is still glass: no new substance formed."], "key": 2, "fb": ["Still clear and hard means the hook has the properties glass has; nothing new formed.", "The hook is clear, hard glass all through; nothing new formed and nothing turned back. Whether a change can be undone is not the test.", "The hook is still clear, hard glass, so the substance is still there and nothing new formed."], "why": "The hook is still clear and hard, the properties glass has.<br>The substance is still glass.<br>So no new substance formed."}, {"type": "mcq", "tag": "scaffold", "stem": "A glass rod is heated, bent into a hook and cooled, and the hook is still clear, hard glass. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The glass is still glass, only in a new shape: no new substance formed.", "No new substance formed; the hook is still clear, hard glass, so this is not a chemical change."], "why": "The observation: the hook is still clear, hard glass.<br>That shows no new substance formed.<br>So bending the rod is a physical change."}, {"type": "frq", "tag": "why", "task": "Steel wool is shiny, and its strands bend without breaking. Held in a flame, it glows, and a black, crumbly powder is left that does not shine and does not bend. Justify whether this is a physical or a chemical change.", "starter": "I observed…", "model": "I observed that the shiny steel wool became a black, crumbly powder that does not shine or bend.<br>That shows a new substance formed, because the powder has properties the steel wool did not have.<br>So the change is a chemical change.", "points": ["the observation: shiny steel wool became a black, crumbly powder that does not shine or bend", "what it shows: a new substance formed (new properties)", "the call: a chemical change"]}, {"type": "frq", "tag": "why", "task": "A bar of soap is carved into the shape of a swan. The swan and the shavings both smell, feel and lather like the soap. Justify whether this is a physical or a chemical change.", "starter": "I observed…", "model": "I observed that the carved swan and the shavings still smell, feel and lather like the soap.<br>That shows the soap is still soap, so no new substance formed.<br>So the change is a physical change.", "points": ["the observation: the swan and shavings still smell, feel and lather like the soap", "what it shows: the soap is still soap, no new substance formed", "the call: a physical change"]}, {"type": "mcq", "tag": "transfer", "stem": "A shiny brass doorknob turns dull brown over the years. Which sentence justifies the call correctly?", "options": ["A dull brown layer that was not there before formed on the knob: a new substance, so a chemical change.", "It is a chemical change, because brass doorknobs always change like this after many years in a busy house.", "The knob cannot be made shiny again by wiping it, so it must be a chemical change.", "The knob fizzed and gave off bubbles of gas, so it is a chemical change."], "key": 0, "fb": ["This cites the observation and says what it shows before naming the change.", "This names the change and gives no evidence from the scene.", "Whether a change can be undone is not the test.", "Nothing in the scene fizzed; this cites a sign that was not there."], "why": "A full answer cites what was observed: a dull brown layer that was not there before.<br>It says what that shows: a new substance formed.<br>Then it names the change: a chemical change."}, {"type": "mcq", "tag": "transfer", "stem": "Puddles of seawater in a tide pool dry up in the sun, leaving white salt behind. Which sentence justifies the call correctly?", "options": ["The water left the pool for good and can never be put back into it, so it must be a chemical change.", "It is a physical change, because water is a liquid and liquids always do this.", "The salt left is the salt dissolved in the seawater: no new substance, so a physical change.", "The pool got warm in the sun, so a new substance formed: a chemical change."], "key": 2, "fb": ["Whether a change can be undone is not the test.", "This names the change and gives a reason that is not evidence from the scene.", "This cites the observation, the salt left behind, and says what it shows before naming the change.", "Warmth from the sun is not a change in the substance; the salt and the water are still salt and water."], "why": "A full answer cites what was observed: white salt is left as the water leaves.<br>It says what that shows: the salt was there all along, dissolved, so no new substance formed.<br>Then it names the change: a physical change."}, {"type": "mcq", "tag": "transfer", "stem": "A glow stick is snapped, the two liquids inside mix, and it glows green for hours. Which sentence justifies the call correctly?", "options": ["It is a chemical change, because glow sticks are made in a factory so that they will glow when snapped.", "Light came from the mixed liquids on their own, a clue that a new substance formed: a chemical change.", "The stick can never be made to glow again once it fades, so it must be a chemical change.", "The stick changed shape when it was snapped, so a new substance formed."], "key": 1, "fb": ["This names the change and gives no evidence from the scene.", "This cites the observation, light given out by the mixed liquids, and says what it shows before naming the change.", "Whether a change can be undone is not the test.", "A change of shape is not evidence of a new substance."], "why": "A full answer cites what was observed: the mixed liquids gave out light on their own.<br>It says what that shows: light given out is a clue that new substances formed.<br>Then it names the change: a chemical change."}, {"type": "mcq", "tag": "transfer", "stem": "An ice sculpture melts into a puddle on a warm day. Which sentence justifies the call correctly?", "options": ["The ice can never be put back into the same sculpture once it has melted, so it must be a chemical change.", "It is a physical change, because the sculpture was very cold to start with.", "The ice gave off bubbles as it melted, so a gas formed: a chemical change.", "The puddle is water, the same substance as the ice: no new substance formed, so a physical change."], "key": 3, "fb": ["Whether a change can be undone is not the test.", "This names the change and gives a reason that is not evidence about a new substance.", "Nothing in the scene bubbled; this cites a sign that was not there.", "This cites the observation, the puddle is water, and says what it shows before naming the change."], "why": "A full answer cites what was observed: the puddle is water.<br>It says what that shows: the ice was water too, so no new substance formed.<br>Then it names the change: a physical change."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video's full answer had three lines. What did the first line say?", "options": ["the name of the change", "what the student observed", "whether the change can be undone"], "key": 1, "fb": ["The name of the change is line three.", "Line one says what you observed.", "Whether a change can be undone is not the test, and it is not one of the three lines."], "why": "Line one says what you observed.<br>Line two says what that shows about a new substance.<br>Line three names the change."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-062", "stem": "A crayon is snapped in two, and each half is still crayon. No new substance formed, only the size changed. What kind of change is this called?", "accept": ["physical change", "a physical change", "physical"], "why": "A change in which no new substance forms is called a physical change.<br>Each half is still crayon; only the size changed."}, {"type": "text", "tag": "term", "atom": "MAT-063", "stem": "A shiny metal spoon grows a dull black layer with properties the shiny metal did not have. A new substance formed. What kind of change is this called?", "accept": ["chemical change", "a chemical change", "chemical"], "why": "A change in which a new substance forms is called a chemical change.<br>The black layer has properties the shiny metal did not have."}, {"type": "text", "tag": "term", "atom": "MAT-064", "stem": "A drop of one clear liquid falls into a jar of another clear liquid, and at once white grains form and sink to the bottom. What is that solid called?", "accept": ["precipitate", "a precipitate", "the precipitate"], "why": "A solid that forms when two liquids meet is called a precipitate.<br>It is one of the five signs that a chemical change may have happened."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "A bamboo skewer is snapped in half. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Each half is still bamboo; only the size changed.", "Snapping makes pieces of the same substance: each half is still bamboo."], "why": "Ask: did a new substance form?<br>Each half is still bamboo.<br>No new substance formed, so snapping is a physical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "A bamboo skewer dropped into a campfire glows red, then is left as gray, powdery ash. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Gray, powdery ash has properties the pale, hard bamboo did not have: a new substance formed.", "The hard, pale bamboo became gray, powdery ash: a substance with properties bamboo does not have."], "why": "Ask: did a new substance form?<br>The hard, pale bamboo became gray, powdery ash.<br>A new substance formed, so burning the skewer is a chemical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "Soft tortilla triangles fry in hot oil until they are golden, crisp and puffed. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Golden, crisp and puffed are properties the soft tortilla did not have: a new substance formed.", "The soft tortilla became a crisp, golden solid with new properties."], "why": "Ask: did a new substance form?<br>The soft tortilla became golden, crisp and puffed: properties it did not have.<br>A new substance formed, so frying is a chemical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "A soft tortilla is cut into eight triangles. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Each triangle is still tortilla; only the size and shape changed.", "Cutting makes pieces of the same substance: each triangle is still tortilla."], "why": "Ask: did a new substance form?<br>Each triangle is still tortilla.<br>No new substance formed, so cutting is a physical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "An orange is peeled and split into segments. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The segments and the peel are still orange; only the pieces changed.", "Peeling and splitting make pieces of the same substance."], "why": "Ask: did a new substance form?<br>The segments and the peel are still the orange, in pieces.<br>No new substance formed, so peeling is a physical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-065", "stem": "Orange peel left in a bowl for a week grows fuzzy green patches and smells sour. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Fuzzy green patches and a sour smell are substances the fresh peel was not: new substances formed.", "The fresh peel became patches with properties it did not have: new substances formed."], "why": "Ask: did a new substance form?<br>The fresh peel grew fuzzy green patches and a sour smell it did not have.<br>New substances formed, so the rotting is a chemical change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-064b", "stem": "A spoonful of powder stirred into a clear liquid turns it deep purple. Which sign is this?", "options": ["a color change", "a gas forming", "a solid forming", "a temperature change", "light given out"], "key": 0, "fb": ["Turns deep purple: a new color, so a color change.", "No bubbles or fizz are described.", "No solid formed.", "Nothing got warmer or colder.", "Nothing glowed or flashed."], "why": "The telling words are turns deep purple.<br>Turns a new color means a color change.<br>So the sign is a color change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-064b", "stem": "Two clear liquids are mixed in a cup, and the cup turns cold in your hand. Which sign is this?", "options": ["a color change", "a gas forming", "a solid forming", "a temperature change", "light given out"], "key": 3, "fb": ["No new color is described.", "No bubbles or fizz are described.", "No solid formed.", "Turns cold on its own: a temperature change.", "Nothing glowed or flashed."], "why": "The telling words are turns cold.<br>Warm or cold on its own means a temperature change.<br>So the sign is a temperature change."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-062", "fig": "ci_pra", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The left box shows the particles of sugar water. Later the water is gone, and a white solid is left; the right box shows a sample of that solid. Which kind of change did the sugar go through?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Every three-kind particle in the sample is the same shape as before: the sugar is the same sugar.", "No new shape appears in the sample; the sugar particles are the same, so no new substance formed."], "why": "Before, particles of three kinds joined sit spread among particles of another shape.<br>After, a sample of what is left holds only the three-kind particles, the same shape as before.<br>The sugar particles are the same particles, so the sugar went through a physical change."}, {"type": "frq", "tag": "why", "atom": "MAT-065b", "task": "A raw hamburger patty is soft, red and moist. On a hot grill it turns brown and firm. Justify whether this is a physical or a chemical change, in three lines.", "starter": "I observed…", "model": "I observed that the soft, red patty turned brown and firm.<br>That shows a new substance formed, because the cooked patty has properties the raw patty did not have.<br>So the change is a chemical change.", "points": ["the observation: soft, red patty became brown and firm", "what it shows: a new substance formed (new properties)", "the call: a chemical change"]}], "pp100": [{"d": "easy", "atom": "MAT-062", "stem": "A change in which no new substance forms, only the size, the shape or the state, is called…", "options": ["a physical change", "a chemical change", "a change of state", "a precipitate"], "key": 0, "why": "A change in which no new substance forms is called a physical change.<br>The particles are the same particles, arranged or moving differently.<br>A chemical change forms a new substance; a change of state is only one kind of physical change; a precipitate is a solid that forms when two liquids meet."}, {"d": "easy", "atom": "MAT-063", "stem": "Which of these is a chemical change?", "options": ["a wet beach towel drying on a clothesline in the sun", "a strand of dry spaghetti snapped into two pieces", "grass clippings rotting into dark, crumbly compost", "a steel spoon bent into a gentle curve"], "key": 2, "why": "A chemical change is a change in which a new substance forms.<br>Compost is dark, crumbly and smells of earth: properties the green, grassy clippings did not have, so a new substance formed.<br>Drying, snapping and bending leave the same substance in a new place, size or shape."}, {"d": "easy", "atom": "MAT-064", "stem": "Which of these is one of the five signs that a chemical change may have happened?", "options": ["the solid sinks in water", "the mixture gets cold on its own", "the solid dissolves in a glass of water", "a magnet pulls the solid"], "key": 1, "why": "The five signs are a color change, a gas forming, a solid forming from two liquids, a temperature change and light given out.<br>A mixture getting cold on its own is a temperature change.<br>Sinking, dissolving and being pulled by a magnet are properties, not signs of a chemical change."}, {"d": "easy", "atom": "MAT-064b", "stem": "A slice of raw eggplant turns brown a few minutes after it is cut. Which sign of a chemical change is this?", "options": ["a gas forming", "a temperature change", "light given out", "a color change"], "key": 3, "why": "The telling words are turns brown.<br>Turns a new color means a color change.<br>So the sign is a color change."}, {"d": "easy", "atom": "MAT-064", "stem": "A student pours one clear liquid into a beaker of another clear liquid, and pale blue grains form and sink. What is the solid called?", "options": ["a precipitate", "a solute", "a solution", "a mixture of the two liquids"], "key": 0, "why": "A solid that forms when two liquids meet is called a precipitate.<br>A solute is a solid that dissolves into a liquid; here a solid formed instead.<br>A solution is a liquid with something dissolved in it, and the grains are a solid."}, {"d": "easy", "atom": "MAT-064", "stem": "Which pair names two of the five signs that a chemical change may have happened?", "options": ["a change of shape and a change of size", "melting and freezing", "dissolving and stirring", "a color change and light given out"], "key": 3, "why": "The five signs are a color change, a gas forming, a solid forming from two liquids, a temperature change and light given out.<br>A color change and light given out are two of them.<br>Changes of shape or size, changes of state, and dissolving are not signs."}, {"d": "easy", "atom": "MAT-062", "stem": "Which of these is a physical change?", "options": ["a strawberry growing gray, fuzzy mold", "dough baking into a crusty loaf", "a glass bottle melted and blown into a vase", "a copper roof slowly turning green over many years"], "key": 2, "why": "A physical change is a change in which no new substance forms.<br>The blown vase is still glass, in a new shape.<br>Mold, a baked loaf and a green layer on copper are new substances with new properties."}, {"d": "easy", "atom": "MAT-062", "stem": "Melting and freezing are changes of state. Which group of changes does a change of state belong to?", "options": ["chemical changes", "physical changes", "neither group: a change of state is a third kind of change of its own", "signs of a chemical change"], "key": 1, "why": "A physical change is a change in which no new substance forms.<br>In a change of state the particles are the same particles, moving differently, so no new substance forms.<br>So every change of state is a physical change; a precipitate and the five signs belong with chemical changes."}, {"d": "easy", "atom": "MAT-063", "stem": "Which of these describes what happens to the particles in a chemical change?", "options": ["The atoms join in a new way and make particles of a new kind.", "The same particles spread out among the particles of another substance and stay the same.", "The same particles move faster and farther apart.", "The same particles are separated into smaller heaps."], "key": 0, "why": "A chemical change is a change in which a new substance forms.<br>A new substance means new particles: the atoms joined in a new way.<br>Spreading out, moving faster and being separated into heaps leave the same particles, so those are physical changes."}, {"d": "easy", "atom": "MAT-063", "stem": "A chemical change turns one substance into a new substance. How do the new substance's properties compare with the old substance's?", "options": ["They are different: the new substance has its own properties.", "They are the same, because the atoms are still the same atoms.", "Only the color is different; everything else is the same.", "Only the state is different; everything else is the same."], "key": 0, "why": "The new substance has its own properties, different from the substance you started with.<br>Rust is dull and crumbles where iron is shiny and bends, and a magnet barely pulls it.<br>The same atoms in new particles behave in new ways, so the properties differ."}, {"d": "easy", "atom": "MAT-064", "stem": "One of the five signs appears during a change. What does the sign tell you?", "options": ["It proves that a chemical change happened, whatever else you see.", "It is a clue that a chemical change may have happened.", "It proves that no new substance formed.", "It shows that the change cannot be undone."], "key": 1, "why": "Each sign is a clue, not proof, because each can appear without a chemical change.<br>Boiling water bubbles, yet boiling is a physical change.<br>So a sign says a chemical change may have happened; only the new-substance question decides."}, {"d": "easy", "atom": "MAT-064b", "stem": "Two liquids are poured together in a dark room, and the mixture gives a brief blue flash. Which sign is this?", "options": ["a color change", "a gas forming", "a temperature change", "light given out"], "key": 3, "why": "The telling word is flash.<br>A flash, a glow or a flame means light was given out.<br>The blue is the color of the light, not a new color the liquid keeps, so the sign is light given out."}, {"d": "easy", "atom": "MAT-064b", "stem": "In a description of a change, which word points to the sign a gas forming?", "options": ["cloudy", "froths", "glows", "warm"], "key": 1, "why": "Bubbles, fizz or froth are a gas leaving the liquid, so froths points to a gas forming.<br>Cloudy points to a solid forming, glows to light given out, and warm to a temperature change."}, {"d": "easy", "atom": "MAT-065b", "stem": "A student must justify whether a change is physical or chemical. Which of these counts as evidence?", "options": ["how long the change took to happen", "whether the change can be undone afterward by cooling or drying", "what she observed about the substance before and after", "how hot the room was during the change"], "key": 2, "why": "To justify the call, say what you observed, say what it shows about a new substance, then name the change.<br>The evidence is the observation: what the substance was like before and after.<br>Time, room temperature and whether the change can be undone show nothing about a new substance."}, {"d": "easy", "atom": "MAT-065", "stem": "A student asks one question about a change: \"Can it be undone?\" What does the answer tell you about whether the change is physical or chemical?", "options": ["The answer decides it: a change that can be undone is physical, and one that cannot is chemical.", "The answer decides it one way: a change that cannot be undone is chemical, but one that can might be either.", "The answer decides nothing: whether a change can be undone is not the test.", "The answer decides it one way: a change that can be undone is physical, but one that cannot might be either."], "key": 2, "why": "To decide whether a change is physical or chemical, ask one question: did a new substance form?<br>Whether the change can be undone is not the test.<br>Ripped newspaper cannot be mended, yet the pieces are still newspaper: no new substance formed, a physical change.<br>So the answer to \"can it be undone?\" decides nothing."}, {"d": "medium", "atom": "MAT-065", "stem": "A plastic bottle is crushed flat before recycling. Which kind of change is this, and why?", "options": ["a chemical change, because the crushed bottle cannot be uncrushed again", "a physical change, because the flat bottle is still plastic", "a chemical change, because the bottle has a new shape", "a physical change, because plastic never changes at all"], "key": 1, "why": "Ask: did a new substance form?<br>The flat bottle is still plastic; only the shape changed.<br>No new substance formed, so crushing is a physical change; whether it can be uncrushed is not the test."}, {"d": "medium", "atom": "MAT-062", "fig": "pp_rod_table", "stem": "A thin aluminum rod is bent into a hoop. The table gives three properties of the rod before and after bending. Which statement about bending the rod is correct?", "options": ["The rod is a new substance, because its shape changed.", "The rod is a new substance, because it cannot be straightened exactly as it was.", "The rod is still aluminum, so bending it is a physical change.", "The rod is still aluminum, because aluminum can never change into anything else."], "key": 2, "why": "Every property in the table is the same before and after.<br>The same properties mean the same substance: the hoop is still aluminum.<br>No new substance formed, so bending the rod is a physical change."}, {"d": "medium", "atom": "MAT-063", "stem": "A clear liquid is poured onto a cut, and it fizzes. Why is the fizzing a chemical change?", "options": ["Bubbles always mean that a chemical change has just happened, whatever the liquid is.", "The bubbles are a gas that was not there before: a new substance formed.", "The liquid got smaller as it fizzed, so some of it was destroyed.", "The liquid was poured out of its bottle onto the cut."], "key": 1, "why": "A chemical change is a change in which a new substance forms.<br>The bubbles are a gas that was not in the liquid before.<br>A new substance formed, so the fizzing is a chemical change; bubbles alone would only be a clue."}, {"d": "medium", "atom": "MAT-064b", "stem": "A camper holds a marshmallow over the fire. It turns dark brown and puffs up with bubbles inside. Which two signs appear in the marshmallow?", "options": ["light given out and a temperature change", "a solid forming (a precipitate) and a color change", "a gas forming and a temperature change", "a color change and a gas forming"], "key": 3, "why": "The telling words are turns dark brown and bubbles inside.<br>Turns a new color means a color change; bubbles mean a gas formed.<br>The fire's light and heat belong to the fire, not to a change in the marshmallow on its own."}, {"d": "medium", "atom": "MAT-064b", "stem": "Which of these changes shows the sign a solid forming?", "options": ["Two clear liquids are mixed, and gray grains settle out.", "Salt sprinkled onto a wet road disappears into the slush.", "A puddle of muddy water dries up and leaves a dusty ring behind.", "A tablet fizzes in a glass of water."], "key": 0, "why": "The sign a solid forming is a solid appearing where two liquids meet.<br>Gray grains settling out of two mixed liquids are that solid.<br>Salt dissolving is a solid vanishing, drying leaves what was already there, and fizzing is a gas forming."}, {"d": "medium", "atom": "MAT-065", "fig": "ci_ppa", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The boxes show a substance before and after a change. Which kind of change is this, and why?", "options": ["a chemical change, because the particles moved", "a physical change, because a substance can never change into another one", "a physical change, because every particle after is the same kind as before", "a chemical change, because the particles are a new shape that was not there before"], "key": 2, "why": "Before, every particle is one gray circle between two large open circles.<br>After, every particle is the same shape.<br>The same kind of particle, so no new substance formed: a physical change."}, {"d": "medium", "atom": "MAT-065", "fig": "ci_ppb", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The left box shows the particles before a change; the right box shows a sample of what is left after it. Which statement is correct?", "options": ["The particles only spread out, so this is a physical change.", "A new kind of particle formed, so this is a chemical change.", "The gray circles disappeared, so this is a physical change.", "Nothing changed, because both boxes hold the same two shades of circle."], "key": 1, "why": "Before, single gray circles sit apart from pairs of large open circles: two substances, not joined.<br>After, every particle is one gray circle joined between two large open circles: a shape that was not there before.<br>A new kind of particle formed, so this is a chemical change."}, {"d": "medium", "atom": "MAT-065", "stem": "Coconut oil in a jar turns from a white solid into a clear liquid on a hot day. The liquid smells and tastes of coconut oil. Which kind of change is this, and why?", "options": ["a physical change, because the liquid is still coconut oil", "a chemical change, because the color changed from white to clear", "a chemical change, because a liquid formed", "a physical change, because oil never changes"], "key": 0, "why": "Ask: did a new substance form?<br>The liquid smells and tastes of coconut oil: it is still coconut oil, melted.<br>No new substance formed, so this is a physical change; the oil looks clear because it melted, not because a new substance formed."}, {"d": "medium", "atom": "MAT-065b", "stem": "A student writes: \"Baking the bread is a chemical change, because you cannot un-bake it.\" What is wrong with this justification?", "options": ["Nothing is wrong: naming the change and saying it cannot be undone is a full answer.", "It names the wrong change: baking bread is a physical change, because the loaf is still dough.", "It should cite the oven's temperature as the evidence for the change.", "It leans on \"can it be undone,\" which is not the test."], "key": 3, "why": "Whether a change can be undone is not the test.<br>A full answer cites an observation: the soft, pale dough became a firm, brown loaf with a crust.<br>Then it says what that shows, a new substance formed, and names a chemical change."}, {"d": "medium", "atom": "MAT-062", "fig": "pp_mix", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The boxes show the particles before and after a change. Which statement is correct?", "options": ["The two kinds of particle joined into one new kind, so this is a chemical change.", "The same two kinds of particle mixed together, so this is a physical change.", "One kind of particle turned into the other kind, so this is a chemical change.", "The particles spread out, so a gas formed: a chemical change."], "key": 1, "why": "Before, the two kinds sit apart: one kind on the left, the other on the right.<br>After, the same two kinds are spread among each other, and none is joined to the other.<br>The same particles, only mixed, so no new substance formed: a physical change."}, {"d": "medium", "atom": "MAT-062", "stem": "A student stirs sugar into hot water until no more will dissolve, hangs a string in the syrup and leaves it. Over a week, clear sugar crystals grow along the string. Which statement explains why no new substance formed?", "options": ["The sugar's particles that were spread through the water gathered back together into crystals: still sugar.", "A solid formed out of the liquid, so this must be a precipitate, and a precipitate is always a new substance.", "The water turned into sugar crystals as it cooled, because a cold liquid always becomes a solid.", "The sugar's particles joined with the water's particles to make one new kind of solid."], "key": 0, "why": "Ask: did a new substance form?<br>The crystals are the same sugar particles that were spread through the hot water, gathered back together as the syrup cooled and stood.<br>A precipitate forms where two liquids meet; here one liquid gave back the solid it held, so no new substance formed: a physical change."}, {"d": "medium", "atom": "MAT-063", "fig": "pp_shrimp_table", "stem": "Raw shrimp are cooked in a hot pan. The table gives three properties of the shrimp before and after cooking. Which statement about cooking the shrimp is correct?", "options": ["The shrimp are the same substance, because they are still called shrimp.", "The shrimp are the same substance: heating only changed their state.", "A new substance formed: every property in the table changed.", "A new substance formed, because the shrimp got hot in the pan."], "key": 2, "why": "Every property in the table is different after cooking: the color, whether you can see through it, soft or firm.<br>Different properties mean a different substance, so a new substance formed.<br>Cooking the shrimp is a chemical change; the name stayed, the substance did not."}, {"d": "medium", "atom": "MAT-064", "stem": "Which of these color changes happened without a chemical change?", "options": ["A green bell pepper ripens to bright red on the plant.", "Raw chicken turns from pink to white in a hot frying pan.", "A pale sidewalk turns dark gray when rain wets it.", "Slices of white onion fry to a golden brown in a hot pan."], "key": 2, "why": "Each sign is a clue, not proof, because each can appear without a chemical change.<br>Wet concrete is the same concrete with water in its pores; the water only darkens how it looks.<br>Ripening, cooking chicken and browning onion all form new substances with new properties."}, {"d": "medium", "atom": "MAT-064", "stem": "Which of these shows the sign a gas forming without a chemical change?", "options": ["A piece of limestone dropped into vinegar fizzes.", "Sherbet powder fizzes on your tongue.", "A spoon of baking soda stirred into a cup of lemon juice froths.", "A leaking bicycle tire held under water gives off bubbles."], "key": 3, "why": "Each sign is a clue, not proof.<br>The tire's bubbles are air that was already inside the tire, escaping: no new substance formed.<br>Limestone in vinegar, sherbet on a wet tongue and baking soda in lemon juice all make a gas that was not there before."}, {"d": "medium", "atom": "MAT-064b", "stem": "A pinch of turmeric powder is stirred into a glass of water standing on a warm radiator. The water turns bright yellow, and the glass feels warm. Which sign appears in the water?", "options": ["a color change", "a gas forming", "a solid forming", "a temperature change"], "key": 0, "why": "The telling words are turns bright yellow: a color change.<br>The glass is warm because the radiator warmed it, not because the mixture warmed on its own.<br>So the one sign in the water is a color change; here it is only a clue, because the powder only spread through the water."}, {"d": "medium", "atom": "MAT-064b", "stem": "Which of these changes shows the sign a temperature change?", "options": ["A mug of hot tea slowly cools as it stands on a desk for an hour.", "A pan of rice and water heats up on the stove until it boils.", "Two glue pastes stirred together get warm.", "A metal spoon left in a mug of hot cocoa gets warm."], "key": 2, "why": "The sign is a temperature change on its own, with nothing heating or cooling the mixture.<br>Nothing in the scene heats the glue pastes, yet they get warm: that is the sign.<br>The tea and the spoon were warmed or cooled by what was around them, and the stove heated the rice."}, {"d": "medium", "atom": "MAT-065", "stem": "A raw salmon fillet, deep orange and soft, is cut into cubes. The cubes are then fried until they turn pale pink, firm and flaky. Which statement about the two changes is correct?", "options": ["Cutting is a chemical change; frying is a physical change.", "Both are physical changes: the fish is still fish.", "Cutting is a physical change; frying is a chemical change.", "Both are chemical changes: a knife and a pan both change the fish."], "key": 2, "why": "Ask each time: did a new substance form?<br>Each cube is still raw salmon, so cutting is a physical change.<br>The fried cubes are pale pink, firm and flaky, properties the deep-orange, soft raw fish did not have: a new substance formed, so frying is a chemical change."}, {"d": "medium", "atom": "MAT-065", "fig": "pp_split", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The left box shows the particles before a change; the right box shows a sample of what is left after it. Which kind of change is this, and why?", "options": ["a physical change, because the joined particles only came apart, like a solid dissolving in water", "a physical change, because both boxes hold the same two sizes of circle", "a chemical change, because two new kinds of particle formed that were not there before", "a chemical change, because the particles moved to new places in the box"], "key": 2, "why": "Before, every particle is one large open circle joined to one small dark circle.<br>After, no particle is that shape: the large open circles are joined in pairs, and so are the small dark circles.<br>Dissolving keeps each particle whole; here the atoms regrouped into two new kinds of particle, so this is a chemical change."}, {"d": "medium", "atom": "MAT-065b", "stem": "A leather belt is cut shorter, and a new hole is punched in it. Which observation shows that the belt is still the same substance?", "options": ["The belt is shorter than it was before it was cut.", "The cut-off piece has the same color, smell and stiffness as the belt.", "The belt cannot be made as long as it was again.", "The punch made a sharp snapping sound as it went through the leather belt."], "key": 1, "why": "The evidence is what the substance is like before and after.<br>The cut-off piece has the same color, smell and stiffness as the belt: the same properties, so the same substance.<br>Being shorter is a change of size, the snapping sound is not a property of the leather, and whether it can be undone is not the test."}, {"d": "medium", "atom": "MAT-065b", "stem": "A student's answer about a slice of zucchini grilled on a barbecue has three lines. Line 2: \"That shows a new substance formed, because the grilled slice has properties the raw slice did not have.\" Line 3: \"So the change is a chemical change.\" Which sentence belongs as line 1?", "options": ["I observed that the slice sat on the hot grill for exactly five minutes on each side.", "I observed that the pale, firm, watery slice turned brown, soft and sweet-smelling.", "I observed that the slice could not be turned back into a raw slice once it was grilled.", "I observed that the grill was very hot the whole time the slice was cooking on it."], "key": 1, "why": "Line 1 says what you observed about the substance.<br>The pale, firm, watery slice became brown, soft and sweet-smelling: properties it did not have.<br>Line 2 then says that shows a new substance formed, and line 3 names the change; time, heat and whether it can be undone are not observations of the substance."}, {"d": "medium", "atom": "MAT-065", "stem": "Bubbles rise in a liquid as two things are mixed. What must you find out before you can call the change a chemical change?", "options": ["what the gas in the bubbles is, and whether it was there before", "how big the bubbles are and how fast they rise to the top", "whether the bubbling can be made to stop by cooling the liquid down", "how long the bubbles keep rising before the liquid goes still"], "key": 0, "why": "A gas forming is a clue, not proof.<br>The one question is whether a new substance formed, so you must find out what the gas is and whether it was there before.<br>The size, the speed and the length of the bubbling do not show whether a new substance formed, and stopping it is the undo test."}, {"d": "hard", "atom": "MAT-063", "stem": "Imani says: \"When a cotton rag burns to ash, the ash is just the rag in a new form, like ice melting to water, so burning is a physical change.\" Which statement is correct?", "options": ["Imani is correct: burning only changes the shape and the color of the rag, like melting does.", "Imani is correct: the ash is still cotton, only black and crumbly.", "Imani is not correct: burning is physical, but melting is chemical.", "Imani is not correct: ash has properties the rag did not have, so a new substance formed."], "key": 3, "why": "Melted ice is still water, so melting is a physical change.<br>Ash is gray, crumbly powder that does not tear or fold like cloth: properties the rag did not have.<br>A new substance formed, so burning is a chemical change and Imani is not correct."}, {"d": "hard", "atom": "MAT-065", "stem": "Inside a cold pack, a packet of water bursts, a powder dissolves in the water, and the pack gets cold. Which statement is correct?", "options": ["The temperature change proves that a chemical change happened, because only a chemical change can ever make things cold.", "The cold is a clue, not proof; the powder only dissolved, so no new substance formed: a physical change.", "Dissolving is always a chemical change, so the cold pack shows a chemical change.", "The cold shows that the powder was destroyed, so a chemical change happened."], "key": 1, "why": "A temperature change is one of the five signs, and a sign is a clue, not proof.<br>The powder dissolved; dissolving spreads the same particles through the water and forms no new substance.<br>No new substance formed, so this is a physical change."}, {"d": "hard", "atom": "MAT-065b", "stem": "Two clear liquids are mixed; the mixture turns cloudy and a white powder settles. Nico writes: \"The clear liquid turned cloudy and a white powder settled, so a new substance formed: a chemical change.\" Vera writes: \"It is a chemical change because it fizzed.\" Which statement is correct?", "options": ["Nico cites an observation from the scene and what it shows; Vera cites a sign that did not appear.", "Both answers are full answers that earn full credit.", "Vera's answer is the better one, because fizzing is a stronger sign of a chemical change than a powder settling.", "Nico's answer is wrong, because a white powder is not one of the signs."], "key": 0, "why": "A full answer cites what was observed and says what it shows.<br>Nico cites the cloudy mixture and the powder, a solid forming, and says a new substance formed.<br>Nothing in the scene fizzed, so Vera cites a sign that was not there."}, {"d": "hard", "atom": "MAT-065b", "stem": "A student's answer about a carton of milk left in a hot car has three lines. Line 1: \"I observed that the smooth milk turned into sour-smelling lumps.\" Line 3: \"So the change is a chemical change.\" Which sentence belongs as line 2?", "options": ["That shows the milk is still milk, only a little thicker, because warming a liquid can never make a new substance.", "That shows the change cannot be undone by cooling the milk again.", "That shows a new substance formed, because the lumps have a smell and a feel the fresh milk did not have.", "That shows a temperature change happened, because the car was hot."], "key": 2, "why": "Line 2 says what the observation shows about a new substance.<br>Sour-smelling lumps have a smell and a feel the smooth milk did not have, so a new substance formed.<br>Line 1 and line 3 both fit that: the milk changed, and the change is chemical."}, {"d": "hard", "atom": "MAT-062", "stem": "A square of hard fudge is warmed gently in a pan until it melts into a runny pool that smells and tastes of fudge. Odalys says: \"The pool is a new substance, because a hard solid and a runny liquid can never be the same substance.\" Which statement is correct?", "options": ["Odalys is not correct: the same substance can be a solid or a liquid, and the pool is still fudge.", "Odalys is correct: a solid and a liquid are always two different substances, whatever they are made of and however they look.", "Odalys is correct: the pool cannot be made back into the same square.", "Odalys is not correct: the pool is a new substance, but it formed by a physical change."], "key": 0, "why": "Ask: did a new substance form?<br>The same substance can be a solid or a liquid: ice and liquid water are both water.<br>The runny pool smells and tastes of fudge, so it is still fudge; melting is a physical change, and Odalys is not correct."}, {"d": "hard", "atom": "MAT-062", "stem": "Jaya whips cold cream until it stands in stiff peaks. She says: \"Whipping the cream is a physical change: the foam is cream with air whipped in, and it still tastes of cream.\" Which statement is correct?", "options": ["Jaya is not correct: the cream changed from a liquid to a thick foam, so a new substance formed.", "Jaya is not correct: whipped cream cannot be poured back as cream, so a new substance formed.", "Jaya is correct, but only because foods never go through chemical changes.", "Jaya is correct: the foam still tastes of cream, so no new substance formed."], "key": 3, "why": "Ask: did a new substance form?<br>Whipping traps air among the same cream particles; the foam tastes of cream because it is cream.<br>No new substance formed, so whipping is a physical change and Jaya is correct; thickening, and not pouring back, are not the test."}, {"d": "hard", "atom": "MAT-063", "stem": "Raw almonds are pale and chewy; roasted almonds are golden brown, crunchy and taste different. Ottilie says: \"Roasting raw almonds is a physical change, because roasted almonds are still almonds.\" Which statement is correct?", "options": ["Ottilie is correct: an almond is an almond whatever you do to it.", "Ottilie is correct: only burning to ash would make a new substance.", "Ottilie is not correct: roasting is a chemical change only because the almonds were heated in an oven.", "Ottilie is not correct: the roasted almond has new properties, so a new substance formed."], "key": 3, "why": "The everyday name stayed, but the test is whether a new substance formed.<br>Golden brown, crunchy and a new taste are properties the pale, chewy raw almond did not have.<br>A new substance formed, so roasting is a chemical change and Ottilie is not correct."}, {"d": "hard", "atom": "MAT-063", "stem": "A sliced mushroom turns brown on a plate at room temperature. Elias says: \"A chemical change happened, even though nothing was heated: the brown layer is a new substance.\" Which statement is correct?", "options": ["Elias is correct: a brown layer with new properties formed, and no heating is needed for that.", "Elias is not correct: a chemical change needs heat or a flame, so the slice can only have dried out.", "Elias is not correct: a new color is only a clue, so no chemical change happened.", "Elias is correct, because every color change is a chemical change."], "key": 0, "why": "A chemical change is a change in which a new substance forms; heat is not part of the test.<br>The brown layer was not there before and differs in color and texture from the pale flesh: a new substance formed.<br>So Elias is correct; a color change is a clue, and here the new layer shows the clue was right."}, {"d": "hard", "atom": "MAT-064", "stem": "Two clear liquids are stirred together, and a white solid settles. Dalia says: \"The solid must have been floating in one of the liquids all along, because a solid cannot come out of two liquids.\" Which statement is correct?", "options": ["Dalia is correct: a solid can only come from another solid.", "Dalia is correct: stirring shook loose a solid that had been stuck to the sides of the glass all along.", "Dalia is not correct: the solid froze out of the colder liquid when the two liquids met.", "Dalia is not correct: both liquids were clear, so the solid formed where they met: a precipitate."], "key": 3, "why": "Both liquids were clear, so neither held a solid you could see.<br>A solid that forms when two liquids meet is a precipitate: a new substance, made where the liquids met.<br>The solid came from the two liquids meeting, not from a solid that was already there, so Dalia is not correct."}, {"d": "hard", "atom": "MAT-064", "stem": "Suvi pours lemonade into an ice-pop mold and puts it in the freezer. Hours later it is solid. She says: \"A solid formed, so this shows one of the five signs of a chemical change.\" Which statement is correct?", "options": ["Suvi is correct: any solid forming, however it forms and whatever it is, is one of the five signs of a chemical change.", "Suvi is not correct: the sign is a solid forming where two liquids meet, and freezing is a change of state.", "Suvi is correct, and freezing is therefore a chemical change.", "Suvi is not correct: the sign needs bubbles to appear as well as a solid before it counts."], "key": 1, "why": "The sign is a solid forming where two liquids meet: a precipitate.<br>The lemonade froze because the freezer cooled it: a change of state, and the frozen pop is still lemonade.<br>No sign of a chemical change appeared, so Suvi is not correct."}, {"d": "hard", "atom": "MAT-064b", "stem": "The burner on a gas kitchen stove is lit, and a blue flame appears. Ptolemy says: \"The flame shows the sign a color change, because the gas was colorless and now it is blue.\" Which statement is correct?", "options": ["Ptolemy is correct: colorless to blue is a color change.", "Ptolemy is not correct: the blue flame is the sign light given out.", "Ptolemy is not correct: a flame is the sign a gas forming.", "Ptolemy is not correct: a flame is not one of the five signs at all."], "key": 1, "why": "A flame is light given out, one of the five signs; the burning gas also warms the air, a temperature change.<br>The blue is the color of the light, not a new color the gas keeps.<br>So the flame is the sign light given out, and Ptolemy is not correct."}, {"d": "hard", "atom": "MAT-065", "stem": "Tibor drops ice cubes into a glass of dark red pomegranate juice. The juice turns paler and gets cold. Tibor says: \"Two signs appeared, so this must be a chemical change.\" Which statement is correct?", "options": ["Tibor is not correct: the melting ice watered the juice down and cooled it, so no new substance formed.", "Tibor is correct: two signs appearing together are always proof of a chemical change, whatever the change is and whatever the substance.", "Tibor is correct: a color change alone is proof of a chemical change, and the cold only confirms it.", "Tibor is not correct: a chemical change needs bubbles or a flame as well."], "key": 0, "why": "Each sign is a clue, not proof, and neither look-alike came from the juice on its own: the ice cooled it and watered it down.<br>The melted ice mixed into the juice, so the juice is paler and colder.<br>The juice and the water are the same substances as before, so no new substance formed: a physical change."}, {"d": "hard", "atom": "MAT-065", "stem": "Vidya drops a marble chip into vinegar, and it fizzes. She tests the gas: it is carbon dioxide, a gas that was in neither the chip nor the vinegar. Vidya says: \"Bubbles alone are not proof, but here a new substance formed, so this is a chemical change.\" Which statement is correct?", "options": ["Vidya is not correct: bubbles are a clue, not proof, so the change must be physical.", "Vidya is not correct: the marble only dissolved into the vinegar, like a cold pack's powder.", "Vidya is correct: fizzing always means a chemical change.", "Vidya is correct: the carbon dioxide is a substance that was not there before."], "key": 3, "why": "The test is one question: did a new substance form?<br>Carbon dioxide was in neither the marble nor the vinegar, so a new substance formed: a chemical change.<br>Bubbles alone would only be a clue; knowing what the gas is decides, so Vidya is correct."}, {"d": "hard", "atom": "MAT-065b", "stem": "Imogen writes: \"The hard caramel candy melted into a runny liquid that was the same golden brown and still smelled of caramel, so a new substance formed: a chemical change.\" What is wrong with this justification?", "options": ["The middle step is wrong: the runny liquid is the same candy in a new state, so no new substance formed.", "Nothing is wrong: melting always makes a new substance, so both the evidence and the call are right.", "The observation is wrong: hard candy cannot melt.", "The call is right, but the evidence should say instead that the candy cannot be made hard and square again afterward."], "key": 0, "why": "A full answer says what was observed, what it shows about a new substance, then names the change.<br>The observation is fine, but a runny liquid with the candy's color and smell is the same candy, melted: no new substance formed.<br>So the middle step is wrong, and the call should be a physical change."}, {"d": "hard", "atom": "MAT-065b", "stem": "A heap of dry pine needles is set alight in a fire pit. Four things are observed: a bright flame; heat you can feel on your face; the heap gets smaller; a gray ash that crumbles is left where the stiff needles were. Which observation is the evidence that a new substance formed?", "options": ["the bright flame, because light given out proves a chemical change", "the heat on your face, because a temperature change proves a chemical change", "the heap getting smaller, because the needles were used up as they burned", "the gray, crumbling ash, because it has properties the needles did not have"], "key": 3, "why": "The flame and the heat are signs:
