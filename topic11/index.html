 ["physical change", "not a physical change"], "key": 0, "fb": ["Each round is still cucumber; only the size and shape changed.", "Slicing makes pieces of the same substance: each round is still cucumber."], "why": "Ask: is it still the same substance?<br>Each round is still cucumber.<br>No new substance formed, so slicing is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A banana peel turns brown, then black, over three days. Is this a physical change?", "options": ["physical change", "not a physical change"], "key": 1, "fb": ["The black, soft peel has properties the yellow peel did not have: a new substance formed.", "The peel did not only change shape or state; new substances with new properties formed in it."], "why": "Ask: is it still the same substance?<br>The yellow peel became black and soft: properties it did not have before.<br>A new substance formed, so this is not a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A new, shiny penny turns dull brown after a year in a drawer. Is this a physical change?", "options": ["physical change", "not a physical change"], "key": 1, "fb": ["The dull brown layer is a substance that was not there on the shiny penny.", "The shiny metal grew a dull brown layer with new properties: a new substance formed."], "why": "Ask: is it still the same substance?<br>The shiny metal grew a dull brown layer that was not there before.<br>A new substance formed on the penny, so this is not a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A glass jar falls and shatters into sharp pieces. Is this a physical change?", "options": ["physical change", "not a physical change"], "key": 0, "fb": ["Every piece is still glass; only the size and shape changed.", "Shattering makes pieces of the same substance: every piece is still glass."], "why": "Ask: is it still the same substance?<br>Every sharp piece is still glass.<br>No new substance formed, so shattering is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A spoonful of powdered drink mix stirred into water vanishes, and the water tastes of the mix. Is this a physical change?", "options": ["physical change", "not a physical change"], "key": 0, "fb": ["The taste says the drink mix is still there, spread through the water.", "Dissolving spreads the drink mix's particles among the water particles; the mix is still the mix."], "why": "Ask: is it still the same substance?<br>The water tastes of the mix, so the mix's particles are still there, spread through the water.<br>No new substance formed, so dissolving is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A firework bursts into colored light and leaves a cloud of smoke. Is this a physical change?", "options": ["physical change", "not a physical change"], "key": 1, "fb": ["The smoke and the burnt leftovers are not the powder that was packed inside: new substances formed.", "The packed powder became light, smoke and ash, substances that were not there before."], "why": "Ask: is it still the same substance?<br>The packed powder became smoke and burnt leftovers with different properties.<br>New substances formed, so this is not a physical change."}, {"type": "mcq", "tag": "fluency", "fig": "ci_l01a", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The boxes show the particles before and after a change. Is the substance after the change the same substance?", "options": ["yes", "no"], "key": 0, "fb": ["Every particle after is the same shape as every particle before: the same substance, rearranged.", "Compare the shapes: every particle after is one large open circle joined to two small dark circles, the same as before."], "why": "Before, every particle is one large open circle joined to two small dark circles.<br>After, every particle is the same shape, only laid out differently.<br>The same particles, so the same substance: yes."}, {"type": "mcq", "tag": "fluency", "fig": "ci_l01b", "stem": "Each size and shade of circle is a different kind of atom; touching circles are joined. The left box shows the particles before a change; the right box shows a sample of what is left after it. Is the sample the same substance?", "options": ["yes", "no"], "key": 1, "fb": ["Before, the gray circles and the open pairs were apart; after, every particle is a gray circle joined to an open circle: a new particle.", "The atoms joined into a new kind of particle, so the substance after is not the same."], "why": "Before, single gray circles sit apart from pairs of large open circles: two substances, not joined.<br>After, every particle is one gray circle joined to one large open circle.<br>New particles formed, so not the same substance: no."}, {"type": "mcq", "tag": "misconception", "stem": "Mateo stirs a spoon of salt into soup until no grains are left. He says: \"The salt is destroyed; it has stopped existing.\" Is Mateo correct?", "options": ["yes", "no"], "key": 1, "fb": ["The salt particles are still there, spread among the soup's particles; the soup tastes salty, and evaporating the water would leave the salt.", "The salt particles are still there, spread among the soup's particles; the soup tastes salty, and evaporating the water would leave the salt."], "why": "Dissolving breaks the salt into particles too small to see.<br>Those particles spread through the soup, which is why the soup tastes salty.<br>No new substance formed and nothing was destroyed, so Mateo is not correct."}, {"type": "text", "tag": "term", "stem": "A change in which no new substance forms, only the size, the shape or the state, is called a…", "accept": ["physical change", "a physical change", "physical"], "why": "A change in which no new substance forms is called a physical change.<br>The particles are the same particles, arranged or moving differently."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video zoomed into the torn paper. What did it find in each piece?", "options": ["the same paper particles", "new particles that are not paper", "no particles at all"], "key": 0, "fb": ["Each piece is still paper: the zoom found the same paper particles.", "Tearing made pieces; it made no new particle.", "Every piece of paper is made of paper particles; the zoom found them."], "why": "Tearing changed the size and the shape.<br>Each piece is still paper.<br>So the zoom found the same paper particles in each piece."}]}, {"id": "L02", "atom": "MAT-063", "title": "Chemical change: a new substance forms", "video": "definitely a video", "lesson_type": "Classification lesson (the identical frame to L01, asked the other way: \"Did a new substance form?\": rusting, burning wood, baking soda in vinegar, melting ice, a frying egg, dissolving salt); coins chemical change; one particle picture of rust", "check_design": "Type (a) one-step categorisation → two recall MCQs (L01: rolling clay into a snake is a physical change; Topic 7: water does not behave like the hydrogen it is made from), a fluency run of eight described scenes (physical change / chemical change; keys p c c p p c c p, no four alternating, 4 / 4), one what item (the flakes crumble where iron bends: a different substance), one student-claim misconception (Harper: rust is iron with oxygen stuck on top; key no), and the coined term typed LAST (moved 2026-09-25 after the second blind read: no stem above it prints the term). 13 items.", "headache": ["An iron nail is left outside for a month.", "The nail turns orange-brown and flaky.", "Iron is shiny and gray; it bends without breaking, and a magnet pulls it hard.", "The orange flakes are dull, crumble in your fingers, and a magnet barely pulls them.", "The flakes are not iron in a new shape.", "What are they?"], "forest": ["What is a chemical change?", "A chemical change is a change in which a new substance forms.", "The new substance has its own properties, different from the substance you started with.", "Iron atoms joined with oxygen atoms from the air to make particles of a new substance, rust.", "So rust is not iron with oxygen stuck on top; rust is a different substance."], "article": [{"t": "idea", "text": "An iron nail is left outside for a month."}, {"t": "idea", "text": "The nail turns orange-brown and flaky."}, {"t": "photo", "file": "nail_shiny_and_rusted.jpg", "cap": "A shiny new iron nail beside a nail left outside for a month.", "credit": "Photo: to be sourced (licensed stock)."}, {"t": "idea", "text": "Iron is shiny and gray; it bends without breaking, and a magnet pulls it hard."}, {"t": "idea", "text": "The orange flakes are dull, crumble in your fingers, and a magnet barely pulls them."}, {"t": "idea", "text": "The flakes are not iron in a new shape."}, {"t": "idea", "text": "What are they?"}, {"t": "h", "text": "Compare the properties"}, {"t": "idea", "text": "Here are iron and the flakes, lined up."}, {"t": "idea", "text": "Iron is shiny gray; the flakes are dull orange-brown."}, {"t": "idea", "text": "Iron bends without breaking; the flakes crumble."}, {"t": "idea", "text": "A magnet pulls iron hard; a magnet barely pulls the flakes."}, {"t": "idea", "text": "Every property we compared is different, so the flakes are a different substance from iron."}, {"t": "fig", "key": "iron_rust_table", "cap": "Iron and the orange flakes, compared on three properties in the same frame. Every property differs."}, {"t": "h", "text": "Where the new substance came from"}, {"t": "idea", "text": "The air around the nail holds oxygen."}, {"t": "idea", "text": "Iron atoms in the nail joined with oxygen atoms from the air."}, {"t": "idea", "text": "The joined atoms make particles of a new substance."}, {"t": "idea", "text": "That new substance is called rust."}, {"t": "idea", "text": "Rust is a compound, and a compound is not like the elements it is made from."}, {"t": "fig", "key": "iron_to_rust", "cap": "Before: iron atoms, and oxygen from the air. After: iron atoms joined to oxygen atoms, drawn simply (a real rust particle holds more atoms than this, in a fixed pattern). The joined particles are rust, a new substance."}, {"t": "h", "text": "Not oxygen stuck on top"}, {"t": "idea", "text": "Rust is not iron with oxygen stuck on top."}, {"t": "idea", "text": "If oxygen only sat among the iron atoms, the iron would still be iron."}, {"t": "idea", "text": "The atoms joined into new particles, so the flakes have new properties."}, {"t": "fig", "key": "stuck_on_vs_joined", "cap": "The question the marks answer: a new substance? Left, oxygen only sitting among the iron atoms would leave the iron as iron; that is not what happens. Right, iron atoms joined to oxygen atoms are new particles: rust."}, {"t": "h", "text": "Naming it"}, {"t": "idea", "text": "A change in which a new substance forms is called a <b>chemical change<\/b>."}, {"t": "idea", "text": "The new substance has its own properties, different from the substance you started with."}, {"t": "idea", "text": "Rusting is a chemical change."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Ask the same question of every change: did a new substance form?"}, {"t": "idea", "text": "Wood burns in a fire: ash and smoke form, and neither is wood."}, {"t": "idea", "text": "A new substance formed, so burning wood is a chemical change."}, {"t": "idea", "text": "Baking soda meets vinegar: bubbles of a gas that was not there before pour off."}, {"t": "idea", "text": "A new substance formed, so the fizzing is a chemical change."}, {"t": "idea", "text": "An ice cube melts: the liquid is still water."}, {"t": "idea", "text": "No new substance formed, so melting is a physical change."}, {"t": "fig", "key": "l02_cases_table", "cap": "Six changes in the same frame: what you end with, and whether a new substance formed. Four are chemical changes; two are physical changes."}, {"t": "idea", "text": "An egg fries: the clear, runny white turns white and solid."}, {"t": "idea", "text": "A new substance formed, so frying an egg is a chemical change."}, {"t": "idea", "text": "Salt dissolves in water: the salt is still there, spread through the water."}, {"t": "idea", "text": "No new substance formed, so dissolving is a physical change."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "A chemical change is a change in which a new substance forms. The new substance has its own properties, different from the substance you started with."}, {"t": "idea", "text": "Back to the nail: iron atoms joined with oxygen atoms and made rust, a new substance with its own properties."}, {"t": "idea", "text": "Rusting is a chemical change."}], "script": [{"say": "Leave an iron nail out for a month: it turns orange-brown and flaky.", "screen": "[a shiny nail; a month passes; orange flakes grow]"}, {"say": "Iron is shiny gray, bends without breaking, and a magnet pulls it hard.", "screen": "[the shiny nail bends; a magnet grabs it]"}, {"say": "The flakes are dull, crumble in your fingers, and a magnet barely pulls them.", "screen": "[flakes crumble; the magnet barely moves them]"}, {"say": "They are not iron in a new shape. What are they?", "screen": "[question mark over the flakes]"}, {"say": "Line them up: every property differs, so the flakes are a different substance.", "screen": "[iron_rust_table fills row by row]"}, {"say": "Iron atoms in the nail joined with oxygen atoms from the air.", "screen": "[iron_to_rust: the iron box, the oxygen box]"}, {"say": "The joined atoms make particles of a new substance, called rust.", "screen": "[the rust box appears below; chip: RUST]"}, {"say": "Rust is not iron with oxygen stuck on top: the atoms joined into new particles.", "screen": "[stuck_on_vs_joined, both boxes under the question A NEW SUBSTANCE?]"}, {"say": "A change in which a new substance forms is called a chemical change.", "screen": "[chip: CHEMICAL CHANGE]"}, {"say": "Ask the same question of every change: did a new substance form?", "screen": "[l02_cases_table, empty last column]"}, {"say": "Wood burning to ash, baking soda fizzing with a new gas, an egg frying solid: yes, yes, yes.", "screen": "[the three yes rows fill together]"}, {"say": "Ice melting to water and salt dissolving: no and no.", "screen": "[the two no rows fill together]"}, {"say": "So here is the rule: a chemical change is a change in which a new substance forms.", "screen": "[rule slide reuses the rust box; rule text]"}, {"say": "Back to the nail: iron atoms joined with oxygen atoms and made rust, a chemical change.", "screen": "[the nail, the rust box, chip: CHEMICAL CHANGE]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Modeling clay is rolled from a ball into a long snake. Is this a physical change?", "options": ["yes", "no"], "key": 0, "fb": ["The snake is still clay; only the shape changed, so no new substance formed.", "The snake is still clay; only the shape changed, so no new substance formed."], "why": "A physical change is a change in which no new substance forms.<br>The long snake is still clay: only the shape changed.<br>So rolling the clay is a physical change."}, {"type": "mcq", "tag": "recall", "stem": "Water is a compound of hydrogen and oxygen. Hydrogen is a gas that burns. Does water burn like hydrogen?", "options": ["yes", "no"], "key": 1, "fb": ["A compound is not like the elements it is made from; water puts fires out.", "A compound is not like the elements it is made from; water puts fires out."], "why": "In water the hydrogen atoms are joined to oxygen atoms in new particles.<br>New particles behave in new ways.<br>So water does not burn like hydrogen; it puts fires out."}, {"type": "mcq", "tag": "fluency", "stem": "A knitted scarf is unraveled back into a long strand of yarn. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The yarn is the same yarn the scarf was knitted from; no new substance formed.", "Unraveling changes the shape only: the strand is still the same yarn."], "why": "Ask: did a new substance form?<br>The strand is the same yarn the scarf was made of.<br>No new substance formed, so unraveling is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A steel gate hinge left in the weather grows orange, crumbly patches that a magnet barely pulls. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Steel is gray and a magnet pulls it hard; the crumbly orange patches are a different substance.", "The orange patches have properties steel does not have: a new substance formed."], "why": "Ask: did a new substance form?<br>Steel is gray and a magnet pulls it hard; the patches are orange, crumbly and barely pulled.<br>A new substance formed, so this is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A sparkler burns with bright sparks and leaves a black, brittle wire. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["The gray coating became sparks, smoke and a black crust: substances that were not there before.", "The coating on the wire became new substances with new properties."], "why": "Ask: did a new substance form?<br>The sparkler's coating became sparks, smoke and a black, brittle crust.<br>New substances formed, so burning the sparkler is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A carrot is grated into thin shreds. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["Every shred is still carrot; only the size and shape changed.", "Grating makes pieces of the same substance: every shred is still carrot."], "why": "Ask: did a new substance form?<br>Every shred is still carrot.<br>No new substance formed, so grating is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "A rubber band is stretched to twice its length. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The stretched band is still rubber; only the shape changed.", "Stretching changes the shape only: the band is still rubber."], "why": "Ask: did a new substance form?<br>The stretched band is still rubber.<br>No new substance formed, so stretching is a physical change."}, {"type": "mcq", "tag": "fluency", "stem": "The cut face of an avocado turns brown within an hour. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["The pale green flesh grew a brown layer that was not there before: a new substance formed.", "The brown layer has properties the green flesh did not have; it is a new substance."], "why": "Ask: did a new substance form?<br>The pale green flesh grew a brown layer that was not there before.<br>A new substance formed, so the browning is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "Pale, runny pancake batter turns golden brown and spongy on a hot griddle. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 1, "fb": ["Golden, spongy pancake has properties the runny batter did not have: a new substance formed.", "The batter did not only change shape; it became a spongy solid with new properties."], "why": "Ask: did a new substance form?<br>The pale, runny batter became a golden, spongy solid.<br>A new substance with new properties formed, so cooking the pancake is a chemical change."}, {"type": "mcq", "tag": "fluency", "stem": "A cardboard box is flattened for recycling. Which kind of change is this?", "options": ["physical change", "chemical change"], "key": 0, "fb": ["The flat sheet is still cardboard; only the shape changed.", "Flattening changes the shape only: the box is still cardboard."], "why": "Ask: did a new substance form?<br>The flattened box is still cardboard.<br>No new substance formed, so flattening is a physical change."}, {"type": "mcq", "tag": "what", "stem": "Iron bends without breaking. The orange flakes on a rusted nail crumble. What does this difference tell you?", "options": ["The flakes are iron rolled out into a thinner shape.", "The flakes are a different substance from iron.", "The flakes are iron that has cooled down."], "key": 1, "fb": ["Thin iron still bends without breaking; the crumbling flakes are a different substance.", "A different property means a different substance: the flakes are not iron.", "Cold iron still bends without breaking; the crumbling flakes are a different substance."], "why": "A thinner or a colder piece of iron still bends without breaking.<br>The flakes crumble instead.<br>A different property means a different substance, so the flakes are not iron."}, {"type": "mcq", "tag": "misconception", "stem": "Harper says: \"Rust is just iron with some oxygen stuck on top, so the flakes are still iron.\" Is Harper correct?", "options": ["yes", "no"], "key": 1, "fb": ["Iron atoms joined with oxygen atoms into new particles. The new particles have new properties, so rust is a different substance.", "Iron atoms joined with oxygen atoms into new particles. The new particles have new properties, so rust is a different substance."], "why": "If oxygen only sat among the iron atoms, the iron would still be iron.<br>In rust the iron atoms are joined to oxygen atoms in new particles.<br>New particles have new properties, so rust is a different substance and Harper is not correct."}, {"type": "text", "tag": "term", "stem": "A change in which a new substance forms, with its own properties, is called a…", "accept": ["chemical change", "a chemical change", "chemical"], "why": "A change in which a new substance forms is called a chemical change.<br>The new substance has its own properties, different from the substance you started with."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video ended on the nail. What did it say the iron atoms did?", "options": ["They stayed iron, with oxygen sitting on top of them.", "They melted into orange flakes.", "They joined with oxygen atoms and made rust."], "key": 2, "fb": ["If oxygen only sat among the iron atoms, the iron would still be iron.", "Nothing melted; the atoms joined into new particles.", "Iron atoms joined with oxygen atoms: particles of a new substance, rust."], "why": "The air holds oxygen.<br>Iron atoms in the nail joined with oxygen atoms.<br>The joined atoms make particles of a new substance, rust."}]}, {"id": "L03", "atom": "MAT-064", "title": "The signs of a chemical change", "video": "definitely a video", "lesson_type": "Concept-introduction lesson (a fact with its picture): five things you can see or feel that say a chemical change may have happened; coins precipitate; one caveat, clue not proof", "check_design": "Type (c) on a fact, repeated back → one recall MCQ (L02: a damp steel scouring pad turning orange and crumbly is the change that forms a new substance), the term's meaning as an MCQ (the coined term itself typed LAST, moved 2026-09-25 after the second blind read so no stem or option above it prints or defines the term), one typed sign from its cue (bubbles or fizz: a gas forming), two list items (which is NOT a sign; which IS a sign), six yes / no items on fresh scenes (is this one of the five signs? keys y y n n y n, no four alternating, 3 / 3), and one student-claim misconception (Kofi: bubbles prove a chemical change; key no). 13 items.", "headache": ["You cannot see atoms join into new particles.", "Yet a cook, a mechanic and a doctor all spot chemical changes every day without a lab.", "A spoon of baking soda meets vinegar and fizzes.", "A match burns with a yellow flame and warms your fingers.", "A cut apple turns brown.", "Two clear liquids poured together go cloudy as a white solid appears.", "What do these scenes have in common?"], "forest": ["What signs tell you a chemical change may have happened?", "Five signs are worth watching for: a color change; a gas forming; a solid forming from two liquids, called a precipitate; a temperature change; light given out.", "Each sign is a clue, not proof, because each can appear without a chemical change."], "article": [{"t": "idea", "text": "You cannot see atoms join into new particles."}, {"t": "idea", "text": "Yet a cook, a mechanic and a doctor all spot chemical changes every day without a lab."}, {"t": "idea", "text": "A spoon of baking soda meets vinegar and fizzes."}, {"t": "idea", "text": "A match burns with a yellow flame and warms your fingers."}, {"t": "idea", "text": "A cut apple turns brown."}, {"t": "idea", "text": "Two clear liquids poured together go cloudy as a white solid appears."}, {"t": "idea", "text": "What do these scenes have in common?"}, {"t": "h", "text": "Five things you can see or feel"}, {"t": "idea", "text": "In each scene a chemical change happened, and something you could notice changed with it."}, {"t": "idea", "text": "When an apple is cut, the white flesh turns brown: a color change."}, {"t": "idea", "text": "When baking soda drops into vinegar, bubbles pour off: a gas forming."}, {"t": "idea", "text": "When two clear liquids are poured together, a white solid appears: a solid forming."}, {"t": "idea", "text": "A solid that forms when two liquids meet is called a <b>precipitate<\/b>."}, {"t": "idea", "text": "When a match is struck, the flame warms your fingers: a temperature change."}, {"t": "idea", "text": "The match burns with a yellow flame: light given out."}, {"t": "fig", "key": "five_signs", "cap": "The five signs, one panel each, with the sign named under its picture: a color change, a gas forming, a solid forming, a temperature change, light given out."}, {"t": "h", "text": "The five signs together"}, {"t": "idea", "text": "Five signs tell you a chemical change may have happened."}, {"t": "idea", "text": "The first sign is a color change."}, {"t": "idea", "text": "The second sign is a gas forming, seen as bubbles or fizz."}, {"t": "idea", "text": "The third sign is a solid forming when two liquids meet: a precipitate."}, {"t": "idea", "text": "The fourth sign is a temperature change: the mixture gets warmer or colder on its own."}, {"t": "idea", "text": "The fifth sign is light given out."}, {"t": "fig", "key": "signs_table", "cap": "The five signs as a numbered list, one everyday example each. Under the table: each sign is a clue, not proof."}, {"t": "h", "text": "A clue, not proof"}, {"t": "idea", "text": "Each sign is a clue, not proof."}, {"t": "idea", "text": "Water boiling in a pan makes bubbles."}, {"t": "idea", "text": "Yet boiling is a physical change: the bubbles are water as a gas."}, {"t": "idea", "text": "Salt dissolving in water can make the water a little colder, yet dissolving is a physical change."}, {"t": "idea", "text": "Blue and yellow paint mixed together make green, yet no new substance formed."}, {"t": "idea", "text": "So a sign tells you to look closer; it does not settle the question."}, {"t": "idea", "text": "Some tests also list a new smell as a clue, and a smell is a clue in the same way."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Five signs tell you a chemical change may have happened: a color change, a gas forming, a solid forming from two liquids (a precipitate), a temperature change, and light given out. Each sign is a clue, not proof."}, {"t": "idea", "text": "Back to the four scenes: each shows one or two of the five signs."}, {"t": "idea", "text": "The cook, the mechanic and the doctor watch for these signs, then look closer."}], "script": [{"say": "You cannot see atoms join into new particles.", "screen": "[a rust box; a magnifier finds nothing to watch]"}, {"say": "Yet a cook, a mechanic and a doctor spot chemical changes every day without a lab.", "screen": "[three people at work]"}, {"say": "A spoon of baking soda meets vinegar and fizzes.", "screen": "[a beaker fizzes]"}, {"say": "A match burns with a yellow flame and warms your fingers.", "screen": "[a match flares]"}, {"say": "A cut apple turns brown.", "screen": "[an apple browns]"}, {"say": "Two clear liquids poured together go cloudy as a white solid appears.", "screen": "[two liquids go cloudy]"}, {"say": "What do these scenes have in common?", "screen": "[the four scenes; question mark]"}, {"say": "In each, a chemical change happened, and something you could notice changed.", "screen": "[the four scenes ringed]"}, {"say": "The apple turned brown: a color change.", "screen": "[icon: color; label A COLOR CHANGE]"}, {"say": "Bubbles poured off the vinegar: a gas forming.", "screen": "[icon: gas; label A GAS FORMING]"}, {"say": "A white solid appeared where two liquids met: a solid forming, called a precipitate.", "screen": "[icon: solid; label A SOLID FORMING; chip: PRECIPITATE]"}, {"say": "The match warmed your fingers: a temperature change.", "screen": "[icon: temperature; label A TEMPERATURE CHANGE]"}, {"say": "And the match burned with a flame: light given out.", "screen": "[icon: light; label LIGHT GIVEN OUT]"}, {"say": "Five signs tell you a chemical change may have happened.", "screen": "[five_signs, the five panels in a row]"}, {"say": "Each sign is a clue, not proof: boiling water bubbles too, and boiling is a physical change.", "screen": "[a pan boils; label A CLUE, NOT PROOF]"}, {"say": "So here is the rule: five signs, five clues, not proof.", "screen": "[rule slide reuses the five panels; rule text]"}, {"say": "Back to the cook, the mechanic and the doctor: they watch for these five signs, then look closer.", "screen": "[the three people; the five icons]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which of these changes forms a new substance?", "options": ["a damp steel scouring pad turning orange and crumbly", "a spoonful of strawberry jam dissolving in a mug of hot tea", "a wooden plank sawn in half"], "key": 0, "fb": ["Steel is gray and firm; the orange, crumbly patches are ooling the mixture.", "The stove warmed the soup. The sign is a temperature change on its own, with nothing heating or cooling the mixture."], "why": "The stove heated the soup, so the soup got warm.<br>The sign is a temperature change on its own, with nothing heating or cooling the mixture.<br>Warming from a stove is not one of the five signs: no."}, {"type": "mcq", "tag": "fluency", "stem": "A spoon of honey stirred into warm milk vanishes. Is this one of the five signs?", "options": ["yes", "no"], "key": 1, "fb": ["The honey dissolved and spread through the milk; nothing changed color, no gas or solid formed, nothing warmed on its own or glowed.", "The honey dissolved and spread through the milk; nothing changed color, no gas or solid formed, nothing warmed on its own or glowed."], "why": "Dissolving spread the honey's particles through the milk.<br>Nothing changed color, no gas or solid formed, nothing warmed on its own or glowed.<br>Dissolving is not one of the five signs: no."}, {"type": "mcq", "tag": "fluency", "stem": "Yellow grains settle out where two clear liquids were mixed. Is this one of the five signs?", "options": ["yes", "no"], "key": 0, "fb": ["A solid forming where two liquids meet, a precipitate, is one of the five signs.", "The yellow grains are a solid that formed where two liquids met: a precipitate, one of the five signs."], "why": "Two clear liquids met, and yellow grains, a solid, appeared.<br>A solid forming when two liquids meet is a precipitate.<br>A precipitate is one of the five signs: yes."}, {"type": "mcq", "tag": "fluency", "stem": "An ice cube in a glass melts into a puddle. Is this one of the five signs?", "options": ["yes", "no"], "key": 1, "fb": ["Melting is a change of state; nothing changed color, no gas or solid formed, nothing warmed on its own or glowed.", "Melting is a change of state; nothing changed color, no gas or solid formed, nothing warmed on its own or glowed."], "why": "The ice melted: a solid became a liquid, a c
