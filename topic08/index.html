: "h", "text": "The three kinds, again"}, {"t": "idea", "text": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons."}, {"t": "idea", "text": "Protons are the filled circles marked plus, neutrons the open circles, electrons the small dark dots marked minus."}, {"t": "h", "text": "The middle of the atom"}, {"t": "idea", "text": "Look at the middle of the drawing."}, {"t": "idea", "text": "The protons and the neutrons sit packed together there."}, {"t": "idea", "text": "This tiny packed center of the atom is called the <b>nucleus<\/b>."}, {"t": "idea", "text": "Every proton and every neutron in the atom sits in the nucleus."}, {"t": "h", "text": "The outside of the atom"}, {"t": "idea", "text": "Now look at the rings."}, {"t": "idea", "text": "The electrons sit on the rings, around the outside of the nucleus."}, {"t": "idea", "text": "Electrons move around the outside of the nucleus."}, {"t": "idea", "text": "Electrons are never inside the nucleus."}, {"t": "fig", "key": "lithium_labeled", "cap": "The same lithium atom, labeled. The dashed ring marks the nucleus: 3 protons and 4 neutrons packed together. The 3 electrons sit on the rings, outside the nucleus."}, {"t": "h", "text": "What the marks mean: charge"}, {"t": "idea", "text": "When you pull a wool sweater off over your head, your hair stands on end."}, {"t": "idea", "text": "The rubbing gave the sweater and your hair a charge."}, {"t": "idea", "text": "A <b>charge<\/b> is something a thing carries that makes it pull on, or push away, other charged things."}, {"t": "idea", "text": "There are two kinds of charge, called <b>positive<\/b> and <b>negative<\/b>."}, {"t": "idea", "text": "One positive charge and one negative charge cancel each other out."}, {"t": "idea", "text": "Together they add up to no charge at all."}, {"t": "h", "text": "The charge on each particle"}, {"t": "idea", "text": "Each proton carries a positive charge: that is what its plus mark means."}, {"t": "idea", "text": "Each electron carries a negative charge: that is what its minus mark means."}, {"t": "idea", "text": "A neutron carries no charge at all: that is why it has no mark."}, {"t": "fig", "key": "particle_table", "cap": "The three particles: how each is drawn, the charge it carries, and where it sits."}, {"t": "h", "text": "A model, not a photograph"}, {"t": "idea", "text": "The drawing is a model, not a photograph."}, {"t": "idea", "text": "The real atom is mostly empty space."}, {"t": "idea", "text": "Nothing is drawn to scale."}, {"t": "idea", "text": "The electrons do not run on tracks."}, {"t": "idea", "text": "The rings only show that the electrons stay around the outside."}, {"t": "idea", "text": "In these drawings the inner ring holds at most 2 electrons; the rest sit on the outer ring."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider an atom of boron."}, {"t": "idea", "text": "Its 5 protons and 6 neutrons sit packed in the nucleus."}, {"t": "idea", "text": "Its 5 electrons sit on the rings around the outside."}, {"t": "idea", "text": "The protons are positive, the electrons are negative, and the neutrons carry no charge."}, {"t": "fig", "key": "boron_inside", "cap": "An atom of boron, drawn the same way: 5 protons and 6 neutrons in the nucleus; 5 electrons outside it."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Protons and neutrons sit together in a tiny center called the nucleus. Protons carry a positive charge; neutrons carry no charge. Electrons move around the outside of the nucleus and carry a negative charge."}, {"t": "idea", "text": "Back to the lithium atom: the protons and neutrons packed in the middle are its nucleus."}, {"t": "idea", "text": "The dots on the rings are its electrons, negative, moving around the outside."}], "script": [{"say": "Here is the inside of a lithium atom, a soft, silvery metal.", "screen": "[the lithium drawing builds: rings, then the cluster, then the dots]"}, {"say": "Some particles sit packed in the middle.", "screen": "[the middle highlighted]"}, {"say": "Others sit out on the rings.", "screen": "[the rings highlighted]"}, {"say": "Some carry a plus mark, some a minus, some none. Which sits where, and what do the marks mean?", "screen": "[the marks flash; question mark]"}, {"say": "In the middle, the protons and the neutrons sit packed together.", "screen": "[the cluster grows: 3 filled, 4 open]"}, {"say": "This tiny packed center of the atom is called the nucleus.", "screen": "[a dashed ring round the cluster; chip: NUCLEUS]"}, {"say": "The electrons sit on the rings, outside the nucleus, never inside it.", "screen": "[the 3 dots appear on the rings; label ELECTRONS, OUTSIDE]"}, {"say": "Pull a wool sweater off, and your hair stands on end: rubbing gave it a charge.", "screen": "[a sweater comes off; hair stands up; chip: CHARGE]"}, {"say": "Charge comes in two kinds, positive and negative, and one of each cancels the other.", "screen": "[a + and a − slide together and fade]"}, {"say": "Each proton carries a positive charge: that is its plus mark.", "screen": "[a proton enlarged, its + glows]"}, {"say": "Each electron carries a negative charge.", "screen": "[a dot with its −]"}, {"say": "A neutron carries no charge at all.", "screen": "[an open circle with nothing]"}, {"say": "The drawing is a model: the real atom is mostly empty space, and electrons do not run on tracks.", "screen": "[the rings fade to faint; label MODEL]"}, {"say": "So here is the rule: protons and neutrons sit in the nucleus, protons positive, neutrons with no charge; electrons, negative, move around the outside.", "screen": "[rule slide reuses the labeled lithium atom; rule text]"}, {"say": "Back to the lithium atom: the packed middle is its nucleus, the dots its electrons.", "screen": "[the labeled drawing]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which of these is one of the three kinds of particle found inside every atom?", "options": ["a molecule", "a neutron", "an element"], "key": 1, "fb": ["A molecule is two or more atoms joined; it is not inside an atom.", "Every atom contains protons, neutrons and electrons.", "An element is a substance made of one kind of atom; it is not a particle inside an atom."], "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>A neutron is one of the three.<br>A molecule and an element are made of atoms, not found inside one."}, {"type": "text", "tag": "term", "stem": "The tiny packed center of an atom, where the protons and neutrons sit, is called the…", "accept": ["nucleus", "the nucleus", "a nucleus"], "why": "The tiny packed center of an atom is called the nucleus.<br>Every proton and every neutron in the atom sits in it."}, {"type": "mcq", "tag": "term", "stem": "What is the nucleus of an atom?", "options": ["the packed middle, holding protons and neutrons", "the outer ring that the electrons move around on", "the whole atom, its particles and its empty space"], "key": 0, "fb": ["The nucleus is the tiny packed center where the protons and neutrons sit.", "The electrons move around the outside of the nucleus; the ring is not the nucleus.", "The nucleus is only the tiny packed center, not the whole atom."], "why": "Protons and neutrons sit packed together in a tiny center.<br>That tiny packed center is called the nucleus.<br>The electrons move around the outside of it."}, {"type": "mcq", "tag": "fluency", "stem": "Which charge does a proton carry?", "options": ["positive", "negative", "none"], "key": 0, "fb": ["A proton carries a positive charge: that is what its plus mark means.", "An electron carries the negative charge; a proton carries a positive charge.", "A neutron carries no charge; a proton carries a positive charge."], "why": "Each proton is drawn with a plus mark.<br>The plus mark means a positive charge.<br>So a proton carries a positive charge."}, {"type": "mcq", "tag": "fluency", "stem": "Where in an atom do the neutrons sit?", "options": ["in the nucleus", "on the rings, outside the nucleus"], "key": 0, "fb": ["Protons and neutrons sit packed together in the nucleus.", "The electrons sit on the rings; the neutrons sit in the nucleus with the protons."], "why": "Protons and neutrons sit packed together in the tiny center.<br>That center is the nucleus.<br>So the neutrons sit in the nucleus."}, {"type": "mcq", "tag": "fluency", "stem": "Which charge does an electron carry?", "options": ["positive", "negative", "none"], "key": 1, "fb": ["A proton carries the positive charge; an electron carries a negative charge.", "An electron carries a negative charge: that is what its minus mark means.", "A neutron carries no charge; an electron carries a negative charge."], "why": "Each electron is drawn with a minus mark.<br>The minus mark means a negative charge.<br>So an electron carries a negative charge."}, {"type": "mcq", "tag": "fluency", "stem": "Where in an atom do the protons sit?", "options": ["in the nucleus", "on the rings, outside the nucleus"], "key": 0, "fb": ["Protons sit packed in the nucleus with the neutrons.", "The electrons sit on the rings; the protons sit in the nucleus."], "why": "Protons and neutrons sit packed together in the tiny center.<br>That center is the nucleus.<br>So the protons sit in the nucleus."}, {"type": "mcq", "tag": "fluency", "stem": "Which charge does a neutron carry?", "options": ["positive", "negative", "none"], "key": 2, "fb": ["A proton carries the positive charge; a neutron carries none.", "An electron carries the negative charge; a neutron carries none.", "A neutron carries no charge at all: that is why it has no mark."], "why": "A neutron is drawn as an open circle with no mark.<br>No mark means no charge.<br>So a neutron carries no charge."}, {"type": "mcq", "tag": "fluency", "stem": "Where in an atom do the electrons sit?", "options": ["in the nucleus", "on the rings, outside the nucleus"], "key": 1, "fb": ["Only protons and neutrons sit in the nucleus; the electrons sit outside it.", "The electrons sit on the rings, around the outside of the nucleus."], "why": "Electrons move around the outside of the nucleus.<br>The drawing puts them on the rings.<br>So the electrons sit on the rings, outside the nucleus."}, {"type": "mcq", "tag": "fluency", "fig": "w_f1", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. Which kind of particle in this drawing sits outside the packed middle?", "options": ["the electrons", "the neutrons", "the protons"], "key": 0, "fb": ["The two small dark dots sit out on the ring: electrons, outside the nucleus.", "The two open circles sit in the packed middle: neutrons, in the nucleus.", "The two filled circles marked plus sit in the packed middle: protons, in the nucleus."], "why": "The packed middle is the nucleus, and it holds the filled circles and the open circles: protons and neutrons.<br>The small dark dots sit out on the ring.<br>Small dark dots are electrons, so the electrons sit outside the nucleus."}, {"type": "mcq", "tag": "fluency", "fig": "w_f2", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. Which kinds of particle in this drawing sit inside the packed middle?", "options": ["protons and electrons", "electrons only", "protons and neutrons"], "key": 2, "fb": ["The small dark dots, the electrons, sit out on the rings, not in the middle.", "The dots on the rings are the electrons; the packed middle holds protons and neutrons.", "The packed middle holds the filled circles marked plus and the open circles: protons and neutrons."], "why": "The packed middle is the nucleus.<br>It holds filled circles marked plus and open circles: protons and neutrons.<br>The small dark dots, the electrons, sit on the rings outside it."}, {"type": "mcq", "tag": "misconception", "stem": "Elodie says: \"The electrons sit in the nucleus, packed in with the protons.\" Is Elodie correct?", "options": ["yes", "no"], "key": 1, "fb": ["The nucleus is packed, but only with protons and neutrons. The electrons move around the outside of it.", "Only protons and neutrons sit in the nucleus. The electrons move around the outside of it."], "why": "The nucleus is the packed center that holds the protons and the neutrons.<br>The electrons move around the outside of the nucleus, never inside it.<br>So Elodie is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The video ringed the packed middle of the lithium atom. What did it call that packed middle?", "options": ["the electron", "the charge", "the nucleus"], "key": 2, "fb": ["An electron is one of the dots on the rings, outside the middle.", "A charge is what a proton or an electron carries, not a place in the atom.", "The tiny packed center, holding the protons and neutrons, is called the nucleus."], "why": "Protons and neutrons sit packed together in the middle of the atom.<br>That tiny packed center is called the nucleus.<br>The electrons move around the outside of it."}]}, {"id": "L03", "atom": "MAT-051", "title": "The proton count names the element", "video": "could do without a video", "lesson_type": "Fact lesson with a one-step lookup routine: count the protons, find the number in the supplied table, read off the element; no term coined", "check_design": "Type (a) one-step routine → one recall MCQ (L02: where the protons sit), then a fluency run of eight lookups with the table given every time and the drawing varied (five drawn atoms to count: helium, oxygen, lithium, fluorine, beryllium; three proton counts given under the table: 5, 10, 7), typed where the name is short (helium, oxygen, neon, nitrogen) and three-option MCQs where it is not (boron, lithium, fluorine, beryllium; keys 0 2 1 1), two reverse lookups typed (oxygen: 8; helium: 2), and two student-claim items: Suki adds the neutrons before the lookup (3 protons and 4 neutrons make nitrogen; key no) and Noor keeps them out (6 protons and 7 neutrons: this atom is carbon; key YES — the topic's true named claim in a lesson). 13 items.", "headache": ["Two atoms are drawn side by side.", "The two drawings look almost the same.", "The left atom is carbon, the black soot on a burnt match.", "The right atom is nitrogen, the gas that makes up most of the air.", "Something inside told them apart.", "What was it?"], "forest": ["What decides which element an atom is?", "The number of protons.", "Every atom with 6 protons is carbon.", "Every atom with 7 protons is nitrogen.", "Count the protons, find the number in the table, and read off the element."], "article": [{"t": "idea", "text": "Two atoms are drawn side by side."}, {"t": "fig", "key": "two_atoms_l03", "cap": "Two atoms, drawn the same way. Nothing is written under either atom yet."}, {"t": "idea", "text": "The two drawings look almost the same."}, {"t": "idea", "text": "The left atom is carbon, the black soot on a burnt match."}, {"t": "idea", "text": "The right atom is nitrogen, the gas that makes up most of the air."}, {"t": "idea", "text": "Something inside told them apart."}, {"t": "idea", "text": "What was it?"}, {"t": "h", "text": "The nucleus, again"}, {"t": "idea", "text": "Protons and neutrons sit packed together in the nucleus."}, {"t": "idea", "text": "Each proton carries a positive charge."}, {"t": "idea", "text": "Each proton is drawn as a filled circle marked plus."}, {"t": "h", "text": "Count the protons"}, {"t": "idea", "text": "Count the protons in the left atom: 6."}, {"t": "idea", "text": "Every atom with 6 protons is a carbon atom, wherever it is."}, {"t": "idea", "text": "Count the protons in the right atom: 7."}, {"t": "idea", "text": "Every atom with 7 protons is a nitrogen atom."}, {"t": "fig", "key": "two_atoms_counted", "cap": "The same two atoms with the protons counted. The atom on the left has 6 protons in its nucleus; the atom on the right has 7 protons."}, {"t": "idea", "text": "The number of protons decides which element an atom is."}, {"t": "idea", "text": "The number of neutrons does not decide it."}, {"t": "idea", "text": "The size of the drawing does not decide it."}, {"t": "h", "text": "The table"}, {"t": "idea", "text": "Scientists have counted the protons in every kind of atom."}, {"t": "idea", "text": "Here are the first ten elements, from 1 proton to 10 protons."}, {"t": "fig", "key": "element_table", "cap": "The first ten elements and the number of protons in each atom of them. This table is given every time it is needed."}, {"t": "idea", "text": "Find the proton count in the table, and read off the element beside it."}, {"t": "idea", "text": "An atom with 8 protons is oxygen."}, {"t": "idea", "text": "An atom with 2 protons is helium."}, {"t": "h", "text": "The table works backwards too"}, {"t": "idea", "text": "Start from the element, and read off the proton count."}, {"t": "idea", "text": "Oxygen: the table says 8, so every oxygen atom has 8 protons."}, {"t": "idea", "text": "Neon: the table says 10, so every neon atom has 10 protons."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider three more atoms, drawn the same way."}, {"t": "idea", "text": "The first has 4 protons: the table says beryllium."}, {"t": "idea", "text": "The second has 9 protons: the table says fluorine."}, {"t": "idea", "text": "The third has 2 protons: the table says helium."}, {"t": "fig", "key": "three_named_l03", "cap": "Three atoms with the element read off from the proton count: 4 protons is beryllium, 9 protons is fluorine, 2 protons is helium."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The number of protons decides which element an atom is. Count the protons, find that number in the table, and read off the element."}, {"t": "idea", "text": "Back to the two atoms: 6 protons make the left one carbon, and 7 protons make the right one nitrogen."}, {"t": "idea", "text": "The proton count told them apart."}], "script": [{"say": "Two atoms are drawn side by side.", "screen": "[the two atoms, unlabeled]"}, {"say": "The two drawings look almost the same.", "screen": "[the two drawings side by side]"}, {"say": "The left atom is carbon, the soot on a burnt match.", "screen": "[a burnt match; label CARBON under the left atom]"}, {"say": "The right atom is nitrogen, the gas that makes up most of the air.", "screen": "[the sky; label NITROGEN under the right atom]"}, {"say": "Something inside told them apart. What was it?", "screen": "[question mark between the atoms]"}, {"say": "Count the protons in the left atom: 6. Every atom with 6 protons is a carbon atom.", "screen": "[the six protons counted off; label CARBON]"}, {"say": "Count the protons in the right atom: 7. Every atom with 7 protons is a nitrogen atom.", "screen": "[the seven protons counted off; label NITROGEN]"}, {"say": "The number of protons decides which element an atom is; the neutrons do not decide it.", "screen": "[chip: PROTON COUNT DECIDES THE ELEMENT]"}, {"say": "Here are the first ten elements, from 1 proton to 10.", "screen": "[the ten-row table slides in]"}, {"say": "Find the count in the table and read off the element: 8 protons is oxygen.", "screen": "[row 8 highlighted]"}, {"say": "The table works backwards too: oxygen, 8, so every oxygen atom has 8 protons.", "screen": "[row 8 read right to left]"}, {"say": "Three more: 4 protons is beryllium, 9 protons is fluorine, 2 protons is helium.", "screen": "[the three atoms with their names]"}, {"say": "So here is the rule: the number of protons decides the element; count them, find the number in the table, read off the element.", "screen": "[rule slide reuses the two atoms and the table; rule text]"}, {"say": "Back to the two atoms: 6 protons make carbon, 7 protons make nitrogen; the proton count told them apart.", "screen": "[the two atoms, labeled]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "In which part of an atom do the protons sit?", "options": ["in the nucleus", "on the rings, outside the nucleus"], "key": 0, "fb": ["Protons and neutrons sit packed together in the nucleus.", "The electrons sit on the rings; the protons sit in the nucleus."], "why": "Protons and neutrons sit packed together in the tiny center of the atom.<br>That center is the nucleus.<br>So the protons sit in the nucleus."}, {"type": "text", "tag": "fluency", "fig": "e_f1", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "accept": ["helium"], "why": "Count the filled circles marked plus: 2 protons.<br>Find 2 in the table: helium.<br>So the atom is helium."}, {"type": "mcq", "tag": "fluency", "fig": "e_f2", "stem": "The table gives the first ten elements and their proton counts. Under it is one atom's proton count: which element is that atom?", "options": ["boron", "carbon", "beryllium"], "key": 0, "fb": ["5 protons: the table says boron.", "Carbon has 6 protons; this atom has 5.", "Beryllium has 4 protons; this atom has 5."], "why": "The atom has 5 protons.<br>Find 5 in the table: boron.<br>So the atom is boron."}, {"type": "text", "tag": "fluency", "fig": "e_f3", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "accept": ["oxygen"], "why": "Count the filled circles marked plus: 8 protons.<br>Find 8 in the table: oxygen.<br>So the atom is oxygen."}, {"type": "text", "tag": "fluency", "fig": "e_f4", "stem": "The table gives the first ten elements and their proton counts. Under it is one atom's proton count: which element is that atom?", "accept": ["neon"], "why": "The atom has 10 protons.<br>Find 10 in the table: neon.<br>So the atom is neon."}, {"type": "mcq", "tag": "fluency", "fig": "e_f5", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["helium", "beryllium", "lithium"], "key": 2, "fb": ["Helium has 2 protons; this atom has 3 filled circles marked plus.", "Beryllium has 4 protons; this atom has 3 filled circles marked plus. The open circles are neutrons, and they do not decide the element.", "3 protons: the table says lithium."], "why": "Count only the filled circles marked plus: 3 protons.<br>The 4 open circles are neutrons, and they do not decide the element.<br>Find 3 in the table: lithium."}, {"type": "text", "tag": "fluency", "fig": "e_f6", "stem": "The table gives the first ten elements and their proton counts. Under it is one atom's proton count: which element is that atom?", "accept": ["nitrogen"], "why": "The atom has 7 protons.<br>Find 7 in the table: nitrogen.<br>So the atom is nitrogen."}, {"type": "mcq", "tag": "fluency", "fig": "e_f7", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["oxygen", "fluorine", "neon"], "key": 1, "fb": ["Oxygen has 8 protons; this atom has 9 filled circles marked plus.", "9 protons: the table says fluorine.", "Neon has 10 protons; this atom has 9 filled circles marked plus. The open circles are neutrons and do not decide the element."], "why": "Count only the filled circles marked plus: 9 protons.<br>The 10 open circles are neutrons, and they do not decide the element.<br>Find 9 in the table: fluorine."}, {"type": "mcq", "tag": "fluency", "fig": "e_f8", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["boron", "beryllium", "lithium"], "key": 1, "fb": ["Boron has 5 protons; this atom has 4 filled circles marked plus. The open circles are neutrons and do not decide the element.", "4 protons: the table says beryllium.", "Lithium has 3 protons; this atom has 4 filled circles marked plus."], "why": "Count only the filled circles marked plus: 4 protons.<br>The 5 open circles are neutrons, and they do not decide the element.<br>Find 4 in the table: beryllium."}, {"type": "text", "tag": "fluency", "fig": "e_r1", "stem": "The table gives the first ten elements and their proton counts. How many protons does every atom of oxygen have?", "accept": ["8", "8 protons", "eight"], "why": "Find oxygen in the table.<br>The table says 8.<br>So every oxygen atom has 8 protons."}, {"type": "text", "tag": "fluency", "fig": "e_r2", "stem": "The table gives the first ten elements and their proton counts. How many protons does every atom of helium have?", "accept": ["2", "2 protons", "two"], "why": "Find helium in the table.<br>The table says 2.<br>So every helium atom has 2 protons."}, {"type": "mcq", "tag": "misconception", "fig": "element_table", "stem": "The table gives the first ten elements and their proton counts. Suki looks at an atom with 3 protons and 4 neutrons. She says: \"3 protons and 4 neutrons make 7 particles, so this atom is nitrogen.\" Is Suki correct?", "options": ["yes", "no"], "key": 1, "fb": ["Adding the neutrons in is the slip. Only the proton count decides the element: 3 protons, so the table says lithium.", "Only the proton count decides the element. The atom has 3 protons, so the table says lithium; the neutrons do not decide it."], "why": "The number of protons decides which element an atom is.<br>The neutrons do not decide it, so the 4 neutrons are not added in.<br>The atom has 3 protons, so the table says lithium, and Suki is not correct."}, {"type": "mcq", "tag": "misconception", "fig": "e_noor", "stem": "The table gives the first ten elements and their proton counts. Noor looks at an atom with 6 protons and 7 neutrons. She says: \"This atom is carbon.\" Is Noor correct?", "options": ["yes", "no"], "key": 0, "fb": ["Only the proton count decides the element, and 6 protons is carbon. The 7 neutrons do not change that.", "The 7 neutrons do not change the element. Only the proton count decides it, and 6 protons is carbon."], "why": "The number of protons decides which element an atom is.<br>The atom has 6 protons, and the table says carbon.<br>The neutrons do not decide it, so Noor is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The two atoms looked almost the same, but one was carbon and one was nitrogen. What told them apart, according to the video?", "options": ["the number of protons", "the number of neutrons", "the size of the drawing"], "key": 0, "fb": ["The number of protons decides which element an atom is: 6 was carbon, 7 was nitrogen.", "The video said the neutrons do not decide the element.", "The two drawings were the same size; the proton count told them apart."], "why": "The number of protons decides which element an atom is.<br>The left atom had 6 protons: carbon.<br>The right atom had 7 protons: nitrogen."}]}, {"id": "L04", "atom": "MAT-051b", "title": "Change the proton count, change the element", "video": "definitely a video", "lesson_type": "Concept lesson (what, then why): a proton added to or taken from the nucleus changes the proton count, so the atom becomes a different element; a neutron added does not; no term coined", "check_design": "Type (c) concept understanding → one recall MCQ (L03: a drawn atom with 3 protons, table given, is lithium), the what (a drawn nitrogen atom loses one proton: which element now; table given), the why as free response on a fresh case (a boron atom gains one proton), a reason MCQ (why taking a proton out of a neon atom makes a different element), the misconception (Levi: adding a neutron to a fluorine atom makes a different element; key no), a bare boundary item (an oxygen atom gains one neutron: still oxygen), two transfers on drawn changes (a carbon atom gains two protons: oxygen; a fluorine atom gains one proton: neon — the +1 case is a nucleus that lasts, accuracy row 7), a which-change item (the electron-count distractor), and a typed count (from 4 protons to oxygen: add 4). 10 items.", "headache": ["Imagine a carbon atom: 6 protons in its nucleus.", "Now imagine one more proton is pushed into that nucleus.", "The atom now has 7 protons.", "Is it still carbon?"], "forest": ["Why does adding or removing a proton change the element?", "The number of protons is what makes an atom the element it is.", "Add one proton to carbon's 6, and the atom has 7.", "An atom with 7 protons is nitrogen, not carbon.", "Change the proton count, and you have a different element."], "article": [{"t": "idea", "text": "Imagine a carbon atom: 6 protons in its nucleus."}, {"t": "idea", "text": "Now imagine one more proton is pushed into that nucleus."}, {"t": "idea", "text": "The atom now has 7 protons."}, {"t": "idea", "text": "Is it still carbon?"}, {"t": "h", "text": "The proton count, again"}, {"t": "idea", "text": "The number of protons decides which element an atom is."}, {"t": "idea", "text": "Every atom with 6 protons is carbon, and every atom with 7 protons is nitrogen."}, {"t": "h", "text": "Add one proton"}, {"t": "idea", "text": "Here is the carbon atom: 6 protons."}, {"t": "idea", "text": "One proton is pushed into the nucleus."}, {"t": "idea", "text": "Now the nucleus holds 7 protons."}, {"t": "idea", "text": "Find 7 in the table: nitrogen."}, {"t": "idea", "text": "So the atom is now a nitrogen atom, not a carbon atom."}, {"t": "fig", "key": "carbon_to_nitrogen", "cap": "Before: a carbon atom with 6 protons. One proton is added to the nucleus. After: 7 protons, so the atom is nitrogen."}, {"t": "h", "text": "Why the element changes"}, {"t": "idea", "text": "The number of protons is what makes an atom the element it is."}, {"t": "idea", "text": "Carbon means 6 protons."}, {"t": "idea", "text": "An atom with any other count is not carbon."}, {"t": "idea", "text": "Find 7 protons in the table: the row says nitrogen, not carbon."}, {"t": "idea", "text": "If the proton count changes, the element changes."}, {"t": "h", "text": "Take one proton away"}, {"t": "idea", "text": "Now consider an oxygen atom: 8 protons."}, {"t": "idea", "text": "Imagine one proton is taken out of its nucleus."}, {"t": "idea", "text": "Now the nucleus holds 7 protons."}, {"t": "idea", "text": "An atom with 7 protons is nitrogen."}, {"t": "idea", "text": "So the oxygen atom has become a nitrogen atom."}, {"t": "fig", "key": "oxygen_to_nitrogen", "cap": "Before: an oxygen atom with 8 protons. One proton is taken out of the nucleus. After: 7 protons, so the atom is nitrogen."}, {"t": "h", "text": "A neutron does not do this"}, {"t": "idea", "text": "Now imagine a neutron is added to a carbon atom instead."}, {"t": "idea", "text": "The nucleus holds one more particle, but the proton count is still 6."}, {"t": "idea", "text": "Every atom with 6 protons is carbon."}, {"t": "idea", "text": "So the atom is still carbon."}, {"t": "idea", "text": "Adding a neutron does not change the element."}, {"t": "fig", "key": "carbon_plus_neutron", "cap": "Before: a carbon atom with 6 protons. One neutron is added to the nucleus. After: still 6 protons, so the atom is still carbon."}, {"t": "h", "text": "Where this happens"}, {"t": "idea", "text": "Pushing a proton into a nucleus takes enormous force."}, {"t": "idea", "text": "It happens inside stars."}, {"t": "idea", "text": "It does not happen on a bench, so a carbon atom on a bench stays carbon."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "The number of protons decides which element an atom is. Adding or removing a proton changes the proton count, so the atom becomes a different element. Adding or removing a neutron leaves the element the same."}, {"t": "idea", "text": "Back to the carbon atom with one extra proton: 7 protons make it nitrogen."}, {"t": "idea", "text": "It is not carbon anymore."}], "script": [{"say": "Imagine a carbon atom: 6 protons in its nucleus.", "screen": "[the carbon atom; its six protons counted off]"}, {"say": "Now imagine one more proton is pushed in: 7 protons. Is it still carbon?", "screen": "[a proton slides in; the count reads 7; question mark]"}, {"say": "The number of protons decides which element an atom is: 6 protons is carbon, 7 protons is nitrogen.", "screen": "[the table beside the atom; rows 6 and 7 highlighted]"}, {"say": "Start with the carbon atom, 6 protons, and add one proton to the nucleus.", "screen": "[before drawing; the loose proton with its arrow]"}, {"say": "Count again: 7 protons. Find 7 in the table: nitrogen.", "screen": "[after drawing; the seven protons counted off; row 7 lit]"}, {"say": "So the atom is now a nitrogen atom, not a carbon atom.", "screen": "[the label switches CARBON → NITROGEN]"}, {"say": "Why? Carbon means 6 protons, and the table's row for 7 protons says nitrogen.", "screen": "[chip: PROTON COUNT = THE ELEMENT]"}, {"say": "Now consider an oxygen atom, 8 protons, and take one proton out.", "screen": "[the oxygen atom; a proton drawn out along an arrow]"}, {"say": "Count again: 7 protons, so the oxygen atom has become a nitrogen atom.", "screen": "[the count reads 7; label OXYGEN → NITROGEN]"}, {"say": "Now imagine a neutron is added to a carbon atom instead.", "screen": "[the carbon atom; an open circle slides in]"}, {"say": "The proton count is still 6, so the atom is still carbon.", "screen": "[the six protons counted off; label STILL CARBON]"}, {"say": "That takes enormous force, so it happens inside stars.", "screen": "[a star]"}, {"say": "On a bench, a carbon atom stays carbon.", "screen": "[a bench, label STAYS CARBON]"}, {"say": "So here is the rule: add or remove a proton, and the element changes; add or remove a neutron, and it stays the same.", "screen": "[rule slide reuses the carbon-to-nitrogen pair and the neutron pair; rule text]"}, {"say": "Back to the carbon atom with one extra proton: 7 protons make it nitrogen.", "screen": "[the after drawing, labeled NITROGEN]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "fig": "c_recall", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["beryllium", "lithium", "helium"], "key": 1, "fb": ["Beryllium has 4 protons; this atom has 3 filled circles marked plus.", "3 protons: the table says lithium.", "Helium has 2 protons; this atom has 3 filled circles marked plus."], "why": "Count only the filled circles marked plus: 3 protons.<br>Find 3 in the table: lithium.<br>So the atom is lithium."}, {"type": "mcq", "tag": "what", "fig": "c_what", "stem": "The table gives the first ten elements and their proton counts. This atom has 7 protons, and one proton is taken out of its nucleus. Which element is the atom now?", "options": ["carbon", "nitrogen", "oxygen"], "key": 0, "fb": ["Take one proton from 7 protons: 6 protons, and the table says carbon.", "Nitrogen means 7 protons; the atom now has 6 protons.", "Oxygen means 8 protons; the atom now has 6 protons."], "why": "The atom had 7 protons, and one is taken out: 6 protons.<br>The number of protons decides the element.<br>Find 6 in the table: carbon."}, {"type": "frq", "tag": "why", "task": "A boron atom has 5 protons. One proton is added to its nucleus. Explain why the atom is no longer boron.", "starter": "The number of protons…", "model": "The number of protons decides which element an atom is.<br>Boron means 5 protons.<br>The atom now has 6 protons.<br>Every atom with 6 protons is carbon, so the atom is carbon, not boron.", "points": ["the number of protons decides the element", "the atom now has 6 protons, not 5", "6 protons is carbon (or: is not boron's count)"]}, {"type": "mcq", "tag": "why", "stem": "One proton is taken out of a neon atom. Why is the atom now a different element?", "options": ["The proton count decides the element, and it changed.", "A lighter nucleus always means a different element.", "Losing a particle of any kind from the nucleus changes the element."], "key": 0, "fb": ["The proton count decides the element: 10 protons became 9 protons, a different element's count.", "A nucleus can lose a neutron and stay the same element; only the proton count decides.", "Losing a neutron does not change the element; losing a proton does, because the proton count decides."], "why": "The number of protons decides which element an atom is.<br>The neon atom had 10 protons and now has 9 protons.<br>Every atom with 9 protons is fluorine, so the atom is a different element."}, {"type": "mcq", "tag": "misconception", "stem": "Levi says: \"Add one neutron to a fluorine atom, and it becomes a different element.\" Is Levi correct?", "options": ["yes", "no"], "key": 1, "fb": ["A neutron does not change the element. The atom still has 9 protons, so it is still fluorine.", "Only the proton count decides the element. The atom still has 9 protons, so it is still fluorine."], "why": "The number of protons decides which element an atom is.<br>Adding a neutron leaves the proton count at 9.<br>Every atom with 9 protons is fluorine, so the atom is still fluorine, and Levi is not correct."}, {"type": "mcq", "tag": "what", "fig": "c_neutron", "stem": "The table gives the first ten elements and their proton counts. This atom has 8 protons, and one neutron is added to its nucleus. Which element is the atom now?", "options": ["fluorine", "oxygen", "nitrogen"], "key": 1, "fb": ["Fluorine means 9 protons; the atom still has 8 protons, because a neutron was added, not a proton.", "The proton count is still 8 protons, and 8 protons is oxygen.", "Nitrogen means 7 protons; the atom still has 8 protons."], "why": "A neutron was added, so the proton count did not change: still 8 protons.<br>The number of protons decides the element.<br>Find 8 in the table: oxygen, the same as before."}, {"type": "mcq", "tag": "transfer", "fig": "c_transfer", "stem": "The table gives the first ten elements and their proton counts. This atom has 6 protons, and two protons are added to its nucleus. Which element is the atom now?", "options": ["nitrogen", "oxygen", "carbon"], "key": 1, "fb": ["Nitrogen means 7 protons; the atom gained two protons, so it has 8 protons.", "6 protons and two more make 8 protons, and the table says oxygen.", "Carbon means 6 protons; the atom now has 8 protons."], "why": "The atom had 6 protons, and two are added: 8 protons.<br>The number of protons decides the element.<br>Find 8 in the table: oxygen."}, {"type": "mcq", "tag": "transfer", "fig": "c_fluorine", "stem": "The table gives the first ten elements and their proton counts. This atom has 9 protons, and one proton is added to its nucleus. Which element is the atom now?", "options": ["neon", "oxygen", "fluorine"], "key": 0, "fb": ["9 protons and one more make 10 protons, and the table says neon.", "Oxygen means 8 protons; the atom now has 10 protons.", "Fluorine means 9 protons; the atom now has 10 protons."], "why": "The atom had 9 protons, and one is added: 10 protons.<br>The number of protons decides the element.<br>Find 10 in the table: neon."}, {"type": "mcq", "tag": "what", "stem": "Which one change turns an atom of one element into an atom of a different element?", "options": ["adding a neutron to its nucleus", "adding an electron to the outside of its nucleus", "adding a proton to its nucleus"], "key": 2, "fb": ["Adding a neutron leaves the proton count the same, so the element stays the same.", "Adding an electron leaves the proton count the same, so the element stays the same.", "Adding a proton changes the proton count, and the proton count decides the element."], "why": "The number of protons decides which element an atom is.<br>Only adding or removing a proton changes that number.<br>So adding a proton turns the atom into a different element."}, {"type": "text", "tag": "transfer", "fig": "c_count", "stem": "The table gives the first ten elements and their proton counts. Under it is one atom's proton count. How many protons must be added to make this atom an oxygen atom?", "accept": ["4", "4 protons", "four"], "why": "Oxygen means 8 protons.<br>The atom has 4 protons.<br>8 protons take away 4 protons is 4 protons, so 4 protons must be added."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "One proton was pushed into the carbon atom's nucleus, making 7 protons. What did the video say the atom had become?", "options": ["still carbon", "nitrogen", "oxygen"], "key": 1, "fb": ["Carbon means 6 protons; with 7 protons the atom is not carbon anymore.", "7 protons is nitrogen: the proton count changed, so the element changed.", "Oxygen means 8 protons; the atom had 7 protons."], "why": "The number of protons decides which element an atom is.<br>The atom now has 7 protons.<br>Every atom with 7 protons is nitrogen."}]}, {"id": "L05", "atom": "MAT-052", "title": "Protons and electrons balance in a neutral atom", "video": "could do without a video", "lesson_type": "Routine lesson (a one-line count): the positive charges of the protons need the same number of negative charges, so a neutral atom has as many electrons as protons; coins neutral atom", "check_design": "Type (b) multi-step routine → one recall MCQ (L02: the charge an electron carries), the coined term typed and a meaning MCQ, the worked count on the page (oxygen), then step items on a fresh case stated once (a neutral fluorine atom, 9 protons: positive charges; negative charges needed; electrons), then bare typed counts (from a stated count of 4; from the table for nitrogen; from two drawn nuclei with empty rings: boron 5, helium 2), and one student-claim misconception (Anya: 6 protons and 7 neutrons need 13 electrons; key no). 11 items.", "headache": ["An atom of oxygen has 8 protons.", "Each proton carries a positive charge.", "Yet an ordinary oxygen atom has no overall charge at all.", "Something must cancel the positives.", "How many electrons does the atom have?"], "forest": ["How do you find the number of electrons in an atom with no overall charge?", "Each proton carries one positive charge; each electron carries one negative charge.", "An atom with no overall charge is called a neutral atom.", "In a neutral atom the positives and negatives cancel, so the number of electrons equals the number of protons.", "Oxygen has 8 protons, so a neutral oxygen atom has 8 electrons."], "article": [{"t": "idea", "text": "An atom of oxygen has 8 protons."}, {"t": "idea", "text": "Each proton carries a positive charge."}, {"t": "idea", "text": "Yet an ordinary oxygen atom has no overall charge at all."}, {"t": "idea", "text": "Something must cancel the positives."}, {"t": "idea", "text": "How many electrons does the atom have?"}, {"t": "h", "text": "Charges, again"}, {"t": "idea", "text": "Each proton carries one positive charge."}, {"t": "idea", "text": "Each electron carries one negative charge."}, {"t": "idea", "text": "A neutron carries no charge."}, {"t": "idea", "text": "One positive charge and one negative charge cancel each other out."}, {"t": "h", "text": "Cancel the positives"}, {"t": "idea", "text": "The oxygen atom's 8 protons carry 8 positive charges."}, {"t": "idea", "text": "To cancel 8 positive charges, the atom needs 8 negative charges."}, {"t": "idea", "text": "Each electron carries one negative charge, so the atom needs 8 electrons."}, {"t": "idea", "text": "8 positives and 8 negatives cancel, so the atom has no overall charge."}, {"t": "fig", "key": "oxygen_balance", "cap": "A neutral oxygen atom: 8 protons carry 8 positive charges, 8 electrons carry 8 negative charges, and the two sets cancel. The neutrons carry no charge, so they change nothing here."}, {"t": "h", "text": "A name for it"}, {"t": "idea", "text": "An atom with no overall charge is called a <b>neutral atom<\/b>."}, {"t": "idea", "text": "In a neutral atom the number of electrons equals the number of protons."}, {"t": "idea", "text": "Ordinary atoms, like the ones in the air and in this page, are neutral atoms."}, {"t": "h", "text": "The routine"}, {"t": "idea", "do": true, "text": "<b>Step 1:<\/b> read the number of protons."}, {"t": "idea", "text": "<b>Step 2:<\/b> each proton's positive charge needs one electron's negative charge to cancel it."}, {"t": "idea", "text": "<b>Step 3:<\/b> so the number of electrons equals the number of protons."}, {"t": "idea", "text": "In one line: a neutral atom has as many electrons as it has protons."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider a neutral lithium atom: 3 protons."}, {"t": "idea", "text": "3 positive charges need 3 negative charges, so the atom has 3 electrons."}, {"t": "idea", "text": "Now consider a neutral neon atom: 10 protons."}, {"t": "idea", "text": "10 positive charges need 10 negative charges, so the atom has 10 electrons."}, {"t": "fig", "key": "neutral_pairs", "cap": "Two neutral atoms drawn the same way: lithium has 3 protons and 3 electrons; neon has 10 protons and 10 electrons."}, {"t": "fig", "key": "neutral_table", "cap": "Three neutral atoms in a table: protons, positive charges, and the electrons needed to cancel them."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "An atom with no overall charge is called a neutral atom. In a neutral atom the positive charges of the protons and the negative charges of the electrons cancel, so the number of electrons equals the number of protons."}, {"t": "idea", "text": "Back to the oxygen atom: 8 protons carry 8 positive charges, so 8 electrons cancel them."}, {"t": "idea", "text": "A neutral oxygen atom has 8 electrons."}], "script": [{"say": "An atom of oxygen has 8 protons, and each proton carries a positive charge.", "screen": "[the oxygen atom; its eight protons counted off, plus marks glowing]"}, {"say": "Yet an ordinary oxygen atom has no overall charge at all. Something must cancel the positives.", "screen": "[label: NO OVERALL CHARGE; question mark]"}, {"say": "How many electrons does the atom have?", "screen": "[the rings, empty, with a question mark]"}, {"say": "Each proton carries one positive charge, each electron carries one negative charge, and a neutron carries no charge.", "screen": "[the three chips from L02]"}, {"say": "One positive charge and one negative charge cancel each other out.", "screen": "[a + and a − slide together and fade]"}, {"say": "The oxygen atom's 8 protons carry 8 positive charges.", "screen": "[tally: 8 plus marks]"}, {"say": "To cancel 8 positive charges, the atom needs 8 negative charges, so it needs 8 electrons.", "screen": "[8 minus marks line up under the pluses; 8 dots appear on the rings]"}, {"say": "8 positives and 8 negatives cancel, so the atom has no overall charge.", "screen": "[the pairs fade; label NO OVERALL CHARGE]"}, {"say": "An atom with no overall charge is called a neutral atom.", "screen": "[chip: NEUTRAL ATOM]"}, {"say": "In a neutral atom the number of electrons equals the number of protons.", "screen": "[electrons = protons]"}, {"say": "Now consider a neutral lithium atom: 3 protons, so 3 electrons.", "screen": "[the lithium atom with its counts]"}, {"say": "A neutral neon atom: 10 protons, so 10 electrons.", "screen": "[the neon atom with its counts]"}, {"say": "So here is the rule: in a neutral atom the positive charges and the negative charges cancel, so the number of electrons equals the number of protons.", "screen": "[rule slide reuses the oxygen tally; rule text]"}, {"say": "Back to the oxygen atom: 8 protons, 8 positive charges, so 8 electrons cancel them.", "screen": "[the complete oxygen atom, 8 dots on the rings]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Which charge does each electron carry?", "options": ["positive", "negative", "none"], "key": 1, "fb": ["Each proton carries the positive charge; an electron carries a negative charge.", "Each electron carries one negative charge: that is what its minus mark means.", "A neutron carries no charge; an electron carries a negative charge."], "why": "Each electron is drawn with a minus mark.<br>The minus mark means a negative charge.<br>So each electron carries one negative charge."}, {"type": "text", "tag": "term", "stem": "An atom with no overall charge is called a…", "accept": ["neutral atom", "a neutral atom", "neutral"], "why": "An atom with no overall charge is called a neutral atom.<br>In a neutral atom the number of electrons equals the number of protons."}, {"type": "mcq", "tag": "term", "stem": "A scientist calls an atom a neutral atom. What does she mean?", "options": ["The atom has no overall charge.", "The atom has no neutrons in its nucleus.", "The atom has no electrons on its rings."], "key": 0, "fb": ["A neutral atom has no overall charge: its positives and negatives cancel.", "Neutral is about charge, not about neutrons. Neutrons carry no charge, so their number does not decide whether the atom is neutral.", "A neutral atom has electrons: as many as it has protons."], "why": "An atom with no overall charge is called a neutral atom.<br>Its protons' positive charges and its electrons' negative charges cancel.<br>So the scientist means the atom has no overall charge."}, {"type": "text", "tag": "scaffold", "stem": "A neutral fluorine atom has 9 protons. How many positive charges do its protons carry?", "accept": ["9", "9 positive charges", "nine"], "why": "Each proton carries one positive charge.<br>The atom has 9 protons.<br>So its protons carry 9 positive charges."}, {"type": "text", "tag": "scaffold", "stem": "The neutral fluorine atom has 9 positive charges. How many negative charges are needed to cancel them?", "accept": ["9", "9 negative charges", "nine"], "why": "One positive charge and one negative charge cancel each other out.<br>There are 9 positive charges.<br>So 9 negative charges are needed."}, {"type": "text", "tag": "scaffold", "stem": "The neutral fluorine atom needs 9 negative charges. How many electrons does it have?", "accept": ["9", "9 electrons", "nine"], "why": "Each electron carries one negative charge.<br>The atom needs 9 negative charges.<br>So the neutral fluorine atom has 9 electrons."}, {"type": "text", "tag": "bare", "stem": "A neutral atom has 4 protons. How many electrons does it have?", "accept": ["4", "4 electrons", "four"], "why": "In a neutral atom the number of electrons equals the number of protons.<br>The atom has 4 protons.<br>So it has 4 electrons."}, {"type": "text", "tag": "bare", "fig": "b_nitrogen", "stem": "The table gives the first ten elements and their proton counts. How many electrons does a neutral atom of nitrogen have?", "accept": ["7", "7 electrons", "seven"], "why": "Find nitrogen in the table: 7 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So a neutral nitrogen atom has 7 electrons."}, {"type": "text", "tag": "bare", "fig": "b_boron", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. This neutral atom is drawn with its electrons left off the ring. How many electrons does it have?", "accept": ["5", "5 electrons", "five"], "why": "Count the filled circles marked plus: 5 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So this atom has 5 electrons; the 6 open circles are neutrons and change nothing."}, {"type": "text", "tag": "bare", "fig": "b_helium", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. This neutral atom is drawn with its electrons left off the ring. How many electrons does it have?", "accept": ["2", "2 electrons", "two"], "why": "Count the filled circles marked plus: 2 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So this atom has 2 electrons."}, {"type": "mcq", "tag": "misconception", "stem": "Anya says: \"A neutral atom with 6 protons and 7 neutrons has 13 electrons, one for each particle in the nucleus.\" Is Anya correct?", "options": ["yes", "no"], "key": 1, "fb": ["Neutrons carry no charge, so they need no electrons to cancel them. Only the 6 protons do, so the atom has 6 electrons.", "Only the 6 protons carry charge, so only 6 electrons are needed to cancel them. The neutral atom has 6 electrons."], "why": "Each proton carries one positive charge, and a neutron carries no charge.<br>Only the 6 positive charges need cancelling, so 6 negative charges are needed.<br>The neutral atom has 6 electrons, not 13, and Anya is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The oxygen atom had 8 protons and no overall charge. How many electrons did the video say it had?", "options": ["0", "8", "16"], "key": 1, "fb": ["With no electrons the 8 positive charges would not be cancelled.", "8 positive charges need 8 negative charges, so 8 electrons.", "The neutrons carry no charge, so only the 8 protons need cancelling: 8 electrons."], "why": "Each proton carries one positive charge: 8 positives.<br>Each electron carries one negative charge, and one of each cancels.<br>So the neutral oxygen atom has 8 electrons."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-050", "stem": "Inside every atom, one kind of particle sits in the nucleus and carries a positive charge. What is this kind of particle called?", "accept": ["proton", "a proton", "protons"], "why": "The particle in the nucleus that carries a positive charge is called a proton.<br>It is drawn as a filled circle marked plus."}, {"type": "text", "tag": "term", "atom": "MAT-050", "stem": "One kind of particle sits in the nucleus and carries no charge at all. What is this kind of particle called?", "accept": ["neutron", "a neutron", "neutrons"], "why": "The particle in the nucleus that carries no charge is called a neutron.<br>It is drawn as an open circle with no mark."}, {"type": "text", "tag": "term", "atom": "MAT-050", "stem": "One kind of particle moves around the outside of the nucleus and carries a negative charge. What is this kind of particle called?", "accept": ["electron", "an electron", "electrons"], "why": "The particle outside the nucleus that carries a negative charge is called an electron.<br>It is drawn as a small dark dot marked minus."}, {"type": "text", "tag": "term", "atom": "MAT-050", "stem": "The protons and neutrons of an atom sit packed together in a tiny center. What is that center called?", "accept": ["nucleus", "the nucleus", "a nucleus"], "why": "The tiny packed center of an atom, where the protons and neutrons sit, is called the nucleus."}, {"type": "text", "tag": "term", "atom": "MAT-052", "stem": "In one kind of atom the positive charges and the negative charges cancel, so the atom has no overall charge. What is such an atom called?", "accept": ["neutral atom", "a neutral atom", "neutral"], "why": "An atom with no overall charge is called a neutral atom.<br>In a neutral atom the number of electrons equals the number of protons."}, {"type": "text", "tag": "count", "atom": "MAT-052", "fig": "pr_beryllium", "stem": "The table gives the first ten elements and their proton counts. How many electrons does a neutral atom of beryllium have?", "accept": ["4", "4 electrons", "four"], "why": "Find beryllium in the table: 4 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So a neutral beryllium atom has 4 electrons."}, {"type": "text", "tag": "count", "atom": "MAT-050", "stem": "An atom has 9 protons, 10 neutrons and 9 electrons. How many particles sit in its nucleus?", "accept": ["19", "19 particles", "nineteen"], "why": "Protons and neutrons sit in the nucleus; electrons sit outside it.<br>9 protons and 10 neutrons make 19.<br>So 19 particles sit in the nucleus."}, {"type": "frq", "tag": "why", "atom": "MAT-051b", "fig": "pr_beryllium_plus", "task": "The table gives the first ten elements and their proton counts. This atom has 4 protons, and one proton is added to its nucleus. Explain why the atom is now a different element, and name the element.", "starter": "The number of protons…", "model": "The number of protons decides which element an atom is.<br>The atom had 4 protons, so it was beryllium.<br>Now it has 5 protons.<br>Every atom with 5 protons is boron, so the atom is now boron, a different element.", "points": ["the number of protons decides the element", "the count changed from 4 protons to 5 protons", "5 protons is boron (the table)"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-051", "fig": "pr_atom", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["carbon", "nitrogen", "oxygen"], "key": 1, "fb": ["Carbon has 6 protons; this atom has 7 filled circles marked plus.", "7 protons: the table says nitrogen.", "Oxygen has 8 protons; this atom has 7 filled circles marked plus."], "why": "Count only the filled circles marked plus: 7 protons.<br>Find 7 in the table: nitrogen.<br>So the atom is nitrogen."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-049", "stem": "Which of these lists exactly the three kinds of particle found inside every atom?", "options": ["protons, neutrons and electrons", "protons, electrons and molecules", "atoms, molecules and compounds"], "key": 0, "fb": ["Every atom contains protons, neutrons and electrons.", "A molecule is atoms joined together; it is not inside an atom.", "Atoms, molecules and compounds are made of atoms, not found inside one."], "why": "Every atom contains three kinds of smaller particle.<br>They are protons, neutrons and electrons.<br>Molecules and compounds are made of whole atoms."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-052", "stem": "Femi says: \"A neutral atom can have more neutrons than protons.\" Is Femi correct?", "options": ["yes", "no"], "key": 0, "fb": ["Neutral is about charge: the electrons match the protons. Neutrons carry no charge, so their number is not fixed by the protons.", "Neutral does not mean equal numbers of everything. Only the electrons must match the protons; a neutral lithium atom has 3 protons and 4 neutrons."], "why": "A neutral atom has no overall charge because its electrons cancel its protons.<br>Neutrons carry no charge, so they play no part in that balance.<br>A neutral lithium atom has 3 protons and 4 neutrons, so Femi is correct."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-050", "stem": "Which statement about the charges inside an atom is correct?", "options": ["Protons are positive, electrons are negative, and neutrons carry no charge.", "Protons are negative, electrons are positive, and neutrons carry no charge.", "Protons and neutrons are positive, and electrons are negative."], "key": 0, "fb": ["Each proton carries a positive charge, each electron a negative charge, and a neutron carries none.", "The plus mark is on the proton: protons are positive, and electrons are negative.", "Neutrons carry no charge: only the protons in the nucleus are positive."], "why": "Each proton carries a positive charge: that is its plus mark.<br>Each electron carries a negative charge: that is its minus mark.<br>A neutron carries no charge, so it has no mark."}], "pp100": [{"d": "easy", "atom": "MAT-049", "stem": "An atom of neon is taken apart. Which of the following is found inside it?", "options": ["protons, neutrons and electrons", "smaller neon atoms", "neon molecules", "protons and electrons, nothing else"], "key": 0, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>None of them is neon; neon is what the whole atom is.<br>Molecules are made of whole atoms, so none sits inside one."}, {"d": "easy", "atom": "MAT-050", "stem": "Which part of an atom carries a negative charge?", "options": ["a proton", "a neutron", "an electron", "the nucleus"], "key": 2, "why": "Each electron carries a negative charge: that is its minus mark.<br>A proton carries a positive charge, and a neutron carries none.<br>The nucleus holds the protons and neutrons, so its charge is positive."}, {"d": "easy", "atom": "MAT-049", "stem": "Which statement about atoms is correct?", "options": ["Only the atoms of metals contain protons in the nucleus.", "Atoms are made of three kinds of particle.", "Atoms of different elements are made of different kinds of particle from one another.", "Some atoms contain a fourth kind of particle as well."], "key": 1, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>Metal or not, element to element, the kinds are the same.<br>Only the numbers of each kind differ from atom to atom."}, {"d": "easy", "atom": "MAT-051", "fig": "pp_three", "stem": "The table gives the first ten elements and their proton counts. Under it is one atom's proton count: which element is that atom?", "options": ["helium", "lithium", "beryllium", "boron"], "key": 1, "why": "The atom has 3 protons.<br>The number of protons decides the element.<br>Find 3 in the table: lithium."}, {"d": "easy", "atom": "MAT-052", "stem": "An atom has no overall charge. What is such an atom called?", "options": ["a neutral atom", "a neutron", "an atom of an element", "a nucleus"], "key": 0, "why": "An atom with no overall charge is called a neutral atom.<br>Its protons' positive charges and its electrons' negative charges cancel.<br>A neutron is one particle inside it, not a name for the atom; every atom is an atom of some element, charged or not."}, {"d": "easy", "atom": "MAT-051b", "stem": "Each of these atoms has one change made to it. Which atom is now a different element?", "options": ["a boron atom, one proton added", "a carbon atom, one neutron added", "a neon atom, one electron added", "a helium atom, one neutron taken out"], "key": 0, "why": "The number of protons decides which element an atom is.<br>Only the boron atom's proton count changed: 5 protons became 6 protons.<br>Adding a neutron, adding an electron or taking a neutron out leaves the proton count the same."}, {"d": "easy", "atom": "MAT-049", "stem": "Atoms are made of smaller particles. How many kinds of smaller particle are there?", "options": ["1", "2", "3", "a different number for each element"], "key": 2, "why": "Atoms are made of three kinds of smaller particle: protons, neutrons and electrons.<br>An atom of helium and an atom of gold are made of the same three kinds; only the numbers differ.<br>So there are 3 kinds of smaller particle."}, {"d": "easy", "atom": "MAT-049", "stem": "What is a proton?", "options": ["one of the elements, such as carbon", "a very small atom", "a particle inside an atom", "a small molecule"], "key": 2, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>A proton is one of those particles, so it sits inside an atom.<br>An atom, an element and a molecule are all made of whole atoms, so a proton is none of them."}, {"d": "easy", "atom": "MAT-050", "stem": "In this topic's drawings of an atom, the electrons sit on dashed rings around the nucleus. What do those rings show?", "options": ["the paths the electrons run along, like tracks", "that the electrons stay outside the nucleus", "the outside edge of the atom, like a skin", "the true size of the atom"], "key": 1, "why": "The drawing is a model, not a photograph.<br>Electrons move around the outside of the nucleus, and the rings only show that they stay outside it.<br>The electrons do not run on tracks, the atom has no hard edge, and nothing is drawn to scale."}, {"d": "easy", "atom": "MAT-050", "stem": "A particle carries a charge. What does carrying a charge let it do?", "options": ["pull on, or push away, other charged things", "move faster than the particles that carry no charge", "sit in the nucleus of the atom", "store up energy, like a charged battery"], "key": 0, "why": "A charge is something a thing carries that makes it pull on, or push away, other charged things.<br>Protons and electrons carry charges, so each one pulls on or pushes away other charged particles.<br>Where a particle sits, and how fast it moves, is not what a charge means."}, {"d": "easy", "atom": "MAT-051", "stem": "Two atoms each have 7 protons. Which statement about the two atoms is correct?", "options": ["They are atoms of two different elements.", "They are the same element only if their neutron counts match too.", "They are the same element only if their electron counts match too.", "They are atoms of the same element."], "key": 3, "why": "The number of protons decides which element an atom is.<br>Both atoms have 7 protons, so both are atoms of the same element.<br>Neutron counts and electron counts do not decide the element."}, {"d": "easy", "atom": "MAT-051", "stem": "To find which element an atom is, which of its particles do you count?", "options": ["all of them, added together", "its electrons", "its neutrons", "its protons"], "key": 3, "why": "The number of protons decides which element an atom is.<br>Count the protons, find that number in the table, and read off the element.<br>The neutron count, the electron count and the total do not decide it."}, {"d": "easy", "atom": "MAT-051b", "stem": "One proton is taken out of an atom's nucleus. What happens to the atom?", "options": ["It stays the same element as before.", "It becomes a different element.", "It becomes a molecule.", "It stops being an atom."], "key": 1, "why": "The number of protons decides which element an atom is.<br>Taking one proton out changes the proton count.<br>So the atom becomes a different element: it is still one atom, and never a molecule."}, {"d": "easy", "atom": "MAT-051b", "stem": "A tin atom has 50 protons. What is the smallest number of protons that must be taken out of its nucleus for the atom to stop being tin?", "options": ["1 proton", "2 protons", "25 protons, half of them", "50 protons, all of them"], "key": 0, "why": "The number of protons decides which element an atom is.<br>Tin means 50 protons, and an atom with any other count is not tin.<br>Take out 1 proton: 49 protons, a different element, so 1 proton is enough."}, {"d": "easy", "atom": "MAT-052", "stem": "A neutral atom has 12 electrons. How many protons does it have?", "options": ["0", "6", "12", "24"], "key": 2, "why": "In a neutral atom the number of electrons equals the number of protons.<br>Each electron's negative charge cancels one proton's positive charge.<br>12 electrons cancel 12 protons, so the atom has 12 protons."}, {"d": "easy", "atom": "MAT-052", "stem": "Which statement is true of every neutral atom?", "options": ["It has as many neutrons as protons.", "It has no charged particles at all.", "Its nucleus holds as many electrons as protons.", "It has as many electrons as protons."], "key": 3, "why": "A neutral atom has no overall charge.<br>Its protons' positive charges are cancelled by its electrons' negative charges, one for one.<br>So it has as many electrons as protons; the neutrons carry no charge and play no part, and the electrons sit outside the nucleus."}, {"d": "easy", "atom": "MAT-051b", "stem": "Where could a carbon atom be turned into a nitrogen atom?", "options": ["inside a kitchen oven", "inside a burning fire", "inside a chemist's flask", "inside a star"], "key": 3, "why": "Turning carbon into nitrogen means pushing one more proton into the nucleus.<br>That takes enormous force, and it happens inside stars.<br>An oven, a fire and a flask do not change the proton count, so the atom stays carbon."}, {"d": "medium", "atom": "MAT-051", "fig": "pp_boron", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. The table gives the first ten elements and their proton counts. Count the protons: which element is this atom?", "options": ["beryllium", "carbon", "lithium", "boron"], "key": 3, "why": "Count only the filled circles marked plus: 5 protons.<br>The 6 open circles are neutrons, and they do not decide the element.<br>Find 5 in the table: boron."}, {"d": "medium", "atom": "MAT-052", "fig": "pp_carbon_n", "stem": "The table gives the first ten elements and their proton counts. A neutral atom of carbon has 6 neutrons. How many electrons does it have?", "options": ["0", "3", "6", "12"], "key": 2, "why": "Find carbon in the table: 6 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So a neutral carbon atom has 6 electrons; the 6 neutrons carry no charge and change nothing."}, {"d": "medium", "atom": "MAT-052", "fig": "pp_nucleus", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. This neutral atom is drawn with its electrons left off. How many electrons does it have?", "options": ["0", "9", "10", "19"], "key": 1, "why": "Count the filled circles marked plus: 9 protons.<br>In a neutral atom the number of electrons equals the number of protons.<br>So the atom has 9 electrons; the 10 open circles are neutrons and change nothing."}, {"d": "medium", "atom": "MAT-051", "fig": "pp_oxygen_cmp", "stem": "The table gives the first ten elements and their proton counts. Which element's atoms have exactly one more proton than an oxygen atom?", "options": ["nitrogen", "fluorine", "neon", "hydrogen"], "key": 1, "why": "Oxygen: the table says 8 protons.<br>One more is 9 protons.<br>Find 9 in the table: fluorine."}, {"d": "medium", "atom": "MAT-051b", "fig": "pp_lithium_plus2", "stem": "The table gives the first ten elements and their proton counts. This atom has 3 protons, and two protons are added to its nucleus. Which element is the atom now?", "options": ["lithium", "beryllium", "boron", "carbon"], "key": 2, "why": "The atom had 3 protons, and two are added: 5 protons.<br>The number of protons decides the element.<br>Find 5 in the table: boron."}, {"d": "medium", "atom": "MAT-050", "fig": "pp_helium", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. Which statement about this drawing is correct?", "options": ["The open circles carry a positive charge.", "The filled circles sit outside the nucleus.", "The particles in the middle carry no charge at all.", "The two dots on the ring carry a negative charge."], "key": 3, "why": "The small dark dots are electrons, and each electron carries a negative charge.<br>The filled circles marked plus are protons, positive, packed in the nucleus.<br>The open circles are neutrons, with no charge, also in the nucleus."}, {"d": "medium", "atom": "MAT-049", "stem": "A gold atom has 79 protons. Which of the following is also true of the gold atom?", "options": ["It contains 79 kinds of particle.", "It contains tiny pieces of gold packed in its nucleus.", "It contains protons only.", "It contains neutrons as well as electrons."], "key": 3, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>A gold atom has 79 protons, and it has neutrons and electrons too.<br>Only the numbers differ from atom to atom."}, {"d": "medium", "atom": "MAT-052", "stem": "An atom has 3 protons, 4 neutrons and 3 electrons. The atom is neutral. Why?", "options": ["Every atom is neutral, whatever its counts.", "Its 4 neutrons cancel the charges of its 3 protons.", "Its 3 electrons cancel the charges of its 3 protons.", "The 7 particles in its nucleus carry no charge at all."], "key": 2, "why": "Each proton carries one positive charge and each electron one negative charge: 3 of each.<br>3 positive charges and 3 negative charges cancel, so the atom has no overall charge.<br>Neutrons carry no charge, so their number plays no part."}, {"d": "medium", "atom": "MAT-051b", "fig": "pp_c_to_o", "stem": "The table gives the first ten elements and their proton counts. Which change turns a carbon atom into an oxygen atom?", "options": ["remove 2 protons", "add 2 neutrons", "add 2 protons", "add 2 electrons"], "key": 2, "why": "Carbon means 6 protons and oxygen means 8 protons.<br>The number of protons decides the element, so the proton count must rise from 6 protons to 8 protons.<br>Adding 2 protons does that; adding neutrons or electrons leaves the proton count at 6 protons."}, {"d": "medium", "atom": "MAT-052", "fig": "pp_seven", "stem": "The table gives the first ten elements and their proton counts. Under it is one neutral atom's proton count. Which element is the atom, and how many electrons does it have?", "options": ["carbon, 7 electrons", "nitrogen, 7 electrons", "nitrogen, 14 electrons", "oxygen, 8 electrons"], "key": 1, "why": "Find 7 in the table: nitrogen.<br>In a neutral atom the number of electrons equals the number of protons.<br>So the atom is nitrogen, with 7 electrons."}, {"d": "medium", "atom": "MAT-049", "fig": "pp_nikhil", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. Nikhil drew this atom of nitrogen. Which kind of particle, if any, did he leave out?", "options": ["protons", "neutrons", "electrons", "none of them"], "key": 1, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>Nikhil's drawing has 7 filled circles marked plus, the protons, and 7 small dark dots marked minus, the electrons.<br>It has no open circles, so the neutrons are missing."}, {"d": "medium", "atom": "MAT-049", "stem": "Which list goes from smallest to largest?", "options": ["proton, atom, molecule", "atom, proton, molecule", "molecule, atom, proton", "proton, molecule, atom"], "key": 0, "why": "A proton is one of the smaller particles inside an atom, so a proton is smaller than an atom.<br>A molecule is two or more atoms joined together, so a molecule is larger than one atom.<br>So the order is proton, atom, molecule."}, {"d": "medium", "atom": "MAT-050", "fig": "pp_count_a", "stem": "Filled circles marked + are protons, open circles are neutrons, small dark dots marked − are electrons. How many particles sit in the nucleus of this atom?", "options": ["2", "6", "12", "18"], "key": 2, "why": "Protons and neutrons sit together in the nucleus; electrons sit outside it.<br>The nucleus here holds 6 filled circles marked plus and 6 open circles: 6 protons and 6 neutrons.<br>6 protons and 6 neutrons make 12 particles; the 6 electrons on the rings are not in the nucleus."}, {"d": "medium", "atom": "MAT-050", "stem": "An atom has 5 protons, 6 neutrons and 5 electrons. How many of its particles carry a charge?", "options": ["5", "10", "11", "16"], "key": 1, "why": "Each proton carries a positive charge, and each electron carries a negative charge.<br>A neutron carries no charge.<br>5 protons and 5 electrons make 10 charged particles; the 6 neutrons are not counted."}, {"d": "medium", "atom": "MAT-051", "fig": "pp_neon_helium", "stem": "The table gives the first ten elements and their proton counts. How many more protons does an atom of neon have than an atom of helium?", "options": ["2", "8", "10", "12"], "key": 1, "why": "Neon: the table says 10 protons.<br>Helium: the table says 2 protons.<br>10 protons take away 2 protons is 8 protons, so a neon atom has 8 more protons than a helium atom."}, {"d": "medium", "atom": "MAT-051", "stem": "Four atoms have 3 protons, 4 protons, 3 protons and 5 protons. How many different elements are there among these four atoms?", "options": ["1", "2", "3", "4"], "key": 2, "why": "The number of protons decides which element an atom is.<br>The two atoms with 3 protons are the same element.<br>The atom with 4 protons and the atom with 5 protons are each a different element, so the four atoms are 3 elements."}, {"d": "medium", "atom": "MAT-051b", "fig": "pp_to_fluorine", "stem": "The table gives the first ten elements and their proton counts. One proton is added to an atom's nucleus, and the atom becomes fluorine. Which element was the atom before the change?", "options": ["nitrogen", "oxygen", "fluorine", "neon"], "key": 1, "why": "Fluorine means 9 protons.<br>One proton was added to reach 9 protons, so the atom had 8 protons before.<br>Find 8 in the table: oxygen."}, {"d": "medium", "atom": "MAT-052", "stem": "A neutral helium atom has 2 protons and 2 electrons. Why does it have no overall charge?", "options": ["2 positive charges and 2 negative charges cancel.", "Its neutrons cancel its protons.", "Its electrons sit too far from the nucleus to count.", "Helium is a gas, and the atoms of gases carry no charge."], "key": 0, "why": "Each proton carries one positive charge: 2 positive charges.<br>Each electron carries one negative charge: 2 negative charges.<br>One positive charge and one negative charge cancel, so 2 of each cancel, and the atom has no overall charge; the neutrons carry no charge and play no part."}, {"d": "medium", "atom": "MAT-052", "fig": "pp_six_e", "stem": "The table gives the first ten elements and their proton counts. A neutral atom has 6 electrons. Which element is it?", "options": ["lithium", "boron", "carbon", "nitrogen"], "key": 2, "why": "In a neutral atom the number of electrons equals the number of protons.<br>6 electrons, so 6 protons.<br>Find 6 in the table: carbon."}, {"d": "medium", "atom": "MAT-049", "stem": "A neon atom has 10 protons, 10 neutrons and 10 electrons. Oskar says: \"So a neon atom is made of 30 kinds of particle.\" How many kinds of particle is the neon atom made of?", "options": ["1 kind", "2 kinds", "3 kinds", "30 kinds"], "key": 2, "why": "Every atom contains three kinds of smaller particle: protons, neutrons and electrons.<br>Neon's 10 protons are all one kind, its 10 neutrons one kind and its 10 electrons one kind.<br>So the atom has 30 particles but only 3 kinds, and Oskar is not correct."}, {"d": "medium", "atom": "MAT-051b", "fig": "pp_helium_two", "stem": "The table gives the first ten elements and their proton counts. A helium atom gains one proton, then one neutron, then one electron. Which element is the atom at the end?", "options": ["helium", "lithium", "beryllium", "boron"], "key": 1, "why": "Helium means 2 protons.<br>One proton added makes 3 protons; the neutron and the electron leave the proton count at 3 protons.<br>Find 3 in the table: lithium."}, {"d": "hard", "atom": "MAT-051b", "fig": "pp_boron_n", "stem": "The table gives the first ten elements and their proton counts. Cleo says: \"Add a neutron to a boron atom and it becomes carbon, because the nucleus now holds one more particle.\" Which element is the atom after the neutron is added?", "options": ["carbon", "beryllium", "an element the table does not list", "boron"], "key": 3, "why": "The number of protons decides which element an atom is.<br>Adding a neutron leaves the proton count at 5 protons.<br>Every atom with 5 protons is boron, so the atom is still boron, and Cleo is not correct."}, {"d": "hard", "atom": "MAT-050", "stem": "Tao says: \"The electrons must be in the nucleus, because the nucleus is where the charges are.\" Which particles give the nucleus its charge?", "options": ["the protons", "the neutrons", "the electrons", "the protons and the electrons together"], "key": 0, "why": "The nucleus holds the protons and the neutrons, and the protons carry its positive charge.<br>The electrons, negative, move around the outside of the
