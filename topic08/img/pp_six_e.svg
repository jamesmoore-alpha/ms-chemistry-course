<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 354" width="100%" role="img" aria-label="The table of the first ten elements and the number of protons in each: hydrogen 1, helium 2, lithium 3, beryllium 4, boron 5, carbon 6, nitrogen 7, oxygen 8, fluorine 9, neon 10. Under the table: a neutral atom with 6 electrons" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="240" height="354" fill="#ffffff"/><!--blind: The table of the first ten elements: hydrogen 1, helium 2, lithium 3, beryllium 4, boron 5, carbon 6, nitrogen 7, oxygen 8, fluorine 9, neon 10; note under the table: a neutral atom with 6 electrons.--><rect x="10" y="10" width="220" height="28" fill="#f1f1f1" stroke="#222"/><text x="75.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">element</text><text x="185.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">protons</text><rect x="10" y="38" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">hydrogen</text><text x="185.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1</text><rect x="10" y="66" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">helium</text><text x="185.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2</text><rect x="10" y="94" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lithium</text><text x="185.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><rect x="10" y="122" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">beryllium</text><text x="185.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">4</text><rect x="10" y="150" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">boron</text><text x="185.0" y="169" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">5</text><rect x="10" y="178" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">carbon</text><text x="185.0" y="197" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">6</text><rect x="10" y="206" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">nitrogen</text><text x="185.0" y="225" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">7</text><rect x="10" y="234" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="185.0" y="253" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8</text><rect x="10" y="262" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">fluorine</text><text x="185.0" y="281" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">9</text><rect x="10" y="290" width="220" height="28" fill="#ffffff" stroke="#222"/><text x="75.0" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neon</text><text x="185.0" y="309" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><line x1="140" y1="10" x2="140" y2="318" stroke="#222"/><text x="120.0" y="336" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a neutral atom with 6 electrons</text></svg>