<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 158" width="100%" role="img" aria-label="A table of three neutral atoms: oxygen has 8 protons, 8 positive charges, 8 electrons needed; lithium 3, 3, 3; neon 10, 10, 10. Note: in a neutral atom the number of electrons equals the number of protons" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="570" height="158" fill="#ffffff"/><rect x="10" y="10" width="550" height="28" fill="#f1f1f1" stroke="#222"/><text x="85.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neutral atom of</text><text x="210.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">protons</text><text x="335.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">positive charges</text><text x="485.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">electrons needed</text><rect x="10" y="38" width="550" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oxygen</text><text x="210.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8</text><text x="335.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8</text><text x="485.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8</text><rect x="10" y="66" width="550" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">lithium</text><text x="210.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="335.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><text x="485.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">3</text><rect x="10" y="94" width="550" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neon</text><text x="210.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><text x="335.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><text x="485.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10</text><line x1="160" y1="10" x2="160" y2="122" stroke="#222"/><line x1="260" y1="10" x2="260" y2="122" stroke="#222"/><line x1="410" y1="10" x2="410" y2="122" stroke="#222"/><text x="285.0" y="140" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">In a neutral atom the number of electrons equals the number of protons</text><!--blind: A table. Header: neutral atom of | protons | positive charges | electrons needed. Row: oxygen | 8 | 8 | 8. Row: lithium | 3 | 3 | 3. Row: neon | 10 | 10 | 10. Note under the table: In a neutral atom the number of electrons equals the number of protons.--></svg>