<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 264" width="100%" role="img" aria-label="The inside of an atom of lithium: three filled circles marked plus and four open circles packed together at the center; three small dark dots marked minus sit on the dashed rings around them, two on the inner ring and one on the outer; a key under the drawing names the three kinds" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="300" height="264" fill="#ffffff"/><text x="150" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">the inside of an atom of lithium</text><circle cx="150.0" cy="114.0" r="50" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/><circle cx="150.0" cy="114.0" r="68" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/><circle cx="162.6" cy="114.0" r="6.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="143.7" cy="124.9" r="6.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="143.7" cy="103.1" r="6.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="156.3" cy="103.1" r="6.0" fill="#ffffff" stroke="#222" stroke-width="1"/><circle cx="150.0" cy="114.0" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="150.0" y="117.7" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="156.3" cy="124.9" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="156.3" y="128.6" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="137.4" cy="114.0" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="137.4" y="117.7" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="150.0" cy="64.0" r="3.2" fill="#222"/><text x="150.0" y="60.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="150.0" cy="164.0" r="3.2" fill="#222"/><text x="150.0" y="176.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="175.5" cy="51.0" r="3.2" fill="#222"/><text x="178.5" y="47.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><text x="150" y="216" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">filled circles marked +: protons</text><text x="150" y="234" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">open circles: neutrons</text><text x="150" y="252" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">small dark dots marked −: electrons</text></svg>