<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 138" width="100%" role="img" aria-label="A table of the three kinds of particle and how each is drawn: a proton is a filled circle marked plus; a neutron is an open circle with no mark; an electron is a small dark dot marked minus" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="380" height="138" fill="#ffffff"/><rect x="10" y="10" width="360" height="28" fill="#f1f1f1" stroke="#222"/><text x="70.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">particle</text><text x="250.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">how it is drawn</text><rect x="10" y="38" width="360" height="28" fill="#ffffff" stroke="#222"/><text x="70.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">proton</text><text x="250.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a filled circle marked +</text><rect x="10" y="66" width="360" height="28" fill="#ffffff" stroke="#222"/><text x="70.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neutron</text><text x="250.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">an open circle, no mark</text><rect x="10" y="94" width="360" height="28" fill="#ffffff" stroke="#222"/><text x="70.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">electron</text><text x="250.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a small dark dot marked −</text><line x1="130" y1="10" x2="130" y2="122" stroke="#222"/><!--blind: A table. Header: particle | how it is drawn. Row: proton | a filled circle marked +. Row: neutron | an open circle, no mark. Row: electron | a small dark dot marked −.--></svg>