<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 138" width="100%" role="img" aria-label="A table of the three particles: a proton is drawn as a filled circle marked plus, carries a positive charge and sits in the nucleus; a neutron is drawn as an open circle with no mark, carries no charge and sits in the nucleus; an electron is drawn as a small dark dot marked minus, carries a negative charge and sits outside the nucleus on the rings" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="650" height="138" fill="#ffffff"/><rect x="10" y="10" width="630" height="28" fill="#f1f1f1" stroke="#222"/><text x="60.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">particle</text><text x="210.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">drawn as</text><text x="360.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">its charge</text><text x="525.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">where it sits</text><rect x="10" y="38" width="630" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">proton</text><text x="210.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a filled circle marked +</text><text x="360.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">positive</text><text x="525.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">in the nucleus</text><rect x="10" y="66" width="630" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">neutron</text><text x="210.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">an open circle, no mark</text><text x="360.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">none</text><text x="525.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">in the nucleus</text><rect x="10" y="94" width="630" height="28" fill="#ffffff" stroke="#222"/><text x="60.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">electron</text><text x="210.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">a small dark dot marked −</text><text x="360.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">negative</text><text x="525.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">outside the nucleus, on the rings</text><line x1="110" y1="10" x2="110" y2="122" stroke="#222"/><line x1="310" y1="10" x2="310" y2="122" stroke="#222"/><line x1="410" y1="10" x2="410" y2="122" stroke="#222"/><!--blind: A table. Header: particle | drawn as | its charge | where it sits. Row: proton | a filled circle marked + | positive | in the nucleus. Row: neutron | an open circle, no mark | none | in the nucleus. Row: electron | a small dark dot marked − | negative | outside the nucleus, on the rings.--></svg>