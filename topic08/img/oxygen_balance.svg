th="1"/><text x="137.4" y="117.7" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="156.3" cy="103.1" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="156.3" y="106.8" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="150.0" cy="135.8" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="150.0" y="139.5" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="131.1" cy="103.1" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="131.1" y="106.8" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="168.9" cy="103.1" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="168.9" y="106.8" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="162.6" cy="135.8" r="6.0" fill="#555" stroke="#222" stroke-width="1"/><text x="162.6" y="139.5" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#ffffff">+</text><circle cx="150.0" cy="114.0" r="36.2" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 2"/><circle cx="150.0" cy="64.0" r="3.2" fill="#222"/><text x="150.0" y="60.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="150.0" cy="164.0" r="3.2" fill="#222"/><text x="150.0" y="176.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="175.5" cy="51.0" r="3.2" fill="#222"/><text x="178.5" y="47.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="217.3" cy="104.5" r="3.2" fill="#222"/><text x="225.3" y="107.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="191.9" cy="167.6" r="3.2" fill="#222"/><text x="196.8" y="177.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">−</text><circle cx="124.5" cy="177.0" r="3.2" fill="#222"/><text x="121.5" y="188.5" text-