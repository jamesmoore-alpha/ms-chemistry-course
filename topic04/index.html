at 0.92 g/cm³.<br>So the corn syrup sinks below both and forms the bottom layer."}, {"d": "medium", "atom": "MAT-015", "stem": "A chisel has a steel blade fixed into a wooden handle. Is the chisel's density the same all the way through, and why?", "options": ["Yes: it is a single chisel, so it has a single density.", "Yes: the blade and the handle have the same mass.", "No: the blade is much smaller than the handle.", "No: steel and wood have different densities."], "key": 3, "why": "Density belongs to the material.<br>The blade is steel, so each cubic centimeter of the blade has a mass of about 8 g.<br>The handle is wood, so each cubic centimeter of the handle has a mass of less than 1 g.<br>Two materials means two densities inside one chisel."}, {"d": "medium", "atom": "MAT-015", "stem": "A builder receives a huge block that should be sandstone, with a density of 2.3 g/cm³. The block is far too big for any balance. Which of these lets him check the block's density?", "options": ["Drop a chip of it in water; if the chip sinks, it is sandstone.", "Break off a small chip and find the chip's density.", "Measure the block's volume; the volume alone gives the density.", "Nothing: a small chip has a lower density than the block."], "key": 1, "why": "Density belongs to the material, not to the size of the piece.<br>A small chip of the block has the same density as the whole block.<br>The chip fits on a balance and in a graduated cylinder, so its density can be found and checked against 2.3 g/cm³.<br>Sinking alone does not name a material."}, {"d": "medium", "atom": "MAT-008", "fig": "disp_knob_valve", "stem": "A ceramic knob with a volume of 10 cm³ sits under the water in a graduated cylinder (left). A brass valve is lowered in beside it (right). What is the valve's volume?", "options": ["10 cm³", "20 cm³", "30 cm³", "80 cm³"], "key": 2, "why": "The left reading, 50 mL, already includes the knob's 10 cm³.<br>Only the valve is added between the two readings.<br>Volume of the solid equals end reading minus start reading: 80 mL − 50 mL = 30 mL.<br>Each 1 mL displaced means 1 cm³ of solid, so the valve's volume is 30 cm³."}, {"d": "medium", "atom": "MAT-009", "fig": "rt_three_blocks", "stem": "The table gives the mass and the volume of three blocks. Which block is the densest?", "options": ["the balsa block", "the poplar block", "the basalt block", "the basalt block and the poplar block equally"], "key": 2, "why": "The balsa block and the poplar block have the same volume, 180 cm³; the poplar block has more mass, so it is denser than the balsa block.<br>The poplar block and the basalt block have the same mass, 90 g; the basalt block has less volume, so it is denser still.<br>So the basalt block is the densest."}, {"d": "hard", "atom": "MAT-008", "stem": "Kofi lowers a cork into the water in a graduated cylinder. The cork floats, with part of it above the water. He reads the level anyway. Which statement about the rise in the level is correct?", "options": ["The rise is exactly the cork's volume.", "The rise is bigger than the cork's volume.", "The rise is smaller than the cork's volume.", "The water level does not rise at all when a cork floats."], "key": 2, "why": "Only the part of the cork under the water pushes water aside.<br>The part above the water displaces nothing.<br>So the rise is smaller than the whole cork's volume."}, {"d": "hard", "atom": "MAT-009", "fig": "pt_potato_butter", "stem": "Owen reads the table. He says: \"The butter has more mass, so the butter is denser.\" Which statement is correct?", "options": ["The potato is denser: 220 g ÷ 200 cm³ = 1.1 g/cm³, and 270 g ÷ 300 cm³ = 0.9 g/cm³.", "The butter is denser, because 270 g is more than 220 g.", "The butter is denser: 270 g ÷ 300 cm³ = 0.9 g/cm³, and 220 g ÷ 200 cm³ = 1.1 g/cm³.", "The potato and the butter have the same density, because both are food."], "key": 0, "why": "The butter has more mass, but also more volume, so comparing without calculating cannot decide.<br>Potato: 220 g ÷ 200 cm³ = 1.1 g/cm³.<br>Butter: 270 g ÷ 300 cm³ = 0.9 g/cm³.<br>1.1 is more than 0.9, so the potato is denser."}, {"d": "hard", "atom": "MAT-010", "stem": "A clay tile has a mass of 100 g and a volume of 50 cm³. A block of hard rubber has a mass of 300 g and a volume of 200 cm³. Sienna says: \"The rubber block is denser, because it has more mass.\" Which statement is correct?", "options": ["The tile is denser, at 2 g/cm³.", "The rubber block is denser, because it has more mass.", "The rubber block is denser, at 1.5 g/cm³.", "The tile and the rubber block have the same density."], "key": 0, "why": "Tile: 100 g ÷ 50 cm³ = 2 g/cm³.<br>Rubber block: 300 g ÷ 200 cm³ = 1.5 g/cm³.<br>The tile packs more mass into each cubic centimeter, so the tile is denser; more mass alone does not decide."}, {"d": "hard", "atom": "MAT-011", "stem": "Liam says: \"A small ice cube floats because it has so little mass. A huge iceberg has far more mass, so it must sink.\" Ice has a density of 0.9 g/cm³, and water has a density of 1.0 g/cm³. Which statement is correct?", "options": ["The iceberg floats, because ice stays less dense than water.", "The iceberg sinks, because it has far more mass than the cube.", "The iceberg floats only if it is small enough to have little mass.", "The iceberg sinks, because a big object always sinks."], "key": 0, "why": "Density belongs to the material, so the iceberg is still 0.9 g/cm³.<br>Ice at 0.9 g/cm³ is less dense than water at 1.0 g/cm³.<br>An object less dense than the liquid floats, whatever its mass."}, {"d": "hard", "atom": "MAT-015", "stem": "Two bracelets are both labeled \"pure gold\". The bracelet from a market stall has a mass of 27 g and a volume of 3 cm³. The bracelet from a jeweler has a mass of 57.9 g and a volume of 3 cm³. Pure gold has a density of 19.3 g/cm³. Which statement is correct?", "options": ["Both bracelets match pure gold's density, because both carry the label.", "The market-stall bracelet's density matches pure gold's, and the jeweler's bracelet's does not.", "The jeweler's bracelet's density matches pure gold's, and the market-stall bracelet's does not.", "Neither bracelet matches pure gold's density, because their masses differ."], "key": 2, "why": "Market stall: 27 g ÷ 3 cm³ = 9 g/cm³, which does not match pure gold's 19.3 g/cm³.<br>Jeweler: 57.9 g ÷ 3 cm³ = 19.3 g/cm³, which matches.<br>A mismatch rules pure gold out; a match is consistent with pure gold, whatever the bracelet's size."}, {"d": "hard", "atom": "MAT-008", "fig": "pt_faucet_eggcup", "stem": "Jonas reads the table. He says: \"The faucet handle has more mass, so it will make the water in a graduated cylinder rise more.\" Which statement is correct?", "options": ["Jonas is correct: more mass pushes more water aside.", "Jonas is correct: brass is denser, so it displaces more water.", "Jonas is not correct: both raise the level by the same amount, because both go all the way under.", "Jonas is not correct: the egg cup, with the larger volume, raises the level more."], "key": 3, "why": "A solid under water pushes aside exactly its own volume of water, whatever its mass.<br>The faucet handle has a volume of 20 cm³, so it raises the level by 20 mL.<br>The egg cup has a volume of 40 cm³, so it raises the level by 40 mL.<br>So the egg cup raises the level more."}, {"d": "hard", "atom": "MAT-009", "fig": "bal_balsa_porcelain", "stem": "Ezra looks at the two balances in the drawing. He says: \"The balsa block is denser than the porcelain tile, because the block is so much bigger.\" Which statement is correct?", "options": ["Ezra is correct: a bigger object always has more material in it.", "Ezra is correct: more volume means more mass in each cubic centimeter.", "Ezra is not correct: the two have the same mass, so they have the same density.", "Ezra is not correct: the tile packs the same mass into far less space."], "key": 3, "why": "Both balances read 300 g, so the masses match.<br>The balsa block spreads its 300 g over a big volume; the porcelain tile packs its 300 g into a small one.<br>Same mass and less volume means denser, so the porcelain tile is denser.<br>A bigger volume alone does not make a material denser."}, {"d": "hard", "atom": "MAT-010", "fig": "disp_flint", "stem": "Milo measures a piece of flint with a mass of 50 g by displacement, as the drawing shows. He works out 50 g ÷ 50 cm³ = 1 g/cm³. Which statement about Milo's answer is correct?", "options": ["Milo's density is correct: the end reading is the stone's volume.", "Milo's density is correct: 50 ÷ 50 = 1, and the arithmetic is right.", "Milo's density is too high: the stone's volume is 80 cm³.", "Milo's density is too low: the stone's volume is 20 cm³."], "key": 3, "why": "The water rose from the 30 mark to the 50 mark, so the flint's volume is 50 mL − 30 mL = 20 mL, which is 20 cm³.<br>Milo divided by the end reading, 50 cm³, a volume too big.<br>Too big a volume gives too small a density.<br>The flint is 50 g ÷ 20 cm³ = 2.5 g/cm³."}, {"d": "hard", "atom": "MAT-010", "fig": "rt_cucumber", "stem": "The card from the lab gives the mass and the volume of a cucumber. The cucumber is put into a tub of water with a density of 1.0 g/cm³. Does the cucumber sink or float in the water, and why?", "options": ["It sinks: 190 g is a large mass.", "It floats: its density is 0.95 g/cm³, less than water's.", "It sinks: its density is 0.95 g/cm³, which is more than water's.", "It floats: 200 cm³ is a large volume."], "key": 1, "why": "Values: mass = 190 g, volume = 200 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 190 g ÷ 200 cm³.<br>Calculate: 190 ÷ 200 = 0.95.<br>Answer: density = 0.95 g/cm³.<br>The cucumber at 0.95 g/cm³ is less dense than water at 1.0 g/cm³, so it floats."}, {"d": "hard", "atom": "MAT-011", "fig": "rt_die_two_liquids", "stem": "A jar holds a layer of baby oil floating on salt water; the table gives the densities. A plastic game die is dropped in. Where does the die come to rest?", "options": ["at the top of the baby oil", "between the two liquids", "on the bottom of the jar", "It depends on the die's mass."], "key": 1, "why": "The die at 1.1 g/cm³ is denser than the baby oil at 0.83 g/cm³, so it sinks through the oil.<br>The die is less dense than the salt water at 1.2 g/cm³, so it floats on the salt water.<br>So the die comes to rest between the two liquids."}, {"d": "hard", "atom": "MAT-011", "stem": "A cherry tomato sinks in a glass of water. Which change would make the tomato float?", "options": ["Pour more water into the same glass.", "Use a much smaller cherry tomato.", "Lower the tomato into the water more gently.", "Dissolve salt in the water."], "key": 3, "why": "The tomato sinks because it is denser than plain water.<br>Dissolved salt stays in the water and adds mass to it, so salt water is denser than plain water.<br>Enough dissolved salt makes the water denser than the tomato, and an object less dense than the liquid floats.<br>More water, a smaller tomato and a gentler drop change neither density."}, {"d": "hard", "atom": "MAT-015", "stem": "A metalworker melts down a copper vase and casts two small copper bookends from it. Bruno says: \"Each bookend has the same density as the vase had.\" Which statement is correct?", "options": ["Bruno is correct: the bookends are still copper.", "Bruno is not correct: melting turned the copper into a new material with a new density.", "Bruno is not correct: each bookend has less mass than the vase, so each is less dense.", "Bruno is correct: melting always packs the metal more tightly."], "key": 0, "why": "Melting and hardening do not change the material, so the bookends are still copper.<br>Density belongs to the material, not to the size of the piece.<br>Each cubic centimeter of copper has a mass of 8.9 g, in the vase or in a bookend.<br>So Bruno is correct."}, {"d": "hard", "atom": "MAT-015", "fig": "pt_pawn_rook", "stem": "Anika reads the table. She says: \"The two chess pieces are made of the same kind of glass.\" Which statement is correct?", "options": ["Anika is correct: the rook just has more mass because it is bigger.", "Anika is correct: the same kind of glass can have any density.", "Anika is not correct: their densities differ, 2.5 g/cm³ and 3 g/cm³.", "Anika is not correct: two pieces of one glass must have the same mass."], "key": 2, "why": "Pawn: 50 g ÷ 20 cm³ = 2.5 g/cm³.<br>Rook: 90 g ÷ 30 cm³ = 3 g/cm³.<br>Two pieces of one material have the same density, whatever their size.<br>These densities differ, so the pawn and the rook are not the same kind of glass."}], "figs": {"stone_displacement": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 360\" style=\"width:100%;max-width:450px;height:auto\" role=\"img\" aria-label=\"Two graduated cylinders numbered every 10 mL from 0 mL to 100 mL with a small mark at each 5 mL: on the left the water reads 40 mL; on the right the stone sits under the water and the water reads 55 mL\" font-family=\"Helvetica,Arial,sans-serif\" font-size=\"13\" fill=\"#222\"><rect width=\"360\" height=\"360\" fill=\"#ffffff\"/><rect x=\"50\" y=\"40\" width=\"60\" height=\"240\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"1.5\"/><rect x=\"40\" y=\"280\" width=\"80\" height=\"7\" fill=\"#d9d9d9\" stroke=\"#222\"/><rect x=\"51\" y=\"184.0\" width=\"58\" height=\"95.0\" fill=\"#d9d9d9\"/><line x1=\"51\" y1=\"184.0\" x2=\"109\" y2=\"184.0\" stroke=\"#222\" stroke-width=\"1.2\"/><line x1=\"110\" y1=\"280.0\" x2=\"120\" y2=\"280.0\" stroke=\"#222\"/><text x=\"124\" y=\"284.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">0<\/text><line x1=\"110\" y1=\"256.0\" x2=\"120\" y2=\"256.0\" stroke=\"#222\"/><text x=\"124\" y=\"260.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal\" fill=\"#222\">10<\/text><line x1=\"110\" y1=\"232.0\" x2=\"120\" y2=\"232.0\" stroke=\"#222\"/><text x=\"124\" y=\"236.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"normal <script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => String(s).replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;');  // author text may carry <b> and <br>
let state = JSON.parse(localStorage.getItem('t01state')||'{}');
function save(){ localStorage.setItem('t01state', JSON.stringify(state)); }
function shuffle(a, seed){ let x = seed||1; const r = () => { x = (x*9301+49297)%233280; return x/233280; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function fig(step){
  if(step.t==='fig'){ return `<figure>${D.figs[step.key]||'<p>missing figure '+esc(step.key)+'</p>'}<figcaption>${esc(step.cap||'')}</figcaption></figure>`; }
  // a photo slot whose file is not yet sourced renders as a drawn placeholder box, never the browser's broken-image glyph (T11 adjudication, 2026-09-25)
  return `<figure><img src="img/photos/${esc(step.file)}" alt="${esc(step.cap)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-missing',textContent:'Photo to be sourced: '+this.alt}))"><figcaption>${esc(step.cap)}<span class="credit">${esc(step.credit||'')}</span></figcaption></figure>`;
}
function articleHTML(L){ return '<div class="article">' + L.article.map(st => st.t==='idea' ? `<p>${rich(st.text)}</p>` : st.t==='rule' ? `<p class="rule">${rich(st.text)}</p>` : st.t==='h' ? `<h3 class="sub">${rich(st.text)}</h3>` : fig(st)).join('') + '</div>'; }
function saysYourTurn(beats){ return beats && beats.length && /your turn/i.test(beats[beats.length-1].say||''); }  // the script may already carry the close as its last beat
function yourTurn(qs, idprefix){
  if(!qs || !qs.length) return '';
  return `<div class="yourturn"><p class="yt"><b>Okay, now your turn.</b> <span class="small">One easy question attached to the video — the XP gate. The real quiz follows.</span></p>` + qs.map((q,i)=>reg(q, `${idprefix}-v${i+1}`)).join('') + `</div>`;
}
function scriptHTML(L){
  const words = L.script.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">Narration, one beat per line; the right column is what appears on screen, on the word that names it. ${words} spoken words, about ${Math.round(words/2)} seconds. No title slide.</p><table>` +
    L.script.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (saysYourTurn(L.script) ? '' : `<tr><td class="n">${L.script.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>`) + `</table></div>` + yourTurn(L.video_question, L.id);
}
function itemHTML(q, id, opts){
  opts = opts||{};
  const tag = q.tag ? `<span class="tag">${esc(q.tag)}</span>` : '';
  const diff = q.d ? `<span class="diff">${esc(q.d)}</span>` : '';
  const qf = q.fig ? `<figure class="qfig">${D.figs[q.fig]||'<p>missing figure '+esc(q.fig)+'</p>'}</figure>` : '';
  if(q.type==='mcq' || q.d){
    const order = opts.shuffle ? shuffle(q.options.map((_,i)=>i), opts.seed||1) : q.options.map((_,i)=>i);
    const yesno = q.options.length<=3 && /^(yes|no|true|false|solid|liquid|gas)$/.test(q.options[0]);  // keep ordered sets in order
    const ord = yesno ? q.options.map((_,i)=>i) : order;
    return `<div class="item" id="${id}">${tag}${diff}${qf}<p class="stem">${rich(q.stem)}</p><div class="opts">` +
      ord.map(i=>`<button data-i="${i}" onclick="answer('${id}',${i})">${rich(q.options[i])}</button>`).join('') +
      `</div><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  if(q.type==='text'){
    return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.stem)}</p><input placeholder="Type your answer"><button onclick="typed('${id}')">Check</button><div class="fb hidden"></div><div class="why hidden">${rich(q.why||'')}</div></div>`;
  }
  return `<div class="item typed" id="${id}">${tag}${qf}<p class="stem">${rich(q.task)}</p><p class="small">Start your answer with: <i>${esc(q.starter)}</i> — write one short sentence per step.</p><textarea rows="4" placeholder="${esc(q.starter)}"></textarea><button onclick="reveal('${id}')">Show the model answer</button><div class="model hidden"><p><b>Model answer</b></p><p>${rich(q.model)}</p><p class="small">Points: ${q.points.map(esc).join(' · ')}. Mark yourself: one point for each step you gave.</p></div></div>`;
}
const ITEMS = {};
function reg(q, id){ ITEMS[id]=q; return itemHTML(q, id, {shuffle:true, seed:id.length*7+id.charCodeAt(id.length-1)}); }
window.answer = function(id, i){
  const q = ITEMS[id], el = document.getElementById(id); const btns = el.querySelectorAll('.opts button');
  btns.forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===q.key) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden');
  fb.textContent = (i===q.key ? 'Correct. ' : 'Not quite. ') + ((q.fb||[])[i] || '');
  el.querySelector('.why').classList.remove('hidden');
  state[id] = (i===q.key); save(); scoreboard();
};
window.typed = function(id){
  const q = ITEMS[id], el = document.getElementById(id);
  // exact match after normalising surface only: case, spacing, ³/^3, a trailing .0 on the number, a final period. A wrong or missing unit stays wrong.
  const cs = !!q.case;  // q.case: true → case-sensitive (chemical symbols: Mg, not mg — Topic 9)
  const norm = t => (cs ? t.trim() : t.trim().toLowerCase()).replace(/³|\^3/g,'3').replace(/[.!]$/,'').replace(/\s*\/\s*/g,'/').replace(/(\d)\s+(?=[a-z])/g,'$1').replace(/^(\d+)\.0(?=\D|$)/,'$1').replace(/\s+/g,' ');
  const v = norm(el.querySelector('input').value);
  const ok = q.accept.some(a => v===norm(a));  // exact match only: a wrong or missing unit is wrong (James, T04 blueprint decision 3)
  const fb = el.querySelector('.fb'); fb.classList.remove('hidden'); fb.textContent = ok ? 'Correct.' : 'Not quite. The answer we were looking for: ' + q.accept[0] + '.';
  el.querySelector('.why').classList.remove('hidden'); state[id]=ok; save(); scoreboard();
};
window.reveal = function(id){ document.getElementById(id).querySelector('.model').classList.remove('hidden'); };
function scoreboard(){ const s = document.getElementById('score'); if(!s) return; const ids = Object.keys(ITEMS).filter(k=>ITEMS[k].type!=='frq'); const done = ids.filter(k=>k in state); const right = done.filter(k=>state[k]); s.textContent = done.length ? `${right.length} of ${done.length} answered correctly` : ''; }
function scriptTable(beats, label, qs, idprefix){
  const words = beats.map(b=>b.say).join(' ').split(/\s+/).filter(Boolean).length;
  return `<div class="script"><p class="small">${label} — ${words} spoken words, about ${Math.round(words/2)} seconds.</p><table>` + beats.map((b,i)=>`<tr><td class="n">${i+1}</td><td>${esc(b.say)}</td><td class="scr">${esc(b.screen)}</td></tr>`).join('') +
    (qs && qs.length && !saysYourTurn(beats) ? `<tr><td class="n">${beats.length+1}</td><td><b>Okay, now your turn.</b></td><td class="scr">[the attached question appears]</td></tr>` : '') + '</table></div>' + yourTurn(qs, idprefix);
}
function tabs(L, which){ return `<div class="tabs"><button class="${which==='article'?'on':''}" onclick="location.hash='#/lesson/${L.id}/article'">Read the article</button><button class="${which==='script'?'on':''}" onclick="location.hash='#/lesson/${L.id}/script'">Watch the video (script)</button><button class="${which==='quiz'?'on':''}" onclick="location.hash='#/lesson/${L.id}/quiz'">Quiz</button></div>`; }
function render(){
  const h = location.hash || '#/'; const app = document.getElementById('app'); const parts = h.slice(2).split('/');
  for (const k in ITEMS) delete ITEMS[k];
  if(parts[0]===''){
    app.innerHTML = `<div class="card blurb"><h2>${esc(D.topic.title)}</h2>${D.topic.blurb.map(p=>`<p>${esc(p)}</p>`).join('')}<p class="small">${D.lessons.length} lessons. Each one is a short video or an article — your choice — then a quiz. At the end: mixed practice, then the PP100.</p></div>` +
      `<div class="card"><h2>Topic intro video</h2><p class="small">Very brief. Names the topic's objects and raises its question. Teaches nothing.</p>${scriptTable(D.topic.intro_script, 'Intro video script', D.topic.intro_question, 'INTRO')}</div>` +
      `<div class="card"><h2>Lessons</h2><div class="lesson-list">` + D.lessons.map((L,i)=>`<a href="#/lesson/${L.id}/article"><span class="num">${i+1}</span><span><span class="ltitle">${esc(L.title)}</span><br><span class="lmeta">${esc(L.atom)} · ${esc(L.video)}</span></span></a>`).join('') +
      `<a href="#/practice"><span class="num">✓</span><span><span class="ltitle">Mixed mastery practice</span><br><span class="lmeta">${D.practice.length} items, any format, key terms by recall</span></span></a>` +
      `<a href="#/summary"><span class="num">▶</span><span><span class="ltitle">Topic summary video</span><br><span class="lmeta">everything taught, in order, just before the PP100</span></span></a>` +
      `<a href="#/pp100"><span class="num">100</span><span><span class="ltitle">PP100</span><br><span class="lmeta">20 questions, easy → medium → hard</span></span></a></div></div>`;
  } else if(parts[0]==='lesson'){
    const L = D.lessons.find(x=>x.id===parts[1]); const which = parts[2]||'article'; const idx = D.lessons.indexOf(L);
    let body = '';
    if(which==='article') body = articleHTML(L);
    else if(which==='script') body = scriptHTML(L);
    else body = `<div class="quiz"><p class="small">The same quiz follows the video and the article — about ten items; repetition with a varied surface builds fluency.</p>` + L.quiz.map((q,i)=>reg(q, `${L.id}-q${i+1}`)).join('') + `<p class="score" id="score"></p></div>`;
    const prev = idx>0 ? `<a href="#/lesson/${D.lessons[idx-1].id}/article">← ${esc(D.lessons[idx-1].title)}</a>` : `<a href="#/">← Topic</a>`;
    const next = idx<D.lessons.length-1 ? `<a href="#/lesson/${D.lessons[idx+1].id}/article">${esc(D.lessons[idx+1].title)} →</a>` : `<a href="#/practice">Mixed practice →</a>`;
    app.innerHTML = `<div class="card"><p class="small">Lesson ${idx+1} of ${D.lessons.length} · ${esc(L.atom)}</p><h2>${esc(L.title)}</h2>${tabs(L, which)}${body}<div class="nav">${prev}${next}</div>` +
      `<div class="forjames"><b>For James.</b> Lesson type: ${esc(L.lesson_type)}. Video call: <b>${esc(L.video)}</b> (a script is written either way). Check design: ${esc(L.check_design)}${L.forest && L.forest.length ? ' Forest line: <i>' + L.forest.map(esc).join(' ') + '</i>' : ''}</div></div>`;
    scoreboard();
  } else if(parts[0]==='practice'){
    app.innerHTML = `<div class="card"><h2>Mixed mastery practice</h2><p class="small">Every lesson in the topic, in a mixed order. Key terms are asked by recall: you type the word. Written answers are marked against a model answer.</p><div class="quiz">` + D.practice.map((q,i)=>reg(q,`PR-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/">← Topic</a><a href="#/summary">Summary video →</a></div></div>`; scoreboard();
  } else if(parts[0]==='summary'){
    app.innerHTML = `<div class="card"><h2>Topic summary video</h2>${scriptTable(D.topic.summary_script, 'Summary video script', D.topic.summary_question, 'SUMMARY')}<div class="nav"><a href="#/practice">← Practice</a><a href="#/pp100">PP100 →</a></div></div>`;
  } else if(parts[0]==='pp100'){
    app.innerHTML = `<div class="card"><h2>PP100 — ${esc(D.topic.title)}</h2><p class="small">Twenty questions, four options each, from easy to hard. Your first answer counts.</p><div class="quiz">` + D.pp100.map((q,i)=>reg(Object.assign({type:'mcq'}, q), `PP-q${i+1}`)).join('') + `<p class="score" id="score"></p></div><div class="nav"><a href="#/practice">← Practice</a><a href="#/">Topic →</a></div></div>`; scoreboard();
  } else if(parts[0]==='james'){
    app.innerHTML = `<div class="card"><h2>For James — what this page is</h2><p>This is ${D.topic.code.startsWith('T') ? 'Topic ' + parseInt(D.topic.code.replace(/\D/g,'')) : D.topic.title} built out as students would meet it${D.lessons.length ? ': a brief intro video, ' + D.lessons.length + ' lessons, each an article' : ': a test bank (the items below), from which forms are drawn'} and a video script (no video has been sent to the pipeline), each followed by its quiz; then the mixed practice, the summary video, and the PP100.</p>
      <h3>The topic's fixed sentences (the lexicon)</h3><ul class="lexicon">${D.topic.lexicon.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h3>Coined terms</h3><ul class="lexicon">${Object.entries(D.topic.terms).map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join('')}</ul>
      <h3>Video calls</h3><ul class="lexicon">${D.lessons.map(L=>`<li>${esc(L.id)} ${esc(L.title)} — <b>${esc(L.video)}</b></li>`).join('')}</ul>
      <p class="small">Records, blind bundle and review tables: ${D.topic.code.startsWith('T') ? 'topic' + String(parseInt(D.topic.code.replace(/\D/g,''))).padStart(2,'0') + '_build' : 'checkpoints/' + D.topic.code.toLowerCase()}/records and …/blind in the course folder.</p></div>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render); render();
</script></body></html>
