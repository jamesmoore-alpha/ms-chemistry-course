", "stem": "A lump of coal has a mass of 30 g. Water reads 50 mL before the coal goes under and 75 mL after. What is the coal's volume, in cm³?", "accept": ["25 cm³", "25", "25 cm3", "25 cubic centimeters"], "why": "The mass plays no part in finding the volume.<br>Volume of the solid equals end reading minus start reading: 75 mL − 50 mL = 25 mL.<br>Each 1 mL displaced means 1 cm³ of solid, so the coal's volume is 25 cm³."}, {"type": "mcq", "tag": "transfer", "stem": "Hugo and Ines each measure the same pebble by displacement. Hugo starts with 30 mL of water and Ines with 60 mL. How do the two volumes they measure compare?", "options": ["Hugo's is larger.", "Ines's is larger.", "The two volumes are the same."], "key": 2, "fb": ["The pebble pushes aside its own volume of water whatever the start reading.", "More water at the start does not change how much the pebble pushes aside.", "The pebble displaces its own volume of water in both cylinders."], "why": "The pebble pushes aside exactly its own volume of water.<br>The start reading does not change the pebble.<br>Both students find the same rise, so both measure the same volume."}, {"type": "mcq", "tag": "misconception", "stem": "Zara lowers a glass ornament into a graduated cylinder of water, and the level rises by 15 mL. Zara says: \"So the ornament's mass is 15 g.\" Is Zara correct?", "options": ["yes", "no"], "key": 1, "fb": ["The rise in the water level is a volume, not a mass. The ornament displaced 15 mL, so its volume is 15 cm³.", "The rise in the water level is a volume, not a mass. The ornament displaced 15 mL, so its volume is 15 cm³."], "why": "The ornament pushed aside 15 mL of water.<br>Each 1 mL displaced means 1 cm³ of solid, so its volume is 15 cm³.<br>Only a balance measures the mass, so Zara is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The water rose from 40 mL to 55 mL when the stone went under. What is the stone's volume?", "options": ["15 cm³", "40 cm³", "55 cm³"], "key": 0, "fb": ["55 mL − 40 mL = 15 mL, and each 1 mL displaced means 1 cm³ of solid.", "40 mL is the start reading, the water alone.", "55 mL is the end reading, the water and the stone together."], "why": "Volume of the solid equals end reading minus start reading.<br>55 mL − 40 mL = 15 mL.<br>Each 1 mL displaced means 1 cm³ of solid, so the stone's volume is 15 cm³."}]}, {"id": "L02", "atom": "MAT-009", "title": "Which is denser?", "video": "definitely a video", "lesson_type": "Example-sequence comparison lesson (same volume, more mass; same mass, less volume); coins the term density", "check_design": "Type (a) one-step comparison → one recall MCQ each for mass (T3 L02) and volume (T3 L03), the coined term (typed, then a meaning MCQ), then a fluency quiz: which is denser ×7 from a two-object table of mass and volume, one quantity matching in each pair (three same-volume, three same-mass, one equal pair), then two student-claim items (same mass so same density, key no; more mass so denser, key no).", "headache": ["Two blocks sit on a table, exactly the same size.", "One block is steel; the other is oak.", "A student lifts each one: the steel block is far harder to lift.", "On a balance the steel block reads 400 g and the oak block reads 35 g.", "Same size, but not the same mass. What is different about the steel?"], "forest": ["Why can two objects of the same size have different masses?", "The steel packs more mass into the same volume.", "How much mass a material packs into each cubic centimeter is called its density.", "Same volume, more mass: the steel is denser than the oak.", "Same mass, less volume: also denser."], "article": [{"t": "idea", "text": "Two blocks sit on a table, exactly the same size."}, {"t": "idea", "text": "One block is steel; the other block is oak."}, {"t": "idea", "text": "A student lifts each block."}, {"t": "idea", "text": "The steel block is far harder to lift."}, {"t": "idea", "text": "She puts each block on a balance."}, {"t": "idea", "text": "The steel block reads 400 g; the oak block reads 35 g."}, {"t": "idea", "text": "The two blocks have the same size but not the same mass."}, {"t": "idea", "text": "What is different about the steel?"}, {"t": "h", "text": "Mass and volume, again"}, {"t": "idea", "text": "Mass is the amount of material in something, read in grams on a balance."}, {"t": "idea", "text": "Volume is the amount of space something takes up."}, {"t": "idea", "text": "She measures each block: each block has a volume of 50 cm³."}, {"t": "fig", "key": "blocks_balance", "cap": "Two blocks exactly the same size, 50 cm³ each. The steel block reads 400 g. The oak block reads 35 g."}, {"t": "h", "text": "Same volume, more mass"}, {"t": "idea", "text": "The steel block packs 400 g into 50 cm³."}, {"t": "idea", "text": "The oak block packs only 35 g into the same 50 cm³."}, {"t": "idea", "text": "So the steel packs far more mass into each cubic centimeter than the oak does."}, {"t": "idea", "text": "How much mass a material packs into each cubic centimeter is called its <b>density<\/b>."}, {"t": "idea", "text": "The steel packs more mass into the same volume, so steel is denser than oak."}, {"t": "idea", "text": "Same volume and more mass means denser."}, {"t": "h", "text": "Same mass, less volume"}, {"t": "idea", "text": "Now consider a steel ball and a glass ball."}, {"t": "idea", "text": "Both balls read 40 g on the balance."}, {"t": "idea", "text": "The glass ball is much bigger."}, {"t": "idea", "text": "By displacement, the steel ball's volume is 5 cm³ and the glass ball's volume is 16 cm³."}, {"t": "idea", "text": "The steel ball packs the same 40 g into far less space."}, {"t": "idea", "text": "So the steel ball is denser than the glass ball."}, {"t": "idea", "text": "Same mass and less volume means denser."}, {"t": "fig", "key": "balls_balance", "cap": "Two balls with the same mass, 40 g each. The steel ball has a volume of 5 cm³. The bigger glass ball has a volume of 16 cm³."}, {"t": "h", "text": "Comparing without calculating"}, {"t": "idea", "text": "When two objects have the same volume, the one with more mass is denser."}, {"t": "idea", "text": "When two objects have the same mass, the one with less volume is denser."}, {"t": "idea", "text": "When neither the masses nor the volumes match, this comparison cannot decide."}, {"t": "fig", "key": "density_pairs_table", "cap": "The two pairs in one table. The blocks share a volume, and the steel has more mass. The balls share a mass, and the steel has less volume. Steel is denser both times."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Density is how much mass a material packs into each cubic centimeter. Same volume and more mass means denser. Same mass and less volume means denser."}, {"t": "idea", "text": "Back to the two blocks: same volume, and the steel has far more mass."}, {"t": "idea", "text": "So steel is denser than oak."}], "script": [{"say": "Two blocks sit on a table, exactly the same size: one steel, one oak.", "screen": "[two blocks side by side; labels STEEL, OAK]"}, {"say": "A student lifts them, and the steel block is far harder to lift.", "screen": "[a hand lifts each; the steel one barely moves]"}, {"say": "On a balance, the steel reads four hundred grams and the oak thirty-five.", "screen": "[two balances: 400 g, 35 g]"}, {"say": "Same size, but not the same mass: what is different about the steel?", "screen": "[question mark]"}, {"say": "Each block has a volume of fifty cubic centimeters.", "screen": "[labels: 50 cm³ under each block]"}, {"say": "The steel packs four hundred grams into that space; the oak packs only thirty-five.", "screen": "[chips: 400 g IN 50 cm³; 35 g IN 50 cm³]"}, {"say": "So the steel packs far more mass into each cubic centimeter.", "screen": "[zoom on one 1 cm cube of each block]"}, {"say": "How much mass a material packs into each cubic centimeter is called its density.", "screen": "[chip: DENSITY]"}, {"say": "Same volume and more mass means denser: steel is denser than oak.", "screen": "[verdict: STEEL IS DENSER]"}, {"say": "Now consider a steel ball and a glass ball that both read forty grams.", "screen": "[two balances, both 40 g; small dark ball, bigger clear ball]"}, {"say": "The steel ball is five cubic centimeters; the glass ball is sixteen.", "screen": "[labels: 5 cm³, 16 cm³]"}, {"say": "The steel packs the same mass into less space, so the steel ball is denser.", "screen": "[verdict: STEEL IS DENSER]"}, {"say": "So here is the rule: same volume and more mass means denser; same mass and less volume means denser.", "screen": "[rule slide reuses the table of the two pairs; rule text]"}, {"say": "Back to the blocks: same volume, far more mass, so steel is denser than oak.", "screen": "[the two blocks on their balances]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A balance reads 3 kg for a watermelon. What does the reading tell you?", "options": ["how much space the watermelon takes up", "how much material is in the watermelon"], "key": 1, "fb": ["A balance does not measure space. The amount of space something takes up is its volume.", "A balance measures mass: the amount of material in the thing on it."], "why": "A balance measures mass.<br>Mass is the amount of material in something.<br>So 3 kg is the amount of material in the watermelon."}, {"type": "mcq", "tag": "recall", "stem": "What is the volume of a shoe box?", "options": ["the amount of material in the box", "the amount of space the box takes up", "how long the box is"], "key": 1, "fb": ["The amount of material in something is its mass.", "Volume is the amount of space something takes up.", "Length is one distance. Volume is the amount of space something takes up."], "why": "Volume is the amount of space something takes up.<br>So the box's volume is the amount of space the box takes up."}, {"type": "text", "tag": "term", "stem": "How much mass a material packs into each cubic centimeter is called its…", "accept": ["density"], "why": "How much mass a material packs into each cubic centimeter is called its density."}, {"type": "mcq", "tag": "term", "stem": "What is density?", "options": ["the amount of space an object takes up", "the amount of material in an object", "the mass packed into each cubic centimeter"], "key": 2, "fb": ["The amount of space something takes up is its volume.", "The amount of material in something is its mass.", "Density is how much mass a material packs into each cubic centimeter."], "why": "Density is how much mass a material packs into each cubic centimeter."}, {"type": "mcq", "tag": "fluency", "fig": "pt_brass_pine", "stem": "Which is denser?", "options": ["The brass block is denser.", "The pine block is denser.", "The two blocks have the same density."], "key": 0, "fb": ["Same volume, and the brass has more mass.", "The pine has less mass in the same volume.", "The volumes match, but the masses differ."], "why": "Both blocks have a volume of 20 cm³.<br>The brass block has more mass: 170 g against 10 g.<br>Same volume and more mass means denser, so the brass block is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_candle_sinker", "stem": "Which is denser?", "options": ["The candle stub is denser.", "The lead sinker is denser.", "The candle stub and the sinker have the same density."], "key": 1, "fb": ["The candle stub has less mass in the same volume.", "Same volume, and the lead sinker has more mass.", "The volumes match, but the masses differ."], "why": "Both have a volume of 10 cm³.<br>The lead sinker has more mass: 113 g against 9 g.<br>Same volume and more mass means denser, so the lead sinker is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_hinge_ruler", "stem": "Which is denser?", "options": ["The steel hinge is denser.", "The maple ruler is denser.", "The hinge and the ruler have the same density."], "key": 0, "fb": ["Same mass, and the hinge packs it into less volume.", "The ruler spreads the same mass over more volume.", "The masses match, but the volumes differ."], "why": "Both have a mass of 56 g.<br>The steel hinge has less volume: 7 cm³ against 80 cm³.<br>Same mass and less volume means denser, so the steel hinge is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_soap_pebble", "stem": "Which is denser?", "options": ["The bar of soap is denser.", "The glass pebble is denser.", "The soap and the pebble have the same density."], "key": 1, "fb": ["The soap spreads the same mass over more volume.", "Same mass, and the pebble packs it into less volume.", "The masses match, but the volumes differ."], "why": "Both have a mass of 25 g.<br>The glass pebble has less volume: 10 cm³ against 25 cm³.<br>Same mass and less volume means denser, so the glass pebble is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_brick_copper", "stem": "Which is denser?", "options": ["The piece of brick is denser.", "The copper fitting is denser.", "The brick and the fitting have the same density."], "key": 1, "fb": ["The brick has less mass in the same volume.", "Same volume, and the copper has more mass.", "The volumes match, but the masses differ."], "why": "Both have a volume of 50 cm³.<br>The copper fitting has more mass: 445 g against 95 g.<br>Same volume and more mass means denser, so the copper fitting is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_ice_cork", "stem": "Which is denser?", "options": ["The ice cube is denser.", "The cork stopper is denser.", "The ice cube and the cork have the same density."], "key": 0, "fb": ["Same volume, and the ice has more mass.", "The cork has less mass in the same volume.", "The volumes match, but the masses differ."], "why": "Both have a volume of 30 cm³.<br>The ice cube has more mass: 27 g against 6 g.<br>Same volume and more mass means denser, so the ice cube is denser."}, {"type": "mcq", "tag": "fluency", "fig": "pt_maple_beech", "stem": "Which is denser?", "options": ["The maple spoon is denser.", "The beech spoon is denser.", "The two spoons have the same density."], "key": 2, "fb": ["The two spoons have the same mass and the same volume.", "The two spoons have the same mass and the same volume.", "Same mass in the same volume means the same density."], "why": "Both spoons have a mass of 35 g.<br>Both spoons have a volume of 50 cm³.<br>Same mass packed into the same volume means the same density."}, {"type": "mcq", "tag": "misconception", "fig": "pt_ring_coaster", "stem": "Malik reads the table. He says: \"The ring and the coaster have the same mass, so they have the same density.\" Is Malik correct?", "options": ["yes", "no"], "key": 1, "fb": ["The masses match, but the ring packs its 21 g into 2 cm³ and the coaster spreads its 21 g over 105 cm³.", "The masses match, but the ring packs its 21 g into 2 cm³ and the coaster spreads its 21 g over 105 cm³."], "why": "Both have a mass of 21 g.<br>The silver ring has far less volume: 2 cm³ against 105 cm³.<br>Same mass and less volume means denser, so the ring is denser and Malik is not correct."}, {"type": "mcq", "tag": "misconception", "fig": "pt_feathers_pebble", "stem": "Elena reads the table. She says: \"The bag of feathers has more mass, so the feathers are denser.\" Is Elena correct?", "options": ["yes", "no"], "key": 1, "fb": ["More mass means denser only when the volumes match. The bag spreads 300 g over 30,000 cm³; the pebble packs 135 g into 50 cm³.", "More mass means denser only when the volumes match. The bag spreads 300 g over 30,000 cm³; the pebble packs 135 g into 50 cm³."], "why": "More mass means denser only when the volumes are the same.<br>The bag spreads its 300 g over 30,000 cm³.<br>The pebble packs its 135 g into 50 cm³, far more mass in each cubic centimeter.<br>So the pebble is denser, and Elena is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The steel block and the oak block are the same size. The steel reads 400 g and the oak 35 g. Which is denser?", "options": ["The steel block is denser.", "The oak block is denser.", "The two blocks have the same density."], "key": 0, "fb": ["Same volume, and the steel has far more mass.", "The oak has far less mass in the same volume.", "The volumes match, but the masses differ."], "why": "The two blocks have the same volume.<br>The steel block has far more mass: 400 g against 35 g.<br>Same volume and more mass means denser, so the steel block is denser."}]}, {"id": "L03", "atom": "MAT-010", "title": "Calculate density", "video": "could do without a video", "lesson_type": "Simple three-term equation lesson (density = mass ÷ volume) with the worked form on the page; coins the unit g/cm³", "check_design": "Type (b) multi-step routine → one recall MCQ (L02: same volume, more mass is denser) and one recall typed item (L01: mL to cm³), the unit (MCQ, then a meaning MCQ), then the worked example on the page in the worked form → four step items on a fresh case (which equation; which substitution; calculate; which unit) → two bare typed densities with clean division → one with the volume found by displacement first → one student-claim item (divided the wrong way; key no).", "headache": ["A steel cube has a mass of 48 g and a volume of 6 cm³.", "An oak block has a mass of 56 g and a volume of 80 cm³.", "Neither the masses nor the volumes match.", "So comparing without calculating cannot tell you which is denser.", "How dense is each one, as a number?"], "forest": ["How do you turn \"denser\" into a number?", "Share the mass out over the volume: density equals mass divided by volume.", "The steel's density is 48 g ÷ 6 cm³, which equals 8 g/cm³.", "The oak's density is 56 g ÷ 80 cm³, which equals 0.7 g/cm³.", "The unit says it: grams per cubic centimeter."], "article": [{"t": "idea", "text": "A steel cube has a mass of 48 g."}, {"t": "idea", "text": "The steel cube has a volume of 6 cm³."}, {"t": "idea", "text": "An oak block has a mass of 56 g."}, {"t": "idea", "text": "The oak block has a volume of 80 cm³."}, {"t": "idea", "text": "The masses do not match, and the volumes do not match."}, {"t": "idea", "text": "So comparing without calculating cannot tell you which is denser."}, {"t": "idea", "text": "How dense is each one, as a number?"}, {"t": "h", "text": "Density, again"}, {"t": "idea", "text": "Density is how much mass a material packs into each cubic centimeter."}, {"t": "idea", "text": "Each 1 mL of water displaced means 1 cm³ of solid."}, {"t": "h", "text": "Share the mass out over the volume"}, {"t": "idea", "text": "The steel cube packs 48 g into 6 cm³."}, {"t": "idea", "text": "The 48 g is shared out equally between the 6 cubic centimeters."}, {"t": "idea", "text": "Each cubic centimeter gets 48 g ÷ 6, which is 8 g."}, {"t": "idea", "text": "So each cubic centimeter of steel has a mass of 8 g."}, {"t": "idea", "text": "The steel's density is 8 grams per cubic centimeter."}, {"t": "idea", "text": "Grams per cubic centimeter is written <b>g/cm³<\/b>."}, {"t": "fig", "key": "worked_form_steel", "cap": "The steel cube's density in the worked form: the values, the equation, the substitution, the calculation, and the answer with its unit."}, {"t": "h", "text": "The equation"}, {"t": "idea", "text": "To find a density, divide the mass by the volume."}, {"t": "idea", "text": "Written as an equation: density equals mass divided by volume."}, {"t": "fig", "key": "density_equation", "cap": "The equation density = mass ÷ volume, with each term labelled: density in g/cm³, mass in g, volume in cm³."}, {"t": "idea", "text": "The mass is in grams."}, {"t": "idea", "text": "The volume is in cubic centimeters."}, {"t": "idea", "text": "So the density comes out in grams per cubic centimeter, g/cm³."}, {"t": "h", "text": "The same steps for the oak"}, {"t": "idea", "text": "The oak block packs 56 g into 80 cm³."}, {"t": "idea", "text": "Divide the mass by the volume: 56 g ÷ 80 cm³."}, {"t": "idea", "text": "Each cubic centimeter of oak has a mass of 0.7 g."}, {"t": "idea", "text": "So the oak's density is 0.7 g/cm³."}, {"t": "fig", "key": "worked_form_oak", "cap": "The oak block's density in the same five lines: 56 g ÷ 80 cm³ = 0.7 g/cm³."}, {"t": "idea", "text": "Steel at 8 g/cm³ is denser than oak at 0.7 g/cm³."}, {"t": "h", "text": "A third example"}, {"t": "idea", "text": "Now consider an aluminum bar with a mass of 81 g and a volume of 30 cm³."}, {"t": "idea", "text": "Divide the mass by the volume: 81 g ÷ 30 cm³ equals 2.7 g/cm³."}, {"t": "fig", "key": "worked_form_aluminum", "cap": "The aluminum bar's density in the same five lines: 81 g ÷ 30 cm³ = 2.7 g/cm³."}, {"t": "fig", "key": "density_table", "cap": "The three materials in one table. Steel: 8 g/cm³. Oak: 0.7 g/cm³. Aluminum: 2.7 g/cm³."}, {"t": "h", "text": "Writing out a calculation"}, {"t": "idea", "text": "Every time, write the calculation in the same five lines."}, {"t": "idea", "do": true, "text": "<b>1.<\/b> Write down the values given, each with its unit."}, {"t": "idea", "do": true, "text": "<b>2.<\/b> Write down the equation."}, {"t": "idea", "do": true, "text": "<b>3.<\/b> Substitute the values into the equation."}, {"t": "idea", "do": true, "text": "<b>4.<\/b> Calculate."}, {"t": "idea", "do": true, "text": "<b>5.<\/b> Write the answer with its unit."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Density equals mass divided by volume. Divide the mass in grams by the volume in cubic centimeters, and the density comes out in grams per cubic centimeter (g/cm³)."}, {"t": "idea", "text": "Back to the cube and the block: 48 g ÷ 6 cm³ equals 8 g/cm³."}, {"t": "idea", "text": "And 56 g ÷ 80 cm³ equals 0.7 g/cm³."}, {"t": "idea", "text": "So the steel is denser: 8 g/cm³ against 0.7 g/cm³."}], "script": [{"say": "A steel cube has a mass of forty-eight grams and a volume of six cubic centimeters.", "screen": "[steel cube; chips: 48 g, 6 cm³]"}, {"say": "An oak block has a mass of fifty-six grams and a volume of eighty cubic centimeters.", "screen": "[oak block; chips: 56 g, 80 cm³]"}, {"say": "Neither the masses nor the volumes match, so comparing without calculating cannot decide.", "screen": "[the two pairs of chips; cross over the comparison]"}, {"say": "How dense is each one, as a number?", "screen": "[question mark]"}, {"say": "The steel packs forty-eight grams into six cubic centimeters.", "screen": "[the cube split into six 1 cm cubes]"}, {"say": "Share the forty-eight grams equally between the six: each cubic centimeter gets eight grams.", "screen": "[8 g lands on each small cube]"}, {"say": "So the steel's density is eight grams per cubic centimeter.", "screen": "[chip: 8 g/cm³; the unit spelled out beneath]"}, {"say": "To find a density, divide the mass by the volume: density equals mass divided by volume.", "screen": "[equation: density = mass ÷ volume, terms labelled]"}, {"say": "Now the oak: fifty-six divided by eighty gives zero point seven grams per cubic centimeter.", "screen": "[worked form for the oak fills line by line]"}, {"say": "Now consider an aluminum bar: eighty-one grams divided by thirty cubic centimeters gives two point seven.", "screen": "[aluminum bar; worked form; 2.7 g/cm³]"}, {"say": "Every time, write the values, the equation, the substitution, the calculation, and the answer with its unit.", "screen": "[the five line labels appear in turn]"}, {"say": "So here is the rule: density equals mass divided by volume, in grams per cubic centimeter.", "screen": "[rule slide reuses the equation; rule text]"}, {"say": "Back to the cube and the block: eight against zero point seven, so the steel is denser.", "screen": "[table: steel 8 g/cm³, oak 0.7 g/cm³]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "Two objects have the same volume. Which one is denser?", "options": ["the one with more mass", "the one with less mass"], "key": 0, "fb": ["Same volume and more mass means denser.", "Less mass in the same volume means less dense."], "why": "Density is how much mass a material packs into each cubic centimeter.<br>Same volume and more mass means denser."}, {"type": "text", "tag": "recall", "stem": "A pebble displaces 12 mL of water. What is the pebble's volume, in cm³?", "accept": ["12 cm³", "12", "12 cm3", "12 cubic centimeters"], "why": "Each 1 mL of water displaced means 1 cm³ of solid.<br>The pebble displaced 12 mL, so its volume is 12 cm³."}, {"type": "mcq", "tag": "term", "stem": "Which unit is a density written in?", "options": ["g", "cm³", "g/cm³"], "key": 2, "fb": ["Grams are the unit of mass.", "Cubic centimeters are the unit of volume.", "Grams per cubic centimeter: the mass in each cubic centimeter."], "why": "Density equals mass divided by volume.<br>The mass is in g and the volume is in cm³, so the density is in g/cm³."}, {"type": "mcq", "tag": "term", "stem": "A material has a density of 2.5 g/cm³. What does that mean?", "options": ["The whole piece has a mass of 2.5 g.", "The whole piece has a volume of 2.5 cm³.", "Each cubic centimeter has a mass of 2.5 g."], "key": 2, "fb": ["A density is not the mass of the whole piece. It is the mass in each cubic centimeter.", "A density is not a volume. It is the mass in each cubic centimeter.", "Grams per cubic centimeter: each cubic centimeter of the material has a mass of 2.5 g."], "why": "Density is how much mass a material packs into each cubic centimeter.<br>2.5 g/cm³ means each cubic centimeter has a mass of 2.5 g."}, {"type": "mcq", "tag": "scaffold", "stem": "A glass block has a mass of 50 g and a volume of 20 cm³. Which equation gives its density?", "options": ["density = mass ÷ volume", "density = volume ÷ mass", "density = mass × volume"], "key": 0, "fb": ["Density is the mass shared out over the volume, so divide the mass by the volume.", "Dividing the volume by the mass gives the space for each gram, not the mass in each cubic centimeter.", "Multiplying does not share the mass out over the volume."], "why": "Density is how much mass a material packs into each cubic centimeter.<br>To share the mass out over the volume, divide the mass by the volume.<br>So density = mass ÷ volume."}, {"type": "mcq", "tag": "scaffold", "stem": "A glass block has a mass of 50 g and a volume of 20 cm³. Which line substitutes the values correctly?", "options": ["density = 20 cm³ ÷ 50 g", "density = 50 g ÷ 20 cm³", "density = 50 g × 20 cm³"], "key": 1, "fb": ["The mass goes first: mass ÷ volume.", "Mass ÷ volume: 50 g ÷ 20 cm³.", "The equation divides; it does not multiply."], "why": "The equation is density = mass ÷ volume.<br>Put the mass, 50 g, in place of mass and the volume, 20 cm³, in place of volume.<br>So density = 50 g ÷ 20 cm³."}, {"type": "text", "tag": "scaffold", "stem": "A glass block has a mass of 50 g and a volume of 20 cm³. Calculate its density, in g/cm³.", "accept": ["2.5 g/cm³", "2.5", "2.5 g/cm3", "2.5 grams per cubic centimeter"], "why": "Values: mass = 50 g, volume = 20 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 50 g ÷ 20 cm³.<br>Calculate: 50 ÷ 20 = 2.5.<br>Answer: density = 2.5 g/cm³."}, {"type": "mcq", "tag": "scaffold", "stem": "A glass block's density comes out as 2.5. Which is the answer written with its unit?", "options": ["2.5 g", "2.5 cm³", "2.5 g/cm³"], "key": 2, "fb": ["Grams alone is a mass.", "Cubic centimeters alone is a volume.", "Mass in grams divided by volume in cubic centimeters gives grams per cubic centimeter."], "why": "The mass was in g and the volume was in cm³.<br>Dividing g by cm³ gives g/cm³.<br>So the answer is 2.5 g/cm³."}, {"type": "text", "tag": "bare", "stem": "A copper pipe has a mass of 178 g and a volume of 20 cm³. What is the density of copper, in g/cm³?", "accept": ["8.9 g/cm³", "8.9", "8.9 g/cm3", "8.9 grams per cubic centimeter"], "why": "Values: mass = 178 g, volume = 20 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 178 g ÷ 20 cm³.<br>Calculate: 178 ÷ 20 = 8.9.<br>Answer: density = 8.9 g/cm³."}, {"type": "text", "tag": "bare", "stem": "A pine board has a mass of 25 g and a volume of 50 cm³. What is the density of pine, in g/cm³?", "accept": ["0.5 g/cm³", "0.5", ".5", "0.5 g/cm3", "0.5 grams per cubic centimeter"], "why": "Values: mass = 25 g, volume = 50 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 25 g ÷ 50 cm³.<br>Calculate: 25 ÷ 50 = 0.5.<br>Answer: density = 0.5 g/cm³."}, {"type": "text", "tag": "bare", "stem": "A granite pebble has a mass of 54 g. Water in a graduated cylinder reads 40 mL before the pebble goes under and 60 mL after. What is the density of granite, in g/cm³?", "accept": ["2.7 g/cm³", "2.7", "2.7 g/cm3", "2.7 grams per cubic centimeter"], "why": "First the volume: 60 mL − 40 mL = 20 mL, so the pebble's volume is 20 cm³.<br>Values: mass = 54 g, volume = 20 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 54 g ÷ 20 cm³.<br>Calculate: 54 ÷ 20 = 2.7.<br>Answer: density = 2.7 g/cm³."}, {"type": "mcq", "tag": "misconception", "stem": "A brick has a mass of 190 g and a volume of 100 cm³. Layla says: \"Density is volume divided by mass, so I work out 100 ÷ 190.\" Is Layla correct?", "options": ["yes", "no"], "key": 1, "fb": ["Density is mass divided by volume: 190 g ÷ 100 cm³ = 1.9 g/cm³.", "Density is mass divided by volume: 190 g ÷ 100 cm³ = 1.9 g/cm³."], "why": "Density is how much mass a material packs into each cubic centimeter.<br>So the mass is divided by the volume, not the other way round.<br>190 g ÷ 100 cm³ = 1.9 g/cm³, and Layla is not correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The steel cube packs 48 g into 6 cm³. What is the steel's density?", "options": ["8 g/cm³", "42 g/cm³", "288 g/cm³"], "key": 0, "fb": ["48 g ÷ 6 cm³ = 8 g/cm³.", "48 − 6 = 42, but density is mass divided by volume, not mass minus volume.", "48 × 6 = 288, but density is mass divided by volume, not mass times volume."], "why": "Density equals mass divided by volume.<br>48 g ÷ 6 cm³ = 8 g/cm³."}]}, {"id": "L04", "atom": "MAT-011", "title": "Will it sink or float?", "video": "definitely a video", "lesson_type": "Example-sequence prediction lesson (compare two densities); no term coined", "check_design": "Type (a) one-step comparison → one recall MCQ (L03: what a density number tells you) and one recall MCQ (grade 5: a steel spoon sinks), then a fluency quiz: sink or float ×8, each from a two-row table of the object's density and the liquid's density (two same-object pairs in two liquids), then a student-claim item (more mass sinks; key no) and a transfer item (denser than water, less dense than honey).", "headache": ["A student drops a steel bolt into a bucket of water, and it sinks.", "She drops a block of wood in, and it floats.", "Then she drops a small plastic bead into the water, and it floats.", "She drops the same bead into a bucket of cooking oil, and it sinks.", "Same bead, two liquids, two outcomes. What decides?"], "forest": ["What decides whether something sinks or floats?", "Compare the object's density with the liquid's density.", "An object denser than the liquid sinks; an object less dense than the liquid floats.", "The bead at 0.95 g/cm³ is less dense than water at 1.0 g/cm³, so it floats in water.", "Cooking oil is 0.92 g/cm³, so the same bead sinks in oil."], "article": [{"t": "idea", "text": "A student drops a steel bolt into a bucket of water, and the bolt sinks."}, {"t": "idea", "text": "She drops a block of wood into the water, and the wood floats."}, {"t": "idea", "text": "Then she drops a small plastic bead into the water, and the bead floats."}, {"t": "idea", "text": "She drops the same bead into a bucket of cooking oil, and the bead sinks."}, {"t": "idea", "text": "The same bead floats in one liquid and sinks in the other."}, {"t": "idea", "text": "What decides whether something sinks or floats?"}, {"t": "fig", "key": "two_buckets", "cap": "Left: in water, the bolt sinks while the wood and the bead float. Right: in cooking oil, the same bead sinks. The densities are written on the drawing."}, {"t": "h", "text": "Density, again"}, {"t": "idea", "text": "Density equals mass divided by volume, in g/cm³."}, {"t": "idea", "text": "Water has a density of 1.0 g/cm³."}, {"t": "h", "text": "Compare the object with the liquid"}, {"t": "idea", "text": "The steel bolt has a density of 8 g/cm³."}, {"t": "idea", "text": "Steel at 8 g/cm³ is denser than water at 1.0 g/cm³, so the bolt sinks."}, {"t": "idea", "text": "The wood has a density of 0.7 g/cm³."}, {"t": "idea", "text": "Wood at 0.7 g/cm³ is less dense than water at 1.0 g/cm³, so the wood floats."}, {"t": "h", "text": "The bead in two liquids"}, {"t": "idea", "text": "The bead has a density of 0.95 g/cm³."}, {"t": "idea", "text": "The bead at 0.95 g/cm³ is less dense than water at 1.0 g/cm³."}, {"t": "idea", "text": "So the bead floats in water."}, {"t": "idea", "text": "Cooking oil has a density of 0.92 g/cm³."}, {"t": "idea", "text": "The bead at 0.95 g/cm³ is denser than cooking oil at 0.92 g/cm³."}, {"t": "idea", "text": "So the bead sinks in oil."}, {"t": "idea", "text": "The bead stayed the same, so the liquid made the difference."}, {"t": "fig", "key": "sink_float_summary_table", "cap": "The four cases in one table. Denser than the liquid: sinks. Less dense than the liquid: floats."}, {"t": "h", "text": "More examples"}, {"t": "idea", "text": "Now consider an ice cube with a density of 0.9 g/cm³."}, {"t": "idea", "text": "The student drops the ice cube into water at 1.0 g/cm³."}, {"t": "idea", "text": "Ice is less dense than water, so the ice cube floats."}, {"t": "idea", "text": "Now the student drops the same ice cube into rubbing alcohol. Rubbing alcohol has a density of 0.8 g/cm³."}, {"t": "idea", "text": "Ice is denser than rubbing alcohol, so the ice cube sinks."}, {"t": "fig", "key": "ice_two_glasses", "cap": "The same ice cube, 0.9 g/cm³, in two liquids. It floats in water at 1.0 g/cm³ and sinks in rubbing alcohol at 0.8 g/cm³."}, {"t": "h", "text": "Mass does not decide"}, {"t": "idea", "text": "A huge oak log has far more mass than a tiny steel nut."}, {"t": "idea", "text": "The log, at 0.7 g/cm³, floats in water."}, {"t": "idea", "text": "The nut, at 8 g/cm³, sinks."}, {"t": "idea", "text": "Density decides, not mass."}, {"t": "fig", "key": "log_nut", "cap": "The oak log has a mass of 14,000 g and floats. The steel nut has a mass of 10 g and sinks. Density decides, not mass."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Compare the object's density with the liquid's density. An object denser than the liquid sinks. An object less dense than the liquid floats."}, {"t": "idea", "text": "Back to the bead: less dense than the water, so it floated."}, {"t": "idea", "text": "The bead is denser than the oil, so it sank."}], "script": [{"say": "A student drops a steel bolt into water, and it sinks.", "screen": "[bucket of water; bolt drops to the bottom]"}, {"say": "She drops a block of wood in, and it floats.", "screen": "[wood block bobs at the surface]"}, {"say": "Then a small plastic bead: in water, it floats.", "screen": "[bead floats; chip: FLOATS]"}, {"say": "The same bead in a bucket of cooking oil sinks.", "screen": "[second bucket, OIL; the bead drops to the bottom; chip: SINKS]"}, {"say": "Same bead, two liquids, two outcomes: what decides?", "screen": "[question mark between the buckets]"}, {"say": "Density is mass divided by volume, in grams per cubic centimeter.", "screen": "[chip: DENSITY = MASS ÷ VOLUME]"}, {"say": "Water has a density of one point zero grams per cubic centimeter.", "screen": "[label on the water: 1.0 g/cm³]"}, {"say": "Steel is eight, denser than water, so the bolt sinks.", "screen": "[label: bolt 8 g/cm³; arrow down]"}, {"say": "Wood is zero point seven, less dense than water, so the wood floats.", "screen": "[label: wood 0.7 g/cm³; arrow up]"}, {"say": "The bead is zero point nine five, less dense than water, so it floats.", "screen": "[label: bead 0.95 g/cm³; floats]"}, {"say": "Cooking oil is zero point nine two, so in oil the bead is denser, and it sinks.", "screen": "[label on the oil: 0.92 g/cm³; bead sinks]"}, {"say": "An ice cube at zero point nine floats in water but sinks in rubbing alcohol at zero point eight.", "screen": "[two glasses; ice floats in one, sinks in the other]"}, {"say": "A huge oak log floats and a tiny steel nut sinks: density decides, not mass.", "screen": "[log floating; nut on the bottom; chip: DENSITY DECIDES]"}, {"say": "So here is the rule: an object denser than the liquid sinks; an object less dense than the liquid floats.", "screen": "[rule slide reuses the two buckets; rule text]"}, {"say": "Back to the bead: less dense than the water, denser than the oil.", "screen": "[the bead in both buckets with all three densities]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "mcq", "tag": "recall", "stem": "A metal has a density of 7.9 g/cm³. What does that number tell you?", "options": ["Each cubic centimeter of the metal has a mass of 7.9 g.", "The piece of metal has a mass of 7.9 g.", "The piece of metal has a volume of 7.9 cm³."], "key": 0, "fb": ["Density is the mass packed into each cubic centimeter.", "A density is not the mass of the whole piece.", "A density is not a volume."], "why": "Density is how much mass a material packs into each cubic centimeter.<br>7.9 g/cm³ means each cubic centimeter of the metal has a mass of 7.9 g."}, {"type": "mcq", "tag": "recall", "stem": "A steel spoon is dropped into a bowl full of water. What happens to the spoon?", "options": ["The spoon sinks.", "The spoon floats."], "key": 0, "fb": ["Steel sinks in water.", "A steel spoon drops to the bottom of the bowl."], "why": "Steel sinks in water.<br>So the spoon drops to the bottom of the bowl."}, {"type": "mcq", "tag": "fluency", "fig": "sf_oak_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The oak at 0.7 g/cm³ is less dense than the water at 1.0 g/cm³.", "The oak at 0.7 g/cm³ is less dense than the water at 1.0 g/cm³, so it floats."], "why": "Compare the two densities.<br>The oak block at 0.7 g/cm³ is less dense than water at 1.0 g/cm³.<br>An object less dense than the liquid floats."}, {"type": "mcq", "tag": "fluency", "fig": "sf_marble_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 0, "fb": ["The marble at 2.5 g/cm³ is denser than the water at 1.0 g/cm³, so it sinks.", "The marble at 2.5 g/cm³ is denser than the water at 1.0 g/cm³."], "why": "Compare the two densities.<br>The glass marble at 2.5 g/cm³ is denser than water at 1.0 g/cm³.<br>An object denser than the liquid sinks."}, {"type": "mcq", "tag": "fluency", "fig": "sf_ebony_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 0, "fb": ["The ebony at 1.2 g/cm³ is denser than the water at 1.0 g/cm³, so it sinks.", "Ebony is a wood, but at 1.2 g/cm³ it is denser than water at 1.0 g/cm³."], "why": "Compare the two densities.<br>The ebony block at 1.2 g/cm³ is denser than water at 1.0 g/cm³.<br>An object denser than the liquid sinks, even a wooden one."}, {"type": "mcq", "tag": "fluency", "fig": "sf_grape_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 0, "fb": ["The grape at 1.1 g/cm³ is denser than the water at 1.0 g/cm³, so it sinks.", "The grape at 1.1 g/cm³ is denser than the water at 1.0 g/cm³."], "why": "Compare the two densities.<br>The grape at 1.1 g/cm³ is denser than water at 1.0 g/cm³.<br>An object denser than the liquid sinks."}, {"type": "mcq", "tag": "fluency", "fig": "sf_grape_saltwater", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The grape at 1.1 g/cm³ is less dense than the salt water at 1.2 g/cm³.", "The grape at 1.1 g/cm³ is less dense than the salt water at 1.2 g/cm³, so it floats."], "why": "Compare the two densities.<br>The grape at 1.1 g/cm³ is less dense than salt water at 1.2 g/cm³.<br>An object less dense than the liquid floats."}, {"type": "mcq", "tag": "fluency", "fig": "sf_candle_honey", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The candle at 0.9 g/cm³ is less dense than the honey at 1.4 g/cm³.", "The candle at 0.9 g/cm³ is less dense than the honey at 1.4 g/cm³, so it floats."], "why": "Compare the two densities.<br>The candle at 0.9 g/cm³ is less dense than honey at 1.4 g/cm³.<br>An object less dense than the liquid floats."}, {"type": "mcq", "tag": "fluency", "fig": "sf_eraser_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 0, "fb": ["The eraser at 1.2 g/cm³ is denser than the water at 1.0 g/cm³, so it sinks.", "The eraser at 1.2 g/cm³ is denser than the water at 1.0 g/cm³."], "why": "Compare the two densities.<br>The eraser at 1.2 g/cm³ is denser than water at 1.0 g/cm³.<br>An object denser than the liquid sinks."}, {"type": "mcq", "tag": "fluency", "fig": "sf_pumice_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The pumice at 0.6 g/cm³ is less dense than the water at 1.0 g/cm³.", "Pumice is a stone, but at 0.6 g/cm³ it is less dense than water at 1.0 g/cm³, so it floats."], "why": "Compare the two densities.<br>The pumice stone at 0.6 g/cm³ is less dense than water at 1.0 g/cm³.<br>An object less dense than the liquid floats, even a stone."}, {"type": "mcq", "tag": "misconception", "fig": "isla_table", "stem": "Water has a density of 1.0 g/cm³. Isla reads the table. She says: \"The log has far more mass than the pebble, so in water the log will sink and the pebble will float.\" Is Isla correct?", "options": ["yes", "no"], "key": 1, "fb": ["Density decides, not mass. The log at 0.7 g/cm³ is less dense than water and floats; the pebble at 2.7 g/cm³ sinks.", "Density decides, not mass. The log at 0.7 g/cm³ is less dense than water and floats; the pebble at 2.7 g/cm³ sinks."], "why": "Density decides sinking and floating, not mass.<br>The oak log at 0.7 g/cm³ is less dense than water at 1.0 g/cm³, so the log floats.<br>The granite pebble at 2.7 g/cm³ is denser than water, so the pebble sinks.<br>So Isla is not correct."}, {"type": "mcq", "tag": "transfer", "fig": "sf_button_honey", "stem": "A plastic button sinks in water. The button is dropped into honey instead. Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The button at 1.2 g/cm³ sank in water, but honey at 1.4 g/cm³ is denser than the button.", "The button at 1.2 g/cm³ is less dense than honey at 1.4 g/cm³, so in honey it floats."], "why": "Compare the button with the new liquid.<br>The button at 1.2 g/cm³ is less dense than honey at 1.4 g/cm³.<br>An object less dense than the liquid floats, so in honey the button floats."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "The bead floated in the water and sank in the cooking oil. Which liquid is denser than the bead?", "options": ["the water", "the cooking oil"], "key": 0, "fb": ["The bead floated in water, so the water is denser than the bead.", "The bead sank in the oil, so the oil is less dense than the bead."], "why": "An object less dense than the liquid floats.<br>The bead floated in the water, so the water is denser than the bead.<br>The bead sank in the oil, so the oil is less dense than the bead."}]}, {"id": "L05", "atom": "MAT-015", "title": "Density does not depend on how much you have", "video": "could do without a video", "lesson_type": "Concept lesson (a fact with its reason): a small sample and a large sample of one material have the same density; no term coined", "check_design": "Type (c) concept understanding → one recall typed item (L03: calculate a density) and one recall MCQ (grade 4: a chip of a tile that sinks also sinks), then the what (a silver coin and a silver tray: which is denser — the same), the why (free response with the numbers), a student-claim misconception (the tray is denser because it has more mass; key no), then transfer items (half a glass of water; a drop of honey and a jar; an iron nail and an iron anchor; an aluminum spoon and an aluminum pan) and a second claim (Grace: each half of the chalk keeps 2.5 g/cm³; key yes — the one named student whose claim is true).", "headache": ["A steel cube has a mass of 48 g and a volume of 6 cm³, so its density is 8 g/cm³.", "A student saws the cube in half.", "Each half has a mass of 24 g.", "Each half has a volume of 3 cm³.", "Is each half less dense than the whole cube?"], "forest": ["Does a small piece of a material have the same density as a big piece?", "Yes: cutting the cube in half halves the mass and halves the volume.", "24 g ÷ 3 cm³ = 8 g/cm³, the same as the whole cube.", "Density belongs to the material, not to the size of the piece.", "So a steel filing and a steel girder both have a density of 8 g/cm³."], "article": [{"t": "idea", "text": "A steel cube has a mass of 48 g and a volume of 6 cm³."}, {"t": "idea", "text": "The cube's density is 48 g ÷ 6 cm³, which equals 8 g/cm³."}, {"t": "idea", "text": "A student saws the cube in half."}, {"t": "idea", "text": "Each half has a mass of 24 g."}, {"t": "idea", "text": "Each half has a volume of 3 cm³."}, {"t": "idea", "text": "Is each half less dense than the whole cube?"}, {"t": "fig", "key": "cube_halves", "cap": "The whole steel cube, 48 g and 6 cm³, sawed into two halves of 24 g and 3 cm³ each."}, {"t": "h", "text": "Work it out"}, {"t": "idea", "text": "Density equals mass divided by volume."}, {"t": "idea", "text": "For one half: 24 g ÷ 3 cm³ equals 8 g/cm³."}, {"t": "idea", "text": "Each half has the same density as the whole cube."}, {"t": "fig", "key": "cube_halves_table", "cap": "The whole cube and one half, side by side. Half the mass, half the volume, the same density."}, {"t": "h", "text": "Why the density stayed the same"}, {"t": "idea", "text": "Cutting the cube in half halved the mass: 48 g became 24 g."}, {"t": "idea", "text": "Cutting the cube in half also halved the volume: 6 cm³ became 3 cm³."}, {"t": "idea", "text": "Half the mass shared over half the volume still gives 8 g in each cubic centimeter."}, {"t": "idea", "text": "Each cubic centimeter of steel still has a mass of 8 g, however big the piece."}, {"t": "idea", "text": "So density belongs to the material, not to the size of the piece."}, {"t": "h", "text": "Another example"}, {"t": "idea", "text": "Now consider a gold ring and a gold bar."}, {"t": "idea", "text": "The ring has a mass of 19.3 g and a volume of 1 cm³."}, {"t": "idea", "text": "The bar has a mass of 1930 g and a volume of 100 cm³."}, {"t": "idea", "text": "For the ring: 19.3 g ÷ 1 cm³ equals 19.3 g/cm³."}, {"t": "idea", "text": "For the bar: 1930 g ÷ 100 cm³ equals 19.3 g/cm³."}, {"t": "idea", "text": "The bar has 100 times the ring's mass."}, {"t": "idea", "text": "The bar also has 100 times the ring's volume."}, {"t": "idea", "text": "So the bar's density is the same as the ring's."}, {"t": "fig", "key": "ring_bar_table", "cap": "A gold ring and a gold bar. A hundred times the mass, a hundred times the volume, the same density: 19.3 g/cm³."}, {"t": "h", "text": "Every piece of a material"}, {"t": "idea", "text": "A steel filing and a steel girder both have a density of 8 g/cm³."}, {"t": "idea", "text": "A drop of water and a full bathtub of water both have a density of 1.0 g/cm³."}, {"t": "fig", "key": "filing_girder", "cap": "A steel filing and a steel girder, both 8 g/cm³. A drop of water and a bathtub of water, both 1.0 g/cm³. Very different sizes, the same density."}, {"t": "idea", "text": "So a piece's density depends on its material, not on the size of the piece."}, {"t": "h", "text": "The rule"}, {"t": "rule", "text": "Density belongs to the material, not to the size of the piece. A small sample and a large sample of the same material have the same density."}, {"t": "idea", "text": "Back to the cube: each half packs 24 g into 3 cm³, which is still 8 g/cm³."}], "script": [{"say": "A steel cube, forty-eight grams and six cubic centimeters, has a density of eight grams per cubic centimeter.", "screen": "[the cube; chips: 48 g, 6 cm³, 8 g/cm³]"}, {"say": "A student saws the cube in half.", "screen": "[saw cuts the cube; two halves]"}, {"say": "Each half is twenty-four grams and three cubic centimeters.", "screen": "[labels under each half: 24 g, 3 cm³]"}, {"say": "Is each half less dense than the whole cube?", "screen": "[question mark]"}, {"say": "Density equals mass divided by volume: twenty-four divided by three is eight.", "screen": "[worked form: 24 g ÷ 3 cm³ = 8 g/cm³]"}, {"say": "Each half has the same density as the whole cube.", "screen": "[table: whole 8 g/cm³, half 8 g/cm³]"}, {"say": "Cutting the cube in half halved the mass and halved the volume.", "screen": "[48 g → 24 g; 6 cm³ → 3 cm³]"}, {"say": "Half the mass shared over half the volume still gives eight grams in each cubic centimeter.", "screen": "[one small 1 cm cube: 8 g]"}, {"say": "So density belongs to the material, not to the size of the piece.", "screen": "[chip: DENSITY BELONGS TO THE MATERIAL]"}, {"say": "Now consider a gold ring, one cubic centimeter, and a gold bar a hundred times bigger.", "screen": "[ring: 19.3 g, 1 cm³; bar: 1930 g, 100 cm³]"}, {"say": "The bar has a hundred times the mass and a hundred times the volume, so both work out to nineteen point three grams per cubic centimeter.", "screen": "[19.3 ÷ 1 = 19.3; 1930 ÷ 100 = 19.3; ×100 on both rows]"}, {"say": "A steel filing and a steel girder are both eight grams per cubic centimeter.", "screen": "[filing and girder: 8 g/cm³]"}, {"say": "So here is the rule: a small sample and a large sample of the same material have the same density.", "screen": "[rule slide reuses the cube and its halves; rule text]"}, {"say": "Back to the cube: twenty-four grams in three cubic centimeters is still eight.", "screen": "[the two halves; 8 g/cm³]"}, {"say": "Okay, now your turn.", "screen": "[the attached question appears]"}], "quiz": [{"type": "text", "tag": "recall", "stem": "A piece of steel has a mass of 40 g and a volume of 5 cm³. What is its density, in g/cm³?", "accept": ["8 g/cm³", "8", "8 g/cm3", "8 grams per cubic centimeter"], "why": "Values: mass = 40 g, volume = 5 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 40 g ÷ 5 cm³.<br>Calculate: 40 ÷ 5 = 8.<br>Answer: density = 8 g/cm³."}, {"type": "mcq", "tag": "recall", "stem": "A whole ceramic tile sinks in water. A small chip breaks off the same tile. Does the chip sink too?", "options": ["yes", "no"], "key": 0, "fb": ["The chip is the same material as the tile, so it behaves the same way in water.", "The chip is the same material as the tile, so it sinks just like the tile."], "why": "The chip is made of the same material as the whole tile.<br>The same material behaves the same way in water.<br>So the chip sinks too."}, {"type": "mcq", "tag": "what", "fig": "pt_coin_tray", "stem": "The coin and the tray are both silver. Which is denser?", "options": ["The coin is denser.", "The tray is denser.", "The coin and the tray have the same density."], "key": 2, "fb": ["The coin has less mass and less volume, in the same ratio.", "The tray has more mass and more volume, in the same ratio.", "Both silver: 21 g ÷ 2 cm³ and 2100 g ÷ 200 cm³ both equal 10.5 g/cm³."], "why": "For the coin: 21 g ÷ 2 cm³ = 10.5 g/cm³.<br>For the tray: 2100 g ÷ 200 cm³ = 10.5 g/cm³.<br>Density belongs to the material, so the coin and the tray have the same density."}, {"type": "frq", "tag": "why", "task": "A copper pipe has a mass of 445 g and a volume of 50 cm³. A plumber cuts off a short piece of 89 g and 10 cm³. Explain why the short piece has the same density as the pipe.", "starter": "The short piece has the same density because…", "model": "The short piece has the same density because it is the same copper.<br>The whole pipe has a density of 445 g ÷ 50 cm³, which equals 8.9 g/cm³.<br>Cutting off the piece took 20% of the mass (89 g of 445 g) and 20% of the volume (10 cm³ of 50 cm³).<br>The short piece has a density of 89 g ÷ 10 cm³, which also equals 8.9 g/cm³.<br>Each cubic centimeter of copper has a mass of 8.9 g, whatever the size of the piece.", "points": ["the whole pipe's density: 445 g ÷ 50 cm³ = 8.9 g/cm³", "the piece has less mass and less volume in the same ratio (20% of each)", "the piece's density: 89 g ÷ 10 cm³ = 8.9 g/cm³, so each cubic centimeter of copper has the same mass whatever the size"]}, {"type": "mcq", "tag": "misconception", "stem": "A silver coin and a silver tray are both pure silver. Felix says: \"The tray is denser than the coin, because the tray has far more mass.\" Is Felix correct?", "options": ["yes", "no"], "key": 1, "fb": ["The tray has more mass and more volume in the same ratio, so each cubic centimeter of silver has the same mass.", "The tray has more mass and more volume in the same ratio, so each cubic centimeter of silver has the same mass."], "why": "The tray has more mass than the coin.<br>The tray also has more volume, in the same ratio.<br>So each cubic centimeter of silver has the same mass in both.<br>Density belongs to the material, so Felix is not correct."}, {"type": "text", "tag": "transfer", "stem": "A full glass of water has a density of 1.0 g/cm³. Half the water is poured away. What is the density of the water left, in g/cm³?", "accept": ["1.0 g/cm³", "1.0", "1", "1 g/cm³", "1.0 g/cm3", "1 g/cm3"], "why": "Pouring away half the water halves the mass and halves the volume.<br>Half the mass shared over half the volume gives the same mass in each cubic centimeter.<br>Density belongs to the material, so the water left is still 1.0 g/cm³."}, {"type": "mcq", "tag": "transfer", "stem": "A drop of honey and a full jar of honey come from the same bottle. Which is denser?", "options": ["The drop is denser.", "The jar of honey is denser.", "The drop and the jar of honey have the same density."], "key": 2, "fb": ["The drop has less mass and less volume in the same ratio.", "The jar has more mass and more volume in the same ratio.", "Same honey, same density, whatever the amount."], "why": "The drop and the jar are the same honey.<br>Density belongs to the material, not to the size of the sample.<br>So the drop and the jar of honey have the same density."}, {"type": "text", "tag": "transfer", "stem": "A large iron anchor has a density of 7.9 g/cm³. What is the density of a small iron nail, in g/cm³?", "accept": ["7.9 g/cm³", "7.9", "7.9 g/cm3", "7.9 grams per cubic centimeter"], "why": "The nail and the anchor are both iron.<br>Density belongs to the material, not to the size of the piece.<br>So the nail's density is also 7.9 g/cm³."}, {"type": "text", "tag": "transfer", "stem": "An aluminum spoon has a mass of 27 g and a density of 2.7 g/cm³. An aluminum pan has a mass of 270 g. What is the pan's density, in g/cm³?", "accept": ["2.7 g/cm³", "2.7", "2.7 g/cm3", "2.7 grams per cubic centimeter"], "why": "The pan has 10 times the spoon's mass, and 10 times its volume too.<br>Each cubic centimeter of aluminum still has a mass of 2.7 g.<br>So the pan's density is 2.7 g/cm³."}, {"type": "mcq", "tag": "misconception", "stem": "A stick of chalk has a density of 2.5 g/cm³. Grace snaps it in half. She says: \"Each half still has a density of 2.5 g/cm³.\" Is Grace correct?", "options": ["yes", "no"], "key": 0, "fb": ["Snapping the chalk halves the mass and the volume together, so each cubic centimeter still has a mass of 2.5 g.", "Snapping the chalk halves the mass and the volume together, so each cubic centimeter still has a mass of 2.5 g."], "why": "Snapping the chalk in half halves the mass.<br>Snapping the chalk in half also halves the volume.<br>Half the mass over half the volume gives the same mass in each cubic centimeter.<br>So each half is still 2.5 g/cm³, and Grace is correct."}], "video_question": [{"type": "mcq", "tag": "video", "stem": "Each half of the steel cube has a mass of 24 g and a volume of 3 cm³. What is the density of each half?", "options": ["4 g/cm³", "8 g/cm³", "16 g/cm³"], "key": 1, "fb": ["Halving the cube does not halve the density: 24 g ÷ 3 cm³ = 8 g/cm³.", "24 g ÷ 3 cm³ = 8 g/cm³, the same as the whole cube.", "Halving the cube does not double the density: 24 g ÷ 3 cm³ = 8 g/cm³."], "why": "Density equals mass divided by volume.<br>24 g ÷ 3 cm³ = 8 g/cm³.<br>Each half has the same density as the whole cube."}]}], "practice": [{"type": "text", "tag": "term", "atom": "MAT-008", "stem": "A solid lowered under water pushes the water aside, and the level rises by the solid's own volume. What is this pushing aside called?", "accept": ["displacement"], "why": "A solid under water pushes the water aside.<br>Pushing the water aside like this is called displacement."}, {"type": "text", "tag": "term", "atom": "MAT-009", "stem": "A ceramic mug and a foam cup are the same size, but the mug has far more mass. Ceramic packs more mass into each cubic centimeter than foam does, so ceramic has the higher…", "accept": ["density"], "why": "Ceramic packs more mass into each cubic centimeter than foam does.<br>How much mass a material packs into each cubic centimeter is called its density.<br>So ceramic has the higher density."}, {"type": "text", "tag": "term", "atom": "MAT-010", "stem": "Density is measured in grams per cubic centimeter. Write that unit the short way.", "accept": ["g/cm³", "g/cm3", "g / cm³", "g / cm3", "g per cm³", "g per cm3"], "why": "Grams per cubic centimeter is written g/cm³."}, {"type": "text", "tag": "numeric", "atom": "MAT-008", "fig": "disp_tile", "stem": "The drawing shows the water before and after a chip of tile goes under the water. What is the chip's volume, in cm³?", "accept": ["10 cm³", "10", "10 cm3", "10 cubic centimeters"], "why": "Before, the flat top of the water sits exactly on the 30 mark: 30 mL.<br>After, the flat top sits exactly on the 40 mark: 40 mL.<br>Volume of the solid equals end reading minus start reading: 40 mL − 30 mL = 10 mL, so the chip's volume is 10 cm³."}, {"type": "text", "tag": "numeric", "atom": "MAT-010", "stem": "A silver spoon has a mass of 105 g and a volume of 10 cm³. What is the density of silver, in g/cm³?", "accept": ["10.5 g/cm³", "10.5", "10.5 g/cm3", "10.5 grams per cubic centimeter"], "why": "Values: mass = 105 g, volume = 10 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 105 g ÷ 10 cm³.<br>Calculate: 105 ÷ 10 = 10.5.<br>Answer: density = 10.5 g/cm³."}, {"type": "text", "tag": "numeric", "atom": "MAT-010", "stem": "A small brass bell has a mass of 85 g. Water in a graduated cylinder reads 40 mL before the bell goes under and 50 mL after. What is the density of brass, in g/cm³?", "accept": ["8.5 g/cm³", "8.5", "8.5 g/cm3", "8.5 grams per cubic centimeter"], "why": "First the volume: 50 mL − 40 mL = 10 mL, so the bell's volume is 10 cm³.<br>Values: mass = 85 g, volume = 10 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 85 g ÷ 10 cm³.<br>Calculate: 85 ÷ 10 = 8.5.<br>Answer: density = 8.5 g/cm³."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-011", "fig": "sf_egg_water", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 0, "fb": ["The egg at 1.05 g/cm³ is denser than the water at 1.0 g/cm³, so it sinks.", "The egg at 1.05 g/cm³ is denser than the water at 1.0 g/cm³."], "why": "Compare the two densities.<br>The egg at 1.05 g/cm³ is denser than water at 1.0 g/cm³.<br>An object denser than the liquid sinks."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-011", "fig": "sf_egg_saltwater", "stem": "Sink or float?", "options": ["sinks", "floats"], "key": 1, "fb": ["The egg at 1.05 g/cm³ is less dense than the salt water at 1.1 g/cm³.", "The egg at 1.05 g/cm³ is less dense than the salt water at 1.1 g/cm³, so it floats."], "why": "Compare the two densities.<br>The egg at 1.05 g/cm³ is less dense than salt water at 1.1 g/cm³.<br>An object less dense than the liquid floats."}, {"type": "mcq", "tag": "mixed", "atom": "MAT-009", "fig": "pt_zinc_tin", "stem": "Which is denser?", "options": ["The zinc block is denser.", "The tin block is denser.", "The two blocks have the same density."], "key": 1, "fb": ["The zinc has less mass in the same volume.", "Same volume, and the tin has more mass.", "The volumes match, but the masses differ."], "why": "Both blocks have a volume of 10 cm³.<br>The tin block has more mass: 73 g against 71 g.<br>Same volume and more mass means denser, so the tin block is denser."}, {"type": "frq", "tag": "mixed", "atom": "MAT-015", "task": "A granite countertop has a mass of 2700 g and a volume of 1000 cm³. A chip knocked off it has a mass of 27 g and a volume of 10 cm³. Explain why the chip has the same density as the countertop.", "starter": "The chip has the same density because…", "model": "The chip has the same density because it is the same granite.<br>The countertop has a density of 2700 g ÷ 1000 cm³, which equals 2.7 g/cm³.<br>The chip has 1% of the mass (27 g of 2700 g) and 1% of the volume (10 cm³ of 1000 cm³).<br>The chip has a density of 27 g ÷ 10 cm³, which also equals 2.7 g/cm³.<br>Each cubic centimeter of granite has a mass of 2.7 g, whatever the size of the piece.", "points": ["the countertop's density: 2700 g ÷ 1000 cm³ = 2.7 g/cm³", "the chip has less mass and less volume in the same ratio", "the chip's density: 27 g ÷ 10 cm³ = 2.7 g/cm³, so each cubic centimeter of granite has the same mass whatever the size"]}, {"type": "mcq", "tag": "mixed", "atom": "MAT-008", "stem": "Bella lowers a key into a graduated cylinder. The water reads 50 mL before and 55 mL after. Bella says: \"The key's volume is 55 cm³.\" Is Bella correct?", "options": ["yes", "no"], "key": 1, "fb": ["The end reading alone is not the volume. Volume of the solid equals end reading minus start reading: 55 mL − 50 mL = 5 mL, so 5 cm³.", "The end reading alone is not the volume. Volume of the solid equals end reading minus start reading: 55 mL − 50 mL = 5 mL, so 5 cm³."], "why": "The 55 mL is the water and the key together.<br>Volume of the solid equals end reading minus start reading: 55 mL − 50 mL = 5 mL.<br>Each 1 mL displaced means 1 cm³ of solid, so the key's volume is 5 cm³ and Bella is not correct."}, {"type": "text", "tag": "mixed", "atom": "MAT-015", "stem": "A gold nugget has a density of 19.3 g/cm³. A gold coin is made from part of the nugget. What is the coin's density, in g/cm³?", "accept": ["19.3 g/cm³", "19.3", "19.3 g/cm3", "19.3 grams per cubic centimeter"], "why": "The coin is the same gold as the nugget.<br>Density belongs to the material, not to the size of the piece.<br>So the coin's density is also 19.3 g/cm³."}], "pp100": [{"d": "easy", "atom": "MAT-008", "stem": "A student lowers a metal door handle into a graduated cylinder of water, and the level rises by 35 mL. Which quantity has she just measured?", "options": ["the handle's mass", "the handle's density", "the volume of the water", "the handle's volume"], "key": 3, "why": "The handle pushes aside exactly its own volume of water.<br>So the rise in the water level, 35 mL, is the handle's volume: 35 cm³.<br>A balance would be needed for the mass."}, {"d": "easy", "atom": "MAT-008", "stem": "A student wants the volume of a small lumpy metal statue. Which method finds the statue's volume?", "options": ["Measure its length, its width and its height with a ruler.", "Read its mass on a balance and use that number.", "Lower it into water and read how far the level rises.", "Pour water over it and read how much runs off."], "key": 2, "why": "A lumpy shape has no lengths a ruler can use, and a balance measures mass, not volume.<br>Under water, the statue pushes aside exactly its own volume of water.<br>So the rise in the level is the statue's volume."}, {"d": "easy", "atom": "MAT-009", "stem": "To find out which of two materials is denser, which two quantities do you need?", "options": ["mass and temperature", "volume and length", "length and temperature", "mass and volume"], "key": 3, "why": "Density is how much mass a material packs into each cubic centimeter.<br>So a density is built from a mass and a volume.<br>Temperature and length play no part."}, {"d": "easy", "atom": "MAT-010", "stem": "A label on a bar of chromium reads 7.2 g/cm³. Which quantity is this?", "options": ["the bar's mass", "the bar's volume", "the amount of water the bar displaces", "the bar's density"], "key": 3, "why": "Grams per cubic centimeter is the unit of density: the mass in each cubic centimeter.<br>A mass alone would be in g.<br>A volume alone, or a displaced volume, would be in cm³."}, {"d": "easy", "atom": "MAT-011", "stem": "A wax crayon floats in water. What does this tell you about the crayon?", "options": ["The crayon is less dense than water.", "The crayon is denser than water.", "The crayon has a very small mass.", "The crayon has a bigger volume than the water it floats in."], "key": 0, "why": "An object less dense than the liquid floats.<br>The crayon floats in water, so the crayon is less dense than water.<br>Mass alone and volume alone do not decide."}, {"d": "easy", "atom": "MAT-015", "stem": "A titanium bicycle frame has a density of 4.5 g/cm³. Which of these also has a density of 4.5 g/cm³?", "options": ["a steel frame the same size", "an aluminum frame the same mass", "a titanium screw", "a wooden frame the same size"], "key": 2, "why": "Density belongs to the material, not to the size of the piece.<br>The screw is titanium too, so its density is 4.5 g/cm³.<br>Steel, aluminum and wood are different materials with different densities."}, {"d": "easy", "atom": "MAT-011", "fig": "liquids_table", "stem": "A hockey puck has a density of 1.3 g/cm³. In which of these liquids does the puck float?", "options": ["rubbing alcohol", "water", "salt water", "honey"], "key": 3, "why": "An object floats in a liquid denser than itself.<br>Only honey, at 1.4 g/cm³, is denser than the puck at 1.3 g/cm³.<br>Rubbing alcohol, water and salt water are all less dense than the puck, so the puck sinks in them."}, {"d": "easy", "atom": "MAT-008", "stem": "A student finds a stone's volume by displacement. Which of these must be true when she takes the end reading?", "options": ["The whole stone is under the water.", "Part of the stone sticks up above the water.", "The water starts exactly on the 50 mark.", "The cylinder is filled right to the top."], "key": 0, "why": "Only the part of a solid under the water pushes water aside.<br>So the whole stone must be under the water, or the rise is too small.<br>The start reading can be any mark, and the cylinder does not need to be full."}, {"d": "easy", "atom": "MAT-008", "fig": "disp_buckle", "stem": "The drawing shows the water before and after a brass buckle goes under the water. The buckle is then lifted out again. What does the cylinder read now?", "options": ["5 mL", "15 mL", "20 mL", "35 mL"], "key": 2, "why": "The buckle pushed the water up from the 20 mark to the small mark between 30 and 40, which is 35 mL.<br>Lifting the buckle out takes that space back.<br>So the water falls back to where it started: 20 mL."}, {"d": "easy", "atom": "MAT-009", "fig": "rt_medals", "stem": "The table gives the density and the volume of two medals. Which medal has more mass?", "options": ["The aluminum medal has more mass.", "The bronze medal has more mass.", "The two medals have the same mass.", "Only a balance can tell which has more mass."], "key": 1, "why": "Both medals have a volume of 15 cm³.<br>Bronze at 8.8 g/cm³ packs more mass into each cubic centimeter than aluminum at 2.7 g/cm³.<br>Same volume and denser means more mass, so the bronze medal has more mass."}, {"d": "easy", "atom": "MAT-009", "stem": "A student has two objects with different masses and different volumes. How can she find out which object is denser?", "options": ["Compare the masses: more mass is denser.", "Compare the volumes: less volume is denser.", "Calculate each density and compare.", "Put both in water and see which one sinks."], "key": 2, "why": "More mass means denser only when the volumes match.<br>Less volume means denser only when the masses match.<br>Here neither matches, so comparing cannot decide.<br>Divide each mass by its volume, and compare the two densities."}, {"d": "easy", "atom": "MAT-010", "stem": "A student records four measurements of a slate paving slab. Which of the four is the slate's density?", "options": ["27,000 g", "10,000 cm³", "2.7 g/cm³", "50 cm"], "key": 2, "why": "Density equals mass divided by volume, so its unit is grams per cubic centimeter, g/cm³.<br>27,000 g is a mass.<br>10,000 cm³ is a volume.<br>50 cm is a length.<br>2.7 g/cm³ is the density."}, {"d": "easy", "atom": "MAT-010", "stem": "A student wants to calculate the density of a lump of pyrite, a mineral called fool's gold. Which instruments does she need?", "options": ["a balance only", "a graduated cylinder only", "a balance and a graduated cylinder", "a balance, a graduated cylinder and a ruler"], "key": 2, "why": "Density equals mass divided by volume.<br>A balance gives the mass.<br>The lump has no flat sides, so a ruler cannot give its volume; a graduated cylinder gives it by displacement.<br>So she needs a balance and a graduated cylinder, and nothing else."}, {"d": "easy", "atom": "MAT-011", "stem": "A student wants to predict whether a plastic toy will sink or float in a jar of pancake syrup. Which density must she compare with the toy's density?", "options": ["the air's density", "the jar's density", "the water's density", "the syrup's density"], "key": 3, "why": "Sinking or floating depends on the liquid the object is in.<br>The toy goes into pancake syrup, not into water.<br>So the toy's density is compared with the syrup's density."}, {"d": "easy", "atom": "MAT-011", "fig": "rt_four_objects", "stem": "The table gives the density of four objects. Each one is dropped into a bowl of water. Which object floats?", "options": ["the bamboo skewer", "the cherry", "the glass gem", "the brass thumbtack"], "key": 0, "why": "An object less dense than the liquid floats.<br>Water has a density of 1.0 g/cm³.<br>Only the bamboo skewer, at 0.7 g/cm³, is less dense than water, so only the skewer floats.<br>The cherry, the gem and the thumbtack are all denser than water, so they sink."}, {"d": "easy", "atom": "MAT-015", "stem": "Density belongs to the…", "options": ["material.", "size of the piece.", "shape of the piece.", "mass of the piece."], "key": 0, "why": "Density belongs to the material, not to the size of the piece.<br>Each cubic centimeter of one material has the same mass, whatever the piece's size, shape or mass.<br>So the material decides the density."}, {"d": "easy", "atom": "MAT-015", "stem": "A wooden dowel is sawed into two equal halves. Compared with the whole dowel, each half has…", "options": ["half the mass and half the density.", "half the mass and the same density.", "the same mass and half the density.", "the same mass and the same density."], "key": 1, "why": "Sawing the dowel in half halves the material in each piece, so each half has half the mass.<br>Each half also has half the volume.<br>Half the mass over half the volume gives the same mass in each cubic centimeter, so the density is the same."}, {"d": "medium", "atom": "MAT-008", "fig": "disp_padlock", "stem": "The drawing shows the water in a graduated cylinder before and after a padlock goes under the water. What is the padlock's volume?", "options": ["25 cm³", "35 cm³", "60 cm³", "85 cm³"], "key": 1, "why": "Before, the flat top of the water sits on the small mark between 20 and 30, which is 25 mL; after, exactly on the 60 mark.<br>Volume of the solid equals end reading minus start reading: 60 mL − 25 mL = 35 mL, so the padlock's volume is 35 cm³."}, {"d": "medium", "atom": "MAT-009", "fig": "three_same_volume_table", "stem": "Three metal cubes have the same volume. Which cube is the densest?", "options": ["the aluminum cube", "the iron cube", "the copper cube", "All three cubes have the same density."], "key": 2, "why": "All three cubes have a volume of 5 cm³.<br>Same volume and more mass means denser.<br>The copper cube has the most mass, 44.5 g, so the copper cube is the densest."}, {"d": "medium", "atom": "MAT-009", "stem": "A white loaf and a rye loaf both read 500 g on a balance. The rye loaf is much smaller than the white loaf. Which loaf is denser?", "options": ["the white loaf", "the rye loaf", "neither: the same mass means the same density", "the one that feels softer"], "key": 1, "why": "Both loaves have a mass of 500 g.<br>The rye loaf is much smaller, so the rye loaf has the smaller volume.<br>Same mass and less volume means denser, so the rye loaf is denser."}, {"d": "medium", "atom": "MAT-010", "fig": "lab_record_table", "stem": "A card from the lab gives the mass and the volume of a rubber doorstop. What is the density of the doorstop?", "options": ["0.8 g/cm³", "1.25 g/cm³", "30 g/cm³", "18,000 g/cm³"], "key": 1, "why": "Density = mass ÷ volume.<br>150 g ÷ 120 cm³ = 1.25, so the density is 1.25 g/cm³.<br>Dividing the other way gives 0.8; subtracting gives 30; multiplying gives 18,000, and none of those is a density."}, {"d": "medium", "atom": "MAT-010", "stem": "Concrete has a density of 2.4 g/cm³. Which of these could be a piece of concrete?", "options": ["2.4 g with a volume of 24 cm³", "12 g with a volume of 24 cm³", "24 g with a volume of 24 cm³", "24 g with a volume of 10 cm³"], "key": 3, "why": "Density = mass ÷ volume.<br>24 g ÷ 10 cm³ = 2.4 g/cm³, which matches concrete.<br>The other three give 0.1, 0.5 and 1 g/cm³."}, {"d": "medium", "atom": "MAT-011", "stem": "A domino sinks in salt water, which has a density of 1.2 g/cm³, but floats in honey, which has a density of 1.4 g/cm³. Which could be the domino's density?", "options": ["1.0 g/cm³", "1.3 g/cm³", "1.5 g/cm³", "2.0 g/cm³"], "key": 1, "why": "The domino sinks in salt water, so the domino is denser than 1.2 g/cm³.<br>The domino floats in honey, so the domino is less dense than 1.4 g/cm³.<br>Only 1.3 g/cm³ lies between the two."}, {"d": "medium", "atom": "MAT-015", "stem": "A cedar toothpick has the same density as a cedar fence post. Why?", "options": ["Each cubic centimeter of cedar has the same mass, toothpick or post.", "The toothpick has less mass, so it makes up for its smaller volume.", "Cedar is a wood, and every wood has the same density as every other.", "The toothpick and the post take up the same amount of space."], "key": 0, "why": "The post has more mass and more volume than the toothpick, in the same ratio.<br>So each cubic centimeter of cedar has the same mass in both.<br>Density belongs to the material, not to the size of the piece."}, {"d": "medium", "atom": "MAT-015", "stem": "A chocolate bar has a mass of 130 g and a volume of 100 cm³. It is snapped into two equal halves. What is the density of one half?", "options": ["0.65 g/cm³", "1.3 g/cm³", "2.6 g/cm³", "65 g/cm³"], "key": 1, "why": "The whole bar: 130 g ÷ 100 cm³ = 1.3 g/cm³.<br>One half has 65 g in 50 cm³: 65 g ÷ 50 cm³ = 1.3 g/cm³.<br>Halving the mass and the volume together leaves the density unchanged."}, {"d": "medium", "atom": "MAT-008", "fig": "cyl_before_crystal", "stem": "The drawing shows the water in a graduated cylinder. A quartz crystal with a volume of 20 cm³ is lowered in, and the whole crystal goes under. What does the cylinder read now?", "options": ["10 mL", "20 mL", "30 mL", "50 mL"], "key": 3, "why": "The flat top of the water sits exactly on the 30 mark: 30 mL.<br>The crystal pushes aside exactly its own volume of water, 20 cm³, which is 20 mL.<br>So the water rises by 20 mL, from 30 mL to 50 mL."}, {"d": "medium", "atom": "MAT-008", "fig": "rt_coral_sparkplug", "stem": "The table gives the water readings before and after a piece of coral went under, and before and after a spark plug went under. How much larger is the coral's volume than the spark plug's?", "options": ["5 cm³", "15 cm³", "20 cm³", "55 cm³"], "key": 1, "why": "Volume of the solid equals end reading minus start reading.<br>Coral: 55 mL − 20 mL = 35 mL, so 35 cm³.<br>Spark plug: 60 mL − 40 mL = 20 mL, so 20 cm³.<br>35 cm³ − 20 cm³ = 15 cm³, so the coral's volume is 15 cm³ larger."}, {"d": "medium", "atom": "MAT-009", "fig": "rt_openers", "stem": "Two bottle openers each went under the water in a graduated cylinder. The table gives each one's mass and how far it made the water rise. Which opener is denser?", "options": ["The steel opener is denser.", "The plastic opener is denser.", "Both openers have the same density.", "The table cannot tell you which is denser."], "key": 0, "why": "Each opener made the water rise by 10 mL, so each has a volume of 10 cm³.<br>The volumes match.<br>The steel opener has more mass: 80 g against 12 g.<br>Same volume and more mass means denser, so the steel opener is denser."}, {"d": "medium", "atom": "MAT-009", "stem": "A steel ladle and a plastic ladle are exactly the same size. The steel ladle has far more mass. Which property of steel explains this?", "options": ["Steel is denser than plastic.", "Steel is harder than plastic.", "Steel is colder than plastic.", "Steel conducts heat better than plastic."], "key": 0, "why": "The two ladles have the same volume.<br>Steel packs more mass into each cubic centimeter than plastic does.<br>How much mass a material packs into each cubic centimeter is its density, so steel is denser than plastic.<br>Hardness, coldness and conducting heat do not set the mass."}, {"d": "medium", "atom": "MAT-010", "fig": "rt_metals", "stem": "A small metal figurine has a mass of 79 g and a volume of 10 cm³. The table gives the density of four metals. Which metal is the figurine made of?", "options": ["aluminum", "iron", "copper", "silver"], "key": 1, "why": "Values: mass = 79 g, volume = 10 cm³.<br>Equation: density = mass ÷ volume.<br>Substitute: density = 79 g ÷ 10 cm³.<br>Calculate: 79 ÷ 10 = 7.9.<br>Answer: density = 7.9 g/cm³, which matches iron in the table."}, {"d": "medium", "atom": "MAT-010", "fig": "disp_agate", "stem": "The drawing shows the water before and after an agate stone goes under the water. The stone has a mass of 52 g. Which line substitutes the values correctly into density = mass ÷ volume?", "options": ["density = 52 g ÷ 20 cm³", "density = 52 g ÷ 55 cm³", "density = 52 g ÷ 35 cm³", "density = 20 cm³ ÷ 52 g"], "key": 0, "why": "Before, the flat top sits on the small mark between 30 and 40: 35 mL. After, on the small mark between 50 and 60: 55 mL.<br>Volume of the solid equals end reading minus start reading: 55 mL − 35 mL = 20 mL, so 20 cm³.<br>Mass ÷ volume: density = 52 g ÷ 20 cm³."}, {"d": "medium", "atom": "MAT-011", "stem": "A rubber duck with a density of 0.6 g/cm³ floats in a bathtub of water with a density of 1.0 g/cm³. The duck is moved to a small bucket of the same water. Does the duck float in the bucket, and why?", "options": ["It sinks: a small bucket holds too little water to hold the duck up.", "It sinks: the duck has more mass than the water in the bucket.", "It floats: bucket water and bath water have the same density.", "It floats only if the bucket is filled right to the top."], "key": 2, "why": "Sinking or floating depends on the two densities, not on how much liquid there is.<br>The water in the bucket is the same water, so its density is still 1.0 g/cm³.<br>The duck at 0.6 g/cm³ is less dense than the water, so the duck floats in the bucket too."}, {"d": "medium", "atom": "MAT-011", "fig": "rt_three_liquids", "stem": "Three liquids are poured into one tall glass and left to settle into layers. The table gives their densities. Which liquid forms the bottom layer?", "options": ["the canola oil", "the water", "the corn syrup", "The three liquids mix into one layer."], "key": 2, "why": "A liquid denser than the liquid around it sinks, just as a solid does.<br>Corn syrup at 1.4 g/cm³ is denser than water at 1.0 g/cm³ and than canola oil
