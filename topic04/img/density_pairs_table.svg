<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 186" width="100%" role="img" aria-label="A table of the two pairs: the steel block and oak block share a volume of 50 cm³ and the steel has more mass; the steel ball and glass ball share a mass of 40 g and the steel has less volume. A table. Header: object | mass | volume | denser?. Row: steel block | 400 g | 50 cm³ | denser. Row: oak block | 35 g | 50 cm³ | . Row: steel ball | 40 g | 5 cm³ | denser. Row: glass ball | 40 g | 16 cm³ | . Note under the table: Same volume, more mass: denser. Same mass, less volume: denser." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="186" fill="#ffffff"/><rect x="20" y="10" width="460" height="28" fill="#f1f1f1" stroke="#222"/><text x="85.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">object</text><text x="205.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">mass</text><text x="315.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">volume</text><text x="425.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">denser?</text><rect x="20" y="38" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel block</text><text x="205.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">400 g</text><text x="315.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">50 cm³</text><text x="425.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">denser</text><rect x="20" y="66" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oak block</text><text x="205.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">35 g</text><text x="315.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">50 cm³</text><text x="425.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222"></text><rect x="20" y="94" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel ball</text><text x="205.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 g</text><text x="315.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">5 cm³</text><text x="425.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">denser</text><rect x="20" y="122" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="85.0" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">glass ball</text><text x="205.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 g</text><text x="315.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">16 cm³</text><text x="425.0" y="141" text-anchor="middle" font-size="13" font-weight="normal" fill="#222"></text><line x1="150" y1="10" x2="150" y2="150" stroke="#222"/><line x1="260" y1="10" x2="260" y2="150" stroke="#222"/><line x1="370" y1="10" x2="370" y2="150" stroke="#222"/><text x="250.0" y="168" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Same volume, more mass: denser. Same mass, less volume: denser.</text><!--blind: A table. Header: object | mass | volume | denser?. Row: steel block | 400 g | 50 cm³ | denser. Row: oak block | 35 g | 50 cm³ | . Row: steel ball | 40 g | 5 cm³ | denser. Row: glass ball | 40 g | 16 cm³ | . Note under the table: Same volume, more mass: denser. Same mass, less volume: denser.--></svg>