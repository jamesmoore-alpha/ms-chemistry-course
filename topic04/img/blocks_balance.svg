<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 240" width="100%" role="img" aria-label="Two balances: a steel block of 50 cm³ reads 400 g; an oak block of the same size, 50 cm³, reads 35 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="240" fill="#ffffff"/><rect x="40" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="80" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">400 g</text><rect x="80" y="106" width="70" height="44" fill="#555" stroke="#222" stroke-width="1.5"/><text x="115" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel block, 50 cm³</text><rect x="320" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="320" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="360" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="395" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">35 g</text><rect x="360" y="106" width="70" height="44" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><path d="M 366 116 q 29 6 58 0" fill="none" stroke="#222"/><path d="M 366 128 q 29 6 58 0" fill="none" stroke="#222"/><path d="M 366 140 q 29 6 58 0" fill="none" stroke="#222"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">oak block, 50 cm³</text><text x="255" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Two blocks exactly the same size.</text><text x="255" y="48" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The steel block has far more mass.</text></svg>