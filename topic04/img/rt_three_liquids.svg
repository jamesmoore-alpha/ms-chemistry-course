<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 138" width="100%" role="img" aria-label="A table giving the density of three liquids: corn syrup, water and canola oil. A table. Header: liquid | density. Row: corn syrup | 1.4 g/cm³. Row: water | 1.0 g/cm³. Row: canola oil | 0.92 g/cm³." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="380" height="138" fill="#ffffff"/><rect x="20" y="10" width="340" height="28" fill="#f1f1f1" stroke="#222"/><text x="115.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">liquid</text><text x="285.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">density</text><rect x="20" y="38" width="340" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">corn syrup</text><text x="285.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1.4 g/cm³</text><rect x="20" y="66" width="340" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="285.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1.0 g/cm³</text><rect x="20" y="94" width="340" height="28" fill="#ffffff" stroke="#222"/><text x="115.0" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">canola oil</text><text x="285.0" y="113" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">0.92 g/cm³</text><line x1="210" y1="10" x2="210" y2="122" stroke="#222"/><!--blind: A table. Header: liquid | density. Row: corn syrup | 1.4 g/cm³. Row: water | 1.0 g/cm³. Row: canola oil | 0.92 g/cm³.--></svg>