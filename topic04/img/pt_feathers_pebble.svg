<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 110" width="100%" role="img" aria-label="A table giving the mass and the volume of a bag of feathers and of a granite pebble. A table. Header: (blank) | a bag of feathers | a granite pebble. Row: mass | 300 g | 135 g. Row: volume | 30,000 cm³ | 50 cm³." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="110" fill="#ffffff"/><rect x="20" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="65.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="195.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a bag of feathers</text><text x="365.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a granite pebble</text><rect x="20" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">mass</text><text x="195.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">300 g</text><text x="365.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">135 g</text><rect x="20" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">volume</text><text x="195.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">30,000 cm³</text><text x="365.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">50 cm³</text><line x1="110" y1="10" x2="110" y2="94" stroke="#222"/><line x1="280" y1="10" x2="280" y2="94" stroke="#222"/><!--blind: A table. Header: (blank) | a bag of feathers | a granite pebble. Row: mass | 300 g | 135 g. Row: volume | 30,000 cm³ | 50 cm³.--></svg>