<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" role="img" aria-label="A table giving the mass of a steel bottle opener and of a plastic bottle opener, and how far each made the water rise. A table. Header: (blank) | a steel bottle opener | a plastic bottle opener. Row: mass | 80 g | 12 g. Row: water rise | 10 mL | 10 mL." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="500" height="110" fill="#ffffff"/><rect x="20" y="10" width="460" height="28" fill="#f1f1f1" stroke="#222"/><text x="70.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="210.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a steel bottle opener</text><text x="390.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a plastic bottle opener</text><rect x="20" y="38" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="70.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">mass</text><text x="210.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">80 g</text><text x="390.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">12 g</text><rect x="20" y="66" width="460" height="28" fill="#ffffff" stroke="#222"/><text x="70.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water rise</text><text x="210.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10 mL</text><text x="390.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">10 mL</text><line x1="120" y1="10" x2="120" y2="94" stroke="#222"/><line x1="300" y1="10" x2="300" y2="94" stroke="#222"/><!--blind: A table. Header: (blank) | a steel bottle opener | a plastic bottle opener. Row: mass | 80 g | 12 g. Row: water rise | 10 mL | 10 mL.--></svg>