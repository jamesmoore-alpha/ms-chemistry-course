<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 110" width="100%" role="img" aria-label="A table giving the density and the volume of a bronze medal and of an aluminum medal. A table. Header: (blank) | a bronze medal | an aluminum medal. Row: density | 8.8 g/cm³ | 2.7 g/cm³. Row: volume | 15 cm³ | 15 cm³." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="110" fill="#ffffff"/><rect x="20" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="65.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="195.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a bronze medal</text><text x="365.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">an aluminum medal</text><rect x="20" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">density</text><text x="195.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">8.8 g/cm³</text><text x="365.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">2.7 g/cm³</text><rect x="20" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">volume</text><text x="195.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">15 cm³</text><text x="365.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">15 cm³</text><line x1="110" y1="10" x2="110" y2="94" stroke="#222"/><line x1="280" y1="10" x2="280" y2="94" stroke="#222"/><!--blind: A table. Header: (blank) | a bronze medal | an aluminum medal. Row: density | 8.8 g/cm³ | 2.7 g/cm³. Row: volume | 15 cm³ | 15 cm³.--></svg>