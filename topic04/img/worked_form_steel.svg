<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215" width="100%" role="img" aria-label="The worked form for the steel cube in five lines: values mass 48 g and volume 6 cm³; equation density = mass ÷ volume; substitute 48 g ÷ 6 cm³; calculate 48 ÷ 6 = 8; answer 8 g/cm³" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="420" height="215" fill="#ffffff"/><text x="30" y="26" text-anchor="start" font-size="14" font-weight="bold" fill="#222">The density of the steel cube</text><text x="30" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Values</text><text x="140" y="56" text-anchor="start" font-size="14" font-weight="normal" fill="#222">mass = 48 g, volume = 6 cm³</text><text x="30" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Equation</text><text x="140" y="86" text-anchor="start" font-size="14" font-weight="normal" fill="#222">density = mass ÷ volume</text><text x="30" y="116" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Substitute</text><text x="140" y="116" text-anchor="start" font-size="14" font-weight="normal" fill="#222">density = 48 g ÷ 6 cm³</text><text x="30" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Calculate</text><text x="140" y="146" text-anchor="start" font-size="14" font-weight="normal" fill="#222">48 ÷ 6 = 8</text><text x="30" y="176" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Answer</text><text x="140" y="176" text-anchor="start" font-size="14" font-weight="normal" fill="#222">density = 8 g/cm³</text></svg>