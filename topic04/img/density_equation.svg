<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 140" width="100%" role="img" aria-label="The equation density = mass ÷ volume, with each term labelled beneath: density in g/cm³, the mass in each cm³; mass in g, how much material; volume in cm³, how much space" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="140" fill="#ffffff"/><text x="105" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">density</text><text x="183" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">=</text><text x="250" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">mass</text><text x="310" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">÷</text><text x="378" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">volume</text><line x1="105" y1="70" x2="105" y2="95" stroke="#222"/><text x="105" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in g/cm³</text><text x="105" y="126" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the mass in each cm³</text><line x1="250" y1="70" x2="250" y2="95" stroke="#222"/><text x="250" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in g</text><text x="250" y="126" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">how much material</text><line x1="378" y1="70" x2="378" y2="95" stroke="#222"/><text x="378" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">in cm³</text><text x="378" y="126" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">how much space</text></svg>