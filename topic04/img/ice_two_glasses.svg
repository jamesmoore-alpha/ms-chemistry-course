<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" role="img" aria-label="Two glasses: the same ice cube at 0.9 g/cm³ floats at the top of water at 1.0 g/cm³ and sits at the bottom of rubbing alcohol at 0.8 g/cm³" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="360" height="240" fill="#ffffff"/><path d="M 40 50 L 50 190 L 130 190 L 140 50" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="42,75 138,75 129,189 51,189" fill="#d9d9d9"/><line x1="42" y1="75" x2="138" y2="75" stroke="#222"/><rect x="76" y="71" width="28" height="22" fill="#ffffff" stroke="#222"/><text x="90" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">water</text><text x="90" y="228" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1.0 g/cm³</text><text x="90" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ice, 0.9 g/cm³: floats</text><path d="M 220 50 L 230 190 L 310 190 L 320 50" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="222,75 318,75 309,189 231,189" fill="#d9d9d9"/><line x1="222" y1="75" x2="318" y2="75" stroke="#222"/><rect x="256" y="166" width="28" height="22" fill="#ffffff" stroke="#222"/><text x="270" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">rubbing alcohol</text><text x="270" y="228" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">0.8 g/cm³</text><text x="270" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ice, 0.9 g/cm³: sinks</text></svg>