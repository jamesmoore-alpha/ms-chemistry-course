<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 240" width="100%" role="img" aria-label="Two balances: a small steel ball of 5 cm³ reads 40 g; a bigger glass ball of 16 cm³ also reads 40 g" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="510" height="240" fill="#ffffff"/><rect x="40" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="40" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="80" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">40 g</text><circle cx="115" cy="137" r="13" fill="#555" stroke="#222" stroke-width="1.5"/><text x="115" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">steel ball, 5 cm³</text><rect x="320" y="150" width="150" height="10" fill="#d9d9d9" stroke="#222"/><rect x="320" y="160" width="150" height="40" rx="4" fill="#f1f1f1" stroke="#222"/><rect x="360" y="170" width="70" height="20" fill="#ffffff" stroke="#222"/><text x="395" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">40 g</text><circle cx="395" cy="130" r="20" fill="#ffffff" stroke="#222" stroke-width="1.5"/><text x="395" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">glass ball, 16 cm³</text><text x="255" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Two balls with the same mass.</text><text x="255" y="48" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">The steel ball takes up far less space.</text></svg>