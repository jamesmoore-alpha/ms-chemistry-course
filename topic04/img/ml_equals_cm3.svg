<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 235" width="100%" role="img" aria-label="A cube 1 cm on each side, an equals sign, and a small glass holding 1 mL of water: the 1 mL of water fills the 1 cm cube exactly, so 1 mL and 1 cm³ are the same volume" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="380" height="235" fill="#ffffff"/><rect x="60" y="80" width="70" height="70" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><polygon points="60,80 85,55 155,55 130,80" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><polygon points="130,80 155,55 155,125 130,150" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="95" y="172" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 cm</text><text x="40" y="118" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 cm</text><text x="150" y="47" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">1 cm</text><text x="108" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a cube 1 cm on each side</text><text x="108" y="218" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">its volume is 1 cm³</text><text x="200" y="118" text-anchor="middle" font-size="30" font-weight="bold" fill="#222">=</text><path d="M 250 60 L 258 150 L 312 150 L 320 60" fill="none" stroke="#222" stroke-width="1.5"/><polygon points="255,90 315,90 312,150 258,150" fill="#d9d9d9"/><line x1="255" y1="90" x2="315" y2="90" stroke="#222"/><text x="285" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1 mL of water</text><text x="285" y="218" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">it fills the cube exactly</text></svg>