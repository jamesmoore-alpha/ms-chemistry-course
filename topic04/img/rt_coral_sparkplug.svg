<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 110" width="100%" role="img" aria-label="A table giving the water reading before and after a piece of coral went under, and before and after a spark plug went under. A table. Header: (blank) | a piece of coral | a spark plug. Row: before | 20 mL | 40 mL. Row: after | 55 mL | 60 mL." font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222"><rect width="470" height="110" fill="#ffffff"/><rect x="20" y="10" width="430" height="28" fill="#f1f1f1" stroke="#222"/><text x="65.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222"></text><text x="195.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a piece of coral</text><text x="365.0" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">a spark plug</text><rect x="20" y="38" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">before</text><text x="195.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">20 mL</text><text x="365.0" y="57" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">40 mL</text><rect x="20" y="66" width="430" height="28" fill="#ffffff" stroke="#222"/><text x="65.0" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">after</text><text x="195.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">55 mL</text><text x="365.0" y="85" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">60 mL</text><line x1="110" y1="10" x2="110" y2="94" stroke="#222"/><line x1="280" y1="10" x2="280" y2="94" stroke="#222"/><!--blind: A table. Header: (blank) | a piece of coral | a spark plug. Row: before | 20 mL | 40 mL. Row: after | 55 mL | 60 mL.--></svg>